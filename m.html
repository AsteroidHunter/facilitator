// a confirmed new card: drawn from the answer, which carries the card, rather
// than from a reading a tick later. a card this page asked for is named now;
// one asked for before a reload or a sleep is shown and left named as it is
function landCreate(op, result){
  drawCreatePending();
  if (!result.id) return;
  if (Number.isSafeInteger(result.rev)){
    createRevFloor = createRevFloor == null ? result.rev : Math.max(createRevFloor, result.rev);
  }
  if (result.card && lastState && !lastState.boxes.some(b => b.id === result.card.id)){
    let at = -1;
    lastState.boxes.forEach((b, i) => { if (b.bucket === "meta" && b.owner === result.card.owner) at = i; });
    lastState.boxes.splice(at + 1, 0, result.card);
  }
  if (op.fresh){ pendingFocus = result.id; closeDrawer(); }
  else { selectedId = result.id; localStorage.setItem("selbox", result.id); }
  if (lastState && lastState.boxes.some(b => b.id === result.id)) apply(lastState);
}
// the words of a message the board refused, or could not be reached for, go
// back in the typing row; after what is already there, never over it
function takeBack(op){
  ops = ops.filter(o => o !== op);
  saveOps();
  const el = els[op.box];
  if (!el) return;
  el.ta.value = el.ta.value.trim() ? el.ta.value.trimEnd() + "\n\n" + op.text : op.text;
  el.tick();
  drawSent(el, op.box);
  // taking one back makes room: a send held for want of it may go now
  if (el.meta.textContent.indexOf("send held") === 0 && ops.length < OPS_MAX) el.meta.textContent = "";
}
// an operation's state changed: the line under its message says so. the panel
// keeps the message's block and changes only its dress and its line
function drawOpState(op){
  if (op.kind === "create"){ drawCreatePending(); return; }
  const el = els[op.box];
  if (el) drawSent(el, op.box);
}
function drawCreatePending(){
  const plus = document.getElementById("tikadd");
  const making = !!pendingCreate();
  plus.classList.toggle("pending", making);
  plus.setAttribute("aria-busy", making ? "true" : "false");
  plus.title = making ? "making the card" : "new card";
}
function drawerNote(text){
  const tik = document.getElementById("tiklist");
  const note = h("div", "tiknote", text);
  tik.prepend(note);
  setTimeout(() => note.remove(), 6000);
  // the plus is on the row now, pressed with the drawer shut, so the note is
  // said in the one-line toast as well while the drawer is not out
  if (!drawerOpen()) toastNote(text);
}
let noteToastTimer = null;
function toastNote(text){
  const toast = document.getElementById("diagnostictoast");
  toast.textContent = text;
  clearTimeout(noteToastTimer);
  noteToastTimer = setTimeout(() => { if (toast.textContent === text) toast.textContent = ""; }, 6000);
}

// ---- sending and making ------------------------------------------------------------
// the tap is answered on the tap: the message lands in the sent panel now, marked
// as on its way, and the operation loop behind it sees it home. the desktop
// draws its message faded too, for as long as the server takes to answer, which
// on the same machine is a millisecond; here that wait can be a second of
// nothing happening under a finger
function doSend(id, opts){
  opts = opts || {};
  const trace = tracePhone("begin", "send", { box: id });
  const el = els[id];
  const typed = el.ta.value.trim();
  if (!typed && !traySendable(el)){ endPhoneTrace(trace); return; }
  // a file still on its way holds the send: the words stay in the row and go
  // with their files the moment the last one lands (trayLanded)
  if (trayBusy(el)){ trayHoldSend(id, opts); endPhoneTrace(trace); return; }
  const text = trayMessage(el, typed);
  if (!text){ endPhoneTrace(trace); return; }
  const reopen = boxDone(id);
  const op = mintOp("send", { box: id, text, reopen });
  if (!op){
    // the store is full: the words stay in the row, and the card says why.
    // this clears on its own once a reading finds room again
    el.meta.textContent = "send held: fifty messages are still unconfirmed on this phone; wait for the board, or take some back";
    endPhoneTrace(trace, { outcome: "failed" });
    return;
  }
  tracePhone("note", "operation", { op: op.id, box: id, outcome: "minted" });
  op.advance = opts.advance !== false;
  el.ta.value = "";
  trayTake(el);       // the files that went leave the tray with the words
  el.tick();          // the square goes with the words, and the row falls back to one line
  // an arrival: the panel comes in, or the message comes into it, cut to its preview
  drawSent(el, id, true);
  if (hist && hist.id === id) histExit(id);   // a send lands you back on the live reply
  runOps(laneOf(op));
  endPhoneTrace(trace, { op: op.id, box: id }, null, true);
  return op;
}
// one press, one card. a press while the card is still being made is the same
// press: it wakes the try rather than minting another card, and the plus
// breathes until the board answers. once the card is there the next press is
// a deliberate second card
function createCard(){
  const trace = tracePhone("begin", "create");
  if (!validOwners.has(activeOwner)){ endPhoneTrace(trace); return; }
  if (pendingCreate()){ wakeOps(); endPhoneTrace(trace); return; }
  const op = mintOp("create", { owner: activeOwner });
  if (!op){ drawerNote("No card can be made while fifty messages are still unconfirmed on this phone"); endPhoneTrace(trace, { outcome: "failed" }); return; }
  tracePhone("note", "operation", { op: op.id, outcome: "minted" });
  // pendingCreate above proves only one create can be live. Clear any record
  // left by an already-dead exceptional path before installing that one.
  createDiagnostics.clear();
  createDiagnostics.set(op.id, {
    response: tracePhone("begin", "stage", { stage: "create-response", op: op.id })
  });
  op.fresh = true;
  drawCreatePending();
  runOps("create");
  endPhoneTrace(trace, { op: op.id });
}

// older replies: histList, histExit and histStep are shared with the desktop in
// card-logic.js

// Older servers omit olderReplies from the phone state. Ask for the selected
// card's actual history once per revision of its replies, including notes.
function syncPhoneHistory(b){
  const el = b && els[b.id];
  if (!el) return;
  if (el.historyVersion !== b.replies){
    el.historyVersion = b.replies;
    el.historyRequest = null;
    el.historyCount = null;
    delete histCache[b.id];
    if (hist && hist.id === b.id) histExit(b.id);
  }
  if (Number.isFinite(b.olderReplies)) el.historyCount = b.olderReplies;
  el.box.classList.toggle("hashist", (el.historyCount || 0) > 0);
  if (el.historyCount !== null || el.historyRequest || b.id !== selectedId) return;
  const request = histList(b.id);
  el.historyRequest = request;
  request.then(list => {
    if (els[b.id] !== el || el.historyRequest !== request) return;
    el.historyRequest = null;
    if (list === HIST_UNKNOWN) return; // An unchanged successful poll can retry.
    el.historyCount = list.length;
    el.box.classList.toggle("hashist", list.length > 0);
  });
}

function syncSelectedHistory(){
  syncPhoneHistory(lastState?.boxes.find(b => b.id === selectedId));
}

// ---- the typing editor, on the cards in reach -------------------------------------
// Every card keeps its typing row and the row keeps its words, but only the
// card on show and the two a swipe or a card key brings in next wear the
// editor. An editor on each of several hundred cards was most of the time the
// page took to open and much of its weight after that. The card on show is
// given its editor in select, in the same turn and before it is drawn, so the
// first tap and the first key land in the row as they always have. Its two
// neighbours are given theirs once the switch has been drawn, and a card that
// has left the reach takes its editor off; its words, caret and undo stay with
// the row (ComposeFormat want). A row still holding the caret keeps its editor
// until a later pass finds it let go.
// With a row focused, the phone is still deciding for a moment after a switch
// whether to scroll the page to the caret, and the focus blink that stops that
// scroll holds only on a page that is not busy, so the neighbours wait until
// that moment has passed.
const REACH_TYPING_MS = 250;
const editorsWorn = new Set();   // the cards this page has asked to wear the editor
let reachTimer = null, reachAsk = 0;
function wearEditor(id){
  const el = els[id];
  if (!el) return;
  editorsWorn.add(id);
  const was = el.field.formatted();
  if (el.field.want(true) && !was) el.tick();
}
function editorReach(){
  const reach = new Set();
  if (!selectedId || !els[selectedId]) return reach;
  reach.add(selectedId);
  for (const dir of [-1, 1]){
    const pick = lastState && cardStepTarget(dir);
    if (pick && els[pick.id]) reach.add(pick.id);
  }
  return reach;
}
function reachEditors(){
  clearTimeout(reachTimer); reachTimer = null;
  const reach = editorReach();
  for (const id of reach) wearEditor(id);
  for (const id of [...editorsWorn]){
    if (reach.has(id)) continue;
    const el = els[id];
    if (!el){ editorsWorn.delete(id); continue; }
    if (el.field.focused()) continue;
    el.field.want(false);
    editorsWorn.delete(id);
  }
}
function reachLater(){
  clearTimeout(reachTimer); reachTimer = null;
  const asked = ++reachAsk;
  if (editing()){ reachTimer = setTimeout(reachEditors, REACH_TYPING_MS); return; }
  requestAnimationFrame(() => { if (asked === reachAsk) reachTimer = setTimeout(reachEditors, 0); });
}

// ---- selection and tabs ----------------------------------------------------------
// browsing: the card on screen was reached without being chosen, by a swipe,
// the keys, a tab, a load or a fallback pick. selectedId still names it, so
// every key that acts on the card acts on it, but it is not selected: it sits
// level with the page instead of wearing the drop shadow, and nothing on it
// counts as read. a tap on it or into it, or Enter, selects it; Escape puts
// it back
function setBrowsing(on){
  browsing = on;
  document.body.classList.toggle("browsing", on);
}

// a tap on a drawer row, a card just made, the caret carried along by a step:
// the card is shown and selected, and so read. opts.browse shows it without
// selecting it (browse, below). the hop a close or a snooze makes to the next
// card shows it browsed, since the board picked that card and the reader did not
function select(id, opts){
  const trace = tracePhone("begin", "select", { box: id });
  if (!els[id]){ endPhoneTrace(trace, { box: id }); return; }
  const chosen = !opts?.browse && !opts?.hop;
  cancelAutoNext();
  if (hist && hist.id !== id) histExit(hist.id);
  selectedId = id; shownId = id; localStorage.setItem("selbox", id);
  setBrowsing(!chosen);
  // a chosen card is read, but not while the home page covers it
  if (chosen && !homeOpen) markSeen(id);
  const b = lastState?.boxes.find(x => x.id === id);
  if (b) lastSel[b.owner] = id;
  syncPhoneHistory(b);
  wearEditor(id);
  for (const k of Object.keys(els)) els[k].box.classList.toggle("sel", k === id);
  openAtHead(els[id]);
  document.getElementById("pane").classList.remove("blank");
  for (const r of document.querySelectorAll("#tiklist .trow")){
    r.classList.toggle("on", r.dataset.id === id);
    if (chosen && r.dataset.id === id && r.classList.contains("yours") && !homeOpen) r.classList.add("seen");
  }
  if (lastState) renderTabs(lastState);
  reachLater();
  endPhoneTrace(trace, { box: id }, null, true);
}
// a swipe, the keys and a tab: the card is shown and nothing is selected or
// read. the card already on screen and selected stays so: a lane of one card,
// or a tab's own tap, has nowhere else to go
function browse(id){
  if (id === shownId && !browsing) return;
  select(id, { browse: true });
}
// the browsed card on screen becomes the selected one where it stands: nothing
// on it moves, it takes the drop shadow back and counts as read. while the
// home page is up the board is not on screen, so nothing on it is selected
function chooseShown(){
  const id = selectedId;
  if (homeOpen || !browsing || !id || !els[id]) return;
  setBrowsing(false);
  markSeen(id);
  if (lastState) renderTabs(lastState);
  for (const r of document.querySelectorAll("#tiklist .trow"))
    if (r.dataset.id === id && r.classList.contains("yours")) r.classList.add("seen");
}
// Escape with nothing being typed: the card stays on screen, browsed, and
// gives up its drop shadow. whatever held the focus inside it lets go, so the
// Enter that selects it again is never a press on one of its buttons
function unselectShown(){
  const id = selectedId;
  if (browsing || !id || !els[id]) return;
  setBrowsing(true);
  const held = document.activeElement;
  if (held && held !== document.body && els[id].box.contains(held)) held.blur();
}
// the reader is in this card's composer, by a tap, the caret landing there or
// a key typed: the card on screen is selected if it was only browsed, and the
// card counts as read
function useCard(id){
  if (homeOpen) return;
  if (id === selectedId) chooseShown();
  markSeen(id);
}
function deselect(){
  cancelAutoNext();
  selectedId = null; shownId = null; localStorage.removeItem("selbox");
  setBrowsing(false);
  for (const k of Object.keys(els)) els[k].box.classList.remove("sel");
  document.getElementById("pane").classList.add("blank");
  for (const r of document.querySelectorAll("#tiklist .trow")) r.classList.remove("on");
  reachLater();
}
function setTab(owner){
  if (!validOwners.has(owner)) return;
  activeOwner = owner; localStorage.setItem("activeproj", owner);
  const pick = lastState && pickInRow(lastState, owner);
  if (pick) browse(pick.id); else deselect();
  if (lastState){
    const trace = tracePhone("begin", "phase", { action: "project", part: "apply" });
    apply(lastState);
    endPhoneTrace(trace, { action: "project", part: "apply" });
  }
}
// the board's tabs, in the board's order and without the ones the board has
// closed. this page is a bridge, so its list shows exactly those; a board that
// has closed every lane leaves the list whole rather than empty. the keys that
// jump to a tab count along this same list, so a number is the project in that
// place in the list
function barOwners(st){
  const all = allRowsOf(st);
  const open = all.filter(ow => !tabShut(st, ow));
  return open.length ? open : all;
}

// ---- the project's capsule and its list ------------------------------------------
// the tab row that crossed the top of this page is the capsule in the row of
// buttons and the list it opens. the capsule names the open project, or Home
// while home is up, and wears a dot while another place has an unread reply.
// the list holds the house, then every project, the unread ones heavier as the
// tabs were and the open one checked. its rows are built again only when the
// projects or their names change, so a poll that changes nothing touches only
// the marks
const projBtn = document.getElementById("projbtn");
const projMenu = document.getElementById("projmenu");
const projList = document.getElementById("projlist");
const PROJ_CHECK = '<svg class="pcheck" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>';
function renderTabs(st){
  if (projCarry && projCarry.rects) return;   // a project being carried owns the list
  const owners = barOwners(st);
  // the current tab closed on the other device: step to the first one left,
  // the way the board does. setTab repaints, and the paint below is the same
  // paint either way, so this falls through rather than returning
  if (owners.length && !owners.includes(activeOwner)) setTab(owners[0]);
  const sig = owners.map(ow => ow + ":" + labelOf(st, ow)).join(",");
  if (projList.dataset.sig !== sig){
    // a list emptied is a list scrolled to nothing, so a long one scrolled by
    // hand has its place read before and written back after
    const at = projMenu.scrollTop;
    projList.dataset.sig = sig;
    projList.textContent = "";
    for (const ow of owners){
      const row = h("button", "projrow");
      row.type = "button";
      row.dataset.owner = ow;
      row.appendChild(h("span", "pname", labelOf(st, ow)));
      row.insertAdjacentHTML("beforeend", PROJ_CHECK);
      projList.appendChild(row);
    }
    projMenu.scrollTop = at;
  }
  // no project is checked while home is up: the house is
  let others = false;
  for (const row of projList.querySelectorAll(".projrow")){
    const ow = row.dataset.owner, on = ow === activeOwner && !homeOpen, unread = laneUnread(st, ow);
    row.classList.toggle("on", on);
    row.setAttribute("aria-pressed", String(on));
    row.classList.toggle("unread", unread);
    if (unread && !on) others = true;
  }
  const name = homeOpen ? "Home" : labelOf(st, activeOwner);
  const label = document.getElementById("projname");
  if (label.textContent !== name) label.textContent = name;
  projBtn.classList.toggle("others", others);
  projBtn.setAttribute("aria-label", name + (others ? ", unread replies elsewhere" : "") + ", choose a project");
}
function projOpen(){ return document.body.classList.contains("projopen"); }
function openProjects(){
  if (projOpen()) return;
  dismissEditor();
  if (lastState) renderTabs(lastState);
  document.body.classList.add("projopen");
  projBtn.setAttribute("aria-expanded", "true");
  // the open place in sight in a list long enough to scroll
  projMenu.querySelector(".projrow.on")?.scrollIntoView({ block: "nearest" });
}
function closeProjects(){
  endProjCarry();
  lightRow(null);
  if (!projOpen()) return;
  document.body.classList.remove("projopen");
  projBtn.setAttribute("aria-expanded", "false");
}
// a project chosen in the list, by a tap or by lifting a held finger on it. the
// open project's own row, with home shut, lets go of the selected card on
// screen, which stays there browsed, as a tap on its tab did; any other row
// switches to its lane, leaving home for it. the house is its own press
function chooseRow(row){
  if (row === house){ house.click(); return; }
  closeProjects();
  const ow = row.dataset.owner;
  if (!ow) return;
  if (ow === activeOwner && !homeOpen && selectedId && !browsing){ unselectShown(); return; }
  if (homeOpen) setHome(false);   // a project leaves home for its board
  setTab(ow);
}
// the list's own taps. the house's press opens home through its own listener
// (the home page, below), and every row shuts the list
projMenu.addEventListener("click", e => {
  const row = e.target.closest?.(".projrow");
  if (!row || projCarried) return;
  if (row === house) closeProjects();
  else chooseRow(row);
});
document.getElementById("projshade").addEventListener("click", closeProjects);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || !projOpen()) return;
  e.preventDefault(); e.stopPropagation();
  closeProjects();
  projBtn.focus({ preventScroll: true });
}, true);

// ---- the press on the row's glass --------------------------------------------------
// each of the row's buttons takes .pressed while a finger or the pointer holds
// it, for at least PRESS_MIN so a quick tap still shows it, the way the
// drawer's names hold their dip. the rise takes .3s, so the hold is long enough
// for a tap to reach most of it. the capsule's press is its hold (below)
const PRESS_MIN = 120;
function glassPress(btn){
  let since = 0, timer = 0;
  return {
    press(){ clearTimeout(timer); since = performance.now(); btn.classList.add("pressed"); },
    release(){
      if (!btn.classList.contains("pressed")) return;
      clearTimeout(timer);
      timer = setTimeout(() => btn.classList.remove("pressed"), Math.max(0, since + PRESS_MIN - performance.now()));
    },
  };
}
for (const btn of document.querySelectorAll("#dock .dockbtn")){
  if (btn === projBtn) continue;
  const glass = glassPress(btn);
  btn.addEventListener("pointerdown", glass.press);
  for (const type of ["pointerup", "pointercancel", "pointerleave"]) btn.addEventListener(type, glass.release);
}

// ---- the capsule: a tap, or a hold and a drag up the list ---------------------------
// a tap opens the list and a tap on the capsule while it is open shuts it. a
// press held still grows and brightens the capsule over the hold, and after
// PROJ_HOLD the list pops with the finger still down: dragging up over it
// lights the row under the finger, and lifting there chooses that row; lifting
// anywhere else leaves the list open for a tap. a finger that travels before
// the hold is up is not a press on it, so a slide along the screen's foot, the
// phone's own app switcher, opens nothing. the touch's default is refused on
// the capsule alone, which is what keeps the phone's own long-press selection
// and callout off it, and the click a touch would make; the document's own
// touch listeners stay passive
const PROJ_HOLD = 380;   // ms a finger rests on the capsule before the list pops
const PROJ_SLIP = 10;    // px of travel before the hold that make the touch no press
const projGlass = glassPress(projBtn);
let projPress = null;
function rowAt(x, y){
  const at = document.elementFromPoint(x, y);
  const row = at && at.closest ? at.closest(".projrow") : null;
  return row && projMenu.contains(row) ? row : null;
}
function lightRow(row){
  for (const r of projMenu.querySelectorAll(".projrow.hot")) if (r !== row) r.classList.remove("hot");
  if (row) row.classList.add("hot");
}
function endProjPress(){
  const p = projPress;
  if (!p) return null;
  projPress = null;
  clearTimeout(p.timer);
  projBtn.classList.remove("held");
  projGlass.release();
  return p;
}
projBtn.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
projBtn.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  endProjPress();
  const p = projPress = { id: e.pointerId, x: e.clientX, y: e.clientY, held: false, wasOpen: projOpen() };
  try { projBtn.setPointerCapture(e.pointerId); } catch (_) {}
  projGlass.press();
  p.timer = setTimeout(() => {
    if (projPress !== p) return;
    p.held = true;
    projBtn.classList.add("held");
    openProjects();
  }, PROJ_HOLD);
});
projBtn.addEventListener("pointermove", e => {
  const p = projPress;
  if (!p || e.pointerId !== p.id) return;
  if (p.held) lightRow(rowAt(e.clientX, e.clientY));
  else if (Math.hypot(e.clientX - p.x, e.clientY - p.y) > PROJ_SLIP) endProjPress();
});
projBtn.addEventListener("pointerup", e => {
  if (!projPress || e.pointerId !== projPress.id) return;
  const p = endProjPress();
  if (p.held){
    const row = rowAt(e.clientX, e.clientY);
    lightRow(null);
    if (row) chooseRow(row);
    return;
  }
  if (p.wasOpen) closeProjects(); else openProjects();
});
projBtn.addEventListener("pointercancel", e => {
  if (projPress && e.pointerId === projPress.id){ endProjPress(); lightRow(null); }
});
// a key's press on the capsule, Enter or Space, is a click with no pointer
projBtn.addEventListener("click", e => {
  if (e.detail !== 0) return;
  if (projOpen()) closeProjects(); else openProjects();
});

// ---- carrying a project along the list ----------------------------------------------
// the board reorders its tabs by pressing a tab and sliding it along; here a
// press is held on a project's row in the open list and the finger carries it
// up or down. with no mouse the press has to be held first, or every scroll of
// the list would pick a row up, and nothing at all shows until it is held. the
// order it lands on goes to the board, so the desktop bar follows on its next
// poll
const TAB_PRESS = 420;   // ms a finger rests on a row before the row lifts
const TAB_SLIP = 10;     // px of travel that makes the touch a scroll of the list
let projCarry = null;    // the finger on the list, before and during the carry
let projCarried = false; // a carry just ended: the release is not a choice
function endProjCarry(){
  const t = projCarry;
  if (!t) return;
  projCarry = null;
  clearTimeout(t.timer);
  for (const el of (t.rows || [])) el.style.transform = "";
  t.el.classList.remove("lifted");
}
// the press has been held: the resting spots are measured once, the held row
// lifts, and every swap reads against those fixed midpoints, as on the board
function liftRow(){
  const t = projCarry;
  if (!t) return;
  t.rows = [...projList.querySelectorAll(".projrow")];
  t.idx = t.rows.indexOf(t.el);
  if (t.idx < 0){ projCarry = null; return; }   // the list rebuilt under the finger
  t.rects = t.rows.map(el => el.getBoundingClientRect());
  t.slot = t.idx;
  t.el.classList.add("lifted");
}
function moveRow(y){
  const t = projCarry, r = t.rects, i = t.idx;
  const raw = y - t.y;
  // the held row pins at the ends of the list and never leaves it
  const dy = Math.max(r[0].top - r[i].top, Math.min(r[r.length - 1].bottom - r[i].bottom, raw));
  t.el.style.transform = "translateY(" + dy + "px)";
  const center = r[i].top + r[i].height / 2 + raw;
  let slot = 0;
  for (let j = 0; j < r.length; j++)
    if (j !== i && center > r[j].top + r[j].height / 2) slot++;
  if (slot === t.slot) return;
  t.slot = slot;
  const shift = r[i].height;   // the rows stand edge to edge
  for (let j = 0; j < t.rows.length; j++){
    if (j === i) continue;
    const move = j < i ? (j >= slot ? shift : 0) : (j <= slot ? -shift : 0);
    t.rows[j].style.transform = move ? "translateY(" + move + "px)" : "";
  }
}
function dropRow(){
  const t = projCarry;
  if (!t || !t.rects){ endProjCarry(); return; }
  projCarried = true;
  setTimeout(() => { projCarried = false; }, 0);   // the release that ends the carry
  if (t.slot === t.idx){ endProjCarry(); return; }   // put back where it was
  const strip = t.rows.map(el => el.dataset.owner);
  strip.splice(t.slot, 0, strip.splice(t.idx, 1)[0]);
  // closed tabs sat out of the carry, so the strip is not the whole order: the
  // held lane is lifted out of the full order and set down behind the visible
  // lane it now follows, which leaves every closed lane exactly where it was
  const rec = tabRecord(lastState);
  const order = (lastState ? allRowsOf(lastState) : strip).filter(ow => ow !== t.ow);
  const prev = strip[strip.indexOf(t.ow) - 1];
  order.splice(prev ? order.indexOf(prev) + 1 : 0, 0, t.ow);
  endProjCarry();
  writeTabs({ order, closed: rec.closed });
  projList.dataset.sig = "";
  if (lastState) renderTabs(lastState);
}
projList.addEventListener("touchstart", e => {
  endProjCarry();
  const el = e.target.closest && e.target.closest(".projrow");
  if (!el || e.touches.length !== 1) return;
  const p = e.touches[0];
  projCarry = { el, ow: el.dataset.owner, x: p.clientX, y: p.clientY, rects: null };
  projCarry.timer = setTimeout(liftRow, TAB_PRESS);

    return { top, range, view: Math.round(height),
      edge: range < 2 ? "none" : top <= 1 ? "top" : top >= range - 1 ? "bottom" : "middle" };
  };
  // how long the event waited for the page, which a busy main thread stretches
  const lagOf = e => e.timeStamp > 0 ? performance.now() - e.timeStamp : undefined;
  const focusNow = () => {
    const at = document.activeElement;
    return !at || at === document.body ? "none" : phoneEnterRole(at, selectedId && els[selectedId]);
  };
  // a layer over the page that takes a finger meant for the response under it:
  // the shade while a menu is out, the startup curtain, or a menu still leaving
  const layerOf = target => target.closest?.("#scrim") ? "scrim"
    : target.closest?.("#loading") ? "curtain"
    : target.closest?.("#drawer:not(.open), #settings:not(.open)") ? "panel" : null;
  const taken = (t, by, side) => {
    if (t.taken) return;
    t.taken = by;
    tracePhone("note", "input", { action: "response-scroll", part: "taken", box: selectedId, by, side });
  };
  // the reply's words replaced while a finger is on them or just after: a poll
  // bringing a new reply, or the history arrows stepping through older ones
  const watchSwaps = t => {
    swapWatch?.disconnect();
    swapWatch = null;
    const reply = t.scroller.querySelector(":scope > .reply");
    if (!reply || typeof MutationObserver !== "function") return;
    const watch = swapWatch = new MutationObserver(() => {
      tracePhone("note", "phase", { action: "response-scroll", part: "reply-swap", box: selectedId,
        hist: !!(hist && hist.id === selectedId), ms: performance.now() - t.start });
    });
    watch.observe(reply, { childList: true });
  };
  // whether the swipe moved nothing, judged once: at touch end, or NO_SCROLL_MS
  // after the intent if the finger is still down. Only armed at an intent that
  // could scroll, so a response at its edge being pushed further is never a save
  const judge = (t, end) => {
    if (!t.armed) return;
    t.armed = false;
    clearTimeout(t.timer);
    if (t.count || !t.far || (end && end.top !== t.top)) return;
    tracePhone("noScroll", t.box);
  };
  document.addEventListener("touchstart", e => {
    const p = e.touches[0];
    if (!p) return;
    const target = e.target;
    const scroller = target.closest?.(".box.sel .replyview") || null;
    const action = scroller ? "response-scroll"
      : p.clientX <= 28 || p.clientX >= innerWidth - 28 ? "drawer"
      : target.closest?.(".trow, #cards") ? "card"
      : target.closest?.("#projbtn, #projmenu") ? "project" : null;
    const layer = scroller || !selectedId ? null : layerOf(target);
    if (touch) { touch.armed = false; clearTimeout(touch.timer); }   // a second finger is no swipe
    touch = action || layer ? { action, layer, x: p.clientX, y: p.clientY, intended: false } : null;
    if (!touch) return;
    if (layer) touch.side = layer === "scrim" ? menuOut()?.dataset.side
      : layer === "panel" ? target.closest("#drawer, #settings").dataset.side : undefined;
    if (!scroller) {
      if (action) tracePhone("note", "input", { action, part: "touch", box: selectedId });
      return;
    }
    const cls = document.body.classList, at = measure(scroller);
    Object.assign(touch, { scroller, box: selectedId, start: performance.now(), top: at.top,
      count: 0, far: false, prevented: false, armed: false,
      dragging: cls.contains("menudrag") || cls.contains("carddrag") });
    lastTouch = touch;
    watchSwaps(touch);
    tracePhone("note", "input", { action, part: "touch", box: selectedId, ...at,
      hist: !!(hist && hist.id === selectedId), kb: cls.contains("kb"), focus: focusNow(), lag: lagOf(e) });
  }, { capture: true, passive: true });
  document.addEventListener("touchmove", e => {
    const p = e.touches[0];
    if (!p || !touch) return;
    const dx = Math.abs(p.clientX - touch.x), dy = Math.abs(p.clientY - touch.y);
    if (touch.scroller && dy >= NO_SCROLL_PX) touch.far = true;
    if (touch.intended) return;
    if (Math.max(dx, dy) < (touch.action === "drawer" ? 6 : 10)) return;
    if (touch.layer) {
      // asked once, on the first decided move: a vertical swipe over the
      // response that a layer took instead
      const layer = touch.layer;
      touch.layer = null;
      const r = dy > dx && els[selectedId]?.replyview?.getBoundingClientRect();
      if (r && touch.x >= r.left && touch.x <= r.right && touch.y >= r.top && touch.y <= r.bottom)
        taken(touch, layer, touch.side);
    }
    if (!touch.action) return;
    if (touch.action === "card" && dy > dx && e.target.closest?.(".box.sel"))
      touch.action = "response-scroll";
    if (touch.action === "response-scroll" && dy <= dx) return;
    if (touch.action === "card" && dx <= dy) return;
    touch.intended = true;
    const detail = { action: touch.action, part: "intent", box: selectedId };
    if (touch.action === "response-scroll")
      Object.assign(detail, { dir: p.clientY < touch.y ? "up" : "down", far: dy >= NO_SCROLL_PX, lag: lagOf(e) });
    if (touch.scroller) {
      const at = measure(touch.scroller);
      detail.edge = at.edge;
      // a finger moving down pulls the response towards its top edge
      const into = detail.dir === "down" ? "top" : "bottom";
      if (at.range >= 2 && at.edge !== into && at.top === touch.top && !touch.count) {
        const t = touch;
        t.armed = true;
        t.timer = setTimeout(() => judge(t, null), NO_SCROLL_MS);
      }
    }
    tracePhone("note", "input", detail);
    traceFrameOpportunity(touch.action);
  }, { capture: true, passive: true });
  // after every page handler has had the move: whether one cancelled the pan,
  // and whether an edge pull or a card swipe began on this touch
  addEventListener("touchmove", e => {
    const t = touch;
    if (!t?.scroller) return;
    if (e.defaultPrevented) t.prevented = true;
    if (t.dragging) return;
    const cls = document.body.classList;
    if (cls.contains("menudrag")) taken(t, "drawer");
    else if (cls.contains("carddrag")) taken(t, "cardswipe");
  }, { passive: true });
  document.addEventListener("focusin", () => { if (touch?.scroller) taken(touch, "focus"); }, true);
  const finishTouch = e => {
    const t = touch;
    touch = null;
    if (!t?.action) return;
    const part = e.type === "touchcancel" ? "touch-cancel" : "touch-end";
    if (!t.scroller) {
      tracePhone("note", "input", { action: t.action, part, box: selectedId });
      return;
    }
    const now = performance.now(), end = t.scroller.isConnected ? measure(t.scroller) : null;
    t.ended = now;
    tracePhone("note", "input", { action: t.action, part, box: selectedId,
      moved: end ? Math.abs(end.top - t.top) : undefined, count: t.count, ms: now - t.start,
      same: !!end && !!t.scroller.closest(".box.sel"), prevented: t.prevented });
    judge(t, end);
    const watch = swapWatch;
    setTimeout(() => {
      if (swapWatch !== watch) return;
      watch?.disconnect();
      swapWatch = null;
    }, AFTER_TOUCH_MS);
  };
  document.addEventListener("touchend", finishTouch, { capture: true, passive: true });
  document.addEventListener("touchcancel", finishTouch, { capture: true, passive: true });
  document.addEventListener("scroll", e => {
    const target = e.target;
    const t = touch?.scroller === target ? touch : null;
    if (t) {
      t.count++;
      if (t.armed) { t.armed = false; clearTimeout(t.timer); }
    }
    if (!target.matches?.(".replyview") || !target.closest(".box.sel")) return;
    if (!scrollRun) {
      const now = performance.now();
      // how long after the finger came down the first scroll arrived
      const from = t || (lastTouch?.scroller === target && now - lastTouch.ended <= AFTER_TOUCH_MS ? lastTouch : null);
      scrollRun = { at: now, count: 0 };
      tracePhone("note", "scroll", { action: "response-scroll", phase: "start", box: selectedId,
        wait: from ? now - from.start : undefined });
      traceFrameOpportunity("response-scroll");
    }
    scrollRun.count++;
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const run = scrollRun;
      scrollRun = null;
      if (run) tracePhone("note", "scroll", { action: "response-scroll", phase: "end",
        box: selectedId, ms: performance.now() - run.at, count: run.count });
    }, 180);
  }, true);
  document.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse") return;
    if (e.target.closest?.(".trow")) tracePhone("note", "input", { action: "card", part: "touch", box: selectedId });
  }, { capture: true, passive: true });
}

// ---- the startup curtain, and the launch image the phone keeps -----------------------
// An installed open shows two pictures before the board. The first is the
// phone's OWN launch image, which iOS shows the instant the app is tapped and
// holds until it hands the web view this page; the second is the curtain in
// this document, which stands over the app's first frames from this page's
// first paint until the board is really on screen. Both are taken from
// an earlier phone app: the same
// white, the same handle in the same grey, the same globe, the same 1000ms
// minimum hold and the same 260ms fade. Two things are this board's own.
//
// The logo in the middle is the facilitator squid.
//
// And the globe is the connection step rather than a stopwatch. The earlier app
// lifts its page after two seconds however the boot went, because it
// has a copy of the conversation to fall back on. This board has no such copy
// and would be lifting onto an empty frame, so there is no cap here at all:
//
//   the globe turns while the phone is still trying to read the board;
//   it stops and turns red the moment a reading fails, and stays that way
//     until one gets through, retried on the poll's own backoff;
//   it comes down only after a reading has been drawn AND the page it drew
//     has stopped moving.
//
// Nothing else takes it down. No elapsed time, no stored copy and no guess
// counts as a connection. A board that is genuinely empty is a different thing
// from one nobody has read yet, and it only says so once a reading proves it
// (the .stated rule in the sheet above).
//
// After the curtain has gone it never comes back. A connection lost later
// changes nothing on screen.

// --- the phone's own launch image (iOS) ---
// The painter is m-splash.js, loaded with the other shared files ahead of this
// script. The sign-in page loads the same file, because iOS takes the picture
// from whichever page the icon is added from, and that is now the sign-in page.
// It is called at the foot of the boot, after the first reading is asked for.

// --- the curtain's rule ---
const LOAD_MIN_HOLD_MS = 1000;   // held at least this long, however fast the read
const LOAD_FADE_MS = 260;        // short and smooth, not a cut
const QUIET_FRAMES = 3;          // unchanged frames in a row before the page counts as still
// NO CLOCK RUNS IN THIS GATE. There is no longest wait on a picture and no
// longest watch for stillness, because either one would let time alone answer a
// question about the page, and the answer would be wrong exactly when it
// matters: a card whose picture has not arrived, or one still growing under the
// reader, is a card the reader was promised they would not be shown. So the
// waiting ends when the thing being waited for has actually happened, and a page
// that never stops moving keeps the curtain, which is the honest picture of a
// page that is not ready.
//
// a launch image preceded this load only in an installed window; a browser tab
// has no handover to hold, so the curtain stays out of one
function isInstalledWindow(){
  return navigator.standalone === true ||
         (typeof matchMedia === "function" && matchMedia("(display-mode: standalone)").matches);
}
const curtain = document.getElementById("loading");
let startupLifted = false;    // the curtain has gone, and never comes back
let startupHeld = false;      // the minimum hold has passed
let startupStill = false;     // a drawn board has stopped moving
let startupDrew = false;      // a live reading has been drawn at least once
// how many frames the stillness watch read before it answered. kept in the page
// rather than reported: the incident history takes a fixed set of event names,
// and a start that went normally is not an incident
let startupFrames = 0;
// the pictures the gate has finished with, and the ones it has already asked
// about. finished means decoded or failed, which are both endings; asked about
// means the wait is already running and must not be started twice. weak, so a
// card redrawn between readings takes its old nodes out with it
const startupArtDone = new WeakSet();
const startupArtAsked = new WeakSet();
// the page is on screen from its first paint, so this is when the script took it
// over rather than when it appeared
if (curtain && !isInstalledWindow()){
  // it is a fixed, full-screen panel, so it comes out of the document rather
  // than merely being hidden. the sheet's display-mode rule already hid it
  // before any of this ran; this is the half that also catches a browser which
  // does not know that query
  curtain.remove();
  startupLifted = true;
} else if (!curtain){
  startupLifted = true;   // an older page out of the worker's cache has none
} else {
  setTimeout(() => { startupHeld = true; liftCurtain(); }, LOAD_MIN_HOLD_MS);
}
function liftCurtain(){
  if (startupLifted || !startupHeld || !startupStill) return;
  startupLifted = true;
  curtain.style.pointerEvents = "none";   // the fade must not eat the first tap
  curtain.style.opacity = "0";            // the sheet above states the transition this rides
  setTimeout(() => curtain.remove(), LOAD_FADE_MS);
}
// a reading failed. only the readings BEFORE the first drawn board are the
// curtain's business: once a board is on screen the connection was made, and a
// loss after that is not the curtain's to report
function startupTrouble(){
  if (startupLifted || startupDrew || !curtain) return;
  curtain.classList.add("down");
}
// a reading got through: the globe turns again
function startupAnswered(){
  if (startupLifted || !curtain) return;
  curtain.classList.remove("down");
}
// pure: the frame-to-frame comparison, with no clock and no DOM in it. a frame
// counts as still only if nothing moved AND nothing on it is still coming, and
// either one starting again puts the count back to nothing
function createQuietWatch(need){
  let prev = null, still = 0, seen = 0;
  return {
    frame(f){
      seen += 1;
      const same = prev !== null && f.ph === prev.ph && f.pw === prev.pw &&
                   f.sh === prev.sh && f.st === prev.st && f.ch === prev.ch &&
                   f.vh === prev.vh && f.rh === prev.rh;
      still = same && f.art === 0 ? still + 1 : 0;
      prev = f;
      return still >= need;
    },
    seen: () => seen,
  };
}
// THE PICTURES THE READER CAN ACTUALLY SEE, and only those.
//
// Every card the board sent is built into #cards, but all except the one on show
// are display:none, so a picture on a card behind this one is a picture nobody is
// waiting for and it must not hold the start up. The card on show is asked for
// its own, and the card itself is checked for a box on the screen, which also
// covers the frame before any card is shown at all.
function startupArt(){
  const card = document.querySelector("#cards .box.sel");
  if (!card || !card.getClientRects().length) return [];
  return Array.from(card.querySelectorAll("img"));
}
// how many of those are still coming. A PICTURE THAT FAILED IS NOT ONE OF THEM:
// decode() rejects when the file will never arrive, and a rejection is an answer,
// so that node is finished with and the card around it is as done as it is going
// to get. A picture still on its way has no answer yet, and no amount of waiting
// turns into one, which is the whole reason nothing here is on a timer.
function startupPendingArt(){
  let pending = 0;
  for (const img of startupArt()){
    if (startupArtDone.has(img)) continue;
    pending += 1;
    if (startupArtAsked.has(img)) continue;
    startupArtAsked.add(img);
    const finished = () => startupArtDone.add(img);
    try {
      if (img.decode) img.decode().then(finished, finished);
      else if (img.complete) finished();
      else { img.addEventListener("load", finished, { once: true });
             img.addEventListener("error", finished, { once: true }); }
    } catch (e) { finished(); }
  }
  return pending;
}
// one frame's reading of everything the eye could catch moving: the card frame's
// box, the shown card's answer and where it stands, the viewport, and how many of
// the shown card's pictures are still coming. every one of them is READ and never
// written, because a write from the thing that is supposed to be proving the page
// is still would be the page moving again
function startupFrame(){
  const pane = document.getElementById("pane");
  const reply = document.querySelector("#cards .box.sel .replyview");
  // the typing row, read as well as the answer above it. the row can change
  // height on its own after the board is drawn, when the composer swaps its
  // plain field for the typed-formatting editor, and the answer gives up its
  // own room for it; watching both means neither can move unseen
  const row = document.querySelector("#cards .box.sel .compose");
  return {
    ph: pane ? pane.clientHeight : 0,
    pw: pane ? pane.clientWidth : 0,
    rh: row ? row.clientHeight : 0,
    sh: reply ? reply.scrollHeight : 0,
    st: reply ? Math.round(reply.scrollTop) : 0,
    ch: reply ? reply.clientHeight : 0,
    vh: Math.round(window.visualViewport ? window.visualViewport.height : window.innerHeight),
    art: startupPendingArt(),
  };
}
// Watch until the page has been still for QUIET_FRAMES frames in a row with
// nothing left to come. There is no way out of this loop other than that
// happening, on purpose: a page that keeps moving is a page that is not ready to
// be shown, and the curtain saying so is the truth rather than a hang.
function watchStartupQuiet(done){
  if (typeof requestAnimationFrame !== "function"){ done(0); return; }
  const watch = createQuietWatch(QUIET_FRAMES);
  const step = () => {
    if (watch.frame(startupFrame())){ done(watch.seen()); return; }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
// THE WEB FACES ARRIVE AFTER THE FIRST PAINT. Their sheets are asked for off it
// (the script before the shared files), so a board can be laid out in the
// phone's own faces first and change face when they land. This answers once
// they have: the sheets answered, loaded or refused; then two frames, so the
// page has been laid out under the sheets' rules at least once, which is what
// asks for the faces at all (a frame's callbacks run before its layout, hence
// two); then document.fonts.ready, which answers once every face asked for has
// arrived or failed. Asked once and shared, by the curtain below and by each
// typing row's second fitting. Like the rest of this gate it has no clock: a
// sheet or a face still on its way keeps the curtain, and one that fails is an
// ending and lets it go.
let webFacesAsked = null;
function webFacesLanded(){
  if (!webFacesAsked) webFacesAsked = (async () => {
    try { await window.webFontSheets; } catch (e) {}
    if (typeof requestAnimationFrame === "function")
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => r())));
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  })();
  return webFacesAsked;
}
// A live reading has been drawn. Wait for it to be finished arriving, then for
// it to be finished MOVING, which are not the same instant: a card laid out is
// still growing while its pictures decode and while the safe-area insets settle.
// Runs once per load; later readings change the board, not the startup.
async function startupRendered(){
  if (startupLifted || startupDrew || !curtain) return;
  startupDrew = true;
  // THE ROW THE READER WILL TYPE IN HAS TWO FACES. With the typed-formatting
  // setting on, the composer starts as the plain field and puts the editor on
  // when the vendored bundle lands, which is a file of its own and can land
  // after this board has been drawn. A curtain lifted before that swap would
  // hand over a card whose row then changes height under the reader, which is
  // the one thing this gate exists to prevent. So the swap is waited for by
  // name, on the same terms as everything else here: settled() answers when
  // the row has taken its final face, which is the editor mounted, the setting
  // off, or the editor not available at all. It carries no clock, so a bundle
  // still on its way keeps the curtain and a bundle that cannot be had lets it
  // go.
  if (typeof ComposeFormat === "object" && ComposeFormat) {
    try { await ComposeFormat.settled(); } catch (e) {}
  }
  // the card's faces, waited for by name for the same reason: a board uncovered
  // in the phone's own faces would change face under the reader when the web
  // faces land. only after them does the stillness watch begin, so the frames
  // it reads are frames of the board as it will stay
  await webFacesLanded();
  await new Promise(r => requestAnimationFrame(() => r()));   // laid out and painted
  await new Promise(resolve => watchStartupQuiet(frames => { startupFrames = frames; resolve(); }));
  startupStill = true;
  liftCurtain();
}

// ---- the poll ------------------------------------------------------------------------
function apply(state){
  const trace = tracePhone("begin", "render", { rev: state.rev });
  // a reading of the board has been drawn at least once, which is what lets the
  // page say a tab is empty instead of only unknown
  document.body.classList.add("stated");
  // the read marks are the board's, so they arrive with the state: taken in
  // first, ahead of the tabs and the list that draw from them
  seenSync(state);
  for (const id of Object.keys(els)){
    if (!state.boxes.some(b => b.id === id)){
      if (hist && hist.id === id) hist = null;
      delete histCache[id];
      // the row's typed formatting is held by the formatter as well as by this
      // card, so the card takes it with it: without this the editor and the
      // removed card stay reachable for the rest of the page's life
      els[id].field?.detach();
      // and the watches on its two panels' sizes go with it
      dropAnswered(els[id], null);
      els[id].sentRoom = null;
      dropSent(els[id]);
      // an upload for a card that is gone has nowhere to land
      trayDrop(els[id]);
      els[id].box.remove(); delete els[id];
    }
  }
  for (const b of state.boxes){
    if (b.id === "q") continue;
    if (!els[b.id]) makeBox(b);
    const el = els[b.id];
    const rawReply = replyFull(b);
    // a new answer on the card on show turns the page, as it does on the desktop
    // (card-logic.js): the sheet over the page the reader was on is laid before
    // anything of the new one is drawn, and turnGo below glides it. while the
    // reader is busy with the card the new answer is held back, and this pass
    // leaves the answer and both panels exactly as they stand
    const turn = el.reply.dataset.raw !== rawReply ? turnBegin(el, b) : null;
    const held = turn === TURN_HELD;
    if (!held && el.reply.dataset.raw !== rawReply){
      el.reply.dataset.raw = rawReply;
      delete histCache[b.id];
      if (hist && hist.id === b.id) histExit(b.id);
      else{
        el.reply.innerHTML = fmt(rawReply);
        if (!turn) headOnSwap(el, b);
      }
    }
    // a reply landing on the selected card while the window is in front is read
    // as it lands, unless the drawer is covering the card. a browsed card is not
    // read
    readOnArrival(el, b, b.id === selectedId && !browsing && !drawerOpen());
    // the card reads its own name, Omni Card #N for an Omni ticket; an Omni
    // sweep in flight writes it itself
    if (!el.titleEl.isContentEditable && !el.omniSweep && el.titleEl.textContent !== omniCardTitle(b.title))
      el.titleEl.textContent = omniCardTitle(b.title);
    syncOmniCard(el, b);
    // the message a send has just drawn is not the poll's to take away. a state
    // fetched before the server had that message knows nothing about it, and the
    // pass over the panel would read the shorter list as the run being answered
    // and clear the panel in view. el.sendGuard is the moment the send landed,
    // and stands at the end of time while one is still in flight
    const stale = (state.fetchedAt || 0) < (el.sendGuard || 0);
    if (!held && !stale) syncSentPhone(el, b);
    // and the panel over the answer: the reply the card is showing, and the
    // messages the board recorded that reply was given. while an older page is
    // on show the stepper owns that panel, so the poll leaves it alone and
    // histExit is what hands it back to the live reply. the pass compares the
    // reply's own name, so a poll carrying the same reply again touches no dom
    // at all and nothing near the typing row moves
    if (!held){
      el.liveMeta = liveAnswered(b);
      if (!(hist && hist.id === b.id)) syncAnswered(el, el.liveMeta);
    }
    // the new page stands under the sheet: the glide and the print
    turnGo(el, turn);
    const cs = cardState(b);
    el.box.classList.toggle("done", cs === "done");
    el.box.classList.toggle("parked", cs === "parked");
    paintSectionChips(el, b);
    setCardSpinner(el.cardSpin, cardSpinning(b));
    syncPhoneHistory(b);
    // a note about a send that failed or was held stays until the card can
    // take another; any other note is the poll's to clear. a held send clears
    // as soon as there is room again
    // a tap on the moon the board refused or never answered leaves its own
    // note, which says what the card is NOT: no reading may take that away,
    // only the next tap on the same chip
    if (el.meta.textContent && el.meta.textContent.indexOf("send ") !== 0 &&
        el.meta.dataset.flagnote !== "1") el.meta.textContent = "";
    if (el.meta.textContent.indexOf("send held") === 0 && ops.length < OPS_MAX) el.meta.textContent = "";
  }
  if (selectedId && !state.boxes.some(b => b.id === selectedId && b.owner === activeOwner)) deselect();
  applySelection(state);
  syncSelectedHistory();
  renderTabs(state);
  renderTickets(state);

// ---- reading the board -------------------------------------------------------------
// one reading at a time, each with a deadline, spaced POLL_MS apart while the
// page is on screen and further apart while the board is not answering. the
// reading names the revision this page holds, so a board that has not changed
// answers in a few hundred bytes, and one that has sends only the cards that
// changed since (mergeReading), and it asks after every operation still
// pending, so on waking what landed while the phone slept is drawn from the
// board's receipts and what did not is sent again. a board that stops
// answering while the app is in use changes nothing on screen: what is shown
// is the last reading, and linkDown below says when the white screen comes up
const POLL_MS = 1200, POLL_DEADLINE_MS = 8000, POLL_BACKOFF_MAX_MS = 15000;

// and the next reading that brings cards brings all of them

// reached the screen, and the startup curtain answers to the drawing rather than
// to the holding

  clearTimeout(pollTimer); pollTimer = null;

//
// The app is being opened when the page loads and each time it comes back on
// screen (linkOpened). The first reading asked after that moment decides: if it
// is not answered, the screen comes up at once, with that reading's own
// deadline as the only wait. Once a reading asked after the opening is
// answered the app is in use, and a board that stops answering then never
// brings the screen up, however long it stays gone. A reading asked before the
// opening neither shows the screen nor ends the opening. A touch, a tap, a key

// screen goes away on any answer

// change landed, never the one that was already on its way

// a promise given ms to settle. past that the fetch it belongs to is called
// off and the reading fails, as a reading the board never answered does
function within(promise, ms, abort){
  let timer = null;
  const late = new Promise((_, reject) => {
    timer = setTimeout(() => { abort.abort(); reject(new Error("nothing came from the board for " + ms + " ms")); }, ms);
  });

// the body of a reading, taken in as it arrives: a download that keeps
// arriving is waited for however slow it is, and one that brings nothing for
// POLL_STALL_MS is lost. a browser that cannot hand the body over in pieces
// reads it whole, on the one clock
async function readingText(r, abort){
  const reader = r.body && typeof r.body.getReader === "function" && typeof TextDecoder === "function"
    ? r.body.getReader() : null;
  if (!reader) return within(r.text(), POLL_STALL_MS, abort);
  const decoder = new TextDecoder();
  let text = "";
  for (;;){
    const piece = await within(reader.read(), POLL_STALL_MS, abort);
    if (piece.done) return text + decoder.decode();
    text += decoder.decode(piece.value, { stream: true });

// THE CARDS A READING BRINGS, LAID OVER THE ONES THIS PAGE HOLDS.
//
// A whole reading brings every card. A lean one, which the board sends only to
// a page that named the reading it holds (delta in the query, and the answer's
// delta is that revision), brings the cards that changed since then and no
// others: the ids gone since (gone), where each new card sits (after, its id
// to the id before it, "" for the first), how many cards there are (count),
// and the whole order (ids) only when the rest cannot rebuild it. The board
// plays this same rebuild before it answers (server.py _phone_delta).
//
// The page is handed a fresh copy of every card, as a whole reading always
// handed it fresh cards: a pass writes into its cards (a tap held on a card,
// holdFlags) and knows a new reading's card by its being a new object, and the
// cards kept here, as the board sent them, never see those writes. null when a
// lean reading does not fit what is held: none of it is drawn, and the whole
// board is asked for again
function mergeReading(held, data){
  const list = Array.isArray(data.boxes) ? data.boxes : [];
  const epoch = typeof data.epoch === "string" ? data.epoch : null;
  if (data.delta == null){
    const cards = new Map(), order = [];
    for (const b of list){ cards.set(b?.id, b); order.push(b?.id); }
    // a board holding one id twice is drawn as it comes and never built on
    return { rev: data.rev, epoch: cards.size === order.length ? epoch : null, cards, order,
             boxes: Array.isArray(data.boxes) ? list.map(b => b && typeof b === "object" ? { ...b } : b) : data.boxes };
  }
  if (!held || data.delta !== held.rev || epoch === null || epoch !== held.epoch) return null;
  if (!Number.isSafeInteger(data.count) || !list.every(b => b && typeof b === "object")) return null;
  const gone = new Set(Array.isArray(data.gone) ? data.gone : []);
  const after = data.after && typeof data.after === "object" ? data.after : {};
  const cards = new Map(held.cards);
  for (const id of gone) cards.delete(id);
  let order = held.order.filter(id => !gone.has(id));
  for (const b of list){
    cards.set(b.id, b);
    if (Array.isArray(data.ids) || !Object.prototype.hasOwnProperty.call(after, b.id)) continue;
    const before = after[b.id];
    const at = before === "" ? 0 : order.indexOf(before) + 1;
    if (at === 0 && before !== "") return null;
    order.splice(at, 0, b.id);
  }
  if (Array.isArray(data.ids)) order = data.ids.slice();
  const count = data.count;
  if (order.length !== count || cards.size !== count || new Set(order).size !== count ||

// ---- the typing row -----------------------------------------------------------
// the row is measured on its twin, never by collapsing the row itself: a row
// collapsed to be measured hands its scroll to the engine's clamp for the length
// of one layout, and the engine's own reveal of the caret, made at the
// keystroke, is thrown away with it. the height written is a whole count of
// lines rounded up to a whole pixel, since a line is 25.5px tall and a scroll
// height the engine rounds down leaves half a pixel to scroll. the css caps
// it: the desktop's share of the height with the keyboard down, five lines
// while it is up.
function rowMetrics(ta){
  const cs = getComputedStyle(ta);
  return { lh: parseFloat(cs.lineHeight) || 0, pt: parseFloat(cs.paddingTop) || 0, pb: parseFloat(cs.paddingBottom) || 0 };
}
// how many lines the twin lays its text on, snapped to a whole line so the
// engine's rounding of the scroll height cannot leave a fraction of one
function twinLines(twin, m){
  return Math.max(1, Math.round((twin.scrollHeight - m.pt - m.pb) / m.lh));

// the row's height from its text; whether it grew, for the blink. a row not on
// screen has no width to wrap at and keeps the height it had
function fitRow(ta, twin){
  const m = rowMetrics(ta);

  // the twin lays plain characters out, and a row wearing its typed formatting
  // draws some of them in another weight or another face, so the row it would
  // measure is not the row on screen. the editor is asked for its own height
  const field = ComposeFormat.fieldOf(ta);
  let want;
  if (field && field.formatted()){
    want = field.contentHeight();

    twin.style.width = ta.clientWidth + "px";
    twin.value = ta.value;
    want = Math.ceil(twinLines(twin, m) * m.lh + m.pt + m.pb);
  }

}
// the caret's line, counted on the twin from the text up to the end of the word
// the caret is in: a word the wrap carries whole to the next line is then
// counted on the line it stands on, which the text cut at the caret would miss
function caretLine(ta, twin, m){
  const v = ta.value;
  let end = ta.selectionEnd;
  while (end < v.length && !/\s/.test(v[end])) end++;

// nothing is left below to scroll, and the first brings the row's head. after

// focus, so the tapped line is the line in view once the keyboard is up,
// at the keyboard's edge, where the cap shrinks the box, and when it lands.
// the box is read as a rectangle rather than as clientHeight, which the engine
// rounds while the cap is a fraction, and the end of the text is asked for as
// the whole scroll height, which the engine clamps to the true last position
function revealCaret(ta, twin){
  if (ta.scrollHeight <= ta.clientHeight) return;

  if (!m.lh) return;
  // the caret's line is counted on the twin, which lays the words out plainly.
  // a row wearing its typed formatting draws some of them in another weight, so
  // that count is not the row on screen and the editor is asked where its own
  // caret stands instead. the rule the numbers feed is the same one either way
  const field = ComposeFormat.fieldOf(ta);
  const band = field && field.caretBand();
  const at = band || caretLine(ta, twin, m);

// The page cannot read which keyboard surface is present. It learns the full

// classified as an obstruction or allowed to teach the clear-height baseline.

    }
    drag = null;
  };
  const paint = dx => {
    if (!drag || reduced()) return;
    const w = drag.width + GAP, p = Math.min(1, Math.abs(dx) / w);
    drag.out.style.setProperty("--card-swipe-x", dx + "px");
    drag.out.style.setProperty("--card-swipe-z", String(1 - DEPTH * p));
    drag.into.style.setProperty("--card-swipe-x", (dx + drag.dir * w) + "px");
    drag.into.style.setProperty("--card-swipe-z", String(1 - DEPTH + DEPTH * p));
  };
  const beginMotion = dx => {
    const dir = dx < 0 ? 1 : -1;
    const pick = cardStepTarget(dir);
    const out = selectedId && els[selectedId]?.box, into = pick && els[pick.id]?.box;
    if (!out || !into || into === out) return false;
    // a neighbour is already wearing its editor once the last switch was
    // drawn; one swiped to sooner is given it here, before it slides in
    wearEditor(pick.id);
    drag.dir = dir; drag.pick = pick; drag.out = out; drag.into = into;
    out.classList.add("cardswipe");
    into.classList.add("cardswipe", "cardswipe-in");
    openAtHead(els[pick.id]);
    document.getElementById("pane").classList.add("cardswiping");
    document.body.classList.add("carddrag");
    paint(dx);
    return true;
  };
  const settle = commit => {
    if (!drag || !drag.decided) { clear(); return; }
    const run = drag;
    document.body.classList.remove("carddrag");
    if (reduced()){
      if (commit) browse(run.pick.id);
      clear(); return;
    }
    const endX = commit ? -run.dir * (run.width + GAP) : 0;
    paint(endX);
    if (commit){
      run.out.style.setProperty("--card-swipe-z", String(1 - DEPTH));
      run.into.style.setProperty("--card-swipe-x", "0px");
      run.into.style.setProperty("--card-swipe-z", "1");
    }
    finishTimer = setTimeout(() => { if (drag === run && commit) browse(run.pick.id); clear(); }, RUN_MS + 40);
  };
  document.getElementById("cards").addEventListener("touchstart", e => {
    clear();
    if (e.touches.length !== 1 || menuOut()) return;
    const t = e.touches[0];
    if (t.clientX <= EDGE || t.clientX >= innerWidth - EDGE || e.target.closest(blocked)) return;
    drag = { x:t.clientX, y:t.clientY, dx:0, width:document.getElementById("cards").clientWidth,
      decided:false, rejected:false };
  }, { passive:true });
  document.getElementById("cards").addEventListener("touchmove", e => {
    if (!drag || drag.rejected || e.touches.length !== 1){ if (drag) settle(false); return; }
    const t=e.touches[0], dx=t.clientX-drag.x, dy=t.clientY-drag.y; drag.dx=dx;
    if (!drag.decided){
      if (Math.max(Math.abs(dx),Math.abs(dy)) < START) return;
      if (Math.abs(dx) <= Math.abs(dy) * 1.25){ drag.rejected=true; clear(); return; }
      drag.decided=beginMotion(dx);
      if (!drag.decided){ clear(); return; }
    }
    paint(Math.max(-drag.width, Math.min(drag.width, dx)));
  }, { passive:true });
  document.getElementById("cards").addEventListener("touchend", () => {
    if (!drag) return;
    settle(drag.decided && Math.abs(drag.dx) >= drag.width * COMMIT);
  }, { passive:true });
  document.getElementById("cards").addEventListener("touchcancel", () => settle(false), { passive:true });
}

// the card whose response control+s may scroll, or null. A drawer out
// over the card, or a card mid-swipe, is not the response the reader is looking
// at. It is asked again on every frame of the motion
function phoneResponseCard(){
  const cls = document.body.classList;
  const el = selectedId && els[selectedId];
  if (cls.contains("menuout") || cls.contains("carddrag") || !el) return null;
  return { id: selectedId, owner: activeOwner, el };
}

// the section keys' one path: a meta card moved the way its own chip would
// move it, and done closed the way the cross closes it. the key is cancelled
// even where the chip is faded
function phoneSectionMove(e, section){
  if (!selectedId) return;
  const b = lastState?.boxes.find(x => x.id === selectedId);
  if (b?.bucket !== "meta") return;
  e.preventDefault();
  sectionKeyMove(selectedId, section, els[selectedId], closeCard);
}

const phoneShortcutTyping = cardShortcutEditing;
const phoneShortcutActions = {
  diagnostic(e){
    e.preventDefault();
    saveDiagnostic("shortcut");
  },
  navigate(e, shortcut){
    e.preventDefault();
    stepCard(shortcut.value, phoneShortcutTyping(e.target));
  },
  plainNavigate(e, shortcut){
    if (phoneShortcutTyping(e.target)) return;
    e.preventDefault();
    stepCard(shortcut.value, false);
  },
  history(e, shortcut){
    e.preventDefault();
    histStep(selectedId, shortcut.value);
  },
  create(e){
    e.preventDefault();
    createCard();
  },
  tab(e, shortcut){
    if (!lastState) return;
    const ow = barOwners(lastState)[shortcut.value];
    if (ow){ e.preventDefault(); setTab(ow); }
  },
  // the first Escape leaves the reply box; the next one unselects the card,
  // which stays on screen browsed. a key something else answered first, or
  // one held down to repeat, is not this one
  escape(e){
    if (phoneShortcutTyping(e.target)) e.target.blur();
    else if (!e.defaultPrevented && !e.repeat && phoneResponseCard()) unselectShown();
  },
  // Enter selects the card on screen and puts the caret in its reply box. a
  // press on a button, a link or anything else that takes Enter is its own
  enter(e){
    if (phoneShortcutTyping(e.target) || !phoneResponseCard()) return;
    if (e.target.closest?.("button, a, select, summary, [role], [tabindex]")) return;
    e.preventDefault();
    chooseShown();
    els[selectedId].ta.focus({ preventScroll: true });
  },
  unfold(e){
    unfoldSelected(e, selectedId, selectedId && els[selectedId]);
  },
  // control+enter outside a reply box: the move a double Enter's second press
  // makes. a field that is not a reply box keeps the key
  advance(e){
    if (!lastState || phoneShortcutTyping(e.target)) return;
    e.preventDefault();
    if (!e.repeat) phoneAdvance(selectedId);
  },
  // control+r, typing or not, shows a random card from the selected card's
  // workspace, browsed as the arrow keys leave it. the key is the page's
  // whether or not a card is left to go to, and a held key goes once
  random(e){
    if (!lastState) return;
    e.preventDefault();
    if (e.repeat) return;
    const id = pickRandomCard(navigationPool(lastState).filter(b => els[b.id]), selectedId);
    if (id) browse(id);
  },
  sectionChord(e, shortcut){
    const el = selectedId && els[selectedId];
    if (!el || !sectionChordSource(e.target, el)) return;
    phoneSectionMove(e, shortcut.value);
  },
  sectionKey(e, shortcut){
    if (phoneShortcutTyping(e.target)) return;
    phoneSectionMove(e, shortcut.value);
  },
  responseScroll(e){
    responseScrollKey(e, phoneResponseCard);
  },
};

// while the home page is up the board's keys are off, as on the board: there is
// no card on screen to walk, close or move. the diagnostic save still answers
const homeShortcutActions = { diagnostic: phoneShortcutActions.diagnostic };

// a tap anywhere on the card on screen, or the keyboard's focus landing in it,
// selects it where it stands, and reads it. the tap is a click, which a swipe
// never makes, so a card only swiped to stays browsed
{
  const inCard = e => !!e.target.closest?.("#cards") && !document.body.classList.contains("menuout");
  document.getElementById("pane").addEventListener("click", e => { if (inCard(e) && selectedId) useCard(selectedId); }, true);
  document.addEventListener("focusin", e => { if (inCard(e) && selectedId) useCard(selectedId); }, true);
}

addEventListener("keydown", e => {
  dispatchCardShortcut(e, homeOpen ? homeShortcutActions : phoneShortcutActions);
});
// releases, other keys, a lost window and a hidden page stop the response scroll
listenResponseScroll();

// ---- installing, and being told when a card turns to the reader's turn -------------------------
let swReg = null;
if ("serviceWorker" in navigator){
  const identifyWorker = () => {
    const controller = navigator.serviceWorker.controller;
    if (!controller || typeof MessageChannel !== "function") return;
    const channel = new MessageChannel();
    channel.port1.onmessage = e => {
      if (e.data?.kind === "diagnostic-worker") tracePhone("worker", e.data.cache);
      channel.port1.close();
    };
    controller.postMessage({ kind: "diagnostic-worker" }, [channel.port2]);
    setTimeout(() => channel.port1.close(), 1000);
  };
  navigator.serviceWorker.register("/m-sw.js", { scope: "/m" })
    .then(reg => { swReg = reg; identifyWorker(); })
    .catch(() => {});   // plain http off localhost has no worker, and the page works without one
  navigator.serviceWorker.addEventListener("controllerchange", identifyWorker);
  navigator.serviceWorker.addEventListener("message", e => { if (e.data?.box) goToBox(e.data.box); });
}
function keyBytes(b64url){
  const pad = "=".repeat((4 - b64url.length % 4) % 4);
  const raw = atob((b64url + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, ch => ch.charCodeAt(0));
}
// the composer's typed formatting, the one choice this page holds that the
// board's own settings hold too. the mark writes straight through to it
{
  const format = document.getElementById("setformat");
  format.checked = ComposeFormat.enabled();
  format.addEventListener("change", () => ComposeFormat.setEnabled(format.checked));
  ComposeFormat.onChange(on => { format.checked = on; });
}
// the editor it is drawn with is fetched once, early, so the row is already
// wearing it by the time anybody types in it
ComposeFormat.preload();
const diagnosticButton = document.getElementById("savediagnostic");
let diagnosticRetry = false, diagnosticToastTimer = null;
async function saveDiagnostic(source = "settings"){
  if (diagnosticButton.disabled) return;
  diagnosticButton.disabled = true;
  const status = document.getElementById("diagnosticstatus");
  const toast = document.getElementById("diagnostictoast");
  const tell = text => {
    status.textContent = text;
    if (source === "shortcut") toast.textContent = text;
  };
  clearTimeout(diagnosticToastTimer);
  tell(tracePhone("version") >= 3 && !diagnosticRetry
    ? "Recording the next 20 seconds before saving" : "Saving diagnostic history");
  try {
    const answer = await tracePhone("mark", source, phoneTraceState(), diagnosticRetry);
    const outcome = answer?.status || "failed";
    diagnosticRetry = outcome !== "saved" && outcome !== "saved-legacy";
    const messages = {
      saved: "Diagnostic history saved on the Mac.",
      "saved-legacy": "History saved, but Enter or scroll details need the updated server. Restart Facilitator, then record again.",
      offline: "Offline. History is held in this page. Reconnect and retry.",
      limited: "Too many saves this minute. History is held in this page. Retry shortly.",
      failed: "Could not confirm a save. Keep this page open and retry.",
    };
    tell(messages[outcome] || messages.failed);
  } catch (_) {
    diagnosticRetry = true;
    tell("Could not confirm a save. Keep this page open and retry.");
  } finally {
    diagnosticButton.disabled = false;
    diagnosticButton.textContent = diagnosticRetry ? "Retry diagnostic save" : "Save diagnostic history";
    diagnosticToastTimer = setTimeout(() => { toast.textContent = ""; }, 6000);
  }
}
diagnosticButton.addEventListener("click", () => saveDiagnostic());
// the Notifications switch is on while this phone is subscribed: push allowed
// for the page and a subscription held by its worker. on asks and subscribes;
// off takes the subscription away at both ends, so nothing more can arrive
const notifySwitch = document.getElementById("notify");
const notifyNote = document.getElementById("notifynote");
function notifyState(on, note){
  notifySwitch.checked = !!on;
  notifyNote.textContent = note || "";
}
async function pushRegistration(){
  if (!("serviceWorker" in navigator)) return null;
  return swReg || navigator.serviceWorker.ready.catch(() => null);
}
async function sendSubscription(sub){
  const r = await fetch("/push/subscribe", { method: "POST", body: JSON.stringify(sub.toJSON()) });
  if (!r.ok) throw new Error("subscribe " + r.status);
}
// what the phone holds now, asked of its worker without waiting for one that
// never registered
async function pushSubscription(){
  if (!("PushManager" in window) || !("serviceWorker" in navigator)) return null;
  try {
    const reg = swReg || await navigator.serviceWorker.getRegistration("/m");
    return (await reg?.pushManager.getSubscription()) || null;
  } catch (_) { return null; }
}
async function notifyOn(){
  return "Notification" in window && Notification.permission === "granted" && !!(await pushSubscription());
}
async function askNotifications(){
  if (!("PushManager" in window) || !("Notification" in window)){
    notifyState(false, "Add this page to the home screen first, then ask again from there");
    return;
  }
  const reg = await pushRegistration();
  if (!reg){ notifyState(false, "Notifications need the page served over https"); return; }
  const permission = await Notification.requestPermission();
  if (permission !== "granted"){ notifyState(false, "Notifications are off in the phone's settings for this page"); return; }
  let sub = null;
  try {
    const key = (await (await fetch("/push/key")).json()).key;
    sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(key) });
    await sendSubscription(sub);
    notifyState(true, "");
  } catch (err) {
    // a subscription the board never took is let go, so off is what it says
    try { await sub?.unsubscribe(); } catch (_) {}
    notifyState(false, "Could not subscribe: " + (err && err.message ? err.message : err));
  }
}
async function stopNotifications(){
  const sub = await pushSubscription();
  if (sub){
    try { await fetch("/push/unsubscribe", { method: "POST", body: JSON.stringify({ endpoint: sub.endpoint }) }); } catch (_) {}
    try { await sub.unsubscribe(); } catch (_) {}
  }
  notifyState(await notifyOn(), "");
}
notifySwitch.addEventListener("change", async () => {
  notifySwitch.disabled = true;
  try { await (notifySwitch.checked ? askNotifications() : stopNotifications()); }
  finally { notifySwitch.disabled = false; }
});
// it reads what the phone holds each time the panel comes out, so a permission
// taken away in the phone's own settings shows as off
{
  let shown = false;
  new MutationObserver(async () => {
    const was = shown;
    shown = settings.classList.contains("live");
    if (!shown || was || notifySwitch.disabled) return;
    const on = await notifyOn();
    if (!notifySwitch.disabled) notifySwitch.checked = on;
  }).observe(settings, { attributes: true, attributeFilter: ["class"] });
}
// a phone already subscribed says so, and hands the server its subscription
// again so a board whose state was reset learns it back
(async () => {
  if (!("PushManager" in window)) return;
  const reg = await pushRegistration();
  if (!reg) return;
  try {
    const sub = await reg.pushManager.getSubscription();
    if (sub && Notification.permission === "granted"){ await sendSubscription(sub); notifyState(true, ""); }
  } catch (err) {}
})();
</script>

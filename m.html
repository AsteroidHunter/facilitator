<script>
// the turn off mark asks before it signs out. Cancel and Escape put the
// question away and change nothing; Log Out lets it fade, then signs out. while
// it is up, a finger on it pulls nothing under it and a key pressed in it goes
// no further
const signoutAsk = document.getElementById("signoutask");
let signoutAskTimer = 0;
function askSignOut(){
  clearTimeout(signoutAskTimer);
  signoutAsk.classList.remove("leaving");
  signoutAsk.hidden = false;
  signoutAsk.classList.add("entering");
  void signoutAsk.offsetWidth;   // drawn once at the start, so the settle runs from it
  signoutAsk.classList.remove("entering");
  document.getElementById("signoutno").focus({ preventScroll: true });
}
function putSignOutAskAway(then){
  clearTimeout(signoutAskTimer);
  signoutAsk.classList.add("leaving");
  signoutAskTimer = setTimeout(() => {
    signoutAsk.hidden = true;
    signoutAsk.classList.remove("leaving");
    if (then) then();
    else document.getElementById("signout").focus({ preventScroll: true });
  }, 200);
}
document.getElementById("signout").addEventListener("click", askSignOut);
document.getElementById("signoutno").addEventListener("click", () => putSignOutAskAway());
document.getElementById("signoutyes").addEventListener("click", () => putSignOutAskAway(signOut));
for (const type of ["touchstart", "mousedown"])
  signoutAsk.addEventListener(type, e => e.stopPropagation(), { passive: true });
signoutAsk.addEventListener("keydown", e => {
  e.stopPropagation();
  if (e.key === "Escape"){ e.preventDefault(); putSignOutAskAway(); }
});
async function signOut(){
  const button = document.getElementById("signout");
  const note = document.getElementById("signoutnote");
  button.disabled = true;
  note.textContent = "";
  try {
    try {
      const registration = await navigator.serviceWorker?.getRegistration("/m");
      const subscription = await registration?.pushManager?.getSubscription();
      if (subscription) {
        await fetch("/push/unsubscribe", { method: "POST", body: JSON.stringify({ endpoint: subscription.endpoint }) });
        await subscription.unsubscribe();
      }
    } catch (_) {} // the session gate also stops push when this session ends
    const response = await fetch("/auth/logout", { method: "POST", cache: "no-store" });
    if (!response.ok) throw new Error("sign out failed");
    try {
      const registration = await navigator.serviceWorker?.getRegistration("/m");
      const notifications = await registration?.getNotifications();
      for (const notification of notifications || [])
        if (notification.tag?.startsWith("facilitator-")) notification.close();
    } catch (_) {}
    try { for (const key of ["pendops", "selbox", "activeproj", "homeopen"]) localStorage.removeItem(key); } catch (_) {}
    try { for (const key of await caches.keys()) if (key.startsWith("facilitator-m-")) await caches.delete(key); } catch (_) {}
    location.replace("/m");
  } catch (_) {
    note.textContent = "Could not sign out. Check your connection and try again.";
    button.disabled = false;
  }
}
// the phone is where a failure is hardest to reproduce, so it reports the same
// way the board does: thrown errors, failed fetches, failed renders
if (typeof startReporter === "function") startReporter("phone");
// A diagnostic token, not a release claim: it distinguishes this instrumented
// page from an older installed shell without exposing a URL or local path.
// This names the loaded HTML only; the worker reports its own cache identity.
const PHONE_DIAGNOSTIC_BUILD = "phone-scroll-diag-20260922-1";
tracePhone("identity", PHONE_DIAGNOSTIC_BUILD);
// the marker a freeze report carries; it goes nowhere if the reporter is absent
if (typeof noteDoing !== "function") window.noteDoing = () => {};
// The recorder is optional and every call is isolated from the phone's work.
function tracePhone(action, ...args){
  try { return window.phoneHistory?.[action](...args); } catch (_) {}
}
function traceFrameOpportunity(action){
  if (tracePhone("version") < 3) return;
  requestAnimationFrame(() => {
    tracePhone("note", "phase", { action, part: "frame-one" });
    requestAnimationFrame(() => tracePhone("note", "phase", { action, part: "frame-two" }));
  });
}
function phoneTraceState(){
  try {
    const el = selectedId && els[selectedId];
    const b = lastState?.boxes.find(box => box.id === selectedId);
    const paneBlank = document.getElementById("pane").classList.contains("blank");
    const editor = !!el?.field;
    const editorReady = !!el?.field && (!el.field.formatted() || !!el.field.view);
    const shown = !!el?.box.classList.contains("sel") && !paneBlank;
    const inputReady = shown && !!el?.titleEl.isConnected && el.titleEl.isContentEditable;
    return { box: selectedId, selected: selectedId, known: !!b, present: !!el?.box.isConnected,
      shown,
      title: !!el?.titleEl.isConnected, titled: !!b?.title, emptyTitle: !el?.titleEl.textContent,
      editing: !!el?.titleEl.isContentEditable, boxes: document.getElementById("cards").childElementCount,
      kb: document.body.classList.contains("kb"), lifting: document.body.classList.contains("lifting"),
      editor, editorReady, inputReady, selectedDom: !!el?.box.classList.contains("sel"), paneBlank,
      loading: !!document.getElementById("loading"), connected: !!el?.box.isConnected,
      formatted: !!el?.field?.formatted(), active: document.activeElement === el?.titleEl || !!(el && ComposeFormat.focused(el.ta)) };
  } catch (_) { return {}; }
}
function endPhoneTrace(token, detail, response, inspect = false){
  try { tracePhone("end", token, inspect ? { ...phoneTraceState(), ...detail } : detail, response); } catch (_) {}
}
// ---- what the desktop card carries, at phone size ---------------------------
const PLUS_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>';
const SEND_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 11.5V3.5M3.6 6.9 7 3.5l3.4 3.4" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
const CHEV_PATH = '<path d="M1 5.5 5.5 1.5 10 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
const chevSVG = seat => '<svg class="chev ' + seat + '" width="11" height="7" viewBox="0 0 11 7" fill="none" aria-hidden="true">' + CHEV_PATH + "</svg>";

const els = {};                 // box id -> the card's parts
let lastState = null;
let pollFails = 0;
let selectedId = localStorage.getItem("selbox") || null;
let shownId = null;             // the card the page is actually showing, so a selection that changed without a tap can be noticed
let browsing = false;           // the card on screen is only browsed to, not selected: see setBrowsing
let activeOwner = localStorage.getItem("activeproj") || "facilitator";
let validOwners = new Set();
// the drawer's tab (doing, deferred, done) is one choice per project and lives
// in card-logic.js; curView() answers with the open project's own
const lastSel = {};             // owner -> the card that was open when that tab was left
let pendingFocus = null;        // a card just made: name it as soon as it is drawn
let wantBox = new URLSearchParams(location.search).get("box");   // a notification opened the page on this card
let homeOpen = false;           // the house's page is up over the card (the home page, below)

// the card's helpers, the one state a card's colour and place come from, the
// lanes and the times are shared with the desktop: card-logic.js

// ---- the two numbers the card's fades are cut to -------------------------------
// the desktop's own measures, restated here rather than shared: they are the
// desktop page's script and this page may not write in it. the rules they feed
// are the desktop's rules, so a change to either page's ramp has to be made in
// both, and the numbers themselves live in the sheet where both can read them.
//
// how deep the sent box and the typing row stand over the answer, written on the
// answer as --boxband. it is measured to the wrapper's top edge less the answer's
// own clear air, so the white the ramp ends on is the same white every other card
// leaves. whole pixels: this becomes a gradient stop, and chrome paints a stop
// asked for at a whole number where it was asked and at a fraction not quite
// there
function boxBand(reply, wrap){
  const clear = parseFloat(getComputedStyle(reply).marginBottom) || 0;
  const b = reply.getBoundingClientRect().bottom -
            (wrap.getBoundingClientRect().top - clear);
  return Math.max(0, Math.round(b));
}
// a ResizeObserver and not a hook on each send: it delivers after layout and
// before paint on every frame the wrapper's height changes, a sent panel coming
// or going, the row growing, the keyboard, so the ramp's top edge and the
// panel's top edge are the same line on every frame rather than one frame behind it
function watchBand(el){
  // --boxband is what the sent panel and the typing row cover at the foot of the
  // answer. it is written on the CARD and the answer inherits it, so every rule
  // that reads --boxband reads the number it always read.
  // it is written only when it changes, so a fire that finds the band where it
  // was leaves the card's style alone.
  // while the sent panel runs, the band is held at one end of the run rather
  // than following it (sentBand in card-logic.js), so a run writes it once
  let lastBand = null;
  const write = () => {
    const band = sentBand(el, boxBand(el.replyview, el.pendwrap));
    if (band !== lastBand){ lastBand = band; el.box.style.setProperty("--boxband", band + "px"); }
  };
  el.bandWrite = write;
  // the write is coalesced onto the next frame, outside the observer's own
  // delivery: one write a frame, and the dedupe above settles it once sizes
  // hold
  let scheduled = false;
  const schedule = () => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      const started = performance.now();
      try { write(); } finally { tracePhone("observerSample", performance.now() - started); }
    });
  };
  if (window.ResizeObserver){
    const ro = new ResizeObserver(schedule);
    ro.observe(el.pendwrap);
    ro.observe(el.replyview);
    // the card's own room changes with the keyboard and with the window, which
    // need not touch either of the two above
    if (el.replyview.parentElement) ro.observe(el.replyview.parentElement);
  }
  write();
}
// how much of the answer has gone up out of sight, written back on it as
// --upband, which is the depth the ramp under the title is cut to. capped at the
// ramp's own depth, read off --replyfade on the element rather than typed here.
// the read is kept on the node once it lands, but never an empty read: the value
// is written on the shown card and a card is built before it is shown, so the
// first read on a fresh card comes back with nothing and has to be taken again
function riseBand(node){
  if (!node._fade){
    const fade = parseFloat(getComputedStyle(node).getPropertyValue("--replyfade")) || 0;
    if (fade) node._fade = fade;
  }
  const up = Math.min(Math.round(node.scrollTop), node._fade || 0);
  if (up === node._up) return;
  node._up = up;
  node.style.setProperty("--upband", up + "px");
}
// armed on the scroll itself, passive, since all it does is read a number the
// scroll has already settled and hand it to a gradient. once at the start too,
// so a card opened part way down opens with the right band
function watchRise(node){
  node.addEventListener("scroll", () => {
    const started = performance.now();
    riseBand(node);
    const ms = performance.now() - started;
    if (ms >= 8) tracePhone("note", "phase", { action: "response-scroll", part: "handler", ms });
  }, { passive: true });
  riseBand(node);
}

// ---- the card ----------------------------------------------------------------
function makeBox(b){
  noteDoing("card");
  const box = h("article", "box");
  box.id = "box-" + b.id;

  const topbar = h("div", "topbar");
  const histctl = h("div", "histctl");
  const histUp = h("button", "histbtn older");
  histUp.type = "button"; histUp.title = "older reply"; histUp.setAttribute("aria-label", "older reply");
  histUp.innerHTML = chevSVG("");
  const histDown = h("button", "histbtn newer");
  histDown.type = "button"; histDown.title = "newer reply"; histDown.setAttribute("aria-label", "newer reply");
  histDown.innerHTML = chevSVG("");
  histDown.disabled = true;
  const histPos = h("span", "histpos");
  histctl.append(histUp, histDown, histPos);
  histUp.addEventListener("click", () => histStep(b.id, 1));
  histDown.addEventListener("click", () => histStep(b.id, -1));
  const arc = h("button", "arcbtn");
  arc.type = "button"; arc.title = "defer to the deferred tab\n" + SECTION_KEY_HINTS.deferred; arc.setAttribute("aria-label", "defer");
  arc.innerHTML = MOON_ICON;
  arc.addEventListener("click", e => { e.stopPropagation(); if (!chipOff(arc)) toggleFlag(b.id, "park"); });
  const x = h("button", "xbtn");
  x.type = "button"; x.title = "done (an empty card is removed instead)\n" + SECTION_KEY_HINTS.done; x.setAttribute("aria-label", "close");
  x.addEventListener("click", e => { e.stopPropagation(); if (!chipOff(x)) closeCard(b.id); });
  // the sun on the moon's left, so the three read in the order of the tabs
  const sun = sunChip("sunbtn", b.id);
  topbar.append(histctl, sun, arc, x);
  // the working spinner follows the sun, and the bar's grid seats it in the
  // sun's own cell; apply() turns it on with the ticket's own green
  const cardSpin = makeCardSpinner();
  topbar.insertBefore(cardSpin, arc);
  box.appendChild(topbar);

  const head = h("div", "head");
  const titleEl = h("span", "title", omniCardTitle(b.title));   // Omni Card #N on the card itself
  titleEl.addEventListener("click", () => { if (!titleEl.isContentEditable) editTitle(b.id, { fromClick: true }); });
  head.appendChild(titleEl);
  box.appendChild(head);

  const body = h("div", "body");
  // the answer's own scroller: the box holding what the answer was given and the
  // answer itself ride inside it, so the box leaves under the title as the reader
  // scrolls down exactly as the first paragraphs do
  const replyview = h("div", "replyview");
  const reply = h("div", "reply cardmd");
  reply.dataset.raw = replyFull(b);
  reply.innerHTML = fmt(reply.dataset.raw);
  // the seat the panel holding what this answer was given is mounted into. it is
  // built with the card and stands empty until the board has a batch to show
  // for the reply the card is showing, so nothing is ever inserted between the
  // title and the answer on the frame the panel arrives
  const answwrap = h("div", "answwrap");
  const pendwrap = h("div", "pendwrap");
  const meta = h("div", "meta");
  // and the seat of the panel of what has been sent and not answered, over the
  // row, empty and taking no room until something is sent
  const sentwrap = h("div", "sentwrap");
  // the files picked for the next message, over the typing row
  const tray = h("div", "tray");
  const bottombar = h("div", "bottombar");
  const clipfile = h("input", "clipfile");
  clipfile.type = "file";
  clipfile.accept = CardMarkdown.ATTACHMENT_ACCEPT;
  clipfile.multiple = true;
  clipfile.tabIndex = -1;
  clipfile.setAttribute("aria-hidden", "true");
  const clip = h("button", "clipbtn");
  clip.type = "button"; clip.title = "attach a file"; clip.setAttribute("aria-label", "attach a file");
  clip.innerHTML = PLUS_ICON;
  const compose = h("div", "compose");
  const ta = h("textarea");
  ta.rows = 1;
  // the mark the caret-reveal blink and the per-keystroke re-arm read, so
  // whichever field is focused, this plain one or the editor content standing in
  // for it, is the one the reveal is kept off. the editor marks its content too
  ta.setAttribute("data-owned-focus", "");
  const send = h("button", "sendbtn");
  send.type = "button"; send.setAttribute("aria-label", "send");
  send.innerHTML = SEND_ICON;
  const twin = h("textarea", "twin");
  twin.rows = 1; twin.tabIndex = -1; twin.readOnly = true; twin.setAttribute("aria-hidden", "true");
  compose.append(ta, send, twin);
  bottombar.append(clipfile, clip, compose);
  pendwrap.append(meta, sentwrap, tray, bottombar);
  // the column: the scroller holding the answered panel over the answer, and laid
  // over the answer at the card's floor the sent panel and the typing row
  replyview.append(answwrap, reply);
  body.append(replyview, pendwrap);
  // the clip box the body lifts inside: the body rises under the card header on
  // a transform and this cuts it there, without being a scroll container
  const liftclip = h("div", "liftclip");
  liftclip.appendChild(body);
  box.appendChild(liftclip);
  // first in #cards: the keyboard's word lookup at an empty title walks back through every card ahead of it
  document.getElementById("cards").prepend(box);

  // the row's typed formatting, on when the setting says so. it is
  // wired before anything is hung on the field, because the field keeps one
  // public face whichever of the two it is wearing and the handle is what
  // carries a listener across a change of face. what counts as a new line here
  // is the row's own pair: shift enter, and the return key while the on-screen
  // keyboard is up, which is where return has always made a line. the row is
  // held: it wears the editor only while its card is in reach (wearEditor)
  const createDiagnostic = [...createDiagnostics.values()].find(diagnostic => diagnostic.box === b.id);
  const editorTrace = createDiagnostic
    ? tracePhone("begin", "stage", { stage: "editor-init", box: b.id }) : null;
  const field = ComposeFormat.attach(ta, {
    held: true,
    newline: e => e.shiftKey || document.body.classList.contains("kb"),
    enterTrace: (step, e, branch) => notePhoneEnter(step, e, branch, ta),
  });
  if (editorTrace) endPhoneTrace(editorTrace, { stage: "editor-init", box: b.id,
    editor: true, editorReady: !field.formatted() || !!field.view, formatted: field.formatted() });
  // DOM/editor insertion is complete here. Selection and title focus happen
  // later, after apply has finished drawing this card's remaining state.
  if (createDiagnostic?.insertion){
    endPhoneTrace(createDiagnostic.insertion, { stage: "card-insertion", box: b.id,
      present: box.isConnected, editor: true, editorReady: !field.formatted() || !!field.view });
    createDiagnostic.insertion = null;
    createDiagnostic.selected = tracePhone("begin", "stage", { stage: "selected-ready", box: b.id });
  }

  // the row grows to its text, measured on the twin (fitRow), and the line
  // under the caret is brought into view after every keystroke and on focus
  // (revealCaret); the blink keeps the phone from scrolling the page for the
  // caret on a keystroke while the keyboard is up, and on any grown line
  const tick = typed => {
    const grew = fitRow(ta, twin);
    if (ComposeFormat.focused(ta) && (grew || (typed && document.body.classList.contains("obstructed")))) blinkRow(ta);
    revealCaret(ta, twin);
    seatSquare(ta, send);
    send.classList.toggle("show", ta.value.trim().length > 0 || traySendable(els[b.id]) || phoneArrowAgainFor(b.id));
  };
  ta.addEventListener("input", () => {
    clearPhoneEnterAgain();
    // the moment of the last key, which is what holds a new answer back while
    // the reader is typing (turnHolding in card-logic.js)
    noteTyping(ta);
    tick(true);
  });
  ta.addEventListener("focus", () => {
    const trace = tracePhone("begin", "focus", { box: b.id });
    requestAnimationFrame(() => {
      revealCaret(ta, twin);
      endPhoneTrace(trace, { box: b.id }, null, true);
    });
  });
  // a tap into the row or a key typed there is using the card, so it is read
  readOnCompose(ta, b.id, useCard);
  ta.addEventListener("mousedown", e => takeFocusTap(e, ta));
  // enter sends and shift enter makes a new line, the desktop composer's pair,
  // and only while the on-screen keyboard is down. a phone puts that keyboard
  // away when a keyboard is paired with it, so a row being typed in with no
  // keyboard on screen is a row being typed on by hand, where the desktop's
  // habit belongs. with the on-screen keyboard up the return key still makes a
  // new line, as it always has here, and the square is still the way to send
  ta.addEventListener("keydown", e => {
    if (e.key !== "Enter") {
      if (e.code === "Enter" || e.code === "NumpadEnter" || e.keyCode === 13)
        notePhoneEnter("handler", e, "other-key", ta);
      return;
    }
    if (e.shiftKey) { notePhoneEnter("handler", e, "shift", ta); return; }
    if (e.altKey) { notePhoneEnter("handler", e, "modifier", ta); return; }
    if (e.isComposing) { notePhoneEnter("handler", e, "composition", ta); return; }
    // control+enter is a double Enter pressed at once, and no on-screen
    // keyboard has the key, so it answers whether or not that keyboard is up
    const now = controlEnter(e);
    if (!now && document.body.classList.contains("kb")) { notePhoneEnter("handler", e, "keyboard", ta); return; }
    e.preventDefault();
    if (e.repeat) { notePhoneEnter("handler", e, "repeat", ta); return; }
    const hadDraft = !!ta.value.trim() || traySendable(els[b.id]);
    if (!hadDraft){
      if (!askPhoneEnterAdvance(b.id)){
        cancelAutoNext();
        if (now) phoneAdvance(b.id);
      }
      notePhoneEnter("handler", e, "empty", ta);
      return;
    }
    const op = doSend(b.id, { advance: false });
    notePhoneEnter("handler", e, op ? "send" : "held", ta, !!op, hadDraft);
    if (op){
      armPhoneEnterAgain(b.id, op);
      if (now) askPhoneEnterAdvance(b.id);
    }
  });
  // fitted again once the web faces have landed. their sheets are asked for off
  // the first paint, so they can still be on the way here, and a plain
  // document.fonts.ready asked before they arrive answers at once
  webFacesLanded().then(() => tick());
  tick();
  send.addEventListener("pointerdown", e => {
    tracePhone("note", "send", { box: b.id });
    if (ComposeFormat.focused(ta)) e.preventDefault();
  });
  send.addEventListener("click", () => composerArrow(b.id));
  // a tap that comes down while the last picker is still being taken down is
  // held whole, its click included (the file picker's session, after makeBox)
  let plusHeld = false;
  clip.addEventListener("pointerdown", e => {
    plusHeld = pickPhase === "closing";
    if (plusHeld || ComposeFormat.focused(ta)) e.preventDefault();
  });
  // picked, pasted or dropped, a file goes into the tray and starts uploading
  wireAttachmentTransfer(ta, files => trayAdd(b.id, files));
  clip.addEventListener("click", () => {
    const held = plusHeld;
    plusHeld = false;
    if (!held && pickPhase !== "closing") pickOpen(clipfile);
  });
  clipfile.addEventListener("cancel", pickSettle);
  clipfile.addEventListener("change", () => {
    pickSettle();
    const files = [...(clipfile.files || [])];
    clipfile.value = "";
    trayAdd(b.id, files);
  });

  const card = els[b.id] = { box, body, reply, replyview, meta, ta, twin, send, tick, titleEl, sun, arc, x, pendwrap, bottombar,
                cardSpin, histUp, histDown, histPos, clip, clipfile, field,
                // the tray's files, in the order they were picked, and a send
                // pressed while some were still uploading (trayAdd below)
                tray, trayItems: [], trayHold: null,
                // answ is null until the card shows a reply the board recorded a
                // batch for, and null again the moment it shows one it did not.
                // answId is the name of the reply the panel is drawn for, which
                // is what a poll compares against
                answwrap, answ: null, answId: null,
                // sent is null until something is sent and null again the moment
                // the answer to it lands. sentItems is what the board has
                // confirmed of it, each message with where it stands with the
                // agent; what it has not confirmed yet is this phone's own and
                // is drawn after it (drawSent)
                sentwrap, sent: null, sentKey: "", sentItems: [] };
  // the sent panel's room: the band it holds still for a run is written again
  // once the run has landed, which no size the band's watch sees changes
  card.sentRoom = () => card.bandWrite && card.bandWrite();
  syncOmniCard(els[b.id], b);
  paintSectionChips(els[b.id], b);
  // the two fades: the band the sent panel and the bar stand in, and the band
  // the answer has scrolled away under the title
  watchBand(els[b.id]);
  watchRise(replyview);
  // and the reader's own scrolling of the answer, which holds a page turn back
  watchReading(els[b.id]);
  return els[b.id];
}

// ---- the file picker's session ---------------------------------------------------
// the phone's picker only looks gone the moment it is dismissed or a file is
// chosen. the phone goes on taking it down for up to two seconds more, until
// the window has its focus back, and a file input clicked in that stretch opens
// nothing, with no error and no event: a plus tapped again that soon is a dead
// tap, every other tap for a quick hand. no click in the stretch can be made to
// open it, neither one put off to the window's focus nor one made on a new
// input, so the plus waits the stretch out where it can be seen. it dims on the
// tap that opens the picker and comes back once the window is handed back, and
// a tap on it in between is held. the input's own cancel and change come at the
// dismissal, before the phone is done, so they only mark the close; the
// window's focus, or the page shown or made visible again, ends it, and a clock
// ends a close that nothing else ends
const PICK_GUARD_MS = 250;     // a close this soon after an open is the last picker's, arriving late
const PICK_CLOSE_MS = 2500;    // the longest a close holds the plus
let pickPhase = "idle", pickOpenedAt = 0, pickClosingAt = 0;
function pickOpen(input){
  pickPhase = "open";
  pickOpenedAt = performance.now();
  input.click();
  document.body.classList.add("picking");
}
// the picker is off the screen, though the phone may still be taking it down
function pickSettle(){
  if (pickPhase !== "open" || performance.now() - pickOpenedAt < PICK_GUARD_MS) return;
  pickPhase = "closing";
  pickClosingAt = performance.now();
  setTimeout(() => {
    if (pickPhase === "closing" && performance.now() - pickClosingAt >= PICK_CLOSE_MS) pickEnd();
  }, PICK_CLOSE_MS + 50);
}
function pickEnd(){
  pickPhase = "idle";
  document.body.classList.remove("picking");
}
// the phone has handed the window back
function pickBack(){
  pickSettle();
  if (pickPhase === "closing") pickEnd();
}
window.addEventListener("focus", pickBack);
window.addEventListener("pageshow", pickBack);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pickBack(); });
// a tap on the page means the picker is off the screen
document.addEventListener("pointerdown", pickSettle, { capture: true, passive: true });

// ---- the files picked for the next message ---------------------------------------
// a picked file goes into the tray over the typing row at once, as a square that
// stands from the tap, and starts uploading while the words are typed, one file
// at a time in the order they were picked. the square carries the state alone,
// with no words anywhere: the upload's ring while it goes, and a red mark when
// it did not. a file the board refuses wears the mark and is not tried again;
// one that did not get through is tried again on its own a few times, then wears
// the mark and waits for a tap. the message carries
// the files the way the board keeps them, as /uploads lines ahead of the words,
// and a send pressed while a file is still on its way waits for it in the row:
// nothing goes without its files, and nothing leaves the row before it can go.
// the tray moves on one beat, 400ms on a curve that leaves fast and settles
// slowly: a square slides a short way in from the left as it arrives, one taken
// out shrinks and fades while the rest close the gap, and the tray eases shut
// under the last one.
// a try that did not get through, which says nothing about the file, is tried
// again on its own, on the same backoff the messages use, a few times, and at
// once when the app comes back to the screen or back online. before a file is
// sent again the board is asked whether the last try landed after all, under
// the file's operation id, so a reply lost on the way never costs the phone the
// whole file again, and never leaves a second copy on the board
const TRAY_TRIES = 5;                 // tries in a round before the file waits for a tap
const TRAY_QUIET_MS = 75000;          // no progress this long and the try is given up
const TRAY_MS = 400;
const TRAY_EASE = "cubic-bezier(.22,1,.36,1)";
const TRAY_SLIDE_PX = 18;             // a short hop beside a 64px square, with no visible origin
const TRAY_PREVIEW_PX = 192;          // a picture's preview width: sharp at 3x in a 64px square
const TRAY_RING = 65.97;              // the ring's length, twice pi times its 10.5px radius
const TRAY_REFUSED = new Set([400, 401, 403, 413, 415]);   // the board decided about this file
const TRAY_X = '<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M1 1l6 6M7 1L1 7" ' +
  'stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

function trayBeat(){
  const calm = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
  return { duration: calm ? 0 : TRAY_MS, easing: TRAY_EASE };
}
function trayMoving(it){ return it.state === "up" || it.state === "queued" || it.state === "wait"; }
function trayBusy(el){ return !!el && el.trayItems.some(trayMoving); }
// something in the tray can go with a message: uploaded, or still on its way
function traySendable(el){ return !!el && el.trayItems.some(it => it.state === "done" || trayMoving(it)); }
// sizes the way the phone's own Files app writes them: KB under a megabyte
function traySize(bytes){
  return bytes < 1e6 ? Math.max(bytes ? 1 : 0, Math.round(bytes / 1e3)) + " KB" : (bytes / 1e6).toFixed(1) + " MB";
}

function trayAdd(id, files){
  const el = els[id];
  if (!el || !files.length) return;
  el.trayCard = id;
  trayOpen(el);
  for (const file of files){
    const info = CardMarkdown.attachmentFile(file);
    const it = { key: newOpId(), file, name: info.name, kind: info.kind || "document",
      ext: (info.ext || (/\.([a-z0-9]+)$/i.exec(info.name) || [])[1] || "file").toUpperCase(),
      total: file.size, sent: 0, tries: 0, measured: false, urls: [],
      state: info.error ? "refused" : "queued" };
    el.trayItems.push(it);
    traySquare(el, it);
    it.sq.animate([{ opacity: 0, transform: "translateX(-" + TRAY_SLIDE_PX + "px)" },
                   { opacity: 1, transform: "none" }], trayBeat());
    if (!info.error) trayPreview(it);
  }
  trayDraw(el);
  trayPump(el);
  el.tick();
}

// the tray stands again: a close still running is called off, and whatever it
// was taking away goes at once
function trayOpen(el){
  const tray = el.tray;
  if (el.trayClosing){ const run = el.trayClosing; el.trayClosing = null; run.cancel(); }
  for (const sq of [...tray.querySelectorAll(".tsq")])
    if (!el.trayItems.some(it => it.sq === sq)) sq.remove();
  tray.classList.remove("closing");
  tray.classList.add("on");
}

function traySquare(el, it){
  const sq = h("div", "tsq");
  const face = h("div", "tsqface");
  const kind = h("span", "tsqkind", it.ext);
  kind.appendChild(h("small", "", traySize(it.total)));
  const veil = h("span", "tsqveil");
  const ring = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  ring.setAttribute("class", "tsqring");
  ring.setAttribute("viewBox", "0 0 24 24");
  ring.setAttribute("aria-hidden", "true");
  ring.innerHTML = '<circle class="track" cx="12" cy="12" r="10.5"/><circle class="arc" cx="12" cy="12" r="10.5"/>';
  const bang = h("span", "tsqbang", "!");
  bang.setAttribute("aria-hidden", "true");
  face.append(kind, veil, ring, bang);
  const x = h("button", "tsqx");
  x.type = "button"; x.setAttribute("aria-label", "take " + it.name + " out");
  x.innerHTML = TRAY_X;
  sq.append(face, x);
  sq.setAttribute("role", "img");
  // a tap inside the row keeps the keyboard where it is, as the plus does
  x.addEventListener("pointerdown", e => { if (ComposeFormat.focused(el.ta)) e.preventDefault(); });
  x.addEventListener("click", e => { e.stopPropagation(); trayRemove(el, it); });
  face.addEventListener("click", () => trayRetry(el, it));
  Object.assign(it, { sq, face, veil, arc: ring.querySelector(".arc") });
  el.tray.appendChild(sq);
}

// the picture a square wears: a photo decoded small on the side where the
// engine can, which is a fraction of the work of the whole photo, else the
// photo itself; a video's first frame; anything else keeps its kind and size
async function trayPreview(it){
  if (it.kind !== "image" && it.kind !== "video") return;
  let pic;
  if (it.kind === "image"){
    let url = null;
    try {
      if (typeof createImageBitmap === "function"){
        const bitmap = await createImageBitmap(it.file, { resizeWidth: TRAY_PREVIEW_PX, resizeQuality: "medium" });
        const canvas = document.createElement("canvas");
        canvas.width = bitmap.width; canvas.height = bitmap.height;
        canvas.getContext("2d").drawImage(bitmap, 0, 0);
        if (bitmap.close) bitmap.close();
        const blob = await new Promise(resolve => canvas.toBlob(resolve));
        if (blob) url = URL.createObjectURL(blob);
      }
    } catch (e) {}   // this engine cannot draw this file small: the whole file then
    if (it.gone){ if (url) URL.revokeObjectURL(url); return; }
    if (!url) url = URL.createObjectURL(it.file);
    it.urls.push(url);
    pic = new Image();
    pic.alt = "";
    pic.onload = () => it.sq.classList.add("drawn");
    pic.src = url;
  } else {
    const url = URL.createObjectURL(it.file);
    it.urls.push(url);
    pic = document.createElement("video");
    pic.muted = true; pic.playsInline = true; pic.preload = "metadata";
    pic.addEventListener("loadeddata", () => it.sq.classList.add("drawn"), { once: true });
    pic.src = url + "#t=0.1";
  }
  pic.className = "tsqpic";
  pic.setAttribute("aria-hidden", "true");
  it.face.insertBefore(pic, it.veil);
}

// one upload at a time per card, in the order the files were picked
function trayPump(el){
  if (el.trayItems.some(it => it.state === "up")) return;
  const next = el.trayItems.find(it => it.state === "queued");
  if (next) trayUpload(el, next);
}

function trayUpload(el, it){
  it.state = "up"; it.sent = 0; it.measured = false; it.tries++;
  if (it.posted) trayAsk(el, it);
  else trayPost(el, it);
}

// the board is asked whether the file's last try landed after all: its
// receipt answers with the stored file, and only a board with no record of it
// is sent the file again
async function trayAsk(el, it){
  trayDraw(el);
  let answer = null, body = null;
  try {
    answer = await fetch("/upload?op=" + encodeURIComponent(it.key), { signal: AbortSignal.timeout(8000) });
    body = await answer.json();
  } catch (e) {}
  if (it.gone || it.state !== "up" || it.xhr) return;
  if (answer && answer.ok && body && body.url) trayLanded(el, it, 200, body);
  else if (answer && answer.ok && body && body.arriving) trayLanded(el, it, 409, null);
  else if (answer && answer.status === 404) trayPost(el, it);
  else trayLanded(el, it, answer ? answer.status : 0, body);
}

// an XMLHttpRequest and not a fetch: it is the one way a page can hear how
// much of a body has gone. the operation id names this file's upload, so the
// board can tell a second try of it from a new file. once progress has been
// heard, a try that hears none for TRAY_QUIET_MS is given up, since a link can
// die without either end being told
function trayPost(el, it){
  const xhr = new XMLHttpRequest();
  it.xhr = xhr;
  it.posted = true;
  xhr.open("POST", "/upload?name=" + encodeURIComponent(it.name) + "&op=" + encodeURIComponent(it.key));
  const landed = (status, body) => {
    if (it.xhr !== xhr) return;
    it.xhr = null;
    clearTimeout(it.quiet);
    trayLanded(el, it, status, body);
  };
  xhr.upload.onprogress = e => {
    if (it.xhr !== xhr) return;
    it.sent = e.loaded;
    if (e.lengthComputable && e.total) it.total = e.total;
    it.measured = true;
    clearTimeout(it.quiet);
    it.quiet = setTimeout(() => { if (it.xhr === xhr){ xhr.abort(); landed(0, null); } }, TRAY_QUIET_MS);
    trayDraw(el);
  };
  xhr.onload = () => {
    let body = null;
    try { body = JSON.parse(xhr.responseText); } catch (e) {}
    landed(xhr.status, body);
  };
  xhr.onerror = () => landed(0, null);
  xhr.send(it.file);
  trayDraw(el);
}

// how a try ended: stored; refused for good; or not got through, which says
// nothing about the file and is tried again on the messages' backoff until the
// round's tries are spent, then waits for a tap
function trayLanded(el, it, status, body){
  if (it.gone) return;
  if (status === 200 && body && body.url){
    it.state = "done"; it.url = body.url; it.sent = it.total;
  } else if (TRAY_REFUSED.has(status)){
    it.state = "refused";
  } else {
    if (it.tries < TRAY_TRIES){
      it.state = "wait";
      clearTimeout(it.timer);
      it.timer = setTimeout(() => trayAgain(el, it), backoffMs(it.tries));
    } else it.state = "failed";
  }
  trayDraw(el);
  el.tick();
  trayRelease(el);
  trayPump(el);
}
function trayAgain(el, it){
  clearTimeout(it.timer);
  if (it.gone || it.state !== "wait") return;
  it.state = "queued";
  trayDraw(el);
  trayPump(el);
}

// a tap on a file that did not get through starts another round of tries; a
// tap on one waiting out its backoff tries it now
function trayRetry(el, it){
  if (it.gone) return;
  if (it.state === "wait"){ trayAgain(el, it); return; }
  if (it.state !== "failed") return;
  it.state = "queued"; it.tries = 0;
  trayDraw(el);
  el.tick();
  trayPump(el);
}
// the app is on screen again, or the network is back: every file waiting out
// a backoff is tried now, as the messages are
function trayWake(){
  for (const el of Object.values(els))
    for (const it of el.trayItems || []) if (it.state === "wait") trayAgain(el, it);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) trayWake(); });
window.addEventListener("pageshow", trayWake);
window.addEventListener("online", trayWake);

// the cross: the file leaves the tray, and an upload of it still going is let go
function trayRemove(el, it){
  if (it.gone) return;
  trayForget(it);
  el.trayItems = el.trayItems.filter(o => o !== it);
  trayLeave(el, [it]);
  trayDraw(el);
  el.tick();
  trayRelease(el);
  trayPump(el);
}
function trayForget(it){
  it.gone = true;
  clearTimeout(it.timer);
  clearTimeout(it.quiet);
  if (it.xhr){ const xhr = it.xhr; it.xhr = null; xhr.abort(); }
}

// a send pressed while files were still on their way: the words stay in the
// row until the files have landed
function trayHoldSend(id, opts){
  const el = els[id];
  el.trayHold = { advance: opts.advance, wait: new Set(el.trayItems.filter(trayMoving).map(it => it.key)) };
}
// the files a held send waited for have landed: it goes now, or, when one of
// them did not get through, it stays in the row and the square wears its mark
function trayRelease(el){
  const hold = el.trayHold;
  if (!hold) return;
  const waited = el.trayItems.filter(it => hold.wait.has(it.key));
  if (waited.some(trayMoving)) return;
  el.trayHold = null;
  if (waited.some(it => it.state !== "done")) return;
  doSend(el.trayCard, { advance: hold.advance });
}

// the message's text: the pictures on one line and in a paragraph of their
// own, which is what makes two to four of them stand as the card's grid, then
// every other file on a line of its own, then the words
function trayMessage(el, typed){
  const done = el.trayItems.filter(it => it.state === "done");
  const pics = done.filter(it => it.kind === "image").map(it => it.url).join(" ");
  const files = done.filter(it => it.kind !== "image").map(it => it.url).join("\n");
  return [pics, files, typed].filter(Boolean).join("\n\n");
}
// the files that went with a message leave the tray; one that did not upload
// stays, so nothing picked is lost without a word
function trayTake(el){
  const going = el.trayItems.filter(it => it.state === "done");
  if (!going.length) return;
  for (const it of going) trayForget(it);
  el.trayItems = el.trayItems.filter(it => it.state !== "done");
  trayLeave(el, going);
  trayDraw(el);
}

// the leaving squares shrink and fade where they stand. with others staying,
// each leaving one gives up its seat at once and keeps only its picture, and
// the ones after it slide into the room from where they were; with none
// staying, the tray eases its own height shut under them
function trayLeave(el, leaving){
  const tray = el.tray, beat = trayBeat();
  const drop = [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(.8)" }];
  const gone = sq => { for (const url of leaving.find(it => it.sq === sq)?.urls || []) URL.revokeObjectURL(url); sq.remove(); };
  if (!el.trayItems.length){
    const height = tray.offsetHeight;
    const cs = getComputedStyle(tray);
    const pad = parseFloat(cs.paddingTop) || 0, padBottom = parseFloat(cs.paddingBottom) || 0;
    tray.classList.add("closing");
    for (const it of leaving) it.sq.animate(drop, beat);
    const run = tray.animate([{ height: height + "px", paddingTop: pad + "px", paddingBottom: padBottom + "px" },
                              { height: "0px", paddingTop: "0px", paddingBottom: "0px" }], beat);
    el.trayClosing = run;
    const end = () => {
      for (const it of leaving) gone(it.sq);
      if (el.trayClosing !== run) return;
      el.trayClosing = null;
      tray.classList.remove("on", "closing");
    };
    run.finished.then(end, end);
    return;
  }
  const stay = el.trayItems.map(it => it.sq);
  const before = stay.map(sq => sq.getBoundingClientRect());
  const seats = leaving.map(it => it.sq.getBoundingClientRect());
  for (const it of leaving) it.sq.classList.add("leaving");
  const box = tray.getBoundingClientRect();
  leaving.forEach((it, i) => {
    it.sq.style.left = (seats[i].left - box.left) + "px";
    it.sq.style.top = (seats[i].top - box.top) + "px";
  });
  stay.forEach((sq, i) => {
    const after = sq.getBoundingClientRect();
    const dx = before[i].left - after.left, dy = before[i].top - after.top;
    if (Math.abs(dx) > .5 || Math.abs(dy) > .5)
      sq.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }], beat);
  });
  for (const it of leaving){
    const end = () => gone(it.sq);
    it.sq.animate(drop, beat).finished.then(end, end);
  }
}

// every square's dress from its file's state
function trayDraw(el){
  for (const it of el.trayItems){
    for (const state of ["up", "queued", "wait", "done", "failed", "refused"])
      it.sq.classList.toggle(state, it.state === state);
    it.sq.classList.toggle("indet", it.state === "up" && !it.measured);
    it.sq.classList.toggle("tappable", it.state === "failed" || it.state === "wait");
    const measured = it.state === "done" || (it.state === "up" && it.measured);
    it.arc.style.strokeDashoffset = !measured ? ""
      : String(TRAY_RING * (1 - (it.total ? Math.min(1, it.sent / it.total) : 0)));
    it.sq.setAttribute("aria-label", it.name + ": " + trayWords(it));
  }
}
function trayWords(it){
  return it.state === "done" ? "uploaded" : it.state === "refused" ? "not attached" : it.state === "failed" ? "not uploaded"
    : it.state === "wait" ? "waiting to try again" : it.state === "queued" ? "waiting its turn" : "uploading";
}

// a card that has gone takes its tray with it
function trayDrop(el){
  for (const it of el.trayItems){
    trayForget(it);
    for (const url of it.urls) URL.revokeObjectURL(url);
  }
  el.trayItems = [];
  el.trayHold = null;
}

// ---- the sent panel ------------------------------------------------------------
// true when a live selection touches el, so copying a sent line never triggers a
// fold or a row action. intersectsNode catches a cross-boundary pick whose
// commonAncestorContainer sits outside el; collapsed/empty give false.
function boxHasSelection(el){
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return false;
  for (let i = 0; i < sel.rangeCount; i++){
    const r = sel.getRangeAt(i);
    if (!r.collapsed && r.intersectsNode(el)) return true;
  }
  return false;
}
// the panel itself, its arrival, its fold and the page turn that takes it up to
// the head of the card when the answer lands are the desktop's own, shared in
// card-logic.js, and so is the whole of the panel of answered messages above
// the answer. what is this page's own is what the panel is drawn from: the
// messages the board has confirmed, each where it stands (sent, delivered or
// read, the board's own record), and after them this phone's own that the board
// has not confirmed yet, faded like any message the board has not saved, and
// with a badge in its row only when the sending is not getting through.
// arrive is what tells a send from a reading, as it does on the desktop
function sentOf(el, id){
  const batch = el.sentItems.slice();

  return batch;
}
function drawSent(el, id, arrive){
  syncSent(el, sentOf(el, id), arrive);

  // and a panel cut above that row is opened once so the mark is seen
  const warn = localSends(id).filter(o => o.state === "failed" || o.state === "unsure").map(o => o.id).join(",");
  if (warn && warn !== el.sentWarned && panel.classList.contains("more") && !panel.classList.contains("open"))
    openAnswered(panel, true);

}
// what an unconfirmed message wears in its row. a send on its first try wears

// one the phone has stopped sending wears the red mark and the cross
function opBadge(op){
  return op.state === "failed" || op.state === "unsure" ? "fail" : op.waiting ? "ring" : "";
}
// the arrow on a message that is not through. it sends again under the same id,
// so a message the board already has is answered from its receipt and never
// lands twice. one the board refused is not sent again, and says nothing
function resendOp(op){
  if (op.refused || (op.state !== "unsure" && op.state !== "failed")) return;
  op.state = "pending"; op.waiting = true; op.tries = 0; op.since = Date.now();
  saveOps();
  drawOpState(op);
  runOps(laneOf(op));
}
// the cross. one the board refused, or has no record of inside the window where
// that proves it never landed, gives its words back at once. one whose fate the
// phone does not know asks the board first: landed, and it becomes Delivered
// with nothing taken back; not landed, and the words go back; the board out of
// reach, and nothing happens until it can be asked
const crossAsking = new Set();
async function crossOp(op){
  if (op.state === "failed"){ takeBack(op); return; }
  if (op.state !== "unsure" || crossAsking.has(op.id)) return;
  crossAsking.add(op.id);
  let said;
  try { said = await askReceipt(op.id); } finally { crossAsking.delete(op.id); }
  if (!said || !ops.includes(op)) return;
  if (said.status === "applied") applyOp(op, { ...(said.result || {}), replayed: true });
  else if (said.status === "unknown" && Date.now() - op.ts < OP_CERTAIN_MS) takeBack(op);
}
function sentMarkAct(el, id, act){
  const op = ops.find(o => o.id === id);

  if (act === "retry") resendOp(op);

// a new answer held back while the reader was busy is shown by drawing the
// reading this page already holds, since the board has nothing newer to say
turnAgain = () => { if (lastState) apply(lastState); };

// ---- sending, closing, parking, naming ------------------------------------------
// what the cross on the card does, and what the key that stands for it does: the
// card is closed and the next one still open takes the screen, so the screen is
// never left holding a card that has just gone
async function closeCard(id){
  const order = doingOrder(lastState);
  await fetch("/close?box=" + encodeURIComponent(id), { method: "POST" }).catch(() => {});
  selectNextDoing(id, order);
  poll();
}
function undone(id){
  fetch("/done?box=" + encodeURIComponent(id) + "&v=0", { method: "POST" }).then(() => poll()).catch(() => {});
}
// Enter and the card's send arrow each send and stay on their first press.
// Their separate second presses inside this window move after confirmation.
let autoNext = null;
const AUTONEXT_MS = 0;   // the desktop's number; a quiet time after a send before moving on
const ENTER_AGAIN_MS = 700;
let phoneEnterAgain = null;   // transient by design; a reload never revives a move
function phoneEnterViewKey(id){
  const anchor = lastState && lastState.boxes.find(b => b.id === id);
  return [id, activeOwner, curView(), anchor && anchor.ws ? anchor.ws : ""].join("|");
}
function clearPhoneEnterAgain(intent = phoneEnterAgain){
  if (!intent) return;
  clearTimeout(intent.timer);
  intent.active = false;
  intent.op.advance = false;
  if (phoneEnterAgain === intent) phoneEnterAgain = null;
  if (intent.source === "arrow") els[intent.id]?.tick();
}
function phoneArrowAgainFor(id){
  return !!(phoneEnterAgain?.active && !phoneEnterAgain.advance &&

function cancelAutoNext(){

function schedulePhoneAdvance(op, intent = null){
  clearTimeout(autoNext);

    autoNext = null;
    if (intent){

        phoneEnterViewKey(op.box) === intent.view;
      clearPhoneEnterAgain(intent);

// the move a double Enter's second press makes, and control+enter makes at
// once: to the card that has waited longest, in the card's own workspace
function phoneAdvance(id){
  if (selectedId === id) jumpNextYellow(id, null, navigationPool(lastState, id));
}
function armPhoneEnterAgain(id, op, source = "enter"){
  cancelAutoNext();

    id, op, source, view: phoneEnterViewKey(id), deadline: Date.now() + ENTER_AGAIN_MS,
    delivered: false, advance: false, active: true, timer: null,
  };
  intent.timer = setTimeout(() => {
    if (phoneEnterAgain === intent && !intent.advance) clearPhoneEnterAgain(intent);
  }, ENTER_AGAIN_MS);
  phoneEnterAgain = intent;
  if (source === "arrow") els[id]?.tick();
}
function askPhoneEnterAdvance(id, source = "enter"){
  const intent = phoneEnterAgain;
  if (!intent || !intent.active || intent.source !== source || intent.id !== id || phoneEnterViewKey(id) !== intent.view) return false;
  if (intent.advance) return true;
  if (Date.now() > intent.deadline) return false;
  intent.advance = true;
  intent.op.advance = true;
  clearTimeout(intent.timer);

function composerArrow(id){
  if (phoneArrowAgainFor(id) && askPhoneEnterAdvance(id, "arrow")) return;

  const op = doSend(id, { advance: false });

// ---- what the phone has asked the board and not yet heard back on -----------------
// the phone is a room and a radio away from the board. a tap has to show
// something now, and the words have to land once, whatever the radio does to
// the reply. so every send and every new card is an operation: an id minted
// here before the first try, kept in this phone's storage until the board has
// confirmed it, and sent again under the same id until it has. the board keeps
// the result beside the effect, so a retry after a lost reply is answered from
// the receipt and the message never lands twice. one card's sends go one at a
// time, in the order they were typed; a card being made is one card however many
// times the plus is pressed while it is on its way. the rows below are drawn
// from this store, so a card shows its unsent messages whether or not it is
// the one on screen, and a reload draws them again and sends them on.
const OPS_KEY = "pendops";
// operations kept at once, pending, unsure and not-sent together. past this
// the phone refuses to mint another rather than forget one, since every kept
// operation is words the board has not confirmed; the words of a refused send
// stay in the typing row and the card says why
const OPS_MAX = 50;
// how long a send is resent on its own, counted from the press or from the
// last time the arrow sent it again. well under the two days the board
// promises to keep a receipt, so every retry still finds its receipt and lands
// at most once. past this the operation is unsure: nothing more is sent, the
// words stay on the card, and every reading asks the board for its receipt.
// OP_TRY_MS and OP_CERTAIN_MS, one try's deadline and how long "unknown" proves
// the words never landed, are shared with the desktop in card-logic.js
const OP_GIVE_UP_MS = 12 * 3600 * 1000;
const OP_ASK_MAX = 32;                       // receipts one reading may ask after, the board's own cap
const RETRY_MIN_MS = 1500, RETRY_MAX_MS = 30000;
// pending: being sent and resent. unsure: no more sends, the outcome unknown,
// kept and asked about. failed: the board refused it or has no receipt inside
// the window where that proves it never landed
const OP_STATES = new Set(["pending", "unsure", "failed"]);
let ops = [];                                // in the order they were asked
const createDiagnostics = new Map();         // transient timing tokens; never persisted
const opSleepers = new Set();                // the retry sleeps a wake ends early
const opWorkers = {};                        // lane -> the loop working that lane's operations
let opsStarted = false;                      // the loops start after the first reading, which reconciles first

function loadOps(){
  try {
    const kept = JSON.parse(localStorage.getItem(OPS_KEY) || "[]");
    ops = Array.isArray(kept) ? kept.filter(o => o && typeof o.id === "string" &&
      (o.kind === "send" || o.kind === "create") && OP_STATES.has(o.state)).slice(-OPS_MAX) : [];
  } catch (e) { ops = []; }
  for (const op of ops){
    op.fresh = false; op.advance = false;   // a reload never steals the card after an old receipt arrives
    // only the board can call a send not sent. a record marked failed for any
    // other reason, a horizon or a full store under an earlier page, is a send
    // whose outcome is unknown, and an absent receipt does not prove it never
    // landed: it is kept as unsure and asked about
    if (op.state === "failed" && op.by !== "board"){ op.state = "unsure"; op.why = "not confirmed by the board"; }
  }
}
function saveOps(){
  try { localStorage.setItem(OPS_KEY, JSON.stringify(ops.map(({ fresh, advance, ...op }) => op))); } catch (e) {}
}
// null when the store is full: the caller keeps the words where they are and
// says so. nothing kept is ever dropped to make room, because every kept
// operation is words the board has not confirmed, and forgetting one would be
// forgetting whether it was sent
function mintOp(kind, fields){
  if (ops.length >= OPS_MAX) return null;
  const op = { id: newOpId(), kind, ts: Date.now(), tries: 0, waiting: false, asked: 0, state: "pending", ...fields };
  ops.push(op);
  saveOps();
  return op;
}
function laneOf(op){ return op.kind === "create" ? "create" : "send:" + op.box; }
function localSends(box){ return ops.filter(o => o.kind === "send" && o.box === box); }
function pendingCreate(){ return ops.find(o => o.kind === "create" && o.state === "pending"); }
// what a reading asks the board about: the pending and unsure operations least
// recently asked, within the board's cap for one reading. the store can hold
// more than one reading may ask after, so the turn goes round: whatever was
// asked about last time goes to the back, and every kept operation is asked
// about within a couple of readings, never starved by the same first batch
function askIds(){
  const askable = ops.filter(o => o.state === "pending" || o.state === "unsure")
    .sort((a, b) => (a.asked || 0) - (b.asked || 0));
  const chosen = askable.slice(0, OP_ASK_MAX);
  const now = Date.now();
  for (const op of chosen) op.asked = now;
  return chosen.map(o => o.id);
}
function backoffMs(tries){ return Math.min(RETRY_MAX_MS, RETRY_MIN_MS * 2 ** Math.max(0, tries - 1)) * (0.8 + Math.random() * 0.4); }
function retrySleep(ms){
  return new Promise(resolve => {
    const done = () => { clearTimeout(timer); opSleepers.delete(done); resolve(); };
    const timer = setTimeout(done, ms);
    opSleepers.add(done);
  });
}
// a resume, a tap on the plus, the board answering again: every sleeping retry
// wakes and every lane with something pending is worked
function wakeOps(){
  for (const done of [...opSleepers]) done();
  for (const op of ops) if (op.state === "pending") runOps(laneOf(op));
}
function runOps(lane){
  if (opWorkers[lane]) return;
  opWorkers[lane] = (async () => {
    try {
      for (;;){
        const op = ops.find(o => o.state === "pending" && laneOf(o) === lane);
        if (!op) return;
        if (Date.now() - (op.since || op.ts) > OP_GIVE_UP_MS){ markUnsure(op, "no answer from the board for half a day"); continue; }
        if (await tryOp(op) === "retry"){
          op.waiting = true;
          drawOpState(op);
          await retrySleep(backoffMs(op.tries));
        }
      }
    } finally { delete opWorkers[lane]; }
  })();
}
// one try. done means the operation is settled either way; retry means the
// board could not be reached or was busy, which says nothing about whether
// the words landed, and the same id asked again is safe either way
async function tryOp(op){
  if (op.state !== "pending") return "done";
  op.tries++;
  drawOpState(op);
  const url = op.kind === "send"
    ? "/send?box=" + encodeURIComponent(op.box) + "&op=" + encodeURIComponent(op.id)
    : "/create?owner=" + encodeURIComponent(op.owner) + "&op=" + encodeURIComponent(op.id);
  let r;
  const trace = tracePhone("begin", "request", { route: op.kind === "send" ? "/send" : "/create", box: op.box, op: op.id });
  try {
    r = await fetch(url, { method: "POST", body: op.kind === "send" ? op.text : "", signal: AbortSignal.timeout(OP_TRY_MS) });
  } catch (e) {
    endPhoneTrace(trace, { op: op.id, outcome: "retry" });
    return "retry";
  }
  if (op.state !== "pending"){
    endPhoneTrace(trace, { op: op.id, status: r.status }, r);
    return "done";   // a reading reconciled it while this try was out
  }
  if (r.ok){
    let result = null;
    try { result = await r.json(); } catch (e) {}
    if (!result || !result.ok){
      endPhoneTrace(trace, { op: op.id, status: r.status, outcome: "retry" }, r);
      return "retry";   // it landed and the answer was lost on the way: the retry is answered from the receipt
    }
    endPhoneTrace(trace, { op: op.id, status: r.status }, r);
    applyOp(op, result);
    return "done";
  }
  if (r.status === 400 || r.status === 409 || r.status === 413){
    let why = "";
    try { why = (await r.json()).error || ""; } catch (e) {}
    endPhoneTrace(trace, { op: op.id, status: r.status }, r);
    op.refused = true;
    failOp(op, why || ("refused " + r.status), "board");
    return "done";
  }
  endPhoneTrace(trace, { op: op.id, status: r.status, outcome: "retry" }, r);
  return "retry";
}
// the board's receipts, asked after with every reading. a pending or unsure
// operation the board has applied is landed here, however long ago its reply
// was lost. an unsure operation the board has no receipt of is not sent, inside
// the window where that proves it never landed; past that window it stays
// unsure, since the board cannot tell a message that never came from one
// whose receipt has aged out, and neither can the phone. a pending one the
// board has no receipt of is left to its loop to send again
function reconcileOps(answer){
  for (const [id, said] of Object.entries(answer || {})){
    const op = ops.find(o => o.id === id && (o.state === "pending" || o.state === "unsure"));
    if (!op || !said) continue;
    if (said.status === "applied"){ applyOp(op, { ...(said.result || {}), replayed: true }); continue; }
    if (said.status === "unknown" && op.state === "unsure" && Date.now() - op.ts < OP_CERTAIN_MS){
      failOp(op, "the board has no record of it", "board");
    }
  }
}
function applyOp(op, result){
  if (op.state !== "pending" && op.state !== "unsure") {
    if (op.kind === "create") createDiagnostics.delete(op.id);
    return;
  }
  const diagnostic = op.kind === "create" ? createDiagnostics.get(op.id) : null;
  if (diagnostic) diagnostic.box = result.id;
  if (diagnostic?.response){
    endPhoneTrace(diagnostic.response, { stage: "create-response", op: op.id,
      box: result.id, outcome: "applied" });
    diagnostic.response = null;
  }
  if (diagnostic) diagnostic.insertion = tracePhone("begin", "stage",
    { stage: "card-insertion", op: op.id, box: result.id });
  tracePhone("note", "operation", { op: op.id, box: op.box || result.id, outcome: "applied" });
  op.state = "applied";
  ops = ops.filter(o => o !== op);
  saveOps();
  try {
    if (op.kind === "send") landSend(op, result); else landCreate(op, result);
    // A concurrent poll can have inserted the card before this response lands.
    // In that case makeBox did not see the transient record; close insertion
    // honestly at the already-present card, then begin readiness at this point.
    if (diagnostic?.insertion){
      endPhoneTrace(diagnostic.insertion, { stage: "card-insertion", op: op.id,
        box: result.id, present: !!els[result.id]?.box.isConnected,
        editor: !!els[result.id]?.field, editorReady: !!els[result.id]?.field &&
          (!els[result.id].field.formatted() || !!els[result.id].field.view) });
      diagnostic.insertion = null;
      diagnostic.selected = tracePhone("begin", "stage", { stage: "selected-ready", op: op.id, box: result.id });
    }
    if (diagnostic?.selected){
      endPhoneTrace(diagnostic.selected, { stage: "selected-ready",
        op: op.id, box: result.id, ...phoneTraceState() });
      diagnostic.selected = null;
    }

    // The server operation is already removed above. Rendering may still throw;
    // its diagnostic record must never outlive that dead operation.
    if (diagnostic?.insertion) endPhoneTrace(diagnostic.insertion,
      { stage: "card-insertion", op: op.id, box: result.id, ...phoneTraceState() });
    if (diagnostic?.selected) endPhoneTrace(diagnostic.selected,
      { stage: "selected-ready", op: op.id, box: result.id, ...phoneTraceState() });
    if (diagnostic) createDiagnostics.delete(op.id);
  }
  if (result.rev != null && lastRev != null && result.rev !== lastRev) poll();   // the board moved: read it now rather than a tick later
}
// nothing more is sent for this operation and nothing is decided: the words
// stay on the card, the readings keep asking the board about it, and it is
// settled only by a receipt or by the owner's own hand
function markUnsure(op, why){
  if (op.state !== "pending") return;
  const diagnostic = op.kind === "create" ? createDiagnostics.get(op.id) : null;
  if (diagnostic?.response) endPhoneTrace(diagnostic.response, { stage: "create-response", op: op.id, outcome: "unsure" });
  if (diagnostic) createDiagnostics.delete(op.id);
  tracePhone("note", "operation", { op: op.id, box: op.box, outcome: "unsure" });
  if (phoneEnterAgain && phoneEnterAgain.op === op) clearPhoneEnterAgain(phoneEnterAgain);
  op.advance = false;
  op.state = "unsure"; op.why = why; op.waiting = false;
  if (op.kind === "create"){
    drawCreatePending();
    drawerNote("Could not confirm the card was made; it will show here if it was");
  } else {
    const el = els[op.box];
    if (el) drawSent(el, op.box);
  }
  saveOps();
}
// by says who decided: "board" for a refusal the board itself gave, or for an
// absent receipt inside the window where that proves the words never landed.
// only those stay not-sent across a reload; anything else is an unknown outcome
function failOp(op, why, by){
  if (op.state !== "pending" && op.state !== "unsure") return;
  const diagnostic = op.kind === "create" ? createDiagnostics.get(op.id) : null;
  if (diagnostic?.response) endPhoneTrace(diagnostic.response, { stage: "create-response", op: op.id, outcome: "failed" });
  if (diagnostic) createDiagnostics.delete(op.id);
  tracePhone("note", "operation", { op: op.id, box: op.box, outcome: "failed" });
  if (phoneEnterAgain && phoneEnterAgain.op === op) clearPhoneEnterAgain(phoneEnterAgain);
  op.advance = false;
  op.state = "failed"; op.why = why; op.by = by || "phone";
  if (op.kind === "create"){
    ops = ops.filter(o => o !== op);
    drawCreatePending();
    drawerNote("The card could not be made: " + why);
  } else {
    const el = els[op.box];
    if (el) drawSent(el, op.box);
  }
  saveOps();

// a confirmed send: the message moves from this phone's own to the confirmed
// ones, exactly the list the board's next reading would draw, so that reading
// finds it there and adds nothing. the message keeps its place in the panel and
// only its line goes. sendGuard is the moment it landed: a reading asked
// before it knows nothing of it and may not take it away
function landSend(op, result){
  const el = els[op.box];
  if (!el) return;
  // saved by the board now: sent, which reads Delivered, until a reading says more
  el.sentItems = [...el.sentItems, { text: op.text, stage: "sent" }];
  drawSent(el, op.box);
  el.sendGuard = Date.now();
  if (el.meta.textContent.indexOf("send ") === 0) el.meta.textContent = "";
  if (op.reopen) undone(op.box);   // the message is in; the flip rides behind it
  const enterIntent = phoneEnterAgain && phoneEnterAgain.op === op ? phoneEnterAgain : null;
  if (enterIntent) enterIntent.delivered = true;
  if (op.advance && selectedId === op.box){
    schedulePhoneAdvance(op, enterIntent);
  }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>facilitator</title>
<!-- the phone page. the same board, drawn for a phone: the project tabs across
     the top, one card filling the screen with the app's thin margins on all
     four sides, the card list in a menu pulled in from the left edge and the
     settings in one pulled in from the right.
     nothing else. the card is the desktop card at phone size: the same top
     bar, title, answer, sent box, composer and buttons, in the same colours
     and faces, read straight out of index.html rather than redrawn -->
<link rel="manifest" href="/m-manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="facilitator">
<meta name="theme-color" content="#F5F4F1">
<link rel="apple-touch-icon" href="/m-icon-180.png">
<link rel="icon" href="/m-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
  :root{
    /* the colours, the faces and the card's own constants (--app-inset,
       --cardbar-h, --sq, --press, --row-min, --sbar, --gentle, --sunk-deep)
       are shared with the desktop: card-tokens.css, loaded right after this
       sheet. what stands here is the board's own measures, at phone size.
       --app-inset is the thin margin the desktop app frame keeps from the
       window's edge; the safe area is added to it below so the margin is thin
       on every side of a phone with a notch too. --pad-x is the card pane's
       side padding, and the title and the answer step in from it by the same
       thirds the desktop uses */
    --pad-x:18px;
    --sp-xs:4px; --sp-s:8px; --sp-x:10px;
    --pend-bar:32px;
    --titleair:calc(var(--pad-x)*2/3);
    /* the menus' motion, taken from the drawer this page's menus are drawn
       from: one run of 550ms, an ease in and out on a tap and an ease out on
       the release of a drag, so a drag that is already moving is not asked to
       start again. --drawer-curve is the one in force, written by the script
       at whichever of the two the run was begun by */
    --drawer-ms:.55s;
    --drawer-tap:cubic-bezier(.445,.05,.55,.95);
    --drawer-drag:cubic-bezier(.215,.61,.355,1);
    --drawer-curve:var(--drawer-tap);
  }
  *{box-sizing:border-box}
  html{height:100%; -webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:15px/1.55 var(--sans);
    position:fixed; left:0; top:0; width:100%; height:100%;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  /* the page: the tabs, the note and the card, on the paper, as one surface.
     both menus cross over it, with the shade between them and it, and the
     surface itself draws back a little while either one is out */
  #page{
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; overflow:hidden;
    padding:calc(env(safe-area-inset-top, 0px) + var(--app-inset))
            calc(env(safe-area-inset-right, 0px) + var(--app-inset))
            var(--pad-b)
            calc(env(safe-area-inset-left, 0px) + var(--app-inset));
    -webkit-tap-highlight-color:transparent;
    /* the foot's clearance. at rest it is the home indicator's safe area plus
       the app's thin margin. while an editor is focused, any bottom area lost
       from the measured visual viewport is used instead, whether it is a small
       hardware-keyboard accessory strip or the full on-screen keyboard. the
       safe area still reported under that obstruction is not added twice.
       --kb-inset is the measured loss written by the script. the clearance
       moves on the platform keyboard's clock and curve, --kb-anim */
    --pad-b:calc(env(safe-area-inset-bottom, 0px) + var(--app-inset));
    --kb-inset:0px;
    --kb-anim:.25s cubic-bezier(.38,.7,.125,1);
    background:var(--paper);
    background-image:radial-gradient(circle at 18% -4%, #FCFCFB 0%, rgba(252,252,251,0) 52%);
    /* the depth a menu opens onto. as one comes out the whole page draws back
       towards the middle of the screen, by the same fraction the menu's travel
       and its shade are worth, so the card reads as a stage set back rather
       than as something pushed aside. it goes nowhere sideways and nothing is
       laid out again: the page keeps the screen's width and height and only
       its picture is drawn smaller, from its own middle, so every edge steps
       in by the same amount. --page-scale is written by the script and is
       exactly 1 with both menus shut */
    --page-scale:1;
    transform:scale(var(--page-scale));
    transform-origin:50% 50%;
    transition:padding-bottom var(--kb-anim),
               transform var(--drawer-ms) var(--drawer-curve);
  }
  /* the clearance is the page's own, so the keyboard's value is set on the
     page as well: a property an element declares is not the one it inherits */
  body.obstructed #page{--pad-b:calc(var(--kb-inset) + var(--app-inset))}
  /* a small obstruction uses the reported edge directly, without the app's
     extra margin. the full keyboard and resting safe area keep that margin */
  body.obstructed:not(.kb) #page{--pad-b:var(--kb-inset)}
  /* the box while the viewport is obstructed, and through the close's settle window.
     the top follows the visual viewport, for the phone that slides the layout
     viewport under the keyboard; the height is the learned full-screen height
     and never the viewport's own, so the box never changes size at a keyboard
     edge. the script drops both once the keyboard is really gone, and lands
     on the geometry the box already had */
  body.obstructed, body.lifting{top:var(--shell-top, 0px); height:var(--shell-h, 100%)}
  button{font-family:inherit; -webkit-appearance:none; appearance:none}

  /* ---- the project tabs, seated the way the desktop bar seats them --------- */
  .bar{
    flex:none; height:39px; overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none;
    /* the bar's bottom line is its last pixel row, painted as background so a
       seated tab's paper can stand on it and open into the canvas below */
    background:linear-gradient(to top, var(--line) 1px, transparent 1px);
  }
  .bar::-webkit-scrollbar{display:none}
  #tabbar{display:flex; align-items:flex-end; gap:4px; height:39px; padding:0 10px; width:max-content; min-width:100%}
  .ptab{
    flex:none; font:500 13px/16px var(--sans); color:var(--sub);
    background:transparent; border:1px solid transparent; border-bottom:none;
    border-radius:7px 7px 0 0; cursor:pointer; user-select:none; -webkit-user-select:none;
    position:relative; height:39px; padding:0 16px 6px;
    --seat:var(--paper);
  }
  .ptab.on{color:var(--ink); background:var(--seat); border-color:var(--line)}
  .ptab.unread{color:var(--ink)}
  .ptab.unread .plabel{font-weight:600}
  .plabel{display:inline-block; vertical-align:top}
  .plabel[data-label]::after{
    content:attr(data-label); display:block; height:0; overflow:hidden;
    visibility:hidden; font-weight:600;
  }
  .ptab.on::before, .ptab.on::after{
    content:""; position:absolute; bottom:0; width:10px; height:8px; pointer-events:none;
  }
  .ptab.on::before{
    left:-8px;
    background:radial-gradient(circle 8px at 0 0, transparent 0 7px, var(--line) 7px 8px, var(--seat) 8px);
  }
  .ptab.on::after{
    right:-8px;
    background:radial-gradient(circle 8px at 100% 0, transparent 0 7px, var(--line) 7px 8px, var(--seat) 8px);
  }

  /* ---- the server unreachable note, the board's own --------------------- */
  #offline{
    display:none; flex:none; margin-top:var(--sp-s);
    padding:9px 12px; font:13px var(--sans); color:#7A2E1B;
    background:#FAE9E2; border:1px solid #E8C4B4; border-radius:7px;
  }
  body.offline #offline{display:block}
  /* the milder note: the board has missed a reading or two and the page is
     asking again, which is not yet a board that is gone */
  #offline.stale{color:#6B5A2E; background:#F6F1E4; border-color:#E4D9BC}

  /* ---- the card pane ------------------------------------------------------ */
  main{
    flex:1 1 auto; min-height:0; margin-top:var(--sp-s);
    background:var(--card); border:1px solid var(--line-strong); border-radius:7px;
    box-shadow:0 2px 18px rgba(60,45,20,.18), 0 1px 3px rgba(60,45,20,.10);
    display:flex; flex-direction:column; overflow:hidden; position:relative;
  }
  #empty{display:none; flex:1; align-items:center; justify-content:center;
    font:italic 400 17px var(--serif); color:var(--sub); padding:20px; text-align:center}
  main.blank #empty{display:flex}
  #cards{display:flex; flex-direction:column; flex:1 1 auto; min-height:0}
  main.blank #cards{display:none}
  .box{display:none; flex:1 1 auto; min-height:0; flex-direction:column}
  /* the two depths the card's fades are cut to, the desktop's own numbers:
     --replyfade is the ramp, --replyair the clear white the answer leaves over
     the sent box, and --boxleft the column the box starts in. they are written
     on the shown card alone, the way the desktop writes them, so the mask rules
     below can only ever apply to a card that is laid out */
  .box.sel{display:flex; --replyfade:22px; --replyair:3.5px; --boxleft:calc(var(--pad-x)*2/3)}

  /* the card's own top bar: the reply history on the left, the defer chip and
     the close cross on the right, over the hairline the desktop bar wears */
  .topbar{
    flex:none; display:flex; align-items:center; gap:9px; position:relative;
    height:var(--cardbar-h); padding:0 6px 0 calc(var(--pad-x)*2/3);
    background:var(--card); box-shadow:inset 0 -1px 0 var(--line);
  }
  /* the history control is also the bar's one flexible item, the thing that
     holds the two chips against the right end, so it keeps its room on a
     card with nothing older and only its marks go */
  .histctl{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:0;
    font:11.5px var(--mono); color:var(--sub); white-space:nowrap; visibility:hidden}
  .box.hashist .histctl{visibility:visible}
  .histbtn{flex:none; width:28px; height:28px; padding:0; border:none; border-radius:var(--sq);
    background:var(--card); color:var(--ink); display:grid; place-items:center; cursor:pointer}
  .histbtn:active{background:color-mix(in srgb, #000 var(--press), var(--card))}
  .histbtn:disabled{opacity:.28}
  .histbtn.older svg{transform:rotate(0deg)}
  .histbtn.newer svg{transform:rotate(180deg)}
  .histpos{margin-left:4px}
  .histpos:empty{display:none}
  /* the two chips wear the desktop's 16px mark on a 28px seat, the seat being
     what a finger needs; the mark, the ink and the press are the desktop's */
  .arcbtn, .xbtn{
    flex:none; width:28px; height:28px; padding:0; border:none; border-radius:var(--sq);
    background:var(--card); color:#000; position:relative; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .arcbtn:active, .xbtn:active{background:color-mix(in srgb, #000 var(--press), var(--card))}
  .xbtn::before, .xbtn::after{
    content:""; position:absolute; left:50%; top:50%;
    width:9px; height:1.2px; background:#1e1e1e; border-radius:1px;
  }
  .xbtn::before{transform:translate(-50%,-50%) rotate(45deg)}
  .xbtn::after{transform:translate(-50%,-50%) rotate(-45deg)}

  .head{flex:none; padding:var(--titleair) 0 0}
  .title{
    display:block; min-width:0; white-space:normal; overflow-wrap:anywhere;
    font:625 24px/1.25 var(--inter); color:var(--ink);
    padding:0 calc(var(--pad-x)*2/3); min-height:1.25em; outline:none;
  }
  .title[contenteditable]:empty::before{content:"Chat Name"; color:var(--line-strong)}
  .box.done .title{color:var(--green)}
  .box.parked .title{color:var(--later)}

  /* the sent box and the typing row are laid OVER the answer here, as they are
     on the desktop card, and the body is the ground they are set into: the
     answer fills the whole of it and runs on underneath them, covered edge to
     edge by fill that is opaque. laid this way the answer's own bottom edge is
     far below the line where its words actually stop, which is what lets the
     ramp at the foot be cut on the box's top edge. nothing moves by a pixel:
     the wrapper stood on the body's floor in the column and it stands on the
     same floor pinned to it */
  .body{display:flex; flex-direction:column; flex:1 1 0; min-height:0;
    padding:var(--titleair) 0 0; position:relative; overflow:hidden}
  .reply{
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain; color:var(--ink);
    font-size:17px; line-height:1.55;
    padding:0 calc(var(--pad-x)*5/3 - var(--sbar)) 0 calc(var(--pad-x)*2/3);
    scrollbar-gutter:stable;
    margin-bottom:var(--replyair);
  }
  /* the card's two fades, the desktop's rules at phone size and with the phone's
     own seat in front of them. the depths, the stops and the compositing are the
     desktop's to the number; what the desktop writes as body.focus .box.sel is
     written here as .box.sel, which is the class this page gives the one card on
     show.
     down the answer, the first layer carries both. at its head the answer
     dissolves under the title as it scrolls: nothing at the top edge, .35 at 38
     hundredths of --upband, .80 at 72 and full at the end, --upband being how far
     the answer has been scrolled capped at the ramp's own depth, so at rest all
     four stops collapse onto the edge and the first line stands at full ink. at
     its foot it dissolves into the sent box over the same ramp turned over,
     ending on --boxband, the depth of the box and the typing row measured by the
     script below, since no rule can name the top edge of a thing laid over the
     answer.
     the second layer is that shape run across at the box's left edge and the
     third keeps it off the rest of the answer; the two are added and the first is
     multiplied into the pair, so above the box the answer is whole at its full
     width and below it the ramp is the only thing left */
  .box.sel .reply{
    -webkit-mask-image:
      linear-gradient(to bottom,
        rgba(0,0,0,0) 0,
        rgba(0,0,0,.35) calc(var(--upband, 0px)*.38),
        rgba(0,0,0,.80) calc(var(--upband, 0px)*.72),
        rgba(0,0,0,1) var(--upband, 0px),
        rgba(0,0,0,1) calc(100% - var(--boxband, 0px) - var(--replyfade)),
        rgba(0,0,0,.80) calc(100% - var(--boxband, 0px) - var(--replyfade)*.72),
        rgba(0,0,0,.35) calc(100% - var(--boxband, 0px) - var(--replyfade)*.38),
        rgba(0,0,0,0) calc(100% - var(--boxband, 0px))),
      linear-gradient(to right,
        rgba(0,0,0,1) calc(var(--boxleft) - var(--replyfade)),
        rgba(0,0,0,.80) calc(var(--boxleft) - var(--replyfade)*.72),
        rgba(0,0,0,.35) calc(var(--boxleft) - var(--replyfade)*.38),
        rgba(0,0,0,0) var(--boxleft),
        rgba(0,0,0,1) calc(var(--boxleft) + var(--replyfade)*.25)),
      linear-gradient(to bottom,
        rgba(0,0,0,1) calc(100% - var(--boxband, 0px)),
        rgba(0,0,0,0) calc(100% - var(--boxband, 0px)));
    mask-image:
      linear-gradient(to bottom,
        rgba(0,0,0,0) 0,
        rgba(0,0,0,.35) calc(var(--upband, 0px)*.38),
        rgba(0,0,0,.80) calc(var(--upband, 0px)*.72),
        rgba(0,0,0,1) var(--upband, 0px),
        rgba(0,0,0,1) calc(100% - var(--boxband, 0px) - var(--replyfade)),
        rgba(0,0,0,.80) calc(100% - var(--boxband, 0px) - var(--replyfade)*.72),
        rgba(0,0,0,.35) calc(100% - var(--boxband, 0px) - var(--replyfade)*.38),
        rgba(0,0,0,0) calc(100% - var(--boxband, 0px))),
      linear-gradient(to right,
        rgba(0,0,0,1) calc(var(--boxleft) - var(--replyfade)),
        rgba(0,0,0,.80) calc(var(--boxleft) - var(--replyfade)*.72),
        rgba(0,0,0,.35) calc(var(--boxleft) - var(--replyfade)*.38),
        rgba(0,0,0,0) var(--boxleft),
        rgba(0,0,0,1) calc(var(--boxleft) + var(--replyfade)*.25)),
      linear-gradient(to bottom,
        rgba(0,0,0,1) calc(100% - var(--boxband, 0px)),
        rgba(0,0,0,0) calc(100% - var(--boxband, 0px)));
    mask-composite:intersect, add, add;
    /* the run-out the scroll needs under its last word: the band the box takes
       plus the ramp, handed back as padding so the last line can rise onto the
       top of the ramp where the ink is still full. padding counts inside the
       scrollable height, so an answer that already fits gains no travel */
    padding-bottom:calc(var(--boxband, 0px) + var(--replyfade));
  }
  .box.histview .reply{opacity:.8}
  .reply::-webkit-scrollbar{width:var(--sbar)}
  .reply::-webkit-scrollbar-track{background:transparent}
  .reply::-webkit-scrollbar-thumb{background:transparent; border:3px solid transparent;
    background-clip:padding-box; border-radius:99px}
  .reply.scrolling::-webkit-scrollbar-thumb{background-color:var(--line-strong)}

  /* ---- the sent box, folded to a bar, opened to the run ------------------- */
  .pendwrap{position:absolute; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; background:var(--card)}
  .meta{margin:0 calc(var(--pad-x)*2/3); font:11.5px var(--mono); color:var(--sub); background:var(--card)}
  .meta:empty{display:none}
  .pendlist{
    display:flex; flex-direction:column; flex:none; position:relative;
    margin:0 calc(var(--pad-x)*2/3) var(--sp-s);
    font:15px/1.5 var(--sans); color:var(--ink);
    cursor:pointer; user-select:none; -webkit-user-select:none;
  }
  .pendhead{
    display:flex; align-items:center; justify-content:center; align-self:stretch; flex:none;
    height:var(--pend-bar); padding:0 12px; border-radius:7px;
    box-shadow:var(--sunk-deep); background:var(--card);
    box-sizing:border-box; border:1px solid var(--line);
  }
  .chev{display:block; flex:none}
  .pendbody{display:none}
  .pendlist.open{
    background:var(--card); border:1px solid var(--line); border-radius:7px;
    padding:12px 12px 10px; box-shadow:var(--sunk-deep); overflow:hidden;
    max-height:38vh; max-height:calc(var(--vvh, 100vh) * .38);
  }
  .pendlist.open .pendhead{display:none}
  .pendlist.open .pendbody{
    display:flex; flex-direction:column; flex:1 1 auto; min-height:0; position:relative;
    animation:pendfade .22s ease-out;
  }
  .pendlist.open .chevtop{position:absolute; left:0; top:3px; transform:rotate(180deg)}
  .pendstamp{flex:none; text-align:right; font:12px var(--mono); color:var(--sub); padding:0 0 var(--sp-s); min-height:1.2em}
  .pendscroll{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain}
  .pendmsg + .pendmsg{padding-top:var(--sp-s)}
  .pendmsg .pendcontent{
    position:relative; margin:0 0 0 auto; text-align:right; white-space:pre-wrap;
    max-width:80%; overflow-wrap:break-word;
  }
  .rcpt{display:block; text-align:right; font:10.5px/1.35 var(--mono); color:var(--sub); padding:2px 0 0}
  .rcpt:empty{display:none}
  /* a message the board has not confirmed yet: drawn the moment it is sent, a
     shade lighter, its receipt saying so, and kept on the card until the board
     has it. one it could not be given stays too, in the ink the unreachable
     note wears, and a tap puts the words back in the row he types on */
  .pendlocal{display:flex; flex-direction:column}
  .pendlocal .pendmsg{padding-top:var(--sp-s)}
  .pendmsg.pending .pendcontent{opacity:.6}
  .pendmsg.pending .rcpt{color:#8F7B4A}
  .pendmsg.failed .rcpt{color:#7A2E1B}
  /* a message the board never confirmed and the phone stopped resending: kept
     as it was typed, its receipt saying only what is known */
  .pendmsg.unsure .pendcontent{opacity:.72}
  .pendmsg.unsure .rcpt{color:#6B5A2E}

  /* ---- the foot: the plus, the row he types on, the send square ------------ */
  .bottombar{
    display:flex; align-items:flex-end; gap:var(--sp-s); flex:none;
    margin:0 calc(var(--pad-x)*2/3); border-top:1px solid var(--line); background:var(--card);
  }
  /* the white over the step under the sent box, and it is hung on there being a
     box to leave one: the answer now runs on behind the bar, and without this
     the words would show through the step between the box and the typing row.
     on a card with no box there is no step, and painting one there would land
     the card's white on the foot of the answer's own fade */
  .pendwrap:has(.pendlist) .bottombar{box-shadow:0 calc(var(--sp-s) * -1) 0 var(--card)}
  .clipbtn{
    flex:none; width:28px; height:var(--row-min); padding:0; border:none;
    background:none; border-radius:var(--sq); color:var(--ink);
    display:grid; place-items:center; line-height:1; cursor:pointer;
    position:relative; isolation:isolate; transition:transform .11s var(--gentle);
  }
  .clipbtn::before{
    content:""; position:absolute; z-index:-1; left:0; right:0; top:50%; aspect-ratio:1;
    transform:translateY(-50%); border-radius:var(--sq); border:1px solid var(--line);
    background:color-mix(in srgb, #000 var(--press), var(--paper));
    box-shadow:var(--sunk-deep); opacity:0; transition:opacity .11s var(--gentle);
  }
  .clipbtn:active{transform:translateY(1px)}
  .clipbtn:active::before{opacity:1}
  .clipfile{display:none}
  .compose{flex:1 1 auto; min-width:0; display:flex; gap:var(--sp-x); align-items:flex-end}
  /* the row's cap: the desktop's share of the height with the keyboard down,
     and five whole lines while it is up, the count the row could hold above
     the keyboard. the box shrinks at the keyboard's edge, and the script
     brings the caret's line back inside it on that same frame */
  textarea{
    flex:1; min-width:0; resize:none; font:17px/1.5 var(--sans); color:var(--ink);
    background:transparent; border:none; outline:none;
    padding:var(--sp-s) 4px; margin:0 -4px;
    min-height:var(--row-min); max-height:28vh; max-height:calc(var(--vvh, 100vh) * .28); overflow-y:auto;
  }
  body.kb textarea{max-height:calc(5 * 1.5em + 2 * var(--sp-s))}
  textarea::placeholder{color:#B4AA99}
  /* the phone skips its caret reveal, the scroll of the whole page that
     brings a freshly focused field into view, when the field is at opacity 0
     on that frame: one fiftieth of a second blink on focus, a frame the eye
     cannot catch. the script blinks the same way on every keystroke while
     the keyboard is up, since the reveal fires on those too */
  textarea:focus{animation:focus-blink .02s}
  @keyframes focus-blink{from{opacity:0}}
  /* the twin the row is measured on: the same rule as the row, the row's own
     width, out of the flow and out of sight. the row's height is read off it,
     so the row itself is never collapsed to be measured, which is what threw
     its scroll and the caret off */
  .compose textarea.twin{position:absolute; top:0; left:0; visibility:hidden; pointer-events:none;
    height:auto; min-height:0; max-height:none; overflow:hidden; margin:0}
  .sendbtn{
    flex:none; width:28px; height:28px; min-height:0; padding:0; border:none;
    background:var(--card); color:#000; border-radius:var(--sq);
    display:grid; place-items:center; line-height:1; cursor:pointer;
    opacity:0; transform:scale(.5); pointer-events:none;
    transition:opacity .26s var(--gentle), transform .26s var(--gentle);
  }
  .sendbtn.show{opacity:1; transform:scale(1); pointer-events:auto}
  .sendbtn:active{background:color-mix(in srgb, #000 var(--press), var(--card))}

  /* ---- the card list off the left edge, the settings off the right --------- */
  /* the shade over the page while a menu is out, and the tap that shuts it. it
     lies between the page and either menu, so the menu stays clear. it is the
     page's sister and not its child, so it keeps the whole screen while the
     page draws back: the thin strip the page leaves along each edge takes the
     same shade as the rest and shuts the menu on a tap like the rest */
  #scrim{position:absolute; inset:0; background:rgba(33,29,23,.18);
    opacity:var(--scrimv, 0); pointer-events:none; z-index:19;
    transition:opacity var(--drawer-ms) var(--drawer-curve)}
  body.menuout #scrim{pointer-events:auto}
  /* the page's own picture changes frame by frame while a menu is out, so it is
     given a layer of its own for the run */
  body.menuout #page{will-change:transform}
  /* both menus cross over the page from their own edge along one straight
     sideways line, at full strength for every frame of it: nothing about them
     rises, sinks or fades. the depth is carried under them, by the shade that
     grows from nothing to its full weight as the menu comes out and back to
     nothing as it leaves, and by the page drawing back from all four edges on
     that same fraction, so the menu reads as lifting off the page and settling
     back onto it while its own picture holds its line */
  /* the one being shown is the only one visible. it is taken away for as long
     as the run that puts it back: no wait on the way in, and the whole run on
     the way out, so it disappears only once it has finished leaving */
  #drawer, #settings{
    position:fixed; top:0; bottom:0; width:min(71.4vw, 289px); z-index:20;
    background:#fff;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
    transform:translateX(var(--shift));
    opacity:1;
    visibility:hidden; --menuwait:var(--drawer-ms);
    transition:transform var(--drawer-ms) var(--drawer-curve),
               visibility 0s linear var(--menuwait);
  }
  /* the shade lies on a layer of its own, over the page and past the menu's
     outer edge, so its weight can change without the menu being drawn again.
     it is the pair a raised card casts: a close one under the edge and a wide
     soft one beyond it. --panel-depth is how far out the menu is, written by
     the script, and it is the whole of the depth */
  #drawer::after, #settings::after{
    content:""; position:absolute; top:0; bottom:0; pointer-events:none;
    border-radius:inherit; opacity:var(--panel-depth, 0);
    transition:opacity var(--drawer-ms) var(--drawer-curve);
  }
  /* while a menu is on show its shade gets its own layer, so a finger changing
     the shade frame by frame never asks for the menu to be drawn again */
  #drawer.live::after, #settings.live::after{will-change:opacity}
  #drawer.live, #settings.live{visibility:visible; --menuwait:0s}
  /* the two exposed corners are a little rounder than the board's small inset
     panels. the two at the screen edge stay square. each shade layer is pulled
     the 1px out that the menu's own edge line takes, so the shade starts exactly
     where the menu ends */
  #drawer{--shift:-100%; left:0; border-right:1px solid var(--line);
    border-radius:0 12px 12px 0}
  #drawer::after{left:0; right:-1px;
    box-shadow:2px 0 6px rgba(0,0,0,.10), 10px 0 26px rgba(0,0,0,.20)}
  #settings{--shift:100%; right:0; border-left:1px solid var(--line);
    border-radius:12px 0 0 12px}
  #settings::after{left:-1px; right:0;
    box-shadow:-2px 0 6px rgba(0,0,0,.10), -10px 0 26px rgba(0,0,0,.20)}
  /* a finger is followed frame by frame, so the moving layers are not timed */
  body.menudrag #scrim, body.menudrag #page, body.menudrag #drawer, body.menudrag #settings,
  body.menudrag #drawer::after, body.menudrag #settings::after{transition:none}
  #tikhead{flex:none; display:flex; align-items:flex-end; gap:4px; padding:6px 8px 0; border-bottom:1px solid var(--line)}
  .tvb{flex:1; font:500 13px/16px var(--sans); color:var(--sub); background:transparent;
    border:1px solid transparent; border-bottom:none; border-radius:0;
    padding:6px 0 5px; cursor:pointer; user-select:none; -webkit-user-select:none; position:relative; top:1px}
  .tvb.on{color:var(--ink); background:var(--card); border-color:var(--line)}
  .tikadd{flex:none; align-self:center; width:28px; height:28px; padding:0; margin-left:4px;
    font:500 15px/1 var(--mono); color:var(--ink); background:none; border:none; cursor:pointer; opacity:.75}
  /* the plus while the card it was pressed for is still being made: it breathes
     until the board answers, and a second press meanwhile is the same press */
  .tikadd.pending{animation:tikpulse 1s ease-in-out infinite}
  @keyframes tikpulse{0%,100%{opacity:.25} 50%{opacity:.85}}
  .tiknote{font:italic 12.5px var(--sans); color:#7A2E1B; padding:8px 12px}
  #tiklist{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column;
    gap:6px; padding:10px 8px}
  .trow{
    position:relative; flex:none; height:52px;
    border:1px solid var(--line); border-radius:5px; background:#fff;
    box-shadow:0 1px 4px rgba(60,45,20,.05);
    display:flex; flex-direction:column; cursor:pointer; overflow:hidden;
    transition:border-color .3s, background-color .3s;
  }
  .trowin{display:flex; align-items:center; gap:var(--sp-x); height:100%; padding:0 var(--sp-x)}
  .trow.seen .ttl{color:#847A6B}
  .ttl{flex:1; min-width:0; font:500 15px/1.3 var(--sans); color:var(--ink);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .tmeta{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:2px}
  .tmeta .tage{font:600 12.5px var(--mono); color:var(--sub); font-variant-numeric:tabular-nums; min-height:16px}
  .tmeta .teng{font:400 10.5px var(--mono); color:#B4AA99}
  .tnum{font:600 13px var(--mono); color:var(--sub); margin-right:.45em}
  .tempty{font:italic 12.5px var(--sans); color:#B4AA99; padding:8px 12px}
  .trow.working{background:#F0FAEB; border-color:#C4D9BB}
  .trow.yours{background:#FFFBE8; border-color:#E8DCAE}
  .trow.queuedc{background:#EDF0F4; border-color:#CDD4DE}
  .trow.donec{opacity:.55}
  .trow.on{border-color:var(--line-strong); transform:translateY(-1px); z-index:1;
    box-shadow:0 2px 18px rgba(60,45,20,.18), 0 1px 3px rgba(60,45,20,.10)}
  /* ---- the settings, on the panel off the right edge ---------------------- */
  /* the header, its mark on the left in the line the card's own marks are drawn
     in, and the card title's face and weight, which is the one heading face on
     the board */
  #sethead{
    flex:none; display:flex; align-items:center; gap:var(--sp-s);
    padding:14px 12px 11px; border-bottom:1px solid var(--line);
    font:625 17px/1.25 var(--inter); color:var(--ink);
  }
  #setmark{flex:none; display:block; color:var(--sub)}
  #setmark svg{display:block}
  /* what the header stands over, stepped in to start under its first letter:
     the header's own side padding, plus the mark and the step beside it */
  #setgroup{
    display:flex; flex-direction:column; gap:6px;
    padding:12px 12px 12px calc(12px + 16px + var(--sp-s));
  }
  /* the one thing on the phone the desktop has no need of: the ask for
     notifications, since a phone only asks on a tap. it is the card's own kind
     of control, no border and the paper for a fill, and it takes the board's
     one press shade mixed into that fill */
  #notify, #savediagnostic{
    align-self:flex-start; font:500 14px/1.2 var(--sans); color:var(--ink);
    background:var(--paper); border:none; border-radius:var(--sq);
    padding:9px 14px; cursor:pointer;
  }
  #notify:active, #savediagnostic:active{background:color-mix(in srgb, #000 var(--press), var(--paper))}
  #notify:disabled, #savediagnostic:disabled{opacity:.6}
  #notifynote{font:11.5px/1.4 var(--mono); color:var(--sub)}
  #notifynote:empty{display:none}
  #diagnostics{margin-top:16px; border-top:1px solid var(--line); padding-top:16px}
  #diagnostichelp, #diagnosticstatus{font:12px/1.5 var(--sans); color:var(--sub); margin:8px 0 0}
  #diagnosticstatus:empty{display:none}
  #diagnostictoast{position:fixed; z-index:30; top:48px; left:12px; right:12px;
    padding:10px 12px; background:var(--paper); border:1px solid var(--line);
    border-radius:var(--sq); font:13px/1.4 var(--sans); color:var(--ink); pointer-events:none}
  #diagnostictoast:empty{display:none}

  /* card prose, the .cardmd rules, is shared with the desktop: card-tokens.css */
  /* the star on its own does not reach a ::before or a ::after, and layers like
     the menus' shade live on those, so they are named here too */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation:none !important; transition:none !important}
  }
</style>

</head>
<body>

<div id="page">
  <div class="bar"><span id="tabbar"></span></div>
  <div id="offline"></div>
  <main id="pane" class="blank">
    <div id="empty">no cards on this tab yet</div>
    <div id="cards"></div>
  </main>
</div>
<div id="scrim"></div>

<aside id="drawer" aria-label="cards" data-side="left">
  <div id="tikhead">
    <button id="tv-todo" class="tvb on" type="button">doing</button>
    <button id="tv-deferred" class="tvb" type="button">deferred</button>
    <button id="tv-done" class="tvb" type="button">done</button>
    <button id="tikadd" class="tikadd" type="button" title="new card" aria-label="new card">+</button>
  </div>
  <div id="tiklist"></div>
</aside>

<aside id="settings" aria-label="settings" data-side="right">
  <div id="sethead"><span id="setmark"></span>Settings</div>
  <div id="setgroup">
    <button id="notify" type="button">Notifications</button>
    <div id="notifynote"></div>
    <div id="diagnostics">
      <button id="savediagnostic" type="button" aria-describedby="diagnostichelp" aria-keyshortcuts="Control+Shift+M">Save diagnostic history</button>
      <p id="diagnostichelp">Mark a glitch and save recent timing and screen state to the Mac’s diagnostic log. Messages and titles are excluded. Unsaved history stays only in this open page.<br>Keyboard: Control + Shift + M.</p>
      <p id="diagnosticstatus" role="status"></p>
    </div>
  </div>
</aside>
<div id="diagnostictoast" role="status"></div>

<script src="/card-markdown.js"></script>
<script src="/card-logic.js"></script>
<script src="/card-report.js"></script>
<script>
// the phone is where a failure is hardest to reproduce, so it reports the same
// way the board does: thrown errors, failed fetches, failed renders
if (typeof startReporter === "function") startReporter("phone");
// the marker a freeze report carries; it goes nowhere if the reporter is absent
if (typeof noteDoing !== "function") window.noteDoing = () => {};
// The recorder is optional and every call is isolated from the phone's work.
function tracePhone(action, ...args){
  try { return window.phoneHistory?.[action](...args); } catch (_) {}
}
function phoneTraceState(){
  try {
    const el = selectedId && els[selectedId];
    const b = lastState?.boxes.find(box => box.id === selectedId);
    return { box: selectedId, selected: selectedId, known: !!b, present: !!el?.box.isConnected,
      shown: !!el?.box.classList.contains("sel") && !document.getElementById("pane").classList.contains("blank"),
      title: !!el?.titleEl.isConnected, titled: !!b?.title, emptyTitle: !el?.titleEl.textContent,
      editing: !!el?.titleEl.isContentEditable, boxes: document.getElementById("cards").childElementCount,
      kb: document.body.classList.contains("kb"), lifting: document.body.classList.contains("lifting") };
  } catch (_) { return {}; }
}
function endPhoneTrace(token, detail, response, inspect = false){
  try { tracePhone("end", token, inspect ? { ...phoneTraceState(), ...detail } : detail, response); } catch (_) {}
}
// ---- what the desktop card carries, at phone size ---------------------------
const PLUS_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>';
const SEND_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 11.5V3.5M3.6 6.9 7 3.5l3.4 3.4" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const MOON_ICON = '<svg viewBox="0 0 24 24" width="9" height="9" fill="currentColor" stroke="none" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
// the settings mark, drawn in the same line the plus is drawn in: one weight,
// round ends, no fill. a gear, the mark every phone puts on its own settings:
// a ring, and eight teeth standing on the ring rather than off it, which is
// what tells a gear from a sun at this size
const GEAR_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>';
const CHEV_PATH = '<path d="M1 5.5 5.5 1.5 10 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
const chevSVG = seat => '<svg class="chev ' + seat + '" width="11" height="7" viewBox="0 0 11 7" fill="none" aria-hidden="true">' + CHEV_PATH + "</svg>";

const els = {};                 // box id -> the card's parts
let lastState = null;
let pollFails = 0;
let selectedId = localStorage.getItem("selbox") || null;
let activeOwner = localStorage.getItem("activeproj") || "facilitator";
let validOwners = new Set();
let ticketView = "todo";        // the drawer's tab: doing, deferred, done
const lastSel = {};             // owner -> the card he was on when he left that tab
let pendingFocus = null;        // a card just made: name it as soon as it is drawn
let wantBox = new URLSearchParams(location.search).get("box");   // a notification opened the page on this card

// the card's helpers, the one state a card's colour and place come from, the
// lanes and the times are shared with the desktop: card-logic.js

// ---- the two numbers the card's fades are cut to -------------------------------
// the desktop's own measures, restated here rather than shared: they are the
// desktop page's script and this page may not write in it. the rules they feed
// are the desktop's rules, so a change to either page's ramp has to be made in
// both, and the numbers themselves live in the sheet where both can read them.
//
// how deep the sent box and the typing row stand over the answer, written on the
// answer as --boxband. it is measured to the wrapper's top edge less the answer's
// own clear air, so the white the ramp ends on is the same white every other card
// leaves. whole pixels: this becomes a gradient stop, and chrome paints a stop
// asked for at a whole number where it was asked and at a fraction not quite
// there
function boxBand(reply, wrap){
  const clear = parseFloat(getComputedStyle(reply).marginBottom) || 0;
  const b = reply.getBoundingClientRect().bottom -
            (wrap.getBoundingClientRect().top - clear);
  return Math.max(0, Math.round(b));
}
// a ResizeObserver and not a hook on each send: it delivers after layout and
// before paint on every frame the wrapper's height changes, which is every frame
// of the box's arrival and of a fold, so the ramp's top edge and the box's top
// edge are the same line on every frame rather than one frame behind it
function watchBand(el){
  const write = () => el.reply.style.setProperty("--boxband", boxBand(el.reply, el.pendwrap) + "px");
  if (window.ResizeObserver){
    const ro = new ResizeObserver(write);
    ro.observe(el.pendwrap);
    ro.observe(el.reply);
  }
  write();
}
// how much of the answer has gone up out of sight, written back on it as
// --upband, which is the depth the ramp under the title is cut to. capped at the
// ramp's own depth, read off --replyfade on the element rather than typed here.
// the read is kept on the node once it lands, but never an empty read: the value
// is written on the shown card and a card is built before it is shown, so the
// first read on a fresh card comes back with nothing and has to be taken again
function riseBand(node){
  if (!node._fade){
    const fade = parseFloat(getComputedStyle(node).getPropertyValue("--replyfade")) || 0;
    if (fade) node._fade = fade;
  }
  const up = Math.min(Math.round(node.scrollTop), node._fade || 0);
  if (up === node._up) return;
  node._up = up;
  node.style.setProperty("--upband", up + "px");
}
// armed on the scroll itself, passive, since all it does is read a number the
// scroll has already settled and hand it to a gradient. once at the start too,
// so a card opened part way down opens with the right band
function watchRise(node){
  node.addEventListener("scroll", () => riseBand(node), { passive: true });
  riseBand(node);
}

// ---- the card ----------------------------------------------------------------
function makeBox(b){
  noteDoing("card");
  const box = h("article", "box");
  box.id = "box-" + b.id;

  const topbar = h("div", "topbar");
  const histctl = h("div", "histctl");
  const histUp = h("button", "histbtn older");
  histUp.type = "button"; histUp.title = "older reply"; histUp.setAttribute("aria-label", "older reply");
  histUp.innerHTML = chevSVG("");
  const histDown = h("button", "histbtn newer");
  histDown.type = "button"; histDown.title = "newer reply"; histDown.setAttribute("aria-label", "newer reply");
  histDown.innerHTML = chevSVG("");
  histDown.disabled = true;
  const histPos = h("span", "histpos");
  histctl.append(histUp, histDown, histPos);
  histUp.addEventListener("click", () => histStep(b.id, 1));
  histDown.addEventListener("click", () => histStep(b.id, -1));
  const arc = h("button", "arcbtn");
  arc.type = "button"; arc.title = "defer to the deferred tab"; arc.setAttribute("aria-label", "defer");
  arc.innerHTML = MOON_ICON;
  arc.addEventListener("click", e => { e.stopPropagation(); toggleFlag(b.id, "park"); });
  const x = h("button", "xbtn");
  x.type = "button"; x.title = "done (an empty card is removed instead)"; x.setAttribute("aria-label", "close");
  x.addEventListener("click", e => { e.stopPropagation(); closeCard(b.id); });
  topbar.append(histctl, arc, x);
  box.appendChild(topbar);

  const head = h("div", "head");
  const titleEl = h("span", "title", b.title);
  titleEl.addEventListener("click", () => { if (!titleEl.isContentEditable) editTitle(b.id, { fromClick: true }); });
  head.appendChild(titleEl);
  box.appendChild(head);

  const body = h("div", "body");
  const reply = h("div", "reply cardmd");
  reply.dataset.raw = replyFull(b);
  reply.innerHTML = fmt(reply.dataset.raw);
  barFade(reply);
  const pendwrap = h("div", "pendwrap");
  const meta = h("div", "meta");
  const bottombar = h("div", "bottombar");
  const clipfile = h("input", "clipfile");
  clipfile.type = "file";
  clipfile.accept = "image/*";
  clipfile.multiple = true;
  clipfile.tabIndex = -1;
  clipfile.setAttribute("aria-hidden", "true");
  const clip = h("button", "clipbtn");
  clip.type = "button"; clip.title = "attach a picture"; clip.setAttribute("aria-label", "attach a picture");
  clip.innerHTML = PLUS_ICON;
  const compose = h("div", "compose");
  const ta = h("textarea");
  ta.rows = 1;
  const send = h("button", "sendbtn");
  send.type = "button"; send.setAttribute("aria-label", "send");
  send.innerHTML = SEND_ICON;
  const twin = h("textarea", "twin");
  twin.rows = 1; twin.tabIndex = -1; twin.readOnly = true; twin.setAttribute("aria-hidden", "true");
  compose.append(ta, send, twin);
  bottombar.append(clipfile, clip, compose);
  pendwrap.append(meta, bottombar);
  body.append(reply, pendwrap);
  box.appendChild(body);
  document.getElementById("cards").appendChild(box);

  // the row grows to its text, measured on the twin (fitRow), and the line
  // under the caret is brought into view after every keystroke and on focus
  // (revealCaret); the blink keeps the phone from scrolling the page for the
  // caret on a keystroke while the keyboard is up, and on any grown line
  const tick = typed => {
    const grew = fitRow(ta, twin);
    if (document.activeElement === ta && (grew || (typed && document.body.classList.contains("obstructed")))) blinkRow(ta);
    revealCaret(ta, twin);
    seatSquare(ta, send);
    send.classList.toggle("show", ta.value.trim().length > 0);
  };
  ta.addEventListener("input", () => { clearPhoneEnterAgain(); tick(true); });
  ta.addEventListener("focus", () => {
    const trace = tracePhone("begin", "focus", { box: b.id });
    requestAnimationFrame(() => {
      revealCaret(ta, twin);
      endPhoneTrace(trace, { box: b.id }, null, true);
    });
  });
  ta.addEventListener("mousedown", takeFocusTap);
  // enter sends and shift enter makes a new line, the desktop composer's pair,
  // and only while the on-screen keyboard is down. a phone puts that keyboard
  // away when a keyboard is paired with it, so a row being typed in with no
  // keyboard on screen is a row being typed on by hand, where the desktop's
  // habit belongs. with the on-screen keyboard up the return key still makes a
  // new line, as it always has here, and the square is still the way to send
  ta.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.shiftKey || e.isComposing || document.body.classList.contains("kb")) return;
    e.preventDefault();
    if (e.repeat) return;
    if (!ta.value.trim()){
      if (!askPhoneEnterAdvance(b.id)) cancelAutoNext();
      return;
    }
    const op = doSend(b.id, { advance: false });
    if (op) armPhoneEnterAgain(b.id, op);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => tick());
  tick();
  send.addEventListener("pointerdown", e => {
    tracePhone("note", "send", { box: b.id });

// ---- the sent box --------------------------------------------------------------
// arrive is what tells a send from a poll, exactly as it does on the desktop: a

function growPend(el, arrive){

// ---- sending, closing, parking, naming ------------------------------------------

// card is closed and the next one still open takes the screen, so the screen is
// never left holding a card that has just gone
async function closeCard(id){
  await fetch("/close?box=" + encodeURIComponent(id), { method: "POST" }).catch(() => {});
  const doing = lastState ? poolOf(lastState).filter(o => !o.done && !o.parked && o.id !== id && o.id !== "0" && o.id !== "t0") : [];
  if (doing.length) select(doing[0].id); else deselect();

function undone(id){

// The send button keeps the existing confirmed-send move. Enter has its own
// explicit gesture: the first press sends and stays, and a separate second
// press inside this window asks to move after the send is confirmed.
let autoNext = null;
const AUTONEXT_MS = 0;   // the desktop's number; a quiet time after a send before moving on
const ENTER_AGAIN_MS = 700;
let lastLeftId = null;   // the card the send's move left, for the bounce on command z
let phoneEnterAgain = null;   // transient by design; a reload never revives a move
function phoneEnterViewKey(id){
  const anchor = lastState && lastState.boxes.find(b => b.id === id);
  return [id, activeOwner, ticketView, anchor && anchor.ws ? anchor.ws : ""].join("|");
}
function clearPhoneEnterAgain(intent = phoneEnterAgain){
  if (!intent) return;

  intent.active = false;
  intent.op.advance = false;
  if (phoneEnterAgain === intent) phoneEnterAgain = null;
}
function cancelAutoNext(){
  clearTimeout(autoNext); autoNext = null;
  clearPhoneEnterAgain();
  for (const op of ops) if (op.kind === "send") op.advance = false;
}
function schedulePhoneAdvance(op, intent = null){
  clearTimeout(autoNext);
  autoNext = setTimeout(() => {
    autoNext = null;
    if (intent){
      const valid = intent.active && phoneEnterAgain === intent && intent.advance &&
        phoneEnterViewKey(op.box) === intent.view;
      clearPhoneEnterAgain(intent);
      if (!valid) return;
    }
    if (selectedId === op.box && jumpNextYellow(op.box, null, navigationPool(lastState, op.box)))
      lastLeftId = op.box;
  }, AUTONEXT_MS);
}
function armPhoneEnterAgain(id, op){
  cancelAutoNext();

    id, op, view: phoneEnterViewKey(id), deadline: Date.now() + ENTER_AGAIN_MS,
    delivered: false, advance: false, active: true, timer: null,
  };

    if (phoneEnterAgain === intent && !intent.advance) clearPhoneEnterAgain(intent);
  }, ENTER_AGAIN_MS);

function askPhoneEnterAdvance(id){
  const intent = phoneEnterAgain;

  if (intent.advance) return true;
  if (Date.now() > intent.deadline) return false;
  intent.advance = true;
  intent.op.advance = true;

// ---- what the phone has asked the board and not yet heard back on -----------------
// the phone is a room and a radio away from the board. a tap has to show
// something now, and the words have to land once, whatever the radio does to
// the reply. so every send and every new card is an operation: an id minted
// here before the first try, kept in this phone's storage until the board has
// confirmed it, and sent again under the same id until it has. the board keeps
// the result beside the effect, so a retry after a lost reply is answered from
// the receipt and the message never lands twice. one card's sends go one at a
// time, in the order he typed them; a card being made is one card however many
// times the plus is pressed while it is on its way. the rows below are drawn
// from this store, so a card shows its unsent messages whether or not it is
// the one on screen, and a reload draws them again and sends them on.
const OPS_KEY = "pendops";
// operations kept at once, pending, unsure and not-sent together. past this
// the phone refuses to mint another rather than forget one, since every kept
// operation is words the board has not confirmed; the words of a refused send
// stay in the row he types on and the card says why
const OPS_MAX = 50;
const OP_TRY_MS = 10000;                     // one try's deadline
// how long a send is resent on its own. well under the two days the board
// promises to keep a receipt, so every retry still finds its receipt and lands
// at most once. past this the operation is unsure: nothing more is sent, the
// words stay on the card, and every reading asks the board for its receipt
const OP_GIVE_UP_MS = 12 * 3600 * 1000;
// how long after minting the board's answer "unknown" still proves the words
// never landed. a receipt is kept at least two days from the moment the board
// committed it, which is never before the minting, so inside this window no
// receipt means no commit. past it, unknown proves nothing, and the operation
// stays unsure until the owner decides
const OP_CERTAIN_MS = 36 * 3600 * 1000;
const OP_ASK_MAX = 32;                       // receipts one reading may ask after, the board's own cap
const RETRY_MIN_MS = 1500, RETRY_MAX_MS = 30000;
// pending: being sent and resent. unsure: no more sends, the outcome unknown,
// kept and asked about. failed: the board refused it or has no receipt inside
// the window where that proves it never landed
const OP_STATES = new Set(["pending", "unsure", "failed"]);
let ops = [];                                // in the order they were asked
const opRows = {};                           // op id -> its row on the card, while it is unconfirmed
const opSleepers = new Set();                // the retry sleeps a wake ends early
const opWorkers = {};                        // lane -> the loop working that lane's operations
let opsStarted = false;                      // the loops start after the first reading, which reconciles first

function loadOps(){
  try {
    const kept = JSON.parse(localStorage.getItem(OPS_KEY) || "[]");
    ops = Array.isArray(kept) ? kept.filter(o => o && typeof o.id === "string" &&
      (o.kind === "send" || o.kind === "create") && OP_STATES.has(o.state)).slice(-OPS_MAX) : [];
  } catch (e) { ops = []; }
  for (const op of ops){
    op.fresh = false; op.armed = false; op.advance = false;   // a reload never steals the card after an old receipt arrives
    // only the board can call a send not sent. a record marked failed for any
    // other reason, a horizon or a full store under an earlier page, is a send
    // whose outcome is unknown, and an absent receipt does not prove it never
    // landed: it is kept as unsure and asked about
    if (op.state === "failed" && op.by !== "board"){ op.state = "unsure"; op.why = "not confirmed by the board"; }
  }
}
function saveOps(){
  try { localStorage.setItem(OPS_KEY, JSON.stringify(ops.map(({ fresh, armed, advance, ...op }) => op))); } catch (e) {}
}
function newOpId(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
}
// null when the store is full: the caller keeps the words where they are and
// says so. nothing kept is ever dropped to make room, because every kept
// operation is words the board has not confirmed, and forgetting one would be
// forgetting whether it was sent
function mintOp(kind, fields){
  if (ops.length >= OPS_MAX) return null;
  const op = { id: newOpId(), kind, ts: Date.now(), tries: 0, waiting: false, asked: 0, state: "pending", ...fields };
  ops.push(op);
  saveOps();
  return op;
}
function laneOf(op){ return op.kind === "create" ? "create" : "send:" + op.box; }
function localSends(box){ return ops.filter(o => o.kind === "send" && o.box === box); }
function pendingCreate(){ return ops.find(o => o.kind === "create" && o.state === "pending"); }
// what a reading asks the board about: the pending and unsure operations least
// recently asked, within the board's cap for one reading. the store can hold
// more than one reading may ask after, so the turn goes round: whatever was
// asked about last time goes to the back, and every kept operation is asked
// about within a couple of readings, never starved by the same first batch
function askIds(){
  const askable = ops.filter(o => o.state === "pending" || o.state === "unsure")
    .sort((a, b) => (a.asked || 0) - (b.asked || 0));
  const chosen = askable.slice(0, OP_ASK_MAX);
  const now = Date.now();
  for (const op of chosen) op.asked = now;
  return chosen.map(o => o.id);
}
function backoffMs(tries){ return Math.min(RETRY_MAX_MS, RETRY_MIN_MS * 2 ** Math.max(0, tries - 1)) * (0.8 + Math.random() * 0.4); }
function retrySleep(ms){
  return new Promise(resolve => {
    const done = () => { clearTimeout(timer); opSleepers.delete(done); resolve(); };
    const timer = setTimeout(done, ms);
    opSleepers.add(done);
  });
}
// a resume, a tap on the plus, the board answering again: every sleeping retry
// wakes and every lane with something pending is worked
function wakeOps(){
  for (const done of [...opSleepers]) done();
  for (const op of ops) if (op.state === "pending") runOps(laneOf(op));
}
function runOps(lane){
  if (opWorkers[lane]) return;
  opWorkers[lane] = (async () => {
    try {
      for (;;){
        const op = ops.find(o => o.state === "pending" && laneOf(o) === lane);
        if (!op) return;
        if (Date.now() - op.ts > OP_GIVE_UP_MS){ markUnsure(op, "no answer from the board for half a day"); continue; }
        if (await tryOp(op) === "retry"){
          op.waiting = true;
          drawOpState(op);
          await retrySleep(backoffMs(op.tries));
        }
      }
    } finally { delete opWorkers[lane]; }
  })();
}
// one try. done means the operation is settled either way; retry means the
// board could not be reached or was busy, which says nothing about whether
// the words landed, and the same id asked again is safe either way
async function tryOp(op){
  if (op.state !== "pending") return "done";
  op.tries++; op.waiting = false;
  drawOpState(op);
  const url = op.kind === "send"
    ? "/send?box=" + encodeURIComponent(op.box) + "&op=" + encodeURIComponent(op.id)
    : "/create?owner=" + encodeURIComponent(op.owner) + "&op=" + encodeURIComponent(op.id);
  let r;
  const trace = tracePhone("begin", "request", { route: op.kind === "send" ? "/send" : "/create", box: op.box, op: op.id });
  try {
    r = await fetch(url, { method: "POST", body: op.kind === "send" ? op.text : "", signal: AbortSignal.timeout(OP_TRY_MS) });
  } catch (e) {
    endPhoneTrace(trace, { op: op.id, outcome: "retry" });
    return "retry";
  }
  if (op.state !== "pending"){
    endPhoneTrace(trace, { op: op.id, status: r.status }, r);
    return "done";   // a reading reconciled it while this try was out
  }
  if (r.ok){
    let result = null;
    try { result = await r.json(); } catch (e) {}
    if (!result || !result.ok){
      endPhoneTrace(trace, { op: op.id, status: r.status, outcome: "retry" }, r);
      return "retry";   // it landed and the answer was lost on the way: the retry is answered from the receipt
    }
    endPhoneTrace(trace, { op: op.id, status: r.status }, r);
    applyOp(op, result);
    return "done";
  }
  if (r.status === 400 || r.status === 409 || r.status === 413){
    let why = "";
    try { why = (await r.json()).error || ""; } catch (e) {}
    endPhoneTrace(trace, { op: op.id, status: r.status }, r);
    failOp(op, why || ("refused " + r.status), "board");
    return "done";
  }
  endPhoneTrace(trace, { op: op.id, status: r.status, outcome: "retry" }, r);
  return "retry";
}
// the board's receipts, asked after with every reading. a pending or unsure
// operation the board has applied is landed here, however long ago its reply
// was lost. an unsure operation the board has no receipt of is not sent, inside
// the window where that proves it never landed; past that window it stays
// unsure, since the board cannot tell a message that never came from one
// whose receipt has aged out, and neither can the phone. a pending one the
// board has no receipt of is left to its loop to send again
function reconcileOps(answer){
  for (const [id, said] of Object.entries(answer || {})){
    const op = ops.find(o => o.id === id && (o.state === "pending" || o.state === "unsure"));
    if (!op || !said) continue;
    if (said.status === "applied"){ applyOp(op, { ...(said.result || {}), replayed: true }); continue; }
    if (said.status === "unknown" && op.state === "unsure" && Date.now() - op.ts < OP_CERTAIN_MS){
      failOp(op, "the board has no record of it", "board");
    }
  }
}
function applyOp(op, result){
  if (op.state !== "pending" && op.state !== "unsure") return;
  tracePhone("note", "operation", { op: op.id, box: op.box || result.id, outcome: "applied" });
  op.state = "applied";
  ops = ops.filter(o => o !== op);
  saveOps();
  const row = opRows[op.id];
  if (row){ row.remove(); delete opRows[op.id]; }
  if (op.kind === "send") landSend(op, result); else landCreate(op, result);
  if (result.rev != null && lastRev != null && result.rev !== lastRev) poll();   // the board moved: read it now rather than a tick later
}
// nothing more is sent for this operation and nothing is decided: the words
// stay on the card, the readings keep asking the board about it, and it is
// settled only by a receipt or by the owner's own hand
function markUnsure(op, why){
  if (op.state !== "pending") return;
  tracePhone("note", "operation", { op: op.id, box: op.box, outcome: "unsure" });
  if (phoneEnterAgain && phoneEnterAgain.op === op) clearPhoneEnterAgain(phoneEnterAgain);
  op.advance = false;
  op.state = "unsure"; op.why = why; op.waiting = false;
  if (op.kind === "create"){
    drawCreatePending();
    drawerNote("Could not confirm the card was made; it will show here if it was");
  } else {
    const el = els[op.box];
    if (el) drawLocalRows(el, localSends(op.box));
  }
  saveOps();
}
// by says who decided: "board" for a refusal the board itself gave, or for an
// absent receipt inside the window where that proves the words never landed.
// only those stay not-sent across a reload; anything else is an unknown outcome
function failOp(op, why, by){
  if (op.state !== "pending" && op.state !== "unsure") return;
  tracePhone("note", "operation", { op: op.id, box: op.box, outcome: "failed" });
  if (phoneEnterAgain && phoneEnterAgain.op === op) clearPhoneEnterAgain(phoneEnterAgain);
  op.advance = false;
  op.state = "failed"; op.why = why; op.by = by || "phone";
  if (op.kind === "create"){
    ops = ops.filter(o => o !== op);
    drawCreatePending();
    drawerNote("The card could not be made: " + why);
  } else {
    const el = els[op.box];
    if (el) drawLocalRows(el, localSends(op.box));
  }
  saveOps();
}
// a confirmed send: the row moves from the unsent rows to the delivered ones,
// exactly the row the board's next reading would draw, so that reading finds
// it there and adds nothing. sendGuard is the moment it landed: a reading asked
// before it knows nothing of it and may not take it away
function landSend(op, result){
  const el = els[op.box];
  if (!el) return;
  const pend = el.pend || growPend(el, true);
  const row = pendRow(op.text);
  if (pend.classList.contains("open")) row.classList.add("pop");
  pend.querySelector(".pendslide").appendChild(row);
  stampRcpts(pend);
  if (!pend.querySelector(".pendstamp").textContent) stampRun(pend, [op.ts / 1000]);
  pendBottom(pend);
  el.pendRaw = el.pendRaw ? el.pendRaw + "\n\n" + op.text : op.text;
  el.sendGuard = Date.now();
  if (el.meta.textContent.indexOf("send ") === 0) el.meta.textContent = "";
  if (op.reopen) undone(op.box);   // the message is in; the flip rides behind it

// a confirmed new card: drawn from the answer, which carries the card, rather
// than from a reading a tick later. a card this page asked for is named now;
// one asked for before a reload or a sleep is shown and left named as it is
function landCreate(op, result){
  drawCreatePending();

  if (Number.isSafeInteger(result.rev)){
    createRevFloor = createRevFloor == null ? result.rev : Math.max(createRevFloor, result.rev);
  }
  if (result.card && lastState && !lastState.boxes.some(b => b.id === result.card.id)){
    let at = -1;
    lastState.boxes.forEach((b, i) => { if (b.bucket === "meta" && b.owner === result.card.owner) at = i; });
    lastState.boxes.splice(at + 1, 0, result.card);
  }
  if (op.fresh){ pendingFocus = result.id; closeDrawer(); }

// the words of a message the board refused, or could not be reached for, go
// back in the row he types on; after what is already there, never over it
function takeBack(op){
  ops = ops.filter(o => o !== op);
  saveOps();
  const row = opRows[op.id];
  if (row){ row.remove(); delete opRows[op.id]; }
  const el = els[op.box];
  if (!el) return;
  el.ta.value = el.ta.value.trim() ? el.ta.value.trimEnd() + "\n\n" + op.text : op.text;
  el.tick();
  drawLocalRows(el, localSends(op.box));
  // taking one back makes room: a send held for want of it may go now
  if (el.meta.textContent.indexOf("send held") === 0 && ops.length < OPS_MAX) el.meta.textContent = "";

// the unsent rows of one card, after the delivered ones: one row per
// operation, its receipt saying where it stands
function drawLocalRows(el, local){
  if (!local.length){
    if (el.pend){
      el.pend.querySelector(".pendlocal").textContent = "";
      if (!el.pend.querySelector(".pendslide").children.length) dropPend(el);
    }
    return;
  }
  const pend = el.pend || growPend(el, true);
  const holder = pend.querySelector(".pendlocal");
  const want = new Set(local.map(o => o.id));
  for (const row of [...holder.children]){
    if (!want.has(row.dataset.op)){ row.remove(); delete opRows[row.dataset.op]; }
  }
  for (const op of local){
    let row = opRows[op.id];
    if (!row || row.parentNode !== holder){
      row = pendRow(op.text);
      row.dataset.op = op.id;
      // a not-sent row gives the words back on a tap. an unsure row is his to
      // decide: the first tap arms it and says the message may already have
      // gone, and only a second tap within a few seconds takes the words back;
      // nothing is ever resent for it on its own
      row.addEventListener("click", e => {
        if (op.state === "failed"){ e.stopPropagation(); takeBack(op); return; }
        if (op.state !== "unsure") return;
        e.stopPropagation();
        if (op.armed){ takeBack(op); return; }
        op.armed = true;
        drawOpState(op);
        setTimeout(() => { if (op.armed){ op.armed = false; drawOpState(op); } }, 5000);
      });
      holder.appendChild(row);
      opRows[op.id] = row;
    }
    drawOpState(op);
  }
  if (!pend.querySelector(".pendstamp").textContent) stampRun(pend, [local[0].ts / 1000]);
}
function drawOpState(op){
  if (op.kind === "create"){ drawCreatePending(); return; }
  const row = opRows[op.id];
  if (!row) return;
  row.classList.toggle("pending", op.state === "pending");
  row.classList.toggle("unsure", op.state === "unsure");
  row.classList.toggle("failed", op.state === "failed");
  row.querySelector(".rcpt").textContent =
    op.state === "failed" ? "Not sent, tap to take the words back"
    : op.state === "unsure" ? (op.armed ? "Tap again to take the words back; it may already have gone" : "Could not confirm it was sent")
    : op.waiting ? "Not sent yet, retrying" : "Sending";
}
function drawCreatePending(){
  const plus = document.getElementById("tikadd");
  const making = !!pendingCreate();
  plus.classList.toggle("pending", making);
  plus.setAttribute("aria-busy", making ? "true" : "false");
  plus.title = making ? "making the card" : "new card";
}
function drawerNote(text){
  const tik = document.getElementById("tiklist");
  const note = h("div", "tiknote", text);
  tik.prepend(note);
  setTimeout(() => note.remove(), 6000);
}

// ---- sending and making ------------------------------------------------------------
// the tap is answered on the tap: the row lands in the box now, marked as on
// its way, and the operation loop behind it sees it home. the desktop waits
// for the server before it draws the line because the server is on the same
// machine and answers in a millisecond; here that wait is a second of nothing
// happening under his finger
function doSend(id, opts){
  opts = opts || {};
  const trace = tracePhone("begin", "send", { box: id });
  const el = els[id];
  const text = el.ta.value.trim();
  if (!text){ endPhoneTrace(trace); return; }
  const reopen = boxDone(id);
  const op = mintOp("send", { box: id, text, reopen });
  if (!op){
    // the store is full: the words stay in the row, and the card says why.
    // this clears on its own once a reading finds room again
    el.meta.textContent = "send held: fifty messages are still unconfirmed on this phone; wait for the board, or take some back";
    endPhoneTrace(trace, { outcome: "failed" });
    return;
  }
  tracePhone("note", "operation", { op: op.id, box: id, outcome: "minted" });
  op.advance = opts.advance !== false;
  el.ta.value = "";
  el.tick();          // the square goes with the words, and the row falls back to one line
  const pend = el.pend || growPend(el, true);
  drawLocalRows(el, localSends(id));
  if (pend.classList.contains("open")) opRows[op.id]?.classList.add("pop");
  pendBottom(pend);
  if (hist && hist.id === id) histExit(id);   // a send lands you back on the live reply
  runOps(laneOf(op));
  endPhoneTrace(trace, { op: op.id, box: id }, null, true);
  return op;
}
// one press, one card. a press while the card is still being made is the same
// press: it wakes the try rather than minting another card, and the plus
// breathes until the board answers. once the card is there the next press is
// a deliberate second card
function createCard(){
  const trace = tracePhone("begin", "create");
  if (!validOwners.has(activeOwner)){ endPhoneTrace(trace); return; }
  if (pendingCreate()){ wakeOps(); endPhoneTrace(trace); return; }
  const op = mintOp("create", { owner: activeOwner });
  if (!op){ drawerNote("No card can be made while fifty messages are still unconfirmed on this phone"); endPhoneTrace(trace, { outcome: "failed" }); return; }
  tracePhone("note", "operation", { op: op.id, outcome: "minted" });

// ---- carrying a tab along the bar --------------------------------------------------

// no mouse the press has to be held first, or every scroll of the bar would

// is the bar it always was, and the order it lands on goes to the board, so

function liftTab(){

  t.idx = t.tabs.indexOf(t.el);
  if (t.idx < 0){ tabTouch = null; return; }   // the bar rebuilt under the finger
  t.rects = t.tabs.map(el => el.getBoundingClientRect());

             Math.min(r[r.length - 1].right - r[i].right, raw));
  t.el.style.transform = "translate(" + dx + "px, -2px)";
  const center = r[i].left + r[i].width / 2 + raw;
  let slot = 0;
  for (let j = 0; j < r.length; j++)
    if (j !== i && center > r[j].left + r[j].width / 2) slot++;

  t.slot = slot;
  const shift = r[i].width + t.gap;
  for (let j = 0; j < t.tabs.length; j++){
    if (j === i) continue;

  const order = (lastState ? allRowsOf(lastState) : strip).filter(ow => ow !== t.ow);

// ---- the two menus, and the one motion they share --------------------------------
// the card list is pulled over the page from the left edge and settings from the
// right. one number, the fraction the menu is out by, drives its sideways
// travel, the weight of the shade it casts, the shade over the page, and how
// far the page itself draws back towards the middle of the screen. the menu

const page = document.getElementById("page");

const PAGE_SINK = 0.015;
// the one number, painted onto the shade, the menu and the page. the travel is

  scrim.style.setProperty("--scrimv", v ? v.toFixed(4) : "0");
  page.style.setProperty("--page-scale", (1 - PAGE_SINK * v).toFixed(5));
  panel.style.setProperty("--panel-depth", v.toFixed(4));   // how far off the page it stands

{
  const EDGE = 28;    // how far in from an edge a pull may begin
  let panel = null, x0 = 0, y0 = 0, at = 0, live = false, opening = false, decided = false;
  const start = (x, y) => {
    const out = menuOut();

    else if (x >= innerWidth - EDGE){ panel = settings; opening = true; }
    else { panel = null; return; }
    live = true; decided = false; x0 = x; y0 = y; at = opening ? 0 : 1;
  };
  const move = (x, y, e) => {
    if (!live) return;
    const dx = x - x0;
    if (!decided){
      if (Math.abs(dx) < 6 && Math.abs(y - y0) < 6) return;
      if (Math.abs(y - y0) > Math.abs(dx)){ live = false; return; }   // a scroll, not a pull
      decided = true;
      tracePhone("note", "drawer", { side: panel.dataset.side, phase: "start" });
      document.body.classList.add("menudrag");
    }
    if (e && e.cancelable) e.preventDefault();
    const w = menuWidth(panel), d = menuSign(panel) * dx;
    at = Math.max(0, Math.min(1, (opening ? d : w + d) / w));
    paintMenu(panel, at);
  };

    if (!live) return;

  document.addEventListener("touchend", end);
  document.addEventListener("touchcancel", end);

  document.addEventListener("mousedown", e => { if (e.button === 0) start(e.clientX, e.clientY); });

}

function apply(state){

  // first, ahead of the tabs and the list that draw from them

    if (!state.boxes.some(b => b.id === id)){

      delete histCache[id];
      els[id].box.remove(); delete els[id];
    }
  }
  for (const b of state.boxes){
    if (b.id === "q") continue;
    if (!els[b.id]) makeBox(b);
    const el = els[b.id];
    const rawReply = replyFull(b);
    if (el.reply.dataset.raw !== rawReply){
      el.reply.dataset.raw = rawReply;
      delete histCache[b.id];
      if (hist && hist.id === b.id) histExit(b.id);
      else el.reply.innerHTML = fmt(rawReply);
    }
    if (!el.titleEl.isContentEditable && el.titleEl.textContent !== b.title) el.titleEl.textContent = b.title;
    const pt = (b.pendingTexts || []).join("\n\n");
    // the line a send has just drawn is not the poll's to take away. a state
    // fetched before the server had that message knows nothing about it, and the
    // pass over the box would read the shorter list as the run being claimed and
    // clear the box he is looking at. el.sendGuard is the moment the send landed,
    // and stands at the end of time while one is still in flight
    const stale = (state.fetchedAt || 0) < (el.sendGuard || 0);
    if (!stale) syncPendPhone(el, b, pt);

    el.box.classList.toggle("done", cs === "done");
    el.box.classList.toggle("parked", cs === "parked");
    el.box.classList.toggle("hashist", (b.replies || 0) > 1);
    // a note about a send that failed or was held stays until the card can
    // take another; any other note is the poll's to clear. a held send clears
    // as soon as there is room again
    if (el.meta.textContent && el.meta.textContent.indexOf("send ") !== 0) el.meta.textContent = "";

}

// ---- reading the board -------------------------------------------------------------
// one reading at a time, each with a deadline, spaced POLL_MS apart while the
// page is on screen and further apart while the board is not answering. the
// reading names the revision this page holds, so a board that has not changed
// answers in a few hundred bytes, and it asks after every operation still
// pending, so on waking what landed while the phone slept is drawn from the
// board's receipts and what did not is sent again. the note under the tabs

// on screen then is the last reading, not the board

function schedulePoll(ms){
  clearTimeout(pollTimer); pollTimer = null;
  if (document.hidden) return;   // a hidden page reads nothing; the resume reads at once
  pollTimer = setTimeout(() => { pollTimer = null; poll(); }, ms);
}
function linkStatus(){
  const bar = document.getElementById("offline");
  if (pollFails < STALE_AFTER){
    document.body.classList.remove("offline");
    bar.classList.remove("stale");
    return;
  }
  const since = lastGood ? " Last update " + stampText(lastGood / 1000) + "." : "";
  const gone = !lastGood || Date.now() - lastGood > OFFLINE_AFTER_MS;
  bar.textContent = gone
    ? "The facilitator server is not answering. Messages you send are kept on this phone and delivered when it is back." + since
    : "Reconnecting to the board." + since;
  bar.classList.toggle("stale", !gone);
  document.body.classList.add("offline");
}
// one reading at a time. asked while one is out, poll answers with the reading
// that follows it, so whoever waits on it gets a reading asked for after their
// change landed, never the one that was already on its way
let pollRun = null;
function poll(){
  if (pollRun){
    pollAgain = true;
    return pollRun.then(() => pollRun || null);
  }
  pollRun = readBoard().finally(() => {
    pollRun = null;
    if (pollAgain){ pollAgain = false; poll(); }
    else schedulePoll(pollGap);
  });
  return pollRun;
}
// the fetch and the render each get their own try, as on the board: the note
// is for a server that did not answer, and a card that will not draw is
// reported instead of being dressed up as one
async function readBoard(){
  clearTimeout(pollTimer); pollTimer = null;
  const asked = Date.now();   // when this state was asked for, which is what says
  // whether it can know about a message sent since
  noteDoing("poll");
  let data = null;
  const trace = tracePhone("begin", "request", { route: "/m/state" });
  let response = null;
  try {
    const query = ["since=" + (lastRev == null ? "" : lastRev)];
    const waiting = askIds();
    if (waiting.length) query.push("ops=" + waiting.map(encodeURIComponent).join(","));
    const r = await fetch("/m/state?" + query.join("&"), { cache: "no-store", signal: AbortSignal.timeout(POLL_DEADLINE_MS) });
    response = r;
    if (!r.ok) throw new Error("status " + r.status);
    data = await r.json();
  } catch (e) {
    pollFails++;
    pollGap = Math.min(POLL_BACKOFF_MAX_MS, pollGap * 2);
    linkStatus();
  }
  endPhoneTrace(trace, { status: response?.status || 0, rev: data?.rev,
    ...(data ? {} : { outcome: "retry" }) }, response);
  if (data){
    pollFails = 0; pollGap = POLL_MS; lastGood = Date.now();
    linkStatus();
    if (createRevFloor != null && Number.isSafeInteger(data.rev) && data.rev < createRevFloor){
      pollAgain = true;
      if (!opsStarted){ opsStarted = true; wakeOps(); }
      return;
    }
    if (createRevFloor != null && Number.isSafeInteger(data.rev) && data.rev >= createRevFloor){
      createRevFloor = null;
    }
    noteDoing("render");
    try {
      if (data.ops) reconcileOps(data.ops);
      if (data.changed){
        const state = { ...data, ...(data.live || {}), fetchedAt: asked };
        delete state.live; delete state.ops;
        validateOwners(state);
        lastState = state;
        lastRev = data.rev;
        if (wantBox){
          const want = wantBox;
          const b = state.boxes.find(x => x.id === want);
          if (b && validOwners.has(b.owner)){ wantBox = null; activeOwner = b.owner; localStorage.setItem("activeproj", b.owner); selectedId = want; }
        }
        apply(state);
      } else if (lastState){
        const rendering = tracePhone("begin", "render", { rev: lastRev });
        Object.assign(lastState, data.live || {});
        lastState.fetchedAt = asked;
        renderTickets(lastState);   // who is listening moves without the revision moving
        endPhoneTrace(rendering, { rev: lastRev }, null, true);
      } else {
        lastRev = null;   // nothing held to be unchanged from: the next reading takes the whole board
      }
    } catch (e) {
      if (typeof reportProblem === "function") reportProblem("render", e);
    }
  }
  if (!opsStarted){ opsStarted = true; wakeOps(); }
}
// waking up: the phone was locked, the app was put away, the page was shown
// again, the network came back. one reading at once, which reconciles every
// pending operation, and every sleeping retry is woken
function resume(){
  pollGap = POLL_MS;
  poll();
  wakeOps();
}

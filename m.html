<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>facilitator</title>
<!-- the phone page. the same board, drawn for a phone: one card filling the
     screen from the top down to a row of four glass buttons along the bottom
     (the card list, the open project, a new card and the settings), the card
     list in a menu pulled in from the left edge and the settings in one pulled
     in from the right, and the board's home page, which the first row of the
     project list opens.
     nothing else. the card is the desktop card at phone size: the same top
     bar, title, answer, sent box, composer and buttons, in the same colours
     and faces, read straight out of index.html rather than redrawn -->
<link rel="manifest" href="/m-manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Facilitator">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="/m-icon-180.png">
<link rel="icon" href="/m-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- the web font sheets themselves are asked for further down, by the script
     before the shared files: a stylesheet linked here would keep the curtain
     from being drawn until a file from another site had arrived -->
<style>
  :root{
    /* the colours, the faces and the card's own constants (--app-inset,
       --cardbar-h, --sq, --press, --row-min, --sbar, --gentle, --sunk-deep)
       are shared with the desktop: card-tokens.css, loaded right after this
       sheet. what stands here is the board's own measures, at phone size.
       --app-inset is the thin margin the desktop app frame keeps from the
       window's edge; the safe area is added to it below so the margin is thin
       on every side of a phone with a notch too. --pad-x is the card pane's
       side padding, and the title and the answer step in from it by the same
       thirds the desktop uses */
    --pad-x:18px;
    --sp-xs:4px; --sp-s:8px; --sp-x:10px;
    --titleair:calc(var(--pad-x)*2/3);
    /* the menus' motion, taken from the drawer this page's menus are drawn
       from: one run of 550ms, an ease in and out on a tap and an ease out on
       the release of a drag, so a drag that is already moving is not asked to
       start again. --drawer-curve is the one in force, written by the script
       at whichever of the two the run was begun by */
    --drawer-ms:.55s;
    --drawer-tap:cubic-bezier(.445,.05,.55,.95);
    --drawer-drag:cubic-bezier(.215,.61,.355,1);
    --drawer-curve:var(--drawer-tap);
    /* the row of buttons along the bottom (#dock), laid where iOS 26 draws the
       bar a paired keyboard brings up: a 48px pill whose foot is 10px off the
       screen's bottom edge, 16px in from each side, 20px on the two widest
       phones. --dock-band is the whole band that bar takes from the page, the
       pill and the 10px over and under it, and the card's foot stands on it */
    --dock-h:48px; --dock-foot:10px; --dock-side:16px; --dock-gap:8px;
    --dock-band:calc(var(--dock-h) + 2 * var(--dock-foot));
  }
  @media (min-width:420px){ :root{--dock-side:20px} }
  *{box-sizing:border-box}
  /* Height follows the containing block, not a viewport unit. The two are not
     always the same box, and a column taken from the longer one overhangs the
     shorter. The shell fallback below matches. The one exception is the root
     element in a home-screen app: a percentage there resolves against the area
     the web view first offers, which is the screen less the status bar, and a
     root that exactly fills that shorter area is what the web view then settles
     to, reporting a viewport missing the top safe area however full-screen the
     metas above asked to be. A root measured by the screen overhangs that first
     offer and the web view opens to the whole screen instead. That display mode
     has no toolbar for the unit to run under; a browser tab, where it would,
     keeps the percentage. Everything under the root, the body included, still
     follows its containing block. */
  :root{--root-h:100%}
  @media (display-mode:standalone){ :root{--root-h:100vh} }
  html{height:var(--root-h); -webkit-text-size-adjust:100%}
  body{
    --paper:#FFFFFF;
    margin:0; background:var(--paper); color:var(--ink);
    font:15px/1.55 var(--sans);
    position:fixed; left:0; top:0; width:100%; height:100%;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* a selection wears the block dress the whole app now shares: a solid black
     cell over the picked characters with their ink lifted to white, continuous
     across the run rather than the OS or browser's own tint, so a long-press
     pick of the sent words or the prose reads the same here as on the board */
  ::selection{background:#000; color:#fff}
  /* the page: the card and the row of buttons under it, on the paper, as one
     surface. both menus cross over it, with the shade between them and it, and
     the surface itself draws back a little while either one is out */
  #page{
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; overflow:hidden;
    padding:calc(env(safe-area-inset-top, 0px) + var(--app-inset))
            calc(env(safe-area-inset-right, 0px) + var(--app-inset))
            var(--pad-b)
            calc(env(safe-area-inset-left, 0px) + var(--app-inset));
    -webkit-tap-highlight-color:transparent;
    /* the foot's clearance. at rest it is the band the row of buttons stands
       in, which covers the home indicator's safe area too. while an editor is
       focused, any bottom area lost from the measured visual viewport is used
       instead, whether it is a small hardware-keyboard accessory strip or the
       full on-screen keyboard. --kb-inset is the measured loss written by the
       script. the clearance moves on the platform keyboard's clock and curve,
       --kb-anim */
    --pad-b:var(--dock-band);
    --kb-inset:0px;
    /* the gap the compose bar keeps above the keyboard is the app's own thin
       margin, and above a paired keyboard's bar it is nothing: the bar takes
       the row's own band, so the card's foot does not move for it. the foot
       travels the resting clearance less that gap less the keyboard's measured
       inset; at rest it is nothing */
    --kb-gap:0px;
    --kb-lift:0px;
    /* the platform keyboard's own clock and curve, fitted to a recording of it,
       leaving rest at no speed and landing at rest at no speed */
    --kb-anim:.22s cubic-bezier(.45,0,.55,1);
    /* The page and the exposed canvas share one paper. A page-only highlight
       would reveal a seam when the page draws back. */
    background:var(--paper);
    /* the depth a menu opens onto. as one comes out the whole page draws back
       towards the middle of the screen, by the same fraction the menu's travel
       and its shade are worth, so the card reads as a stage set back rather
       than as something pushed aside. it goes nowhere sideways and nothing is
       laid out again: the page keeps the screen's width and height and only
       its picture is drawn smaller, from its own middle, so every edge steps
       in by the same amount. --page-scale is written by the script and is
       exactly 1 with both menus shut */
    --page-scale:1;
    transform:scale(var(--page-scale));
    transform-origin:50% 50%;
    transition:transform var(--drawer-ms) var(--drawer-curve);
  }
  /* the lift is the whole of the keyboard's visible motion: how far the card's
     own bottom edge, and the typing row standing on it, come up. the page's own
     bottom clearance never changes, so the card's top edge is untouched by a
     keyboard. the small accessory strip is measured on the same rule as the full
     keyboard, and one no taller than the row's band lifts nothing. the value is
     set on the page, which holds --kb-inset, and inherits to the card pane.
     it is a rise or it is nothing, never a fall. the inset goes to nothing at
     focus loss while the pane is still held for the close's settle window, and
     the bare arithmetic there is the resting clearance itself: the foot would
     travel that far BELOW where it rests, and spring back up the moment the hold
     ended, which is one motion made into three */
  body.obstructed #page, body.lifting #page{--kb-lift:min(0px, calc(var(--pad-b) - var(--kb-gap) - var(--kb-inset)))}
  body.kb #page{--kb-gap:var(--app-inset)}
  /* the box while the viewport is obstructed, and through the close's settle window.
     the top follows the visual viewport, for the phone that slides the layout
     viewport under the keyboard; the height is the learned full-screen height
     and never the viewport's own, so the box never changes size at a keyboard
     edge. the script drops both once the keyboard is really gone, and lands
     on the geometry the box already had */
  body.obstructed, body.lifting{top:var(--shell-top, 0px); height:var(--shell-h, 100%)}
  button{font-family:inherit; -webkit-appearance:none; appearance:none}

  /* ---- the tab's type and seat, which the drawer's three names wear ---------- */
  /* the desktop bar's seated tab at phone size. the project tabs that used to
     cross the top of this page wore it too; they are the project list now (the
     row of buttons, below), and the drawer's Doing, Deferred and Done keep it */
  .ptab{
    flex:none; font:500 13px/16px var(--sans); color:var(--sub);
    background:transparent; border:var(--edge) solid transparent; border-bottom:none;
    border-radius:7px 7px 0 0; cursor:pointer; user-select:none; -webkit-user-select:none;
    /* the top border is room at the edge's width; the padding gives back what
       it no longer takes, so the label sits where it did */
    position:relative; height:39px; padding:calc(1px - var(--edge-drawn)) 16px 6px;
    --seat:var(--paper);
  }
  .ptab.on{color:var(--ink); background:var(--seat); border-color:var(--line)}
  .ptab.on::before, .ptab.on::after{
    content:""; position:absolute; bottom:0; width:10px; height:8px; pointer-events:none;
  }
  .ptab.on::before{
    left:-8px;
    background:radial-gradient(circle 8px at 0 0, transparent 0 calc(8px - var(--edge-drawn)),
      var(--line) calc(8px - var(--edge-drawn)) 8px, var(--seat) 8px);
  }
  .ptab.on::after{
    right:-8px;
    background:radial-gradient(circle 8px at 100% 0, transparent 0 calc(8px - var(--edge-drawn)),
      var(--line) calc(8px - var(--edge-drawn)) 8px, var(--seat) 8px);
  }
  /* ---- the row of buttons along the bottom ------------------------------------ */
  /* four buttons in the band iOS gives a paired keyboard's bar: the card list's
     ticket and the settings' gear as circles at the two ends, the open project
     in the long capsule between them, and the new card's plus in a shorter one.
     all four wear the board's own glass (.qn-glass, card-tokens.css) and set
     only their shape and their press here; the sheet loads after this one, so
     each rule is scoped by the row's id to outrank the glass's own corner. the
     row stands on the page under the card's foot, so it draws back with the page
     while a menu is out, and nothing on it can be long-pressed into a selection.
     it fades out while anything is being typed (syncDock, in the script), and
     only once it is out of sight is it moved, by --dock-rise and with no motion,
     up into the band the on-screen keyboard's toolbar takes, so it lies under
     that toolbar rather than under the keyboard; with a paired keyboard's bar
     the band is its own and it is not moved at all */
  #dock{
    position:absolute; z-index:2; display:flex; gap:var(--dock-gap);
    left:max(var(--dock-side), env(safe-area-inset-left, 0px));
    right:max(var(--dock-side), env(safe-area-inset-right, 0px));
    bottom:var(--dock-foot); height:var(--dock-h);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    transform:translateY(calc(-1 * var(--dock-rise, 0px)));
    opacity:1; visibility:visible;
    transition:opacity .25s var(--gentle), visibility 0s;
  }
  #dock.away{opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .1s ease-out, visibility 0s linear .1s}
  #dock .dockbtn{
    flex:none; height:100%; margin:0; padding:0;
    border-radius:calc(var(--dock-h) / 2); color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    transition:transform .5s var(--gentle), --qn-tint .5s var(--gentle), --qn-edge .5s var(--gentle), filter .5s var(--gentle);
  }
  #dock .dockbtn svg{display:block; flex:none}
  #dock .round{width:var(--dock-h)}
  /* the plus: an oval, but a short one beside the project's long capsule */
  #tikadd{width:calc(var(--dock-h) * 1.5)}
  /* while the card it was pressed for is still being made, its mark breathes
     until the board answers, and a second press meanwhile is the same press */
  #tikadd.pending svg{animation:tikpulse 1s ease-in-out infinite}
  @keyframes tikpulse{0%,100%{opacity:.25} 50%{opacity:.85}}
  /* the glass's own press: a little larger and a whiter face, held long enough
     that a quick tap still shows it. it rises over .3s and falls back over .5s,
     both eased, and the tint and edge are registered numbers so the face, its
     highlights and its shadows all ease together rather than the lighting
     jumping at the start */
  @property --qn-tint{syntax:"<number>"; inherits:true; initial-value:.77}
  @property --qn-edge{syntax:"<number>"; inherits:true; initial-value:2}
  #dock .dockbtn.pressed{transform:scale(1.06); --qn-tint:.95; --qn-edge:3;
    transition:transform .3s cubic-bezier(.22,.7,.3,1), --qn-tint .3s cubic-bezier(.22,.7,.3,1), --qn-edge .3s cubic-bezier(.22,.7,.3,1)}
  /* the open project's name, or Home, centred, cut short with an ellipsis, and
     beside it the mark of a list and, while another place has an unread reply,
     a dot in the ink. it takes no browser panning, so a held finger stays its */
  #dock #projbtn{flex:1 1 auto; min-width:0; gap:6px; padding:0 16px;
    font:500 15px/1.2 var(--sans); touch-action:none}
  #projname{flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #projbtn .updown{color:var(--sub)}
  #projbtn .others{display:none; flex:none; width:6px; height:6px; border-radius:50%; background:var(--ink)}
  #projbtn.others .others{display:block}
  /* held, the capsule grows and brightens over the hold, then lifts while its
     list is up, and lets go over the same .5s as the others */
  #dock #projbtn.pressed{transform:scale(1.1); --qn-tint:.97; --qn-edge:3.5;
    transition:transform .38s cubic-bezier(.2,.8,.2,1), --qn-tint .38s ease-out, --qn-edge .38s ease-out, filter .38s ease-out}
  #dock #projbtn.held{transform:scale(1.1); --qn-tint:1; --qn-edge:4;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.12))}

  /* ---- the project list, popped from the project's capsule --------------------- */
  /* the board's places: Home, then the projects in the board's own order, the
     unread ones heavier, the open one checked. it is the same glass, rounder,
     standing just over the row with its left edge on the capsule's and its
     right edge on the plus's, and a long list scrolls inside it. a press held
     on a project lifts it, and the finger carries it up or down the list to
     reorder the board's tabs. the shade under it is clear and only takes the
     tap that shuts it */
  #projshade{position:fixed; inset:0; z-index:24; display:none}
  body.projopen #projshade{display:block}
  #projmenu{
    position:fixed; z-index:25; box-sizing:border-box;
    left:calc(max(var(--dock-side), env(safe-area-inset-left, 0px)) + var(--dock-h) + var(--dock-gap));
    right:calc(max(var(--dock-side), env(safe-area-inset-right, 0px)) + var(--dock-h) + var(--dock-gap));
    bottom:calc(var(--dock-foot) + var(--dock-h) + 10px);
    max-height:calc(100% - env(safe-area-inset-top, 0px) - var(--dock-band) - 24px);
    display:flex; flex-direction:column; padding:6px; border-radius:22px;
    overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    visibility:hidden; opacity:0; transform:scale(.9); transform-origin:25% 100%;
    transition:opacity .14s ease-out, transform .14s ease-out, visibility 0s linear .14s;
  }
  #projmenu::-webkit-scrollbar{display:none}
  body.projopen #projmenu{visibility:visible; opacity:1; transform:none;
    transition:opacity .16s ease-out, transform .22s cubic-bezier(.2,.9,.25,1), visibility 0s}
  .projrow{
    flex:none; display:flex; align-items:center; gap:10px; width:100%; min-height:44px;
    margin:0; padding:0 12px; border:none; border-radius:16px; background:transparent;
    font:500 16px/1.25 var(--sans); color:var(--ink); text-align:left; cursor:pointer;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    transition:background-color .12s ease-out;
  }
  .projrow svg{display:block; flex:none}
  .projrow .pname{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .projrow.unread .pname{font-weight:600}
  .projrow .pcheck{visibility:hidden}
  .projrow.on .pcheck{visibility:visible}
  /* the row under a finger: pressed, or passed over by the hold's drag */
  .projrow:active, .projrow.hot{background:color-mix(in srgb, var(--ink) 8%, transparent)}
  .projrow.lifted{position:relative; z-index:1; background:var(--card);
    box-shadow:0 4px 14px rgba(0,0,0,.14); transition:none}
  #projsep{flex:none; height:var(--edge); margin:4px 12px; background:var(--line)}
  #projlist{flex:none; display:flex; flex-direction:column}

  /* ---- the app is being opened and the board does not answer: a white screen and one line */
  /* over everything, the startup curtain included, and measured the way the
     curtain is. the face is a line icon one em tall, sitting on the text's line.
     it is shown only while the app is being opened, never over an app in use.
     the phone's worker (m-sw.js) draws this same screen when a page open finds
     the board down, from a copy of the rules and the markup of this one, and
     tests/phone-server-down-fresh-open.test.cjs compares them: change both */
  #serverdown{
    display:none; position:fixed; left:0; right:0; top:0; height:var(--screen-h, var(--root-h)); z-index:50;
    align-items:center; justify-content:center; padding:0 24px;
    background:#FFFFFF; color:var(--ink); font:400 17px/1.4 var(--sans); text-align:center;
    -webkit-user-select:none; user-select:none;
  }
  body.down #serverdown{display:flex}
  #serverdown p{margin:0}
  #serverdown svg{width:1em; height:1em; margin-right:.4em; vertical-align:-.15em}

  /* ---- the card pane ------------------------------------------------------ */
  /* the card starts at the top of the page, the app's thin margin under the
     status bar, and ends on the row's band */
  main{
    flex:1 1 auto; min-height:0;
    background:var(--card); border:var(--edge) solid var(--line); border-radius:7px;
    box-shadow:0 2px 18px rgba(60,45,20,.18), 0 1px 3px rgba(60,45,20,.10);
    display:flex; flex-direction:column; overflow:hidden; position:relative;
    /* the keyboard's whole visible motion. the card's own bottom edge comes up
       to the keyboard and the typing row rides on it, while the card's top edge,
       its top bar and its title stand where they are, so no title is ever left
       behind its own words. the room comes out of the answer between
       them, which is the one part that can give it: it scrolls, so what it can
       no longer show is still reachable. the margin is the lift turned over,
       since the lift is a rise and this is the room a rise leaves */
    margin-bottom:calc(0px - var(--kb-lift, 0px));
    transition:margin-bottom var(--kb-anim);
  }
  /* a card only browsed to sits level with the page: the drop shadow is the
     selected card's, and the hairline edge stays */
  body.browsing main{box-shadow:none}
  #empty{display:none; flex:1; align-items:center; justify-content:center;
    font:italic 400 17px var(--serif); color:var(--sub); padding:20px; text-align:center}
  main.blank #empty{display:flex}
  /* the line is a reading of the board, so it waits for one. before the first
     reading lands the tab is unknown rather than empty, and a page that says
     "no cards" while it is still asking is stating something it does not know.
     the script adds .stated to the body on the first state it draws, so a tab
     that really is empty says so and a tab nobody has read yet says nothing */
  body:not(.stated) #empty{display:none}
  #cards{display:flex; flex-direction:column; flex:1 1 auto; min-height:0; position:relative}
  main.blank #cards{display:none}
  .box{display:none; flex:1 1 auto; min-height:0; flex-direction:column}
  /* the two depths the card's fades are cut to, the desktop's own numbers:
     --replyfade is the ramp, --replyair the clear white the answer leaves over
     the sent box, and --boxleft the column the box starts in. they are written
     on the shown card alone, the way the desktop writes them, so the mask rules
     below can only ever apply to a card that is laid out */
  .box.sel{display:flex; --replyfade:22px; --replyair:3.5px; --boxleft:calc(var(--pad-x)*2/3)}
  /* While swiping, the complete card surfaces move. The stationary pane keeps
     its layout but gives up its fill and outline, exposing paper between the
     two independently clipped cards. Their borders replace the pane's border
     without changing the content's resting dimensions. the pull out is the
     pane's edge as drawn, so each card's edge lands on the pane's own. */
  main.cardswiping{background:transparent; border-color:transparent; box-shadow:none; overflow:visible}
  .box.cardswipe{
    display:flex; position:absolute; inset:calc(-1 * var(--edge-drawn)); z-index:2;
    background:var(--card); border:var(--edge) solid var(--line); border-radius:7px;
    box-shadow:0 2px 18px rgba(60,45,20,.18), 0 1px 3px rgba(60,45,20,.10);
    overflow:hidden; --replyfade:22px; --replyair:3.5px; --boxleft:calc(var(--pad-x)*2/3);
    transform:translate3d(var(--card-swipe-x, 0px), 0, 0) scale(var(--card-swipe-z, 1));
    transform-origin:50% 50%; transition:transform .24s cubic-bezier(.22,.72,.2,1);
    will-change:transform; pointer-events:none;
  }
  .box.cardswipe-in{z-index:3}
  /* the card swiped to lands browsed, and the one swiped away keeps the
     shadow only while it was selected, so the pane's own shadow never has to
     change when the faces are taken off */
  .box.cardswipe-in, body.browsing .box.cardswipe{box-shadow:none}
  body.carddrag .box.cardswipe{transition:none}

  /* ---- the home page ------------------------------------------------------ */
  /* a blank page above every project holding the token panel and nothing else,
     the board's own (home-widgets.css, fetched once the page is idle). it
     takes the card's place over the row: the card stays laid out, only out of
     sight, so its answer's place and its row's words are as they were left when
     a tab brings it back. the pane gives up its fill, edge and shade the way it
     does under a swipe, and the page is pulled out by the edge's drawn width
     the same way, so the panel's edge lands on the card's own and the panel
     spans the screen within the app's thin margins */
  #home{display:none}
  body.home main{background:transparent; border-color:transparent; box-shadow:none; overflow:visible}
  /* every part of the card, the history arrows too, which set their own */
  body.home #cards, body.home #cards *, body.home #empty{visibility:hidden}
  body.home #home{display:block; position:absolute; inset:calc(-1 * var(--edge-drawn)); z-index:4;
    overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain}
  /* the charts keep their own size and scroll sideways inside the panel, as on
     the board. the panel's sides are set so the lane they scroll in starts and
     ends clear of the 28px strips at the screen's edges the menus are pulled
     from, the app's 6px margin and these 22px, so a sideways swipe on a chart
     only ever moves the chart */
  #home .tk-panel{padding-left:22px; padding-right:22px}
  /* the limits box sits directly under the token panel, the same width, the
     two sides set alike */
  #home #homelimits{margin-top:8px}
  /* the heading's two lines, the name beside the pill and what it counts under
     both, since at phone width the one line would cut the words short */
  #home .tk-head{display:grid; grid-template-columns:1fr auto; grid-template-areas:"name pill" "what what";
    column-gap:12px; row-gap:2px; align-items:center}
  #home .tk-title{display:contents}
  #home .tk-name{grid-area:name}
  #home .tk-what{grid-area:what}
  #home .tk-pill{grid-area:pill}
  /* the pill is drawn as the board draws it; a finger's reach is taken above
     and below each name, where nothing else can be pressed */
  #home .tk-opt{position:relative}
  #home .tk-opt::after{content:""; position:absolute; left:0; right:0; top:-9px; bottom:-9px}

  /* the card's own top bar: the reply history on the left, the sun, the defer
     chip and the close cross on the right, over the hairline the desktop bar wears.
     the top row's own names, for this page only. every element on the row, the
     two arrows and the three chips, stands in a square --bar-sq, a seat sized
     for a finger, and the sun, the moon and the cross draw their marks across
     inside it at --bar-mark, the one mark size both pages share
     (card-tokens.css, with --cross-t, the cross's thickness, and --cardspin-s,
     the spinner's own size). --bar-gap is the gap between neighbouring
     squares, its own value and never worked out from the square, and
     --bar-tail how far the cross's square ends short of the bar's right edge */
  :root{--bar-sq:28px; --bar-gap:9px; --bar-tail:6px}
  /* the bar is a grid of four columns, the history control and then the three
     chips, so the working spinner can stand in the sun's own cell and share its
     centre by construction. the first column takes the room that is left,
     which is what holds the chips against the right end */
  .topbar{
    --hist-cell:var(--bar-sq);
    display:grid; align-items:center; flex:none; position:relative;
    grid-template-columns:minmax(0, 1fr) repeat(3, var(--bar-sq));
    grid-template-rows:minmax(0, 1fr);
    grid-template-areas:"hist sun moon cross";
    column-gap:var(--bar-gap);
    height:var(--cardbar-h); padding:0 var(--bar-tail) 0 calc(var(--pad-x)*2/3);
    background:var(--card); box-shadow:inset 0 calc(-1 * var(--edge-drawn)) 0 var(--line);
  }
  /* the history control keeps its own width on a card with nothing older, and
     only its marks go. the seats and the chevrons are sized by --hist-cell,
     --hist-glyph-w and --hist-glyph-h */
  .histctl{grid-area:hist; justify-self:start; min-width:0; display:flex; align-items:center; gap:0;
    font:11.5px var(--mono); color:var(--sub); white-space:nowrap; visibility:hidden}
  .box.hashist .histctl{visibility:visible}
  .histbtn .chev{width:var(--hist-glyph-w); height:var(--hist-glyph-h)}
  .histbtn{flex:none; width:var(--hist-cell); height:var(--hist-cell); padding:0; border:none; border-radius:var(--sq);
    background:var(--card); color:var(--ink); display:grid; place-items:center; cursor:pointer}
  .histbtn:active{background:color-mix(in srgb, #000 var(--press), var(--card))}
  .histbtn:disabled{opacity:.28}
  .histbtn.older svg{transform:rotate(0deg)}
  .histbtn.newer svg{transform:rotate(180deg)}
  .histpos{margin-left:4px}
  .histpos:empty{display:none}
  /* the three chips wear the desktop's mark, --bar-mark, on a seat of --bar-sq,
     the seat being what a finger needs; the mark, the ink and the press are the
     desktop's. each chip has its own column of the bar's grid, sun then moon
     then cross. the marks are sized by the rule below, which wins over the
     width and height the svg carries as attributes: the sun's come from the
     shared card-logic.js, where the small cards size the same glyph by them,
     and the moon's are not written at all */
  .sunbtn, .arcbtn, .xbtn{
    width:var(--bar-sq); height:var(--bar-sq); padding:0; border:none; border-radius:var(--sq);
    background:var(--card); color:#000; position:relative; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .sunbtn{grid-area:sun}
  .arcbtn{grid-area:moon}
  .xbtn{grid-area:cross}
  :is(.arcbtn, .sunbtn) svg{width:var(--bar-mark); height:var(--bar-mark)}
  .sunbtn:active, .arcbtn:active, .xbtn:active{background:color-mix(in srgb, #000 var(--press), var(--card))}
  /* the board has not answered the last tap on this chip: the mark is lighter
     until it has. the seat, the press and the tap are all untouched, because a
     tap still on its way has to stay reversible by another tap */
  .box.flagwait .arcbtn{opacity:.5}
  /* the chip naming the section the card is already in: lighter, with no
     press, and it outranks the half fade above, since off is the lasting word */
  .box :is(.sunbtn, .arcbtn, .xbtn)[aria-disabled="true"]{opacity:var(--chipoff); cursor:default}
  .box :is(.sunbtn, .arcbtn, .xbtn)[aria-disabled="true"]:active{background:var(--card)}
  .xbtn::before, .xbtn::after{
    content:""; position:absolute; left:50%; top:50%;
    width:var(--bar-mark); height:var(--cross-t); background:#1e1e1e; border-radius:var(--cross-t);
  }
  .xbtn::before{transform:translate(-50%,-50%) rotate(45deg)}
  .xbtn::after{transform:translate(-50%,-50%) rotate(-45deg)}

  .head{flex:none; padding:var(--titleair) 0 0}
  .title{
    display:block; min-width:0; white-space:normal; overflow-wrap:anywhere;
    font:625 24px/1.25 var(--inter); color:var(--ink);
    padding:0 calc(var(--pad-x)*2/3); min-height:1.25em; outline:none;
  }
  .title[contenteditable]:empty::before{content:"Card Name"; color:var(--bubble-fill, #F3F3F3)}
  .box.done .title{color:var(--green)}
  .box.parked .title{color:var(--later)}

  /* the sent box and the typing row are laid OVER the answer here, as they are
     on the desktop card, and the body is the ground they are set into: the
     answer fills the whole of it and runs on underneath them, covered edge to
     edge by fill that is opaque. laid this way the answer's own bottom edge is
     far below the line where its words actually stop, which is what lets the
     ramp at the foot be cut on the box's top edge. nothing moves by a pixel:
     the wrapper stood on the body's floor in the column and it stands on the
     same floor pinned to it */
  /* the clip box: a static box from the card header to the card foot, which is
     what keeps the column inside the card's own outline as the card's bottom
     edge comes up for the keyboard. clip and never hidden, so it is not a scroll
     container the phone's caret reveal could seize and scroll */
  .liftclip{display:flex; flex-direction:column; flex:1 1 auto; min-height:0; overflow:clip}
  /* the card's own column under its title. it does not move at a keyboard edge:
     the card's foot comes up and this column is what gives the room, so the
     title above it never has words sliding under it. it clips rather than
     scrolls, so it is no reveal target */
  .body{display:flex; flex-direction:column; flex:1 1 0; min-height:0;
    padding:var(--titleair) 0 0; position:relative; overflow:clip}
  /* the answer's own scroller: it owns the scroll, the touch inertia and the
     clear air under it, and the panel of answered messages rides inside it
     above the answer prose so the panel leaves under the title as the reader
     scrolls */
  .replyview{
    display:flex; flex-direction:column;
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    margin-bottom:var(--replyair);
    /* the browser's own scroll anchoring is off, so a panel opened while the
       reader is scrolled part way past it grows down into the answer rather
       than sliding up under the title away from the tap */
    overflow-anchor:none;
  }
  /* the answer prose is a block inside the scroller now; it does not shrink so it
     stands at its own height and lets the scroller take the overflow */
  .reply{
    flex:none; color:var(--ink);
    font-size:17px; line-height:1.55;
    padding:0 calc(var(--pad-x)*5/3 - var(--sbar)) 0 calc(var(--pad-x)*2/3);
  }
  /* the card's two fades, the desktop's rules at phone size and with the phone's
     own seat in front of them. the depths, the stops and the compositing are the
     desktop's to the number; what the desktop writes as body.focus .box.sel is
     written here as .box.sel, which is the class this page gives the one card on
     show.
     down the answer, the first layer carries both. at its head the answer
     dissolves under the title as it scrolls: nothing at the top edge, .35 at 38
     hundredths of --upband, .80 at 72 and full at the end, --upband being how far
     the answer has been scrolled capped at the ramp's own depth, so at rest all
     four stops collapse onto the edge and the first line stands at full ink. at
     its foot it dissolves into the sent box over the same ramp turned over,
     ending on --boxband, the depth of the box and the typing row measured by the
     script below, since no rule can name the top edge of a thing laid over the
     answer.
     the second layer is that shape run across at the box's left edge and the
     third keeps it off the rest of the answer; the two are added and the first is
     multiplied into the pair, so above the box the answer is whole at its full
     width and below it the ramp is the only thing left */
  .box.sel .replyview, .box.cardswipe .replyview{
    -webkit-mask-image:
      linear-gradient(to bottom,
        rgba(0,0,0,0) 0,
        rgba(0,0,0,.35) calc(var(--upband, 0px)*.38),
        rgba(0,0,0,.80) calc(var(--upband, 0px)*.72),
        rgba(0,0,0,1) var(--upband, 0px),
        rgba(0,0,0,1) calc(100% - var(--boxband, 0px) - var(--replyfade)),
        rgba(0,0,0,.80) calc(100% - var(--boxband, 0px) - var(--replyfade)*.72),
        rgba(0,0,0,.35) calc(100% - var(--boxband, 0px) - var(--replyfade)*.38),
        rgba(0,0,0,0) calc(100% - var(--boxband, 0px))),
      linear-gradient(to right,
        rgba(0,0,0,1) calc(var(--boxleft) - var(--replyfade)),
        rgba(0,0,0,.80) calc(var(--boxleft) - var(--replyfade)*.72),
        rgba(0,0,0,.35) calc(var(--boxleft) - var(--replyfade)*.38),
        rgba(0,0,0,0) var(--boxleft),
        rgba(0,0,0,1) calc(var(--boxleft) + var(--replyfade)*.25)),
      linear-gradient(to bottom,
        rgba(0,0,0,1) calc(100% - var(--boxband, 0px)),
        rgba(0,0,0,0) calc(100% - var(--boxband, 0px)));
    mask-image:
      linear-gradient(to bottom,
        rgba(0,0,0,0) 0,
        rgba(0,0,0,.35) calc(var(--upband, 0px)*.38),
        rgba(0,0,0,.80) calc(var(--upband, 0px)*.72),
        rgba(0,0,0,1) var(--upband, 0px),
        rgba(0,0,0,1) calc(100% - var(--boxband, 0px) - var(--replyfade)),
        rgba(0,0,0,.80) calc(100% - var(--boxband, 0px) - var(--replyfade)*.72),
        rgba(0,0,0,.35) calc(100% - var(--boxband, 0px) - var(--replyfade)*.38),
        rgba(0,0,0,0) calc(100% - var(--boxband, 0px))),
      linear-gradient(to right,
        rgba(0,0,0,1) calc(var(--boxleft) - var(--replyfade)),
        rgba(0,0,0,.80) calc(var(--boxleft) - var(--replyfade)*.72),
        rgba(0,0,0,.35) calc(var(--boxleft) - var(--replyfade)*.38),
        rgba(0,0,0,0) var(--boxleft),
        rgba(0,0,0,1) calc(var(--boxleft) + var(--replyfade)*.25)),
      linear-gradient(to bottom,
        rgba(0,0,0,1) calc(100% - var(--boxband, 0px)),
        rgba(0,0,0,0) calc(100% - var(--boxband, 0px)));
    mask-composite:intersect, add, add;
  }
  /* what stands under the answer's last word, as a spacer at the foot of the
     scroller's content and never the scroller's padding: the room a panel over
     the answer holds under it while it is cut back, so the reader's scroll is
     never pulled (holdSlack in card-logic.js), and the run-out the scroll needs,
     the band the box takes plus the ramp, so the last line can rise onto the top
     of the ramp where the ink is still full. an answer that already fits gains
     no travel.
     it is content and not padding because an engine may leave a scroller's
     padding out of its scrollable height when the answer ends inside it, and an
     answer that ends in the run-out then has nothing to scroll while the ramp
     says there is more. a spacer is content, so the scroll always counts it.
     the scroller is also a flex item, which cannot stand shorter than its own
     padding, so room held there once pushed the scroller down past the card,
     and --boxband, read off the scroller's foot, grew with it and masked the
     answer out */
  .replyview::after{content:""; flex:none; height:calc(var(--answ-slack, 0px) + var(--boxband, 0px) + var(--replyfade, 0px))}
  .box.histview .replyview{opacity:.8}

  /* ---- the foot: the sent panel over the typing row ------------------------ */
  .pendwrap{position:absolute; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; background:var(--card)}
  .meta{margin:0 calc(var(--pad-x)*2/3); font:11.5px var(--mono); color:var(--sub); background:var(--card)}
  .meta:empty{display:none}
  /* the history arrows' chevron */
  .chev{display:block; flex:none}
  /* what has been sent and not answered yet: the panel over the answer
     (card-tokens.css), in a seat of its own at the foot. the seat is the
     answer's column, the same two side measures the panel over the answer
     stands in, so the two panels are one width with one right edge, and the
     small step under it is the step the old box left before the row. the seat
     is the card's white, like the whole of the foot, so it covers the answer
     the panel rises over while the answer's band holds still for the run.
     open, a long batch stops so the whole panel stands in the old box's room,
     under two fifths of the screen above the keyboard, and scrolls inside */
  .sentwrap{
    display:flex; flex-direction:column; flex:none;
    padding:0 calc(var(--pad-x)*5/3 - var(--sbar)) var(--sp-s) calc(var(--pad-x)*2/3);
    background:var(--card);
  }
  .sentwrap:empty{display:none}
  .box{--sent-cap:calc(var(--vvh, 100vh) * .38 - var(--answ-pad-y) - var(--answ-strip))}
  /* a message the board has not confirmed yet: drawn the moment it is sent, a
     shade lighter, and kept on the card until the board has it. while the phone
     is still trying it again on its own its row carries the tray's turning ring,
     in the place the red mark takes once it has stopped (card-tokens.css). no
     words stand on either */
  .answmsg.pending > :not(.answmark){opacity:.6}
  .answmsg.unsure > :not(.answmark){opacity:.72}
  .answmark[data-kind=ring] .tsqring{position:static; width:18px; height:18px; margin:0; opacity:1;
    animation:tsqturn .8s linear infinite}
  .answmark[data-kind=ring] .tsqring .arc{stroke-dashoffset:49.48; transition:none}

  /* ---- the messages the answer on the card was given ---------------------- */
  /* the desktop card's panel, drawn from the shared sheet (card-tokens.css) at
     phone size. the seat is the first block in the answer's own scroller, so
     the panel rides up out of view with the answer under it, and it spans the
     answer's own column, written as the same two side measures the answer's
     words stand in, so the panel's right edge is the right edge of the
     answer's lines. the small step under it is the one the sent panel's seat
     leaves under it. an empty seat takes no room */
  .answwrap{
    display:flex; flex-direction:column; flex:none;
    padding:0 calc(var(--pad-x)*5/3 - var(--sbar)) var(--sp-s) calc(var(--pad-x)*2/3);
  }
  .answwrap:empty{display:none}
  /* the measures: the desktop's type, which is already this page's sent size,
     on a 21 line, and a little less air over and under the words than the
     desktop gives them. the strip the arrow stands in is 32px, up from the
     16px of air it had and the height of this page's old shut bar, so the 7px
     arrow has 12.5px clear over it and under it */
  .box{
    --answ-font:400 15px/21px var(--inter); --answ-line:21px;
    --answ-pad-y:16px; --answ-pad-x:18px; --answ-round:18px;
    --answ-peek:calc(21px * 2.75); --answ-fade:calc(21px * .75);
    --answ-strip:32px;
  }

  /* ---- the foot: the plus, the typing row, the send square ------------ */
  .bottombar{
    display:flex; align-items:flex-end; gap:var(--sp-s); flex:none;
    margin:0 calc(var(--pad-x)*2/3); border-top:var(--edge) solid var(--line); background:var(--card);
    --widen:calc(28px + var(--sp-s));
  }
  .clipbtn{
    flex:none; width:28px; height:var(--row-min); padding:0; border:none;
    background:none; border-radius:var(--sq); color:var(--ink);
    display:grid; place-items:center; line-height:1; cursor:pointer;
    position:relative; isolation:isolate; transition:transform .11s var(--gentle), opacity .3s var(--gentle);
  }
  /* dimmed from the tap that opens the picker until the phone has taken it
     down (the picker's session, in the script): off at once, back on a fade */
  body.picking .clipbtn{opacity:.28; transition:none}
  .clipbtn::before{
    content:""; position:absolute; z-index:-1; left:0; right:0; top:50%; aspect-ratio:1;
    transform:translateY(-50%); border-radius:var(--sq); border:var(--edge) solid var(--line);
    background:color-mix(in srgb, #000 var(--press), var(--paper));
    box-shadow:var(--sunk-deep); opacity:0; transition:opacity .11s var(--gentle);
  }
  .clipbtn:active{transform:translateY(1px)}
  .clipbtn:active::before{opacity:1}
  .clipfile{display:none}
  /* typing: the plus shrinks and fades, the text slides over its place; transform and opacity only, since a layout change on the focus frame makes iOS drop the keyboard */
  .bottombar.typing .clipbtn{
    opacity:0; transform:scale(.7); pointer-events:none;
    transition:transform var(--kb-anim), opacity var(--kb-anim);
  }
  .bottombar.typing .compose > textarea:not(.twin), .bottombar.typing .compose > .cffield{
    transform:translateX(calc(-1 * var(--widen))); will-change:transform;
    transition:transform var(--kb-anim);
  }
  /* the real layout, switched once at rest; the right inset takes the width the left edge gained, so the wrap does not move. keep after .typing */
  .bottombar.wide .clipbtn{
    width:0; margin-right:calc(-1 * var(--sp-s)); opacity:0; transform:none; pointer-events:none; transition:none;
  }
  .bottombar.wide .compose > textarea:not(.twin), .bottombar.wide .compose > .cffield{
    transform:none; will-change:transform; transition:none;
  }
  .bottombar.wide .compose textarea{padding-right:calc(4px + var(--widen))}
  .bottombar.wide .compose .cffield .cm-scroller{padding-right:calc(4px + var(--widen))}
  /* the close's first frame: the resting layout drawn in the typing look, then released into .returning */
  .bottombar.flip .clipbtn{opacity:0; transform:scale(.7); transition:none}
  .bottombar.flip .compose > textarea:not(.twin), .bottombar.flip .compose > .cffield{
    transform:translateX(calc(-1 * var(--widen))); will-change:transform; transition:none;
  }
  /* the way back, on the keyboard's clock; the plus keeps its own press and fade-back timing otherwise */
  .bottombar.returning .clipbtn{transition:transform var(--kb-anim), opacity var(--kb-anim)}
  .bottombar.returning .compose > textarea:not(.twin), .bottombar.returning .compose > .cffield{
    transition:transform var(--kb-anim);
  }
  /* no caret while the row rises: iOS places it from a rect the page cannot refresh mid-transition */
  .bottombar.nocaret .compose textarea, .bottombar.nocaret .compose .cm-content{caret-color:transparent}
  .compose{flex:1 1 auto; min-width:0; display:flex; gap:var(--sp-x); align-items:flex-end}
  /* the row's cap: the desktop's share of the height with the keyboard down,
     and five whole lines while it is up, the count the row could hold above
     the keyboard. the box shrinks at the keyboard's edge, and the script
     brings the caret's line back inside it on that same frame */
  textarea{
    flex:1; min-width:0; resize:none; font:17px/1.5 var(--sans); color:var(--ink);
    background:transparent; border:none; outline:none;
    padding:var(--sp-s) 4px; margin:0 -4px;
    min-height:var(--row-min); max-height:28vh; max-height:calc(var(--vvh, 100vh) * .28); overflow-y:auto;
  }
  body.kb textarea{max-height:calc(5 * 1.5em + 2 * var(--sp-s))}
  /* the same row with its typed formatting on. the editor is the vendored
     codemirror bundle and its scroller stands in for the field, so every rule
     the row had is written on that one element and its box, its scroll and its
     computed face read exactly as the field's did. the outer element is only
     the seat the row keeps in the bar */
  .cffield{flex:1; min-width:0; font:17px/1.5 var(--sans); color:var(--ink)}
  .compose .cffield .cm-scroller{
    background:transparent; border:none; padding:var(--sp-s) 4px; margin:0 -4px;
    min-height:var(--row-min); max-height:28vh;
    max-height:calc(var(--vvh, 100vh) * .28); overflow-y:auto;
  }
  body.kb .compose .cffield .cm-scroller{max-height:calc(5 * 1.5em + 2 * var(--sp-s))}
  textarea::placeholder{color:#B4AA99}
  /* the phone skips its caret reveal, the scroll of the whole page that
     brings a freshly focused field into view, when the field is at opacity 0
     on that frame: one fiftieth of a second blink on focus, a frame the eye
     cannot catch. the script blinks the same way on every keystroke while
     the keyboard is up, since the reveal fires on those too.
     the blink is held flat at nothing for its whole run and steps back at the
     end. rising from nothing instead put the field at nothing for an instant
     only, and by the frame the reveal was worked out it was already partly
     there, which the phone reads as a field to bring into view. a plain field's
     reveal lands inside that instant and survived the rise; a line the page
     writes in has its reveal a frame later and did not */
  [data-owned-focus]:focus{animation:focus-blink .02s}
  @keyframes focus-blink{0%,99%{opacity:0}}
  /* the twin the row is measured on: the same rule as the row, the row's own
     width, out of the flow and out of sight. the row's height is read off it,
     so the row itself is never collapsed to be measured, which is what threw
     its scroll and the caret off */
  .compose textarea.twin{position:absolute; top:0; left:0; visibility:hidden; pointer-events:none;
    height:auto; min-height:0; max-height:none; overflow:hidden; margin:0}
  .sendbtn{
    flex:none; width:28px; height:28px; min-height:0; padding:0; border:none;
    background:var(--card); color:#000; border-radius:var(--sq);
    display:grid; place-items:center; line-height:1; cursor:pointer;
    opacity:0; transform:scale(.5); pointer-events:none;
    transition:opacity .26s var(--gentle), transform .26s var(--gentle);
  }
  .sendbtn.show{opacity:1; transform:scale(1); pointer-events:auto}
  .sendbtn:active{background:color-mix(in srgb, #000 var(--press), var(--card))}

  /* ---- the files picked for the next message: a tray over the typing row ---- */
  /* one 64px square per file, standing from the pick on, with the upload's ring
     over it. the squares carry the state alone: no words stand under them. the
     tray is the typing row's width and the card's white, so the answer's fade
     reads it as part of the foot. the squares' corners are the 7px of things
     let into the card, and the cross hangs off the top right corner, which is
     what the tray's top and right padding are for. --tray-gap is the clear
     space between the squares' row and the line above the typing row */
  .tray{--tray-gap:12px; display:none; flex-wrap:wrap; align-items:flex-start; gap:var(--sp-s); flex:none; position:relative;
    margin:0 calc(var(--pad-x)*2/3); padding:var(--sp-s) 6px var(--tray-gap) 0; background:var(--card)}
  .tray.on{display:flex}
  .tray.closing{overflow:hidden}
  .tsq{position:relative; flex:none; width:64px; height:64px}
  .tsq.leaving{position:absolute; pointer-events:none}
  .tsqface{position:absolute; inset:0; overflow:hidden; border-radius:7px;
    background:#F3F1EC; box-shadow:inset 0 0 0 var(--edge-drawn) var(--line)}
  .tsq.tappable .tsqface{cursor:pointer}
  /* a file with no picture says its kind and its size, in the notes' type */
  .tsqkind{position:absolute; inset:0; display:grid; place-content:center; text-align:center;
    font:600 11px/1.25 var(--mono); letter-spacing:.04em; color:var(--sub)}
  .tsqkind small{display:block; font-weight:400; font-size:9.5px; letter-spacing:0}
  /* with a ring or a mark to wear, a file with no picture keeps only its kind,
     at the top, and the mark stands under it */
  .tsq:not(.drawn):is(.up,.queued,.wait,.failed,.refused) .tsqkind{place-content:start center; padding-top:8px}
  .tsq:not(.drawn):is(.up,.queued,.wait,.failed,.refused) .tsqkind small{display:none}
  .tsq:not(.drawn) :is(.tsqring, .tsqbang){top:62%}
  .tsqpic{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
    opacity:0; transition:opacity .26s var(--gentle)}
  .tsq.drawn .tsqpic{opacity:1}
  /* a picture with see-through parts shows the face behind it, never the words */
  .tsq.drawn .tsqkind{visibility:hidden}
  /* over a picture, while it is on its way or held up, a shade the ring and
     the mark read against */
  .tsqveil{position:absolute; inset:0; background:rgba(33,29,23,.38); opacity:0; transition:opacity .26s var(--gentle)}
  .tsq.drawn:is(.up,.queued,.wait,.failed,.refused) .tsqveil{opacity:1}
  /* the upload's ring: how much of the file has gone, or a quarter turning
     while the phone cannot say */
  .tsqring{position:absolute; left:50%; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px;
    transform:rotate(-90deg); opacity:0; transition:opacity .26s var(--gentle); overflow:visible}
  .tsqring circle{fill:none; stroke-width:2.5}
  .tsqring .track{stroke:rgba(33,29,23,.14)}
  .tsqring .arc{stroke:var(--ink); stroke-linecap:round; stroke-dasharray:65.97; stroke-dashoffset:65.97;
    transition:stroke-dashoffset .2s linear}
  .tsq.drawn .tsqring .track{stroke:rgba(255,255,255,.42)}
  .tsq.drawn .tsqring .arc{stroke:#fff}
  .tsq:is(.up,.queued,.wait) .tsqring{opacity:1}
  .tsq:is(.queued,.wait,.indet) .tsqring{animation:tsqturn .8s linear infinite}
  .tsq:is(.queued,.wait,.indet) .tsqring .arc{stroke-dashoffset:49.48; transition:none}
  @keyframes tsqturn{from{transform:rotate(-90deg)} to{transform:rotate(270deg)}}
  /* the file did not go: a mark in the card's own red, just there, no entrance */
  .tsqbang{position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px;
    border-radius:50%; background:var(--must); color:#fff; font:700 13px/22px var(--sans);
    text-align:center; display:none}
  .tsq:is(.failed,.refused) .tsqbang{display:block}
  .tsqx{position:absolute; top:-6px; right:-6px; z-index:1; width:20px; height:20px; padding:0;
    border:none; border-radius:50%; background:rgba(33,29,23,.72); color:#fff;
    display:grid; place-items:center; cursor:pointer}
  .tsqx::after{content:""; position:absolute; inset:-8px}
  /* a picture in a sent message is capped on the phone, so one photo does not
     take the whole panel */
  .sentwrap .cardmd .shot, .answwrap .cardmd .shot{max-height:180px; width:auto; margin-left:0}

  /* ---- the card list off the left edge, the settings off the right --------- */
  /* the shade over the page while a menu is out, and the tap that shuts it. it
     lies between the page and either menu, so the menu stays clear. it is the
     page's sister and not its child, so it keeps the whole screen while the
     page draws back: the thin strip the page leaves along each edge takes the
     same shade as the rest and shuts the menu on a tap like the rest */
  #scrim{position:absolute; inset:0; background:rgba(33,29,23,.18);
    opacity:var(--scrimv, 0); pointer-events:none; z-index:19;
    transition:opacity var(--drawer-ms) var(--drawer-curve)}
  body.menuout #scrim{pointer-events:auto}
  /* the page's own picture changes frame by frame while a menu is out, so it is
     given a layer of its own for the run */
  body.menuout #page{will-change:transform}
  /* both menus cross over the page from their own edge along one straight
     sideways line, at full strength for every frame of it: nothing about them
     rises, sinks or fades. the depth is carried under them, by the shade that
     grows from nothing to its full weight as the menu comes out and back to
     nothing as it leaves, and by the page drawing back from all four edges on
     that same fraction, so the menu reads as lifting off the page and settling
     back onto it while its own picture holds its line */
  /* the one being shown is the only one visible. it is taken away for as long
     as the run that puts it back: no wait on the way in, and the whole run on
     the way out, so it disappears only once it has finished leaving */
  #drawer, #settings{
    position:fixed; top:0; bottom:0; width:min(71.4vw, 289px); z-index:20;
    background:#fff;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
    transform:translateX(var(--shift));
    opacity:1;
    visibility:hidden; --menuwait:var(--drawer-ms);
    transition:transform var(--drawer-ms) var(--drawer-curve),
               visibility 0s linear var(--menuwait);
  }
  /* the shade lies on a layer of its own, over the page and past the menu's
     outer edge, so its weight can change without the menu being drawn again.
     it is the pair a raised card casts: a close one under the edge and a wide
     soft one beyond it. --panel-depth is how far out the menu is, written by
     the script, and it is the whole of the depth */
  #drawer::after, #settings::after{
    content:""; position:absolute; top:0; bottom:0; pointer-events:none;
    border-radius:inherit; opacity:var(--panel-depth, 0);
    transition:opacity var(--drawer-ms) var(--drawer-curve);
  }
  /* while a menu is on show its shade gets its own layer, so a finger changing
     the shade frame by frame never asks for the menu to be drawn again */
  #drawer.live::after, #settings.live::after{will-change:opacity}
  #drawer.live, #settings.live{visibility:visible; --menuwait:0s}
  /* the two exposed corners are a little rounder than the board's small inset
     panels. the two at the screen edge stay square. each shade layer is pulled
     out by the width the menu's own edge line is drawn at, so the shade starts
     exactly where the menu ends */
  #drawer{--shift:-100%; left:0; border-right:var(--edge) solid var(--line);
    border-radius:0 12px 12px 0}
  #drawer::after{left:0; right:calc(-1 * var(--edge-drawn));
    box-shadow:2px 0 6px rgba(0,0,0,.10), 10px 0 26px rgba(0,0,0,.20)}
  #settings{--shift:100%; right:0; border-left:var(--edge) solid var(--line);
    border-radius:12px 0 0 12px}
  #settings::after{left:calc(-1 * var(--edge-drawn)); right:0;
    box-shadow:-2px 0 6px rgba(0,0,0,.10), -10px 0 26px rgba(0,0,0,.20)}
  /* a finger is followed frame by frame, so the moving layers are not timed */
  body.menudrag #scrim, body.menudrag #page, body.menudrag #drawer, body.menudrag #settings,
  body.menudrag #drawer::after, body.menudrag #settings::after{transition:none}
  #tikhead{flex:none; display:flex; align-items:flex-end; gap:4px; padding:6px 8px 0; border-bottom:none}
  /* the drawer tabs reuse the tabs' type and spacing, three equal segments,
     but they no longer draw the seated-tab shape:
     top:0 drops the lift a .ptab carries so all three names share one baseline.
     like the board, the names read Doing, Deferred and Done at a pixel over the
     .ptab's 13, and every name carries a clear edge on all four sides, the
     selected one included, so a name measures the same selected or not and the
     list below never moves. the ID-scoped border outranks .ptab.on's hairline. */
  #tikhead .tvb{flex:1; --seat:var(--card); height:auto; padding:calc(6px + 1px - var(--edge-drawn)) 0 5px;
    top:0; font-size:14px; border:var(--edge) solid transparent}
  /* no selected pill, as on the board: the selected name wears no fill, border
     or standing shade and shows selection by weight and ink alone, 700 over the
     500 every name has (Plex Sans is asked for at 700 for this, see the font
     sheets below). the thirds come from a zero basis, so the heavier name
     widens none. the .ptab.on seat fill and notches are struck.
     a press dips any name, selected or not: while it is held (:active, or
     .pressed, which the script beside the tab taps sets from pointer and key
     events) the --sunk-deep recipe at 0.6 depth eases in over 80ms and back out
     over 160ms on release. the rest state is two clear zero-size inset layers so
     the shade interpolates cleanly; the 7px radius only shapes that shade. */
  #tikhead .tvb{
    border-radius:7px;
    box-shadow:inset 0 0 0 rgba(60,45,20,0), inset 0 0 0 rgba(60,45,20,0);
    transition:color .18s, box-shadow .16s ease-out;
  }
  #tikhead .tvb.on{color:var(--ink); font-weight:700; background:transparent}
  #tikhead .tvb:active, #tikhead .tvb.pressed{
    box-shadow:inset 0 1.8px 4.2px rgba(60,45,20,.132), inset 0 .6px 1.2px rgba(60,45,20,.084);
    transition:color .18s, box-shadow .08s ease-in;
  }
  #tikhead .tvb.on::before, #tikhead .tvb.on::after{display:none}
  /* the new-card plus that stood in a strip over the names is the row's plus
     now, so the names head the drawer */
  .tiknote{font:italic 12.5px var(--sans); color:#7A2E1B; padding:8px 12px}
  /* the list: unlike the board, the phone draws no recessed well here. a boxed
     inset inside a drawer this narrow read as a frame within a frame, so the
     list has no fill, edge, rounding or sunk shade of its own and the rows sit
     straight on the drawer, their sides in line with the names above through
     the sections' own padding. it still clips a horizontal sheet of three
     sections and shows one at a time, so a tab change travels the sheet across
     it while the list and the names above never move. */
  #tiklist{flex:1; min-height:0; overflow:hidden;
    position:relative; display:flex; flex-direction:column}
  /* doing|deferred|done laid left to right, one section wide each; section i rests
     at translateX(-i*100%) and the list clips all but the shown one */
  #tiksheet{flex:1; min-height:0; display:flex; flex-direction:row; will-change:transform}
  .tikpane{flex:0 0 100%; min-width:0; height:100%; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:6px; padding:10px 8px}
  .trow{
    position:relative; flex:none; height:52px;
    border:var(--edge) solid var(--line); border-radius:5px; background:#fff;
    box-shadow:0 1px 4px rgba(60,45,20,.05);
    display:flex; flex-direction:column; cursor:pointer; overflow:hidden;
    transition:border-color .3s, background-color .3s;
  }
  .trowin{display:flex; align-items:center; gap:var(--sp-x); height:100%; padding:0 var(--sp-x)}
  .trow.seen .ttl{color:#847A6B}
  .ttl{flex:1; min-width:0; font:500 15px/1.3 var(--sans); color:var(--ink);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .tmeta{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:2px}
  .tmeta .tage{font:600 12.5px var(--mono); color:var(--sub); font-variant-numeric:tabular-nums; min-height:16px}
  .tmeta .teng{font:400 10.5px var(--mono); color:#B4AA99}
  .tnum{font:inherit; font-weight:400; color:#C1C1C1; margin-right:.45em}
  .tempty{font:italic 12.5px var(--sans); color:#B4AA99; padding:8px 12px}
  .trow.working{background:#F3FFF0; border-color:var(--line)}
  .trow.yours{background:#FFFBEB; border-color:var(--line)}
  .trow.queuedc{background:#F7F7F7; border-color:var(--line)}
  .trow.donec{opacity:.55}
  .trow.on{border-color:var(--line); transform:translateY(-1px); z-index:1;
    box-shadow:0 2px 18px rgba(60,45,20,.18), 0 1px 3px rgba(60,45,20,.10)}
  /* a ready-to-test row wears no fill or edge of its own: its whole marker is
     the folded top right corner, drawn for this page and the desktop alike in
     card-tokens.css. this row is 52px to the desktop's 64.8, and a 16px flap
     here would lie up to 3px over the top of the age's last letter when it is
     a d or an h, and touch an m or a w, so the phone folds 12px: the desktop's
     fold scaled to this row, rounded down, which stays over 2.5px clear of all
     four */
  .trow.testc{--fold:12px}
  /* ---- the settings, on the panel off the right edge ---------------------- */
  /* the panel keeps its own white, edge, corners and top inset. the page
     card-logic.js builds inside it is the shared one, and here it is bare: none
     of the glass it wears on the desktop, no second top inset, and no window
     buttons, since the shade and a swipe shut the panel */
  #setpage{flex:1; min-height:0; background:none; box-shadow:none;
    backdrop-filter:none; -webkit-backdrop-filter:none}
  #setpage::before{display:none}
  #setpage .sp-head{padding-top:14px}
  /* the turn off mark stands alone at the foot of the panel, under the list and
     under any section: a 16px power mark in the sub ink, centred, 16px up from
     the foot, with the room a finger needs around it. what it puts up first is
     the question below. a sign out that fails says so under it */
  #setfoot{flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 12px}
  #signout{display:flex; margin:0; padding:8px; border:none; background:none; color:var(--sub); cursor:pointer}
  #signout:disabled{opacity:.6; cursor:default}
  #signout svg{display:block}
  #signoutnote{margin:0; font:12px/1.5 var(--sans); color:var(--sub); text-align:center}
  #signoutnote:empty{display:none}
  /* the question, in the alert a phone asks with: a dim over the whole screen
     and a rounded card in its middle, the question over two pills side by side.
     the colours are the system's own, from Apple's published table: the blue
     fills the pill being asked for and inks the word on the other pill, whose
     fill is the fifth gray, and the card is the sixth gray. it comes in from a
     little larger and settles, and leaves on the fade alone, both in a fifth of
     a second */
  #signoutask{--system-blue:#0088FF; --system-gray5:#E5E5EA; --system-gray6:242 242 247;
    position:fixed; inset:0; z-index:35; display:grid; place-items:center; padding:24px;
    background:rgba(0,0,0,.14); opacity:1; transition:opacity 200ms ease-in-out;
    font:17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased}
  #signoutask[hidden]{display:none}
  #signoutask.entering{opacity:0; transition:none}
  #signoutask.leaving{opacity:0}
  .ask-card{width:min(304px, calc(100vw - 48px)); overflow:hidden; padding:20px 14px 14px;
    border:1px solid rgba(255,255,255,.72); border-radius:26px; background:rgb(var(--system-gray6) / .94);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 18px 50px rgba(0,0,0,.2);
    backdrop-filter:blur(34px) saturate(180%); -webkit-backdrop-filter:blur(34px) saturate(180%);
    color:#000; text-align:center; transform:scale(1); transition:transform 200ms ease-in-out}
  #signoutask.entering .ask-card{transform:scale(1.1); transition:none}
  .ask-copy{margin:0; padding:0 8px 18px; font-size:18px; font-weight:500; line-height:1.28; letter-spacing:-.01em}
  .ask-actions{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:10px}
  .ask-actions button{min-width:0; min-height:44px; margin:0; padding:8px 12px; border:none; border-radius:999px;
    font:inherit; font-size:16px; font-weight:500; cursor:pointer}
  #signoutno{background:var(--system-gray5); color:var(--system-blue)}
  #signoutyes{background:var(--system-blue); color:#fff}
  /* the one line a keyboard save says over whatever the panel shows */
  #diagnostictoast{position:fixed; z-index:30; top:48px; left:12px; right:12px;
    padding:10px 12px; background:var(--paper); border:var(--edge) solid var(--line);
    border-radius:var(--sq); font:13px/1.4 var(--sans); color:var(--ink); pointer-events:none}
  #diagnostictoast:empty{display:none}

  /* ---- the startup curtain ------------------------------------------------ */
  /* What an installed open shows over its own first frames. The picture, the
     lengths, the 620ms arrival, the 5200ms turn and the 260ms fade are
     taken from an earlier phone app's loading page; the
     coastline in the body below keeps that shape, unchanged.

     It lives in this document rather than being built by the script, for the
     reason that file gives: markup in the page is on screen from the page's
     first paint, while anything the script draws can only appear once the
     script has run. Nothing here is fetched. The circle and the strip are empty
     boxes, the coastline is written out in full, and the motion is CSS, so the
     curtain needs no second file and no service worker lookup to be right.

     What it does NOT do is time itself out. The globe is this board's
     connection step, not a stopwatch: it turns while the phone is still trying
     to read the board, it stops and turns red when a reading fails, and it is
     taken down only by a live reading that has been drawn and has stopped
     moving. The script below owns that rule; this sheet owns the picture. */
  /* the curtain takes the root's own measure rather than the four edges of the
     box it is offered. installed, those are not the same box for the first frames
     of a cold open: the web view hands the page the screen less the status bar
     and only settles to the whole screen once the root has overhung it, so a
     curtain pinned to the offered box is drawn short and the globe in the middle
     of it sits high until the settle lands. the root's measure is the screen from
     the first frame. in a browser tab there is no curtain at all, so nothing
     there is changed by this */
  #loading{
    position:fixed; left:0; right:0; top:0; height:var(--screen-h, var(--root-h)); z-index:40;
    background:#ffffff;
    opacity:1;
    transition:opacity 260ms ease;
  }
  /* the scene arrives rather than being there, which is what makes any settle
     of the safe-area insets on the first frames a non-event */
  #loading .scene{position:absolute; inset:0; animation:ld-appear 620ms ease-out 80ms both}
  /* Centred on the panel, as a percentage of the panel itself, so the offset and
     the box it is measured against are the same box. A viewport-height unit is a
     different quantity and need not match the panel. Sizes stay in vmin, which
     is the width in portrait. */
  #loading .globe{
    position:absolute; left:50%; top:50%;
    box-sizing:border-box;
    width:14vmin; height:14vmin; margin:-7vmin 0 0 -7vmin;
    border:0.4vmin solid #000000; border-radius:50%; overflow:hidden;
  }
  /* the strip the circle looks at: the world twice over, four circles wide, so
     the circle shows half a world and sliding by half the strip puts the second
     copy exactly where the first stood and the loop has no seam */
  #loading .earth{
    position:absolute; left:0; top:0; width:400%; height:100%;
    animation:ld-spin 5200ms linear infinite;
    will-change:transform;
  }
  /* the stroke is held on the SCREEN rather than in the map's coordinates, and
     that effect is set on the shape itself in the markup, since it is not
     inherited and a rule written here would not reach the copies drawn from it */
  #loading .coast{display:block; width:100%; height:100%; fill:none; stroke:#000000; stroke-width:0.2vmin}
  @keyframes ld-appear{from{opacity:0} to{opacity:1}}
  @keyframes ld-spin{from{transform:translateX(-50%)} to{transform:translateX(0)}}
  /* the board could not be reached: the globe stops where it stands and turns
     red, and stays that way until a reading gets through. paused rather than
     removed, so it holds the face of the world it had rather than snapping back
     to the strip's start. the red is the board's own (--must in card-tokens.css)
     written out here, because the curtain is painted before any other sheet is
     needed and must not depend on one */
  #loading.down .globe{border-color:#A8442A}
  #loading.down .coast{stroke:#A8442A}
  #loading.down .earth{animation-play-state:paused}
  /* a browser tab had no launch image to hand over from, so there is no handover
     to hold and the curtain would only be a flash of its own. the script takes
     it out of the document there; this is the half of the pair that acts before
     any script runs, and it is written as "hide it in a tab" so a browser that
     does not know the query errs towards showing the page */
  @media (display-mode: browser){
    #loading{display:none}
  }

  /* card prose, the .cardmd rules, is shared with the desktop: card-tokens.css */
  /* the star on its own does not reach a ::before or a ::after, and layers like
     the menus' shade live on those, so they are named here too */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation:none !important; transition:none !important}
    /* the curtain is the exception, and only while it is up. its globe is the
       one thing on screen saying the phone is still trying to reach the board,
       and an indicator holding perfectly still is one saying the app has died.
       Stopping is what this globe says FAILED with, so it cannot also be what
       it says "working" with. The turn is already the slow pace the guidance
       asks for in place of taking motion away: one revolution every 5200ms,
       which is the pace everybody gets. */
    #loading .scene{animation:ld-appear 620ms ease-out 80ms both !important}
    #loading .earth{animation:ld-spin 5200ms linear infinite !important}
    #loading.down .earth{animation-play-state:paused !important}
    #loading{transition:opacity 260ms ease !important}
  }
  /* Omni cards use the supplied playing-card art in place of the row's
     internal id. State, age, agent label and actions remain the ordinary ones. */
  .trow.omni-ticket{background:#fff}
  .trow.omni-ticket .trowin{padding-left:7px}
  .omni-art{display:block; flex:none; width:auto; height:44px; max-width:38px;
    object-fit:contain; object-position:center}
  .box.omni-card{background:#fff !important}
  .box.omni-card .head{display:flex; align-items:center; gap:12px;
    padding-left:calc(var(--pad-x)*2/3)}
  /* the card's art stands exactly as tall as the title's letters are set: its
     font size is the title's own 24px and it is one em high at its natural
     width, riding the title's first line centred in that line's 1.25 height */
  .box.omni-card .omni-card-art{display:block; flex:none; font-size:24px; width:auto; height:1em;
    align-self:flex-start; margin-top:.125em; object-fit:contain; object-position:center}
  .box.omni-card .title{flex:1 1 0; padding-left:0}
  /* the light a card, or its row in the ticket list, crosses into and out of
     Omni under, and the glint it leaves on the card's top right corner on the
     way in, the desktop's own and explained there: a wide bell of white with
     the barest warmth multiplied in and a narrow white glare screened over it,
     each with a round sun riding the diagonal, moved by the script through
     --omni-p. a row lays it at 45 degrees with a smaller sun. the element
     takes no z-index, so each layer's blend reaches what is under it */
  .omni-sweep{position:absolute; inset:0; pointer-events:none; --omni-p:-1;
    --omni-dir:to top right; --omni-sun:160px; --omni-core:50px;
    --omni-c:calc(var(--omni-p) * 100%);
    --omni-x:calc(var(--omni-p) * 100%); --omni-y:calc((1 - var(--omni-p)) * 100%)}
  .trow > .omni-sweep{--omni-dir:45deg; --omni-sun:56px; --omni-core:18px}
  .omni-sweep::before, .omni-sweep::after{content:""; position:absolute; inset:0; z-index:40}
  .omni-sweep::before{
    mix-blend-mode:multiply;
    background:
      radial-gradient(circle at var(--omni-x) var(--omni-y), rgba(255,242,232,.88) 0,
        rgba(255,242,232,.68) calc(var(--omni-sun) * .25), rgba(255,242,232,.31) calc(var(--omni-sun) * .5),
        rgba(255,242,232,.08) calc(var(--omni-sun) * .75), rgba(255,242,232,0) var(--omni-sun)),
      linear-gradient(var(--omni-dir), rgba(255,242,232,0) calc(var(--omni-c) - 24%),
        rgba(255,242,232,.11) calc(var(--omni-c) - 18%), rgba(255,242,232,.32) calc(var(--omni-c) - 12%),
        rgba(255,242,232,.62) calc(var(--omni-c) - 6%), rgba(255,242,232,.78) var(--omni-c),

<script>
  // The one length the sheet cannot work out for itself on the first frames of a
  // cold installed open: how tall the screen is. The engine reports neither the
  // safe area nor the whole screen until it has settled, so everything it can
  // resolve until then is the shorter box it first offered, and a curtain
  // measured by any of it is drawn short with its globe high. The screen's own
  // height is known from the start and never settles. It stands here, after the
  // curtain and before anything is laid out, so the curtain still needs no
  // script to exist and the sheet keeps its own fallback if this never runs. A
  // browser tab is left alone: it has no curtain, and the offered box is the
  // right answer there.
  if (navigator.standalone) {
    document.documentElement.style.setProperty("--screen-h", screen.height + "px");
  }
</script>

<script>
  // the web font sheets, asked for without holding any paint. linked in the
  // head they kept the whole page blank until they arrived, and they come from
  // another site that nothing here can hurry. each goes in under a media query
  // no screen matches, which the browser fetches without waiting on, and is
  // switched on the moment it lands. the curtain waits for them and for the
  // faces they name (webFacesLanded, below), so the board it uncovers is
  // already in its own faces; a sheet that fails is an answer too, and the page
  // keeps the fallback faces its stacks name
  window.webFontSheets = Promise.all([
    "https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap",
    "https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap",
  ].map(href => new Promise(settle => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.media = "print";
    link.addEventListener("load", () => { link.media = "all"; settle(); }, { once: true });
    link.addEventListener("error", () => settle(), { once: true });
    link.href = href;
    document.head.appendChild(link);
  })));
</script>

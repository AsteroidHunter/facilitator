// ---- the row he types on -----------------------------------------------------------
// the row is measured on its twin, never by collapsing the row itself: a row
// collapsed to be measured hands its scroll to the engine's clamp for the length
// of one layout, and the engine's own reveal of the caret, made at the
// keystroke, is thrown away with it. the height written is a whole count of
// lines rounded up to a whole pixel, since a line is 25.5px tall and a scroll
// height the engine rounds down leaves half a pixel to scroll. the css caps
// it: the desktop's share of the height with the keyboard down, five lines
// while it is up.
function rowMetrics(ta){
  const cs = getComputedStyle(ta);
  return { lh: parseFloat(cs.lineHeight) || 0, pt: parseFloat(cs.paddingTop) || 0, pb: parseFloat(cs.paddingBottom) || 0 };
}
// how many lines the twin lays its text on, snapped to a whole line so the
// engine's rounding of the scroll height cannot leave a fraction of one
function twinLines(twin, m){
  return Math.max(1, Math.round((twin.scrollHeight - m.pt - m.pb) / m.lh));
}
// the row's height from its text; whether it grew, for the blink. a row not on
// screen has no width to wrap at and keeps the height it had
function fitRow(ta, twin){
  const m = rowMetrics(ta);
  if (!m.lh || !ta.clientWidth) return false;
  twin.style.width = ta.clientWidth + "px";
  twin.value = ta.value;
  const want = Math.ceil(twinLines(twin, m) * m.lh + m.pt + m.pb);
  const was = parseFloat(ta.style.height) || 0;
  ta.style.height = want + "px";
  return want > was;
}
// the caret's line, counted on the twin from the text up to the end of the word
// the caret is in: a word the wrap carries whole to the next line is then
// counted on the line it stands on, which the text cut at the caret would miss
function caretLine(ta, twin, m){
  const v = ta.value;
  let end = ta.selectionEnd;
  while (end < v.length && !/\s/.test(v[end])) end++;
  twin.value = v.slice(0, end);
  return { line: twinLines(twin, m), last: end === v.length };
}
// once the row holds more than its cap it scrolls inside, and the caret's line
// is brought inside the box: the last line brings the row's foot with it, so
// nothing is left below to scroll, and the first brings the row's head. after
// every keystroke, since a height write throws the engine's own reveal off, on
// focus, so the line he tapped is the line in view once the keyboard is up,
// at the keyboard's edge, where the cap shrinks the box, and when it lands.
// the box is read as a rectangle rather than as clientHeight, which the engine
// rounds while the cap is a fraction, and the end of the text is asked for as
// the whole scroll height, which the engine clamps to the true last position
function revealCaret(ta, twin){
  if (ta.scrollHeight <= ta.clientHeight) return;
  const m = rowMetrics(ta);
  if (!m.lh) return;
  const at = caretLine(ta, twin, m);
  const box = ta.getBoundingClientRect().height;
  if (at.last){
    if (ta.scrollTop + box < ta.scrollHeight - 0.5) ta.scrollTop = ta.scrollHeight;
    return;
  }
  const top = at.line === 1 ? 0 : m.pt + (at.line - 1) * m.lh;
  const bottom = m.pt + at.line * m.lh;
  let st = ta.scrollTop;
  if (bottom > st + box) st = bottom - box;
  if (top < st) st = top;
  if (Math.abs(st - ta.scrollTop) > 0.5) ta.scrollTop = st;
}
// the one frame blink that keeps the phone from scrolling the page to reveal
// the caret (the css does the same on focus): the previous blink is cancelled
// first, so fast typing stacks nothing
let rowBlink = null;
function blinkRow(ta){
  if (!ta.animate) return;
  if (rowBlink) rowBlink.cancel();
  rowBlink = ta.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 20 });
}
// the focusing tap on an empty row. the phone's own focus from a tap runs its
// caret reveal, which scrolls the whole page under the rising keyboard, and the
// one refusal it honours is preventScroll on a focus call, which a tap can never
// carry. so the tap into an empty row is refused and the focus made here inside
// the same gesture; an empty row has one caret position, so the hand made focus
// lands the caret where the tap would have. a row holding text is left to the
// engine: a refused tap places no caret, and the caret would land wherever a
// scripted focus leaves it rather than under the finger
function takeFocusTap(e){
  const ta = e.currentTarget;
  if (e.button !== 0 || document.activeElement === ta || ta.value.length) return;
  e.preventDefault();
  ta.focus({ preventScroll: true });
}

// ---- the keyboard ----------------------------------------------------------------------
// The page cannot read which keyboard surface is present. It learns the full
// visual-viewport height while nothing is being edited, then treats the actual
// height lost while an editor is focused as the bottom obstruction. That makes
// a small accessory strip and a full soft keyboard use their measured sizes.
// A one-pixel tolerance removes viewport rounding noise. Page zoom also makes
// the visual viewport smaller or larger, but changes its scale, so it is not
// classified as an obstruction or allowed to teach the clear-height baseline.
// The older 100px line selects the full soft-keyboard composer cap, Enter
// behavior, and app margin; the measured loss still supplies the inset. The body
// keeps its full-screen height and follows the visual viewport's top, which cancels a
// focus pan and anchors the tabs and card header. The box is held through the
// close's settle window until the viewport is whole.
const VIEWPORT_EPSILON_PX = 1;
const PAGE_SCALE_EPSILON = .01;
const MIN_SOFT_KEYBOARD_PX = 100;
const KB_ANIM_MS = 250;                    // the css --kb-anim: the keyboard's own duration
const LIFT_SETTLE_MS = KB_ANIM_MS + 200;   // the settle window, which a landing closes early
const CLOSE_RETRY_MS = 350;                // the viewport reports late after a close
const MAX_SHOVE_CLEARS = 3;                // per keystroke; a phone that keeps re-shoving is yielded to
const HEAL_THRESHOLD_PX = 4;               // a window left this much short of the baseline is stuck
let baseline = 0, baselineWidth = 0;
let obstructionUp = false, appliedObstruction = false, appliedSoftKeyboard = false, appliedInset = 0;
let appliedTop = null, appliedHeight = null, appliedVvHeight = null;
let liftUntil = 0, liftTimer = null, closeRetry = null, shoveClears = 0;

function editing(){
  const a = document.activeElement;
  return !!a && a !== document.body && (a.matches("textarea, input:not([type=file])") || a.isContentEditable);
}
function readWorld(){
  const vv = window.visualViewport;
  const vvHeight = vv ? vv.height : window.innerHeight;
  const vvScale = vv && Number.isFinite(vv.scale) ? vv.scale : 1;
  const pageAtRestScale = Math.abs(vvScale - 1) <= PAGE_SCALE_EPSILON;
  if (window.innerWidth !== baselineWidth){ baselineWidth = window.innerWidth; baseline = 0; }   // a rotation: relearn
  const focused = editing();
  // only a keyboard-free frame teaches the baseline, and only upward: a
  // shrunken viewport and a zoomed viewport must not become the full screen
  if (!focused) baseline = Math.max(baseline, window.innerHeight, pageAtRestScale ? vvHeight : 0);
  if (!baseline) baseline = Math.max(window.innerHeight, pageAtRestScale ? vvHeight : 0);
  return { focused, baseline, vvHeight, vvTop: vv ? vv.offsetTop : 0, pageAtRestScale };
}
function viewportObstruction(base, vvHeight){
  const d = base - vvHeight;
  return d > VIEWPORT_EPSILON_PX ? d : 0;
}
function reconcile(){
  const w = readWorld();
  const obstructed = w.focused && w.pageAtRestScale && viewportObstruction(w.baseline, w.vvHeight) > 0;
  const wasUp = obstructionUp;
  obstructionUp = obstructed;
  let top = w.vvTop, height = w.vvHeight;
  const x = Math.round(window.scrollX), y = Math.round(window.scrollY);
  const heightChanged = appliedVvHeight === null || Math.round(height) !== appliedVvHeight;
  if (wasUp && obstructed && !heightChanged && (x !== 0 || y !== 0)){
    // a shove: the keyboard steady, the viewport moved by a scroll of the
    // window to reveal the caret. cleared on its own frame, and the box is
    // handed the numbers it already has, so it writes nothing
    if (shoveClears < MAX_SHOVE_CLEARS){
      shoveClears++;
      window.scrollTo(0, 0);
      top = appliedTop; height = appliedVvHeight;
    }
  } else if (obstructed && !wasUp && y !== 0){
    // an open on a scrolled window: the height is the real change, the top
    // describes a scroll about to be taken back, so it stands where it is
    top = appliedTop === null ? 0 : appliedTop;
  }
  applyShell(obstructed, top, height, w.baseline);
  tracePhone("note", "viewport", { kb: appliedSoftKeyboard, lifting: performance.now() < liftUntil,
    vh: Math.round(w.vvHeight / 4) * 4, vt: Math.round(w.vvTop / 4) * 4 });
  if (wasUp && !obstructed) keyboardClosed();
}
// the one writer: the two classes, the inset, the box
function applyShell(obstructed, top, height, base){
  const body = document.body;
  const inset = obstructed ? viewportObstruction(base, height) : 0;
  const softKeyboard = obstructed && inset >= MIN_SOFT_KEYBOARD_PX;
  const edge = obstructed !== appliedObstruction;
  const softEdge = softKeyboard !== appliedSoftKeyboard;
  if (edge){ appliedObstruction = obstructed; armLift(); }
  appliedSoftKeyboard = softKeyboard;
  const lifting = performance.now() < liftUntil;
  body.classList.toggle("obstructed", obstructed);
  body.classList.toggle("kb", softKeyboard);
  body.classList.toggle("lifting", lifting);
  if (inset !== appliedInset){ appliedInset = inset; document.getElementById("page").style.setProperty("--kb-inset", inset + "px"); }
  document.documentElement.style.setProperty("--vvh", height + "px");
  if (obstructed || lifting){
    const t = Math.round(top), hgt = Math.round(base);
    if (t !== appliedTop || hgt !== appliedHeight){
      appliedTop = t; appliedHeight = hgt;
      body.style.setProperty("--shell-top", t + "px");
      body.style.setProperty("--shell-h", hgt + "px");
    }
    appliedVvHeight = Math.round(height);
  } else if (appliedTop !== null){
    appliedTop = appliedHeight = appliedVvHeight = null;
    body.style.removeProperty("--shell-top");
    body.style.removeProperty("--shell-h");
  }
  // the row's cap changes with the keyboard (the css): the caret's line is
  // brought back inside the box on the same frame the box changes
  if (edge || softEdge){
    const el = selectedId && els[selectedId];
    if (el && document.activeElement === el.ta) revealCaret(el.ta, el.twin);
  }
}
// a keyboard edge opens the settle window; the foot's own transitionend closes
// it early and exactly, this clock closes one that never fires it
function armLift(){
  liftUntil = performance.now() + LIFT_SETTLE_MS;
  if (liftTimer) clearTimeout(liftTimer);
  liftTimer = setTimeout(() => { liftTimer = null; liftLanded(true); }, LIFT_SETTLE_MS + 20);
}
// the foot has landed. the window closes here for an open, and for a close
// whose viewport already reads whole; a close the phone has not finished
// reporting keeps the clock, so the box's top stands until the layout viewport
// is slid back. an open landed brings the caret's line into view, a close
// landed puts the scrollers back in bounds
function liftLanded(byClock){
  const w = readWorld();
  const whole = viewportObstruction(w.baseline, w.vvHeight) === 0 && w.vvTop <= 1;
  if (byClock || appliedObstruction || whole) liftUntil = 0;
  reconcile();
  const el = selectedId && els[selectedId];
  if (!el) return;
  if (appliedObstruction){ if (document.activeElement === el.ta) revealCaret(el.ta, el.twin); }
  else snapBack(el);
}
document.getElementById("page").addEventListener("transitionend", e => {
  if (e.target === e.currentTarget && e.propertyName === "padding-bottom") liftLanded(false);
});
// the phone can hand a scroller its pre-close offset a frame after its own
// close motion, past the end of the range the taller box leaves, and paint a
// white band there until the next scroll
function snapBack(el){
  for (const node of [el.reply, el.ta]){
    const max = Math.max(0, node.scrollHeight - node.clientHeight);
    if (node.scrollTop > max) node.scrollTop = max;
  }
}
// the close's corrections: a window still scrolled or a viewport still slid
// once the keyboard is gone is displacement, and goes; on the retry, by when
// the dismissal's motion is over, a window still short of the baseline is
// stuck and one display-none reflow heals it, with the scrollers' places put
// back around it
function correctionPass(retry){
  const x = Math.round(window.scrollX), y = Math.round(window.scrollY);
  const top = Math.round(window.visualViewport ? window.visualViewport.offsetTop : 0);
  if (x !== 0 || y !== 0 || top > 1) window.scrollTo(0, 0);
  if (!retry) return;
  if (baseline - window.innerHeight > HEAL_THRESHOLD_PX){
    const scrolled = [...document.querySelectorAll("*")].filter(n => n.scrollTop > 0).map(n => [n, n.scrollTop]);
    document.body.style.display = "none";
    void document.body.offsetHeight;
    document.body.style.display = "";
    for (const [n, st] of scrolled) n.scrollTop = st;
  }
  const el = selectedId && els[selectedId];
  if (el) snapBack(el);
}
function keyboardClosed(){
  if (closeRetry) clearTimeout(closeRetry);
  shoveClears = 0;
  correctionPass(false);
  closeRetry = setTimeout(() => {
    closeRetry = null;
    if (!obstructionUp) correctionPass(true);
  }, CLOSE_RETRY_MS);
}
document.addEventListener("focusin", reconcile);
document.addEventListener("focusout", () => requestAnimationFrame(reconcile));   // a frame's grace: focus may be hopping between fields
for (const type of ["beforeinput", "keydown"]){

window.addEventListener("orientationchange", () => { baseline = 0; reconcile(); });
// a window scrolled while a field is focused with no keyboard up is the phone
// fighting the box: back on the same frame. with the keyboard up the close
// pass owns the residue

// ---- a keyboard plugged into the phone ------------------------------------------------
// the board's own keys, for the keyboard a phone can be paired with. they are
// read the way the desktop reads them, off e.key and the modifier flags, and a
// key is only taken from the browser where it is answered here; a plain arrow
// while he is typing is never touched, since that one belongs to the caret.
// this page is also run as a standalone app off the home screen, where the
// system answers some command combinations itself before the page is shown
// them. which ones cannot be learned from a browser driven headless, so both of
// the desktop's pairs for walking the cards are kept: the control shift arrows
// and the command shift brackets do the same thing, and whichever pair the
// phone lets through is the one that works.

// The laptop walks its chosen workspace. The phone has no workspace chooser,
// so the selected card names that local context; the drawer still shows the
// whole lane and selecting one of its other cards changes the context.
function navigationPool(state, anchorId = selectedId){
  const pool = viewPool(state);
  const anchor = state.boxes.find(b => b.id === anchorId);
  return anchor && anchor.ws ? pool.filter(b => b.ws === anchor.ws) : pool;
}

// the previous or the next card, walking the selected card's workspace in the
// same order the desktop walks its chosen workspace
function stepCard(dir, focus){
  const pool = lastState ? navigationPool(lastState) : [];
  if (!pool.length) return;
  const at = pool.findIndex(b => b.id === selectedId);
  const pick = pool[(at + dir + pool.length) % pool.length];
  if (!pick) return;
  select(pick.id);
  // the caret was in a text box, so it belongs in the next card's. arriving
  // from anywhere else leaves the focus where it was: on a phone a focused row
  // is what raises the on-screen keyboard, and a key that only moves between
  // cards must never raise it
  if (focus) els[pick.id]?.ta.focus({ preventScroll: true });
}

const phoneShortcutTyping = cardShortcutEditing;
const phoneShortcutActions = {
  diagnostic(e){
    e.preventDefault();
    saveDiagnostic("shortcut");
  },
  navigate(e, shortcut){
    e.preventDefault();
    stepCard(shortcut.value, phoneShortcutTyping(e.target));
  },
  plainNavigate(e, shortcut){
    if (phoneShortcutTyping(e.target)) return;
    e.preventDefault();
    stepCard(shortcut.value, false);
  },
  history(e, shortcut){
    e.preventDefault();
    histStep(selectedId, shortcut.value);
  },
  bounce(e){
    if (lastLeftId && els[lastLeftId]){
      e.preventDefault();
      const there = lastLeftId;
      lastLeftId = selectedId;
      select(there);
      if (phoneShortcutTyping(e.target)) els[there].ta.focus({ preventScroll: true });
    }
  },
  create(e){
    e.preventDefault();
    createCard();
  },
  tab(e, shortcut){
    if (!lastState) return;
    const ow = barOwners(lastState)[shortcut.value];
    if (ow){ e.preventDefault(); setTab(ow); }
  },
  escape(e){
    if (phoneShortcutTyping(e.target)) e.target.blur();
  },
  close(e){
    if (phoneShortcutTyping(e.target) || !selectedId) return;
    const b = lastState?.boxes.find(x => x.id === selectedId);
    if (b?.bucket === "meta"){
      e.preventDefault();
      closeCard(selectedId);
    }
  },
};

addEventListener("keydown", e => {
  dispatchCardShortcut(e, phoneShortcutActions);

function keyBytes(b64url){
  const pad = "=".repeat((4 - b64url.length % 4) % 4);
  const raw = atob((b64url + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, ch => ch.charCodeAt(0));
}
document.getElementById("setmark").innerHTML = GEAR_ICON;
const diagnosticButton = document.getElementById("savediagnostic");
let diagnosticRetry = false, diagnosticToastTimer = null;
async function saveDiagnostic(source = "settings"){
  if (diagnosticButton.disabled) return;
  diagnosticButton.disabled = true;
  const status = document.getElementById("diagnosticstatus");
  const toast = document.getElementById("diagnostictoast");
  const tell = text => {
    status.textContent = text;
    if (source === "shortcut") toast.textContent = text;
  };
  clearTimeout(diagnosticToastTimer);
  tell("Saving diagnostic history…");
  try {
    const answer = await tracePhone("mark", source, phoneTraceState(), diagnosticRetry);
    const outcome = answer?.status || "failed";
    diagnosticRetry = outcome !== "saved";
    const messages = {
      saved: "Diagnostic history saved on the Mac.",
      offline: "Offline. History is held in this page. Reconnect and retry.",
      limited: "Too many saves this minute. History is held in this page. Retry shortly.",
      busy: "A diagnostic save is already running. Try again shortly.",
      failed: "Could not confirm a save. Keep this page open and retry.",
    };
    tell(messages[outcome] || messages.failed);
  } catch (_) {
    diagnosticRetry = true;
    tell("Could not confirm a save. Keep this page open and retry.");
  } finally {
    diagnosticButton.disabled = false;
    diagnosticButton.textContent = diagnosticRetry ? "Retry diagnostic save" : "Save diagnostic history";
    diagnosticToastTimer = setTimeout(() => { toast.textContent = ""; }, 6000);
  }
}

  if (!("PushManager" in window) || !("Notification" in window)){
    notifyState(false, "Add this page to the home screen first, then ask again from there");
    return;
  }
  const reg = await pushRegistration();
  if (!reg){ notifyState(false, "Notifications need the page served over https"); return; }
  const permission = await Notification.requestPermission();
  if (permission !== "granted"){ notifyState(false, "Notifications are off in the phone's settings for this page"); return; }
  try {
    const key = (await (await fetch("/push/key")).json()).key;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(key) });
    await sendSubscription(sub);
    notifyState(true, "");
  } catch (err) {
    notifyState(false, "Could not subscribe: " + (err && err.message ? err.message : err));
  }
}
notifyBtn.addEventListener("click", askNotifications);
// a phone already subscribed says so, and hands the server its subscription
// again so a board whose state was reset learns it back
(async () => {
  if (!("PushManager" in window)) return;
  const reg = await pushRegistration();
  if (!reg) return;
  try {
    const sub = await reg.pushManager.getSubscription();
    if (sub && Notification.permission === "granted"){ await sendSubscription(sub); notifyState(true, ""); }
  } catch (err) {}
})();
</script>

// the pencil: on-canvas edit mode. while it is on, a plain drag moves a
// region and the small squares on its edges resize it; everything snaps to
// the same star grid and saves under the same keys as the option gestures,
// which keep working in both modes
let editMode = false;
let editPending = null;    // pointerdown seen; becomes a drag only after real movement
let sizing = null;
let squelchClick = false;  // a drag just ended; swallow the click it produced
const handleLayer = document.createElement("div");
handleLayer.id = "edithandles";
document.getElementById("stage").appendChild(handleLayer);
let handleItems = [];
let handleRaf = 0;
const HANDLE_CURSOR = { nw: "nwse-resize", se: "nwse-resize", ne: "nesw-resize",
  sw: "nesw-resize", n: "ns-resize", s: "ns-resize", e: "ew-resize", w: "ew-resize" };
function setEditMode(on){
  if (!FOCUS) return;
  editMode = on;
  document.body.classList.toggle("editmode", on);
  if (on){
    buildHandles();
    trackHandles();
  } else {
    cancelAnimationFrame(handleRaf);
    handleLayer.textContent = "";
    handleItems = [];
    editPending = null;
    sizing = null;
  }
}
document.getElementById("editbtn").addEventListener("click", () => setEditMode(!editMode));
function buildHandles(){
  handleLayer.textContent = "";
  handleItems = [];
  for (const el of document.querySelectorAll(REGION_SEL)){
    for (const dir of ["nw", "n", "ne", "e", "se", "s", "sw", "w"]){
      const hd = document.createElement("div");
      hd.className = "rhandle";
      hd.dataset.region = regionId(el);
      hd.dataset.dir = dir;
      hd.style.cursor = HANDLE_CURSOR[dir];
      hd.addEventListener("pointerdown", ev => beginSize(ev, el, dir));
      handleLayer.appendChild(hd);
      handleItems.push({ el, dir, hd });
    }
  }
}
// handles chase the boxes every frame, so they stay glued through drags,
// resizes and content changes without hooking any other code path
function trackHandles(){
  const sr = document.getElementById("stage").getBoundingClientRect();
  for (const it of handleItems){
    const r = it.el.getBoundingClientRect();
    if (!r.width && !r.height){ it.hd.style.display = "none"; continue; }
    it.hd.style.display = "";
    const x = it.dir.includes("w") ? r.x : it.dir.includes("e") ? r.x + r.width : r.x + r.width / 2;
    const y = it.dir.includes("n") ? r.y : it.dir.includes("s") ? r.y + r.height : r.y + r.height / 2;
    it.hd.style.left = (x - sr.x - 4.5) + "px";
    it.hd.style.top = (y - sr.y - 4.5) + "px";
  }
  handleRaf = requestAnimationFrame(trackHandles);
}
function beginSize(e, el, dir){
  if (!editMode || e.button !== 0) return;
  e.preventDefault();   // keeps the grab from focusing or selecting anything
  e.stopPropagation();
  const r = el.getBoundingClientRect();
  const sr = document.getElementById("stage").getBoundingClientRect();
  sizing = { el, dir, px: e.clientX, py: e.clientY,
    left: r.x - sr.x, top: r.y - sr.y, w: r.width, h: r.height,
    // the far edges, snapped: a west or north pull anchors on these
    right: onStar(r.x - sr.x + r.width), bottom: onStar(r.y - sr.y + r.height),
    moved: false };
}
addEventListener("pointermove", e => {
  if (!sizing) return;
  const s = sizing;
  const dx = e.clientX - s.px, dy = e.clientY - s.py;
  // widths and heights stay whole cells, never under two; a west or north
  // pull moves the origin to a star line and keeps the far edge pinned
  let w = Math.max(2 * GRID, Math.round((s.w + (s.dir.includes("e") ? dx : 0)) / GRID) * GRID);
  let h = Math.max(2 * GRID, Math.round((s.h + (s.dir.includes("s") ? dy : 0)) / GRID) * GRID);
  if (s.dir.includes("w")){
    const left = Math.min(Math.max(GRID / 2, onStar(s.left + dx)), s.right - 2 * GRID);
    w = s.right - left;
    s.el.style.left = left + "px";
    s.x = left;
  }
  if (s.dir.includes("n")){
    const top = Math.min(Math.max(GRID / 2, onStar(s.top + dy)), s.bottom - 2 * GRID);
    h = s.bottom - top;
    s.el.style.top = top + "px";
    s.y = top;
  }
  s.el.style.width = w + "px";
  s.el.style.height = h + "px";
  s.outw = w; s.outh = h;
  s.moved = true;
});
addEventListener("pointerup", () => {
  editPending = null;
  if (!sizing) return;
  const s = sizing;
  sizing = null;
  if (!s.moved) return;
  squelchClick = true;
  localStorage.setItem("size." + activeOwner + "." + regionId(s.el),
    JSON.stringify({ w: s.outw, h: s.outh }));
  if (s.x != null || s.y != null){
    // a moved origin must be saved too or the resize half-reverts on reload
    localStorage.setItem("pos." + activeOwner + "." + regionId(s.el),
      JSON.stringify({ x: s.x != null ? s.x : onStar(s.left), y: s.y != null ? s.y : onStar(s.top) }));
  }
});
addEventListener("pointerdown", e => {
  squelchClick = false;
  if (!editMode || !dragEnabled || e.altKey || e.button !== 0 || dragging || sizing) return;
  const el = e.target.closest(REGION_SEL);
  if (!el) return;
  // no grab yet: a plain click inside a card must stay a click; only real
  // movement turns it into a drag
  const r = el.getBoundingClientRect();
  const sr = document.getElementById("stage").getBoundingClientRect();
  editPending = { el, px: e.clientX, py: e.clientY,
    dx: e.clientX - r.x, dy: e.clientY - r.y, sx: sr.x, sy: sr.y };
});
addEventListener("pointermove", e => {
  if (!editPending || dragging || sizing) return;
  if (Math.hypot(e.clientX - editPending.px, e.clientY - editPending.py) < 4) return;
  const p = editPending;
  editPending = null;
  // hand the gesture to the option-drag machinery above: same snap, same save
  dragging = { el: p.el, dx: p.dx, dy: p.dy, sx: p.sx, sy: p.sy,
    x: onStar(p.px - p.dx - p.sx), y: onStar(p.py - p.dy - p.sy) };
  squelchClick = true;
  document.body.classList.add("dragging");
});
addEventListener("click", e => {
  if (!squelchClick) return;
  squelchClick = false;
  e.preventDefault();
  e.stopPropagation();
}, true);

document.getElementById("goaledit").addEventListener("click", () => {
  const w = lastState && curWs(lastState);
  if (!w) return;
  inlineEdit(document.getElementById("goaltext"), w.goal,
    v => api("/ws/goal?owner=" + activeOwner + "&ws=" + w.id, v));
});
document.getElementById("taskedit").addEventListener("click", () => {
  const w = lastState && curWs(lastState);
  if (!w) return;
  const t = taskOf(w, selectedTask) || taskOf(w, w.current);
  if (t) inlineEdit(document.getElementById("tasktext"), t.text,
    v => api("/ws/task?owner=" + activeOwner + "&ws=" + w.id + "&id=" + t.id, v));
  else inlineEdit(document.getElementById("tasktext"), "",
    v => v && api("/ws/task?owner=" + activeOwner + "&ws=" + w.id, v));
});
document.getElementById("taskstatus").addEventListener("click", () => {
  const w = lastState && curWs(lastState);
  if (!w) return;
  const t = taskOf(w, selectedTask) || taskOf(w, w.current);
  if (!t) return;
  const next = { pending: "ongoing", ongoing: "done", done: "pending" }[t.status] || "ongoing";
  api("/ws/task?owner=" + activeOwner + "&ws=" + w.id + "&id=" + t.id + "&status=" + next);
});
{

// ---- the fat caret --------------------------------------------------------
// a terminal style block cursor stands in for the native caret on every
// typing surface: card reply boxes, the title while naming, the to-do input,
// quick chat and the document view. its left edge sits exactly on the
// insertion point. a visible character sets the block's width from the same
// rendered text; empty positions keep the established half-em cell.
{
  const bar = document.createElement("div");
  bar.id = "fatcaret";
  document.body.appendChild(bar);
  // the mirror clones the focused field's text layout so a marker span can
  // stand where the caret is; it stays invisible and out of the layout
  const mirror = document.createElement("div");
  mirror.style.cssText = "position:fixed; top:0; left:-9999px; visibility:hidden; pointer-events:none";
  document.body.appendChild(mirror);

  // per font metrics. asc is inline box top to baseline, measured in the dom
  // itself (a zero size inline block sits exactly on the text baseline), so
  // it matches the caret rects the layout engine reports. fbA and fbD are the
  // font's full cell above and below the baseline, from canvas TextMetrics
  const mcache = new Map();
  const mctx = document.createElement("canvas").getContext("2d");
  function fmetrics(cs){
    const key = cs.fontStyle + "|" + cs.fontWeight + "|" + cs.fontSize + "|" + cs.fontFamily;
    let m = mcache.get(key);
    if (m) return m;
    const d = document.createElement("div");
    d.style.cssText = "position:fixed; left:-9999px; top:0; visibility:hidden; line-height:normal";
    d.style.fontFamily = cs.fontFamily; d.style.fontSize = cs.fontSize;
    d.style.fontWeight = cs.fontWeight; d.style.fontStyle = cs.fontStyle;
    const w = document.createElement("span"); w.textContent = "H";
    const p = document.createElement("span");
    p.style.cssText = "display:inline-block; width:0; height:0";
    d.append(w, p); document.body.appendChild(d);
    const wr = w.getBoundingClientRect();
    m = { asc: p.getBoundingClientRect().bottom - wr.top, boxH: wr.height };
    d.remove();
    let fbA = NaN, fbD = NaN, capH = NaN;
    try {
      mctx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      const tm = mctx.measureText("H");
      fbA = tm.fontBoundingBoxAscent; fbD = tm.fontBoundingBoxDescent;
      capH = tm.actualBoundingBoxAscent;
    } catch (e) {}
    if (fbA > 0 && fbD >= 0){ m.fbA = fbA; m.fbD = fbD; }
    else { m.fbA = m.asc; m.fbD = parseFloat(cs.fontSize) * 1.18 - m.asc; }
    m.capH = capH > 0 ? capH : parseFloat(cs.fontSize) * 0.7;
    // web fonts still loading would freeze wrong numbers into the cache
    if (!document.fonts || document.fonts.status === "loaded") mcache.set(key, m);
    return m;
  }

  // the width of the lane a field's scrollbar sits in, read off the element
  // rather than written down, so wrapping in the mirror matches the field
  function gutterWidth(el, cs){
    const g = el.offsetWidth - el.clientWidth
            - parseFloat(cs.borderLeftWidth) - parseFloat(cs.borderRightWidth);
    return g > 0 ? g : 0;
  }

  // offsetWidth is an integer, but flex layout routinely gives a field a
  // fractional border-box width. Losing that fraction can put the mirror just
  // across a wrap boundary and move a whole trailing word to the wrong line.
  function fieldBoxWidth(el, cs){
    let width = parseFloat(cs.width);
    if (!Number.isFinite(width) || width <= 0) return el.offsetWidth;
    if (cs.boxSizing !== "border-box"){
      width += parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)
             + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
    }
    return width;
  }

  // Intl.Segmenter follows the browser's Unicode grapheme rules, so a range
  // never stops inside a surrogate pair, combining sequence, emoji modifier,
  // flag or ZWJ emoji. Older browsers fall back to a complete code point plus
  // the common extenders and joins. Rare newer cluster rules may therefore use
  // one code point's advance there, but never half of a UTF-16 surrogate.
  let graphemeSegmenter = null;
  try {
    if (Intl && Intl.Segmenter)
      graphemeSegmenter = new Intl.Segmenter(undefined, { granularity: "grapheme" });
  } catch (e) {}
  let markRe = null;
  try { markRe = new RegExp("\\p{Mark}", "u"); } catch (e) {}
  const cpSize = cp => cp > 0xFFFF ? 2 : 1;
  const isExtend = cp =>
    (markRe && markRe.test(String.fromCodePoint(cp))) ||
    (cp >= 0xFE00 && cp <= 0xFE0F) ||
    (cp >= 0xE0100 && cp <= 0xE01EF) ||
    (cp >= 0x1F3FB && cp <= 0x1F3FF) ||
    (cp >= 0xE0020 && cp <= 0xE007F);
  function firstGrapheme(text){
    if (!text) return "";
    if (graphemeSegmenter){
      const first = graphemeSegmenter.segment(text)[Symbol.iterator]().next();
      if (!first.done) return first.value.segment;
    }
    let end = cpSize(text.codePointAt(0));
    if (text.charCodeAt(0) === 13 && text.charCodeAt(1) === 10) return text.slice(0, 2);
    const firstCp = text.codePointAt(0);
    const nextCp = text.codePointAt(end);
    if (firstCp >= 0x1F1E6 && firstCp <= 0x1F1FF &&
        nextCp >= 0x1F1E6 && nextCp <= 0x1F1FF) end += cpSize(nextCp);
    const takeExtenders = () => {
      while (end < text.length){
        const cp = text.codePointAt(end);
        if (!isExtend(cp)) break;
        end += cpSize(cp);
      }
    };
    takeExtenders();
    while (text.codePointAt(end) === 0x200D){
      end++;
      if (end >= text.length) break;
      const cp = text.codePointAt(end);
      end += cpSize(cp);
      takeExtenders();
    }
    return text.slice(0, end);
  }

  function graphemeAt(text, at){
    if (at < 0 || at >= text.length) return "";
    if (graphemeSegmenter){
      const segments = graphemeSegmenter.segment(text);
      let hit = typeof segments.containing === "function" ? segments.containing(at) : null;
      if (!hit){
        for (const segment of segments){
          if (segment.index > at) break;
          if (segment.index + segment.segment.length > at){ hit = segment; break; }
        }
      }
      // A programmatic selection can land inside a visible cluster even though
      // keyboard and pointer movement do not. Do not measure a suffix of it.
      return hit && hit.index === at ? hit.segment : "";
    }
    if (at > 0){
      const unit = text.charCodeAt(at);
      const cp = text.codePointAt(at);
      if ((unit >= 0xDC00 && unit <= 0xDFFF) || cp === 0x200D || isExtend(cp)) return "";
      let p = at - 1;
      if (p > 0 && text.charCodeAt(p) >= 0xDC00 && text.charCodeAt(p) <= 0xDFFF) p--;
      const prev = text.codePointAt(p);
      if (prev === 0x200D) return "";
      if (cp >= 0x1F1E6 && cp <= 0x1F1FF){
        let count = 0, i = at;
        while (i > 0){
          let j = i - 1;
          if (j > 0 && text.charCodeAt(j) >= 0xDC00 && text.charCodeAt(j) <= 0xDFFF) j--;
          const before = text.codePointAt(j);
          if (before < 0x1F1E6 || before > 0x1F1FF) break;
          count++; i = j;
        }
        if (count % 2) return "";
      }
    }
    return firstGrapheme(text.slice(at));
  }

  function rangeAdvance(rg, line){
    const rects = Array.from(rg.getClientRects())
      .filter(r => r.width > 0 && r.height > 0);
    if (rects.length !== 1) return null;
    const rect = rects[0];
    if (line && !(rect.top < line.bottom && rect.bottom > line.top)) return null;
    const width = rect.width;
    return Number.isFinite(width) && width > 0 ? width : null;
  }

  // Read the advance from a DOM Range in the actual laid-out text. This keeps
  // font fallback, kerning, variable-font axes, letter spacing, zoom and tab
  // stops in the browser's hands instead of duplicating them in a width table.
  function textAdvance(node, from, text){
    if (!node || !text || /[\r\n]/.test(text)) return null;
    try {
      const rg = document.createRange();
      rg.setStart(node, from);
      rg.setEnd(node, from + text.length);
      return rangeAdvance(rg);
    } catch (e) { return null; }
  }

  function textPoint(root, offset){
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walk.nextNode())){
      if (offset <= node.data.length) return { node, offset };
      offset -= node.data.length;
    }
    return null;
  }

  function editableAdvance(root, caret, line){
    if (!root.contains(caret.startContainer) && caret.startContainer !== root) return null;
    try {
      const before = document.createRange();
      before.selectNodeContents(root);
      before.setEnd(caret.startContainer, caret.startOffset);
      const at = before.toString().length;
      const text = root.textContent || "";
      const grapheme = graphemeAt(text, at);
      if (!grapheme || /[\r\n]/.test(grapheme)) return null;
      const end = textPoint(root, at + grapheme.length);
      if (!end) return null;
      const rg = caret.cloneRange();
      rg.setEnd(end.node, end.offset);
      return rangeAdvance(rg, line);
    } catch (e) { return null; }
  }

  let cur = null, isField = false;
  const trackable = el => {
    if (!el || el.nodeType !== 1) return null;
    if (el.tagName === "TEXTAREA") return el;
    if (el.tagName === "INPUT") return (el.type === "text" || el.type === "search") ? el : null;
    return el.closest("[contenteditable]");
  };

  // textarea and input path: rebuild the mirror with the field's font, box
  // and wrap rules, text up to the caret, then read the marker's spot
  function fieldCaret(el){
    if (el.selectionStart == null) return null;
    const cs = getComputedStyle(el);
    const r = el.getBoundingClientRect();
    for (const p of ["fontFamily","fontSize","fontWeight","fontStyle","fontStretch",
                     "fontVariant","fontKerning","fontFeatureSettings","fontVariationSettings",
                     "fontOpticalSizing","lineHeight","letterSpacing","wordSpacing",
                     "textTransform","textIndent","textAlign","direction","tabSize",
                     "paddingTop","paddingRight","paddingBottom","paddingLeft",
                     "borderTopWidth","borderRightWidth","borderBottomWidth","borderLeftWidth"])
      mirror.style[p] = cs[p];
    mirror.style.borderStyle = "solid";
    mirror.style.borderColor = "transparent";
    mirror.style.boxSizing = "border-box";
    // Layout uses the field's untransformed, fractional box. Viewport zoom and
    // an ancestor scale are applied below after wrapping is settled.
    const boxWidth = fieldBoxWidth(el, cs);
    const mirrorWidth = Math.max(0, boxWidth - gutterWidth(el, cs));
    mirror.style.width = mirrorWidth + "px";
    // a single-line input never wraps, it scrolls sideways instead
    mirror.style.whiteSpace = el.tagName === "INPUT" ? "pre" : "pre-wrap";
    mirror.style.wordWrap = el.tagName === "INPUT" ? "normal" : "break-word";
    const typed = el.value.slice(0, el.selectionStart);
    const rest = el.value.slice(el.selectionStart);
    mirror.textContent = typed;
    const mr = mirror.getBoundingClientRect();
    const fieldScaleX = boxWidth ? r.width / boxWidth : 1;
    const mirrorScaleX = mirrorWidth ? mr.width / mirrorWidth : 1;
    const rangeScaleX = Number.isFinite(fieldScaleX / mirrorScaleX)
      ? fieldScaleX / mirrorScaleX : 1;
    let kr, width = null;
    if (!rest && /\S$/.test(typed)){
      // live typing at the end of a word: any marker glyph would weld onto
      // that word, and at a full line the welded pair wraps in the mirror
      // while the real text stays put, so the block drew one line below the
      // caret; the right edge of the last typed character is the true spot
      const rg = document.createRange();
      rg.setStart(mirror.firstChild, typed.length - 1);
      rg.setEnd(mirror.firstChild, typed.length);
      const rr = rg.getClientRects()[0] || rg.getBoundingClientRect();
      kr = { left: rr.right, top: rr.top };
    } else if (!rest && / $/.test(typed) && el.tagName !== "INPUT"){
      // live typing spaces at a full line, measured against Chrome's own
      // caret: each space advances its full width while it still fits the
      // line, and once the spaces hang past the edge the caret pins about
      // 1.7px inside the content edge and rides there, on the space's own
      // line; it never drops until a real letter wraps
      const rg = document.createRange();
      rg.setStart(mirror.firstChild, typed.length - 1);
      rg.setEnd(mirror.firstChild, typed.length);
      const rr = rg.getClientRects()[0] || rg.getBoundingClientRect();
      const edge = mr.right - parseFloat(cs.borderRightWidth) - parseFloat(cs.paddingRight) - 1.7;
      kr = { left: Math.min(rr.right, edge), top: rr.top };
    } else {
      const mark = document.createElement("span");
      // the marker carries the rest of the text so it wraps exactly like the
      // real field; its first fragment starts at the caret. at the very end
      // of the text a placeholder dot stands in on the spot typing lands,
      // which after a pressed line break is the start of the next line
      mark.textContent = rest || ".";
      mirror.appendChild(mark);
      kr = mark.getClientRects()[0] || mark.getBoundingClientRect();
      if (rest) width = textAdvance(mark.firstChild, 0,
                                    graphemeAt(el.value, el.selectionStart));
    }
    if (width) width *= rangeScaleX;
    const m = fmetrics(cs);
    // the baseline is the marker's inline box top plus the font's ascent
    return { x: r.left + (kr.left - mr.left) * rangeScaleX
                     - el.scrollLeft * fieldScaleX,
             base: r.top + (kr.top - mr.top) - el.scrollTop + m.asc,
             fs: parseFloat(cs.fontSize), fbA: m.fbA, fbD: m.fbD,
             width, scaleX: fieldScaleX, clip: r };
  }

  // contenteditable path: a collapsed range reports the caret box directly
  function ceCaret(el){
    const cs = getComputedStyle(el);
    const fs = parseFloat(cs.fontSize);
    const m = fmetrics(cs);
    const er = el.getBoundingClientRect();
    const scaleX = el.offsetWidth ? er.width / el.offsetWidth : 1;
    const sel = getSelection();
    if (sel.rangeCount){
      const rg = sel.getRangeAt(0);
      const rr = rg.getBoundingClientRect();
      if (rr.height) return { x: rr.left, base: rr.top + m.asc, fs, fbA: m.fbA, fbD: m.fbD,
                              capH: m.capH, width: editableAdvance(el, rg, rr),
                              scaleX, clip: er };
    }
    // an empty editable gives a zero rect; park the block at the field's
    // start, on the baseline the strut line box will give the first letter
    const r = er;
    return { x: r.left, base: r.top + (r.height - m.boxH) / 2 + m.asc, fs,
             fbA: m.fbA, fbD: m.fbD, capH: m.capH, scaleX, clip: r };
  }

  let raf = 0, px = 0, py = 0;
  function place(){
    raf = 0;
    if (!cur || !cur.isConnected){ cur = null; bar.classList.remove("on"); return; }
    const collapsed = isField ? cur.selectionStart === cur.selectionEnd : getSelection().isCollapsed;
    if (!collapsed){ bar.classList.remove("on"); return; }   // a selection marks its own spot
    const c = isField ? fieldCaret(cur) : ceCaret(cur);
    if (!c){ bar.classList.remove("on"); return; }
    // A visible grapheme supplies its rendered advance. Spaces and tabs work
    // when the browser gives their range a usable width; empty positions, line
    // endings and zero-size text keep the accepted half-em cell. This changes
    // only the fixed overlay; the editor and its text never move.
    const bw = Number.isFinite(c.width) && c.width > 0
      ? c.width : c.fs * 0.5 * (c.scaleX || 1);
    let bh, y;
    if (!isField && cur.classList.contains("title")){
      bh = c.capH + 1;   // one pixel of optical overshoot above the caps
      y = c.base - bh;
    } else {
      // text boxes: 1.1em centered on the glyph band, the accepted look;
      // the font's full bounding cell read too tall here
      bh = c.fs * 1.1;
      y = c.base - c.fbA + (c.fbA + c.fbD - bh) / 2;
    }
    // a caret scrolled out of the field's box must not hover over other ui
    if (y + bh < c.clip.top - 1 || y > c.clip.bottom + 1 ||
        c.x + bw < c.clip.left - 1 || c.x > c.clip.right + 5){
      bar.classList.remove("on"); return;
    }
    bar.style.left = c.x + "px";
    bar.style.top = y + "px";
    bar.style.width = bw + "px";
    bar.style.height = bh + "px";
    if (!bar.classList.contains("on") || c.x !== px || y !== py){
      // restart the blink so the block lands solid, the way a native caret does
      bar.classList.remove("on"); void bar.offsetWidth; bar.classList.add("on");
      px = c.x; py = y;
    }
  }
  const queue = () => { if (!raf) raf = requestAnimationFrame(place); };
  queueFatCaret = queue;

  document.addEventListener("focusin", e => {
    const el = trackable(e.target);
    if (cur && cur !== el) cur.classList.remove("fc-hide");
    cur = el;
    isField = !!el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT");
    if (cur) cur.classList.add("fc-hide");
    queue();
  });
  document.addEventListener("focusout", () => {
    if (cur) cur.classList.remove("fc-hide");
    cur = null; queue();
  });
  document.addEventListener("selectionchange", queue);
  document.addEventListener("input", queue, true);
  document.addEventListener("keyup", queue, true);
  document.addEventListener("scroll", queue, true);
  addEventListener("resize", queue);
  // A web font finishing can change advances without an input event. The app's
  // own data poll calls the same queue after it changes the DOM, so no separate
  // caret timer or animation loop is needed.
  if (document.fonts && document.fonts.addEventListener)
    document.fonts.addEventListener("loadingdone", queue);
}

// ---- the document view ----------------------------------------------------
// the lane the board would show, drawn as one scrolling typed page: an
// outline on the left, the chats as sections in the middle, typing as the
// only control. nothing below runs unless DOC is on.

// tasks have no server endpoint this round, so the page keeps them itself.
// every task read and write goes through this one object; when the server
// grows a home for them, only load and save change.
const docTasks = {
  key(lane){ return "doc.tasks." + lane; },
  load(lane){
    if (MOCK) return docMockTasks;   // the sandbox holds its tasks in memory, never in the real key
    try {
      const raw = JSON.parse(localStorage.getItem(this.key(lane)) || "[]");
      if (!Array.isArray(raw)) return [];
      return raw
        .filter(t => t && typeof t.title === "string")
        .map(t => ({ id: String(t.id || ""), title: t.title,
                     boxes: Array.isArray(t.boxes) ? t.boxes.map(String) : [] }));
    } catch (e) { return []; }
  },
  save(lane, list){
    if (MOCK){ docMockTasks = list; return; }   // memory only; a reload resets the sandbox
    try { localStorage.setItem(this.key(lane), JSON.stringify(list)); } catch (e) {}
  },
};

const docEls = {};        // box id -> the section's parts, so a poll never rebuilds a line being typed in
const docHeads = {};      // task key -> the heading line drawn in the document flow
let docSel = null;        // the section the arrows and plain typing land on

// the lane's chats in the state's own order: creation order, and a reply
// never moves one
function docPool(state){
  const w = curWs(state);
  return state.boxes.filter(b => b.owner === activeOwner && b.id !== "q" && (!w || b.ws === w.id));
}
// the three pages read the one card state, same as the board's tabs
function docPage(state){
  return docPool(state).filter(b => {
    const s = cardState(b);
    return ticketView === "done" ? s === "done"
         : ticketView === "deferred" ? s === "parked"
         : (s !== "done" && s !== "parked");
  });
}
function docDot(b){
  const s = cardState(b);
  return s === "done" ? "d-green" : (s === "parked" || s === "queued") ? "d-grey" : "d-yellow";
}

// the typed structure of the page, read once and drawn twice: the document
// shows it as headings with sections under them, the outline mirrors it as
// headings with rows. chats made before any heading come first, ungrouped.
function docStructure(state){
  const rows = docPage(state);
  const tasks = docTasks.load(activeOwner);
  const filed = new Map();
  tasks.forEach((t, i) => t.boxes.forEach(id => filed.set(id, i)));
  // an old stored task can carry no id, so the position stands in for one
  const groups = tasks.map((t, i) => ({ key: t.id || "t" + i, title: t.title,
                                        boxes: t.boxes, rows: [] }));
  const loose = [];
  for (const b of rows){
    const i = filed.get(b.id);
    if (i != null && groups[i]) groups[i].rows.push(b);
    else loose.push(b);
  }
  return { groups, loose };
}

function docSelect(id, opts){
  docSel = id;
  if (els[id]) select(id);   // the reply-history walk reads the board's own selection
  for (const k of Object.keys(docEls)) docEls[k].sec.classList.toggle("on", k === id);
  for (const r of document.querySelectorAll("#docoutline .docrow"))
    r.classList.toggle("on", r.dataset.id === id);
  const sec = docEls[id] && docEls[id].sec;
  if (sec && !opts?.quiet) sec.scrollIntoView({ block: "nearest" });
}

function docWalk(dir){
  if (!lastState) return;
  // the arrows follow the page as it reads, headings and all
  const st = docStructure(lastState);
  const list = st.loose.concat(...st.groups.map(g => g.rows));
  if (!list.length) return;
  const i = list.findIndex(b => b.id === docSel);
  const pick = list[Math.min(Math.max(i + dir, 0), list.length - 1)] || list[0];
  docSelect(pick.id);
}

// the walk through older replies writes into the hidden board card; carry it
// across so the document shows the step
function docMirrorReply(id){
  if (docEls[id] && els[id]) docEls[id].prose.innerHTML = els[id].reply.innerHTML;
}

function docSend(id, text){
  if (MOCK) return docMockSend(id, text);   // the sandbox answers itself, with no request
  const reopen = boxDone(id);   // before the send, same rule as the board card
  fetch("/send?box=" + encodeURIComponent(id), { method: "POST", body: text })
    .then(r => { if (r.ok && reopen) undone(id); })   // only once the message is in
    .then(() => poll()).catch(() => {});
}

// a chat title renames in place, the same gesture as the board's card title
function docEditTitle(id){
  const t = docEls[id] && docEls[id].title;
  if (!t || t.isContentEditable) return;
  const old = t.textContent;
  // the outline row mirrors every keystroke, so both places move as one
  const mirror = document.querySelector('#docoutline .docrow[data-id="' + CSS.escape(id) + '"] .rttl');
  t.setAttribute("contenteditable", "plaintext-only");
  const end = () => { t.removeAttribute("contenteditable"); t.onkeydown = null; t.onblur = null; t.oninput = null; };
  t.oninput = () => { if (mirror) mirror.textContent = t.textContent; };
  const commit = () => {
    const name = t.textContent.trim();
    end();
    if (name && name !== old){
      t.textContent = name;
      if (MOCK) docMockTitle(id, name);   // the sandbox renames its own copy
      else fetch("/title?box=" + encodeURIComponent(id), { method: "POST", body: name })
        .then(() => poll()).catch(() => {});
    } else { t.textContent = old; if (mirror) mirror.textContent = old; }
  };
  t.onkeydown = e => {
    e.stopPropagation();
    if (e.key === "Enter"){ e.preventDefault(); commit(); }
    else if (e.key === "Escape"){ end(); t.textContent = old; if (mirror) mirror.textContent = old; t.blur(); }
  };
  t.onblur = () => { if (t.isContentEditable) commit(); };
}

// a heading renames where it stands, the same gesture as a chat title. the
// store is the one the outline reads, so the new name shows in both places
function docRenameTask(key, name){
  const list = docTasks.load(activeOwner);
  const i = list.findIndex((t, n) => (t.id || "t" + n) === key);
  if (i < 0 || list[i].title === name) return;
  list[i].title = name;
  docTasks.save(activeOwner, list);
  if (lastState) renderDoc(lastState);
}

function docEditHead(el){
  if (el.isContentEditable) return;
  const old = el.textContent;
  // the outline heading mirrors every keystroke, same as the chat titles
  const mirror = document.querySelector('#docoutline .dochead[data-task="' + CSS.escape(el.dataset.task) + '"]');
  el.setAttribute("contenteditable", "plaintext-only");
  const end = () => { el.removeAttribute("contenteditable"); el.onkeydown = null; el.onblur = null; el.oninput = null; };
  el.oninput = () => { if (mirror) mirror.textContent = el.textContent; };
  const commit = () => {
    const name = el.textContent.trim();
    end();
    if (name && name !== old){ el.textContent = name; docRenameTask(el.dataset.task, name); }
    else { el.textContent = old; if (mirror) mirror.textContent = old; }
  };
  el.onkeydown = e => {
    e.stopPropagation();
    if (e.key === "Enter"){ e.preventDefault(); commit(); }
    else if (e.key === "Escape"){ end(); el.textContent = old; if (mirror) mirror.textContent = old; el.blur(); }
  };
  el.onblur = () => { if (el.isContentEditable) commit(); };
}

function docHeadEl(g){
  const el = h("div", "doctask", g.title);
  el.dataset.task = g.key;
  el.addEventListener("mousedown", () => docEditHead(el));
  return el;
}

function docSection(b){
  const sec = h("div", "docsec");
  sec.dataset.id = b.id;
  const title = h("div", "doctitle", b.title);
  title.addEventListener("mousedown", () => docEditTitle(b.id));
  const path = h("div", "docpath");
  const pend = h("div", "docpend cardmd");
  // the app's own reply class carries code blocks, lists and images along
  const prose = h("div", "docprose reply cardmd");
  const sep = h("div", "docsep");
  const line = h("div", "docreply");
  line.setAttribute("contenteditable", "plaintext-only");
  line.addEventListener("focus", () => docSelect(b.id, { quiet: true }));
  line.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      const text = (line.textContent || "").trim();
      if (!text) return;
      line.textContent = "";
      docSend(b.id, text);
    }
  });
  sec.addEventListener("mousedown", e => {
    if (e.target === title) return;   // a title click is a rename, not a jump
    docSelect(b.id, { quiet: true });
  });
  sec.append(title, path, pend, prose, sep, line);
  return { sec, title, path, pend, prose, line };
}

function docUpdate(b, parts){
  if (!parts.title.isContentEditable && parts.title.textContent !== b.title)
    parts.title.textContent = b.title;
  const dir = (lastState && lastState.pwds ? lastState.pwds[b.owner] : "") || "";
  if (parts.path.textContent !== dir) parts.path.textContent = dir;
  // an older reply is on show: leave the prose where the walk put it
  if (!(hist && hist.id === b.id)){
    const raw = replyFull(b);
    if (parts.prose.dataset.raw !== raw){
      parts.prose.dataset.raw = raw;
      parts.prose.innerHTML = fmt(raw);
    }
  }
  const pending = b.pendingTexts || [];
  const rawPending = pending.join("\n\n");
  if (parts.pend.dataset.raw !== rawPending){
    parts.pend.dataset.raw = rawPending;
    parts.pend.innerHTML = pending.map(t => '<div class="docpending-message">' + fmt(t) + "</div>").join("");
  }
}

// the outline is the mirror: the same headings and the same order the
// document draws, in the list's own typography
function docOutline(state, st){
  const box = document.getElementById("docoutline");
  // a repaint mid rename would replace the mirrored row under the typer's
  // hands; the next tick repaints once the edit ends
  const ae = document.activeElement;
  if (ae && (ae.classList.contains("doctitle") || ae.classList.contains("doctask"))) return;
  const { groups, loose } = st || docStructure(state);
  const rows = loose.concat(...groups.map(g => g.rows));
  // the filing belongs in the signature too: moving a chat under a task
  // changes nothing else, and the outline has to repaint for it
  const sig = ticketView + "|" +
    groups.map(g => g.title + ":" + g.boxes.join("+")).join(">") + "|" +
    rows.map(b => b.id + cardState(b) + b.title + shortAge(b.agentTs || b.ts) +
                  (b.id === docSel ? "!" : "")).join(",");
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  box.textContent = "";

  const rowEl = b => {
    const s = cardState(b);
    const r = h("div", "docrow " + docDot(b) + (s === "done" ? " d-done" : "") +
                       (b.id === docSel ? " on" : ""));
    r.dataset.id = b.id;
    r.appendChild(h("span", "rdot"));
    r.appendChild(h("span", "rdur", s === "done" ? "/" : shortAge(b.agentTs || b.ts)));
    r.appendChild(h("span", "rttl", b.title));
    r.addEventListener("click", () => docSelect(b.id));
    return r;
  };
  // chats made before any task heading sit on top, ungrouped
  if (loose.length){
    const g = h("div", "docgroup");
    for (const b of loose) g.appendChild(rowEl(b));
    box.appendChild(g);
  }
  for (const grp of groups){
    const g = h("div", "docgroup");
    const dh = h("div", "dochead", grp.title);
    dh.dataset.task = grp.key;   // the live rename mirror finds it by this
    g.appendChild(dh);
    g.appendChild(h("div", "docrail"));
    for (const b of grp.rows) g.appendChild(rowEl(b));
    box.appendChild(g);
  }
}

function renderDoc(state){
  const wrap = document.getElementById("docsections");
  const st = docStructure(state);
  // document order: the unfiled chats, then a heading and the chats under it,
  // heading after heading. only this order rebuilds the page, so a rename or a
  // new reply never touches a line being typed in
  const list = st.loose.concat(...st.groups.map(g => g.rows));
  const sig = st.loose.map(b => b.id).join(",") + "|" +
    st.groups.map(g => g.key + ":" + g.rows.map(b => b.id).join("+")).join(">");
  if (wrap.dataset.sig !== sig){
    wrap.dataset.sig = sig;
    for (const id of Object.keys(docEls)){
      if (!list.some(b => b.id === id)){ docEls[id].sec.remove(); delete docEls[id]; }
    }
    for (const k of Object.keys(docHeads)){
      if (!st.groups.some(g => g.key === k)){ docHeads[k].remove(); delete docHeads[k]; }
    }
    for (const b of st.loose){
      if (!docEls[b.id]) docEls[b.id] = docSection(b);
      wrap.appendChild(docEls[b.id].sec);
    }
    for (const g of st.groups){
      if (!docHeads[g.key]) docHeads[g.key] = docHeadEl(g);
      wrap.appendChild(docHeads[g.key]);
      for (const b of g.rows){
        if (!docEls[b.id]) docEls[b.id] = docSection(b);
        wrap.appendChild(docEls[b.id].sec);
      }
    }
  }
  // a rename lands on the heading wherever it is drawn, unless it is the one
  // being typed in
  for (const g of st.groups){
    const el = docHeads[g.key];
    if (el && !el.isContentEditable && el.textContent !== g.title) el.textContent = g.title;
  }
  for (const b of list) docUpdate(b, docEls[b.id]);
  if (!docSel || !docEls[docSel]) docSelect(list.length ? list[0].id : null, { quiet: true });
  docOutline(state, st);

  // progress: one green fill, done over done plus doing, the rest left empty.
  // deferred cards count in neither
  const all = docPool(state);
  let done = 0, doing = 0;
  for (const b of all){
    const s = cardState(b);
    if (s === "done") done++;
    else if (s !== "parked") doing++;
  }
  const total = done + doing;
  const seg = document.getElementById("docdone");
  seg.style.width = (total ? done / total * 100 : 0).toFixed(2) + "%";

  // the goal: the workspace record the board's own goal box reads, no more
  const w = curWs(state);
  const goal = (w && w.goal) || "";
  const gbox = document.getElementById("docgoal");
  if (gbox.firstChild.textContent !== goal){
    gbox.firstChild.textContent = goal;
    gbox.title = goal;   // the block holds two lines; hover carries the rest
  }
  gbox.classList.toggle("off", !goal);

  const n = new Date();
  const date = MONTHS3[n.getMonth()] + " " + ord(n.getDate());
  const dd = document.getElementById("docdate");
  if (dd.textContent !== date) dd.textContent = date;
  for (const t of document.querySelectorAll("#doctabs button"))
    t.classList.toggle("on", t.dataset.page === ticketView);
}

// the bottom line: a task heading, or a whole new chat
function docTitleFrom(text){
  const words = text.replace(/\s+/g, " ").trim().split(" ").slice(0, 7).join(" ");
  return words.length > 60 ? words.slice(0, 60).trim() : words;
}
async function docCompose(text){
  if (!ownerReady) return;
  const first = text.split("\n")[0].trim();
  if (/^task\s+\S/i.test(first)){
    const list = docTasks.load(activeOwner);
    list.push({ id: "k" + Date.now(), title: first, boxes: [] });
    docTasks.save(activeOwner, list);
    if (lastState) renderDoc(lastState);
    return;
  }
  if (MOCK) return docMockCompose(text);   // the sandbox makes its own chat instead
  // a short single line names a new chat; anything longer is its first
  // message, and the title is made from its first words
  const short = !text.includes("\n") && text.length <= 60;
  const title = short ? text : docTitleFrom(text);
  const r = await fetch("/create?owner=" + encodeURIComponent(activeOwner),
                        { method: "POST", body: title }).then(x => x.json()).catch(() => null);
  if (!r || !r.id) return;
  const list = docTasks.load(activeOwner);
  if (list.length){
    list[list.length - 1].boxes.push(r.id);   // a new chat files under the newest task heading
    docTasks.save(activeOwner, list);
  }
  if (!short) await fetch("/send?box=" + encodeURIComponent(r.id),
                          { method: "POST", body: text }).catch(() => {});
  docSel = r.id;
  await poll();
}

// ---- the sandbox (?doc=1&mock=1) ------------------------------------------
// the same view, drawn from the fake lane below so the look and the typing can
// be tried without the live board. everything here is memory only: no request
// leaves the page, no stored key is touched, and a reload starts it over.
const DOCMOCKPWD = "/Users/you/projects/example";   // a made-up folder, never a real one
const DOCMOCKANSWER = "A reply would land here; this sandbox answers every message with this line.";
let docMockState = null;   // built at boot, thrown away on reload
let docMockTasks = [];     // the task headings, held here instead of localStorage
let docMockSeq = 0;

function docMockChat(id, title, mins, st, reply){
  const t = Math.floor(Date.now() / 1000) - mins * 60;
  return { id, owner: activeOwner, ws: "w1", title, reply,
           ts: t, agentTs: t, state: st,
           done: st === "done", parked: st === "parked",
           pendingTexts: [], pending: 0, replies: 1,
           ball: st === "yours" ? "you" : "agent" };
}

function docMockBuild(){
  docMockTasks = [
    { id: "k1", title: "Make search useful", boxes: ["m2"] },
    { id: "k2", title: "Quiet the keyboard", boxes: ["m3"] },
  ];
  docMockSeq = 6;
  return {
    title: "example board",
    projects: [],
    pwds: { [activeOwner]: DOCMOCKPWD },
    workspaces: { [activeOwner]: [{ id: "w1", name: "example", tasks: [],
      goal: "Keep every note in one plain folder." }] },
    boxes: [
      docMockChat("m1", "Outline spacing", 5, "yours",
        "The rows in the left column sat too close together, so there is more air between them now and the dots stay on the title line. A long title wraps under the duration instead of running off the edge.\n\nIf the tighter rows read better to you, say so and the old spacing comes back."),
      docMockChat("m2", "Search across notes", 40, "yours",
        "Search now walks every note in the folder and returns the ten closest matches, newest first. It is plain text matching, which is quick and easy to predict.\n\nThe next step would be to keep the last few searches around, so the same lookup never has to be typed twice."),
      docMockChat("m3", "Keys instead of clicks", 120, "queued",
        "The arrow keys walk the list and plain typing lands in the reply line, so a short session needs no mouse at all. The full list of keys sits at the top of the notes file.\n\nOne question is left for you: whether Escape should leave the field or close the page. It leaves the field for now."),
      docMockChat("m4", "Weekly digest", 180, "parked",
        "Parked until the writing side settles. The draft groups the week by day and keeps every entry to one line, which is short enough to read on a phone."),
      docMockChat("m5", "First run setup", 1440, "done",
        "Setup is one step now: pick a folder, and the tool writes its own settings next to it. Nothing lands outside that folder, so removing the tool means deleting the folder."),
      docMockChat("m6", "Import a folder", 2880, "done",
        "Import reads a folder of text files and turns each file into a note, keeping the file name as the title. Files it cannot read are listed at the end instead of stopping the run."),
    ],
  };
}

function docMockFind(id){ return docMockState.boxes.find(b => b.id === id); }
function docMockPaint(){ if (docMockState) renderDoc(docMockState); }

// a send lands as your pending message, and the canned answer arrives a moment
// later, so the whole transition can be watched
function docMockSend(id, text){
  const b = docMockFind(id);
  if (!b) return;
  b.pendingTexts = b.pendingTexts.concat(text);
  b.pending = b.pendingTexts.length;
  b.ts = Math.floor(Date.now() / 1000);
  b.done = false;
  b.parked = false;
  b.state = "queued";   // writing to a done or parked chat takes it back to doing
  b.ball = "agent";
  docMockPaint();
  setTimeout(() => {
    b.reply = DOCMOCKANSWER;
    b.pendingTexts = []; b.pending = 0;
    b.agentTs = Math.floor(Date.now() / 1000);
    b.state = "yours"; b.ball = "you";
    docMockPaint();
  }, 2000);
}

function docMockTitle(id, name){
  const b = docMockFind(id);
  if (!b) return;
  b.title = name;
  docMockPaint();
}

function docMockCompose(text){
  const short = !text.includes("\n") && text.length <= 60;
  const title = short ? text : docTitleFrom(text);
  const id = "m" + (++docMockSeq);
  docMockState.boxes.push(docMockChat(id, title, 0, "new", ""));
  const list = docTasks.load(activeOwner);
  if (list.length){
    list[list.length - 1].boxes.push(id);   // files under the newest heading, same as the live view
    docTasks.save(activeOwner, list);
  }
  docSel = id;
  if (short) docMockPaint();
  else docMockSend(id, text);
}

function docMockBoot(){
  docMockState = docMockBuild();
  lastState = docMockState;   // the folder line and the section walk read this
  document.title = docMockState.title;
  const nm = document.getElementById("boardname");
  nm.textContent = "example ";
  const em = document.createElement("em");
  em.textContent = "board";
  nm.append(em);
  renderTabs(docMockState);
  docMockPaint();
}

if (DOC){
  const nl = document.getElementById("docnew");
  nl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      const text = (nl.textContent || "").trim();
      if (!text) return;
      nl.textContent = "";
      docCompose(text);
    }
  });
  for (const t of document.querySelectorAll("#doctabs button")){
    t.addEventListener("click", () => {
      ticketView = t.dataset.page;
      docSel = null;
      if (MOCK) docMockPaint();          // the sandbox repaints itself; the board apply stays out of it
      else if (lastState) apply(lastState);
    });
  }
  // up and down walk the sections; a plain key lands in the selected
  // section's reply line, with no click needed first
  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable)) return;
    if (e.key === "ArrowUp" || e.key === "ArrowDown"){
      e.preventDefault();
      docWalk(e.key === "ArrowDown" ? 1 : -1);
      return;
    }
    if (e.key.length !== 1) return;
    const line = docSel && docEls[docSel] ? docEls[docSel].line : null;
    if (!line) return;
    e.preventDefault();
    line.focus();
    document.execCommand("insertText", false, e.key);
  });
}

applySavedLayout();
if (MOCK) docMockBoot();   // no poll in the sandbox: the clock ticks off the browser, the rest is fake
else { poll(); setInterval(poll, 1200); }
</script>

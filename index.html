<script>
const SECTIONS = [["toolmeta", "Tool meta"], ["triagemeta", "Triage meta"],
                  ["now", "Now"], ["done", "Done"], ["later", "Later"]];
const METAS = [["toolmeta", "facilitator"], ["triagemeta", "triage"]];
const NAME = { facilitator: "facilitator agent", triage: "triage agent", journal: "journal agent" };
const laneName = ow => NAME[ow] || (ow + " agent");   // project lanes name themselves
const els = {};       // box id -> {box, reply, meta, ta, send, toc, sec}
const secEls = {}, tocGroups = {};
let lastState = null;

// focus mode: one discussion fills the page. Cards form a grid: each project
// (owner) is a row, its conversations the columns; arrows walk it, the left
// bar jumps anywhere directly.
const FOCUS = document.body.classList.contains("focus");
let selectedId = localStorage.getItem("selbox") || null;
const lastSel = {};   // owner -> the card you were on when you left its row

// project tabs: one owner shown at a time; ?project=owner locks a pulled-out
// window to that project alone
const LOCKED = new URLSearchParams(location.search).get("project");
let activeOwner = LOCKED || localStorage.getItem("activeproj") || "facilitator";
if (LOCKED) document.body.classList.add("locked");


function labelOf(state, owner){
  const dir = (state.pwds || {})[owner] || "";
  return dir.split("/").filter(Boolean).pop() || owner;
}

function pickInRow(state, owner){
  const row = state.boxes.filter(b => b.owner === owner);
  if (!row.length) return null;
  return (lastSel[owner] && row.find(b => b.id === lastSel[owner]))
      || row.find(awaitsYou)
      || row[0];
}

function setTab(owner){
  if (LOCKED && owner !== LOCKED) return;
  if (draft) endDraft();   // an unfinished new tab disappears on switching away
  activeOwner = owner; localStorage.setItem("activeproj", owner);
  const pick = lastState && pickInRow(lastState, owner);
  if (pick) select(pick.id);
  else deselect();   // a lane with no cards shows plain paper, never another lane's card
  applySavedLayout();
  if (lastState) apply(lastState);   // refilter the bar, outline and counters now
}

// clear the selection entirely: without this, a lane with no cards kept
// rendering the previously selected card from another lane
function deselect(){
  selectedId = null; localStorage.removeItem("selbox");
  for (const k of Object.keys(els)){
    els[k].box.classList.remove("sel");
    els[k].toc.classList.remove("t-sel");
  }
  for (const r of document.querySelectorAll("#tiklist .trow")) r.classList.remove("on");
}

let tabDrag = null;   // one grip, two gestures: sideways reorders the bar, a downward tug tears the tab out
let tabGlide = null;  // the settle timer after a drop; the bar may not repaint under it
function renderTabs(st){
  if (!FOCUS || !st) return;
  if (tabDrag?.mode === "reorder" || tabGlide) return;   // a live drag owns the bar; the repaint lands after the drop
  const bar = document.getElementById("tabbar");
  const owners = LOCKED ? [LOCKED] : rowsOf(st);
  const sig = owners.join(",") + (draft ? "|draft" : "") + (LOCKED ? "|locked" : "");
  if (bar.dataset.sig !== sig){
    bar.dataset.sig = sig;
    bar.textContent = "";
    for (const ow of owners){
      const t = h("button", "ptab");
      t.dataset.owner = ow;
      t.appendChild(h("span", "plabel", labelOf(st, ow)));
      if (!LOCKED){
        t.addEventListener("mousedown", e => {
          if (tabGlide) return;   // a drop still settling holds the bar
          tabDrag = { ow, x: e.clientX, y: e.clientY, mode: null, pulled: false, el: t };
        });
      }
      t.addEventListener("click", () => {
        if (tabDrag?.pulled || tabDrag?.mode === "reorder") return;   // a pull or a slide is not a tab switch
        setTab(ow);
      });
      bar.appendChild(t);
    }
    if (draft){
      const t = h("button", "ptab draft");
      t.appendChild(h("span", "plabel", "new project"));
      bar.appendChild(t);
    }
    if (!LOCKED){
      // the plus sits past a thin rule and clear air, never inside the last tab
      bar.appendChild(h("span", "tabsep"));
      const plus = h("button", "ptabplus", "+");
      plus.title = "new project tab";
      plus.addEventListener("click", plusClick);
      bar.appendChild(plus);
    }
  }
  for (const t of bar.querySelectorAll(".ptab:not(.draft)")){
    t.classList.toggle("on", t.dataset.owner === activeOwner);
    const lbl = t.querySelector(".plabel");
    const want = labelOf(st, t.dataset.owner);
    if (lbl.textContent !== want) lbl.textContent = want;
  }
}
// the first clear direction locks the gesture for the whole drag: mostly
// sideways slides the tab along the bar, mostly downward tears it out, and
// once locked the other mode cannot fire. tearing works like a browser tab:
// past the threshold the tab dims, and on release the project's own window
// opens where the cursor let go
addEventListener("mousemove", e => {
  if (!tabDrag) return;
  if (!e.buttons){   // the release landed outside the window; the grip is stale
    if (tabDrag.mode === "reorder") dropReorder();
    tabDrag = null;
    return;
  }
  const dx = e.clientX - tabDrag.x, dy = e.clientY - tabDrag.y;
  if (!tabDrag.mode){
    if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;   // under the lock threshold a click stays a click
    if (Math.abs(dx) > Math.abs(dy)) startReorder();
    else tabDrag.mode = "tear";
  }
  if (tabDrag.mode === "reorder") moveReorder(e);
  else if (!tabDrag.pulled && dy > 40){
    tabDrag.pulled = true;
    tabDrag.el.classList.add("tearing");
  }
});
addEventListener("mouseup", e => {
  if (tabDrag?.mode === "reorder") dropReorder();
  else if (tabDrag?.pulled){
    tabDrag.el.classList.remove("tearing");
    open(location.pathname + "?project=" + tabDrag.ow, "_blank",
         "popup=yes,width=1100,height=850,left=" + Math.max(0, e.screenX - 200) + ",top=" + Math.max(0, e.screenY - 20));
  }
  setTimeout(() => { tabDrag = null; }, 0);
});

// the sideways lock: the resting spots are measured once, the held tab lifts,
// and every swap reads against those fixed midpoints
function startReorder(){
  const t = tabDrag;
  t.tabs = [...document.querySelectorAll("#tabbar .ptab:not(.draft)")];
  t.idx = t.tabs.indexOf(t.el);
  if (t.idx < 0){ tabDrag = null; return; }   // the bar rebuilt under the grip; the drag dies quietly
  t.mode = "reorder";
  t.rects = t.tabs.map(el => el.getBoundingClientRect());
  t.gap = 4;   // the bar's own flex gap
  t.slot = t.idx;
  t.el.classList.add("dragging");
  for (const el of t.tabs) if (el !== t.el) el.classList.add("gliding");
}
function moveReorder(e){
  const t = tabDrag, r = t.rects, i = t.idx;
  const raw = e.clientX - t.x;
  // the strip contains only what you see: the held tab pins at the ends,
  // and the plus, the rule and a draft tab are never part of the drag
  const dx = Math.max(r[0].left - r[i].left,
             Math.min(r[r.length - 1].right - r[i].right, raw));
  t.el.style.transform = "translate(" + dx + "px, -2px)";
  // the claim follows the pointer, never the pinned tab: a clamped center
  // cannot pass an edge midpoint when the held tab is at least as wide as
  // the edge tab, which walled off the first and last slots. counting the
  // resting midpoints the pointer center has passed is monotone and yields
  // every slot from 0 to the last, ends included, past the strip included
  const center = r[i].left + r[i].width / 2 + raw;
  let slot = 0;
  for (let j = 0; j < r.length; j++)
    if (j !== i && center > r[j].left + r[j].width / 2) slot++;
  if (slot === t.slot) return;
  t.slot = slot;
  const shift = r[i].width + t.gap;
  for (let j = 0; j < t.tabs.length; j++){
    if (j === i) continue;
    const move = j < i ? (j >= slot ? shift : 0) : (j <= slot ? -shift : 0);
    t.tabs[j].style.transform = move ? "translateX(" + move + "px)" : "";
  }
}
// the drop: the held tab glides the last stretch down into its slot, the
// order is written down, and only after the glide does the bar repaint
function dropReorder(){
  const t = tabDrag, r = t.rects, i = t.idx, slot = t.slot;
  let left = r[i].left;
  if (slot > i) for (let j = i + 1; j <= slot; j++) left += r[j].width + t.gap;
  if (slot < i) for (let j = slot; j < i; j++) left -= r[j].width + t.gap;
  const order = t.tabs.map(el => el.dataset.owner);
  order.splice(slot, 0, order.splice(i, 1)[0]);
  try { localStorage.setItem("taborder", JSON.stringify(order)); } catch (err) {}
  t.el.style.transition = "transform 220ms cubic-bezier(0.25, 1, 0.5, 1)";
  t.el.style.transform = "translate(" + (left - r[i].left) + "px, 0)";
  tabGlide = setTimeout(() => {   // a timer, not transitionend: a zero-length glide fires no event
    tabGlide = null;
    t.el.classList.remove("dragging");
    t.el.style.transition = ""; t.el.style.transform = "";
    for (const el of t.tabs){ el.classList.remove("gliding"); el.style.transform = ""; }
    document.getElementById("tabbar").dataset.sig = "";
    if (lastState) renderTabs(lastState);
  }, 240);
}

// the plus tab: a fresh tab in a choosing state. It becomes a real lane only
// when a folder is picked; switching away first drops it, no half-made lanes.
const DRAFT = "__new__";
let draft = null;   // {path} while the new tab is choosing its folder
function projNote(msg){
  const n = document.getElementById("projnote");
  n.textContent = msg;
  n.classList.add("show");
  clearTimeout(projNote.t);
  projNote.t = setTimeout(() => n.classList.remove("show"), 6000);
}
function endDraft(){
  draft = null;
  document.body.classList.remove("choosing");
}
function plusClick(){
  // a live server from before /project and /dirs serves no projects list in
  // /state; the flow would only 404 there, so say what is missing instead
  if (!lastState || !("projects" in lastState)){
    projNote("new projects need the server restart");
    return;
  }
  draft = { screen: "home", from: activeOwner };
  activeOwner = DRAFT;   // never saved: a reload forgets the unfinished tab
  document.body.classList.add("choosing");
  renderHome(lastState);
  renderTabs(lastState);
  apply(lastState);
}
// the landing's panel: every open tab as a plain informational row by its
// display name; no row is a control (the tab bar owns switching), and the
// row of the project already showing reads bold
function renderHome(st){
  if (!draft || draft.screen !== "home" || !st) return;
  const box = document.getElementById("nprows");
  const owners = rowsOf(st);
  const sig = owners.map(ow => ow + labelOf(st, ow) + ((st.pwds || {})[ow] || "")).join(",") + "|" + draft.from;
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  box.textContent = "";
  for (const ow of owners){
    const row = h("div", "nprow" + (ow === draft.from ? " sel" : ""));
    row.appendChild(h("span", "npname", labelOf(st, ow)));
    row.appendChild(h("span", "nppath", (st.pwds || {})[ow] || ""));
    box.appendChild(row);
  }
}
// the start button hands folder choosing to the system: GET /pickdir opens
// the desktop chooser and answers with the chosen path, which then creates
// the lane the same way the old in-page browser did
document.getElementById("npstart").addEventListener("click", async () => {
  if (!draft || draft.picking) return;   // one chooser at a time
  draft.picking = true;
  try {
    const x = await fetch("/pickdir").catch(() => null);
    if (!draft) return;   // the draft was dropped while the chooser sat open
    if (!x){ projNote("could not reach the server"); return; }
    if (x.status === 404){
      // a live server from before the endpoint: only a restart adds it
      projNote("the system picker needs the server restart");
      return;
    }
    const r = await x.json().catch(() => null);
    if (r?.cancelled) return;   // dismissed the chooser: nothing to say
    if (!r?.path){ projNote("could not open the folder picker"); return; }
    const path = r.path.replace(/\/+$/, "") || r.path;
    const name = path.split("/").filter(Boolean).pop() || "project";
    // a folder already behind an open tab: name that tab instead of refusing
    const open = lastState && rowsOf(lastState)
      .find(ow => (lastState.pwds || {})[ow] === path);
    if (open){ projNote("that folder is already open as " + labelOf(lastState, open)); return; }
    const px = await fetch("/project?name=" + encodeURIComponent(name),
        { method: "POST", body: path }).catch(() => null);
    const pr = px ? await px.json().catch(() => null) : null;
    if (!px?.ok || !pr?.id){
      // the server states its refusal; the note repeats it in plain words.
      // a duplicate answer with no visible tab of that name means the id
      // collides with a reserved internal lane: older servers refuse those,
      // so the note must not claim the folder is already open
      let msg = { "body must be a folder under home": "that folder is outside your home folder",
                  "empty name": "that folder has no usable name" }[pr?.error]
              || "could not create that project";
      if (pr?.error === "duplicate project"){
        const named = lastState && rowsOf(lastState).some(ow => labelOf(lastState, ow) === name);
        msg = named ? "a project named " + name + " is already open"
                    : "that name is reserved right now, the folder can be added after the next server restart";
      }
      projNote(msg);
      return;
    }
    endDraft();
    activeOwner = pr.id; localStorage.setItem("activeproj", pr.id);
    await poll();   // the new lane arrives with its tab label and directory
  } finally {
    if (draft) draft.picking = false;
  }
});

// which replies the owner has laid eyes on: box id -> time of the viewing;
// selecting a card counts as reading the reply it shows
const seenReplies = JSON.parse(localStorage.getItem("seenReplies") || "{}");
function markSeen(id){
  seenReplies[id] = Date.now() / 1000;
  localStorage.setItem("seenReplies", JSON.stringify(seenReplies));
}

function select(id, opts){
  if (!els[id]) return;
  cancelAutoNext();
  if (hist && hist.id !== id) histExit(hist.id);   // every card opens on its live reply
  selectedId = id; localStorage.setItem("selbox", id);
  markSeen(id);
  const b = lastState?.boxes.find(x => x.id === id);
  if (b) lastSel[b.owner] = id;
  for (const k of Object.keys(els)){
    els[k].box.classList.toggle("sel", k === id);
    els[k].toc.classList.toggle("t-sel", k === id);
  }
  // the ticket rows re-render on the poll, up to a second later; the selection
  // shadow must move the instant of the click, so flip the class directly,
  // and bring the chosen row into the panel's view in the same breath
  for (const r of document.querySelectorAll("#tiklist .trow")){
    r.classList.toggle("on", r.dataset.id === id);
    if (r.dataset.id === id && r.classList.contains("yours")) r.classList.add("seen");
  }
  document.querySelector("#tiklist .trow.on")?.scrollIntoView({ block: "nearest" });
  if (opts?.focus) els[id].ta.focus({ preventScroll: true });
  updatePwd();
  scrollTo({ top: 0, behavior: "instant" });
}

function updatePwd(st){
  st = st || lastState;
  if (!FOCUS || !st) return;
  // no selection (an empty lane): the active tab's own folder, never the global default
  const owner = st.boxes.find(x => x.id === selectedId)?.owner
             || (activeOwner !== DRAFT ? activeOwner : null);
  const dir = (st.pwds || {})[owner] || st.pwd || "";
  const p = document.getElementById("pwdline");
  if (p.textContent !== dir) p.textContent = dir;
}

// project rows in fixed order: tool meta on top, the rest as the board lists them
function rowsOf(state){
  const owners = [];
  for (const b of state.boxes)
    if (b.owner !== "qchat" && !owners.includes(b.owner)) owners.push(b.owner);   // the quick chat lane never gets a tab
  // stored project lanes keep their tab even with every card deleted
  for (const p of (state.projects || []))
    if (!owners.includes(p.id)) owners.push(p.id);
  owners.sort((a, b) => (a === "facilitator" ? -1 : b === "facilitator" ? 1 : 0));
  // a dragged tab order outlives reloads and server restarts: saved lanes
  // lead in their saved sequence, lanes the array does not know keep the
  // natural order after them, and stale saved ids must never throw
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem("taborder") || "[]"); } catch (err) {}
  if (!Array.isArray(saved)) saved = [];
  const lead = saved.filter(ow => owners.includes(ow));
  return [...lead, ...owners.filter(ow => !lead.includes(ow))];
}

function nav(dx, dy, opts){
  if (!FOCUS || !lastState) return;
  const st = lastState;
  const cur = st.boxes.find(b => b.id === selectedId) || st.boxes[0];
  if (!cur) return;
  if (dy){
    const owners = rowsOf(st);
    const oi = Math.min(Math.max(owners.indexOf(activeOwner) + dy, 0), owners.length - 1);
    if (owners[oi] !== activeOwner) setTab(owners[oi]);
  } else if (dx){
    const pool = poolOf(st);
    if (!pool.length) return;
    const i = pool.findIndex(b => b.id === selectedId);
    const pick = pool[(i + dx + pool.length) % pool.length];
    if (pick) select(pick.id, opts);
  }
}

// keep a valid selection within the active project: fall back when the
// selected box is gone, unset, or belongs to another tab
function applySelection(state){
  if (!FOCUS || !state.boxes.length || draft) return;   // a choosing tab holds no card
  const pool = state.boxes.filter(b => b.owner === activeOwner);
  if (!pool.length){ deselect(); updatePwd(state); return; }   // an empty lane shows plain paper, never another lane's card
  if (!selectedId || !pool.some(b => b.id === selectedId)){
    const pick = pool.find(awaitsYou)
              || pool.find(b => !b.done && !b.parked)
              || pool[0];
    selectedId = pick.id; localStorage.setItem("selbox", selectedId);
  }
  if (hist && hist.id !== selectedId) histExit(hist.id);   // selection moved without select()
  for (const k of Object.keys(els)) els[k].box.classList.toggle("sel", k === selectedId);
  updatePwd(state);
}

function statusOf(b){
  if (b.bucket === "meta") return b.owner === "facilitator" ? "toolmeta" : "triagemeta";
  // the left-tab group comes from the one state too: done -> Done, parked ->
  // Later, everything live -> Now
  const s = cardState(b);
  return s === "done" ? "done" : s === "parked" ? "later" : "now";
}

function h(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// a bare /uploads/... token (a dropped image's home) renders as the image
function imgify(s){
  return s.replace(/(^|[\s>])(\/uploads\/[^\s<]+)/g, (m, pre, addr) => {
    // a trailing . or , closes the sentence, it is not part of the file name,
    // so it stays visible text; a bare /uploads/ names no file and draws
    // nothing, which is what a prose mention of the folder is
    const url = addr.replace(/[.,;:!?)\]"']+$/, "");
    if (url === "/uploads/") return m;
    return pre + '<img class="shot" src="' + url + '">' + addr.slice(url.length);
  });
}

// a bare http(s) address becomes a real link, opening beside the app; the
// same trailing punctuation rule as imgify keeps sentence marks out of it
function linkify(s){
  return s.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g, (m, pre, addr) => {
    const url = addr.replace(/[.,;:!?)\]"']+$/, "");
    return pre + '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>' + addr.slice(url.length);
  });
}

// a block holding only images (two or more) is laid out by the lines it was
// written on: addresses sharing a line share a row, an address alone on its
// line stays its own centered block, so the writer sets the shape. a block
// mixing prose and images keeps the stacked flow
function shotgrid(html){
  const shot = /<img class="shot"[^>]*>/g;
  const all = html.match(shot);
  if (!all || all.length < 2) return "";
  if (html.replace(shot, "").trim()) return "";
  return html.split("\n").map(line => {
    const row = line.match(shot);
    if (!row) return "";
    if (row.length < 2) return row[0];   // alone on its line: already a centered block
    // a span, not a div, keeps the pending list's <p> count right
    return '<span class="shotgrid" data-n="' + Math.min(row.length, 4) + '">' + row.join("") + "</span>";
  }).join("");
}

// light formatting: paragraphs on blank lines, dash/numbered lists, **bold**
function fmt(t){
  // fenced code first: lines between ``` markers become one <pre> kept
  // verbatim, so commands copy out exactly as sent; the prose around a
  // fence runs back through this same formatter untouched
  if (/^```/m.test(t)){
    const segs = [];
    let prose = [], code = [], inCode = false;
    for (const line of t.split("\n")){
      if (/^```/.test(line)){
        if (inCode){ segs.push({ code: true, text: code.join("\n") }); code = []; }
        else { segs.push({ code: false, text: prose.join("\n") }); prose = []; }
        inCode = !inCode;
        continue;
      }
      (inCode ? code : prose).push(line);
    }
    if (code.length) segs.push({ code: true, text: code.join("\n") });
    if (prose.length) segs.push({ code: false, text: prose.join("\n") });
    return segs.map(s => s.code
      ? '<div class="codeblockwrap"><button class="copybtn" title="copy">' + COPY_ICON + '</button><pre class="codeblock"><code>' +
        s.text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") +
        "</code></pre></div>"
      : (s.text.trim() ? fmt(s.text) : "")).join("");
  }
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const bold = linkify(imgify(esc.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")));
  return bold.split(/\n\n+/).map(par => {
    const lines = par.split("\n");
    if (lines.length && lines.every(l => /^&gt; ?/.test(l))){
      // the escape pass has already turned > into &gt; by this point
      return "<blockquote>" + lines.map(l => l.replace(/^&gt; ?/, "")).join("<br>") + "</blockquote>";
    }
    if (lines.length && lines.every(l => /^(- |\d+[.)] )/.test(l))){
      const ol = /^\d/.test(lines[0]);
      // numbered points split by blank lines each become their own list,
      // so carry the source's number or every point renders as "1."
      const start = ol ? parseInt(lines[0], 10) : 1;
      return (ol ? '<ol start="' + start + '">' : "<ul>") +
        lines.map(l => "<li>" + l.replace(/^(- |\d+[.)] )/, "") + "</li>").join("") +
        (ol ? "</ol>" : "</ul>");
    }
    return shotgrid(par) || "<p>" + par.replace(/\n/g, "<br>") + "</p>";
  }).join("");
}

function replyHalves(t){
  const text = t || "";
  const lines = text.split("\n");
  // the separator and the blank lines around it are punctuation for the split,
  // not content, so neither card should show the gap they leave. whole blank
  // lines go and nothing else: trimming the text itself would eat the indent
  // off a first line that is code
  const clip = a => {
    while (a.length && !a[0].trim()) a.shift();
    while (a.length && !a[a.length - 1].trim()) a.pop();
    return a.join("\n");
  };
  // the same ^``` test fmt uses, so the two agree on where a fence starts and
  // ends: a --- inside a fence is part of the thing being shown (yaml
  // frontmatter, a rule in some file), and splitting there would hand fmt an
  // opening ``` with no close and break the code block in both cards
  let inCode = false;
  for (let i = 0; i < lines.length; i++){
    if (/^```/.test(lines[i])){ inCode = !inCode; continue; }
    // only the first separator splits. a later --- is ordinary text and rides
    // along in the normal half, where the reply meant it to sit
    if (!inCode && lines[i].trim() === "---"){
      return { short: clip(lines.slice(0, i)), full: clip(lines.slice(i + 1)) };
    }
  }
  return { short: text, full: text };
}

function build(state){
  const sections = document.getElementById("sections");
  const toc = document.getElementById("toc");
  for (const [key, label] of SECTIONS){
    const group = h("div", "toc-group");
    const bucketRow = h("div", "toc-bucket");
    bucketRow.appendChild(h("span", null, label));
    const metaOwner = METAS.find(([k]) => k === key)?.[1];
    if (metaOwner){   // the plus lives in the left bar: the page shows one box at a time
      const plus = h("button", "tocadd", "＋");
      plus.title = "new box";
      plus.addEventListener("click", async () => {
        const r = await fetch("/create?owner=" + metaOwner, { method: "POST" }).then(x => x.json()).catch(() => null);
        if (r?.id) localStorage.setItem("focusbox", r.id);
        poll();
      });
      bucketRow.appendChild(plus);
    }
    group.appendChild(bucketRow);
    toc.appendChild(group);
    tocGroups[key] = group;

    const shead = h("div", "bucket " + key);
    shead.appendChild(h("h2", null, label));
    shead.appendChild(h("span", "rule"));
    const cnt = h("span", "tag", "");
    shead.appendChild(cnt);
    sections.appendChild(shead);
    const list = h("div");
    sections.appendChild(list);
    secEls[key] = { list, cnt };
  }

  state.boxes.forEach((b, i) => makeBox(b, i, state));
  addRows();
  landFocus();
}

// one box + its outline entry, inserted at its position within its section
function makeBox(b, i, state){
    const entry = h("div", "toc-entry");
    entry.appendChild(h("span", "tage"));
    entry.appendChild(h("span", "tnum", (b.id === "0" || b.id === "t0") ? "•" : b.id));
    entry.appendChild(h("span", "tdot"));
    entry.appendChild(h("span", "ttitle", b.title));
    entry.addEventListener("click", () => {
      if (FOCUS) select(b.id);
      else document.getElementById("box-" + b.id)?.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    const box = h("article", "box" + (b.bucket === "meta" ? " metabox" : ""));
    box.style.animationDelay = (i * 22) + "ms";
    box.id = "box-" + b.id;

    const head = h("div", "head");
    // the remove cross now renders on every card, not just meta boxes, so all cards share one design
    const x = h("button", "xbtn", "×");
    x.title = "done (an empty card is removed instead)";
    x.addEventListener("click", async e => {
      e.stopPropagation();
      // a card with content closes to the done tab and stays retrievable; only an empty card is removed
      const hasContent = b.replies > 0 || (b.reply && b.reply.trim()) || b.pending > 0;
      const ep = hasContent ? ("/done?box=" + encodeURIComponent(b.id) + "&v=1") : ("/delete?box=" + encodeURIComponent(b.id));
      await fetch(ep, { method: "POST" }).catch(() => {});
      // dismiss this card from the center and jump to the next ongoing chat, so no extra click is needed
      const doing = poolOf(lastState).filter(o => !o.done && !o.parked && o.id !== b.id && o.id !== "0" && o.id !== "t0");
      if (doing.length) select(doing[0].id); else deselect();
      poll();
    });
    head.appendChild(x);
    head.appendChild(h("span", "num", b.id));
    const titleEl = h("span", "title", b.title);
    titleEl.tabIndex = 0;
    // clicking or tabbing into the title starts an inline rename
    titleEl.addEventListener("mousedown", () => editTitle(b.id, { fromClick: true }));
    titleEl.addEventListener("focus", () => { if (!titleEl.isContentEditable) editTitle(b.id); });
    head.appendChild(titleEl);
    const wstat = h("span", "wstat");
    head.appendChild(wstat);
    // orange archive button: defers the card into the deferred tab (parks it)
    const arc = h("button", "arcbtn");
    arc.title = "defer to the deferred tab";
    arc.innerHTML = '<svg viewBox="0 0 24 24" width="9" height="9" fill="currentColor" stroke="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
    arc.addEventListener("click", e => { e.stopPropagation(); toggleFlag(b.id, "park"); });
    head.appendChild(arc);
    box.appendChild(head);


    const body = h("div", "body");
    const reply = h("div", "reply");
    reply.dataset.raw = b.reply;
    // the large card shows the normal half; raw stays the whole reply so the
    // changed check and the history compare still see every edit
    reply.innerHTML = fmt(replyHalves(b.reply).full);
    const meta = h("div", "meta");
    // transient notes (send failures) get their own span
    const metaNote = h("span");
    // the visible reply-history stepper (arrows + position marker) was removed;
    // these off-screen nodes stay only so histStep/histExit keep writing their
    // state harmlessly. control+shift+up/down drives the history now.
    const histUp = h("button");
    const histPos = h("span");
    const histDown = h("button");
    meta.append(metaNote);
    const pend = h("div", "pendlist");   // sent-and-waiting bar; a click unfolds the list
    pend.addEventListener("click", () => pend.classList.toggle("open"));
    const compose = h("div", "compose");
    const ta = h("textarea");
    ta.rows = 1;
    const send = h("button", "sendbtn", "Send");
    compose.append(ta, send);
    body.append(reply, meta, pend, compose);
    box.appendChild(body);

    const sec = statusOf(b);
    // slot in where the state array says this box belongs; during the initial
    // build the next box does not exist yet, so this appends in order
    const peers = state.boxes.filter(x => statusOf(x) === sec);
    const nextB = peers[peers.findIndex(x => x.id === b.id) + 1];
    const nextEl = nextB && els[nextB.id];
    if (nextEl && nextEl.box.parentNode === secEls[sec].list){
      secEls[sec].list.insertBefore(box, nextEl.box);
      tocGroups[sec].insertBefore(entry, nextEl.toc);
    } else {
      const addRow = secEls[sec].list.querySelector(":scope > .addrow");
      if (addRow) secEls[sec].list.insertBefore(box, addRow);
      else secEls[sec].list.appendChild(box);
      tocGroups[sec].appendChild(entry);
    }

    ta.addEventListener("input", () => { cancelAutoNext(); ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; });   // CSS max-height caps it
    // dropped images upload immediately; their /uploads/ address joins the text
    ta.addEventListener("dragover", e => { e.preventDefault(); ta.classList.add("dropping"); });
    ta.addEventListener("dragleave", () => ta.classList.remove("dropping"));
    ta.addEventListener("drop", async e => {
      e.preventDefault(); ta.classList.remove("dropping");
      const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith("image/"));
      for (const f of files){
        const r = await fetch("/upload?name=" + encodeURIComponent(f.name), { method: "POST", body: f })
          .then(x => x.json()).catch(() => null);
        if (r?.url) ta.value = (ta.value ? ta.value.trimEnd() + "\n" : "") + r.url + "\n";
      }
      ta.dispatchEvent(new Event("input"));
    });
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); doSend(b.id); } });
    send.addEventListener("click", () => doSend(b.id));
    head.addEventListener("click", () => {
      if (box.classList.contains("done") || box.classList.contains("waiting") || box.classList.contains("parked"))
        box.classList.toggle("peek");
    });

    els[b.id] = { box, reply, meta, metaNote, histPos, histUp, histDown,
                  pend, ta, send, wstat, toc: entry, sec,
                  titleEl, tocTitle: entry.querySelector(".ttitle"), arc, x };

    // explicit focus ring: title -> text -> Send -> cross -> moon -> (wrap)
    const ring = [titleEl, ta, send, x, arc];
    for (const node of [ta, send, x, arc]){
      node.addEventListener("keydown", e => {
        if (e.key === "Tab"){
          e.preventDefault();
          const idx = ring.indexOf(node);
          const next = (idx + (e.shiftKey ? -1 : 1) + ring.length) % ring.length;
          ring[next].focus();
        }
      });
    }
}

// "+" row under each meta section: one click = new box owned by that section,
// its first message names it
function addRows(){
  for (const [key, owner] of METAS){
    const addRow = h("div", "addrow");
    const addBtn = h("button", "addbtn", "＋ new box");
    addBtn.addEventListener("click", async () => {
      const r = await fetch("/create?owner=" + owner, { method: "POST" }).then(x => x.json()).catch(() => null);
      if (r?.id) localStorage.setItem("focusbox", r.id);  // survive the rebuild reload
      poll();  // unknown id triggers the rebuild
    });
    addRow.appendChild(addBtn);
    secEls[key].list.appendChild(addRow);
  }

}

// land the cursor in a box the user just created
function landFocus(){
  const fb = localStorage.getItem("focusbox");
  if (fb && els[fb]){
    localStorage.removeItem("focusbox");
    if (FOCUS) select(fb);
    else els[fb].box.scrollIntoView({ block: "center" });
    editTitle(fb);
  }
}

// a just-created card: the cursor starts in the title; Enter saves the name
// and drops the cursor into the message input
function editTitle(id, opts){
  opts = opts || {};
  const el = els[id]; if (!el) return;
  const t = el.titleEl, old = t.textContent;
  t.setAttribute("contenteditable", "plaintext-only");
  if (old === "…") t.textContent = "";
  // a click edits in place with the caret where you click; other entries (new card, tab) focus and select all
  if (!opts.fromClick){
    t.focus();
    if (t.textContent){
      const range = document.createRange();
      range.selectNodeContents(t);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    }
  }
  const end = () => { t.removeAttribute("contenteditable"); t.onkeydown = null; t.onblur = null; };
  const commit = () => {
    const name = t.textContent.trim();
    end();
    if (name && name !== old){
      t.textContent = name;
      if (el.tocTitle) el.tocTitle.textContent = name;
      fetch("/title?box=" + encodeURIComponent(id), { method: "POST", body: name })
        .then(() => poll()).catch(() => {});
    } else if (!name && !old){
      // naming walked away from: the server hands out a whimsical name
      fetch("/title?box=" + encodeURIComponent(id), { method: "POST" })
        .then(() => poll()).catch(() => {});
    } else t.textContent = old;
  };
  t.onkeydown = e => {
    e.stopPropagation();   // card-switching keys must not fire while naming
    if (e.key === "Enter"){ e.preventDefault(); commit(); el.ta.focus(); }
    else if (e.key === "Tab"){ e.preventDefault(); commit(); (e.shiftKey ? el.arc : el.ta).focus(); }
    else if (e.key === "Escape"){
      if (!old && !t.textContent.trim()) commit();
      else { end(); t.textContent = old; }
      el.ta.focus();
    }
  };
  t.onblur = () => { if (t.isContentEditable) commit(); };
}

// after a send, three quiet seconds moves you on; any typing or a manual
// card switch cancels the jump
let autoNext = null;
const AUTONEXT_MS = 0;   // future user setting: quiet time after a send before moving on
let lastLeftId = null;   // the card the last auto-jump left, for command+z bounce
function cancelAutoNext(){ clearTimeout(autoNext); autoNext = null; }

// after a send, move to the next YELLOW card: one awaiting his read, never a
// green working card or a grey queued one
function jumpNextYellow(fromId){
  if (!lastState) return;
  // stay inside the tab being looked at: sending from doing must never land on
  // a deferred or done card
  const p = viewPool(lastState).filter(b =>
    !b.done && !(b.writing || b.bg) && b.ball === "you" && b.id !== fromId);
  if (!p.length) return;
  lastLeftId = fromId;
  select(p[0].id, { focus: true });
}

// the stamp on a sent-and-waiting message: a short clock time, plus a plain
// month-and-day date in front only when the send was not today; empty when
// the send time is unknown (entries queued before the server recorded times)
function stampText(ts){
  if (!ts) return "";
  const d = new Date(ts * 1000);
  if (isNaN(d.getTime())) return "";
  const hr = d.getHours();
  const clock = (hr % 12 || 12) + ":" + String(d.getMinutes()).padStart(2, "0") + " " + (hr < 12 ? "AM" : "PM");
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return clock;
  const day = MONTHS3[d.getMonth()] + " " + d.getDate() + (d.getFullYear() === now.getFullYear() ? "" : " " + d.getFullYear());
  return day + ", " + clock;
}

function stampHTML(ts){
  const s = stampText(ts);   // digits, letters and punctuation only; nothing to escape
  return s ? '<span class="stamp">' + s + "</span>" : "";
}

// writing to a done card takes it back to doing, on both send paths. The flag
// is read before the send and flipped after the message is in, so a flip that
// fails can never eat the message; done only, a parked card stays parked
function boxDone(id){
  const b = lastState && lastState.boxes.find(x => x.id === id);
  return !!(b && b.done);
}

function undone(id){
  fetch("/done?box=" + encodeURIComponent(id) + "&v=0", { method: "POST" })
    .then(() => poll()).catch(() => {});
}

async function doSend(id){
  const el = els[id];
  const text = el.ta.value.trim();
  if (!text) return;
  const reopen = boxDone(id);   // before the send; the poll below clears the flag
  el.send.disabled = true;
  try {
    const r = await fetch("/send?box=" + encodeURIComponent(id), { method: "POST", body: text });
    if (!r.ok) throw new Error(r.status);
    el.ta.value = ""; el.ta.style.height = "auto";   // clear only after the server has it
    // count it into the bar immediately, and pre-mark the list as current so
    // the next poll's redraw brings nothing it does not already hold
    el.pend.dataset.raw = el.pend.dataset.raw ? el.pend.dataset.raw + "\n\n" + text : text;
    const bub = document.createElement("p");
    const st = document.createElement("span");
    st.className = "stamp";
    st.textContent = stampText(Date.now() / 1000);   // client clock; the poll's server time takes over
    bub.append(st, text);
    el.pend.appendChild(bub);
    el.pend.dataset.label = "Sent messages (" + el.pend.children.length + ")";
    if (hist && hist.id === id) histExit(id);   // a send lands you back on the live reply
    if (reopen) undone(id);   // the message is in; the flip rides behind it
    poll();
    cancelAutoNext();
    autoNext = setTimeout(() => { autoNext = null; if (FOCUS) jumpNextYellow(id); }, AUTONEXT_MS);
  } catch (err) {
    el.metaNote.textContent = "send failed, text kept — try again";
  } finally {
    el.send.disabled = false;
  }
}

async function toggleFlag(id, kind){
  const cls = kind === "done" ? "done" : "parked";
  const on = els[id].box.classList.contains(cls);
  els[id].box.classList.remove("peek");
  await fetch("/" + kind + "?box=" + encodeURIComponent(id) + "&v=" + (on ? 0 : 1), { method: "POST" }).catch(() => {});
  poll();
}

// ---- older replies --------------------------------------------------------
// control shift up steps the selected card back through its past agent
// replies, control shift down returns toward live; the small arrows in the
// grey row under the reply click the same steps. While an older reply shows,
// dataset.raw keeps holding the live text, so apply()'s rewrite guard leaves
// the view alone across polls; an actual new reply changes the raw, which
// drops the cached thread and snaps the card back to live.
const histCache = {};   // box id -> promise of past agent replies, oldest first, live excluded
let hist = null;        // {id, step} while an older reply shows; step 1 = one back from live

function histList(id){
  if (!histCache[id]){
    histCache[id] = fetch("/thread?box=" + encodeURIComponent(id) + "&n=200")
      .then(x => x.json())
      .then(r => {
        const list = (r.messages || []).filter(m => m.kind === "agent").map(m => m.text);
        // the newest transcript entry is normally the live reply itself
        if (list.length && els[id] && list[list.length - 1] === els[id].reply.dataset.raw) list.pop();
        return list;
      })
      .catch(() => { delete histCache[id]; return []; });
  }
  return histCache[id];
}

function histExit(id){
  const was = hist && hist.id === id;
  if (was) hist = null;
  const el = els[id];
  if (!el) return;
  el.box.classList.remove("histview");
  el.histPos.textContent = "";
  el.histUp.disabled = false;
  el.histDown.disabled = true;
  if (was){
    el.reply.innerHTML = fmt(replyHalves(el.reply.dataset.raw).full);
    el.reply.scrollTop = 0;
  }
}

async function histStep(dir){   // +1 steps older, -1 steps back toward live
  if (!FOCUS || !selectedId || !els[selectedId]) return;
  const id = selectedId;
  const list = await histList(id);
  if (id !== selectedId || !els[id] || !list.length) return;   // card changed or nothing older
  const cur = hist && hist.id === id ? hist.step : 0;
  const step = Math.min(Math.max(cur + dir, 0), list.length);
  if (step === cur) return;
  if (!step){ histExit(id); return; }
  hist = { id, step };
  const el = els[id];
  el.reply.innerHTML = fmt(list[list.length - step]);
  el.reply.scrollTop = 0;
  el.box.classList.add("histview");
  el.histPos.textContent = (list.length - step + 1) + " of " + (list.length + 1);
  el.histUp.disabled = step >= list.length;
  el.histDown.disabled = false;
}

function apply(state){
  for (const id of Object.keys(els)){    // deleted boxes leave the page
    if (!state.boxes.some(b => b.id === id)){
      if (hist && hist.id === id) hist = null;
      delete histCache[id];
      els[id].box.remove(); els[id].toc.remove(); delete els[id];
    }
  }
  // a selection carried over from another lane (a reload into an empty lane,
  // or the selected card's lane changing) never renders on this tab
  if (FOCUS && selectedId && activeOwner !== DRAFT){
    const sb = state.boxes.find(x => x.id === selectedId);
    if (!sb || sb.owner !== activeOwner) deselect();
  }

  // scroll anchor: whatever you're typing in (else the box under the viewport
  // center — what you're reading) must not move when boxes above fold/expand.
  // Focus mode shows one box, so there is nothing to anchor against.
  let anchorEl = null, anchorTop = 0;
  if (!FOCUS){
    const focusEl = document.activeElement && document.activeElement.tagName === "TEXTAREA" ? document.activeElement : null;
    anchorEl = focusEl ? focusEl.closest(".box") : null;
    if (!anchorEl) anchorEl = document.elementFromPoint(innerWidth / 2, innerHeight / 2)?.closest(".box") || null;
    if (!anchorEl) anchorEl = [...document.querySelectorAll(".box")].find(x => x.getBoundingClientRect().bottom > 60);
    anchorTop = anchorEl ? anchorEl.getBoundingClientRect().top : 0;
  }

  // new boxes appear in place (no reload, no white flash); the anchor
  // correction below absorbs any shift they cause above the viewport
  for (const b of state.boxes){
    if (!els[b.id]){
      makeBox(b, 0, state);
      landFocus();
    }
  }

  for (const b of state.boxes){
    const el = els[b.id];
    if (!el) continue;
    if (el.reply.dataset.raw !== b.reply){
      el.reply.dataset.raw = b.reply;
      delete histCache[b.id];   // a fresh reply outdates the cached thread
      if (hist && hist.id === b.id) histExit(b.id);   // and snaps a history view back to live
      else el.reply.innerHTML = fmt(replyHalves(b.reply).full);
    }
    if (!el.titleEl.isContentEditable && el.titleEl.textContent !== b.title){   // first message just named a new box
      el.titleEl.textContent = b.title;
      el.tocTitle.textContent = b.title;
    }
    const pt = (b.pendingTexts || []).join("\n\n");
    if (el.pend.dataset.raw !== pt){
      el.pend.dataset.raw = pt;
      const stamps = b.pendingStamps || [];   // absent from a pre-stamp server: every send unstamped
      el.pend.innerHTML = (b.pendingTexts || [])
        .map((t, i) => {
          const body = linkify(imgify(t.replace(/&/g, "&amp;").replace(/</g, "&lt;")));
          return "<p>" + stampHTML(stamps[i]) + (shotgrid(body) || body) + "</p>";
        }).join("");
      el.pend.dataset.label = "Sent messages (" + el.pend.children.length + ")";
      if (!el.pend.children.length) el.pend.classList.remove("open");   // answered: nothing left to show
    }
    const cs = cardState(b);   // one state: box color, left tab, and toc all read it
    el.box.classList.toggle("done", cs === "done");
    el.box.classList.toggle("parked", cs === "parked");
    const s = statusOf(b);
    if (el.sec !== s){
      secEls[s].list.appendChild(el.box);
      tocGroups[s].appendChild(el.toc);
      el.sec = s;
    }
    // waiting is the box's own liveness overlay: writing is the live claim
    // (bg alone never collapses the box) and pending is the unread count,
    // neither of which the collapsed state carries; the done gate reads state
    const waiting = cs !== "done" && (b.writing || b.pending > 0);
    el.box.classList.toggle("waiting", waiting);
    if (!waiting && cs !== "done") el.box.classList.remove("peek");
    const ws = b.writing ? '<span class="w2">' + laneName(b.owner) + ' is writing</span>'
             : (b.queuePos ? "sent ✓ " + ord(b.queuePos) + " in line" : "");
    if (el.wstat.innerHTML !== ws) el.wstat.innerHTML = ws;  // rewriting every poll restarts the dots and re-wraps the title row
    // the queue chatter (sent, nth in line, messages since) is gone on the
    // owner's order; the element still carries transient send-failure notes
    if (el.metaNote.textContent && el.metaNote.textContent.indexOf("send failed") !== 0) el.metaNote.textContent = "";
    if (el.toc){
      // quirk kept: pending queues the entry even when the ball sits with you;
      // otherwise yours (or a new card whose ball is with you) paints t-you,
      // all off the one state
      el.toc.className = "toc-entry " + (
        cs === "done" ? "t-done" : cs === "parked" ? "t-later" : cs === "working" ? "t-writing" : b.pending > 0 ? "t-queued" :
        (cs === "yours" || (cs === "new" && b.ball === "you")) ? "t-you" : "") + (FOCUS && b.id === selectedId ? " t-sel" : "");
      el.toc.style.display = (FOCUS && b.owner !== activeOwner) ? "none" : "";
      el.toc.querySelector(".tage").textContent = age(b.ts);
    }
  }
  if (anchorEl){
    const delta = anchorEl.getBoundingClientRect().top - anchorTop;
    // behavior:"instant" — the page's smooth scroll-behavior would animate the
    // correction into a visible glide, which IS the shift we're preventing
    if (delta) window.scrollBy({ top: delta, left: 0, behavior: "instant" });
  }
  applySelection(state);
  document.body.classList.toggle("paused", !!state.paused);
  // board title comes from state (seeded via seed.json), not from the page
  if (state.title && document.title !== state.title){
    document.title = state.title;
    const nm = document.getElementById("boardname");
    const sp = state.title.indexOf(" ");
    nm.textContent = "";
    if (sp > 0){
      nm.append(state.title.slice(0, sp) + " ");
      const em = document.createElement("em");
      em.textContent = state.title.slice(sp + 1);
      nm.append(em);
    } else nm.textContent = state.title;
  }
  // the per-section counts still speak for the active tab only
  const scope = FOCUS ? state.boxes.filter(x => x.owner === activeOwner) : state.boxes;
  for (const [key] of SECTIONS){
    secEls[key].cnt.textContent = scope.filter(x => statusOf(x) === key).length;
    const visible = [...tocGroups[key].children]
      .filter(c => c.classList.contains("toc-entry") && c.style.display !== "none").length;
    tocGroups[key].style.display = visible ? "" : "none";
  }
  renderTabs(state);
  if (draft && draft.screen === "home") renderHome(state);   // new lanes join the landing card live
  if (FOCUS){
    renderWorkspaces(state);
    renderTrio(state);
    renderCarousel(state);
    renderMiniCards(state);
  }
  document.body.classList.toggle("ended", !!state.end);

  // listener presence, per agent: each is either long-polling (listening),
  // composing a claimed reply (busy), or recently between the two. Otherwise: offline.
  const offOwners = state.paused ? [] : Object.keys(state.listening || NAME).filter(ow =>
    (state.everListened || {})[ow] &&
    !state.listening[ow] && !state.busy[ow] && state.listenerGap[ow] > 300);
  document.body.classList.toggle("offline", offOwners.length > 0);
  if (offOwners.length){
    document.getElementById("offline").textContent =
      "Offline: " + offOwners.map(ow => laneName(ow) + " (last heard " +
      Math.round(state.listenerGap[ow] / 60) + " min ago)").join(", ") +
      ". Messages still queue safely; replies resume when that terminal side wakes.";
    // the bar's own status line went with the strip; the banner below says it
  }
}

// ---- the clock: day, time, date, plain text, upper left -------------------
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
const MONTHS3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function tickClock(){
  const n = new Date();
  let hr = n.getHours();
  const ap = hr >= 12 ? "PM" : "AM";
  hr = hr % 12 || 12;
  const day = DAYS[n.getDay()];
  const time = hr + ":" + String(n.getMinutes()).padStart(2, "0") + ":" +
               String(n.getSeconds()).padStart(2, "0") + " " + ap;
  const date = MONTHS[n.getMonth()] + " " + ord(n.getDate());
  document.getElementById("ck-day").textContent = day;
  document.getElementById("ck-time").textContent = time;
  document.getElementById("ck-date").textContent = date;
}

// ---- workspaces and the trio (rail / goal box / task box) -----------------
// One class of element: all three render from the same workspace record and
// post to the same endpoints the agent uses.
let selectedWs = null;    // workspace within the active project
let selectedTask = null;  // task picked by clicking its dot
let ticketView = "todo";  // left panel tab: to-do | done
let taskFilter = null;    // when set, the carousel shows that task's chats

function curWs(state){
  const list = (state.workspaces || {})[activeOwner] || [];
  return list.find(w => w.id === selectedWs) || list[0] || null;
}

async function api(path, body){
  try { await fetch(path, { method: "POST", body: body || "" }); } catch (e) {}
  poll();
}

function renderWorkspaces(state){
  const el = document.getElementById("wslist");
  const list = (state.workspaces || {})[activeOwner] || [];
  const cur = curWs(state);
  const sig = activeOwner + "|" + list.map(w => w.id + w.name).join(",") + "|" + (cur && cur.id);
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  el.textContent = "";
  for (const w of list){
    const r = h("div", "wsrow" + (cur && w.id === cur.id ? " on" : ""), w.name);
    r.addEventListener("click", () => { selectedWs = w.id; selectedTask = taskFilter = null; apply(lastState); });
    el.appendChild(r);
  }
}

function fmtStart(ts){
  if (!ts) return "";
  const d = new Date(ts * 1000);
  return MONTHS3[d.getMonth()] + " " + ord(d.getDate());
}

function taskOf(w, tid){ return w ? w.tasks.find(t => t.id === tid) : null; }

function selectTask(tid){
  selectedTask = selectedTask === tid ? null : tid;
  taskFilter = null;   // selection highlights chats now, never filters them
  if (lastState) apply(lastState);
}

function renderTrio(state){
  const w = curWs(state);
  const dots = document.getElementById("rail-dots");
  const start = document.getElementById("rail-start");
  const goalT = document.getElementById("goaltext");
  const taskT = document.getElementById("tasktext");
  start.textContent = w ? fmtStart(w.started) : "";
  goalT.dataset.empty = "goal";
  taskT.dataset.empty = "current task";
  if (!goalT.querySelector("input")) goalT.textContent = (w && w.goal) || "";
  const shown = w && (taskOf(w, selectedTask) || taskOf(w, w.current));
  if (!taskT.querySelector("input")) taskT.textContent = shown ? shown.text : "";
  const sig = w ? w.id + "|" + w.tasks.map(t => t.id + t.status).join(",") + "|" + selectedTask : "";
  if (dots.dataset.sig === sig) return;
  dots.dataset.sig = sig;
  dots.textContent = "";
  if (!w) return;
  for (const t of w.tasks){
    const d = h("span", "dotk " + t.status + (t.id === selectedTask ? " sel" : ""));
    d.title = t.text || "(unnamed task)";
    d.addEventListener("click", () => selectTask(t.id));
    dots.appendChild(d);
  }
  const line = document.getElementById("rail-line");
  line.querySelector(".dotk.goal")?.remove();
  const g = h("span", "dotk goal");
  g.title = (w.goal || "the goal") + " (the reason this workspace exists)";
  g.addEventListener("mouseenter", () => document.getElementById("goalbox").classList.add("lit"));
  g.addEventListener("mouseleave", () => document.getElementById("goalbox").classList.remove("lit"));
  line.appendChild(g);
  document.getElementById("taskchip").textContent = "";
}

// inline edit for the trio's texts: swap the span for an input; Enter saves
function inlineEdit(spanEl, initial, onSave){
  if (spanEl.querySelector("input")) return;
  spanEl.textContent = "";
  const inp = document.createElement("input");
  inp.value = initial || "";
  spanEl.appendChild(inp);
  inp.focus();
  inp.select();
  const finish = save => {
    const v = inp.value.trim();
    spanEl.textContent = initial || "";
    if (save) onSave(v);
  };
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter"){ e.preventDefault(); finish(true); }
    if (e.key === "Escape") finish(false);
    e.stopPropagation();
  });
  inp.addEventListener("blur", () => finish(false));
}

// ---- card state: the single home of state decisions -----------------------
// one name per card: done, parked, working, new, yours, queued. consumers
// map the name to their own classes, group numbers, and colors; the two
// helpers under it keep old per-site quirks exactly as they were.
// magic box 1: a Spotify player on the same liquid glass the pastureland down
// button uses. signs in with the flow Spotify calls PKCE, which needs no
// secret, so the id below is public by design and the token never leaves this
// browser.
// real card has; the grey summary strip is deliberately left out
const miniEls = {};
// the card it sits on is kept across reloads, per project tab, so a reload does
// not always drop you back on the first card of the list. the open tab is
// stored under "activeproj", so this follows that naming with the lane on the end
const miniKey = () => "minibox." + activeOwner;
let miniId = localStorage.getItem(miniKey()) || null;   // the one card magic box 2 is showing
let miniOrder = [];       // the cards it can walk through, board order
let miniFocused = false;  // clicked into: the arrows and command T are ours

// every move through the small card is written down, so the next load starts
// where this one left off. a remembered card that has gone, been closed or been
// deferred is simply not in miniOrder any more, and the fallback in the render
// writes the first card over it
function miniGo(id){
  miniId = id;
  if (id) localStorage.setItem(miniKey(), id);
  else localStorage.removeItem(miniKey());
}

function miniStep(dir, opts){
  opts = opts || {};
  if (!miniOrder.length) return;
  const at = miniOrder.indexOf(miniId);
  miniGo(miniOrder[((at < 0 ? 0 : at) + dir + miniOrder.length) % miniOrder.length]);
  if (lastState) renderMiniCards(lastState);
  // the card being left is hidden by the render above, and hiding the box the
  // caret sits in drops the caret on the page body. the large card's pair
  // leaves you typing in the card you arrive at, so put it back by hand. after
  // the render, because the render is what moves and hides the boxes
  if (opts.focus) miniEls[miniId]?.ta?.focus();
}
let miniEditPending = null;   // name the card as soon as it has been drawn
async function miniCreate(){
  const r = await fetch("/create?owner=facilitator", { method: "POST" })
    .then(x => x.json()).catch(() => null);
  if (r?.id){ miniGo(r.id); miniEditPending = r.id; }
  poll();
}
// renaming in place, the same shape as the large card's: a click edits where you
// click, arriving any other way selects the whole name, Enter drops into the
// message field, Escape puts the old name back, and leaving it commits
function miniEditTitle(id, opts){
  opts = opts || {};
  const el = miniEls[id]; if (!el) return;
  const t = el.title, old = t.textContent;
  t.setAttribute("contenteditable", "plaintext-only");
  if (old === "\u2026") t.textContent = "";
  if (!opts.fromClick){
    t.focus();
    if (t.textContent){
      const range = document.createRange();
      range.selectNodeContents(t);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    }
  }
  const end = () => { t.removeAttribute("contenteditable"); t.onkeydown = null; t.onblur = null; };
  const commit = () => {
    const name = t.textContent.trim();
    end();
    if (name && name !== old){
      t.textContent = name;
      fetch("/title?box=" + encodeURIComponent(id), { method: "POST", body: name })
        .then(() => poll()).catch(() => {});
    } else if (!name && !old){
      fetch("/title?box=" + encodeURIComponent(id), { method: "POST" })
        .then(() => poll()).catch(() => {});
    } else t.textContent = old;
  };
  t.onkeydown = e => {
    e.stopPropagation();   // the card-walking keys must not fire while naming
    if (e.key === "Enter"){ e.preventDefault(); commit(); el.ta?.focus(); }
    else if (e.key === "Escape"){
      if (!old && !t.textContent.trim()) commit();
      else { end(); t.textContent = old; }
      el.ta?.focus();
    }
  };
  t.onblur = () => { if (t.isContentEditable) commit(); };
}

  if (miniEditPending && miniEls[miniEditPending] && miniEditPending === miniId){
    const id = miniEditPending;
    miniEditPending = null;
    miniEditTitle(id);
  }
}

function cardState(b){
  // the server now computes one authoritative state per card; the inline
  // version stays only as a fallback for an older server that omits it
  const s = b.state || (
         b.done ? "done"
       : b.parked ? "parked"
       : (b.writing || b.bg) ? "working"
       // a card with prior replies was answered before, so it is never new even when a seeded board left its agent stamp at 0
       : (!b.agentTs && !b.pending && !b.replies) ? "new"
       : b.ball === "you" ? "yours"
       : "queued");
  // a message of his still sitting in the queue is waiting on the agent, not
  // on him, so the card rests grey. an older reply can leave the ball on his
  // side while a newer message is still in line, and that used to paint the
  // card yellow. only yours is rewritten, so done, parked and every green
  // state keep exactly the state they had
  return (s === "yours" && b.pending > 0) ? "queued" : s;
}
// the queue panel's view: a parked card sorts and colors as if open. state is
// nulled in the copy so cardState recomputes from the flags instead of handing
// back the server's "parked" when we peel the park off
function queueState(b){ return b.parked ? cardState({ ...b, parked: false, state: null }) : cardState(b); }
// the strict await of the bar count and auto-select: pending vetoes it, and
// so does work in flight, claimed or registered; green outranks the ball
function awaitsYou(b){
  const s = cardState(b);
  // done/parked and work-in-flight are all folded into the state; a still-new
  // card only awaits you when the ball sits with you, and pending vetoes the
  // strict await either way
  return (s === "yours" || (s === "new" && b.ball === "you")) && !(b.pending > 0);
}

// ---- the carousel: the workspace's other chats as a queue -----------------
// Front: chats the agent has addressed (yellow), newest first. Back: chats
// answered and waiting on the agent (green), the just-answered one last.
// the doing, deferred and done tabs are a filter over that same pool. the left
// list and the arrow keys have to walk the same set, or the arrows cycle into
// cards the list is not showing
function viewFilter(b){
  const s = cardState(b);
  return ticketView === "done" ? s === "done"
       : ticketView === "deferred" ? s === "parked"
       : (s !== "done" && s !== "parked");
}
function viewPool(state){ return poolOf(state).filter(viewFilter); }

function poolOf(state){
  const w = curWs(state);
  return state.boxes.filter(b =>
    b.owner === activeOwner && b.id !== "q" && (!w || b.ws === w.id))
    .sort((a, b) => {
      // an untouched new card stays on top; the first send drops it into the
      // waiting group; anything green (in progress) sinks below all of that
      const g = x => ({ "new": 0, yours: 1, queued: 2, working: 3, done: 4 })[queueState(x)];
      if (g(a) !== g(b)) return g(a) - g(b);
      if (g(a) === 0) return (b.ts || 0) - (a.ts || 0);   // newest created on top
      if (g(a) === 1) return (b.agentTs || 0) - (a.agentTs || 0);   // newest reply on top: latest cards come to the top. it was oldest first for a day so a batch came back in send order, which was not wanted
      return (b.ts || 0) - (a.ts || 0);                    // waiting, working and done: newest first
    });
}

function carouselRow(state){
  const w = curWs(state);
  const pool = poolOf(state);
  pool = pool.filter(b => b.id !== selectedId);
  const you = pool.filter(b => !b.done && b.ball === "you")
    .sort((a, b) => (b.agentTs || 0) - (a.agentTs || 0));
  const wait = pool.filter(b => !b.done && b.ball !== "you")
    .sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const done = pool.filter(b => b.done);
  return [...you, ...wait, ...done];
}

function relAge(ts){
  if (!ts) return "no reply yet";
  const sec = Date.now() / 1000 - ts;
  if (sec < 60) return "replied just now";
  if (sec < 3600) return "replied " + Math.floor(sec / 60) + "m ago";
  if (sec < 86400) return "replied " + Math.floor(sec / 3600) + "h ago";
  return "replied " + Math.floor(sec / 86400) + "d ago";
}

function shortAge(ts){
  if (!ts) return "";
  const sec = Date.now() / 1000 - ts;
  if (sec < 60) return "now";
  if (sec < 3600) return Math.floor(sec / 60) + "m";
  if (sec < 86400) return Math.floor(sec / 3600) + "h";
  return Math.floor(sec / 86400) + "d";
}
// while a row works its age is noise; the slot carries a terminal spinner
// instead, the ten braille frames at 100ms a step. one interval serves every
// green row and only lives while one exists; each rebuild stamps the current
// frame itself (see the tage line below), so the ticker and the poll-driven
// re-renders never fight over the text. ages return on the next quiet poll.
const SPIN_FRAMES = ["|","/","-","\\"];   // the classic terminal spinner, bolder than braille dots
let spinFrame = 0, spinTimer = null;
function syncSpinner(){
  const has = document.querySelector("#tiklist .trow.working");
  if (has && spinTimer == null){
    spinTimer = setInterval(() => {
      const ages = document.querySelectorAll("#tiklist .trow.working .tage");
      if (!ages.length){ clearInterval(spinTimer); spinTimer = null; return; }
      spinFrame = (spinFrame + 1) % SPIN_FRAMES.length;
      for (const a of ages) a.textContent = SPIN_FRAMES[spinFrame];
    }, 180);
  } else if (!has && spinTimer != null){
    clearInterval(spinTimer); spinTimer = null;
  }
}
function renderCarousel(state){
  const tik = document.getElementById("tiklist");
  const chips = document.getElementById("chips");
  const w = curWs(state);
  const all = poolOf(state);    // every chat of the workspace, grouped and sorted
  // panel tab from the one state: done -> done, parked -> deferred, else doing
  const pool = all.filter(viewFilter);
  const lane = state.agents?.[activeOwner];
  const sig = ticketView + "|" + (lane ? lane.name + lane.alive : "") + "|" +
              pool.map(b => b.id + b.ball + (b.writing ? "w" : "") + (b.bg ? "g" : "") + (b.done ? "d" : "") + b.pending +
                      ((seenReplies[b.id] || 0) >= (b.agentTs || 0) ? "r" : "") +
                      (b.id === selectedId ? "!" : "") + (b.task || "") + b.title +
                      Math.floor((Date.now() / 1000 - (b.agentTs || 0)) / 60)).join(",") +
              "|" + selectedTask;
  if (tik.dataset.sig !== sig){
    tik.dataset.sig = sig;
    // remember where each row sat, so survivors glide instead of teleporting
    const oldPos = {};
    for (const prev of tik.children) if (prev.dataset && prev.dataset.id) oldPos[prev.dataset.id] = prev.getBoundingClientRect().top;
    tik.textContent = "";
    for (const b of pool){
      const s = queueState(b);   // working covers claimed and a worker's job behind it
      // quirks kept: a claimed done row still pulses, and an untouched row
      // falls in with yours or queued by where the ball sits
      const busy = s === "working" || (s === "done" && cardState({ ...b, done: false, parked: false, state: null }) === "working");
      const seenTs = seenReplies[b.id] || 0;
      const r = h("div", "trow" + (b.id === selectedId ? " on" : "") + (busy ? " working" : "") +
                  (s === "yours" && seenTs >= (b.agentTs || 0) ? " seen" : "") +
                  (s === "yours" || (s === "new" && b.ball === "you") ? " yours" : "") +
                  (s === "queued" || (s === "new" && b.ball !== "you") ? " queuedc" : "") +
                  (s === "done" ? " donec" : "") +
                  (selectedTask && b.task === selectedTask ? " match" : ""));
      const inner = h("div", "trowin");
      const ttl = h("div", "ttl", b.title);
      if (/^[0-9]/.test(b.id)) ttl.prepend(h("span", "tnum", b.id));
      inner.appendChild(ttl);
      const meta = h("div", "tmeta");
      meta.appendChild(h("span", "tage", busy ? SPIN_FRAMES[spinFrame] : s === "done" ? "done" : shortAge(b.agentTs)));
      // the tag is the lane's live truth, never a stored per-card value
      const ag = state.agents?.[b.owner];
      meta.appendChild(h("span", "teng", ag ? (ag.alive ? ag.name : "offline") : ""));
      inner.appendChild(meta);
      r.appendChild(inner);
      r.dataset.id = b.id;
      r.addEventListener("click", () => select(b.id));
      tik.appendChild(r);
    }
    if (!pool.length) tik.appendChild(h("div", "tempty", ticketView === "done" ? "no done chats yet" : ticketView === "deferred" ? "no deferred chats yet" : "no open chats here"));
    // surviving rows glide to their new spots, the 220ms rise of the sister
    // board, instead of teleporting on every re-sort
    for (const row of tik.children){
      const was = row.dataset && oldPos[row.dataset.id];
      if (was == null) continue;
      const dy = was - row.getBoundingClientRect().top;
      if (Math.abs(dy) < 2) continue;
      row.style.transition = "none";
      row.style.transform = "translateY(" + dy + "px)";
      void row.offsetHeight;
      row.style.transition = "transform 220ms cubic-bezier(0.25, 1, 0.5, 1)";
      row.style.transform = "";
      row.addEventListener("transitionend", () => { row.style.transition = ""; }, { once: true });
    }
    tik.querySelector(".trow.on")?.scrollIntoView({ block: "nearest" });
  }
  // chips spring up above the panel: green while its agent works, yellow
  // while the ticket awaits input; click jumps there
  // quirk kept: the claim and the ball alone gate a chip; bg does not open
  // one, but it turns an open chip green: work in flight outranks the ball
  // gate kept: the live claim (writing, not bg) and the ball alone open a chip,
  // a distinction the collapsed state can't draw. the color, though, is the one
  // state: green while working (a claim or a live bg job), else yellow
  const need = pool.filter(b => cardState(b) !== "done" && (b.writing || b.ball === "you"));
  const chipColor = b => queueState(b) === "working" ? "g" : "y";
  const csig = need.map(b => b.id + chipColor(b)).join(",");
  if (chips.dataset.sig !== csig){
    chips.dataset.sig = csig;
    chips.textContent = "";
    const MAXCHIPS = 8;
    for (const b of need.slice(0, MAXCHIPS)){
      const c = h("span", "chip " + chipColor(b));
      c.title = b.title;
      c.addEventListener("click", () => select(b.id));
      chips.appendChild(c);
    }
    if (need.length > MAXCHIPS){
      const rest = need.slice(MAXCHIPS);
      const c = h("span", "chip more", "+" + rest.length);
      c.title = rest.map(b => b.title).join("\n");
      c.addEventListener("click", () => select(rest[0].id));
      chips.appendChild(c);
    }
  }
  syncSpinner();
}

let pollFails = 0;
async function poll(){
  try {
    const state = await (await fetch("/state")).json();
    pollFails = 0;
    if (!lastState) build(state);
    apply(state);
    lastState = state;
  } catch (e) {
    if (++pollFails >= 3){   // server itself unreachable, distinct from listener-offline
      document.body.classList.add("offline");
      document.getElementById("offline").textContent =
        "The facilitator server is unreachable. Nothing sent now will arrive; ask in the terminal to restart it.";
    }
  }
}

// the grid compass: arrow keys when not typing (Esc leaves the input), and
// the quiet on-page arrows
addEventListener("keydown", e => {
  if (!FOCUS) return;
  if (e.ctrlKey && !e.metaKey && e.shiftKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
    // control+shift+arrows: previous/next card, in and out of the text box
    // (moved off command+shift+arrows, which natively selects to line ends)
    e.preventDefault();
    nav(e.key === "ArrowLeft" ? -1 : 1, 0, { focus: true });
    return;
  }
  if (e.ctrlKey && !e.metaKey && e.shiftKey && (e.key === "ArrowUp" || e.key === "ArrowDown")){
    // control+shift+up/down, the sibling pair: the selected card's older
    // replies and back toward live, in and out of the text box
    e.preventDefault();
    histStep(e.key === "ArrowUp" ? 1 : -1);
    return;
  }
  if (e.metaKey && e.shiftKey && ["[", "]", "{", "}"].includes(e.key)){
    // command+shift+brackets: previous/next card, works while typing,
    // cursor lands in the next card's text box
    e.preventDefault();
    nav(e.key === "[" || e.key === "{" ? -1 : 1, 0, { focus: true });
    return;
  }
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === "z" || e.key === "Z")){
    // command+z bounces back to the card the last send left, and back again
    if (lastLeftId && els[lastLeftId]){
      e.preventDefault();
      const there = lastLeftId;
      lastLeftId = selectedId;
      select(there, { focus: true });
    }
    return;
  }
  if (e.metaKey && (e.key === "t" || e.key === "T")){   // command+T: new card, input focused
    e.preventDefault();
    if (draft) return;   // a choosing tab has no lane to put a card in yet
    fetch("/create?owner=" + activeOwner, { method: "POST" })
      .then(x => x.json())
      .then(r => { if (r?.id){ localStorage.setItem("focusbox", r.id); poll(); } })
      .catch(() => {});
    return;
  }
  if (e.metaKey && /^[1-9]$/.test(e.key) && lastState){   // command+number jumps tabs
    const owners = LOCKED ? [LOCKED] : rowsOf(lastState);
    const ow = owners[+e.key - 1];
    if (ow){ e.preventDefault(); setTab(ow); }
    return;
  }
  const t = e.target;
  const typing = t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable);
  if (typing){ if (e.key === "Escape") t.blur(); return; }
  // the arrow key resize is gone, taken out on 20260822. boxes are
  // still resized by the small squares in edit mode and moved by dragging
  if ((e.key === "Backspace" || e.key === "Delete") && selectedId){
    const b = lastState?.boxes.find(x => x.id === selectedId);
    if (b?.bucket === "meta"){   // same cards the remove cross appears on
      e.preventDefault();
      // match the cross: a card with any conversation closes to done and stays
      // retrievable; only a truly empty card is removed for good
      const hasContent = b.replies > 0 || (b.reply && b.reply.trim()) || b.pending > 0;
      const ep = hasContent ? ("/done?box=" + encodeURIComponent(selectedId) + "&v=1") : ("/delete?box=" + encodeURIComponent(selectedId));
      fetch(ep, { method: "POST" }).then(() => poll()).catch(() => {});
    }
    return;
  }
  const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];   // up/down freed; cmd+number switches projects
  if (d){ e.preventDefault(); nav(d[0], d[1]); }
});

// resizable outline: drag the grip, clamped, remembered
{
  const clamp = w => Math.max(170, Math.min(420, w));
  const saved = parseInt(localStorage.getItem("tocw") || "", 10);
  if (saved) document.documentElement.style.setProperty("--tocw", clamp(saved) + "px");
  const grip = document.getElementById("tocgrip");
  grip.addEventListener("mousedown", e => {
    e.preventDefault();
    grip.classList.add("drag"); document.body.classList.add("resizing");
    const move = ev => {
      const w = clamp(ev.clientX);
      document.documentElement.style.setProperty("--tocw", w + "px");
    };
    const up = () => {
      grip.classList.remove("drag"); document.body.classList.remove("resizing");
      localStorage.setItem("tocw", parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tocw"), 10));
      removeEventListener("mousemove", move); removeEventListener("mouseup", up);
    };
    addEventListener("mousemove", move); addEventListener("mouseup", up);
  });
}

// quick chat: the q box's thread as text-message bubbles, served by the qchat
// lane; the panel is dormant in the current board but the machinery stays
let qSig = "";
async function pollQ(){
  if (!FOCUS) return;
  try {
    const r = await (await fetch("/thread?box=q&n=60")).json();
    const sig = JSON.stringify(r.messages.map(m => m.ts));
    const writing = !!lastState?.boxes.find(b => b.id === "q")?.writing;
    if (sig + writing !== qSig){
      qSig = sig + writing;
      const qm = document.getElementById("qmsgs");
      qm.textContent = "";
      let prev = null;
      for (const m of r.messages){
        const side = m.kind === "user" ? "me" : "ag";
        const row = h("div", "qrow " + side + (prev === m.kind ? " cont" : ""));
        row.appendChild(h("div", "qb " + side, m.text));
        qm.appendChild(row);
        prev = m.kind;
      }
      if (writing){
        const t = h("div", "qtyping");
        t.append(h("i"), h("i"), h("i"));
        qm.appendChild(t);
      }
      qm.scrollTop = qm.scrollHeight;
    }
  } catch (e) {}
}

}

// scale the fixed 1440x900 stage to the largest that fits, centered
function fitStage(){
  if (!FOCUS) return;
  const stage = document.getElementById("stage");
  if (!stage) return;
  const bar = 41, DW = 1440, DH = 900;
  const availH = innerHeight - bar;
  // fixed size, never scaled: center it, and only scale DOWN if the window is
  // smaller than the app so nothing is lost; elements keep their size otherwise
  // fixed size, never scaled: the app is a locked rectangle, centered. The
  // elements inside never resize; a smaller window just shows less of it.
  const tx = Math.max(0, (innerWidth - DW) / 2);
  const ty = Math.max(0, (availH - DH) / 2);
  stage.style.transform = `translate(${tx}px, ${ty}px)`;
  // slide the window-wide star field so its phase matches the stage's origin
  document.body.style.backgroundPosition = tx + "px " + (bar + ty) + "px";
}
addEventListener("resize", fitStage);

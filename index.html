               from: from || (document.activeElement !== document.body ? document.activeElement : null) };
  document.body.classList.add("pagewarn");
  document.getElementById("pagewarnno").focus();
}
// cancelling and confirming both end here; nothing is changed on the way out
function shutPageWarn(){
  if (!pageWarn) return;
  const back = pageWarn.from;
  pageWarn = null;
  document.body.classList.remove("pagewarn");
  if (back && back.isConnected && typeof back.focus === "function") back.focus();
  else document.querySelector("#pagepill .pageadd")?.focus();
}
document.getElementById("pagewarnno").addEventListener("click", () => shutPageWarn());
document.getElementById("pagewarnyes").addEventListener("click", async () => {
  const pid = pageWarn && pageWarn.pid;
  shutPageWarn();
  if (pid) await dropPage(pid);
});
// the keys while it is up: Escape is cancel, and Tab cannot leave the two
// buttons, so the keyboard cannot wander into a board nobody can see
document.getElementById("pagewarn").addEventListener("keydown", e => {
  if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); shutPageWarn(); return; }
  if (e.key !== "Tab") return;
  const stops = [document.getElementById("pagewarnno"), document.getElementById("pagewarnyes")];
  const at = stops.indexOf(document.activeElement);
  e.preventDefault();
  stops[(at + (e.shiftKey ? -1 : 1) + stops.length) % stops.length].focus();
});

// Escape shuts the menu wherever the keys happen to be; capture, so nothing
// else on the board answers it first
addEventListener("keydown", e => {
  if (e.key !== "Escape" || !pageMenu) return;
  e.preventDefault(); e.stopPropagation();
  shutPageMenu();
}, true);
// a press anywhere else shuts it, and so does the window moving under it
addEventListener("pointerdown", e => {
  if (!pageMenu) return;
  if (e.target.closest && e.target.closest("#pagemenu")) return;
  shutPageMenu();
}, true);
addEventListener("resize", () => shutPageMenu());
addEventListener("blur", () => shutPageMenu());

// ---- drawing the pill ------------------------------------------------------
// what the row held on the last draw, so a page that has just joined it can be
// told from one that was already there. Keyed by project: switching projects
// swaps the whole row at once and that is not something arriving
let pageDrawn = { owner: null, ids: [] };
const gentleMotion = () => !matchMedia("(prefers-reduced-motion: reduce)").matches;
// a mark that grows in: it is put on the page with no width and no ink, and
// handed back its own size on the next frame, so the pill widens under it
// instead of arriving already wide. Two frames, because the collapsed state has
// to be painted before the transition to the open one can start
function growDot(dot){
  if (!gentleMotion()) return;   // no width to interpolate and nothing to fade
  dot.classList.add("fresh");
  requestAnimationFrame(() => requestAnimationFrame(() => dot.classList.remove("fresh")));
}

// what a mark says it is: its kind, and where it stands in the row. The place
// moves when a page before it goes, so it is written from the row every time
// rather than baked in when the mark is made
function pageLabel(p, i, total){
  return (p.kind === "blank" ? "Blank page " : "Board page ") + (i + 1) + " of " + total;
}
function labelDot(dot, p, i, total){
  const said = pageLabel(p, i, total);
  if (dot.title === said) return;
  dot.title = said;
  dot.setAttribute("aria-label", said);
}

function pageDot(p, i, total){
  const dot = h("button", "pdot");
  dot.type = "button";
  dot.dataset.page = p.id;
  labelDot(dot, p, i, total);
  dot.addEventListener("click", () => setPage(p.id));
  dot.addEventListener("contextmenu", e => {
    e.preventDefault(); e.stopPropagation();
    openPageMenu(p.id, e.clientX, e.clientY, dot);
  });
  // the keyboard's way to the same menu: the menu key, and the shift F10 every
  // desktop browser maps to it
  dot.addEventListener("keydown", e => {
    if (e.key !== "ContextMenu" && !(e.key === "F10" && e.shiftKey)) return;
    e.preventDefault();
    const r = dot.getBoundingClientRect();
    openPageMenu(p.id, r.left, r.top, dot);
  });
  return dot;
}

function renderPages(state){
  if (!FOCUS) return;
  const pill = document.getElementById("pagepill");
  if (!pill) return;
  // no pill on the new-project landing, and none before the board has said
  // which projects there are
  const away = !ownerReady || !!draft || activeOwner === DRAFT;
  pill.classList.toggle("off", away);
  if (away){
    shutPageMenu(); shutPageWarn();
    document.body.classList.remove("pageblank");
    return;
  }
  const row = pageRow(state, activeOwner);
  const cur = curPage(state, activeOwner);
  // a page removed in another window takes its menu and its question with it
  if (pageMenu && !row.some(p => p.id === pageMenu.pid)) shutPageMenu();
  if (pageWarn && (pageWarn.owner !== activeOwner || !row.some(p => p.id === pageWarn.pid)))
    shutPageWarn();
  const blank = !onBoardPage(state);
  if (blank && editMode) setEditMode(false);   // there is no board here to arrange
  document.body.classList.toggle("pageblank", blank);
  // the plus is made once and never again. It is the leftmost thing in the
  // pill and the only one that is always there, so rebuilding it with the row
  // would take the keys off it every time a page is added: press it twice and
  // the second press would land on a button that had already been replaced
  let add = pill.querySelector(".pageadd");
  if (!add){
    // no text in it: the cross is painted by the stylesheet, centred on the
    // button's own box rather than sitting on a font's baseline
    add = h("button", "pageadd");
    add.type = "button";
    add.title = "New page in this project";
    add.setAttribute("aria-label", add.title);
    add.addEventListener("click", addPage);
    pill.appendChild(add);
  }
  const sig = activeOwner + "|" + row.map(p => p.id + ":" + (p.kind || "")).join(",");
  if (pill.dataset.sig !== sig){
    pill.dataset.sig = sig;
    // only a row this project was already showing can have gained a page; a
    // first draw and a project switch both put their marks down as they are
    const had = pageDrawn.owner === activeOwner ? pageDrawn.ids : null;
    // the row is reconciled by page, not rebuilt. A mark whose page is still
    // there is the same element afterwards: it keeps the keys if it had them,
    // and it is never taken out and put back, because a focused element that
    // is re-inserted is a focused element no longer. Only a page that has gone
    // takes its mark with it, and only a page that has arrived is made and
    // grown in. This matters on a poll: a page added or deleted in another
    // window arrives here as a row change like any other
    const alive = new Map([...pill.querySelectorAll(".pdot")].map(d => [d.dataset.page, d]));
    for (const [id, node] of alive){
      if (row.some(p => p.id === id)) continue;
      node.remove();
      alive.delete(id);
    }
    let mark = null;   // the mark the next one goes after; the plus for the first
    row.forEach((p, i) => {
      let dot = alive.get(p.id);
      if (dot) labelDot(dot, p, i, row.length);
      else {
        dot = pageDot(p, i, row.length);
        if (had && !had.includes(p.id)) growDot(dot);
      }
      const want = mark ? mark.nextSibling : add.nextSibling;
      if (want !== dot) pill.insertBefore(dot, want);   // never moves one already in place
      mark = dot;
    });
    pageDrawn = { owner: activeOwner, ids: row.map(p => p.id) };
  }
  // the mark of the page being looked at is written on its own, so switching
  // pages never rebuilds the row under the dot that was just pressed
  for (const dot of pill.querySelectorAll(".pdot")){
    const on = !!cur && dot.dataset.page === cur.id;
    dot.classList.toggle("on", on);
    if (on) dot.setAttribute("aria-current", "page");
    else dot.removeAttribute("aria-current");
  }
  seatPagePill();
}

// Where the pill sits. Its seat is 8px inside the foot of the app the window is
// actually showing: the stage's own foot when the window is tall enough to hold
// the whole of it, the window's foot when it is not. If that seat would land on
// the card or on the rail under it, the pill steps up to sit clear above
// whichever of them reaches lowest, so it never covers either.
function seatPagePill(){
  if (!FOCUS) return;
  const pill = document.getElementById("pagepill");
  if (!pill || pill.classList.contains("off") || getComputedStyle(pill).display === "none") return;
  const stage = document.getElementById("stage");
  const gap = 8;
  const own = pill.getBoundingClientRect();
  // the foot of the app the window is actually showing: the stage's own foot
  // while the window is tall enough to hold all of it, and the window's foot
  // when it is not
  const foot = stage ? Math.min(stage.getBoundingClientRect().bottom, innerHeight) : innerHeight;
  const seat = Math.max(gap, innerHeight - foot + gap);
  let bottom = seat;
  const topAt = b => innerHeight - b - own.height;
  const rest = topAt(seat);
  // The one thing the switcher steps over is the rail, the thin track under the
  // card. It is a strip, so stepping over it costs a few pixels and leaves it
  // whole. Nothing large is ever stepped over: a region the size of the card is
  // held out of the switcher's way instead, below, because hopping the height
  // of a card is how the switcher used to end up at the top of the screen.
  const rail = document.getElementById("rail");
  if (rail){
    const r = rail.getBoundingClientRect();
    if (r.height <= 2 * own.height &&        // a footer strip, not a region
        r.bottom > rest && r.top < rest + own.height &&
        r.right > own.left && r.left < own.right)
      bottom = Math.max(bottom, innerHeight - r.top + gap);
  }
  // the invariant behind all of it, kept whatever the measurements say: the
  // foot of a workspace is never near its top, so the switcher never leaves the
  // lower half of the window
  if (topAt(bottom) < innerHeight / 2) bottom = seat;
  if (pill.style.bottom !== bottom + "px") pill.style.bottom = bottom + "px";
  reserveFootRoom(topAt(bottom) - gap);
}

// The room the switcher keeps for itself. The card is the one region that can
// reach the foot of a short window, so the card is what gives the room back: it
// is held to a height that ends above the switcher, and its reply pane scrolls
// inside whatever height that leaves. In any window tall enough to hold the
// whole board this asks for more height than the card has and nothing moves at
// all, so the board only ever gives up room it does not have.
function reserveFootRoom(floor){
  const card = document.querySelector("main");
  if (!card) return;
  // floor and the card top are screen pixels; the card lives in the scaled
  // stage, so its max-height is a stage-local number and the screen gap has to
  // be divided by the stage scale before it is written back
  const room = Math.max(MIN_CARD_H, Math.round((floor - card.getBoundingClientRect().top) / stageScale));
  if (card.style.maxHeight !== room + "px") card.style.maxHeight = room + "px";
}
const MIN_CARD_H = 160;   // a card is never squeezed past being a card
// leaving or entering fullscreen resizes the window, but the event that says so
// first is this one, and on some paths it is the only one: the switcher is
// re-seated on both so the foot is never a frame behind the window
addEventListener("fullscreenchange", () => { fitStage(); seatPagePill(); });

// a press anywhere on the large card, or the keyboard's focus landing in it,
// selects the card on screen where it stands, and reads it. the page is
// listened to, first, before anything on it can stop the press. in edit mode a
// press is a drag
{
  const frame = document.querySelector("main");
  const inCard = e => !editMode && (e.target === frame || !!e.target.closest?.("#sections"));
  for (const type of ["pointerdown", "focusin"])
    document.addEventListener(type, e => { if (inCard(e) && selectedId) useCard(selectedId); }, true);
}
// a press on the bare board, the paper beside and below the panels, lets go of
// the card on screen: it stays, browsed. a press on a panel, a button or the
// card itself is not a press on the paper. the ticket list has no box, so its
// empty strips and the gaps between tickets are paper too: a press that lands
// on a list section itself, not on a ticket, counts. the drawer is a panel
document.addEventListener("pointerdown", e => {
  if (e.button || editMode || homeOpen) return;
  const t = e.target;
  const listPaper = (t.id === "tiklist" || t.id === "tiksheet" || t.classList?.contains("tikpane"));
  if (t === document.getElementById("stage") || t === document.body ||
      t === document.documentElement || listPaper) unselectShown();
}, true);
// the house leaves the board for the home page the way another tab does: the
// card on screen is no longer selected, so coming back through a tab shows it
// browsed, and a reply that landed meanwhile waits until the reader selects it
document.getElementById("homeico")?.addEventListener("click", () => unselectShown());

// browsing: the card on screen was reached without being chosen, by the arrow
// keys, a tab switch, a load or a fallback pick. selectedId still names it, so
// every key that acts on the card acts on it, but it is not selected: neither
// it nor its ticket wears the drop shadow, and nothing on it counts as read. a
// click on its ticket or into it, or Enter, selects it; Escape puts it back
function setBrowsing(on){
  browsing = on;
  document.body.classList.toggle("browsing", on);
}

// a click on a ticket, a chip or an outline entry, the caret carried along by
// a step, a new card: the card is shown and selected, and so read. opts.browse
// shows it without selecting it (browse, below). the hop a close or a snooze
// makes to the next card shows it browsed, since the board picked that card
// and the reader did not
function select(id, opts){
  if (!els[id]) return;
  const chosen = !opts?.browse && !opts?.hop;
  cancelAutoNext();
  if (hist && hist.id !== id) histExit(hist.id);   // every card opens on its live reply
  selectedId = id; shownId = id; localStorage.setItem("selbox", id);
  setBrowsing(!chosen);
  if (chosen) markSeen(id);
  const b = lastState?.boxes.find(x => x.id === id);
  if (b) lastSel[b.owner] = id;
  // a chosen card is read now, so its tab drops its bold on the click, not up
  // to a poll later. the bar itself is only rebuilt when its lanes change
  if (lastState) renderTabs(lastState);
  for (const k of Object.keys(els)){
    els[k].box.classList.toggle("sel", k === id);
    els[k].toc.classList.toggle("t-sel", k === id);
  }
  openAtHead(els[id]);
  // the card is laid out again now that it wears .sel. a draft it kept while it
  // was hidden may carry a stale inline height, since the guarded autosize
  // skips the write on a display:none card, so re-measure the composer once
  // here. this reflects a draft that also grew while hidden, an upload that
  // landed on it, without waiting for a keystroke. the tick guards itself, so a
  // card whose row has no field is a no-op.
  if (els[id].tick) els[id].tick();
  syncDesktopHistoryAvailability(id);
  // the ticket rows re-render on the poll, up to a second later; the selection
  // shadow must move the instant of the click, so flip the class directly,
  // and bring the chosen row into the panel's view in the same breath
  for (const r of document.querySelectorAll("#tiklist .trow")){
    r.classList.toggle("on", r.dataset.id === id);
    if (chosen && r.dataset.id === id && r.classList.contains("yours")) r.classList.add("seen");
  }
  document.querySelector("#tiklist .trow.on")?.scrollIntoView({ block: "nearest" });
  if (chosen && opts?.focus) els[id].ta.focus({ preventScroll: true });
  updatePwd();
  scrollTo({ top: 0, behavior: "instant" });
  // a card switch is a new answer of a new length in the same room, so the phase
  // the last card's snap set means nothing here. once now and once on the next
  // frame, since the card was display:none until the line above
  snapCard();
  requestAnimationFrame(snapCard);
}
// the arrow keys and a tab switch: the card is shown and its ticket marked,
// and nothing is selected or read. the card already on screen and selected
// stays so: a lane of one card, or a tab's own key, has nowhere else to go
function browse(id){
  if (id === shownId && !browsing) return;
  select(id, { browse: true });
}
// the browsed card on screen becomes the selected one where it stands: nothing
// on it moves, it takes the drop shadow back and counts as read. while the
// home page is up the board is not on screen, so nothing on it is selected
function chooseShown(){
  const id = selectedId;
  if (homeOpen || !browsing || !id || !els[id]) return;
  setBrowsing(false);
  markSeen(id);
  if (lastState) renderTabs(lastState);
  for (const r of document.querySelectorAll("#tiklist .trow"))
    if (r.dataset.id === id && r.classList.contains("yours")) r.classList.add("seen");
}

// Escape with nothing being typed: the card stays on screen, browsed, and
// gives up its drop shadow. whatever held the focus inside it lets go, so the
// Enter that selects it again is never a press on one of its buttons
function unselectShown(){
  const id = selectedId;
  if (browsing || !id || !els[id]) return;
  setBrowsing(true);
  const held = document.activeElement;
  if (held && held !== document.body && document.querySelector("main")?.contains(held)) held.blur();
}

// the reader is in this card's composer, by a click, the caret landing there
// or a key typed: the card on screen is selected if it was only browsed, and
// the card counts as read
function useCard(id){
  if (homeOpen) return;   // nor read, while the home page covers the board
  if (id === selectedId) chooseShown();
  markSeen(id);
}

function updatePwd(st){
  st = st || lastState;
  if (!FOCUS || !st) return;
  // no selection (an empty lane): the active tab's own folder, never the global default
  const owner = st.boxes.find(x => x.id === selectedId)?.owner
             || (activeOwner !== DRAFT ? activeOwner : null);
  const dir = (st.pwds || {})[owner] || st.pwd || "";
  const p = document.getElementById("pwdline");
  if (p.textContent !== dir) p.textContent = dir;
}

// the lanes the bar is showing, which is what the keys walk and what counts as
// a neighbour: a closed tab is simply not among them
function rowsOf(state){
  return allRowsOf(state).filter(ow => !tabClosed(ow, state));
}

function nav(dx, dy, opts){
  if (!FOCUS || !lastState) return;
  const st = lastState;
  const cur = st.boxes.find(b => b.id === selectedId) || st.boxes[0];
  if (!cur) return;
  if (dy){
    const owners = rowsOf(st);
    const oi = Math.min(Math.max(owners.indexOf(activeOwner) + dy, 0), owners.length - 1);
    if (owners[oi] !== activeOwner) setTab(owners[oi]);
  } else if (dx){
    const pool = viewPool(st);
    if (!pool.length) return;
    const i = pool.findIndex(b => b.id === selectedId);
    const pick = pool[(i + dx + pool.length) % pool.length];
    // a step that carries the caret into the next card's composer selects that
    // card, since the caret there is using it; a plain arrow only browses
    if (pick && opts?.focus) select(pick.id, opts);
    else if (pick) browse(pick.id);
  }
}

// keep a valid selection within the active project: fall back when the
// selected box is gone, unset, or belongs to another tab
function applySelection(state){
  if (!FOCUS || !state.boxes.length || draft) return;   // a choosing tab holds no card
  const pool = state.boxes.filter(b => b.owner === activeOwner);
  if (!pool.length){ deselect(); updatePwd(state); return; }   // an empty lane shows plain paper, never another lane's card
  if (!selectedId || !pool.some(b => b.id === selectedId)){
    // prefer a card from the tab being looked at, and only fall back to the
    // whole lane if that tab is empty, so the pick is never a deferred card
    // while the doing tab is open
    const inView = viewPool(state);
    const pick = inView.find(awaitsYou)
              || inView.find(b => !b.done && !b.parked)
              || inView[0]
              || pool.find(awaitsYou)
              || pool.find(b => !b.done && !b.parked)
              || pool[0];
    selectedId = pick.id; localStorage.setItem("selbox", selectedId);
  }
  if (hist && hist.id !== selectedId) histExit(hist.id);   // selection moved without select()
  const moved = shownId !== selectedId;
  for (const k of Object.keys(els)) els[k].box.classList.toggle("sel", k === selectedId);
  openAtHead(els[selectedId]);
  syncDesktopHistoryAvailability(selectedId);
  updatePwd(state);
  // a selection that arrived without going through select(), which is the first
  // load and any fallback pick, still lands on a card that was display:none a
  // moment ago and has never been measured. nobody chose it, so it is shown
  // browsed, and nothing on it is read until the reader selects it
  if (moved){ shownId = selectedId; setBrowsing(true); requestAnimationFrame(snapCard); }
}

function statusOf(b){
  if (b.bucket === "meta") return b.owner === "facilitator" ? "toolmeta" : "triagemeta";
  // the left-tab group comes from the one state too: done -> Done, parked ->
  // Later, everything live -> Now
  const s = cardState(b);
  return s === "done" ? "done" : s === "parked" ? "later" : "now";
}

// ---- the two message panels -------------------------------------------------
// the panel of messages the answer was given, over the answer, and the panel of
// messages sent and not answered yet, at the card's foot, are one panel, built,
// cut, opened and filled in card-logic.js for this page and the phone alike, and
// so is the page turn that takes the one up to the other when an answer lands.
// what the desktop tells them: the panel over the answer taking or giving back
// its room re-snaps the answer's lines against it (the sent panel's own word is
// sentRoom, below, which only writes its band again), and a new answer held back while the
// reader was busy is shown by asking the board again
answeredRoomChanged = snapCard;
turnAgain = () => poll();

// the chevron the top-bar history buttons draw, the phone page's same path and
// dimensions
const CHEV_PATH = '<path d="M1 5.5 5.5 1.5 10 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
function historyChevronSVG(){
  return '<svg class="histchev" width="11" height="7" viewBox="0 0 11 7"' +
         ' fill="none" aria-hidden="true">' + CHEV_PATH + "</svg>";
}

// the sent panel's room on one card: the band the answer is cut to is written
// again, for a change in the seat the band's watch would not see. the answer
// is not snapped again: the snap leaves the sent bubbles' seat out, so nothing
// they do moves the answer
function sentRoom(el){
  if (el.bandWrite) el.bandWrite();
}

// true when a live selection touches el. intersectsNode catches a cross-boundary
// pick whose commonAncestorContainer sits outside el; collapsed/empty give false.
function boxHasSelection(el){
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return false;
  for (let i = 0; i < sel.rangeCount; i++){
    const r = sel.getRangeAt(i);
    if (!r.collapsed && r.intersectsNode(el)) return true;
  }
  return false;
}

// ---- the fade, the snap and the title's air --------------------------------
// three passes that hold one number between them, and they are the fragile part
// of the card. the mock ran them over three fixed panes with one fixed answer
// and no box until a send; here the answer, the card's furniture and the message
// count all vary, and every difference below is written down where it is made.

// the strip of the answer that stands below its room, measured off the wrapper
// and written in whole pixels. it is the one thing both passes below need, so it
// is worked out once here: the line the ramp is cut on and the line the snap
// counts to are the same line by construction.
// the wrapper and not the box: the box does not exist until the first send, and
// the typing bar under it stands in the same place, so the wrapper's top edge is
// the one edge that is there from the first frame.
// whole pixels, and that is not tidiness. this band becomes a gradient stop in
// the middle of the answer, and chrome does not paint a stop asked for at a
// fraction of a pixel where it was asked; at every whole number it does. the
// rounding spends at most half a pixel of the clear air over the box, and the
// snap reads the same rounded number, so the answer's last line keeps its phase
// to the pixel
// skip is a depth at the wrapper's head left out of the band: the seat of the
// sent bubbles, which the snap below does not count
function boxBand(reply, wrap, skip = 0){
  const clear = parseFloat(getComputedStyle(reply).marginBottom) || 0;
  const b = reply.getBoundingClientRect().bottom -
            (wrap.getBoundingClientRect().top + skip - clear);
  return Math.max(0, Math.round(b));
}

// the ramp's own top edge, written on the answer as --boxband. a ResizeObserver
// and not a timer or a hook on each send: it delivers after layout and before
// paint on every frame the wrapper's height changes, a sent panel arriving or
// leaving, the row growing, a window resize, so the ramp's top edge and the
// panel's top edge are the same line on every frame rather than one frame
// behind it
function watchBand(el){
  // --boxband is what the sent panel and the row the reader types on cover at the
  // foot of the answer: the depth the answer's own ramp is cut to. it is written
  // on the CARD and the answer inherits it, so every rule that reads --boxband
  // reads the number it always read.
  // while a sent bubble opens or is cut back the band follows it on every frame
  // (sentBand in card-logic.js), so the fade rides the bubble's top edge and
  // does not jump once it stops; a band that has not changed is not written again
  const write = () => {
    const band = sentBand(el, boxBand(el.replyview, el.pendwrap));
    if (band === el.bandAt) return;
    el.bandAt = band;
    el.box.style.setProperty("--boxband", band + "px");
  };
  el.bandWrite = write;
  if (window.ResizeObserver){
    const ro = new ResizeObserver(write);
    ro.observe(el.pendwrap);
    ro.observe(el.replyview);
    // the card's own room changes with the window and with the card's furniture
    // above the body, neither of which has to touch the two above
    if (el.replyview.parentElement) ro.observe(el.replyview.parentElement);
  }
  write();
}

// how much of a scroller has gone up out of sight, written back on it as
// --upband, which is the depth the ramp at its top edge is cut to. two of them
// wear it: the answer, which dissolves under the title, and the row the reader types in,
// which dissolves under the bar's hairline.
// capped at the ramp's own depth, except on the typing row where the matching
// clear strip is added to that cap. both are read off --replyfade and --replyair
// on the element rather than typed here, so a change in the sheet is followed
// without a second number to keep in step. the reads are kept on the node once
// they land: the two depths are constants in the sheet, and a getComputedStyle
// on every scroll event would be a style recalc per frame for numbers that never
// change. only numbers are kept, though, and never an empty read: the values are
// written on the selected card and a card is built before it is selected, so the
// first read on a fresh card comes back with nothing and has to be taken again.
// whole pixels, for the reason boxBand is in whole pixels: this becomes a
// gradient stop, and chrome paints a stop asked for at a whole number where it
// was asked. it also means the property is only written on the pixels of scroll
// that change it, and none at all once the cap is reached, so a long scroll
// costs one number read and nothing written.
// nothing here can move ink: it feeds a mask, and a mask changes what is
// painted, never what is measured
function riseBand(node){
  if (!node._fade || node._air == null){
    const cs = getComputedStyle(node);
    const fade = parseFloat(cs.getPropertyValue("--replyfade")) || 0;
    if (fade){
      node._fade = fade;
      node._air = node.tagName === "TEXTAREA" ? parseFloat(cs.getPropertyValue("--replyair")) || 0 : 0;
    }
  }
  const up = Math.min(Math.round(node.scrollTop), (node._fade || 0) + (node._air || 0));
  if (up === node._up) return;
  node._up = up;
  node.style.setProperty("--upband", up + "px");
  // and the mark the typing row's mask is hung on, so that row carries no mask
  // at all while nothing has gone up out of sight. the answer does not read it:
  // its mask is there for the ramp at its foot whatever the scroll is doing
  node.classList.toggle("upfade", up > 0);
}

// armed on the scroll itself, passive, since the only thing it does is read a
// number the scroll has already settled and hand it to a gradient. once at the
// start too, so a card built with its answer already part way down opens with
// the right band rather than the wrong one until the first wheel
function watchRise(node){
  node.addEventListener("scroll", () => riseBand(node), { passive: true });
  riseBand(node);
}

// the same two bands for each section of the ticket list: how far the section
// has scrolled, --upband, and how far it still can, --downband, in whole pixels
// and capped at --listfade, the depth of the ramp. a section at the top of its
// scroll wears no band at the top, one at its end none at the foot, and one that
// fits none at all. a number is only written when it changes. the bands are
// read again when the rows are rebuilt and when a section changes size, since
// either moves how far it can scroll without a scroll event. this feeds a mask
// and nothing else, so it changes what is painted and never what is measured
function tickBands(pane){
  if (!pane._fade) pane._fade = parseFloat(getComputedStyle(pane).getPropertyValue("--listfade")) || 0;
  const up = Math.min(Math.round(pane.scrollTop), pane._fade);
  const down = Math.min(Math.max(0, Math.round(pane.scrollHeight - pane.clientHeight - pane.scrollTop)), pane._fade);
  if (up !== pane._up){ pane._up = up; pane.style.setProperty("--upband", up + "px"); }
  if (down !== pane._down){ pane._down = down; pane.style.setProperty("--downband", down + "px"); }
}
for (const pane of document.querySelectorAll(".tikpane")){
  const read = () => tickBands(pane);
  pane.addEventListener("scroll", read, { passive: true });
  new MutationObserver(read).observe(pane, { childList: true });
  if (window.ResizeObserver) new ResizeObserver(read).observe(pane);
  read();
}

// every answer must end evenly against its box: the answer's room snaps down to
// a whole number of its own text lines, so the last visible line always sits at
// the same depth of the fade band. that snap is the whole reason the fade reads
// clean: it stands the line the ramp is cut on on a whole line of type, so a
// whole line's ink always lies inside the ramp and always dissolves to nothing.
// the room's foot is the band and not the answer's own bottom edge, because on
// this card the box is laid over the answer: the room runs from the answer's
// first line down to the 3.5px of clear air above the box's top edge, and that
// 3.5 is the answer's own margin-bottom read off the sheet rather than typed in
// here, so the two feet are one measure by construction.
// the remainder is spent as a margin at the top of the answer, and as the NEARER
// whole line rather than always the next one down, so the move is at most half a
// line and the air under the title is disturbed as little as the parity allows.
// the answer's own foot is no help: the cut is the box's top edge less the clear
// air, the box is pinned to the card's floor, and the answer scrolls from its own
// first line, so a margin at the foot moves neither of those.
//
// three differences from the mock, and all three are the real board being
// variable where the sheet was fixed.
// the mock walks every .reply on its page. here that is 259 answers, all but one
// of them inside a card that is display:none, whose every rect reads zero. so
// this walks the one card on screen, which is also the only one whose numbers
// mean anything.
// the mock has four moments to run at, because nothing else on its page can
// change. here the answer's room also changes when the reader switches cards and
// when a new reply lands, so those call it too. the sent bubbles at the foot are
// left out of the room altogether, so nothing they do calls it. the panel over
// the answer open or running does not let it run: re-snapping mid fold would
// slide the answer's lines under the reader while the panel moves, and a panel
// cut back returns to the height it was snapped against
function snapCard(){
  if (!FOCUS) return;
  const el = els[selectedId];
  if (!el || !el.box.classList.contains("sel")) return;
  // the sent bubbles at the foot are not counted at all: the answer is snapped
  // against the bar under them as though their seat stood empty, so a send, a
  // merge or a bubble opened never moves it (the owner's word:
  // the answer is a thing of its own, and nothing the
  // bubbles do is a reason for it to move). the fade at its foot still ends
  // on the bubbles' top edge (--boxband), which is a mask and moves no ink
  const seat = el.sentwrap ? el.sentwrap.getBoundingClientRect().height : 0;
  // the panel of answered messages above the answer: while it stands open, or
  // moves, the answer keeps the
  // phase it was snapped to with the panel cut, so opening moves the answer
  // down by the panel's growth on the panel's own curve and nothing more, and
  // cutting it back always brings the answer back to the same line. the panel
  // says so itself once its run has landed
  const answ = el.answ;
  if (answ && (answ.classList.contains("open") || answ.classList.contains("motion"))) return;
  // the snap reads the answer at its own top, the state every gap is measured in.
  // a card scrolled down is left as it stands: the line grid it was snapped to at
  // the top rides with the scroll, so re-snapping against the scrolled lines would
  // only slide the visible line by the difference between two viewport measurements
  if (el.replyview && el.replyview.scrollTop > 1) return;
  const r = el.reply;            // the answer prose, a block inside the scroller
  const view = el.replyview;     // the scroller that owns the scroll and the fades
  const head = el.box.querySelector(".head");
  // the title's slide is undone before a single measurement is taken, so every
  // run reads the sheet's own head and not the head the last run left
  head.style.paddingTop = "";
  el.titleEl.style.marginBottom = "";
  r.style.marginTop = "";
  r.style.marginBottom = "";
  view.style.marginTop = "";
  view.style.marginBottom = "";
  const cs = getComputedStyle(r);
  const vcs = getComputedStyle(view);
  const line = parseFloat(cs.lineHeight);
  const rect = view.getBoundingClientRect();
  if (!line || !rect.height) return;     // a card that is not laid out yet
  // an answer with no ink has no line grid to snap to, and pushing an empty box
  // down by a fraction of a line would only move the title for nothing
  const first = [...r.children].find(n => n.getBoundingClientRect().height > 2);
  if (!first) return;
  // the room is the answer's first line down to the cut. the panel above the answer
  // rides inside this same scroller, so the height it holds is room the prose
  // does not have; the run-out at the foot is the scroll's own and no part
  // of it either. subtracting both leaves the whole number of lines the ramp needs
  const answH = (answ && el.answwrap) ? el.answwrap.getBoundingClientRect().height : 0;
  const room = rect.height - boxBand(view, el.pendwrap, seat) - answH - parseFloat(vcs.paddingTop || 0);
  const rem = room % line;
  // the remainder is spent as air at the head of the answer, and on a card with
  // nothing standing over the answer it goes to the NEARER whole line, so the
  // air under the title is disturbed by at most half a line either way.
  // with the answered panel standing there the remainder may only be GIVEN, so
  // the answer's first line always clears the panel above it rather than pulling
  // up under it.
  const s = (rem > line / 2 && !answ) ? rem - line : rem;
  if (Math.abs(s) > 0.5){
    if (answ){
      // The answered panel and the waiting box frame the answer as a pair. Share
      // the spare room between those two edges: the upper share pushes the prose
      // down off the panel above (a margin on the prose block, inside the
      // scroller), the lower share lifts the scroller's own foot off the waiting
      // box. The two add back to exactly s, so the answer keeps its snapped line
      // count. Balance the white the eye sees, from the foot of the panel's room for
      // its delivery mark to the first glyph and from the last unobscured glyph to
      // the waiting box. A Range describes the font box, not its ink; canvas
      // supplies this face's actual ink bounds. Moving one pixel from the lower
      // share to the upper moves every glyph down one, so half the measured
      // difference is the balanced share.
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      context.font = cs.font;
      const metrics = context.measureText(r.textContent || "M");
      const inkTop = q => q.top + metrics.fontBoundingBoxAscent - metrics.actualBoundingBoxAscent;
      const inkBottom = q => q.top + metrics.fontBoundingBoxAscent + metrics.actualBoundingBoxDescent;
      const firstRange = document.createRange();
      firstRange.selectNodeContents(first);
      const firstLine = [...firstRange.getClientRects()].find(x => x.height > 2);
      const pendingTop = el.pendwrap.getBoundingClientRect().top + seat;
      const lines = [];
      const walker = document.createTreeWalker(r, NodeFilter.SHOW_TEXT);
      for (let node = walker.nextNode(); node; node = walker.nextNode()){
        const range = document.createRange();
        range.selectNodeContents(node);
        lines.push(...range.getClientRects());
      }
      const lastLine = lines.filter(q => q.height > 2 && q.bottom > rect.top &&
        q.top < rect.bottom && inkBottom(q) <= pendingTop)
        .sort((a, b) => inkBottom(b) - inkBottom(a))[0];
      const markRoom = parseFloat(getComputedStyle(answ).marginBottom) || 0;
      const top0 = firstLine ? inkTop(firstLine) - (answ.getBoundingClientRect().bottom + markRoom) : 0;
      const bottom0 = lastLine ? pendingTop - inkBottom(lastLine) : top0;
      // When the answer is short, the large body region below its only line is
      // content room rather than a boundary gap; it cannot be made equal by moving
      // the line. In that case keep the line at the smallest top gap and put the
      // snap remainder below it.
      const balanced = bottom0 > line * 2 ? 0 : (bottom0 - top0) / 2;
      const upper = Math.max(0, Math.min(s, balanced));
      const lower = s - upper;
      r.style.marginTop = upper.toFixed(2) + "px";
      view.style.marginBottom = (parseFloat(vcs.marginBottom) + lower).toFixed(2) + "px";
    } else {
      view.style.marginTop = s.toFixed(2) + "px";
    }
  }
  // the answer has moved, so the title's two gaps are no longer a pair. this
  // runs from inside the snap and not beside it, so the two can never be a
  // frame apart
  tiltTitleAir(el, first);
}

// the card gives the title one measure of air over it and the same measure under
// it, and the snap above has just spent its remainder in the lower of the two.
// this puts the pair back level by sliding the title itself, and nothing else.
// the slide is taken entirely inside the head: half comes off the head's own
// padding and the same half goes onto the title's bottom margin, so the head's
// height is the number it always was. that matters more than it looks: the head
// is the one thing standing over the answer in the column, so a head that does
// not change height is an answer that does not move, an unchanged room for the
// snap to measure, an unchanged remainder, and a fade that cannot be touched by
// anything written here. it also means this can never argue with itself, since
// nothing it writes can change what it read.
// the gaps are read off the type's own boxes and not off the elements'. a Range
// over the words hands back the line's content box, which is where the letters
// live; the element box is not. the two ways of measuring disagree by about
// three and a half pixels and only one of them is white the reader can see.
// the mock always finds a <p> under the answer. here fmt writes lists, quotes
// and fenced blocks too, so the first line of ink is taken off whatever the
// first laid-out child turns out to be
function tiltTitleAir(el, first){
  const head = el.box.querySelector(".head"), title = el.titleEl,
        bar = el.topbar, reply = el.reply;
  if (!head || !title || !bar || !first) return;
  // the card's own padding, which is what stands here: the pass this is called
  // from wound the last slide back before it measured anything
  const hp = parseFloat(getComputedStyle(head).paddingTop);
  const rg = document.createRange();
  rg.selectNodeContents(title);
  const t = rg.getBoundingClientRect();
  if (!t.height) return;
  const over = t.top - bar.getBoundingClientRect().bottom;
  // what stands under the title. on a card carrying the answered panel over its
  // answer it is that panel, and a panel is not type: its own top edge is where
  // the white under the title ends, so the edge is what the gap is measured to.
  // measuring past it to the answer's first line would count the whole panel as
  // air under the title and slide the title down by half of it.
  // with no panel it is the answer's own first line, measured off the type's box
  // and not the element's exactly as it always was, and its scrollTop is added
  // back because the rect says where that line is now while what this needs is
  // where it is with the answer at its own top, which is the state every moment
  // below is read in
  // the panel and the first line both ride in the scroller, so the scroll is
  // added back to read where each stands with the answer at its own top, which is
  // the state every measure here is taken in
  let under;
  if (el.answ && el.answwrap){
    under = el.answwrap.getBoundingClientRect().top + el.replyview.scrollTop - t.bottom;
  } else {
    rg.selectNodeContents(first);
    const lines = rg.getClientRects();
    let a = null;
    for (let i = 0; i < lines.length && !a; i++) if (lines[i].height > 2) a = lines[i];
    if (!a) return;
    under = a.top + el.replyview.scrollTop - t.bottom;
  }
  const tilt = (under - over) / 2;
  if (!isFinite(tilt) || Math.abs(tilt) < 0.02) return;
  // both halves are written on the sixty fourth of a pixel the engine lays out
  // on, and that is not tidiness either. chrome cuts every length down to that
  // grid rather than rounding it, so two numbers asked for off the grid come
  // back a unit short of the one they were cut from, and a head one unit shorter
  // is an answer one unit higher, which is a whole line re-drawn a device pixel
  // off. asked for on the grid, the padding and the margin add back to exactly
  // the sixty fourths the padding alone stood on
  const GRID = 64;
  const whole = Math.floor(hp * GRID);
  const pad = Math.floor((hp + tilt) * GRID);
  head.style.paddingTop = (pad / GRID) + "px";
  title.style.marginBottom = ((whole - pad) / GRID) + "px";
}

// fmt and replyFull are shared with the phone page in card-logic.js; the short
// reply variant is the desktop's own
function replyShort(b){ return b.replyShort == null ? replyFull(b) : b.replyShort; }

// how many older replies the card holds, the live one excluded: the board's
// own count, and the length of the list GET /history hands the stepper, since
// one rule on the board decides both. It rides in with the card, so the marks
// are right in the frame the card first draws in instead of a history request
// later, and the list that arrives says the same thing rather than taking them
// away again. b.replies counts progress notes as well and is no answer to
// this. A board too old to send the count answers none here, and the history
// request the open card makes still fills the marks in as it used to
function olderReplies(b){ return Math.max(b.olderReplies || 0, 0); }

function build(state){
  const sections = document.getElementById("sections");
  const toc = document.getElementById("toc");
  for (const [key, label] of SECTIONS){
    const group = h("div", "toc-group");
    const bucketRow = h("div", "toc-bucket");
    bucketRow.appendChild(h("span", null, label));
    if (METAS.includes(key)){   // the plus lives in the left bar: the page shows one box at a time
      const plus = h("button", "tocadd", "＋");
      plus.title = "new box";
      plus.addEventListener("click", () => {
        const metaOwner = metaOwnerOf(key);
        if (metaOwner) newCard(metaOwner);
      });
      bucketRow.appendChild(plus);
    }
    group.appendChild(bucketRow);
    toc.appendChild(group);
    tocGroups[key] = group;

    const shead = h("div", "bucket " + key);
    shead.appendChild(h("h2", null, label));
    shead.appendChild(h("span", "rule"));
    const cnt = h("span", "tag", "");
    shead.appendChild(cnt);
    sections.appendChild(shead);
    const list = h("div");
    sections.appendChild(list);
    secEls[key] = { list, cnt };
  }

  state.boxes.forEach((b, i) => makeBox(b, i, state));
  addRows();
  landFocus();
}

// one box + its outline entry, inserted at its position within its section
function makeBox(b, i, state){
  noteDoing("card");
    const entry = h("div", "toc-entry");
    entry.appendChild(h("span", "tage"));
    // the outline shows the card's id as its number. a change to how cards are
    // numbered has to be carried into the quick note system as well: card-logic.js
    // ticketNum, quickNoteRef and QUICK_NOTE_REF (the "card N" / "cN" parser) and
    // quickNoteCard; server.py _post_quicknote_new and _post_quicknote_attach; and
    // syncQuickNoteChip in parked/quick-note.js (the note chip). the quick note
    // is hidden in this version, and these are kept so it can come back
    entry.appendChild(h("span", "tnum", (b.id === "0" || b.id === "t0") ? "•" : b.id));
    entry.appendChild(h("span", "tdot"));
    entry.appendChild(h("span", "ttitle", b.title));
    entry.addEventListener("click", () => {
      if (FOCUS) select(b.id);
      else document.getElementById("box-" + b.id)?.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    const box = h("article", "box" + (b.bucket === "meta" ? " metabox" : ""));
    box.style.animationDelay = (i * 22) + "ms";
    box.id = "box-" + b.id;

    // The card's own top bar stands above the head. Its flexible left-hand item
    // is the phone page's reply-history control; defer and close stay on the
    // right. It belongs to the card, so each card keeps its own history state.
    const topbar = h("div", "topbar");
    /* Worktree selector UI, intentionally dormant. The card and server retain
       their worktree data and endpoints; this block is kept intact so the old
       selector can be restored without reconstructing its behavior.
    const branch = h("span", "branch");
    // the fork starts hidden and the redraw below uncovers it once the lane's
    // names have landed. this way round on purpose: a lane with no repository
    // never shows a fork at all, not even for the one frame before the answer
    // arrives, which is the whole complaint being fixed here
    branch.classList.add("norepo");
    const wtpick = h("span", "wtpick");
    wtpick.setAttribute("role", "button");
    wtpick.tabIndex = 0;
    wtpick.setAttribute("aria-haspopup", "listbox");
    wtpick.setAttribute("aria-expanded", "false");
    wtpick.innerHTML = WT_ICON;
    const bname = h("span", "bname");
    wtpick.appendChild(bname);
    branch.appendChild(wtpick);
    const wtmenu = h("div", "wtmenu");
    wtmenu.setAttribute("role", "listbox");
    topbar.append(branch, wtmenu);
    */
    const branch = null, bname = null, wtpick = null, wtmenu = null;
    const histctl = h("div", "histctl");
    histctl.setAttribute("role", "group");
    histctl.setAttribute("aria-label", "reply history");
    const histUp = h("button", "histbtn older");
    histUp.type = "button";
    histUp.title = "older reply";
    histUp.setAttribute("aria-label", "older reply");
    histUp.innerHTML = historyChevronSVG();
    const histDown = h("button", "histbtn newer");
    histDown.type = "button";
    histDown.title = "newer reply";
    histDown.setAttribute("aria-label", "newer reply");
    histDown.innerHTML = historyChevronSVG();
    const histPos = h("span", "histpos");
    // The marks are set here, before this card has ever been shown, so a card
    // that already holds older replies draws them in its first frame rather
    // than fading them in once a history request has answered. The card is
    // display:none until it is the selected one, and a class written while it
    // is starts no transition, so the fade is left for history that genuinely
    // arrives on a card already on screen.
    const hasHistory = olderReplies(b) > 0;
    box.classList.toggle("hashist", hasHistory);
    histctl.setAttribute("aria-hidden", hasHistory ? "false" : "true");
    histUp.disabled = !hasHistory;
    histDown.disabled = true;
    histUp.tabIndex = hasHistory ? 0 : -1;
    histDown.tabIndex = hasHistory ? 0 : -1;
    histctl.append(histUp, histDown, histPos);
    histUp.addEventListener("click", () => histStep(b.id, 1));
    histDown.addEventListener("click", () => histStep(b.id, -1));
    // the working spinner is placed with the chips below, in the sun's square.
    // apply() turns it on with the ticket's own green
    const cardSpin = makeCardSpinner();
    topbar.appendChild(histctl);
    box.appendChild(topbar);

    const head = h("div", "head");
    // the remove cross now renders on every card, not just meta boxes, so all cards share one design
    const x = h("button", "xbtn", "×");
    x.title = "done (an empty card is removed instead)\n" + SECTION_KEY_HINTS.done;
    x.addEventListener("click", async e => {
      e.stopPropagation();
      if (chipOff(x)) return;   // a done card: the cross has nothing left to do
      const { order, section } = cardDeparture(lastState, b.id);   // the list as it stands, before the close
      // the server reads the current record atomically, so a handler born with
      // an empty card can never erase replies that arrived on later polls
      await fetch(closeCardUrl(b.id), { method: "POST" }).catch(() => {});
      // dismiss this card from the center and jump to the next ongoing chat, so no extra click is needed
      selectNextCard(b.id, order, section);
      poll();
    });
    topbar.appendChild(x);   // the cross is an item of the bar now, not a pinned corner
    // the card's own number, its id; the same number the quick note's "card N" /
    // "cN" names. a change to the numbering has to be carried into the quick
    // note system as well: see the note on the outline's number above
    head.appendChild(h("span", "num", b.id));
    const titleEl = h("span", "title", omniCardTitle(b.title));   // Omni Card #N on the card itself
    titleEl.tabIndex = 0;
    // clicking or tabbing into the title starts an inline rename
    titleEl.addEventListener("mousedown", () => editTitle(b.id, { fromClick: true }));
    titleEl.addEventListener("focus", () => { if (!titleEl.isContentEditable) editTitle(b.id); });
    titleEl.addEventListener("paste", pasteIntoTitle);
    head.appendChild(titleEl);
    const wstat = h("span", "wstat");
    head.appendChild(wstat);
    // orange archive button: defers the card into the deferred tab (parks it)
    const arc = h("button", "arcbtn");
    arc.title = "defer to the deferred tab\n" + SECTION_KEY_HINTS.deferred;
    arc.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
    arc.addEventListener("click", e => { e.stopPropagation(); if (!chipOff(arc)) toggleFlag(b.id, "park"); });
    // the chip stands before the cross in the bar, the order the two corners
    // held: defer on the left of close
    topbar.insertBefore(arc, x);
    // and the sun before the moon, so the four read doing, docked, deferred, done
    // left to right, the order of the four sections
    const sun = sunChip("sunbtn", b.id);
    topbar.insertBefore(sun, arc);
    const dock = dockChip("dockbtn", b.id);
    topbar.insertBefore(dock, arc);
    // the working spinner follows the sun, and the bar's grid seats it in the
    // sun's own cell
    topbar.insertBefore(cardSpin, arc);
    box.appendChild(head);


    const body = h("div", "body");
    // the answer's own scroller, and the two things that ride inside it: the panel
    // holding what the answer was given, and the answer itself. the panel is the
    // first line of the scroll, so it leaves under the title as the reader scrolls
    // down exactly as the first paragraphs do, and the fades and the run-out below
    // stay on this one element that owns the scroll
    const replyview = h("div", "replyview");
    const reply = h("div", "reply cardmd");
    reply.dataset.raw = replyFull(b);
    reply.innerHTML = fmt(reply.dataset.raw);
    // the seat the panel holding what this answer was given is mounted into. it
    // is built with the card and stands empty until the board has a batch to
    // show for the reply the card is showing, so nothing is ever inserted
    // between the title and the answer on the frame the panel arrives, and an
    // empty seat takes no room of its own
    const answwrap = h("div", "answwrap");
    const meta = h("div", "meta");
    // transient notes (send failures) get their own span
    const metaNote = h("span");
    meta.append(metaNote);
    // the foot of the card: one wrapper laid over the answer, holding the send
    // failure note, the seat of the panel of sent messages, and the bar. the
    // seat stands empty and takes no room until something is sent
    const pendwrap = h("div", "pendwrap");
    const sentwrap = h("div", "sentwrap");
    const bottombar = h("div", "bottombar");
    const clipfile = h("input", "clipfile");
    clipfile.type = "file";
    clipfile.accept = CardMarkdown.ATTACHMENT_ACCEPT;
    clipfile.multiple = true;
    clipfile.tabIndex = -1;
    clipfile.setAttribute("aria-hidden", "true");
    const clip = h("button", "clipbtn");
    clip.type = "button";
    clip.setAttribute("aria-label", "attach a file");
    clip.title = "attach a file";
    clip.innerHTML = PLUS_ICON;
    const compose = h("div", "compose");
    const ta = h("textarea");
    ta.rows = 1;
    const send = h("button", "sendbtn");
    send.type = "button";
    send.setAttribute("aria-label", "send");
    send.innerHTML = SEND_ICON;
    compose.append(ta, send);
    bottombar.append(clipfile, clip, compose);
    pendwrap.append(meta, sentwrap, bottombar);
    // the column: the scroller holding the answered panel over the answer, and laid
    // over the answer at the card's floor the sent panel and the row the reader types in
    replyview.append(answwrap, reply);
    body.append(replyview, pendwrap);
    box.appendChild(body);

    const sec = statusOf(b);
    // slot in where the state array says this box belongs; during the initial
    // build the next box does not exist yet, so this appends in order
    const peers = state.boxes.filter(x => statusOf(x) === sec);
    const nextB = peers[peers.findIndex(x => x.id === b.id) + 1];
    const nextEl = nextB && els[nextB.id];
    if (nextEl && nextEl.box.parentNode === secEls[sec].list){
      secEls[sec].list.insertBefore(box, nextEl.box);
      tocGroups[sec].insertBefore(entry, nextEl.toc);
    } else {
      const addRow = secEls[sec].list.querySelector(":scope > .addrow");
      if (addRow) secEls[sec].list.insertBefore(box, addRow);
      else secEls[sec].list.appendChild(box);
      tocGroups[sec].appendChild(entry);
    }

    // the row's typed formatting, on when the setting says so. it is
    // wired before anything is hung on the field, because the field keeps one
    // public face whichever of the two it is wearing and the handle is what
    // carries a listener across a change of face. enter is the card's own
    // command here, so only shift enter is a new line for the list to carry
    const field = ComposeFormat.attach(ta, { newline: e => e.shiftKey });

    // the row's own autosize: back to auto, then up to the content, and the css
    // max-height caps it. the square's seat, its coming and going, and the ramp
    // at the row's head are read off the same keystroke, so the four can never
    // be a frame apart. the ramp is read here as well as on the scroll because a
    // keystroke at the cap moves the field's scroll without the wheel touching
    // it, and the height going to auto and back in the two lines above resets
    // that scroll under it
    const tick = () => {
      // a card that is not the selected one is display:none in focus mode, so
      // nothing on it is laid out and its field, or its editor scroller when the
      // row wears its formatted face, measures a zero height. an async caller
      // that lands after the reader has switched away, a web font settling or an
      // upload finishing, would then write that zero over a retained draft's
      // kept height and leave one line behind until the next keystroke. skip the
      // write while the row has no box; select() re-measures it on the way back.
      // clientHeight reads the active scroller through the field's own proxy, so
      // it is the visible surface that is checked and not the hidden textarea,
      // and offsetParent catches a display:none anywhere above it.
      if (!ta.offsetParent || !ta.clientHeight) return;
      ta.style.height = "auto";
      ta.style.height = ta.scrollHeight + "px";
      seatSquare(ta, send);
      send.classList.toggle("show", ta.value.trim().length > 0 || arrowAgainFor(b.id));
      riseBand(ta);
    };
    ta.addEventListener("input", () => {
      cancelAutoNext();
      tick();
      // the moment of the last key, which is what holds a new answer back
      // while the reader is typing (turnHolding in card-logic.js)
      noteTyping(ta);
    });
    // a click into the composer or a key typed there is using the card
    readOnCompose(ta, b.id, useCard);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(tick);
    tick();
    wireAttachmentTransfer(ta);
    ta.addEventListener("keydown", e => composerEnter(e, b.id));
    // both controls swallow the press while the box has the focus, the way the
    // chat bar does it, so the caret never leaves the words
    send.addEventListener("pointerdown", e => { if (ComposeFormat.focused(ta)) e.preventDefault(); });
    send.addEventListener("click", () => composerArrow(b.id));
    // the plus hands the press straight to the hidden picker, and what comes
    // back goes up the board's own /upload road, the same one a dropped image
    // takes, so a picked file and a dropped one land in exactly one place
    clip.addEventListener("pointerdown", e => { if (ComposeFormat.focused(ta)) e.preventDefault(); });
    clip.addEventListener("click", () => clipfile.click());
    clipfile.addEventListener("change", async () => {
      const files = [...(clipfile.files || [])];
      clipfile.value = "";   // so the same file picked twice fires twice
      await attach(files, ta);
    });
    head.addEventListener("click", () => {
      if (box.classList.contains("done") || box.classList.contains("waiting") || box.classList.contains("parked"))
        box.classList.toggle("peek");
    });

    /* Worktree selector event wiring, intentionally dormant with its UI above.
    // the worktree list, one per card and reaching only into its own bar, so
    // opening one card's list can never write another card's name. the names
    // are the lane's own, fetched from git through /worktrees and never typed:
    // a worktree name has to point at a worktree that exists
    wtpick.addEventListener("click", async e => {
      e.stopPropagation();   // or the document handler below shuts it again
      const open = !wtmenu.classList.contains("open");
      wtmenu.classList.toggle("open", open);
      wtpick.setAttribute("aria-expanded", open ? "true" : "false");
      if (!open) return;
      const wt = await laneWorktrees(b.owner);
      wtmenu.textContent = "";
      for (const n of wt.names){
        const row = h("button", null, n);
        row.type = "button";
        wtmenu.appendChild(row);
      }
    });
    wtpick.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); wtpick.click(); }
    });
    wtmenu.addEventListener("click", async e => {
      const row = e.target.closest("button");
      if (!row) return;
      e.stopPropagation();
      shutWtMenu(wtpick, wtmenu);
      // the name lands on the card and not only on the label: the server holds
      // it, so a reload or another window shows the same name. the poll below
      // writes the label back from the state either way
      bname.textContent = row.textContent;
      await fetch("/worktree?box=" + encodeURIComponent(b.id) +
                  "&name=" + encodeURIComponent(row.textContent),
                  { method: "POST" }).catch(() => {});
      poll();
    });
    */

    els[b.id] = { box, reply, replyview, meta, metaNote, histctl, histPos, histUp, histDown,
                  ta, send, wstat, toc: entry, sec,
                  titleEl, tocTitle: entry.querySelector(".ttitle"), sun, dock, arc, x,
                  topbar, cardSpin, branch, bname, wtpick, wtmenu, hasWt: false, hasHistory,
                  historyVersion: null,
                  // answ is null until the card shows a reply the board recorded
                  // a batch for, and null again the moment it shows one it did
                  // not. answId is the name of the reply the panel is drawn for,
                  // which is what a poll compares against
                  answwrap, answ: null, answId: null,
                  // sent is null until something is sent and null again the moment
                  // the answer to it lands. sentItems is what it was drawn from,
                  // each message with where it stands with the agent, which a
                  // send adds to before the board's next reading says so
                  sentwrap, sent: null, sentKey: "", sentItems: [],
                  pendwrap, bottombar, clip, clipfile, tick, field };
    const sentCard = els[b.id];
    sentCard.sentRoom = () => sentRoom(sentCard);
    syncOmniCard(els[b.id], b);
    paintSectionChips(els[b.id], b);
    // the ramp's top edge follows the wrapper from the card's first frame, panel
    // or no panel, so it is armed here and not when a panel is built
    watchBand(els[b.id]);
    // and the ramps at the head of the two things that scroll on this card: the
    // answer under the title, and the row the reader types in under the bar's hairline
    watchRise(replyview);
    watchRise(ta);
    // and the reader's own scrolling of the answer, which holds a page turn back
    watchReading(els[b.id]);

    // explicit focus ring: title -> text -> attach -> send -> cross -> moon -> sun -> (wrap)
    const ring = [titleEl, ta, clip, send, x, arc, dock, sun];
    for (const node of [ta, clip, send, x, arc, dock, sun]){
      node.addEventListener("keydown", e => {
        if (e.key === "Tab"){
          e.preventDefault();
          const idx = ring.indexOf(node);
          const next = (idx + (e.shiftKey ? -1 : 1) + ring.length) % ring.length;
          ring[next].focus();
        }
      });
    }
}

  const fb = localStorage.getItem("focusbox");
  if (fb && els[fb]){

    else els[fb].box.scrollIntoView({ block: "center" });

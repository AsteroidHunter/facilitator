// one way to make a card, for the plus buttons and the new card key alike. Landing
// on it does not wait for a reading: one already in flight can have drawn the
// card before this answer got here, and then no later draw is left to land on it
async function newCard(owner){
  const r = await fetch("/create?owner=" + encodeURIComponent(owner), { method: "POST" })
    .then(x => x.json()).catch(() => null);
  if (!r?.id) return;
  // a reading asked for before this answer may not have the card, and once it is
  // on the page a reading that lacks it would take it away again (see poll)
  createSeq = pollSeq;
  localStorage.setItem("focusbox", r.id);
  if (els[r.id]) landFocus();
  else await poll();   // the reading that draws the card lands on it
}

// a copied line ends in a break that the title's wrapping hides, leaving the caret no spot to draw at
function pasteIntoTitle(e){
  if (!e.currentTarget.isContentEditable) return;
  const words = e.clipboardData && e.clipboardData.getData("text/plain");
  if (!words) return;
  e.preventDefault();
  const line = words.replace(/^\s*[\r\n\u2028\u2029]\s*|\s*[\r\n\u2028\u2029]\s*$/g, "")
    .replace(/\s*[\r\n\u2028\u2029]\s*/g, " ");
  if (line) document.execCommand("insertText", false, line);
}

// editTitle is shared with the phone page in card-logic.js. the desktop's
// keyboard path through the title, Tab commits and moves on and Escape hands
// focus back to the composer, is switched on here
keyboardTitle = true;

// Enter and the card's send arrow each send and stay on their first press.
// Their separate second presses inside this window move after confirmation.
let autoNext = null;
const AUTONEXT_MS = 0;   // future user setting: quiet time after a send before moving on
const ENTER_AGAIN_MS = 700;
let enterAgain = null;   // transient by design; a reload never revives a move
function enterViewKey(id){
  const ws = lastState && curWs(lastState);
  return [id, activeOwner, curView(), ws ? ws.id : ""].join("|");
}
function clearEnterAgain(intent = enterAgain){
  if (!intent) return;
  clearTimeout(intent.timer);
  intent.active = false;
  if (enterAgain === intent) enterAgain = null;
  if (intent.source === "arrow") els[intent.id]?.tick();
}
function arrowAgainFor(id){
  return !!(enterAgain?.active && !enterAgain.advance && enterAgain.source === "arrow" &&
    enterAgain.id === id && enterViewKey(id) === enterAgain.view &&
    Date.now() <= enterAgain.deadline);
}
function cancelAutoNext(){
  clearTimeout(autoNext); autoNext = null;
  clearEnterAgain();
}
function scheduleDesktopAdvance(id, intent = null){
  clearTimeout(autoNext);
  autoNext = setTimeout(() => {
    autoNext = null;
    if (intent){
      const valid = intent.active && enterAgain === intent && intent.advance &&
        enterViewKey(id) === intent.view;
      clearEnterAgain(intent);
      if (!valid) return;
    }
    boardAdvance(id);
  }, AUTONEXT_MS);
}
// the move a double Enter's second press makes, and control+enter makes at
// once: to the card that has waited longest, with the caret in its composer
function boardAdvance(id){
  if (FOCUS && selectedId === id) jumpNextYellow(id, { focus: true });
}
function armEnterAgain(id, source = "enter"){
  cancelAutoNext();
  const intent = {
    id, source, view: enterViewKey(id), deadline: Date.now() + ENTER_AGAIN_MS,
    delivered: false, advance: false, active: true, timer: null,
  };
  intent.timer = setTimeout(() => {
    if (enterAgain === intent && !intent.advance) clearEnterAgain(intent);
  }, ENTER_AGAIN_MS);
  enterAgain = intent;
  if (source === "arrow") els[id]?.tick();
  return intent;
}
function askEnterAdvance(id, source = "enter"){
  const intent = enterAgain;
  if (!intent || !intent.active || intent.source !== source || intent.id !== id || enterViewKey(id) !== intent.view) return false;
  if (intent.advance) return true;
  if (Date.now() > intent.deadline) return false;
  intent.advance = true;
  clearTimeout(intent.timer);
  if (source === "arrow") els[id]?.tick();
  if (intent.delivered) scheduleDesktopAdvance(id, intent);
  return true;
}
function composerArrow(id){
  if (arrowAgainFor(id) && askEnterAdvance(id, "arrow")) return;
  const el = els[id];
  if (!el?.ta.value.trim()) return;
  const intent = armEnterAgain(id, "arrow");
  doSend(id, { advance: false, enterIntent: intent });
}
function composerEnter(e, id){
  if (e.key !== "Enter" || e.shiftKey || e.altKey || e.isComposing) return;
  e.preventDefault();
  if (e.repeat) return;
  const el = els[id];
  if (!el) return;
  // control+enter is a double Enter pressed at once: the send, then the move
  // once the board has the message
  const now = controlEnter(e);
  if (!el.ta.value.trim()){
    if (askEnterAdvance(id)) return;
    cancelAutoNext();
    if (now) boardAdvance(id);
    return;
  }
  const intent = armEnterAgain(id);
  doSend(id, { advance: false, enterIntent: intent });
  if (now) askEnterAdvance(id);
}

// jumpNextYellow and stampText live in card-logic.js, shared with the phone page

// writing to a done, docked or parked card takes it back to doing. /send clears docked and parked
// on the server for every sender. The done flag is read here before the send
// and flipped after the message is in, so a flip that fails can never eat it
function undone(id){
  fetch("/done?box=" + encodeURIComponent(id) + "&v=0", { method: "POST" })
    .then(() => poll()).catch(() => {});
}

async function doSend(id, opts){
  opts = opts || {};
  const el = els[id];
  const text = el.ta.value.trim();
  if (!text) return;
  const reopen = boxDone(id);   // before the send; the poll below clears the flag
  const followView = captureSentView(id);
  // the words leave the row at the press and stand in the sent panel; one that
  // does not get through stays there under its mark, and the cross gives them back
  const motion = armSentMotion(el);
  el.ta.value = "";
  el.tick();
  // The empty arrow remains tappable while its first delivery is in flight.
  const send = el.send;
  send.disabled = !opts.enterIntent || opts.enterIntent.source !== "arrow";
  // the message comes into a bubble of its own at the press, faded and cut to
  // its preview, under any bubble already standing, which is cut back if it
  // stood open; the two join once they stand in one place (sentCoalesce). it is
  // faded until the board has saved it, which is what would be lost if the
  // page closed now. it goes under an operation id of its own, so the arrow on
  // a failed one sends it again without it ever landing twice
  const sentItem = sentLaunch(el, text, "/send?box=" + encodeURIComponent(id));
  motion?.play();
  sentItem.landed = () => {
    if (followView()) renderCarousel(lastState);
    if (hist && hist.id === id) histExit(id);   // a send lands you back on the live reply
    if (reopen) undone(id);   // the message is in; the flip rides behind it
    poll();
  };
  try {
    const result = await sentTry(sentItem);
    if (result === "landed"){
      // the board has it: Delivered, at full ink, until the board says more. the
      // list is marked as the one on screen, so the reading behind this brings
      // nothing it does not already hold, and a reading asked for before the
      // board had it may not take it away again
      sentLanded(el, sentItem);
      sentItem.landed();
      if (opts.enterIntent){
        opts.enterIntent.delivered = true;
        if (opts.enterIntent.active && opts.enterIntent.advance)
          scheduleDesktopAdvance(id, opts.enterIntent);
      } else if (opts.advance !== false){
        cancelAutoNext();
        scheduleDesktopAdvance(id);
      }
    } else {
      sentFailed(el, sentItem, result === "refused");
      if (opts.enterIntent) clearEnterAgain(opts.enterIntent);
    }
  } finally {
    el.send.disabled = false;
  }
}
// the arrow and the cross on a message of this page that did not get through,
// on the large card and on the small one alike (sentRetry, sentCross)
function sentMarkAct(el, id, act){
  const item = (el.sentHeld || []).find(m => m.op === id);
  if (!item) return;
  if (act === "retry") sentRetry(el, item);
  else if (act === "cross") sentCross(el, item);
}

// ---- older replies --------------------------------------------------------
// control shift up steps the selected card back through its past agent
// replies, control shift down returns toward live: histStep, histExit and
// histList are shared with the phone page in card-logic.js

function setDesktopHistoryAvailability(id, hasHistory){
  const el = els[id];
  if (!el || el.hasHistory === hasHistory) return;
  if (!hasHistory && hist && hist.id === id) histExit(id);
  el.hasHistory = hasHistory;
  el.box.classList.toggle("hashist", hasHistory);
  el.histctl.setAttribute("aria-hidden", hasHistory ? "false" : "true");
  el.histUp.tabIndex = hasHistory ? 0 : -1;
  el.histDown.tabIndex = hasHistory ? 0 : -1;
  el.histUp.disabled = !hasHistory;
  el.histDown.disabled = true;
}

async function syncDesktopHistoryAvailability(id){
  const el = els[id];
  if (!el) return;
  const raw = el.reply.dataset.raw;
  const version = el.historyVersion;
  const list = await histList(id);
  // A reply or note can land while the history request is in flight. Only the
  // result for the still-current card version may change its controls.
  if (els[id] !== el || el.reply.dataset.raw !== raw || el.historyVersion !== version) return;
  // A request that failed knows nothing about this card and must not take the
  // marks off a card the board itself said has older replies; the poll after
  // it asks again. Only an answer the board gave may change them.
  if (list === HIST_UNKNOWN) return;
  setDesktopHistoryAvailability(id, list.length > 0);
}

function apply(state){
  for (const id of Object.keys(els)){    // deleted boxes leave the page
    if (!state.boxes.some(b => b.id === id)){
      if (hist && hist.id === id) hist = null;
      delete histCache[id];
      // the row's typed formatting is held by the formatter as well as by this
      // card, so the card takes it with it: without this the editor and the
      // removed card stay reachable for the rest of the page's life
      els[id].field?.detach();
      // and the watches on its two panels' sizes go with it
      dropAnswered(els[id], null);
      els[id].sentRoom = null;
      dropSent(els[id]);
      els[id].box.remove(); els[id].toc.remove(); delete els[id];
    }
  }
  // a selection carried over from another lane (a reload into an empty lane,
  // or the selected card's lane changing) never renders on this tab
  if (FOCUS && selectedId && activeOwner !== DRAFT){
    const sb = state.boxes.find(x => x.id === selectedId);
    if (!sb || sb.owner !== activeOwner) deselect();
  }

  // scroll anchor: whatever you're typing in (else the box under the viewport
  // center — what you're reading) must not move when boxes above fold/expand.
  // Focus mode shows one box, so there is nothing to anchor against.
  let anchorEl = null, anchorTop = 0;
  if (!FOCUS){
    // whatever is being typed in, which is the plain field or the editor the
    // typed formatting puts in its place
    const typing = document.activeElement;
    const focusEl = typing && (typing.tagName === "TEXTAREA" ||
      (typing.closest && typing.closest(".cffield"))) ? typing : null;
    anchorEl = focusEl ? focusEl.closest(".box") : null;
    if (!anchorEl) anchorEl = document.elementFromPoint(innerWidth / 2, innerHeight / 2)?.closest(".box") || null;
    if (!anchorEl) anchorEl = [...document.querySelectorAll(".box")].find(x => x.getBoundingClientRect().bottom > 60);
    anchorTop = anchorEl ? anchorEl.getBoundingClientRect().top : 0;
  }

  // new boxes appear in place (no reload, no white flash); the anchor
  // correction below absorbs any shift they cause above the viewport
  for (const b of state.boxes){
    if (!els[b.id]){
      makeBox(b, 0, state);
      landFocus();
    }
  }

  for (const b of state.boxes){
    const el = els[b.id];
    if (!el) continue;
    const rawReply = replyFull(b);
    // a new answer on the card on show turns the page (card-logic.js): the sheet
    // over the page the reader was on is laid here, before anything of the new
    // one is drawn, and turnGo below glides it once the new page stands under
    // it. while the reader is busy with the card the new answer is held back,
    // and this pass leaves the answer and both panels exactly as they stand
    const turn = el.reply.dataset.raw !== rawReply ? turnBegin(el, b) : null;
    const held = turn === TURN_HELD;
    if (!held && el.reply.dataset.raw !== rawReply){
      el.reply.dataset.raw = rawReply;
      delete histCache[b.id];   // a fresh reply outdates the cached history
      if (hist && hist.id === b.id) histExit(b.id);   // and snaps a history view back to live
      else{
        el.reply.innerHTML = fmt(rawReply);
        if (!turn) headOnSwap(el, b);
      }
      // a new answer is a new line count in the same room, so the phase goes
      if (b.id === selectedId) requestAnimationFrame(snapCard);
    }
    // Notes and final replies both change the aggregate count, including when
    // their visible text happens to match, and both change what the stepper
    // can walk. Drop the cached list in either case and take the marks from
    // the count the board sent until the new list lands: a note over the one
    // reply makes that reply an older page, a second reply on the open card
    // makes one too and fades its marks in.
    const historyVersion = b.replies || 0;
    if (el.historyVersion !== historyVersion){
      el.historyVersion = historyVersion;
      delete histCache[b.id];
      setDesktopHistoryAvailability(b.id, olderReplies(b) > 0);
    }
    // a reply landing on the selected card while the window is in front is read
    // as it lands. a browsed card is not read
    readOnArrival(el, b, b.id === selectedId && !browsing);
    // the card reads its own name, Omni Card #N for an Omni ticket, and the
    // outline keeps the stored title. an Omni sweep in flight writes both itself
    if (!el.titleEl.isContentEditable && !el.omniSweep){
      const shown = omniCardTitle(b.title);
      if (el.titleEl.textContent !== shown) el.titleEl.textContent = shown;   // first message just named a new box
      if (el.tocTitle.textContent !== b.title) el.tocTitle.textContent = b.title;
    }
    syncOmniCard(el, b);
    /* Worktree selector redraw, intentionally dormant with its UI and wiring.
    // the bar's worktree name, written only when it has actually changed: this
    // runs on every poll and rewriting a text node under a pointer is enough to
    // drop a hover
    const wtl = branchLabel(b);
    if (el.bname.textContent !== wtl) el.bname.textContent = wtl;
    // and whether the bar carries a fork at all. this runs on every poll too,
    // so the class is written only on the flip, which happens once per lane when
    // its names land. an open list on a lane that has just lost its names is
    // shut in the same breath, since the thing that opened it is going away
    const hasWt = laneHasBranches(b.owner);
    if (el.hasWt !== hasWt){
      el.hasWt = hasWt;
      el.branch.classList.toggle("norepo", !hasWt);
      if (!hasWt) shutWtMenu(el.wtpick, el.wtmenu);
    }
    */
    // the sent panel, drawn from what the board still holds unanswered and
    // where each of those messages stands with the agent (sentFrom). a pass
    // bringing the same list touches no dom at all, and a reading asked for
    // before this page's own last send landed knows nothing of it and may not
    // take it away
    if (!held && (state.fetchedAt || 0) >= (el.sendGuard || 0)){
      el.sentItems = sentFrom(b);
      syncSent(el, el.sentItems);
    }
    // and the panel over the answer: the reply the card is showing, and the
    // messages the board recorded that reply was given. while an older page is
    // on show the stepper owns that panel, so the poll leaves it alone and
    // histExit is what hands it back to the live reply. the pass compares the
    // reply's own name, so a poll carrying the same reply again touches no dom
    // at all and nothing near the composer moves
    if (!held){
      el.liveMeta = liveAnswered(b);
      if (!(hist && hist.id === b.id)) syncAnswered(el, el.liveMeta);
    }
    // the new page stands under the sheet: the glide and the print
    turnGo(el, turn);
    const cs = cardState(b);   // one state: box color, left tab, and toc all read it
    el.box.classList.toggle("done", cs === "done");
    el.box.classList.toggle("parked", cs === "parked");
    el.box.classList.toggle("docked", cardSection(b) === "docked");
    paintSectionChips(el, b);
    setCardSpinner(el.cardSpin, cardSpinning(b));
    const s = statusOf(b);
    if (el.sec !== s){
      secEls[s].list.appendChild(el.box);
      tocGroups[s].appendChild(el.toc);
      el.sec = s;
    }
    // waiting is the box's own liveness overlay: writing is the live claim
    // (bg alone never collapses the box) and pending is the unread count,
    // neither of which the collapsed state carries; the done gate reads state
    const waiting = cs !== "done" && (b.writing || b.pending > 0);
    el.box.classList.toggle("waiting", waiting);
    if (!waiting && cs !== "done") el.box.classList.remove("peek");
    const ws = b.writing ? '<span class="w2">' + laneName(b.owner) + ' is writing</span>'
             : (b.queuePos ? "sent ✓ " + ord(b.queuePos) + " in line" : "");
    if (el.wstat.innerHTML !== ws) el.wstat.innerHTML = ws;  // rewriting every poll restarts the dots and re-wraps the title row
    // the queue chatter (sent, nth in line, messages since) is gone. a click on
    // the moon the board refused or never answered leaves its own note; it says
    // what the card is NOT, so a poll may not take it away
    if (el.metaNote.textContent && el.metaNote.dataset.flagnote !== "1") el.metaNote.textContent = "";
    if (el.toc){
      // quirk kept: pending queues the entry even when the ball sits with you;
      // otherwise yours (or a new card whose ball is with you) paints t-you,
      // all off the one state
      el.toc.className = "toc-entry " + (
        cs === "done" ? "t-done" : cs === "parked" ? "t-later" : cs === "working" ? "t-writing" : b.pending > 0 ? "t-queued" :
        (cs === "yours" || (cs === "new" && b.ball === "you")) ? "t-you" : "") + (FOCUS && b.id === selectedId ? " t-sel" : "");
      el.toc.style.display = (FOCUS && b.owner !== activeOwner) ? "none" : "";
      el.toc.querySelector(".tage").textContent = age(b.ts);
    }
  }
  if (anchorEl){
    const delta = anchorEl.getBoundingClientRect().top - anchorTop;
    // behavior:"instant" — the page's smooth scroll-behavior would animate the
    // correction into a visible glide, which IS the shift we're preventing
    if (delta) window.scrollBy({ top: delta, left: 0, behavior: "instant" });
  }
  applySelection(state);
  // board title comes from state (seeded via seed.json), not from the page
  if (state.title && document.title !== state.title){
    document.title = state.title;
    const nm = document.getElementById("boardname");
    const sp = state.title.indexOf(" ");
    nm.textContent = "";
    if (sp > 0){
      nm.append(state.title.slice(0, sp) + " ");
      const em = document.createElement("em");
      em.textContent = state.title.slice(sp + 1);
      nm.append(em);
    } else nm.textContent = state.title;
  }
  // the per-section counts still speak for the active tab only
  const scope = FOCUS ? state.boxes.filter(x => x.owner === activeOwner) : state.boxes;
  for (const [key] of SECTIONS){
    secEls[key].cnt.textContent = scope.filter(x => statusOf(x) === key).length;
    const visible = [...tocGroups[key].children]
      .filter(c => c.classList.contains("toc-entry") && c.style.display !== "none").length;
    tocGroups[key].style.display = visible ? "" : "none";
  }
  renderTabs(state);
  renderPages(state);   // the foot of the workspace, and whether the board is on this page at all
  if ((draft && draft.screen === "home") || homeOpen) renderHome(state);   // new lanes join the landing card live
  if (FOCUS){
    renderWorkspaces(state);
    renderTrio(state);
    renderCarousel(state);
    renderMiniCards(state);
  }

  // listener presence, per agent: each is either long-polling (listening),
  // composing a claimed reply (busy), or recently between the two. Otherwise: offline.
  const offOwners = Object.keys(state.listening || NAME).filter(ow =>
    (state.everListened || {})[ow] &&
    !state.listening[ow] && !state.busy[ow] && state.listenerGap[ow] > 300);
  document.body.classList.toggle("offline", offOwners.length > 0);
  if (offOwners.length){
    document.getElementById("offline").textContent =
      "Offline: " + offOwners.map(ow => laneName(ow) + " (last heard " +
      Math.round(state.listenerGap[ow] / 60) + " min ago)").join(", ") +
      ". Messages still queue safely; replies resume when that terminal side wakes.";
    // the bar's own status line went with the strip; the banner below says it
  }
}

// ---- the clock: day, time, date, plain text, upper left -------------------
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
function tickClock(){
  const n = new Date();
  let hr = n.getHours();
  const ap = hr >= 12 ? "PM" : "AM";
  hr = hr % 12 || 12;
  const day = DAYS[n.getDay()];
  const time = hr + ":" + String(n.getMinutes()).padStart(2, "0") + ":" +
               String(n.getSeconds()).padStart(2, "0") + " " + ap;
  const date = MONTHS[n.getMonth()] + " " + ord(n.getDate());
  document.getElementById("ck-day").textContent = day;
  document.getElementById("ck-time").textContent = time;
  document.getElementById("ck-date").textContent = date;
}

// ---- workspaces and the trio (rail / goal box / task box) -----------------
// One class of element: all three render from the same workspace record and
// post to the same endpoints the agent uses.
let selectedWs = null;    // workspace within the active project
let selectedTask = null;  // task picked by clicking its dot
let taskFilter = null;    // when set, the carousel shows that task's chats
// the left panel's tab (doing, docked, deferred, done) is one choice per project and
// lives in card-logic.js; curView() answers with the open project's own

function curWs(state){
  const list = (state.workspaces || {})[activeOwner] || [];
  return list.find(w => w.id === selectedWs) || list[0] || null;
}

async function api(path, body){
  try { await fetch(path, { method: "POST", body: body || "" }); } catch (e) {}
  poll();
}

function renderWorkspaces(state){
  const el = document.getElementById("wslist");
  const list = (state.workspaces || {})[activeOwner] || [];
  const cur = curWs(state);
  const sig = activeOwner + "|" + list.map(w => w.id + w.name).join(",") + "|" + (cur && cur.id);
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  el.textContent = "";
  for (const w of list){
    const r = h("div", "wsrow" + (cur && w.id === cur.id ? " on" : ""), w.name);
    r.addEventListener("click", () => {
      cancelAutoNext();
      selectedWs = w.id; selectedTask = taskFilter = null; apply(lastState);
    });
    el.appendChild(r);
  }
}

function fmtStart(ts){
  if (!ts) return "";
  const d = new Date(ts * 1000);
  return MONTHS3[d.getMonth()] + " " + ord(d.getDate());
}

function taskOf(w, tid){ return w ? w.tasks.find(t => t.id === tid) : null; }

function selectTask(tid){
  selectedTask = selectedTask === tid ? null : tid;
  taskFilter = null;   // selection highlights chats now, never filters them
  if (lastState) apply(lastState);
}

function renderTrio(state){
  const w = curWs(state);
  const dots = document.getElementById("rail-dots");
  const start = document.getElementById("rail-start");
  const goalT = document.getElementById("goaltext");
  const taskT = document.getElementById("tasktext");
  start.textContent = w ? fmtStart(w.started) : "";
  goalT.dataset.empty = "goal";
  taskT.dataset.empty = "current task";
  if (!goalT.querySelector("input")) goalT.textContent = (w && w.goal) || "";
  const shown = w && (taskOf(w, selectedTask) || taskOf(w, w.current));
  if (!taskT.querySelector("input")) taskT.textContent = shown ? shown.text : "";
  const sig = w ? w.id + "|" + w.tasks.map(t => t.id + t.status).join(",") + "|" + selectedTask : "";
  if (dots.dataset.sig === sig) return;
  dots.dataset.sig = sig;
  dots.textContent = "";
  if (!w) return;
  for (const t of w.tasks){
    const d = h("span", "dotk " + t.status + (t.id === selectedTask ? " sel" : ""));
    d.title = t.text || "(unnamed task)";
    d.addEventListener("click", () => selectTask(t.id));
    dots.appendChild(d);
  }
  const line = document.getElementById("rail-line");
  line.querySelector(".dotk.goal")?.remove();
  const g = h("span", "dotk goal");
  g.title = (w.goal || "the goal") + " (the reason this workspace exists)";
  g.addEventListener("mouseenter", () => document.getElementById("goalbox").classList.add("lit"));
  g.addEventListener("mouseleave", () => document.getElementById("goalbox").classList.remove("lit"));
  line.appendChild(g);
  document.getElementById("taskchip").textContent = "";
}

// inline edit for the trio's texts: swap the span for an input; Enter saves
function inlineEdit(spanEl, initial, onSave){
  if (spanEl.querySelector("input")) return;
  spanEl.textContent = "";
  const inp = document.createElement("input");
  inp.value = initial || "";
  spanEl.appendChild(inp);
  inp.focus();
  inp.select();
  const finish = save => {
    const v = inp.value.trim();
    spanEl.textContent = initial || "";
    if (save) onSave(v);
  };
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter"){ e.preventDefault(); finish(true); }
    if (e.key === "Escape") finish(false);
    e.stopPropagation();
  });
  inp.addEventListener("blur", () => finish(false));
}

// ---- card state: the single home of state decisions -----------------------
// one name per card: done, parked, working, new, yours, queued. consumers
// map the name to their own classes, group numbers, and colors; the two
// helpers under it keep old per-site quirks exactly as they were.
// magic box 1: a Spotify player on the same liquid glass the board's down
// button uses. signs in with the flow Spotify calls PKCE, which needs no
// secret. the app id is machine-local: it rides in on the board state from
// run.config.json, so the page ships without one and each board uses its own
let SPOT_ID = "";
// where Spotify sends the sign-in back: this page's own address, so it follows
// the board to whatever port it is on. Spotify takes only the return addresses
// registered for the app id; a loopback one registered with no port stands for
// every port
const SPOT_REDIRECT = location.origin + "/";
const SPOT_SCOPES = "user-read-playback-state user-modify-playback-state "
  + "user-read-currently-playing user-library-read user-library-modify";
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const SPOT_ICON = {
  // drawn off the reference: solid, chunky, double triangles, no disc
  prev: '<svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M11.4 6.6v10.8L3.6 12zM21 6.6v10.8L13.2 12z"/></svg>',
  next: '<svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M12.6 6.6v10.8L20.4 12zM3 6.6v10.8L10.8 12z"/></svg>',
  play: '<svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M6.6 4.4l13.4 7.6-13.4 7.6z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><rect x="6.2" y="4" width="4.6" height="16" rx="1.5"/><rect x="13.2" y="4" width="4.6" height="16" rx="1.5"/></svg>',
  heart:'<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.6-7 9-7 9z"/></svg>',
  heartO:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19.5s-6.3-4-6.3-8.3a3.5 3.5 0 0 1 6.3-2.2 3.5 3.5 0 0 1 6.3 2.2c0 4.3-6.3 8.3-6.3 8.3z"/></svg>',
};

async function spotConnect(){
  const bytes = crypto.getRandomValues(new Uint8Array(64));
  const verifier = b64url(bytes.buffer);
  localStorage.setItem("spot.verifier", verifier);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const url = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
    client_id: SPOT_ID, response_type: "code", redirect_uri: SPOT_REDIRECT,
    scope: SPOT_SCOPES, code_challenge_method: "S256", code_challenge: challenge,
  });
  window.open(url, "spotify-connect", "width=520,height=720");
}
function spotCreateAppId(){
  // no app id is configured yet, so there is nothing to sign into. open
  // Spotify's dashboard in a new tab to make an app and copy its id into the
  // machine-local config
  window.open("https://developer.spotify.com/dashboard", "_blank", "noopener");
}
function spotResetStub(){
  // the connect and create stubs differ only by whether an id is set. when the
  // id arrives on the state after the stub was already drawn, redraw it so a
  // configured board never keeps the create prompt. a built player never wears
  // the stub and is left untouched
  const host = document.getElementById("magic1");
  if (host && host.querySelector(".spconnect")){
    host.classList.remove("filled");
    spotBuild();
  }
}
addEventListener("message", async e => {
  if (e.origin !== location.origin || !e.data || !e.data.spotifyCode) return;
  await spotExchange(e.data.spotifyCode);
  const host = document.getElementById("magic1");
  if (host){ host.classList.remove("filled"); host.dataset.ready = ""; }
  spotBuild(); spotPoll();
});
async function spotExchange(code){
  const verifier = localStorage.getItem("spot.verifier") || "";
  try {
    const r = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ client_id: SPOT_ID, grant_type: "authorization_code",
        code, redirect_uri: SPOT_REDIRECT, code_verifier: verifier }),
    }).then(x => x.json());
    if (r.access_token) spotStore(r);
  } catch (e) {}
}
async function spotClaimCode(){
  const code = new URLSearchParams(location.search).get("code");
  if (!code) return;
  history.replaceState({}, "", location.pathname);
  await spotExchange(code);
}
// the sign-in is the board's, kept beside its settings (/spotify/session), so
// the board opened at another port needs no new sign-in. Only a page on this
// Mac is answered there: the board opened any other way, through the phone
// bridge say, or against an older server, keeps its sign-in in this browser's
// storage as it always did. spotSession is what the player reads; until the
// board has answered it is empty and the stub is drawn, and the stub is drawn
// again once a sign-in arrives (spotResetStub)
const SPOT_KEYS = { access: "spot.access", refresh: "spot.refresh", expires: "spot.expires", scopes: "spot.scopes" };
let spotSession = {};
let spotOnBoard = false;
function spotFromBrowser(){
  const out = {};
  for (const [field, key] of Object.entries(SPOT_KEYS)){
    const v = localStorage.getItem(key);
    if (v !== null) out[field] = v;
  }
  return out;
}
async function spotLoad(){
  try {
    const r = await fetch("/spotify/session");
    if (!r.ok) throw new Error("the board keeps no sign-in here");
    spotSession = await r.json();
    spotOnBoard = true;
    // the one-time copy of a sign-in this browser already held, offered only
    // while the board keeps none; the browser's own copy is left as it was
    const mine = spotFromBrowser();
    if (!spotSession.refresh && mine.refresh && !localStorage.getItem("spot.copied")){
      const res = await fetch("/spotify/session?seed=1", { method: "POST", body: JSON.stringify(mine) });
      if (res.ok){
        const { ok, seeded, ...kept } = await res.json();
        spotSession = kept;
      }
    }
    localStorage.setItem("spot.copied", "1");
  } catch (e) {
    spotOnBoard = false;
    spotSession = spotFromBrowser();
  }
  spotResetStub();
}
const spotLoaded = spotLoad();
function spotStore(r){
  spotSession = { scopes: SPOT_SCOPES, access: r.access_token,
                  refresh: r.refresh_token || spotSession.refresh || "",
                  expires: String(Date.now() + (r.expires_in || 3600) * 1000 - 60000) };
  if (spotOnBoard){
    fetch("/spotify/session", { method: "POST", body: JSON.stringify(spotSession) }).catch(() => {});
    return;
  }
  for (const [field, key] of Object.entries(SPOT_KEYS))
    if (spotSession[field]) localStorage.setItem(key, spotSession[field]);
}
async function spotToken(){
  await spotLoaded;
  const fresh = () => spotSession.access && Date.now() < +(spotSession.expires || 0) ? spotSession.access : null;
  if (fresh()) return fresh();
  // another window may have renewed it already, and a renewal can retire the
  // renewal token it used, so the board is asked again before renewing here
  if (spotOnBoard){
    try {
      const r = await fetch("/spotify/session");
      if (r.ok) spotSession = await r.json();
    } catch (e) {}
    if (fresh()) return fresh();
  }
  const rt = spotSession.refresh;
  if (!rt) return null;
  try {
    const r = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ client_id: SPOT_ID, grant_type: "refresh_token", refresh_token: rt }),
    }).then(x => x.json());
    if (r.access_token){ spotStore(r); return r.access_token; }
  } catch (e) {}
  return null;
}
async function spotCall(path, method){
  const t = await spotToken();
  if (!t) return null;
  const r = await fetch("https://api.spotify.com/v1" + path,
    { method: method || "GET", headers: { Authorization: "Bearer " + t } }).catch(() => null);
  if (!r) return null;
  if (r.status === 204 || r.status === 202) return {};
  if (!r.ok) return null;
  return r.json().catch(() => ({}));
}

let spotState = { playing:false, id:null, kind:"track", shuffle:false, repeat:"off", saved:false, dur:0, progress:0 };
// the two library endpoints, one for songs and one for podcast episodes. saving
// an episode against the song endpoint just fails, so the heart has to know
// which of the two it is holding
const spotLib = kind => kind === "episode" ? "/me/episodes" : "/me/tracks";
let spotTintFor = null;                  // the cover the current tint came from

// spotify pushes nothing, so the panel has to keep asking. it asks once a
// second while a song is running and every five seconds when nothing is, and it
// also asks again right as the running song is due to end, which is what makes
// a song change land as it happens instead of up to a whole poll later
let spotTimer = null, spotBusy = false, spotHold = 0;
function spotSchedule(){
  clearTimeout(spotTimer);
  let ms = spotState.playing ? 1000 : 5000;
  const left = spotState.dur - spotState.progress;
  if (spotState.playing && spotState.dur && left > 0)
    ms = Math.max(250, Math.min(ms, left + 200));
  spotTimer = setTimeout(spotPoll, ms);
}
// a press is answered on the panel at once and spotify is told afterwards, so
// these quick follow ups exist only to pick up what the press caused, the new
// song above all. spotHold is what stops one of them overturning the press
// itself while spotify is still catching up with it
function spotBurst(ms){
  spotHold = Date.now() + (ms || 0);
  [200, 550, 1100].forEach(d => setTimeout(spotPoll, d));
}

// the panel takes its colour from the album art, the way Spotify's own embed
// does. it used to average the whole cover, and an average is always grey,
// because a cover's opposite colours cancel each other out. Frank Ocean's
// "Blonde" averaged to 167,158,156, saturation .07, which is a grey. so this
// hunts for the one strong colour the cover uses most instead of blending
// everything together. only the hue and the saturation of what it finds ever
// reach the glass, because of the blend mode the wash is laid on in, so the
// panel is lit by the album rather than painted with it
function spotTint(host, url){
  if (spotTintFor === url) return;
  spotTintFor = url;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    try {
      // 32 across, so 1024 pixels vote into 512 possible buckets. at the old 20
      // some sleeves had only a handful of coloured pixels left to count, too
      // few to trust: Unknown Pleasures kept 3 of them at 20 and 34 at 32. 48
      // costs twice the work and picked no better, so 32 is the middle
      const N = 32;
      const c = document.createElement("canvas");
      c.width = c.height = N;
      const x = c.getContext("2d", { willReadFrequently: true });
      x.drawImage(img, 0, 0, N, N);
      const d = x.getImageData(0, 0, N, N).data;
      let ar = 0, ag = 0, ab = 0, an = 0;   // the old average, kept as the fallback
      const bins = new Map();
      for (let i = 0; i < d.length; i += 4){
        const r = d[i], g = d[i+1], b = d[i+2];
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        const w = 1 + (mx - mn) / 255 * 2.5;   // lean toward the colourful pixels
        ar += r * w; ag += g * w; ab += b * w; an += w;
        // a pixel with no colour in it gets no vote. .30 is the highest bar that
        // still keeps a pastel sleeve, since IGOR's pink measures .30 and a bar
        // of .35 threw that whole cover away. both lightness ends go too: down
        // there the three channels sit within a few levels of each other and the
        // hue is really jpeg noise, up there there is no room left below white
        const sat = mx ? (mx - mn) / mx : 0;
        const lit = (mx + mn) / 510;
        if (sat < .30 || lit < .10 || lit > .90) continue;
        // count coarsely, 8 levels a channel, so one flat region of the cover
        // lands in one bucket and votes as a block. 16 levels split a region
        // across several buckets and the winner turned into an accident of where
        // the region happened to straddle an edge; 4 levels merged colours that
        // are not the same and read Unknown Pleasures' navy as a dark grey
        const key = (r >> 5) * 64 + (g >> 5) * 8 + (b >> 5);
        const e = bins.get(key) || [0, 0, 0, 0];
        e[0] += r; e[1] += g; e[2] += b; e[3]++;
        bins.set(key, e);
      }
      let top = null;
      bins.forEach(e => { if (!top || e[3] > top[3]) top = e; });
      let r, g, b;
      // six votes of the 1024 is about a 23 by 23 patch of the cover, so a
      // winner that small is still a real part of the picture, not one stray pixel
      if (top && top[3] >= 6){
        // average inside the winning bucket only, which puts the colour back at
        // full precision after the coarse count
        r = Math.round(top[0] / top[3]);
        g = Math.round(top[1] / top[3]);
        b = Math.round(top[2] / top[3]);
        // what reaches the glass is the gap between this colour's three
        // channels, not its own darkness: the color blend mode takes the hue
        // and the saturation and leaves the lightness behind. that gap closes
        // at both ends of the lightness range: a near black or a pastel winner
        // reads as grey again. so a winner outside .42 to .62 is moved into it, where it
        // keeps at least three quarters of the gap its hue and saturation allow.
        // rescaling the channels around a new midpoint moves neither of those,
        // because hue only depends on where each channel sits between the lowest
        // and the highest, and that stays put
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b), lit = (mx + mn) / 510;
        const want = Math.min(.62, Math.max(.42, lit));
        if (want !== lit && mx > mn){
          const k = (1 - Math.abs(2 * want - 1)) / (1 - Math.abs(2 * lit - 1));
          const lo = want * 255 - (mx - mn) * k / 2;
          const fix = v => Math.max(0, Math.min(255, Math.round(lo + (v - mn) * k)));
          r = fix(r); g = fix(g); b = fix(b);
        }
      } else {
        // a black and white sleeve has no strong colour to find. the old average
        // still tints it, faintly and neutrally, which beats no tint at all. it
        // is left exactly where it is: pulling an average with no hue in it
        // toward the middle would invent a colour out of jpeg noise
        r = Math.round(ar / an); g = Math.round(ag / an); b = Math.round(ab / an);
      }
      // the colour goes out as itself, at no strength at all. it used to go out
      // as a gradient of it at 14% and 5% alpha, to be laid over the panel as a
      // film, and a film of a colour this dark can only ever grey the face down.
      // the css rule on #magic1.filled is what turns this into a face: it keeps
      // the hue, clamps the chroma and pins the lightness near white. how strong
      // the tint is lives there now, in one number, min(c, .03)
      host.style.setProperty("--sp-tint", "rgb(" + r + "," + g + "," + b + ")");
    } catch (e) {
      // the cover blocked the read. dropping the property rather than setting a
      // colour hands the face back to the rule's own default, the page's white
      host.style.removeProperty("--sp-tint");
    }
  };
  img.onerror = () => host.style.removeProperty("--sp-tint");
  img.src = url;
}

// spotify stops reporting a player once the device has been quiet for a while,
// so the last track it did report is kept here and stays on the panel rather
// than the panel emptying itself. kept in the browser so a reload keeps it too
function spotRemember(t){
  try { localStorage.setItem("spot.last", JSON.stringify(t)); } catch (e) {}
}
function spotRecall(){
  try { return JSON.parse(localStorage.getItem("spot.last") || "null"); } catch (e) { return null; }
}
// swap the album cover by fading the new one up over the old one, rather than
// replacing it in a single frame. the arriving layer is raised first, so the
// dissolve reads the same way whichever of the two layers is arriving
function spotCover(el, url){
  const front = el.front, back = front === el.artA ? el.artB : el.artA;
  if ((front.dataset.url || "") === (url || "")) return;
  if (!url){ front.classList.remove("on"); front.dataset.url = ""; return; }
  const show = () => {
    back.dataset.url = url;
    back.style.zIndex = "2"; front.style.zIndex = "1";
    back.classList.add("on");
    front.classList.remove("on");
    el.front = back;
  };
  // only once the new cover has actually decoded, or the fade runs against an
  // empty frame and the panel blinks
  back.onload = show;
  back.src = url;
  if (back.complete && back.naturalWidth) show();   // already cached, no load event
}

// the words are swapped at the halfway point of their own fade, so the old name
// is never seen turning into the new one
let spotTextTimer = null;
function spotSwapText(el, name, artist, tip){
  const set = () => {
    el.title.firstChild.textContent = name;
    el.artist.textContent = artist;
    el.artist.title = tip;
  };
  if (el.title.firstChild.textContent === name && el.artist.textContent === artist){
    el.artist.title = tip;
    return;
  }
  // the first paint has nothing to fade away from
  if (!el.title.firstChild.textContent && !el.artist.textContent){ set(); return; }
  clearTimeout(spotTextTimer);
  el.meta.classList.add("swap");
  spotTextTimer = setTimeout(() => { set(); el.meta.classList.remove("swap"); }, 190);
}

// paint one track onto the panel, the same way whether it came from a live poll
// or from the remembered one
function spotPaint(host, el, t){
  host.classList.remove("empty");
  spotSwapText(el, t.name, t.artist, t.album ? t.artist + " — " + t.album : t.artist);
  spotCover(el, t.img);
  if (t.img) spotTint(host, t.img);
}

function spotBuild(){
  const host = document.getElementById("magic1");
  if (!host || host.classList.contains("filled")) return host;
  host.textContent = "";
  host.classList.add("filled");
  if (!spotSession.refresh || spotSession.scopes !== SPOT_SCOPES){
    const btn = h("button", "spconnect");
    // the same mark and stub either way: with an id set this signs in; with
    // none it opens Spotify's dashboard to make one. only the word and the
    // press target change, never the shape or the colours
    const mark = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">'
      + '<path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>';
    if (SPOT_ID){
      btn.innerHTML = mark + '<span>Connect Spotify</span>';
      btn.addEventListener("click", spotConnect);
    } else {
      btn.innerHTML = mark + '<span>Create Spotify App ID</span>';
      btn.addEventListener("click", spotCreateAppId);
    }
    host.appendChild(btn);
    return host;
  }
  const wrap = h("div", "spwrap");
  const row = h("div", "sprow");
  const cover = h("div", "spcover");
  cover.title = "double click to save or unsave";
  // two layers, so one album cover can dissolve into the next instead of being
  // replaced in a single frame. the src below never fails, so a cover that has
  // not arrived can never show a broken image icon
  const mkArt = () => {
    const a = document.createElement("img");
    a.className = "spart"; a.alt = "";
    a.src = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
    return a;

  const artA = mkArt(), artB = mkArt();

async function spotPoll(){
  // one ask at a time: the quick follow ups after a press would otherwise
  // overlap the running one and answer out of order
  if (spotBusy) return;
  spotBusy = true;
  try {
    await spotAsk();
  } finally {
    spotBusy = false;
    spotSchedule();     // in the finally, so a thrown error can never end the loop
  }
}

async function spotAsk(){
  const host = spotBuild();
  if (!host || host.dataset.ready !== "1" || !host._sp) return;
  const el = host._sp;
  // /me/player rather than currently-playing: it still answers while playback
  // is paused, which is what stopped the panel going blank after a while.
  // additional_types=episode is what makes podcasts come back at all: without
  // it spotify answers with an empty item the whole time one is playing
  const r = await spotCall("/me/player?additional_types=episode");
  const item = r && r.item;
  const fresh = Date.now() < spotHold;   // a press just happened, keep its answer
  let t;
  if (item){
    // a podcast episode is a different shape from a song: the show stands in
    // for the artist and the cover hangs off the episode rather than an album
    const pod = item.type === "episode" || !!item.show;
    // spotify lists covers largest first: take the biggest, not the 64px thumb,
    // or it renders soft on a retina screen
    t = { id: item.id || null, name: item.name || "", kind: pod ? "episode" : "track",
          artist: pod ? (item.show?.name || "")
                      : (item.artists || []).map(a => a.name).join(", "),
          album: pod ? (item.show?.publisher || "") : (item.album?.name || ""),
          img: ((pod ? item.images : item.album?.images) || [])[0]?.url || "" };
    spotRemember(t);
    if (!fresh) spotState.playing = !!r.is_playing;
    spotState.dur = item.duration_ms || 0;
    spotState.progress = r.progress_ms || 0;
  } else {
    // the device went quiet and spotify stopped reporting a player at all. the
    // last track it named stays up instead of the panel wiping itself
    t = spotRecall();
    if (!fresh) spotState.playing = false;
    spotState.dur = 0;
    spotState.progress = 0;
  }
  if (!t){
    host.classList.add("empty");
    host.style.removeProperty("--sp-tint"); spotTintFor = null;   // back to the page's own white
    el.play.innerHTML = SPOT_ICON.play;
    spotState = { playing:false, id:null, kind:"track", shuffle:false, repeat:"off", saved:false, dur:0, progress:0 };
    return;
  }
  el.play.innerHTML = spotState.playing ? SPOT_ICON.pause : SPOT_ICON.play;
  spotPaint(host, el, t);
  // the heart: ask Spotify whether this one is already in the library. songs and
  // podcast episodes are two separate libraries with two separate endpoints
  if (t.id && t.id !== spotState.id){
    spotState.id = t.id;
    spotState.kind = t.kind || "track";
    const c = await spotCall(spotLib(t.kind) + "/contains?ids=" + t.id);
    spotState.saved = Array.isArray(c) ? !!c[0] : false;
  }
}

function panelOff(host){

// every place this tab's picture could be, in the order they get tried: the
// lane's own internal folder first, all six extensions, and only after all of
// those come up empty the old uploads path
function panelSources(lane, sweep){
  const list = P3_EXT.map(ext => ({ src: "lane", ext,
    url: "/laneimg/" + encodeURIComponent(lane) + "/panel." + ext }));
  // PRE-RESTART PATH: the running server has no /laneimg route yet, so until it
  // is restarted this is the only place it can read a panel picture from. these
  // three lines can be deleted once the new route is live
  for (const ext of P3_EXT)
    list.push({ src: "uploads", ext,
      url: "/uploads/panel-" + encodeURIComponent(lane) + "." + ext });
  // the one file that answered last time jumps to the front, so a panel that is
  // already filled costs one request per poll rather than a dozen. on a sweep
  // poll it stays in place instead, which is how a picture that turns up in the
  // lane folder takes the panel back off the old path
  const i = list.findIndex(c => c.src === p3Src && c.ext === p3Ext);
  if (i > 0 && !sweep) list.unshift(list.splice(i, 1)[0]);

async function panelPoll(){
  if (!ownerReady) return;
  // one tab's thing only: everywhere else the box goes back to the stub and no
  // panel file is ever asked for
  if (activeOwner !== P3_LANE){ panelOff(document.getElementById("magic3")); return; }
  const host = panelBuild();
  if (!host || !host._p3) return;
  if (p3For !== activeOwner){ p3For = activeOwner; panelClear(host); }
  // while the old path is the one answering, look through the lane folder in
  // full every fifth poll (20s), so the lane folder still wins in the end
  // without every poll paying for the whole list
  p3Look++;
  const sweep = p3Src === "uploads" && p3Look % 5 === 0;
  for (const cand of panelSources(activeOwner, sweep)){
    const r = await fetch(cand.url, { cache: "no-store" }).catch(() => null);
    // a switch away while the fetch was in the air took the panel apart behind
    // this poll: it is answering for the tab we just left, so it says nothing
    if (!host._p3) return;
    if (!r || !r.ok) continue;
    const blob = await r.blob().catch(() => null);
    if (!host._p3) return;
    if (!blob || !blob.size) continue;
    const moved = cand.src !== p3Src;   // same size in the other place is still a different picture
    p3Ext = cand.ext; p3Src = cand.src;
    // swapped only when the bytes differ or the picture came from somewhere
    // else, so a panel that has not changed is never rebuilt and never blinks
    // from its own address, which the server sandboxes; a blob: copy is this origin's
    if (blob.size !== p3Size || moved){
      p3Size = blob.size;
      host._p3.img.src = cand.url + "?v=" + Date.now();
    }
    host._p3.img.hidden = false;
    host._p3.stub.hidden = true;
    host.classList.add("filled");
    return;

}

// the clock face on a row, and the day word over a stamp: today, yesterday, the
// weekday inside a week, then the date, carrying the year only when it is not
// this one
function c3Time(ms){
  return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
function c3Day(ms){
  const d = new Date(ms), now = new Date();
  const startOf = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((startOf(now) - startOf(d)) / 86400000);
  if (days <= 0) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 7) return d.toLocaleDateString([], { weekday: "long" });
  return d.toLocaleDateString([], { month: "short", day: "numeric",
    year: d.getFullYear() === now.getFullYear() ? undefined : "numeric" });
}

  const out = [], seen = new Set();
  for (const m of c3Msgs){
    let key = m.kind + "|" + m.ts;
    while (seen.has(key)) key += "+";   // two lines on one tick, kept apart
    seen.add(key);
    // the transcript counts in seconds and everything here counts in ms
    const prose = m.kind === "user" ? m.text : (m.replyFull ?? m.text);
    out.push({ key, role: m.kind === "user" ? "user" : "agent",
               at: Math.round(m.ts * 1000), blocks: c3Blocks(prose) });
  }
  for (const o of c3Out){
    const shots = o.shots.length ? o.shots.map((s, i) => ({
      shot: s.kind === "image" || !s.kind, src: s.url, attachment: s.kind !== "image" && !!s.kind,
      kind: s.kind, name: s.name, uploaded: o.urls[i] || "",
    })) : o.urls.map(src => ({ shot: false, text: src }));
    const blocks = shots.concat(o.text ? [{ shot: false, text: o.text }] : []);
    out.push({ key: "out|" + o.id, role: "user", at: o.at, out: o,
               blocks: blocks.length ? blocks : [{ shot: false, text: o.text }] });
  }
  return out;
}
// the pixels are asked for once. a picture that has just left the tray is
// already drawn under a blob address and its bubble reads from there; anything
// else comes off the server, wearing the grey face until it lands
function c3Img(src){
  const img = document.createElement("img");
  const known = c3Shots.get(src);
  const target = known ? known.src : CardMarkdown.safeImageTarget(src);
  if (!target) return null;
  img.className = "waiting";
  // the real size, read off the blob before the send, holds the box open so
  // nothing under it jumps when the pixels arrive
  if (known && known.w){ img.width = known.w; img.height = known.h; }
  img.addEventListener("load", () => {
    img.classList.remove("waiting");
    if (c3Follow && performance.now() >= c3Air) c3Pin(true);
  });
  img.src = target;
  return img;
}
// a wrapper is refilled only when its own words or pictures changed, so a poll
// that brings nothing new can neither restart an animation nor move the view
function c3Fill(w, ev, anim){
  w.dataset.ts = String(ev.at);
  w.dataset.role = ev.role;
  const failed = !!(ev.out && ev.out.failed);
  const sig = JSON.stringify([ev.blocks, failed]);
  if (w.dataset.sig === sig) return;
  w.dataset.sig = sig;
  for (const gone of w.querySelectorAll(":scope > .c3row")) gone.remove();
  const time = c3Time(ev.at);
  let last = null;
  for (const b of ev.blocks){
    const row = h("div", "c3row " + ev.role);
    row.dataset.time = time;
    const msg = h("div", "c3msg cardmd " + ev.role + (b.shot ? " shot" : "") + (anim ? " anim" : ""));
    if (b.shot){
      const image = c3Img(b.src);
      if (image) msg.appendChild(image);
      else {
        msg.classList.remove("shot");
        msg.innerHTML = fmt(String(b.src || ""));
      }
    } else if (b.attachment){
      if (b.uploaded) msg.innerHTML = CardMarkdown.renderAttachment(b.uploaded);
      else {
        if (b.kind === "audio" || b.kind === "video"){
          const media = document.createElement(b.kind);
          media.controls = true; media.preload = "metadata";
          if (b.kind === "video") media.playsInline = true;
          media.src = b.src; msg.appendChild(media);
        }
        msg.appendChild(h("span", "attachment-name", b.name));
      }
    } else msg.innerHTML = fmt(b.text);
    row.appendChild(msg);
    w.appendChild(row);
    last = row;
  }
  w.classList.toggle("failed", failed);
  if (failed && last){
    // the two ways out of a line that never landed: the arrow hands it over
    // again and the cross takes the words back. without them it would sit
    // there for good, and throwing it away by itself is the one thing this
    // panel must not do
    const badge = sentBadge("fail");
    badge.querySelector(".answretry").addEventListener("click", () => c3Retry(ev.out));
    badge.querySelector(".answcross").addEventListener("click", () => c3Cross(ev.out));
    last.appendChild(badge);
  }
}
// one pass over what is on screen: which bubbles belong to a run, and where the
// hour stamps go. both are derived rather than tracked, so the answer is the
// same however the messages arrived
function c3Decorate(list){
  let prevSide = null, prevAt = 0, lastStamp = 0;
  for (const w of list.querySelectorAll(":scope > .c3evt")){
    const rows = w.querySelectorAll(":scope > .c3row");
    let stamp = w.querySelector(":scope > .c3stamp");
    if (!rows.length){ if (stamp) stamp.remove(); continue; }
    const at = Number(w.dataset.ts || 0);
    const role = w.dataset.role || "agent";
    if (at - lastStamp > C3_STAMP_GAP){
      if (!stamp) stamp = h("div", "c3stamp");
      if (stamp.dataset.at !== String(at)){
        stamp.dataset.at = String(at);
        stamp.replaceChildren(h("b", null, c3Day(at)), " " + c3Time(at));
      }
      if (w.firstElementChild !== stamp) w.prepend(stamp);
      lastStamp = at;
    } else if (stamp) stamp.remove();
    for (const row of rows){
      const cont = (role === "user" || role === "agent") &&
                   role === prevSide && at - prevAt < C3_RUN_GAP;
      row.classList.toggle("cont", cont);
      prevSide = role === "system" ? null : role;
      prevAt = at;
    }
  }
}
// the receipt's word, changed behind a fade so the change itself is never on
// screen. a timer rather than the transition's own end event: this page turns
// every transition off under reduced motion, and an end that never comes would
// leave the word invisible for good
function c3Word(rc, word){
  const span = rc.firstElementChild;
  rc.hidden = !word;
  if (!word) return;
  if ((rc.dataset.next || span.textContent) === word) return;
  if (!span.textContent){ span.textContent = word; return; }
  rc.dataset.next = word;
  span.classList.add("rc-hide");
  setTimeout(() => {
    span.textContent = rc.dataset.next || span.textContent;
    delete rc.dataset.next;
    span.classList.remove("rc-hide");
  }, 160);
}
function chatDraw(instant){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const el = host._c3;
  const card = lastState && lastState.boxes.find(b => b.id === C3_BOX);
  const writing = !!(card && card.writing);
  // somebody is on the lane if it is long polling, or already composing a reply
  const heard = !!(lastState && ((lastState.listening || {})[C3_OWNER] ||
                                 (lastState.busy || {})[C3_OWNER]));
  const evs = c3Events();
  const sig = JSON.stringify([evs.map(e => e.key + "|" + e.blocks.length +
    (e.out && e.out.failed ? "!" : "")), writing, heard]);
  if (c3Sig === sig) return;
  c3Sig = sig;
  const list = el.msgs;
  // the list is reconciled, never rebuilt. a message already on screen keeps
  // the element it is in, so a poll cannot lose the scroll position, cut an
  // animation short, or throw away pixels that have already arrived
  const have = new Map();
  for (const w of list.querySelectorAll(":scope > .c3evt")) have.set(w.dataset.key, w);
  const want = new Set(evs.map(e => e.key));
  let cursor = list.firstElementChild, born = false;
  for (const ev of evs){
    let w = have.get(ev.key);
    const fresh = !w;
    if (fresh){ w = h("div", "c3evt"); w.dataset.key = ev.key; born = true; }
    // the receipt and the dots ride at the tail, so a wrapper put in front of
    // whatever the cursor is standing on lands in the right seat either way
    if (cursor === w) cursor = cursor.nextElementSibling;
    else list.insertBefore(w, cursor);
    // only a genuinely new bubble pops, and only one from the other side: the reader's
    // own arrive by flying out of the typing box, and the first paint of a
    // thread is not an arrival at all
    c3Fill(w, ev, fresh && c3Painted && ev.role === "agent");
  }
  for (const [key, w] of have) if (!want.has(key)) w.remove();
  // the receipt element is never thrown away and never rebuilt: the word swap
  // is a fade, and an element built fresh each poll has nothing to fade from
  if (!el.rcpt){ el.rcpt = h("div", "c3rcpt"); el.rcpt.appendChild(h("span", "rc")); }
  if (writing && !el.typing){
    el.typing = h("div", "c3typing");
    el.typing.append(h("i"), h("i"), h("i"));
  }
  if (!writing && el.typing) el.typing.remove();
  const tail = writing ? [el.rcpt, el.typing] : [el.rcpt];
  // moved only when the tail is genuinely out of order: an element taken out of
  // the page and put back is an element whose running fade is thrown away
  let seat = list.lastElementChild, ordered = true;
  for (let i = tail.length - 1; i >= 0; i--){
    if (seat !== tail[i]){ ordered = false; break; }
    seat = seat.previousElementSibling;
  }
  if (!ordered) for (const t of tail) list.appendChild(t);
  // anything the reader said after the last thing the agent said is still unanswered,
  // which is the same set the server counts in the card's pending. a line that
  // never landed wears the red mark on its own bubble, so this line stays out of it
  let unanswered = 0;
  for (let i = c3Msgs.length - 1; i >= 0 && c3Msgs[i].kind === "user"; i--) unanswered++;
  const bad = c3Out.some(o => o.failed);
  c3Word(el.rcpt, bad ? null : unanswered ? (heard ? "Delivered" : "Queued") : null);
  c3Decorate(list);
  // a live arrival glides to the bottom; the first paint and every redraw land
  // there with no motion at all. either way it happens only while the tail is
  // being followed: something landing while the reader is reading further up must not
  // move the view by one pixel
  if (c3Follow) c3Pin(!!instant || !c3Painted || !born);
  if (list.querySelector(".c3evt")) c3Painted = true;
}
// the bottom. an instant pin lands in the same frame the content did; a glide
// is what a live arrival gets, and while one is running an away reading of the
// scroll is this panel's own doing rather than the reader's, so it may not let go of
// the tail
function c3Pin(now){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const list = host._c3.msgs;
  if (!now) c3Glide = performance.now() + 800;
  list.scrollTo({ top: list.scrollHeight, behavior: now ? "auto" : "smooth" });
}
function c3AtBottom(list){
  return list.scrollHeight - list.scrollTop - list.clientHeight < C3_TAIL;
}
// the one place following flips: away from the bottom is reading back through
// it, at the bottom is following it again. a glide this panel started fires
// scroll events the whole way up, and none of those are the reader letting go of the
// tail, so while one is running the flip needs a real gesture behind it
function c3Scrolled(){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const now = performance.now();
  const at = c3AtBottom(host._c3.msgs);
  if (at) c3Follow = true;
  else if (now > c3Glide || now - c3Gesture < 400) c3Follow = false;
  c3Jump(c3Follow);
}
// the jump disc shows only after the scrolling has been still for four seconds
// while away from the bottom, and never because something landed down there.
// once it is up it stays up until the bottom is reached, which puts it away and
// clears the window
function c3Jump(atBottom){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const jump = host._c3.jump;
  if (c3Still){ clearTimeout(c3Still); c3Still = null; }
  if (atBottom){ jump.classList.remove("show"); return; }
  if (jump.classList.contains("show")) return;
  c3Still = setTimeout(() => { c3Still = null; jump.classList.add("show"); }, C3_STILL);
}
// the ↑ is there when there is something to send and gone when there is not
function c3Refresh(){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const el = host._c3;
  el.send.classList.toggle("show", el.ta.value.trim().length > 0 || c3Files.length > 0);
}
// one line, growing to the cap and then scrolling inside itself. the pill's
// live height is published for the jump disc, which seats itself off it, so the
// same air sits above the pill at one line and at the cap alike
function c3Autosize(){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const el = host._c3;
  el.ta.style.height = "auto";
  el.ta.style.height = Math.min(el.ta.scrollHeight, C3_CAP) + "px";
  host.style.setProperty("--c3-field-h", el.field.offsetHeight + "px");
  if (c3Follow && performance.now() >= c3Air) c3Pin(true);
}
// Pending images keep their preview; other files show their name in the tray.
function c3Pick(files){
  const errors = [];
  for (const f of files || []){
    if (c3Picks.has(f)) continue;
    const info = CardMarkdown.attachmentFile(f);
    if (info.error){ errors.push((f.name || "Attachment") + ": " + info.error); continue; }
    const url = URL.createObjectURL(f);
    const wrap = h("div", "c3thumb");
    const x = h("button", "c3thumb-x", "✕");
    x.title = "take it back out";
    x.addEventListener("click", () => {
      c3Files = c3Files.filter(g => g !== f);
      c3Tray(); c3Refresh();
    });
    const pick = { url, name: info.name, kind: info.kind, w: 0, h: 0, wrap, taken: false };
    if (info.kind === "image"){
      const img = document.createElement("img");
      img.alt = info.name;
      img.addEventListener("load", () => { pick.w = img.naturalWidth; pick.h = img.naturalHeight; });
      img.src = url; wrap.appendChild(img);
    } else wrap.appendChild(h("span", "c3filename", info.name));
    wrap.appendChild(x);
    c3Picks.set(f, pick);
    c3Files.push(f);
  }
  attachmentNotice(document.getElementById("magic3")._c3.ta, errors.join("\n"));
  c3Tray(); c3Refresh();
}
function c3Tray(){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const box = host._c3.pend;
  for (const [f, p] of c3Picks){
    if (c3Files.includes(f)) continue;
    c3Picks.delete(f);
    p.wrap.remove();
    // a picture the send took has handed its address to the thread; pulling
    // that back would empty the bubble it is drawn in
    if (!p.taken) URL.revokeObjectURL(p.url);
  }
  for (const f of c3Files){
    const p = c3Picks.get(f);
    if (p && p.wrap.parentElement !== box) box.appendChild(p.wrap);
  }
  box.classList.toggle("on", c3Files.length > 0);
}
// what the thread actually lays out. the wrappers are laid out as nothing, so
// their own children are what moves: rows, stamps, the receipt, the dots.
// walked newest first and bounded, because the glide is a tail affair
function c3LaidOutTail(list){
  const out = [];
  for (let n = list.lastElementChild; n && out.length < C3_SHIFT_MAX; n = n.previousElementSibling){
    if (n.classList.contains("c3evt")){
      for (let i = n.children.length - 1; i >= 0 && out.length < C3_SHIFT_MAX; i--) {
        out.push(n.children[i]);
      }
    } else out.push(n);
  }
  return out;
}
// the older content glides up over the flight's own beat. without it the
// instant pin teleports everything above the new bubble upward while the bubble
// itself is still down at the typing box, and a bare strip stands between the
// two for the whole flight
function c3ShiftBegin(list){
  const eligible = c3Follow || c3AtBottom(list);
  const before = new Map();
  if (eligible) for (const n of c3LaidOutTail(list)) before.set(n, n.getBoundingClientRect().top);
  return function play(carriers){
    if (!eligible) return;
    const view = list.getBoundingClientRect();
    for (const n of c3LaidOutTail(list)){
      const was = before.get(n);
      if (was === undefined){
        // born with this send. the flying rows belong to the flight and a
        // second treatment would fight it; anything else, which in practice is
        // the stamp a new hour just opened, fades up on the same beat
        if (!carriers.has(n)){
          n.animate([{ opacity: 0, transform: "translateY(10px)" },
                     { opacity: 1, transform: "none" }],
                    { duration: C3_FLIGHT, easing: C3_EASE });
        }
        continue;
      }
      const now = n.getBoundingClientRect();
      const d = was - now.top;
      // only a row that moved up, and only one whose path crosses the thread's
      // own box: the rest would travel where nobody can see them
      if (d <= .5 || now.bottom + d <= view.top || now.top >= view.bottom) continue;
      n.animate([{ transform: "translateY(" + d + "px)" }, { transform: "none" }],
                { duration: C3_FLIGHT, easing: C3_EASE });
    }
  };
}
// the reader's own bubble does not pop, it flies: it lays out in its final seat, is
// carried back to the box the words were typed in, and let go. the web
// animations api rather than a transition, so the start state lives inside the
// animation itself and the two style writes can never be folded into one
function c3Fly(w, field){
  const start = field.getBoundingClientRect();
  let last = null;
  for (const msg of w.querySelectorAll(".c3msg")){
    const end = msg.getBoundingClientRect();
    last = msg.animate([
      { transform: "translate(" + (start.right - end.right) + "px, " +
                                  (start.top - end.top) + "px)" },
      { transform: "none" },
    ], { duration: C3_FLIGHT, easing: C3_EASE });
  }
  // a translate hangs past the thread's bottom edge and the scroll height
  // counts it, so nothing may re-pin while it is up. this is the one pin that
  // owes the bottom whatever grew underneath it in the meantime
  c3Air = performance.now() + C3_FLIGHT;
  if (last) last.finished.then(() => { if (c3Follow) c3Pin(true); }, () => {});
}
async function chatFetch(){
  try {
    const r = await fetch("/thread?box=" + C3_BOX + "&n=60", { cache: "no-store" });
    const j = await r.json();
    if (Array.isArray(j.messages)) c3Msgs = j.messages;
  } catch (e) {}
}
// Keep each completed upload so a retry does not upload that file twice.
async function c3Upload(out){
  if (out.missingFiles) throw new Error("Some files did not upload before this page reloaded. Attach them again in a new message.");
  for (let i = out.urls.length; i < out.files.length; i++){
    const url = await uploadAttachment(out.files[i]);
    out.urls.push(url);
    const shot = out.shots[i];
    if (shot && shot.kind === "image") c3Shots.set(url, { src: shot.url, w: shot.w, h: shot.h });
  }
  return true;
}
// the board has the line: its own copy in the thread takes the stand-in's seat
async function c3Landed(out){
  out.failed = false;
  // /send writes the line to the transcript before it answers, so the very
  // next read of the thread already holds it and the stand-in can go
  await chatFetch();
  // unless the bubble is still in the air: the server's copy takes its seat
  // only once it has landed, or the swap would cut the flight off midway
  const left = c3Air - performance.now();
  if (left > 0) await new Promise(r => setTimeout(r, left));
  const i = c3Out.indexOf(out);
  if (i >= 0) c3Out.splice(i, 1);
  c3Save(); c3Sig = ""; chatDraw(true);
}
// one try of a line, under the id it was minted with, so a try asked again
// after a lost answer is answered from the board's receipt and never lands twice
async function chatPost(out){
  let result = "failed";
  try {
    if (await c3Upload(out)){
      const body = out.urls.concat(out.text ? [out.text] : []).join("\n");
      result = await sentTry({ route: "/send?box=" + C3_BOX, op: out.op, text: body });
    }
  } catch (e) {
    const ta = document.getElementById("magic3")?._c3?.ta;
    if (ta) attachmentNotice(ta, e.message || "Upload failed. Please try again.");
  }
  if (result === "landed"){
    const ta = document.getElementById("magic3")?._c3?.ta;
    if (ta) attachmentNotice(ta, "");
    await c3Landed(out);
    return;
  }
  out.failed = true;   // it did not get through. keep the words under the mark
  out.refused = result === "refused";
  c3Save(); c3Sig = ""; chatDraw(true);
}
// the arrow: the line goes out again under its own id. a line the board
// refused is not sent again
function c3Retry(out){
  if (!out.failed || out.refused) return Promise.resolve();
  out.failed = false; c3Save(); c3Sig = ""; chatDraw(true);
  return chatPost(out);
}
// the words go back in the typing box, after what is already there and never
// over it, and the line leaves the thread. picked files go back in the tray; a
// line restored after a reload has no files, so its uploaded addresses go back
// ahead of the words instead
function c3Back(out){
  const i = c3Out.indexOf(out);
  if (i < 0) return;
  c3Out.splice(i, 1);
  const el = document.getElementById("magic3")?._c3;
  if (el){
    const lead = out.files.length ? [] : out.urls;
    const words = lead.concat(out.text ? [out.text] : []).join("\n");
    if (words) el.ta.value = el.ta.value.trim() ? el.ta.value.trimEnd() + "\n\n" + words : words;
    c3Pick(out.files);
    c3Autosize(); c3Refresh();
  }
  c3Save(); c3Sig = ""; chatDraw(true);
}
// the cross. a refused line is known not to have landed, so its words come
// back at once. any other failure leaves it unknown, so the board is asked
// first: landed, and the line stands in the thread with nothing taken back; not
// landed, and the words go back; no answer, and nothing happens
async function c3Cross(out){
  if (!out.failed || out.asking) return;
  if (out.refused){ c3Back(out); return; }
  out.asking = true;
  let said;
  try { said = await askReceipt(out.op); } finally { out.asking = false; }
  if (!said || !out.failed || !c3Out.includes(out)) return;
  if (said.status === "applied") await c3Landed(out);
  else if (said.status === "unknown" && Date.now() - out.at < OP_CERTAIN_MS) c3Back(out);
}
async function chatSend(){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const el = host._c3;
  const text = el.ta.value.trim();
  const files = c3Files.slice();
  if (!text && !files.length) return;
  el.ta.value = "";
  c3Autosize();
  // the pictures leave the tray marked as taken, so their blob addresses stay
  // alive for the bubble that is about to be drawn with them
  const shots = files.map(f => c3Picks.get(f)).filter(Boolean);
  for (const p of shots){ p.taken = true; c3Shots.set(p.url, { src: p.url, w: p.w, h: p.h }); }
  c3Files = [];
  c3Tray(); c3Refresh();
  // on screen before the request leaves, at full strength, and it stays there
  // until the thread comes back holding it: there is no moment where the reader's words
  // are nowhere
  const out = { id: c3Id(), at: Date.now(), text, failed: false, op: newOpId(), refused: false, files,
                shots: shots.map(p => ({ url: p.url, w: p.w, h: p.h, kind: p.kind, name: p.name })), urls: [] };
  const list = el.msgs;
  const shift = c3ShiftBegin(list);
  c3Out.push(out);
  c3Save(); c3Sig = "";
  c3Follow = true;         // sending snaps the view back to the tail
  chatDraw(true);          // the instant pin lands first; the motion plays over it
  const w = list.querySelector('.c3evt[data-key="out|' + out.id + '"]');
  shift(new Set(w ? w.querySelectorAll(":scope > .c3row") : []));
  if (w) c3Fly(w, el.field);

  try { await chatPost(out); } finally { el.send.disabled = false; }
}
async function chatPoll(){
  if (!ownerReady) return;
  // one tab's thing only, the same rule the picture panel above follows
  if (activeOwner !== C3_LANE){ chatOff(document.getElementById("magic3")); return; }
  const host = chatBuild();
  if (!host || !host._c3) return;
  if (c3For !== activeOwner){ c3For = activeOwner; c3Sig = ""; }
  await chatFetch();
  if (!host._c3) return;   // a tab switch took the chat apart while that was in the air
  chatDraw();
}
chatPoll(); setInterval(chatPoll, C3_POLL);

// the file navigator, read and written where it lives. the third tenant of magic box
// 3, beside the picture panel and the chat above, and it follows their rule

async function fileNavSave(){

  // await. lanes past the second share the one navigator-only box, so a switch
  // between two of them tears this editor down and builds another in the very
  // same DOM host, and a B to C to B roundtrip builds a third: the host stays
  // one element through all of it, so its identity cannot tell the incarnations
  // apart. the view and the open-file object are made fresh every time, so a
  // moved reference is the sign a late answer has come back for an editor that
  // is no longer the one on screen
  const view = fileNavView, open = fileNavOpen;

  // toString would have written every \r\n in the file back as a bare \n, which
  // is the silent rewrite the line separator above was added to prevent
  const text = view.state.sliceDoc();

  // has already been sent to this file's own lane and is left to land there;
  // only the UI updates below are dropped, so a late answer never writes another
  // project's mtime, clean baseline or receipt, and never paints its warning
  const stale = () => fileNavView !== view || fileNavOpen !== open || fileNavHost() !== host || !host._filenav;

    // exactly where it is, in the editor, and the panel says so plainly rather
    // than writing over their work or throwing the reader's away

    // binary, or grew past the editor's size), so the save is refused rather
    // than allowed to overwrite it. the reader's text stays in the editor
    fileNavNote(host, (d && d.error) || "this file can no longer be saved here", true);

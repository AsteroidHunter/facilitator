  body.focus #wsl, body.focus #qchat, body.focus #taskbox,
  body.focus #carousel{display:none !important}
  #navpad > div{display:flex; gap:14px}
  @media (max-width:989px){ body.focus #navpad{display:none} }
  /* in-app project tabs: the board filtered to one project per tab; labels
     come from the lane directories at runtime, never from this file. Real tab
     shapes seated on the bar's bottom edge; the active one opens into the page.
     Pulling one out is the drag itself: grab a tab and tug it downward. */
  /* fixed bar height in focus mode: every one-line element centers on the
     same 23px line, and the tabs seat on the bottom edge with their label
     lifted onto that exact line (7px pad + 16px line puts its center at 23) */
  body.focus .bar{height:40px; padding-top:0; padding-bottom:0}
  body.focus #toc, body.focus #tocgrip{top:41px}
  body.focus #offline{top:41px}
  #tabbar{display:none}
  body.focus #tabbar{
    display:flex; align-items:flex-end; align-self:flex-end; gap:4px;
    height:38px; margin-right:10px;
  }
  /* seated sharp tabs per the 20260809 mockup: the active one's bottom opens
     into the canvas */
  .ptab{
    font:500 13px/16px var(--sans); color:var(--sub);
    background:transparent; border:1px solid transparent; border-bottom:none;
    border-radius:0; cursor:pointer; user-select:none;
    position:relative; top:1px;
    height:38px; padding:0 16px 5px;
  }
  .ptab:hover{color:var(--ink)}
  .ptab.on{color:var(--ink); background:var(--paper); border-color:var(--line)}
  /* a lane still holding a reply he has not opened says so with weight alone,
     the way a mail client does: no dot, no count, no colour. selection is a
     seated tab shape (paper fill, border, ink text) and never uses weight, so
     the two can sit on one tab and still read apart. 600 is the board's own
     bold, the same step the selected ticket row takes */
  /* 20260823: weight alone was invisible to the reader, twice. a mail client darkens
     as well as bolding, and that is what makes an unread line jump out of a
     list of grey ones. so unread takes the board's own ink too */
  .ptab.unread{color:var(--ink)}
  .ptab.unread .plabel{font-weight:600}
  /* bold type is wider than medium, and a bar that shuffles sideways every
     time a reply lands is worse than the problem it solves. so every label
     always holds room for its bold self: the hidden zero-height line under it
     carries the same word at 600, which sets the width whatever the visible
     weight is. top alignment keeps the word on the same pixel row as before,
     since a box with a hidden line in it can no longer be trusted to sit on
     its baseline */
  .plabel{display:inline-block; vertical-align:top}
  .plabel[data-label]::after{
    content:attr(data-label); display:block; height:0; overflow:hidden;
    visibility:hidden; font-weight:600;
  }
  .ptab.tearing{opacity:.45}
  /* a held tab rides the pointer sideways: it lifts on the selected row's own
     shadow and must paint over whatever it crosses */
  .ptab.dragging{color:var(--ink); background:var(--paper); border-color:var(--line);
    z-index:2; box-shadow:0 2px 18px rgba(60,45,20,.18), 0 1px 3px rgba(60,45,20,.10)}
  /* the others glide aside on the board's one 220ms curve, never teleport */
  .ptab.gliding{transition:transform 220ms cubic-bezier(0.25, 1, 0.5, 1)}
  /* the plus: opens a fresh project tab. A thin rule and clear air keep it
     from ever reading as part of the last tab */
  .tabsep{flex:none; align-self:center; width:1px; height:20px;
    background:var(--line-strong); margin:0 6px 0 8px}
  .ptabplus{flex:none; align-self:center; width:24px; height:24px; padding:0;
    font:500 15px/1 var(--mono); color:var(--ink); background:none;
    border:none; cursor:pointer; transition:opacity .2s; opacity:.75}
  .ptabplus:hover{opacity:1}
  /* the not-yet-named tab while its folder is being chosen */
  .ptab.draft{color:var(--ink); background:var(--paper); border-color:var(--line);
    font-style:italic}
  /* closing a project tab: the cross the pencil already puts on every box, on
     the same terms. it is that cross's own class, so its shape, size, line and
     colour cannot drift from it; only where it sits is written here. it stands
     in the tab's own right padding, centred on the label's line, and it is
     positioned rather than laid out, so the bar cannot move by a pixel when the
     pencil turns it on or off */
  .ptab .rkill{display:none; left:auto; top:8px; right:0; transform:none}
  body.editmode .ptab .rkill{display:block}
  /* a closed tab is simply not in the bar. the pencil brings it back where it
     belongs, its label greyed at the same .45 a tab already takes while it is
     being pulled out, and its own cross puts it back for good. block is the
     display a tab already computes to inside the bar's flex row, so a tab that
     comes back is the tab that left, to the pixel */
  .ptab.closed{display:none}
  body.editmode .ptab.closed{display:block}
  body.editmode .ptab.closed .plabel{opacity:.45}
  #projnote{display:none; flex:none; font:12px var(--mono); color:var(--must);
    background:var(--must-bg); border-radius:4px; padding:3px 10px}
  #projnote.show{display:inline-block}
  /* ---- new-project tab: the owner's landing ------------------------------ */
  /* one centered screen, the dotted grid off: the wordmark over a sunken
     white well listing the open folders, the current one bold, then the
     raised start button that opens the system folder chooser. All landing
     type is Inter (row paths stay grey mono); no text on this screen may
     be orange: orange lives only in the well's text selection and in its
     scrollbar thumb. Centers on the real window, untouched by the stage
     or drag layouts. */
  #newproj{display:none}

  body.choosing #sections, body.choosing #pwdline{display:none}
  body.choosing .box{display:none !important}
  body.choosing :is(main, #clockbox, #tickets, #magic1, #magic2, #magic3,
    #goalbox, #rail, #taskchip){display:none !important}
  body.choosing #newproj{
    display:flex; flex-direction:column; align-items:center; position:fixed;
    z-index:5; left:50%; top:calc(41px + (100vh - 41px)*.44);
    transform:translate(-50%,-50%);
  }
  #nphome{display:flex; flex-direction:column; align-items:center;
    width:min(30rem, 88vw)}
  /* the landing's three pieces arrive one beat apart on the page's own
     soft rise; the reduced-motion rule above stills them all */
  @keyframes npmelt{from{opacity:0; transform:translateY(6px)}}
  #npbrand, #nppanel, #npstart{animation:npmelt .2s cubic-bezier(.2,.7,.3,1) both}
  #nppanel{animation-delay:.05s}
  #npstart{animation-delay:.1s}
  #npbrand{font:700 40px/1.1 var(--inter); letter-spacing:-.02em; color:var(--ink)}
  /* the folders box: embedded, never floating; a white sunken well in the
     paper, inset shadow only, no outer shadow, corners near square */
  #nppanel{width:100%; margin:20px 0 0; padding:6px;
    background:#FFFFFF;
    border:none; border-radius:4px; min-height:330px;
    box-shadow:inset 0 1px 6px rgba(60,45,20,.14), inset 0 0 0 1px rgba(60,45,20,.08)}
  /* the one place orange may rest: selecting text inside the well */
  #nppanel ::selection{background:#FFD9B3; color:var(--ink)}
  #nphead{display:none}   /* the whole Active Folders bar removed */
  #nprows{display:flex; flex-direction:column; gap:2px; padding:0 0 4px;

  /* the well's scrollbar: the thumb is the landing's other orange */
  #nprows::-webkit-scrollbar{width:9px}
  #nprows::-webkit-scrollbar-track{background:transparent}
  #nprows::-webkit-scrollbar-thumb{background:#F0B27E; border:3px solid transparent;

  .nprow{display:flex; flex-direction:column; gap:1px; width:100%;
    padding:9px 12px; text-align:left}
  .npname{font:400 15px/1.35 var(--inter); color:var(--ink)}
  .nppath{font:11px var(--mono); color:var(--sub); max-width:100%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  /* the start button: a raised bevel, square corners, pastel orange body,
     black label; pressing inverts the bevel and drops the label one pixel */
  #npstart{margin:18px 0 0; font:600 14px var(--inter); color:#000;
    background:#FFF1E0; border:none; border-radius:0;
    padding:12px 26px; cursor:pointer;
    box-shadow:inset -1px -1px 0 #3A2E20, inset 1px 1px 0 #FFFFFF,
      inset -2px -2px 0 #D3A878, inset 2px 2px 0 #FFF9F1}
  #npstart:active{
    box-shadow:inset -1px -1px 0 #FFFFFF, inset 1px 1px 0 #3A2E20,
      inset -2px -2px 0 #FFF9F1, inset 2px 2px 0 #D3A878;
    padding:13px 25px 11px 27px}
  body.focus .name{display:none}
  body.focus #offline{
    position:fixed; left:14px; bottom:12px; top:auto; transform:none;
    z-index:20; border:1px solid #E8C4B4; max-width:40ch; border-radius:0;
    font-size:12px; padding:7px 12px;
  }
  /* auto side margins center a shot narrower than the column; one wider than
     the column is capped by max-width and the auto margins fall to zero */
  .reply .shot, .pendlist .shot{display:block; max-width:100%; border-radius:6px; margin:8px auto}
  .reply a, .pendlist a{color:inherit; text-decoration:underline; text-underline-offset:2px}
  /* a row of images written on one line: the columns come from that line's
     own count (data-n), capped at four so a long line keeps usable width.
     each cell caps its shot, so none is blown up past its size */
  .reply .shotgrid, .pendlist .shotgrid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:8px;
    margin:8px 0 9px; align-items:start;   /* same 9px rhythm as a paragraph */
  }
  .reply .shotgrid[data-n="3"], .pendlist .shotgrid[data-n="3"]{grid-template-columns:repeat(3, 1fr)}
  .reply .shotgrid[data-n="4"], .pendlist .shotgrid[data-n="4"]{grid-template-columns:repeat(4, 1fr)}
  .reply .shotgrid .shot, .pendlist .shotgrid .shot{margin:0 auto}
  /* the wrapper, not the scrolling pre, anchors the copy button: an absolute
     child of a scroller rides the scrolled content, so the button lives one
     level up and stays pinned to the visible corner while the code scrolls */
  .codeblockwrap{position:relative; margin:0 0 9px}
  .reply .codeblock, .pendlist .codeblock{
    margin:0; padding:10px 12px; border-radius:8px;           /* same 9px rhythm */
    background:#EFF1F4; border:0;   /* clean cool grey; the beige read as mud */
    font:12.5px/1.5 var(--mono); color:var(--ink);
    white-space:pre; overflow-x:auto;
    user-select:all; -webkit-user-select:all;   /* one click grabs the whole command */
  }
  .codeblockwrap .copybtn{
    position:absolute; top:6px; right:8px; padding:4px 6px;
    display:flex; align-items:center; color:var(--sub);
    background:#FFFFFF;   /* solid: the button must read over any code beneath */
    box-shadow:0 1px 4px rgba(33,29,23,.18);
    border:0; border-radius:5px; cursor:pointer;
    user-select:none; -webkit-user-select:none;
    opacity:0; pointer-events:none; transition:opacity .15s;   /* shows on hover only */
  }
  .codeblockwrap:hover .copybtn{opacity:1; pointer-events:auto}
  .codeblockwrap .copybtn:hover{color:var(--ink)}
  .reply blockquote, .pendlist blockquote{
    margin:0 0 9px 2px; padding:2px 0 2px 12px;   /* same 9px rhythm as paragraphs */
    border-left:3px solid var(--line-strong); color:var(--sub);
  }
  .reply blockquote:last-child{margin-bottom:0}
  textarea.dropping{border-color:var(--accent) !important}
  body.focus .box.sel textarea.dropping{background:var(--accent-soft)}
  /* home, greyed out until it does something */
  #homeico{display:none}
  body.focus #homeico{display:flex; align-items:center; color:#C9BFAE}
  /* on-canvas edit mode: the bar's pencil toggles it; boxes then drag with no
     keys held and wear small squares that snap-resize them */
  body.editmode :is(main, #clockbox, #rail, #tickets, #magic1, #magic2, #magic3, #goalbox),
  body.editmode :is(main, #clockbox, #rail, #tickets, #magic1, #magic2, #magic3, #goalbox) *{cursor:move}
  #edithandles{position:fixed; left:0; top:0; width:var(--cw); height:var(--ch);
    pointer-events:none; z-index:30; display:none}
  body.editmode #edithandles{display:block}
  .rhandle{position:absolute; width:9px; height:9px; background:#fff;
    border:1px solid var(--accent); border-radius:2px; pointer-events:auto;
    box-shadow:0 1px 3px rgba(60,45,20,.25)}
  /* the region cross, one per box while the pencil is on: a plain black cross,
     no chip behind it. it sits just outside the top right corner, clear of the
     resize squares and of whatever the box itself is holding */
  .rkill{position:absolute; width:16px; height:16px;
    background:none; border:none; padding:0; cursor:pointer; pointer-events:auto;
    transform:translate(-50%,-50%); z-index:31; opacity:.72; transition:opacity .18s}
  .rkill:hover{opacity:1}
  .rkill::before, .rkill::after{content:""; position:absolute; left:50%; top:50%;
    width:12px; height:1.4px; background:#1e1e1e; border-radius:1px}
  .rkill::before{transform:translate(-50%,-50%) rotate(45deg)}
  .rkill::after{transform:translate(-50%,-50%) rotate(-45deg)}

</style>

  body.focus #pagepill{
    /* --mark is the one size every item in the pill draws itself at, so the
       plus and the page marks cannot drift apart; --pillgap is named because
       a dot growing in has to cancel it, and a flex gap cannot be animated */
    --mark:7px; --pillgap:6px;
    align-items:center; gap:var(--pillgap);
    position:fixed; left:50%; transform:translateX(-50%); bottom:8px; z-index:12;
    padding:3px 7px;
    /* the workspace's own corner, the 7px #appframe turns: a small rounded
       rectangle standing on the paper rather than a capsule */
    border-radius:7px;
    background:color-mix(in srgb, var(--paper) 92%, #fff 8%);
    border:var(--edge) solid var(--line);
    box-shadow:0 1px 3px rgba(60,45,20,.07);
  }
  body.focus #pagepill.off{display:none}
  /* the plus is drawn, not typed. A glyph sits on its font's baseline and its
     ink lands wherever the face puts it, which is not the middle of the button;
     two bars painted at the background's own centre put the cross's ink exactly
     on the box centre, which is the line the page marks sit on */
  #pagepill .pageadd{
    flex:none; width:13px; height:13px; padding:0; border:none; cursor:pointer;
    position:relative; border-radius:3px; color:var(--sub);
    background-color:transparent;
    background-image:linear-gradient(currentColor, currentColor),
                     linear-gradient(currentColor, currentColor);
    background-size:var(--mark) 1.5px, 1.5px var(--mark);
    background-position:center, center;
    background-repeat:no-repeat;
    transition:color .18s, background-color .18s;
  }
  /* the mark is small on purpose; the thing a pointer has to hit is not */
  #pagepill .pageadd::after, #pagepill .pdot::after{
    content:""; position:absolute; inset:-3px}
  #pagepill .pageadd:hover{color:var(--ink); background-color:color-mix(in srgb, #000 5%, transparent)}
  /* the page marks, both the size of the plus's own cross. The page being
     looked at is one small solid muted bullet; every other page is the same
     bullet as an outline with nothing inside it */
  #pagepill .pdot{
    flex:none; width:var(--mark); height:var(--mark); padding:0; border-radius:50%;
    background:none; border:var(--edge) solid var(--line); cursor:pointer;
    position:relative; opacity:1; margin-left:0;
    transition:border-color .18s, background-color .18s,
               width .24s cubic-bezier(0.25, 1, 0.5, 1),
               margin-left .24s cubic-bezier(0.25, 1, 0.5, 1),
               opacity .22s ease;
  }
  #pagepill .pdot:hover{border-color:var(--sub)}
  #pagepill .pdot.on{background:var(--sub); border-color:var(--sub)}
  /* a page that has just joined the row starts with no width and no ink, and
     cancels its own share of the gap, so the pill is seen to widen as the new
     mark fades up rather than arriving at its finished size */
  #pagepill .pdot.fresh{
    width:0; opacity:0; margin-left:calc(0px - var(--pillgap));
  }
  #pagepill .pageadd:focus-visible, #pagepill .pdot:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px}

  /* the right-click menu on a dot: one item, seated at the pointer */
  #pagemenu{display:none}
  body.focus #pagemenu.on{
    display:block; position:fixed; z-index:45; min-width:126px;
    background:var(--card); border:var(--edge) solid var(--line); border-radius:7px;
    box-shadow:0 4px 16px rgba(60,45,20,.16); padding:4px; overflow:hidden;
  }
  #pagemenu .pagemenuitem{
    display:block; width:100%; text-align:left; border:none; background:none;
    font:13px var(--sans); color:var(--ink); padding:6px 10px; border-radius:5px;
    cursor:pointer;
  }
  #pagemenu .pagemenuitem:hover, #pagemenu .pagemenuitem:focus-visible{
    background:color-mix(in srgb, var(--accent) 10%, var(--accent-soft)); outline:none}

  /* the confirmation, centred over the whole workspace. it takes the pointer
     and the keys for as long as it is up, so nothing behind it can be reached
     by either while the question is unanswered */
  #pagewarn{display:none}
  body.pagewarn #pagewarn{
    display:grid; place-items:center; position:fixed; inset:0; z-index:50000;
    background:color-mix(in srgb, var(--ink) 26%, transparent);
    animation:pagewarnin .14s ease-out;
  }
  @keyframes pagewarnin{from{opacity:0}}
  #pagewarnbox{
    background:var(--card); border:var(--edge) solid var(--line); border-radius:7px;
    box-shadow:0 8px 40px rgba(60,45,20,.24);
    padding:22px 24px 18px; width:min(420px, calc(100vw - 48px));
  }
  #pagewarnq{margin:0; font:500 16px/1.4 var(--sans); color:var(--ink)}
  #pagewarnkept{margin:9px 0 0; font:13px/1.5 var(--sans); color:var(--sub)}
  #pagewarnrow{display:flex; justify-content:flex-end; gap:8px; margin-top:20px}
  #pagewarnrow button{
    font:13px var(--sans); border-radius:5px; padding:6px 14px; cursor:pointer;
    border:var(--edge) solid var(--line); background:var(--card); color:var(--ink);
  }
  #pagewarnrow button:hover{background:#FAF7F1}
  #pagewarnyes{border-color:var(--must); background:var(--must); color:#fff}
  #pagewarnyes:hover{background:#93381F}
  #pagewarnrow button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  /* nothing here has to move to be understood */
  @media (prefers-reduced-motion: reduce){
    body.pagewarn #pagewarn{animation:none}
    #pagepill .pageadd, #pagepill .pdot{transition:none}
    body.focus #stage{transition:none}
  }

  /* a blank page: the project is still the project, but its board is not on
     this page. The whole stage steps back at once, by visibility rather than
     display, so every region keeps the place it was measured into and comes
     back exactly as it left; a region hidden this way takes no click and no
     tab stop, so nothing behind the blank canvas can be reached or typed
     into. The bar, its tabs and the pill stay: the page is blank, the project
     shell around it is not.
     It fades rather than cuts. visibility carries the same duration so it
     holds visible for the whole fade and flips at the end, which is what keeps
     the board on screen while it is still being seen. Only these two
     properties are named: the stage's transform is what fitStage writes on
     every resize, and transitioning that would set the whole app sliding */
  body.focus #stage{transition:opacity .18s ease, visibility .18s ease}
  body.focus.pageblank #stage{visibility:hidden; opacity:0; pointer-events:none}
  /* in-app project tabs: the board filtered to one project per tab; labels
     come from the lane directories at runtime, never from this file. the names
     sit on one glass oval in the bar, the open one under a smaller glass seat
     (the bar's glass, below). Pulling one out is the drag itself: grab a name
     and tug it downward. */
  /* fixed bar height in focus mode, 40px and its 1px bottom row. the glass
     pieces are 32px and stand at the top of it, --app-inset under the window's
     top as the pane is in from the window's sides, on one centre line, and the
     7px of padding is shared: 1px over them, so they stand 7px from the
     window's top, and 6px under them, which leaves 6px of paper between their
     foot and the pane's top edge, 6.5px on a 2x screen, where the pane's line
     sits half a pixel lower. the paper above and below the open name's lens is
     as near equal as the screen can draw it: the two add to 13px, 13.5px on a
     2x screen, an odd number of device pixels on both of the Mac's densities,
     so the row moves down the whole pixel that leaves them one device pixel
     apart and not a fraction that every edge would be drawn blurred on. the padding
     moves the row and nothing else: the bar's height, so the pane's top, the
     stage's and every page's own top, stand where they did. the pieces stand
     8px apart, the phone's own gap, and the bar has no side padding, so the
     house and the squid stand over the pane's own left and right edges */
  body.focus .bar{height:40px; padding:1px 0 6px; gap:8px}
  body.focus #toc, body.focus #tocgrip{top:41px}
  body.focus #offline{top:41px}
  #tabrow, #tabbar{display:none}
  body.focus #tabrow{position:relative; display:flex; align-items:center; gap:8px; height:32px; flex:none}
  body.focus #tabbar{display:flex; align-items:center; gap:8px; height:32px; flex:none}
  /* seated tabs per the 20260809 mockup: the active one's bottom opens into
     the canvas. 20260827: the top two corners now take the cards' own 7px, so
     a seated tab is rounded on the same terms as the shell around it and the
     boxes under it. the radius rides on every tab rather than the selected one
     alone, because the three states that draw the seated shape are .on,
     .dragging and .draft, and a resting tab paints neither fill nor border, so
     on that one the curve costs nothing and shows nothing. a radius moves no
     edge: the height, the 1px seat, the padding and the label all measure to
     the pixel what they measured before */
  .ptab{
    font:500 13px/16px var(--sans); color:var(--sub);
    background:transparent; border:var(--edge) solid transparent; border-bottom:none;
    border-radius:7px 7px 0 0; cursor:pointer; user-select:none;
    position:relative; top:1px;
    /* the top border is room and is now the edge's width, so what it gave up
       comes back as padding: the content box, and the label centred in it,
       measure what they did */
    height:38px; padding:calc(1px - var(--edge-drawn)) 16px 5px;
    /* the surface the seated tab opens into, named once here so the fill and
       both notches read it from one place. up here that surface is the canvas
       under the bar, which is the board's paper. the file navigator's folder
       tabs wear these same rules over a white panel and say so by setting this
       one property; nothing else about the shape is restated down there */
    --seat:var(--paper);
    /* the only thing that ever animates on a resting tab is the dwell band on
       its right, on the board's own curve and quick enough to read as one
       movement rather than a stretch */
    transition:padding-right 180ms cubic-bezier(0.25, 1, 0.5, 1);
  }
  .ptab:hover{color:var(--ink)}
  .ptab.on{color:var(--ink); background:var(--seat); border-color:var(--line)}
  /* the seated tab's bottom two corners bend the other way. this is the notch a
     browser tab makes where it meets its strip: at each bottom corner the paper
     flares 7px out into the bar and the hairline curves out with it, so the
     tab's sides run into the line under the bar rather than stopping dead on it
     and the seam reads as one continuous stroke. same 7px as the top corners,
     turned inside out. that line is the workspace boundary's top edge, on the
     row the bar's own bottom border used to hold; everything below is written
     as the bar's bottom because the row did not move.
     each notch is one box painted by a single radial gradient drawn from the
     corner the arc turns about. the gradient is the whole shape: clear inside
     7px so the bar shows through the bite, the board's line ink for the pixel
     between 7 and 8, the tab's own paper past 8. one circle therefore carries
     the bite, the hairline and the fill at once, and the hairline is the same
     stroke at every point of the arc by construction rather than by fitting.
     the two ends land where they have to. at the top of the arc the ink pixel
     is the ring between 7 and 8 measured sideways, which is exactly where the
     tab's own 1px border stands, and the circle is vertical there, so the
     border runs into the arc without a step. at the foot the same ring measured
     downwards is exactly the bar's own 1px bottom border, and the circle is
     horizontal there, so the arc runs off into that line. between them the
     paper covers the bar's bottom border, which is what makes the tab's inside
     open into the canvas across the flare as well as across the tab.
     the numbers: 8px of offset is 7px of flare plus the tab's own border, since
     a pseudo-element is placed from the padding box while the flare is measured
     from the tab's outer edge. the box is 8 tall, the 7px of arc plus the ink
     pixel under it, and 10 wide, the same 8 plus 2 more reaching back inside
     the tab. those two are why nothing seams: a tab's outer edge can land on a
     fraction of a pixel, and a boundary drawn on a fraction leaves a part-lit
     sliver of whatever it was meant to cover. the far edge of the box is inside
     the bite and paints nothing, and the near edge is two pixels deep in the
     tab where the gradient's own paper meets the tab's paper, so neither edge
     of this box is ever a seam, whatever fraction the tab lands on.
     the ink ring is the edge's drawn width, the outer part of that 7 to 8 band,
     so it is exactly as thick as the border it runs into and the line it runs
     off into. the offsets and the box stay as they are: the ring still ends on
     8, which is the tab's outer edge and the bar's bottom.
     both notches are out of flow and take no pointer, so an armed, hovered,
     dragged or resting tab still measures exactly what it always did. the three
     states listed are the three that draw the seated shape; a resting tab has
     no fill and no border to carry out into the bar. */
  :is(.ptab.on, .ptab.dragging, .ptab.draft)::before,
  :is(.ptab.on, .ptab.dragging, .ptab.draft)::after{
    content:""; position:absolute; bottom:0; width:10px; height:8px;
    pointer-events:none;
  }
  :is(.ptab.on, .ptab.dragging, .ptab.draft)::before{
    left:-8px;
    background:radial-gradient(circle 8px at 0 0,
      transparent 0 calc(8px - var(--edge-drawn)), var(--line) calc(8px - var(--edge-drawn)) 8px, var(--seat) 8px);
  }
  :is(.ptab.on, .ptab.dragging, .ptab.draft)::after{
    right:-8px;
    background:radial-gradient(circle 8px at 100% 0,
      transparent 0 calc(8px - var(--edge-drawn)), var(--line) calc(8px - var(--edge-drawn)) 8px, var(--seat) 8px);
  }
  /* a lane still holding a reply the reader has not opened says so with weight alone,
     the way a mail client does: no dot, no count, no colour. selection is a
     seated tab shape (paper fill, border, ink text) and never uses weight, so
     the two can sit on one tab and still read apart. 600 is the board's own
     bold, the same step the selected ticket row takes */
  /* 20260823: weight alone was invisible to the reader, twice. a mail client darkens
     as well as bolding, and that is what makes an unread line jump out of a
     list of grey ones. so unread takes the board's own ink too */
  .ptab.unread{color:var(--ink)}
  .ptab.unread .plabel{font-weight:600}
  /* bold type is wider than medium, and a bar that shuffles sideways every
     time a reply lands is worse than the problem it solves. so every label
     always holds room for its bold self: the hidden zero-height line under it
     carries the same word at 600, which sets the width whatever the visible
     weight is. top alignment keeps the word on the same pixel row as before,
     since a box with a hidden line in it can no longer be trusted to sit on
     its baseline */
  .plabel{display:inline-block; vertical-align:top}
  .plabel[data-label]::after{
    content:attr(data-label); display:block; height:0; overflow:hidden;
    visibility:hidden; font-weight:600;
  }
  .ptab.tearing{opacity:.45}
  /* a held tab rides the pointer sideways: it lifts on the selected row's own
     shadow and must paint over whatever it crosses */
  .ptab.dragging{color:var(--ink); background:var(--seat); border-color:var(--line);
    z-index:2; box-shadow:0 2px 18px rgba(60,45,20,.18), 0 1px 3px rgba(60,45,20,.10)}
  /* the others glide aside on the board's one 220ms curve, never teleport */
  .ptab.gliding{transition:transform 220ms cubic-bezier(0.25, 1, 0.5, 1)}
  /* the bare plus opens a fresh project tab after the project names */
  /* the not-yet-named tab while its folder is being chosen: upright, in the
     board's own bold (the weight an unread tab takes) */
  .ptab.draft{color:var(--ink); background:var(--seat); border-color:var(--line);
    font-weight:600}
  /* closing a project tab: no bare cross under a moving pointer, and no mark
     waiting on the tab either. a pointer that simply rests on one tab for two and
     a half unbroken seconds opens a band on that tab's right, and the cross lives in
     that band and nowhere else. skimming the bar opens nothing, so a mis-aimed
     click can never throw a project out, and a tab nobody is resting on carries
     no mark at all: it is its label plus its own 16px on each side and nothing
     more, the width it had before any of this existed.
     20260825: this replaces a chevron and its one-item menu. the chevron was
     right that a bare cross under a travelling pointer is dangerous, and wrong
     about the cure: a mark has to be visible to be found, so every tab the
     pointer crossed grew one, and a menu charges a second click for a single
     word. the dwell buys the same safety with time instead of ink.
     20260824: edit mode is for boxes and for nothing else */
  /* the band is new room, not the tab's own padding: the label keeps its 16px
     of air on both sides while the band is open, so the name never shifts
     inside its tab and only the tabs after it move, which is the movement that
     was asked for. it opens and shuts on the board's own curve */
  .ptab.armed{padding-right:26px}   /* the tab's own 16, then the 24px band */
  /* the numbers are measured off the label, never guessed. sideways the button
     is the band: 24px wide, flush to both of the band's edges, so the ink's air
     is equal by construction and not by adjustment. the arms are the region
     cross's own two bars on the board's 1.4px line, shortened from 12px to 10px
     to sit against 13px type, and a 10px bar 1.4px thick turned 45 degrees
     spans (10 + 1.4)/sqrt2 = 8.06px, which leaves (24 - 8.06)/2 = 7.97px of
     clear air on the label side and 7.97px on the border side. read back off
     the rendered pixels at 3x those two came out 8.27 and 8.40, a difference of
     0.125px that is the tab's own fractional width meeting the pixel grid and
     nothing else.
     downward it is hung on the word and not on the tab. the label is 13px on a
     16px line, its baseline 21px under the tab's top, its ascenders topping out
     at 11.33px and its x-height 6.79px, so the word's own band runs 11.33 to 21
     and its middle is 16.17px, while the lowercase band alone would put the
     middle at 17.61px. the arms centre in their 28px box, so the box is placed
     by its middle: ink centre = 1px border + top + 14.
     the aim was taken by looking, at 3x, in 0.5px steps. starting on the
     lowercase middle (top 2.5px, ink centre 18) the ink hung 0.67px below the
     baseline, which reads as a cross sitting on the line. 2.0 and 1.5 both
     landed at 17 with 2.0px of air above and 0.33px below, still low. 1.0
     lands the ink at 16, 1.0px under the ascenders and 1.33px over the
     baseline, and that is what reads level. the paint grid moves this ink a
     whole css pixel at a time here, so 16 is as close to 16.17 as it goes, and
     the same 1px holds at every pixel ratio: off by 0.00 at 1x, 0.25 at 2x and
     0.17 at 3x */
  .ptabx{
    position:absolute; right:3px; top:2.5px;
    width:24px; height:28px; padding:0;
    background:none; border:none; cursor:pointer; color:var(--sub);
    opacity:0; visibility:hidden;
    transition:opacity 180ms, color .18s, visibility 0s linear 180ms;
  }
  .ptab.armed .ptabx{opacity:1; visibility:visible;
    transition:opacity 180ms, color .18s, visibility 0s}
  .ptabx:hover{color:var(--ink)}
  /* the last tab stays: the board must always have a lane to sit on. the cross
     says so by going pale before the click rather than swallowing it */
  .ptabx.off{cursor:default}
  .ptab.armed .ptabx.off{opacity:.3}
  .ptabx.off:hover{color:var(--sub)}
  :is(.ptabx, .lenscross)::before, :is(.ptabx, .lenscross)::after{content:""; position:absolute; left:50%; top:50%;
    width:10px; height:1.4px; background:currentColor; border-radius:1px}
  :is(.ptabx, .lenscross)::before{transform:translate(-50%,-50%) rotate(45deg)}
  :is(.ptabx, .lenscross)::after{transform:translate(-50%,-50%) rotate(-45deg)}
  /* a closed tab is simply not in the bar, and it is nowhere else either: the
     plus button's folder flow is the one way back to it */
  .ptab.closed{display:none}
  #projnote{display:none; flex:none; font:12px var(--mono); color:var(--must);
    background:var(--must-bg); border-radius:4px; padding:3px 10px}
  #projnote.show{display:inline-block}

  /* ---- the bar's glass ---------------------------------------------------- */
  /* the bar's controls are drawn as the phone's bottom row draws its buttons
     (#dock in m.html): the speaker and squid keep the board's glass (.qn-glass),
     while Home and plus are bare marks. All four keep 32px hit areas, the row's
     48px at two thirds, so each mark keeps the share of its area it has on the phone (the
     squid's 20px in 32 is the phone's 30 in 48, and the 15px house and speaker
     are the phone's 22px ticket in 48). the project names stand on the page,
     with a lens of the same height over the selected name. Its material uses
     this same glass, with clean enlarged text inside and refraction at the rim.
     the rest of this sheet loads before the glass's, so every rule here is
     scoped by the page to outrank the glass's own corner.
     the glass's numbers are registered here as the phone registers them, so a
     press eases the face, its highlights and its shadows together */
  @property --qn-tint{syntax:"<number>"; inherits:true; initial-value:.77}
  @property --qn-edge{syntax:"<number>"; inherits:true; initial-value:2}
  /* the top rim is one line, as on the phone's row: the glass's white
     highlight on the first row and its faint dark band two rows deep are left
     out, so the grey ring is the top edge as it is the sides', and the rest of
     the stack, the bottom rim, the inner glow and the outer shadow, is the
     glass's own. the workspace's pane wears the same edge */
  body.focus :is(.bar .qn-glass, #appframe){
    box-shadow:
      inset 0 -1px 0 rgba(255,255,255,calc(.45 * var(--qn-edge))),
      inset 0 0 0 1px var(--qn-ring),
      inset 0 0 2px rgba(255,255,255,calc(.35 * var(--qn-edge))),
      inset 0 12px 12px -6px rgba(255,255,255,calc(.55 * var(--qn-edge))),
      0 1px 2px -1px rgba(0,0,0,.18),
      0 1px 3px rgba(0,0,0,.07),
      0 8px 20px rgba(0,0,0,.06)}
  /* the controls: the mark centred, in the sub ink and the full ink under a
     pointer as the bare marks were, and the house in the full ink while home
     is up */
  body.focus :is(#homeico, #chimebtn, #setbtn, #tabbar .ptabplus){
    flex:none; position:relative; box-sizing:border-box; width:32px; height:32px;
    margin:0; padding:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--sub); cursor:pointer; -webkit-user-select:none; user-select:none;
    transition:color .18s, transform .5s var(--gentle), --qn-tint .5s var(--gentle), --qn-edge .5s var(--gentle)}
  body.focus :is(#homeico, #chimebtn, #setbtn, #tabbar .ptabplus):hover,
  body.focus.home #homeico{color:var(--ink)}
  body.focus :is(#homeico, #chimebtn, #tabbar .ptabplus) svg{display:block; flex:none}
  /* the speaker still holds the right edge, and "Install app" stays between it
     and the squid as it was */
  body.focus .bar #chimebtn{margin-left:auto}
  /* the glass's own press, the phone's: a little larger and a whiter face,
     held long enough that a quick click still shows it (glassPress, in the
     script). it rises over .3s and falls back over .5s, both eased. keep the
     circles' ID specificity here, or their idle .5s transition wins during
     the press too and a quick click barely grows before it lets go */
  body.focus :is(#chimebtn, #setbtn, #tabbar .ptabplus).pressed{transform:scale(1.06); --qn-tint:.95; --qn-edge:3;
    transition:color .18s, transform .3s cubic-bezier(.22,.7,.3,1), --qn-tint .3s cubic-bezier(.22,.7,.3,1), --qn-edge .3s cubic-bezier(.22,.7,.3,1)}
  /* Home is a plain focusable button. The shared selection lens supplies its
     glass only while Home is selected, just as it does for a project name. */
  body.focus #homeico{background:none; border:none; box-shadow:none}
  /* Bare names share only a layout wrapper. The one lens paints above their
     pixels but takes no input: the buttons keep their clicks and drags. */
  body.focus #tabbar .taboval{position:relative; flex:none; display:flex; align-items:center;
    height:32px}
  body.focus #tabbar .ptab{position:relative; z-index:1; top:0;
    display:flex; align-items:center; height:32px; padding:0 14px;
    border:none; border-radius:7px; background:none;
    transition:padding-right 180ms cubic-bezier(0.25, 1, 0.5, 1), color .18s}
  body.focus #tabbar .ptab.closed{display:none}
  body.focus #tabbar .ptab::before, body.focus #tabbar .ptab::after{content:none}
  body.focus #tabbar :is(.ptab.on, .ptab.draft, .ptab.dragging){background:none; border:none; box-shadow:none}
  body.focus #tabbar .ptab.dragging{z-index:2}
  body.focus #tabbar .ptab.gliding{transition:transform 220ms cubic-bezier(0.25, 1, 0.5, 1), color .18s}
  body.focus #tabbar .ptab.armed{padding-right:26px}
  body.focus #tabbar .ptabx{top:4px; height:24px}
  /* Use the controls' actual glass material. The native backdrop is visible
     only around the rim: the opaque, matching face inside replaces its pixels
     before clean enlarged text is painted, so the original ink cannot ghost.
     on a project's name the lens turns the workspace's own 7px at all four
     corners, a box and not a capsule (LENS_CORNER in the script says the same).
     over the house it is the house's circle, half its 32px, as it always was:
     the seat takes .round while it is set down on Home or carried over the
     house (placeSeat and moveTabSelection) and a name takes it off again. the
     script reads each lens's corner from here, so its maps, mask and joint
     follow whichever it wears */
  body.focus #tabrow .projectlens{position:absolute; left:0; top:0; height:32px;
    box-sizing:border-box; border-radius:7px; z-index:3; pointer-events:none;
    backdrop-filter:var(--lens-filter); -webkit-backdrop-filter:var(--lens-filter)}
  body.focus #tabrow .tabseat.round .projectlens{border-radius:16px}
  body.focus #tabrow .lensclear{position:absolute; inset:0; border-radius:inherit;
    --qn-tint:inherit; --qn-edge:inherit; --qn-ring:inherit;
    background-color:color-mix(in srgb, var(--paper), #fff calc(var(--qn-tint) * 100%));
    background-image:inherit; box-shadow:inherit;
    backdrop-filter:none; -webkit-backdrop-filter:none;
    mask:var(--lens-center-mask);
    pointer-events:none; overflow:hidden}
  body.focus #tabrow .lensglyph{position:absolute; left:0; top:0; margin:0; padding:0;
    border:0; transform-origin:0 0; pointer-events:none}
  body.focus #tabrow .lenscross{background:none}
  /* The outer seat moves and sizes the lens. Only the inner lens grows on
     press: its map stays in local coordinates, separate from the slide.
     Fade the lens itself, never an ancestor that would cut off its backdrop. */
  body.focus #tabrow .tabseat{position:absolute; left:0; top:0; height:32px; width:0;
    z-index:3; pointer-events:none;
    transition:transform .28s var(--gentle), width .28s var(--gentle),
      translate 220ms cubic-bezier(0.25, 1, 0.5, 1)}
  body.focus #tabrow .tabseat.still{transition:translate 220ms cubic-bezier(0.25, 1, 0.5, 1)}
  body.focus #tabrow .seatlens{width:100%;
    transition:transform .5s var(--gentle), --qn-edge .5s var(--gentle), opacity .18s var(--gentle)}
  /* a drag's release slides and resizes the seat (it is not .still), and a lens
     going back to the house, or off it, turns between a name's corner and the
     circle over the same .28s as it changes size. a click sets it down at once
     (.still) and a drag changes the shape as it changes the width, with none */
  body.focus #tabrow .tabseat:not(.still) .seatlens{
    transition:transform .5s var(--gentle), --qn-edge .5s var(--gentle), opacity .18s var(--gentle), border-radius .28s var(--gentle)}
  body.focus #tabrow .tabseat.gone .seatlens{opacity:0}
  body.focus #tabrow .tabseat.pressed .seatlens{transform:scale(1.1); --qn-edge:3.5;
    transition:transform .38s cubic-bezier(.2,.8,.2,1), --qn-edge .38s ease-out, opacity .18s var(--gentle)}
  body.focus #tabrow :is(.tabseat.carried, .tabheld){z-index:4}
  /* the joint: the open project's lens joined to the workspace's pane, as the
     seated tab's open bottom once was (the seat's joint, in the script). one
     svg over the bar and the pane's top edge, taking no pointer. it stands
     beside the bar rather than in it, fixed, at the bar's own level and after
     it: fixed inside the sticky bar it was cut off at the body's foot, which
     is the bar's foot (seen in WebKit), and the joint reaches past it into the
     pane. it paints
     over the lens's foot and the pane's top line where the two are joined: a
     face that is the lens's own clean face (.lensclear: the glass's white over
     the paper) going over into the white of the pane's lit top edge and
     fading into the pane under its line, and the glass's 1px ring, a 2px
     stroke kept to its inner half by the face. a name carried in a reorder
     keeps its own lens over the joint (the script cuts it out). no blur,
     filter or mask: the outline is drawn afresh only while it moves */
  #seatjoin{display:none}
  body.focus #seatjoin{display:block; position:fixed; left:0; top:0; width:100%;
    height:calc(var(--app-inset) + var(--bar-h) + 12px); overflow:visible;
    pointer-events:none; z-index:10}
  #seatjoin .ring{fill:none; stroke-width:2px; stroke-linejoin:round}
  #seatjoin .jl{stop-color:color-mix(in srgb, var(--paper), #fff calc(var(--qn-tint) * 100%))}
  #seatjoin .jp{stop-color:color-mix(in srgb, var(--paper), #fff 93%)}
  #seatjoin .jp.gone{stop-opacity:0}
  /* the plus: a bare mark after the names, its two bars the house's line,
     in the ink at three quarters as the typed plus was, and full under a
     pointer */
  body.focus #tabbar .ptabplus{background:none; border:none; box-shadow:none;
    color:color-mix(in srgb, var(--ink) 75%, transparent)}
  body.focus #tabbar .ptabplus:hover{color:var(--ink)}
  /* ---- new-project tab: the owner's landing ------------------------------ */
  /* one centered screen, the dotted grid off: the wordmark over a sunken
     white well listing the open folders, the current one bold, then the
     raised start button that opens the system folder chooser. All landing
     type is Inter (row paths stay grey mono); no text on this screen may
     be orange: orange lives only in the well's text selection and in its
     scrollbar thumb. Centers in the page's frame, untouched by the stage
     or drag layouts. */
  #newproj{display:none}
  body.choosing{background-image:none}   /* no dots on this page */
  body.choosing #sections, body.choosing #pwdline{display:none}
  body.choosing .box{display:none !important}
  body.choosing :is(main, #clockbox, #tickets, #magic1, #magic2, #magic3,
    #magic4, #goalbox, #rail, #taskchip){display:none !important}
  /* the wrapper is the page's frame, the same rectangle the home page's panels
     stand in (under the bar, inset --app-inset), and centres the stack in it
     both ways, so the air above the logo and below the button is equal at any
     window size and any list length. it takes no pointer; the stack does */
  body.choosing #newproj{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:fixed; z-index:5; pointer-events:none;
    top:calc(var(--app-inset) + var(--bar-h) - 1px - var(--edge-drawn));
    left:var(--app-inset); right:var(--app-inset); bottom:var(--app-inset);
  }
  #nphome{display:flex; flex-direction:column; align-items:center;
    width:min(30rem, 88vw); pointer-events:auto}
  /* on the new tab the landing's three pieces arrive one beat apart on a soft
     rise; on home they take the page's plain fade instead (see homefade below).
     the reduced-motion rule above stills them all */
  @keyframes npmelt{from{opacity:0; transform:translateY(6px)}}
  #npbrand, #nppanel, #npstart{animation:npmelt .2s cubic-bezier(.2,.7,.3,1) both}
  #nppanel{animation-delay:.05s}
  #npstart{animation-delay:.1s}
  /* the brand line is one lockup: the mark stands immediately left of the word,
     centred on the word's own line, and the word keeps the vertical place it
     holds without it. Nothing on this server hands out a file from the repo
     folder, so the mark rides in the page as a data URI: the README's exact
     transparent squid PNG. The box keeps its original width and 32px height,
     the word's own ink height, so neither the word nor the line box moves. */
  #npbrand{font:700 40px/1.1 var(--inter); letter-spacing:-.02em; color:var(--ink);
    display:flex; align-items:center; gap:6px}
  #npmark{flex:none; width:calc(32px * 128 / 101); height:32px; object-fit:contain}
  /* The copy keeps the word's original line box, so the mark stays centered
     against Facilitator. The version sits in the existing gap below it and
     does not move the landing or its folder well. */
  #npbrandcopy{position:relative; display:inline-block}
  #npbrandname{display:block}
  #npversion{position:absolute; top:calc(100% - 1px); left:1px;
    font:500 10px/1.1 var(--inter); letter-spacing:.035em;
    color:var(--sub); opacity:.5; white-space:nowrap}
  /* the folders box: embedded, never floating; a white sunken well in the
     paper, inset shadow only, no outer shadow, corners near square */
  #nppanel{width:100%; margin:20px 0 0; padding:6px;
    background:#FFFFFF;
    border:none; border-radius:4px; min-height:330px;
    box-shadow:inset 0 1px 6px rgba(60,45,20,.14), inset 0 0 0 1px rgba(60,45,20,.08)}
  /* selecting text inside the well takes the app-wide block dress set at the
     top of the sheet, so the whole markdown tool marks a pick the same way */
  #nphead{display:none}   /* the whole Active Folders bar removed */
  #nprows{display:flex; flex-direction:column; gap:2px; padding:0 0 4px;
    max-height:56vh; overflow-y:auto}
  /* rows are plain information, never controls, with one exception: the row
     of a project whose tab was closed is the way back to it, so that row and
     only that row takes clicks and says so with the pointer and a soft fill.
     --row-hover is that fill, also the start button's shade under the pointer */
  :root{--row-hover:#FFF8EF}
  .nprow{display:flex; flex-direction:column; gap:1px; width:100%;
    padding:9px 12px; text-align:left}
  .nprow.shut{cursor:pointer; border-radius:5px}
  .nprow.shut:hover{background:var(--row-hover)}
  .npname{font:400 15px/1.35 var(--inter); color:var(--ink)}
  .nppath{font:11px var(--mono); color:var(--sub); max-width:100%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  /* the start button is dressed like the open card: a white surface, the
     card's corner radius, a thin border in the line colour and the board's ink.
     the border's drawn width is taken out of the padding so the button keeps its
     outer size. hovering or pressing fills it with the fill a project row takes
     under the pointer */
  #npstart{margin:18px 0 0; font:500 14px var(--inter); color:var(--ink);
    background:var(--card); border:var(--edge) solid var(--line); border-radius:7px;
    padding:calc(12px - var(--edge-drawn)) calc(26px - var(--edge-drawn));
    cursor:pointer}
  #npstart:hover, #npstart:active{background:var(--row-hover)}
  body.focus .name{display:none}
  body.focus #offline{
    position:fixed; left:14px; bottom:12px; top:auto; transform:none;
    z-index:20; border:var(--edge) solid var(--line); max-width:40ch; border-radius:0;
    font-size:12px; padding:7px 12px;
  }
  /* auto side margins center a shot narrower than the column; one wider than
     the column is capped by max-width and the auto margins fall to zero */
  .reply .shot{display:block; max-width:100%; border-radius:6px; margin:8px auto}
  .reply a{color:inherit; text-decoration:underline; text-underline-offset:2px}
  /* a row of images written on one line: the columns come from that line's
     own count (data-n), capped at four so a long line keeps usable width.
     each cell caps its shot, so none is blown up past its size */
  .reply .shotgrid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:8px;
    margin:8px 0 9px; align-items:start;   /* same 9px rhythm as a paragraph */
  }
  .reply .shotgrid[data-n="3"]{grid-template-columns:repeat(3, 1fr)}
  .reply .shotgrid[data-n="4"]{grid-template-columns:repeat(4, 1fr)}
  .reply .shotgrid .shot{margin:0 auto}
  /* inline code keeps the surrounding card text size and line height while
     changing only its face to mono. pre-wrap preserves command spacing while
     still allowing a long span to wrap */
  .reply .inlinecode{
    font-family:var(--mono); font-size:inherit; line-height:inherit;
    color:var(--ink); background:var(--paper);
    border-radius:var(--sq); padding:1px 4px; white-space:pre-wrap;
  }
  /* the wrapper, not the scrolling pre, anchors the copy button: an absolute
     child of a scroller rides the scrolled content, so the button lives one
     level up and stays pinned to the visible corner while the code scrolls */
  .codeblockwrap{position:relative; margin:0 0 9px}
  .reply .codeblock{
    margin:0; padding:10px 12px; border-radius:8px;           /* same 9px rhythm */
    background:#EFF1F4; border:0;   /* clean cool grey; the beige read as mud */
    font:12.5px/1.5 var(--mono); color:var(--ink);
    white-space:pre; overflow-x:auto;
    user-select:text; -webkit-user-select:text;
  }
  .codeblockwrap .copybtn{
    position:absolute; top:6px; right:8px; padding:4px 6px;
    display:flex; align-items:center; color:var(--sub);
    background:#FFFFFF;   /* solid: the button must read over any code beneath */
    box-shadow:0 1px 4px rgba(33,29,23,.18);
    border:0; border-radius:5px; cursor:pointer;
    user-select:none; -webkit-user-select:none;
    opacity:0; pointer-events:none; transition:opacity .15s;   /* shows on hover only */
  }
  .codeblockwrap:hover .copybtn{opacity:1; pointer-events:auto}
  .codeblockwrap .copybtn:hover{color:var(--ink)}
  .reply blockquote{
    margin:0 0 9px 2px; padding:2px 0 2px 12px;   /* same 9px rhythm as paragraphs */
    border-left:3px solid var(--line); color:var(--sub);
  }
  .reply blockquote:last-child{margin-bottom:0}
  /* card prose, the .cardmd rules, is shared with the phone page: card-tokens.css */
  /* the drop mark: the formatted row wears it on the same element the plain
     one does, since the field's class list is the editor's scroller while the
     editor is on */
  textarea.dropping, .cffield .cm-scroller.dropping{border-color:var(--accent) !important}
  body.focus .box.sel :is(textarea, .cffield .cm-scroller).dropping{background:var(--accent-soft)}
  /* home: the house at the head of the bar opens the home page, a blank page
     above every project holding the token panel and nothing else (its own
     sheet, home-widgets.css). the house is a glass circle at the bar's left
     end (the bar's glass). while home is up the house is the one marked, in
     the full ink, no project's name is under the seat, the board fades out the
     way a blank page's does, and any project's name brings its board back */
  #homeico{display:none}
  /* the right half of the page's frame (the rectangle drawn under the bar, inset
     --app-inset on each side) holds the token box and the limits box as one
     unit. #homepair is a column as tall as the frame and 35% of its width,
     centred on the right half's own vertical line, with its two boxes stacked
     in the middle of its height and --home-gap between them (twice
     the board's medium gap, --sp-m). the limits box is directly under the
     token box and as wide, so both share the line, and the pair is centred in
     the frame however tall the limits box is, following the window. the token
     box keeps its 35% of the frame's height and gives up height only when the
     pair would not otherwise fit; the limits box reserves all four rows. the
     column takes no clicks, only the two boxes do. the panel fills the token box and its
     charts are drawn to the height left for them, scrolling sideways inside
     it (home-widgets.css) */
  #homepair{display:none}
  body.focus.home #homepair{display:flex; flex-direction:column; justify-content:center;
    position:fixed; z-index:5; pointer-events:none;
    --home-l:var(--app-inset); --home-r:calc(100vw - var(--app-inset));
    --home-t:calc(var(--app-inset) + var(--bar-h) - 1px - var(--edge-drawn));
    --home-b:calc(100vh - var(--app-inset));
    --home-gap:calc(var(--sp-m) * 2);
    --home-w:calc((var(--home-r) - var(--home-l)) * .35);
    left:calc(var(--home-l) * .25 + var(--home-r) * .75 - var(--home-w) / 2);
    top:var(--home-t); width:var(--home-w); height:calc(var(--home-b) - var(--home-t));
    gap:var(--home-gap)}
  #home{display:none}
  body.focus.home #home{display:block; flex:0 1 calc((var(--home-b) - var(--home-t)) * .35);
    min-height:0; pointer-events:auto}
  body.focus.home #homeplot{height:100%; --tk-panel-h:100%}
  #homelimits{display:none}
  body.focus.home #homelimits:not([hidden]){display:block; flex:none; pointer-events:auto}
  /* a thin vertical line at the exact horizontal centre of the same frame, 70%
     of its height and centred in it, so it touches neither edge. it is drawn in
     the board's own line colour (the one under the tab names) at its hairline
     width, takes no clicks and follows the window */
  #homeline{display:none}
  body.focus.home #homeline{display:block; position:fixed; z-index:5; pointer-events:none;
    --home-l:var(--app-inset); --home-r:calc(100vw - var(--app-inset));
    --home-t:calc(var(--app-inset) + var(--bar-h) - 1px - var(--edge-drawn));
    --home-b:calc(100vh - var(--app-inset));
    left:calc((var(--home-l) + var(--home-r)) / 2);
    top:calc(var(--home-t) * .85 + var(--home-b) * .15);
    width:var(--edge-drawn); height:calc((var(--home-b) - var(--home-t)) * .7);
    transform:translateX(-50%); background:var(--line)}
  /* the left half of the same frame holds the new tab's own picker (#newproj,
     one set of markup and one builder): a box as wide as the half and as tall as
     the frame, the stack centred in it by flex both ways, so it follows the
     window as the two boxes on the right do. the box takes no clicks, only the
     stack does. a long list scrolls inside its well, which is capped at 56vh
     as on the new tab and, in a window too short for that, gives up its floor
     and shrinks, so the stack never runs under the bar or past the bottom */
  body.focus.home #newproj{display:flex; flex-direction:column; align-items:center;
    justify-content:center; position:fixed; z-index:5; pointer-events:none;
    --home-l:var(--app-inset); --home-r:calc(100vw - var(--app-inset));
    --home-t:calc(var(--app-inset) + var(--bar-h) - 1px - var(--edge-drawn));
    --home-b:calc(100vh - var(--app-inset));
    left:var(--home-l); top:var(--home-t);
    width:calc((var(--home-r) - var(--home-l)) * .5);
    height:calc(var(--home-b) - var(--home-t))}
  body.focus.home #nphome{max-width:100%; max-height:100%; pointer-events:auto}
  body.focus.home #nppanel{display:flex; flex-direction:column;
    min-height:min(330px, calc(100vh - 300px))}
  body.focus.home #nprows{flex:0 1 auto; min-height:0}
  /* every row on home is a way in, so each one takes the pointer and the soft
     fill the new tab gives a closed project's row */
  body.focus.home .nprow{cursor:pointer; border-radius:5px}
  body.focus.home .nprow:hover{background:var(--row-hover)}
  body.focus.home #stage{visibility:hidden; opacity:0; pointer-events:none}
  /* both halves come in together on one plain fade: the same start, length and
     curve as the board's own dissolve, with no movement and no stagger, so the
     landing's three pieces drop their rise here and ride on their half's fade */
  @keyframes homefade{from{opacity:0}}
  body.focus.home :is(#newproj, #homepair, #homeline){animation:homefade .18s ease both}
  body.focus.home :is(#npbrand, #nppanel, #npstart){animation:none}
  /* on-canvas edit mode: boxes drag with no keys held and wear small squares
     that snap-resize them. Nothing on the bar turns it on now (setEditMode) */
  body.editmode :is(main, #clockbox, #rail, #tickets, #magic1, #magic2, #magic3, #magic4, #goalbox),
  body.editmode :is(main, #clockbox, #rail, #tickets, #magic1, #magic2, #magic3, #magic4,
    #goalbox) *{cursor:move}
  #edithandles{position:fixed; left:0; top:0; width:var(--cw); height:var(--ch);
    pointer-events:none; z-index:30; display:none}
  body.editmode #edithandles{display:block}
  .rhandle{position:absolute; width:9px; height:9px; background:#fff;
    border:1px solid var(--accent); border-radius:2px; pointer-events:auto;
    box-shadow:0 1px 3px rgba(60,45,20,.25)}
  /* the region cross, one per box while edit mode is on: a plain black cross,
     no chip behind it. it sits just outside the top right corner, clear of the
     resize squares and of whatever the box itself is holding */
  .rkill{position:absolute; width:16px; height:16px;
    background:none; border:none; padding:0; cursor:pointer; pointer-events:auto;
    transform:translate(-50%,-50%); z-index:31; opacity:.72; transition:opacity .18s}
  .rkill:hover{opacity:1}
  .rkill::before, .rkill::after{content:""; position:absolute; left:50%; top:50%;
    width:12px; height:1.4px; background:#1e1e1e; border-radius:1px}
  .rkill::before{transform:translate(-50%,-50%) rotate(45deg)}
  .rkill::after{transform:translate(-50%,-50%) rotate(-45deg)}

  /* Omni cards keep the normal state machine and right-side metadata. Their
     supplied playing-card art replaces the internal-id prefix at the left,
     while white remains the face through queued, working and reader states. */
  .trow.omni-ticket{background:#fff}
  .trow.omni-ticket .trowin{padding-left:8px}
  .omni-art{display:block; flex:none; width:auto; height:calc(100% - 8px);
    max-width:52px; object-fit:contain; object-position:center}
  .box.omni-card{background:#fff !important}
  .box.omni-card .num, .toc-entry.omni-card .tnum{display:none}
  /* the card's art stands exactly as tall as the title's letters are set: its
     font size is the title's own (17.5px, 30px on the open card) and it is one
     em high at its natural width. it rides the title's first line, centred in
     that line's 1.25 height the way the words are, so a title that wraps
     keeps the art beside its opening words */
  .omni-card-art{display:block; flex:none; font-size:17.5px; width:auto; height:1em;
    align-self:flex-start; margin-top:.125em; object-fit:contain; object-position:center}
  body.focus .box.sel.omni-card{background:#fff !important}
  body.focus .box.sel.omni-card .head{flex-wrap:nowrap; align-items:center}
  body.focus .box.sel.omni-card .omni-card-art{order:10; font-size:30px;
    margin-left:calc(var(--pad-x)*2/3)}
  body.focus .box.sel.omni-card .title{flex:1 1 0; padding-left:0}
  /* the Omni light. the ordinary working shimmer reads because it is white
     laid over a tinted row: lighter than everything it crosses, one soft rise
     and fall as wide as the row with no flat top, and always moving. an Omni
     card is already white, and white cannot be lit any whiter, so the light is
     two layers, each a bell of evenly stepped stops with no plateau:
     the warmth, a wide bell of warm white multiplied in, warms the white it
     crosses the way sun warms paper and leaves the ink as dark as it was;
     the glare, a narrow bell of near white screened in over it, brightens
     all that is not already white, the words, the art, the rules, and turns
     the middle of the warmth back to white, so it reads as a hot core in a
     warm glow. on a working Omni row both ride the ordinary shimmer's own
     keyframes, width and pace */
  .trow.omni-ticket.working::before{
    content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply;
    background:linear-gradient(90deg, rgba(255,242,232,0) 0%, rgba(255,242,232,.07) 10%,
      rgba(255,242,232,.21) 20%, rgba(255,242,232,.46) 30%, rgba(255,242,232,.73) 40%,
      rgba(255,242,232,.85) 50%, rgba(255,242,232,.73) 60%, rgba(255,242,232,.46) 70%,
      rgba(255,242,232,.21) 80%, rgba(255,242,232,.07) 90%, rgba(255,242,232,0) 100%);
    animation:ticket-working-shimmer 1.6s linear infinite; will-change:transform}
  .trow.omni-ticket.working::after{
    mix-blend-mode:screen;
    background:linear-gradient(90deg, rgba(255,255,253,0) 39.5%, rgba(255,255,253,.04) 41%,
      rgba(255,255,253,.1) 42.5%, rgba(255,255,253,.23) 44%, rgba(255,255,253,.44) 45.5%,
      rgba(255,255,253,.69) 47%, rgba(255,255,253,.91) 48.5%, rgba(255,255,253,1) 50%,
      rgba(255,255,253,.91) 51.5%, rgba(255,255,253,.69) 53%, rgba(255,255,253,.44) 54.5%,
      rgba(255,255,253,.23) 56%, rgba(255,255,253,.1) 57.5%, rgba(255,255,253,.04) 59%,
      rgba(255,255,253,0) 60.5%)}
  /* the same light crossing a whole card, or its row in the ticket list, as it
     becomes Omni, bottom left to top right, and back the other way as it stops
     being one. the script moves it by --omni-p, the light's centre on the
     sweep's 0..1 measure: 0 at the bottom left corner, 1 at the top right.
     each layer is a bell along --omni-dir, reaching 24% either side (the
     script's OMNI_SWEEP_REACH), with a round sun of --omni-sun, its white core
     --omni-core, riding the diagonal itself. a card lays its stops "to top
     right", one value along each line parallel to its other diagonal; a row,
     far wider than it is tall, lays them at 45 degrees, so the light slides
     across it as a slanted shine rather than lying along its length, and
     takes a smaller sun. the element takes no z-index of its own, so each
     layer's blend reaches what is under it */
  .omni-sweep{position:absolute; inset:0; pointer-events:none; --omni-p:-1;
    --omni-dir:to top right; --omni-sun:160px; --omni-core:50px;
    --omni-c:calc(var(--omni-p) * 100%);
    --omni-x:calc(var(--omni-p) * 100%); --omni-y:calc((1 - var(--omni-p)) * 100%)}
  .trow > .omni-sweep{--omni-dir:45deg; --omni-sun:56px; --omni-core:18px}
  .omni-sweep::before, .omni-sweep::after{content:""; position:absolute; inset:0; z-index:40}
  .omni-sweep::before{
    mix-blend-mode:multiply;
    background:
      radial-gradient(circle at var(--omni-x) var(--omni-y), rgba(255,242,232,.88) 0,
        rgba(255,242,232,.68) calc(var(--omni-sun) * .25), rgba(255,242,232,.31) calc(var(--omni-sun) * .5),
        rgba(255,242,232,.08) calc(var(--omni-sun) * .75), rgba(255,242,232,0) var(--omni-sun)),
      linear-gradient(var(--omni-dir), rgba(255,242,232,0) calc(var(--omni-c) - 24%),
        rgba(255,242,232,.11) calc(var(--omni-c) - 18%), rgba(255,242,232,.32) calc(var(--omni-c) - 12%),
        rgba(255,242,232,.62) calc(var(--omni-c) - 6%), rgba(255,242,232,.78) var(--omni-c),
        rgba(255,242,232,.62) calc(var(--omni-c) + 6%), rgba(255,242,232,.32) calc(var(--omni-c) + 12%),
        rgba(255,242,232,.11) calc(var(--omni-c) + 18%), rgba(255,242,232,0) calc(var(--omni-c) + 24%))}
  .omni-sweep::after{
    mix-blend-mode:screen;
    background:
      radial-gradient(circle at var(--omni-x) var(--omni-y), rgba(255,255,253,1) 0,
        rgba(255,255,253,.82) calc(var(--omni-core) * .2), rgba(255,255,253,.46) calc(var(--omni-core) * .4),
        rgba(255,255,253,.17) calc(var(--omni-core) * .6), rgba(255,255,253,.05) calc(var(--omni-core) * .8),
        rgba(255,255,253,0) var(--omni-core)),
      linear-gradient(var(--omni-dir), rgba(255,255,253,0) calc(var(--omni-c) - 9%),
        rgba(255,255,253,.04) calc(var(--omni-c) - 7.5%), rgba(255,255,253,.14) calc(var(--omni-c) - 6%),
        rgba(255,255,253,.32) calc(var(--omni-c) - 4.5%), rgba(255,255,253,.61) calc(var(--omni-c) - 3%),
        rgba(255,255,253,.88) calc(var(--omni-c) - 1.5%), rgba(255,255,253,1) var(--omni-c),
        rgba(255,255,253,.88) calc(var(--omni-c) + 1.5%), rgba(255,255,253,.61) calc(var(--omni-c) + 3%),
        rgba(255,255,253,.32) calc(var(--omni-c) + 4.5%), rgba(255,255,253,.14) calc(var(--omni-c) + 6%),
        rgba(255,255,253,.04) calc(var(--omni-c) + 7.5%), rgba(255,255,253,0) calc(var(--omni-c) + 9%))}
  /* the ting that finishes the light, the way a shine on something polished
     ends in an animated show: the moment the light reaches the card's top
     right corner, a glint flashes on that corner point, sitting on the card's
     edge. long, very thin rays across and up and down, shorter and thinner
     ones on the diagonals, each tapering to a point, round a tiny intense
     white core. a crisp soft grey edge with the barest warmth and a pale glow
     are what let white show against the white card. it pops open in 90ms with a small turn, holds,
     and shrinks to nothing, 300ms in all (the script's OMNI_GLINT_MS). the
     script hangs it off the body at the corner's own place on the screen, so
     the card's rounded clip cannot cut the rays that reach past its edge */
  .omni-glint{position:fixed; width:8px; height:8px; margin:-4px 0 0 -4px; z-index:1000;
    pointer-events:none; border-radius:50%;
    background:radial-gradient(circle, #fff 0, #fff 34%, rgba(255,252,248,.85) 54%, rgba(255,252,248,0) 74%);
    filter:drop-shadow(0 0 .8px rgba(204,192,182,.95)) drop-shadow(0 0 4px rgba(255,244,236,.9));
    animation:omni-glint 300ms both}
  .omni-glint::before, .omni-glint::after, .omni-glint i{position:absolute; left:50%; top:50%;
    background:#fff}
  .omni-glint::before{content:""; width:76px; height:3px; margin:-1.5px 0 0 -38px;
    clip-path:polygon(0 50%, 50% 0, 100% 50%, 50% 100%)}
  .omni-glint::after{content:""; width:3px; height:76px; margin:-38px 0 0 -1.5px;
    clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%)}
  .omni-glint i{width:30px; height:2px; margin:-1px 0 0 -15px;
    clip-path:polygon(0 50%, 50% 0, 100% 50%, 50% 100%)}
  .omni-glint i:first-child{transform:rotate(45deg)}
  .omni-glint i:last-child{transform:rotate(-45deg)}
  @keyframes omni-glint{
    0%{transform:scale(0) rotate(-20deg); animation-timing-function:cubic-bezier(.2,.9,.3,1)}
    30%{transform:scale(1) rotate(0deg); animation-timing-function:linear}
    55%{transform:scale(1) rotate(4deg); animation-timing-function:cubic-bezier(.55,0,.85,.4)}
    100%{transform:scale(0) rotate(14deg)}}
</style>

<script>
// what this page throws, what it fails to fetch and what it fails to draw goes
// to the board's own log; without it a failure leaves nothing behind at all
if (typeof startReporter === "function") startReporter("board");
// the marker a freeze report carries; it goes nowhere if the reporter is absent
if (typeof noteDoing !== "function") window.noteDoing = () => {};
// the board's own settings: box places, sizes and hides, the background
// colour, the outline's width and the rest the reader arranges, kept beside
// the board by board-settings.js so every address the board is opened at
// shows the same board. It reads and writes the way localStorage does; a page
// served without that file goes on with this browser's own storage
const settingsStore = globalThis.boardSettings || localStorage;
const SECTIONS = [["toolmeta", "Tool meta"], ["triagemeta", "Triage meta"],
                  ["now", "Now"], ["done", "Done"], ["later", "Later"]];
// the two meta sections: the tool's own lane on top, the active project lane
// below. the project section's owner is whichever tab is open, so no project id
// is written here and a fresh board with only the tool lane shows just it
const METAS = ["toolmeta", "triagemeta"];
function metaOwnerOf(key){
  return key === "toolmeta" ? "facilitator" : (activeOwner !== "facilitator" ? activeOwner : null);
}
const NAME = { facilitator: "facilitator agent" };
const laneName = ow => NAME[ow] || (ow + " agent");   // project lanes name themselves
/* the dormant worktree selector's mark: a branch fork drawn in stroke only,
   so it takes the name's own muted ink through currentColor
const WT_ICON = '<svg class="wt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>';
*/
// the attach button's mark: two runs crossing at the middle of a 24 box, drawn
// at the same 17px, the same 1.9 stroke, the same round caps and the same
// currentColor the rest of the card's stroke work uses, so no new size and no
// new colour enter. 14 units of the 24, which leaves the mark clear ground
const PLUS_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>';
// the send arrow, the chat panel's own path drawn at 14px in the square's black

// ---- the lane's worktrees -------------------------------------------------
// the card's top bar names a worktree, and the names come from git by way of
// /worktrees rather than from anything typed here. one entry per lane, held for
// the life of the page: the answer changes only when the reader adds or removes a
// worktree, and the bar redraws on every poll, so a fetch per redraw would put
// a git process on the server several times a second. the cached map is read
// synchronously by the redraw and filled by the promise behind it, so a lane
// whose answer has not landed yet simply shows no name for a poll or two
const wtLanes = {};      // owner -> {current, names}, once it has landed
const wtPending = {};    // owner -> the promise in flight, so one fetch serves all askers
function laneWorktrees(owner){
  if (!ownerReady || !knownOwnerIds.has(owner))
    return Promise.resolve({ current: "", names: [] });
  if (wtLanes[owner]) return Promise.resolve(wtLanes[owner]);
  if (!wtPending[owner]){
    wtPending[owner] = fetch("/worktrees?owner=" + encodeURIComponent(owner))
      .then(r => r.json())
      .then(r => { wtLanes[owner] = { current: r.current || "", names: r.names || [] };
                   return wtLanes[owner]; })
      .catch(() => ({ current: "", names: [] }))
      .finally(() => { delete wtPending[owner]; });
  }
  return wtPending[owner];
}
// the name the bar prints: the card's own worktree when it has been moved, and
// otherwise the lane's standing branch, which is what an empty field means
function branchLabel(b){
  if (b.worktree) return b.worktree;
  const lane = wtLanes[b.owner];
  if (lane) return lane.current;
  laneWorktrees(b.owner);   // fill it for the next poll
  return "";
}
// whether this lane has anything for the bar's fork to offer. an empty list is
// what /worktrees answers for a lane with no git repository under its folder,
// and it is also what a repository whose worktrees are all detached answers, so
// the one question the bar has to ask is the same for both: is there a name to
// pick. a lane whose answer has not landed yet counts as none, so the fork
// arrives once when the answer does rather than flashing and going away
function laneHasBranches(owner){
  const lane = wtLanes[owner];
  if (!lane){ laneWorktrees(owner); return false; }   // fill it for the next poll
  return lane.names.length > 0;
}

  if (!ownerReady || !validActiveOwnerIds.has(owner)) return;
  if (LOCKED && owner !== LOCKED) return;
  if (homeOpen) setHome(false);   // a project tab leaves home for its board
  if (draft) endDraft();   // an unfinished new tab disappears on switching away
  activeOwner = owner; localStorage.setItem("activeproj", owner);
  const pick = lastState && pickInRow(lastState, owner);
  // the tab's card is shown, not selected: switching tabs is looking, the way
  // the arrow keys are, so it marks nothing read
  if (pick) browse(pick.id);

  applySavedLayout();

  // and this tab's chat, not the last tab's. after panelPoll on purpose: the
  // two share one box, and whichever arrives empties it first. going in this
  // order the chat is always the one leaving second, and its teardown is the
  // one that checks for the picture panel's mark before putting the stub line
  // back, so the panel that just arrived is never wiped by the one leaving
  chatPoll();

  if (!Array.isArray(saved)) saved = [];

  const closed = rows.filter(ow => {
    try { return !!localStorage.getItem(TABHIDE + ow); } catch (err) { return false; }

  if (!old || typeof old !== "object") old = {};

// displacement sampler uses nearest-neighbor source pixels, so it must never

// is ordinary text, positioned from the live labels, not a filtered bitmap.

// sheet's .round). the rim's maps, the clean middle's mask and the joint take
// their curve from the corner the lens wears, read from its computed style
// (paintLenses), which is a name's LENS_CORNER when nothing says otherwise

  const sig = owners.map(ow => ow + labelOf(st, ow) + ((st.pwds || {})[ow] || "") + (tabClosed(ow, st) ? "~" : "")).join(",") + "|" + from + (onHome ? "|home" : "");
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  box.textContent = "";
  for (const ow of owners){
    const shut = tabClosed(ow, st);
    const row = h("div", "nprow" + (!onHome && ow === from ? " sel" : "") + (shut ? " shut" : ""));
    row.appendChild(h("span", "npname", labelOf(st, ow)));
    row.appendChild(h("span", "nppath", (st.pwds || {})[ow] || ""));
    if (shut) row.title = "click to reopen this project";
    if (shut || onHome) row.addEventListener("click", () => { if (shut) reopenTab(ow); else setTab(ow); });
    box.appendChild(row);
  }
}
// the house leaves an unfinished new tab behind, back on the tab it came from,
// and fills the picker's rows for the home page. this runs before the home
// block's own listener opens the page
document.getElementById("homeico").addEventListener("click", () => {
  if (homeOpen) return;
  if (draft){
    const back = draft.from;
    endDraft();
    if (validActiveOwnerIds.has(back)) activeOwner = back;
  }
  if (lastState) renderHome(lastState, true);
});
// the start button hands folder choosing to the system: GET /pickdir opens
// the desktop chooser and answers with the chosen path, which then creates
// the lane the same way the old in-page browser did. the home page asks the
// same way and ends the same way, on the new project's own board
const homePick = { picking: false };
document.getElementById("npstart").addEventListener("click", async () => {
  const slot = draft || (homeOpen ? homePick : null);
  if (!slot || slot.picking) return;   // one chooser at a time
  slot.picking = true;
  const here = () => slot === homePick ? homeOpen : !!draft;
  try {
    const x = await fetch("/pickdir").catch(() => null);
    if (!here()) return;   // the page was left while the chooser sat open
    if (!x){ projNote("could not reach the server"); return; }
    if (x.status === 404){
      // a live server from before the endpoint: only a restart adds it
      projNote("the system picker needs the server restart");
      return;
    }
    const r = await x.json().catch(() => null);
    if (r?.cancelled) return;   // dismissed the chooser: nothing to say
    if (!r?.path){ projNote("could not open the folder picker"); return; }
    const path = r.path.replace(/\/+$/, "") || r.path;
    const name = path.split("/").filter(Boolean).pop() || "project";
    // a folder already behind a tab: name that tab instead of refusing. a
    // folder whose tab was closed is the reopening itself, not a refusal: the
    // lane is still the server's, and picking its folder here says
    // which one is wanted back
    const open = lastState && allRowsOf(lastState)
      .find(ow => (lastState.pwds || {})[ow] === path);
    if (open){
      if (tabClosed(open)) reopenTab(open);
      else projNote("that folder is already open as " + labelOf(lastState, open));
      return;
    }
    const px = await fetch("/project?name=" + encodeURIComponent(name),
        { method: "POST", body: path }).catch(() => null);
    const pr = px ? await px.json().catch(() => null) : null;
    if (!px?.ok || !pr?.id){
      // the server states its refusal; the note repeats it in plain words.
      // a duplicate answer with no visible tab of that name means the id
      // collides with a reserved internal lane: older servers refuse those,
      // so the note must not claim the folder is already open
      let msg = { "body must be a folder under home": "that folder is outside your home folder",
                  "empty name": "that folder has no usable name" }[pr?.error]
              || "could not create that project";
      if (pr?.error === "duplicate project"){
        const named = lastState && allRowsOf(lastState).some(ow => labelOf(lastState, ow) === name);
        msg = named ? "a project named " + name + " is already open"
                    : "that name is reserved right now, the folder can be added after the next server restart";
      }
      projNote(msg);
      return;
    }
    endDraft();
    activeOwner = pr.id; localStorage.setItem("activeproj", pr.id);
    await poll();   // the new lane arrives with its tab label and directory
    // home stays up until the lane is drawn, so the old board never shows
    if (slot === homePick && homeOpen) setHome(false);
  } finally {
    slot.picking = false;
  }
});

// ---- the home page ---------------------------------------------------------
// The house at the head of the bar opens it: one blank page above every
// project, holding the token panel (home-widgets.js) and nothing else. Being on
// it is this browser's own, like the open tab, so a reload comes back to it.
// Any project tab leaves it for that project's board, and so does the plus.
// The counts are asked for when home opens and every few minutes while it
// stays open and in view; the panel keeps its last drawing while it asks.
// The limits box under it (the same file) is asked for every minute over the
// same time: the server answers at once from the reading it keeps, renewing it
// in the background every five minutes, so the minute picks up what Claude
// Code's status line has written since and a renewal that has finished. The
// box keeps its last answer in this browser and draws it as soon as it is made,
// and its "Last updated" line is counted again every few seconds while home is up.
// Both panels are made from saved readings on load, then renewed at idle
// (homeWarm), so a press of the house finds both drawn.
const HOME_KEY = "homeopen";
const HOME_EVERY = 5 * 60 * 1000;
const LIMITS_EVERY = 60 * 1000;
const LIMITS_TICK = 15 * 1000;
let homeOpen = false;
let homeChecked = false;
let homePanel = null;
let homeLimits = null;
let homeTimer = null;
let limitsTimer = null;
let limitsTick = null;
let homeLoad = null;
// The shared assets load with the page so cached panels can be built in the
// same frame as Home opens. Retry a failed script when connectivity returns.
function homeBundle(){
  if (window.TokenWidgets) return Promise.resolve(true);
  if (homeLoad) return homeLoad;
  if (!document.getElementById("homesheet")){
    const sheet = document.createElement("link");
    sheet.id = "homesheet";
    sheet.rel = "stylesheet";
    sheet.href = "/home-widgets.css";
    document.head.append(sheet);
  }
  homeLoad = new Promise(res => {
    const s = document.createElement("script");
    s.src = "/home-widgets.js";
    s.onload = () => res(!!window.TokenWidgets);
    s.onerror = () => { homeLoad = null; s.remove(); res(false); };
    document.head.append(s);
  });
  return homeLoad;
}
function homeMake(){
  if (!window.TokenWidgets) return false;
  const plot = document.getElementById("homeplot");
  if (!homePanel) homePanel = TokenWidgets.panel(plot, { store: settingsStore });
  homeLimitsMake();
  return true;
}
function homeTick(){
  if (homePanel) homePanel.tick();
  if (homeLimits) homeLimits.tick();
}
async function homeShow(){
  // No await on the warm path: cached content is present before the next paint.
  if (!homeMake()){
    if (!await homeBundle()) return;
    homeMake();
  }
  if (!homeOpen) return;
  homeTick();
  homePanel.refresh();
  clearInterval(homeTimer);
  homeTimer = setInterval(() => { if (!document.hidden) homePanel.refresh(); }, HOME_EVERY);
  if (homeLimits){
    homeLimits.refresh();
    clearInterval(limitsTimer);
    limitsTimer = setInterval(() => { if (!document.hidden) homeLimits.refresh(); }, LIMITS_EVERY);
  }
  clearInterval(limitsTick);
  limitsTick = setInterval(() => { if (!document.hidden) homeTick(); }, LIMITS_TICK);
}
function homeLimitsMake(){
  const spot = document.getElementById("homelimits");
  if (spot && !homeLimits && window.TokenWidgets && TokenWidgets.limits) homeLimits = TokenWidgets.limits(spot);
}
// Prepare both cached drawings and renew them once while the page is idle.
async function homeWarm(){
  if (!homeMake()){
    if (!await homeBundle()) return;
    homeMake();
  }
  homePanel.refresh();
  if (homeLimits) homeLimits.refresh();
}
function homePause(){
  if (homeLimits) homeLimits.pause();
}
function homeWake(){
  if (homeOpen && !document.hidden) homeShow();
  else homePause();
}
window.addEventListener("online", homeWake);
window.addEventListener("pageshow", homeWake);
document.addEventListener("visibilitychange", homeWake);
function setHome(on){
  homeOpen = !!on;
  try {
    if (homeOpen) localStorage.setItem(HOME_KEY, "1");
    else localStorage.removeItem(HOME_KEY);
  } catch (err){}
  document.body.classList.toggle("home", homeOpen);
  document.getElementById("homeico").setAttribute("aria-pressed", String(homeOpen));
  clearInterval(homeTimer);
  homeTimer = null;
  clearInterval(limitsTimer);
  limitsTimer = null;
  clearInterval(limitsTick);
  limitsTick = null;
  if (!homeOpen) homePause();
  if (homeOpen){
    // the board's own arranging and typing go with the board
    if (editMode) setEditMode(false);
    const at = document.activeElement;
    if (at && at !== document.body && document.getElementById("stage").contains(at)) at.blur();
    homeShow();
  }
  if (lastState) renderTabs(lastState);   // no project tab is seated while home is up
}
// the house is a place, like a tab: pressing it while home is up changes nothing
document.getElementById("homeico").addEventListener("click", () => { if (!homeOpen) setHome(true); });
// put back once the whole script has run, since leaving the board touches
// state declared further down
document.addEventListener("DOMContentLoaded", () => {
  let wanted = false;
  if (FOCUS) homeMake();
  try { wanted = !!localStorage.getItem(HOME_KEY); } catch (err){}
  if (FOCUS && wanted) setHome(true);
  else if (FOCUS) (window.requestIdleCallback || (fn => setTimeout(fn, 300)))(homeWarm);
});

// ---- the project's pages ---------------------------------------------------
// A project is looked at through one of its pages. Every project starts with
// the board page, which is this board and its own workspace filter; a page
// added since is blank, an empty canvas in the same project. Which pages a
// project has and in what order is the board's record (state.pages), so two
// windows of one project always show the same row of dots. Which page this
// browser is on is this browser's own, one remembered page per project, the
// way the open tab is: choosing a page here never moves another project's.
// A page holds nothing. Deleting one takes the view record and only that: the
// project's cards, their conversations, its internal workspaces and their
// tasks are all somewhere else and are not touched by any of this.
const pageKey = ow => "activepage." + ow;
let pageMenu = null;     // {pid, dot} while the right-click menu is open
let pageWarn = null;     // {pid, owner, from} while the confirmation is up
let pageBusy = false;    // one create or one delete at a time
// the settings page is up, and covers the board the same way (see settings, near
// the end of this script)
let setOpen = false;
// a page this browser has just made, held until a reading of the board is new
// enough to speak for it. Without a hold, a reading already in flight when the
// page was made comes back without it, the row falls back to the first page,
// and the new blank one flashes back to the board.
// The hold ends on the board's revision rather than on seeing the page,
// because those two are not the same thing. Every saved change moves the
// revision, the answer that made the page names the revision it landed at, and
// any reading at or past that revision knows whether the page is still there.
// A reading below it is older than the page and says nothing about it, so the
// hold stands. A reading at or above it is the whole truth: the page is in it,
// or the page has been deleted, and either way the hold is done. Ending the
// hold on sight alone left a page deleted in another window before this one
// had read the board even once drawn as a dot until the window was reloaded,
// since the reading that should have retired it is exactly the one that no
// longer names it.
let pageHold = null;     // {owner, id, rev}

function pagesOf(state, owner){
  const list = (state && state.pages && state.pages[owner]) || [];
  return Array.isArray(list) ? list.filter(p => p && typeof p.id === "string") : [];
}
// the row the pill draws: the board's own list, plus a just-made page no
// reading old enough to matter has answered with yet. This is where the hold
// ends, so every reader of the row gets the same answer from it
function pageRow(state, owner){
  const ow = owner || activeOwner;
  const list = pagesOf(state, ow);
  if (!pageHold || pageHold.owner !== ow) return list;
  if (list.some(p => p.id === pageHold.id)){
    pageHold = null;        // the reading carries it; the hold has nothing left to do
    return list;
  }
  // a board with no revision at all cannot be told stale from current, so the
  // hold ends at the first reading rather than standing on nothing
  const rev = state && Number.isFinite(state.rev) ? state.rev : Infinity;
  if (rev >= pageHold.rev){
    pageHold = null;        // new enough to know, and it does not have the page
    return list;
  }
  return [...list, { id: pageHold.id, kind: "blank" }];
}
function readPageId(ow){
  try { return localStorage.getItem(pageKey(ow)); } catch (err){ return null; }
}
function writePageId(ow, pid){
  try {
    if (pid) localStorage.setItem(pageKey(ow), pid);
    else localStorage.removeItem(pageKey(ow));
  } catch (err){}
}
// the page this project is showing: the remembered one while it is still in
// the row, and otherwise the first page of it. A project whose pages have all
// been deleted shows none, and that is an answer rather than a gap
function curPage(state, owner){
  const ow = owner || activeOwner;
  const row = pageRow(state, ow);   // and the hold ends in there when it is done
  if (!row.length) return null;
  const want = readPageId(ow);
  return row.find(p => p.id === want) || row[0];
}
// only a page that says it is blank hides the board: an unknown kind from a
// newer board still shows what this one knows how to show
function onBoardPage(state){
  const st = state || lastState;
  if (!st || !st.pages) return true;   // an older board has no pages; this is the board
  const p = curPage(st, activeOwner);
  return !!p && p.kind !== "blank";
}
// whether the board's own keys are live: a blank page has no cards to walk,
// and the confirmation window owns the keyboard while it is up
function boardKeysLive(){ return !pageWarn && !pageMenu && !setOpen && !homeOpen && onBoardPage(); }

async function addPage(){
  if (!ownerReady || draft || activeOwner === DRAFT || pageBusy) return;
  pageBusy = true;
  const ow = activeOwner;
  try {
    const r = await fetch("/pages/new?owner=" + encodeURIComponent(ow), { method: "POST" })
      .then(x => x.json()).catch(() => null);
    if (!r || !r.id) return;
    // the revision the page landed at: readings below it are older than the
    // page, readings at or above it settle whether it is still there. A board
    // that names no revision leaves -1, which the first reading clears
    pageHold = { owner: ow, id: r.id, rev: Number.isFinite(r.rev) ? r.rev : -1 };
    writePageId(ow, r.id);      // the new page is the one being looked at at once
    if (lastState) apply(lastState);
    await poll();
  } finally {
    pageBusy = false;
  }
}

// the page goes; what to look at afterwards is decided here rather than left
// to the fallback, so removing the page you are on lands you on its neighbour
// instead of always on the first one
async function dropPage(pid){
  if (pageBusy) return false;
  pageBusy = true;
  const ow = activeOwner;
  try {
    const row = pageRow(lastState, ow);
    const at = row.findIndex(p => p.id === pid);
    const wasOn = curPage(lastState, ow)?.id === pid;
    const r = await fetch("/pages/del?owner=" + encodeURIComponent(ow) +
        "&id=" + encodeURIComponent(pid), { method: "POST" })
      .then(x => x.json()).catch(() => null);
    if (!r || !r.ok) return false;
    if (pageHold && pageHold.owner === ow && pageHold.id === pid) pageHold = null;
    if (wasOn){
      // the one after it takes over; the one before it when it was last in the
      // row; nothing at all when it was the only one
      const left = row.filter(p => p.id !== pid);
      const next = left[Math.min(Math.max(at, 0), left.length - 1)];
      writePageId(ow, next ? next.id : null);
    }
    if (lastState) apply(lastState);
    await poll();
    return true;
  } finally {
    pageBusy = false;
  }
}

function setPage(pid){
  if (!ownerReady || draft || activeOwner === DRAFT) return;
  if (!pageRow(lastState, activeOwner).some(p => p.id === pid)) return;
  shutPageMenu();
  writePageId(activeOwner, pid);
  if (lastState) apply(lastState);
}

// ---- the menu one dot opens ------------------------------------------------
function shutPageMenu(){
  if (!pageMenu) return;
  const back = pageMenu.dot;
  pageMenu = null;
  document.getElementById("pagemenu").classList.remove("on");
  if (back && back.isConnected && document.activeElement &&
      document.activeElement.closest && document.activeElement.closest("#pagemenu")) back.focus();
}
function openPageMenu(pid, x, y, dot){
  shutPageMenu();
  const menu = document.getElementById("pagemenu");
  menu.textContent = "";
  const item = h("button", "pagemenuitem", "Delete page");
  item.type = "button";
  item.setAttribute("role", "menuitem");
  item.addEventListener("click", () => {
    const from = pageMenu && pageMenu.dot;
    shutPageMenu();
    openPageWarn(pid, from);
  });
  menu.appendChild(item);
  menu.classList.add("on");
  pageMenu = { pid, dot: dot || null };
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(6, Math.min(x, innerWidth - r.width - 6)) + "px";
  menu.style.top = Math.max(6, Math.min(y, innerHeight - r.height - 6)) + "px";
  item.focus();
}

// ---- the window a deletion goes through ------------------------------------
function openPageWarn(pid, from){
  if (!pageRow(lastState, activeOwner).some(p => p.id === pid)) return;
  pageWarn = { pid, owner: activeOwner,

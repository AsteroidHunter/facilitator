// ---- the fat caret --------------------------------------------------------
// a terminal style block cursor stands in for the native caret on every
// typing surface: card reply boxes, the title while naming, the to-do input,
// quick chat and the file navigator. its left edge sits exactly on the
// insertion point. a visible character sets the block's width from the same
// rendered text; generated placeholders lend their first grapheme to an empty
// field, and other empty positions keep the established half-em cell.
{
  // the block is two layers over the one rectangle, laid straight on the page
  // so each blends with it in turn; the css beside them says why. they take
  // the same spot and go on and off together, so everything below moves the
  // pair and never one of them
  const bar = document.createElement("div");
  bar.id = "fatcaret";
  const lift = document.createElement("div");
  lift.id = "fatcaretlift";
  document.body.append(bar, lift);
  const cells = [bar, lift];
  const hide = () => { for (const el of cells) el.classList.remove("on"); };
  // the mirror clones the focused field's text layout so a marker span can
  // stand where the caret is; it stays invisible and out of the layout
  const mirror = document.createElement("div");
  mirror.style.cssText = "position:fixed; top:0; left:-9999px; visibility:hidden; pointer-events:none";
  document.body.appendChild(mirror);

  // per font metrics. asc is inline box top to baseline, measured in the dom
  // itself (a zero size inline block sits exactly on the text baseline), so
  // it matches the caret rects the layout engine reports. fbA and fbD are the
  // font's full cell above and below the baseline, from canvas TextMetrics
  const mcache = new Map();
  const mctx = document.createElement("canvas").getContext("2d");
  function fmetrics(cs){
    const key = cs.fontStyle + "|" + cs.fontWeight + "|" + cs.fontSize + "|" + cs.fontFamily;
    let m = mcache.get(key);
    if (m) return m;
    const d = document.createElement("div");
    d.style.cssText = "position:fixed; left:-9999px; top:0; visibility:hidden; line-height:normal";
    d.style.fontFamily = cs.fontFamily; d.style.fontSize = cs.fontSize;
    d.style.fontWeight = cs.fontWeight; d.style.fontStyle = cs.fontStyle;
    const w = document.createElement("span"); w.textContent = "H";
    const p = document.createElement("span");
    p.style.cssText = "display:inline-block; width:0; height:0";
    d.append(w, p); document.body.appendChild(d);
    const wr = w.getBoundingClientRect();
    m = { asc: p.getBoundingClientRect().bottom - wr.top, boxH: wr.height };
    d.remove();
    let fbA = NaN, fbD = NaN, capH = NaN;
    try {
      mctx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      const tm = mctx.measureText("H");
      fbA = tm.fontBoundingBoxAscent; fbD = tm.fontBoundingBoxDescent;
      capH = tm.actualBoundingBoxAscent;
    } catch (e) {}
    if (fbA > 0 && fbD >= 0){ m.fbA = fbA; m.fbD = fbD; }
    else { m.fbA = m.asc; m.fbD = parseFloat(cs.fontSize) * 1.18 - m.asc; }
    m.capH = capH > 0 ? capH : parseFloat(cs.fontSize) * 0.7;
    // web fonts still loading would freeze wrong numbers into the cache
    if (!document.fonts || document.fonts.status === "loaded") mcache.set(key, m);
    return m;
  }

  // the width of the lane a field's scrollbar sits in, read off the element
  // rather than written down, so one line covers a lane held open at all times
  // by scrollbar-gutter, a bar that shows up only once the words overflow, and
  // a field that has no bar at all
  function gutterWidth(el, cs){
    const g = el.offsetWidth - el.clientWidth
            - parseFloat(cs.borderLeftWidth) - parseFloat(cs.borderRightWidth);
    return g > 0 ? g : 0;
  }

  // offsetWidth is an integer, but flex layout routinely gives the composer a
  // fractional border-box width. Losing that fraction can move the mirror just
  // across a wrap boundary: a whole trailing word then lands on the next line
  // in the mirror even though it still fits in the textarea. Keep layout's
  // fractional width and add the box edges when width names the content box.
  function fieldBoxWidth(el, cs){
    let width = parseFloat(cs.width);
    if (!Number.isFinite(width) || width <= 0) return el.offsetWidth;
    if (cs.boxSizing !== "border-box"){
      width += parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)
             + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
    }
    return width;
  }

  // Intl.Segmenter follows the browser's Unicode grapheme rules, so a range
  // never stops inside a surrogate pair, combining sequence, emoji modifier,
  // flag or ZWJ emoji. Older browsers fall back to a complete code point plus
  // the common extenders and joins. Rare newer cluster rules may therefore use
  // one code point's advance there, but never half of a UTF-16 surrogate.
  let graphemeSegmenter = null;
  try {
    if (Intl && Intl.Segmenter)
      graphemeSegmenter = new Intl.Segmenter(undefined, { granularity: "grapheme" });
  } catch (e) {}
  let markRe = null;
  try { markRe = new RegExp("\\p{Mark}", "u"); } catch (e) {}
  const cpSize = cp => cp > 0xFFFF ? 2 : 1;
  const isExtend = cp =>
    (markRe && markRe.test(String.fromCodePoint(cp))) ||
    (cp >= 0xFE00 && cp <= 0xFE0F) ||
    (cp >= 0xE0100 && cp <= 0xE01EF) ||
    (cp >= 0x1F3FB && cp <= 0x1F3FF) ||
    (cp >= 0xE0020 && cp <= 0xE007F);
  function firstGrapheme(text){
    if (!text) return "";
    if (graphemeSegmenter){
      const first = graphemeSegmenter.segment(text)[Symbol.iterator]().next();
      if (!first.done) return first.value.segment;
    }
    let end = cpSize(text.codePointAt(0));
    if (text.charCodeAt(0) === 13 && text.charCodeAt(1) === 10) return text.slice(0, 2);
    const firstCp = text.codePointAt(0);
    const nextCp = text.codePointAt(end);
    if (firstCp >= 0x1F1E6 && firstCp <= 0x1F1FF &&
        nextCp >= 0x1F1E6 && nextCp <= 0x1F1FF) end += cpSize(nextCp);
    const takeExtenders = () => {
      while (end < text.length){
        const cp = text.codePointAt(end);
        if (!isExtend(cp)) break;
        end += cpSize(cp);
      }
    };
    takeExtenders();
    while (text.codePointAt(end) === 0x200D){
      end++;
      if (end >= text.length) break;
      const cp = text.codePointAt(end);
      end += cpSize(cp);
      takeExtenders();
    }
    return text.slice(0, end);
  }

  function graphemeAt(text, at){
    if (at < 0 || at >= text.length) return "";
    if (graphemeSegmenter){
      const segments = graphemeSegmenter.segment(text);
      let hit = typeof segments.containing === "function" ? segments.containing(at) : null;
      if (!hit){
        for (const segment of segments){
          if (segment.index > at) break;
          if (segment.index + segment.segment.length > at){ hit = segment; break; }
        }
      }
      // A programmatic selection can land inside a visible cluster even though
      // keyboard and pointer movement do not. Do not measure a suffix of it.
      return hit && hit.index === at ? hit.segment : "";
    }
    if (at > 0){
      const unit = text.charCodeAt(at);
      const cp = text.codePointAt(at);
      if ((unit >= 0xDC00 && unit <= 0xDFFF) || cp === 0x200D || isExtend(cp)) return "";
      let p = at - 1;
      if (p > 0 && text.charCodeAt(p) >= 0xDC00 && text.charCodeAt(p) <= 0xDFFF) p--;
      const prev = text.codePointAt(p);
      if (prev === 0x200D) return "";
      if (cp >= 0x1F1E6 && cp <= 0x1F1FF){
        let count = 0, i = at;
        while (i > 0){
          let j = i - 1;
          if (j > 0 && text.charCodeAt(j) >= 0xDC00 && text.charCodeAt(j) <= 0xDFFF) j--;
          const before = text.codePointAt(j);
          if (before < 0x1F1E6 || before > 0x1F1FF) break;
          count++; i = j;
        }
        if (count % 2) return "";
      }
    }
    return firstGrapheme(text.slice(at));
  }

  function rangeAdvance(rg, line){
    const rects = Array.from(rg.getClientRects())
      .filter(r => r.width > 0 && r.height > 0);
    if (rects.length !== 1) return null;
    const rect = rects[0];
    if (line && !(rect.top < line.bottom && rect.bottom > line.top)) return null;
    const width = rect.width;
    return Number.isFinite(width) && width > 0 ? width : null;
  }

  // Read the advance from a DOM Range in the actual laid-out text. This keeps
  // font fallback, kerning, variable-font axes, letter spacing, zoom and tab
  // stops in the browser's hands instead of duplicating them in a width table.
  function textAdvance(node, from, text){
    if (!node || !text || /[\r\n]/.test(text)) return null;
    try {
      const rg = document.createRange();
      rg.setStart(node, from);
      rg.setEnd(node, from + text.length);
      return rangeAdvance(rg);
    } catch (e) { return null; }
  }

  function textPoint(root, offset){
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walk.nextNode())){
      if (offset <= node.data.length) return { node, offset };
      offset -= node.data.length;
    }
    return null;
  }

  function editableAdvance(root, caret, line){
    if (!root.contains(caret.startContainer) && caret.startContainer !== root) return null;
    try {
      const before = document.createRange();
      before.selectNodeContents(root);
      before.setEnd(caret.startContainer, caret.startOffset);
      const at = before.toString().length;
      const text = root.textContent || "";
      const grapheme = graphemeAt(text, at);
      if (!grapheme || /[\r\n]/.test(grapheme)) return null;
      const end = textPoint(root, at + grapheme.length);
      if (!end) return null;
      const rg = caret.cloneRange();
      rg.setEnd(end.node, end.offset);
      return rangeAdvance(rg, line);
    } catch (e) { return null; }
  }

  function generatedText(content){
    if (!content || content === "none" || content === "normal") return "";
    try { return JSON.parse(content); } catch (e) {}
    const quote = content[0];
    return (quote === '"' || quote === "'") && content.at(-1) === quote
      ? content.slice(1, -1) : "";
  }

  // A CSS placeholder is painted text rather than a text node, so a collapsed
  // range cannot lend editableAdvance its first character. Lay out that one
  // generated grapheme with the pseudo-element's own computed font and use the
  // same rendered advance a real first character would provide.
  function generatedFirstAdvance(el, scaleX){
    const pcs = getComputedStyle(el, "::before");
    const grapheme = firstGrapheme(generatedText(pcs.content));
    if (!grapheme) return null;
    const probe = document.createElement("span");
    for (const p of ["fontFamily", "fontSize", "fontWeight", "fontStyle", "fontStretch",
                     "fontVariant", "fontKerning", "fontFeatureSettings",
                     "fontVariationSettings", "fontOpticalSizing", "letterSpacing",
                     "wordSpacing", "textTransform"])
      probe.style[p] = pcs[p];
    probe.style.cssText += ";position:fixed;left:-9999px;top:0;visibility:hidden;white-space:pre";
    probe.textContent = grapheme;
    document.body.appendChild(probe);
    const rg = document.createRange();
    rg.selectNodeContents(probe);
    const width = rg.getBoundingClientRect().width;
    probe.remove();
    return Number.isFinite(width) && width > 0 ? width * scaleX : null;
  }

  let cur = null, isField = false;
  const trackable = el => {
    if (!el || el.nodeType !== 1) return null;
    if (el.tagName === "TEXTAREA") return el;
    if (el.tagName === "INPUT") return (el.type === "text" || el.type === "search") ? el : null;
    return el.closest("[contenteditable]");
  };

  // textarea and input path: rebuild the mirror with the field's font, box
  // and wrap rules, text up to the caret, then read the marker's spot
  function fieldCaret(el){
    if (el.selectionStart == null) return null;
    const cs = getComputedStyle(el);
    const r = el.getBoundingClientRect();
    for (const p of ["fontFamily","fontSize","fontWeight","fontStyle","fontStretch",
                     "fontVariant","fontKerning","fontFeatureSettings","fontVariationSettings",
                     "fontOpticalSizing","lineHeight","letterSpacing","wordSpacing",
                     "textTransform","textIndent","textAlign","direction","tabSize",
                     "paddingTop","paddingRight","paddingBottom","paddingLeft",
                     "borderTopWidth","borderRightWidth","borderBottomWidth","borderLeftWidth"])
      mirror.style[p] = cs[p];
    mirror.style.borderStyle = "solid";
    mirror.style.borderColor = "transparent";
    mirror.style.boxSizing = "border-box";
    // the width a line of text actually gets, which is the field's box less the
    // lane its scrollbar sits in. that lane is laid inside the box and taken
    // off the words, and this composer holds one open at all times, so a mirror
    // cut to the whole box gives every line room the field has not got: it
    // keeps a word on a line the field has already pushed down, and the block
    // then marks the caret in a text laid out differently from the one on
    // screen, one line up while the word hangs there and about a word to the
    // left once it drops
    // Layout uses the field's untransformed, fractional box. Viewport zoom and
    // an ancestor scale are applied below after wrapping is settled.
    const boxWidth = fieldBoxWidth(el, cs);
    const mirrorWidth = Math.max(0, boxWidth - gutterWidth(el, cs));
    mirror.style.width = mirrorWidth + "px";
    // a single-line input never wraps, it scrolls sideways instead
    mirror.style.whiteSpace = el.tagName === "INPUT" ? "pre" : "pre-wrap";
    mirror.style.wordWrap = el.tagName === "INPUT" ? "normal" : "break-word";
    const typed = el.value.slice(0, el.selectionStart);
    const rest = el.value.slice(el.selectionStart);
    mirror.textContent = typed;
    const mr = mirror.getBoundingClientRect();
    const fieldScaleX = boxWidth ? r.width / boxWidth : 1;
    const mirrorScaleX = mirrorWidth ? mr.width / mirrorWidth : 1;
    const rangeScaleX = Number.isFinite(fieldScaleX / mirrorScaleX)
      ? fieldScaleX / mirrorScaleX : 1;
    let kr, width = null;
    if (!rest && /\S$/.test(typed)){
      // live typing at the end of a word: any marker glyph would weld onto
      // that word, and at a full line the welded pair wraps in the mirror
      // while the real text stays put, so the block drew one line below the
      // caret; the right edge of the last typed character is the true spot
      const rg = document.createRange();
      rg.setStart(mirror.firstChild, typed.length - 1);
      rg.setEnd(mirror.firstChild, typed.length);
      const rr = rg.getClientRects()[0] || rg.getBoundingClientRect();
      kr = { left: rr.right, top: rr.top };
    } else if (!rest && / $/.test(typed) && el.tagName !== "INPUT"){
      // live typing spaces at a full line, measured against Chrome's own
      // caret: each space advances its full width while it still fits the
      // line, and once the spaces hang past the edge the caret pins about
      // 1.7px inside the content edge and rides there, on the space's own
      // line; it never drops until a real letter wraps
      const rg = document.createRange();
      rg.setStart(mirror.firstChild, typed.length - 1);
      rg.setEnd(mirror.firstChild, typed.length);
      const rr = rg.getClientRects()[0] || rg.getBoundingClientRect();
      const edge = mr.right - parseFloat(cs.borderRightWidth) - parseFloat(cs.paddingRight) - 1.7;
      kr = { left: Math.min(rr.right, edge), top: rr.top };
    } else {
      const mark = document.createElement("span");
      // the marker carries the rest of the text so it wraps exactly like the
      // real field; its first fragment starts at the caret. at the very end
      // of the text a placeholder dot stands in on the spot typing lands,
      // which after a pressed line break is the start of the next line
      mark.textContent = rest || ".";
      mirror.appendChild(mark);
      kr = mark.getClientRects()[0] || mark.getBoundingClientRect();
      if (rest) width = textAdvance(mark.firstChild, 0,
                                    graphemeAt(el.value, el.selectionStart));
    }
    if (width) width *= rangeScaleX;
    const m = fmetrics(cs);
    // the baseline is the marker's inline box top plus the font's ascent. the
    // marker offset, the field's own scroll and the ascent are all untransformed
    // pixels (the mirror sits outside the stage), so the vertical scale is
    // applied the same way the horizontal terms above already take it, to land
    // the baseline in the field's viewport space under a scaled stage
    return { x: r.left + (kr.left - mr.left) * rangeScaleX
                     - el.scrollLeft * fieldScaleX,
             base: r.top + ((kr.top - mr.top) * rangeScaleX
                     - el.scrollTop * fieldScaleX + m.asc * fieldScaleX),
             fs: parseFloat(cs.fontSize), fbA: m.fbA, fbD: m.fbD,
             width, scaleX: fieldScaleX, clip: r };
  }

  // list indentation and the air after a marker keep their source characters
  // in zero-size text inside a box that owns their visible width. codemirror
  // can map either edge of that box, but an insertion point inside several
  // spaces has no glyph box of its own. spread those real document positions
  // across the box, and borrow only the row from a full-height edge
  function cmListSpaceCaret(view, pos){
    let at, node, holder, from, to;
    try {
      at = view.domAtPos(pos);
      node = at.node;
      if (node.nodeType === 1){
        node = node.childNodes[at.offset] || node.childNodes[at.offset - 1];
      }
      if (!node || node.nodeType !== 3) return null;
      holder = node.parentElement && node.parentElement.closest(".md-li-gap, .md-li-ind");
      if (!holder || !view.contentDOM.contains(holder)) return null;
      from = view.posAtDOM(node, 0);
      to = view.posAtDOM(node, node.nodeValue.length);
    } catch (e){ return null; }
    if (to <= from || pos < from || pos > to) return null;

    const before = view.coordsAtPos(from, -1);
    const after = view.coordsAtPos(to, 1);
    const tall = [before, after, view.coordsAtPos(from, 1), view.coordsAtPos(to, -1)]
      .find(q => q && q.bottom > q.top);
    if (!tall) return null;

    let left, right;
    if (holder.classList.contains("md-li-ind")){
      const r = holder.getBoundingClientRect();
      // The following marker may be shorter than the column it owns. Its real
      // source is right-aligned inside that column, so the final indentation
      // stop belongs at the source marker's measured start, not at the empty
      // left edge of the marker box.
      left = r.left;
      right = after && after.bottom > after.top ? after.left : r.right;
    } else {
      const mark = holder.closest(".md-li-mark");
      if (!mark) return null;
      const r = mark.getBoundingClientRect();
      left = before && before.bottom > before.top ? before.left : r.left;
      right = after && after.bottom > after.top ? after.left : r.right;
    }
    if (!Number.isFinite(left) || !Number.isFinite(right)) return null;
    return { x: left + (right - left) * (pos - from) / (to - from),
             top: tall.top, bottom: tall.bottom };
  }

  const cmInlineMarks = new Set(["EmphasisMark", "StrikethroughMark", "CodeMark"]);
  function cmInlineMarkNode(view, pos){
    try {
      const tree = window.CM6.syntaxTree(view.state);
      for (const side of [-1, 1]){
        for (let node = tree.resolveInner(pos, side); node; node = node.parent){
          if (cmInlineMarks.has(node.name)) return node;
        }
      }
    } catch (e) {}
    return null;
  }

  function cmInlineMarkAt(view, pos){
    return !!cmInlineMarkNode(view, pos);
  }

  const cmRectHeight = rect => rect && rect.bottom > rect.top
    ? rect.bottom - rect.top : 0;
  function cmRowsOverlap(a, b){
    if (!cmRectHeight(a) || !cmRectHeight(b)) return false;
    const overlap = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
    return overlap > Math.min(cmRectHeight(a), cmRectHeight(b)) * 0.5;
  }

  // Inline delimiter spans use their compact formatting box, two pixels below
  // the body-font box on this face. The block has a fixed height, so borrowing
  // that top makes it visibly dip even though the line never moved. Find the
  // body-height endpoint outside this exact mark on the already-selected row.
  // Row and horizontal affinity remain owned by CodeMirror's selected rect.
  function cmInlineBodyTop(view, pos, selected, bodyHeight){
    const mark = cmInlineMarkNode(view, pos);
    if (!mark || !cmRectHeight(selected)) return selected && selected.top;
    const candidates = [
      view.coordsAtPos(mark.from, -1),
      view.coordsAtPos(mark.to, 1),
      view.coordsAtPos(mark.from, 1),
      view.coordsAtPos(mark.to, -1),
    ].filter(rect => cmRowsOverlap(rect, selected));
    if (!candidates.length) return selected.top;
    candidates.sort((a, b) =>
      Math.abs(cmRectHeight(a) - bodyHeight) -
      Math.abs(cmRectHeight(b) - bodyHeight));
    return candidates[0].top;
  }

  // Return the one visible DOM rectangle occupied by the next source
  // grapheme, but only when its logical start edge is the visual caret site
  // CodeMirror selected. In RTL that start is the range's right edge, so the
  // block extends left. At a distinct bidi or wrap affinity, the selected x
  // does not match that edge and the caller deliberately keeps a bounded cell.
  function cmGraphemeRect(view, pos, grapheme, selected, logical, tolerance){
    if (!grapheme || /[\r\n]/.test(grapheme) ||
        !cmRectHeight(selected) || !cmRectHeight(logical) ||
        !cmRowsOverlap(selected, logical)) return null;
    try {
      const start = view.domAtPos(pos);
      const end = view.domAtPos(pos + grapheme.length);
      const range = document.createRange();
      range.setStart(start.node, start.offset);
      range.setEnd(end.node, end.offset);
      const rects = Array.from(range.getClientRects())
        .filter(rect => rect.width > 0 && rect.height > 0);
      if (rects.length !== 1 || !cmRowsOverlap(rects[0], selected)) return null;
      const rect = rects[0];
      const edge = Math.abs(logical.left - rect.left) <=
        Math.abs(logical.left - rect.right) ? rect.left : rect.right;
      if (Math.abs(logical.left - edge) > tolerance ||
          Math.abs(selected.left - logical.left) > tolerance) return null;
      return rect;
    } catch (e) { return null; }
  }

  // At a visible inline delimiter boundary, CodeMirror can return the end of
  // the smaller syntax span on one side and the start of the next grapheme on
  // the other. A block cursor covers that next grapheme, so two local sites on
  // the same row use its + side regardless of arrow direction. Association
  // still owns a real wrap boundary, and horizontally separated bidi sites:
  // those are different visual caret positions rather than one styled seam.
  function cmInlineGraphemeSide(view, pos, before, after, localGap){
    if (!cmInlineMarkAt(view, pos) || !before || !after ||
        before.bottom <= before.top || after.bottom <= after.top) return 0;
    const overlap = Math.min(before.bottom, after.bottom) -
      Math.max(before.top, after.top);
    if (overlap <= Math.min(before.bottom - before.top,
                            after.bottom - after.top) * 0.5) return 0;
    return Math.abs(after.left - before.left) <= localGap ? 1 : 0;
  }

  // the formatted composer wears a codemirror editor of its own, laid over the
  // hidden textarea the row keeps its class on. the module hands back that
  // editor's view for the field, so the block reads the same coordinates the
  // file navigator does rather than a browser range that forgets which side of
  // a soft wrap the caret belongs on
  function composerView(el){
    if (!el || !el.closest) return null;
    const shell = el.closest(".cffield");
    if (!shell) return null;
    const mirror = shell.querySelector(".cfmirror");
    const field = mirror && window.ComposeFormat && window.ComposeFormat.fieldOf(mirror);
    return (field && field.view) || null;
  }

  // codemirror owns the mapping from document positions to the decorated dom.
  // ask the view in its own editor rather than reading the browser selection: a
  // collapsed range inside a zero-size markdown marker has no height even though
  // codemirror still knows the insertion point, and at a soft-wrap boundary the
  // browser range loses the visual row the view's selection assoc records.
  // prefer the character before an interior position and the character after a
  // line start; the opposite side covers a zero-size decoration on the preferred
  // side. the file navigator and each formatted composer are the same kind of
  // editor, so both come through here with their own view.
  function cmCaret(view, el, m, fs, scaleX, clip){
    const main = view.state.selection.main;
    if (!main.empty) return null;
    const pos = main.head, line = view.state.doc.lineAt(pos);
    const grapheme = graphemeAt(line.text, pos - line.from);
    const before = view.coordsAtPos(pos, -1);
    const after = view.coordsAtPos(pos, 1);
    const spaced = cmListSpaceCaret(view, pos);
    let selected = null;
    if (spaced){
      selected = { left: spaced.x, right: spaced.x,
                   top: spaced.top, bottom: spaced.bottom };
    } else {
      let side = main.assoc || (pos === line.from ? 1 : -1);
      if (grapheme && !/[\r\n]/.test(grapheme) &&
          cmInlineGraphemeSide(view, pos, before, after, 2 * scaleX)) side = 1;
      for (const s of [side, -side]){
        const q = s < 0 ? before : after;
        if (!q) continue;
        if (q.bottom > q.top){ selected = q; break; }
      }
    }
    if (!selected) return null;
    const glyph = cmGraphemeRect(view, pos, grapheme, selected, after, 2 * scaleX);
    // coordsAtPos and the glyph rect are viewport pixels, carrying the stage
    // scale; the layout-px ascent is scaled into that space before it sets the
    // baseline, and the body-height match runs in the same space
    const top = cmInlineBodyTop(view, pos, selected, m.boxH * scaleX);
    return { x: glyph ? glyph.left : selected.left, base: top + m.asc * scaleX,
             fs, fbA: m.fbA, fbD: m.fbD,
             capH: m.capH, width: glyph && glyph.width, scaleX, clip };
  }

  // contenteditable path: codemirror maps its own decorated document first;
  // every other editable uses the browser's collapsed range directly
  function ceCaret(el){
    const cs = getComputedStyle(el);
    const fs = parseFloat(cs.fontSize);
    const m = fmetrics(cs);
    const er = el.getBoundingClientRect();
    const scaleX = el.offsetWidth ? er.width / el.offsetWidth : 1;
    // the box the block has to stay inside. an editable that scrolls inside a
    // pane of its own, which the file navigator's editor does, is bounded by
    // that pane and not by its own height: measured against itself a caret
    // scrolled out of sight still counts as inside, and the block then hangs
    // over whatever is drawn under the panel
    const clip = (el.closest(".cm-scroller") || el).getBoundingClientRect();
    // the file navigator's editor first, then the composer's own if this is the
    // element it owns; either returns null and falls through to the range below
    if (fileNavView && el === fileNavView.contentDOM && fileNavView.hasFocus){
      const c = cmCaret(fileNavView, el, m, fs, scaleX, clip);
      if (c) return c;
    }
    const own = composerView(el);
    if (own && el === own.contentDOM && own.hasFocus){
      const c = cmCaret(own, el, m, fs, scaleX, clip);
      if (c) return c;
    }
    const sel = getSelection();
    if (sel.rangeCount){
      const rg = sel.getRangeAt(0);
      let rr = rg.getBoundingClientRect();
      // a caret on a line with nothing typed on it: chrome hands back a rect of
      // all zeros for that range, so there is no spot to read and the block
      // fell through to the whole field's box below, which put it halfway down
      // the file and out of the clip, and no caret showed at all on a new line.
      // an empty line still has a line break element on it, and that break is a
      // real inline box on that line: it sits on the column the first letter
      // would take and is exactly as tall as the font's own cell, which is the
      // same pair of numbers the branch above reads off a range that has a rect
      if (!rr.height && rg.startContainer.nodeType === 1){
        const n = rg.startContainer;
        const kid = n.childNodes[rg.startOffset] || n.lastChild;
        if (kid && kid.nodeName === "BR"){
          const q = document.createRange();
          q.selectNode(kid);
          rr = q.getBoundingClientRect();
        }
      }
      // An empty formatted quote hides its entire source prefix, so the
      // browser range has no rectangle. The composer still knows that line's
      // insertion point, including the space beside its quote bar. Use it
      // before the generic fallback centers the block in the whole field.
      if (!rr.height){
        const view = composerView(el);
        if (view && el === view.contentDOM && view.state.selection.main.empty){
          const main = view.state.selection.main;
          let point = null;
          try { point = view.coordsAtPos(main.head, main.assoc || 1); } catch (e) {}
          if (point && point.bottom > point.top){
            return { x: point.left, base: point.top + m.asc * scaleX, fs,
                     fbA: m.fbA, fbD: m.fbD, capH: m.capH,
                     width: null, scaleX, clip };
          }
        }
      }
      if (rr.height) return { x: rr.left, base: rr.top + m.asc * scaleX, fs, fbA: m.fbA, fbD: m.fbD,
                              capH: m.capH, width: editableAdvance(el, rg, rr), scaleX, clip };
    }
    // an empty editable gives a zero rect; park the block at the field's
    // start, on the baseline the strut line box will give the first letter.
    // the start is the content box's left edge and not the border box's: the
    // focused card's title indents its words by a padding, and a block parked
    // on the outer edge stood that whole inset left of where the first letter
    // then landed. the inset is layout px, so it takes the same scale the rect
    // took before the two are added
    const r = er;
    const inset = (parseFloat(cs.borderLeftWidth) + parseFloat(cs.paddingLeft)) * scaleX;
    // r.height is a viewport rect; the layout-px box and ascent are scaled to
    // match it so the empty-field block centers correctly under a scaled stage
    return { x: r.left + inset, base: r.top + (r.height - m.boxH * scaleX) / 2 + m.asc * scaleX, fs,
             fbA: m.fbA, fbD: m.fbD, capH: m.capH,
             width: generatedFirstAdvance(el, scaleX), scaleX, clip };
  }

  let raf = 0, px = 0, py = 0;
  function place(){
    raf = 0;
    if (!cur || !cur.isConnected){ cur = null; hide(); return; }
    const collapsed = isField ? cur.selectionStart === cur.selectionEnd : getSelection().isCollapsed;
    if (!collapsed){ hide(); return; }   // a selection marks its own spot
    const c = isField ? fieldCaret(cur) : ceCaret(cur);
    if (!c){ hide(); return; }
    // A visible grapheme supplies its rendered advance. Spaces and tabs work
    // when the browser gives their range a usable width; generated placeholder
    // text can lend its first grapheme, while other empty positions, line
    // endings and zero-size decorated text keep the accepted half-em cell.
    // This changes only the fixed overlay; the editor and its text never move.
    // the block is a fixed overlay in viewport pixels, so its height and
    // vertical centering scale by the same stage factor its width and base
    // already use; at an unscaled stage this factor is 1 and the geometry is
    // exactly what it was
    const sx = c.scaleX || 1;
    const bw = Number.isFinite(c.width) && c.width > 0
      ? c.width : c.fs * 0.5 * sx;
    let bh, y;
    if (!isField && cur.classList.contains("title")){
      bh = c.capH * sx + 1;   // one pixel of optical overshoot above the caps
      y = c.base - bh;
    } else {
      // text boxes: 1.1em centered on the glyph band, the accepted look;
      // the font's full bounding cell read too tall here
      bh = c.fs * 1.1 * sx;
      const fbA = c.fbA * sx, fbD = c.fbD * sx;
      y = c.base - fbA + (fbA + fbD - bh) / 2;
    }
    // a caret scrolled out of the field's box must not hover over other ui
    if (y + bh < c.clip.top - 1 || y > c.clip.bottom + 1 ||
        c.x + bw < c.clip.left - 1 || c.x > c.clip.right + 5){
      hide(); return;
    }
    // a caret row scrolled part way under the field's top rule, or past any
    // other edge of the scroller it lives in, must not paint a solid block over
    // the ui outside that field. clip both blended layers to the part of the
    // block that falls inside the scroller rectangle, keeping the same box so
    // the block still sits on its glyph within the field. the small tolerances
    // match the all-or-nothing check above so a fully seated block is never
    // touched, and a block that only overhangs the right edge, which the caret
    // at the end of a line does, keeps that overhang the way it always had it.
    const ct = Math.max(0, (c.clip.top - 1) - y);
    const cb = Math.max(0, (y + bh) - (c.clip.bottom + 1));
    const cl = Math.max(0, (c.clip.left - 1) - c.x);
    const cr = Math.max(0, (c.x + bw) - (c.clip.right + 5));
    const clipCss = (ct || cb || cl || cr)
      ? "inset(" + ct + "px " + cr + "px " + cb + "px " + cl + "px)" : "none";
    for (const el of cells){
      el.style.left = c.x + "px";
      el.style.top = y + "px";
      el.style.width = bw + "px";
      el.style.height = bh + "px";
      el.style.clipPath = clipCss;
    }
    if (!bar.classList.contains("on") || c.x !== px || y !== py){
      // restart the blink so the block lands solid, the way a native caret does
      hide(); void bar.offsetWidth;
      for (const el of cells) el.classList.add("on");
      px = c.x; py = y;
    }
  }
  const queue = () => { if (!raf) raf = requestAnimationFrame(place); };
  queueFatCaret = queue;

  document.addEventListener("focusin", e => {
    const el = trackable(e.target);
    if (cur && cur !== el) cur.classList.remove("fc-hide");
    cur = el;
    isField = !!el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT");
    if (cur) cur.classList.add("fc-hide");
    queue();
  });
  document.addEventListener("focusout", () => {
    if (cur) cur.classList.remove("fc-hide");
    cur = null; queue();
  });
  document.addEventListener("selectionchange", queue);
  document.addEventListener("input", queue, true);
  document.addEventListener("keyup", queue, true);
  document.addEventListener("scroll", queue, true);
  addEventListener("resize", queue);
  // A web font finishing can change advances without an input event. The app's
  // own data poll calls the same queue after it changes the DOM, so no separate
  // caret timer or animation loop is needed.
  if (document.fonts && document.fonts.addEventListener)
    document.fonts.addEventListener("loadingdone", queue);
}


// the card's snap runs once the board is up, again on the next frame, and once
// more when the web fonts land, since each of those can change a line's height
// under it. a resize changes the room itself, so it runs there too
requestAnimationFrame(() => requestAnimationFrame(snapCard));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(snapCard);
addEventListener("resize", snapCard);

renameMagicLayouts();
syncLayoutsOnce();
seedHiddenOnce();
applySavedLayout();
// the timed refresh waits out a panel's run or a page turn (cardsMoving in
// card-logic.js): the tick that lands inside one is skipped, and the next one
// catches up. a refresh asked for by a send or a click still goes at once
poll(); setInterval(() => { if (!cardsMoving()) poll(); }, 1200);

// ---- installing this board as an app of its own -------------------------------
// The worker keeps nothing at all, and sw.js says why it is here: Chrome asked
// for one before it would offer an install for years, and though this Chrome no
// longer does, the offer should not turn on which Chrome is installed. A page
// served over plain http off loopback gets no worker, and the board runs the
// same there, so a refusal here is nothing to say out loud.
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
}
// The control in the bar, which stands there only while there is something to
// press it for. Chrome sends one offer per page, and only for a page it would
// install, which the board is not once it has been installed. The offer has to
// be held onto, because its box can be asked for only from a real click, and
// only through the event that carried it. A browser that sends no offer, and
// the installed app itself, show no control at all.
let installOffer = null;
const installBtn = document.getElementById("installbtn");
const installedHere = () => matchMedia("(display-mode: standalone)").matches;
addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installOffer = e;
  if (!installedHere()) installBtn.hidden = false;
});
// an install finished anywhere takes the control away here too
addEventListener("appinstalled", () => { installOffer = null; installBtn.hidden = true; });
installBtn.addEventListener("click", () => {
  const offer = installOffer;
  if (!offer) return;
  // one offer is good for one box. Chrome sends a fresh one the next time the
  // board is opened, which is what brings the control back after a dismissal
  installOffer = null;
  installBtn.hidden = true;
  try { offer.prompt(); } catch (e) {}
});

// The portrait view is the phone document itself. The adapter knows state,
// never its layout. Both pages stay mounted, including every unsaved Mac panel.
{
  const view = MacPhoneView;
  const adapter = {
    capture: () => ({ owner: activeOwner, id: selectedId, browsing, home: homeOpen,
      rev: lastState?.rev, view: curView(), lastSel: { ...lastSel },
      drafts: view.readDrafts(els) }),
    ready: state => !!lastState && ownerReady &&
      (!(Number.isFinite(state.rev) && Number.isFinite(lastState.rev)) || lastState.rev >= state.rev),
    busy: () => !!draft || !!autoNext || !!document.querySelector('.title[contenteditable="true"]') ||
      Object.values(els).some(el => el.ta?.attachmentPending || el.sendsOut || el.sentHeld?.length),
    restore(state) {
      Object.assign(lastSel, state.lastSel);
      if (validActiveOwnerIds.has(state.owner) && (!LOCKED || LOCKED === state.owner)) setTab(state.owner);
      setTicketViewOf(activeOwner, state.view);
      if (state.id && els[state.id] && lastState.boxes.some(b => b.id === state.id && b.owner === activeOwner)) {
        select(state.id, { browse: true }); setBrowsing(state.browsing);
      } else deselect();
      setHome(state.home);
      for (const [id, saved] of Object.entries(state.drafts)) view.writeDraft(els[id], saved);
      if (lastState) renderCarousel(lastState);
    },
    focus(state) {
      if (!state.home && state.id && state.drafts[state.id]?.focus) els[state.id]?.ta.focus({ preventScroll: true });
    },
  };
  window.macPhoneProject = LOCKED;
  window.macPhoneHost = view.createHost({ window, adapter,
    childConnected(child) {
      installChromeShortcutGuard(child);
      installMacZoomGuard(child);
      for (const type of ["pointerdown", "click", "keydown"])
        child.addEventListener(type, chimeEnsure, true);
    },
    changed() { fitStage(); },
  });
  window.macPhoneHost.request(phoneWanted);
}

// ---- the Mac page's browser shortcuts ------------------------------------------
// Find and reload stay Chrome's. The card/editor commands and native window/OS
// controls keep their existing paths; only the listed page defaults are held.
function chromeShortcutBlocked(e){
  if (e.isComposing) return false;
  const key = cardCommandKey(e);
  if (e.ctrlKey) return e.metaKey && !e.altKey && !e.shiftKey && key === "p";
  if (!e.metaKey) return !e.altKey && !e.shiftKey && ["escape", "f7", "f12"].includes(key);
  if (e.altKey) return !e.shiftKey && ["p", "i", "j", "c", "u", "l", "b"].includes(key);
  if (key === "t" || key === "g" || key === "n") return true;   // tabs; next/previous find; new/incognito window
  if (e.shiftKey) return ["c", "j", "backspace", "/", "?", "+", "="].includes(key);
  if (key === "arrowleft" || key === "arrowright"){
    // Command+arrows remain line/caret movement in either editor and native
    // fields. A text node inside a decorated editor is part of that editor.
    const editing = e.composedPath().some(node => node.isContentEditable ||
      node.matches?.("input, textarea, [role='textbox'], .cm-editor"));
    return !editing;
  }
  return ["s", "p", "e", ".", "+", "=", "-", "0", "[", "]", "y", ","].includes(key);
}

function installChromeShortcutGuard(targetWindow = window){
  if (!/^Mac/.test(navigator.platform) && navigator.userAgentData?.platform !== "macOS") return;
  targetWindow.addEventListener("keydown", e => {
    if (e.defaultPrevented || !e.cancelable || !chromeShortcutBlocked(e)) return;
    // Register last in the page so earlier window capture handlers have had
    // their turn. If one stopped here, only its browser default remains.
    if (e.cancelBubble){ e.preventDefault(); return; }
    const path = e.composedPath();
    let timer = 0;
    const clear = () => {
      clearTimeout(timer);
      for (const node of path){
        if (node !== targetWindow) node.removeEventListener("keydown", afterCapture, true);
        node.removeEventListener("keydown", afterBubble);
      }
    };
    const cancel = () => { e.preventDefault(); clear(); };
    // App handlers must see the original defaultPrevented state: Escape's
    // card action checks it, and CodeMirror must get to run file-save first.
    // A window-only listener would miss titles/settings that stop propagation.
    // These temporary observers run after the existing handlers at each node,
    // canceling only where propagation ends, never swallowing an app handler.
    const afterCapture = event => { if (event === e && e.cancelBubble) cancel(); };
    const afterBubble = event => {
      if (event === e && (e.cancelBubble || event.currentTarget === targetWindow || !e.bubbles)) cancel();
    };
    for (const node of path){
      if (node !== targetWindow) node.addEventListener("keydown", afterCapture, true);
      node.addEventListener("keydown", afterBubble);
    }
    // Cleanup also covers a handler that cancels and stops immediately. A
    // task, not a microtask, keeps observers installed for the whole dispatch.
    timer = setTimeout(clear, 0);
  }, true);
}
installChromeShortcutGuard();

function installMacZoomGuard(targetWindow = window){
  if (!/^Mac/.test(navigator.platform) && navigator.userAgentData?.platform !== "macOS") return;
  // Chrome reports both trackpad pinch and Control+scroll as Control+wheel.
  // Keep propagation so the carousel, chart and editor still hear the wheel.
  targetWindow.addEventListener("wheel", e => {
    if (e.ctrlKey && e.cancelable) e.preventDefault();
  }, { capture: true, passive: false });
  // The same page can open in Safari, which sends separate pinch events.
  for (const type of ["gesturestart", "gesturechange"]){
    targetWindow.addEventListener(type, e => {
      if (e.cancelable) e.preventDefault();
    }, { capture: true, passive: false });
  }
}
installMacZoomGuard();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>facilitator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F4F1; --card:#FFFFFF; --ink:#211D17; --sub:#75695A;
    --line:#E6DFD2; --line-strong:#D8CFBE;
    --accent:#432BFF; --accent-soft:#EEEBFF;
    --green:#2F6B3C; --green-bg:#EDF4E8; --green-line:#C4D9BB;
    --must:#A8442A; --must-bg:#F7EAE4;
    --could:#8A6D1F; --could-bg:#F5EFDD;
    --later:#5A6473; --later-bg:#EAEDF1;
    --serif:"Newsreader", Georgia, serif;
    --sans:"IBM Plex Sans", -apple-system, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:15px/1.55 var(--sans);
    background-image:radial-gradient(circle at 18% -4%, #FCFCFB 0%, rgba(252,252,251,0) 52%);
  }

  /* ---- status bar ------------------------------------------------------- */
  .bar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:14px;
    padding:10px 20px;
    background:color-mix(in srgb, var(--paper) 84%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar .name{font:600 15px var(--serif); letter-spacing:.01em}
  .bar .name em{font-style:italic; font-weight:400; color:var(--sub)}
  .bar .live{display:flex; align-items:center; gap:8px; margin-left:auto; font:12px var(--mono); color:var(--sub)}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--line-strong); flex:none; transition:background .3s}
  .dot.on{background:var(--accent); animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .prog{font:12px var(--mono); color:var(--sub); white-space:nowrap}
  .prog b{color:var(--green); font-weight:500}
  .endbtn{
    font:12px var(--mono); color:var(--sub); background:none; border:1px solid var(--line);
    border-radius:99px; padding:4px 12px; cursor:pointer; transition:.2s;
  }
  .endbtn:hover{border-color:var(--must); color:var(--must)}
  .endbtn.arm{border-color:var(--must); color:#fff; background:var(--must)}
  #bgpick{width:24px; height:20px; padding:0; border:1px solid var(--line-strong);
    border-radius:4px; background:none; cursor:pointer; flex:none}
  #bgpick::-webkit-color-swatch-wrapper{padding:2px}
  #bgpick::-webkit-color-swatch{border:none; border-radius:2px}
  .pausebtn{font:12px var(--mono); color:var(--accent); background:var(--accent-soft);
    border:none; border-radius:4px; padding:4px 12px; cursor:pointer; transition:.2s}
  .pausebtn:hover{background:#E2DCFC}
  body.paused .pausebtn{background:var(--accent); color:#fff}

  /* ---- layout ----------------------------------------------------------- */
  main{max-width:700px; margin:0 auto; padding:26px 18px 30vh}
  .box{scroll-margin-top:64px}

  /* ---- left sidebar (outline) ------------------------------------------- */
  :root{--tocw:238px}
  #toc{
    position:fixed; left:0; top:45px; bottom:0; width:var(--tocw); overflow-y:auto;
    padding:18px 10px 30px 14px; border-right:1px solid var(--line);
    background:color-mix(in srgb, var(--paper) 92%, #fff 8%);
  }
  #tocgrip{position:fixed; left:calc(var(--tocw) - 3px); top:45px; bottom:0; width:7px;
    cursor:col-resize; z-index:6}
  #tocgrip:hover, #tocgrip.drag{background:var(--accent-soft)}
  body.resizing{user-select:none; cursor:col-resize}
  #toc .toc-group{margin:0 0 18px}
  #toc .toc-bucket{font:11px var(--mono); letter-spacing:.09em; text-transform:uppercase;
    color:var(--sub); margin:0 6px 7px}
  .toc-entry{display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:7px;
    cursor:pointer; font:13px/1.3 var(--sans); color:var(--ink)}
  .toc-entry:hover{background:var(--accent-soft)}
  .toc-entry .tage{font:10px var(--mono); color:#B4AA99; flex:none; width:30px; text-align:right}
  .toc-entry .tnum{font:10.5px var(--mono); color:var(--sub); flex:none; width:26px}
  .toc-entry .tdot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--line-strong)}
  .toc-entry .ttitle{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .toc-entry.t-you .tdot{background:var(--accent)}
  .toc-entry.t-queued .tdot{background:#C99B23}
  .toc-entry.t-writing .tdot{background:#C99B23; animation:pulse 1.2s ease-in-out infinite}
  .toc-entry.t-queued .ttitle, .toc-entry.t-writing .ttitle{color:#8A6D1F}
  .toc-entry.t-done .tdot{background:var(--green)}
  .toc-entry.t-done .ttitle{color:var(--green); opacity:.75}
  @media (min-width: 990px){ main{margin-left:calc(var(--tocw) + (100vw - var(--tocw) - 700px)/2)} }
  @media (max-width: 989px){ #toc, #tocgrip{display:none} }
  .lede{font:15px/1.5 var(--sans); color:var(--sub); margin:4px 2px 26px; max-width:56ch}
  .bucket{margin:34px 0 12px; display:flex; align-items:baseline; gap:10px}
  .bucket h2{font:italic 500 24px var(--serif); margin:0; letter-spacing:.01em}
  .bucket .rule{flex:1; height:1px; background:var(--line); transform:translateY(-4px)}
  .bucket .tag{font:11px var(--mono); letter-spacing:.08em; text-transform:uppercase; padding:2px 9px; border-radius:99px}
  .bucket.toolmeta .tag, .bucket.triagemeta .tag{color:var(--accent); background:var(--accent-soft)}
  .bucket.now   .tag{color:var(--accent); background:var(--accent-soft)}
  .metabox .parkbtn, .metabox .donebtn{display:none}
  .xbtn{flex:none; font:14px var(--mono); color:var(--sub); background:none; border:none;
    cursor:pointer; padding:0 4px; line-height:1; transition:color .2s}
  .xbtn:hover{color:var(--must)}
  .addrow{margin:2px 0 14px}
  .addbtn{font:12.5px var(--mono); color:var(--sub); background:none; cursor:pointer;
    border:1px dashed var(--line-strong); border-radius:9px; padding:7px 14px; transition:.2s}
  .addbtn:hover{color:var(--accent); border-color:var(--accent)}
  .addinput{font:14px var(--sans); color:var(--ink); background:var(--card);
    border:1px solid var(--accent); border-radius:9px; padding:8px 11px; width:60%; outline:none}
  .bucket.later .tag{color:var(--later); background:var(--later-bg)}
  .bucket.done  .tag{color:var(--green); background:var(--green-bg)}

  /* ---- box -------------------------------------------------------------- */
  .box{
    background:var(--card); border:1px solid var(--line); border-radius:7px;
    margin:0 0 14px; overflow:hidden;
    transition:border-color .35s, background .45s, box-shadow .25s;
    animation:rise .45s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(6px)}}
  .box:focus-within{border-color:var(--line-strong); box-shadow:0 2px 14px rgba(60,45,20,.05)}
  .head{display:flex; align-items:center; gap:10px; padding:12px 14px 0; cursor:default}
  .num{font:500 11px var(--mono); color:var(--sub); background:var(--paper);
       border:1px solid var(--line); border-radius:6px; padding:2px 7px; flex:none}
  .title{font:500 17.5px/1.25 var(--serif); flex:1; min-width:0}
  .donebtn, .parkbtn{
    flex:none; font:12px var(--mono); color:var(--sub); background:none; cursor:pointer;
    border:1px solid var(--line); border-radius:99px; padding:3px 11px; transition:.2s;
  }
  .donebtn:hover{border-color:var(--green); color:var(--green)}
  .parkbtn:hover{border-color:var(--later); color:var(--later)}
  .ctx{font:italic 12.5px/1.45 var(--sans); color:var(--sub); padding:6px 14px 0;
    border-left:2px solid var(--line); margin:6px 14px 0}
  .ctx:empty{display:none}
  /* folded rows are title-only: the context block hides until reopened/peeked */
  .box.waiting:not(.peek) .ctx, .box.done:not(.peek) .ctx, .box.parked:not(.peek) .ctx{display:none}
  .body{padding:8px 14px 13px}
  .reply{color:var(--ink)}
  .reply p{margin:0 0 9px}
  .reply p:last-child, .reply ul:last-child, .reply ol:last-child{margin-bottom:0}
  .reply ul, .reply ol{margin:0 0 9px; padding-left:20px}
  .reply li{margin:3px 0}
  .reply.fresh{animation:fresh 1.6s ease-out}
  @keyframes fresh{0%{background:var(--accent-soft)} 100%{background:transparent}}
  .meta{font:11.5px var(--mono); color:var(--sub); margin-top:9px; min-height:15px; display:flex; gap:6px; align-items:center}
  .meta .w{color:var(--accent)}
  .meta .w::after{content:"…"; animation:ell 1.4s steps(4) infinite}
  @keyframes ell{0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."}}

  .compose{display:flex; gap:8px; margin-top:9px; align-items:flex-end}
  textarea{
    flex:1; resize:none; font:14.5px/1.45 var(--sans); color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:9px;
    padding:8px 11px; min-height:38px; max-height:170px; outline:none; transition:border-color .2s;
  }
  textarea:focus{border-color:var(--accent)}
  textarea::placeholder{color:#B4AA99}
  .sendbtn{
    flex:none; font:600 13px var(--sans); color:#fff; background:var(--accent);
    border:none; border-radius:9px; padding:9px 16px; cursor:pointer;
    transition:transform .12s, opacity .2s;
  }
  .sendbtn:hover{transform:translateY(-1px)}
  .sendbtn:active{transform:translateY(0) scale(.97)}
  .sendbtn:disabled{opacity:.35; cursor:default; transform:none}

  /* ---- waiting state (sent, agent hasn't replied yet) ------------------- */
  .box.waiting{background:#FBF6E8; border-color:#E7DCC0}
  .box.waiting .head{cursor:pointer; padding-bottom:12px}
  .box.waiting .body{display:none}
  .box.waiting.peek .head{padding-bottom:0}
  .box.waiting.peek .body{display:block}
  .wstat{display:none; font:11.5px var(--mono); color:#8A6D1F; flex:none}
  .box.waiting .wstat{display:inline}
  .wstat .w2::after{content:"…"; animation:ell 1.4s steps(4) infinite}
  /* the animated dots must not change the label's width: a growing label
     re-wraps long titles every tick and shoves the whole page below */
  .wstat .w2::after, .meta .w::after{display:inline-block; width:1.1em; text-align:left}

  /* ---- your-turn chip --------------------------------------------------- */
  .turn{display:none; font:10.5px var(--mono); letter-spacing:.04em; color:var(--accent);
        background:var(--accent-soft); border-radius:99px; padding:2px 8px; flex:none}
  .box.yourturn .turn{display:inline}

  /* ---- done state ------------------------------------------------------- */
  .box.done{background:var(--green-bg); border-color:var(--green-line)}
  .box.done .title{color:var(--green)}
  .box.done .num{background:transparent; border-color:var(--green-line); color:var(--green)}
  .box.done .donebtn{border-color:var(--green); background:var(--green); color:#fff}
  .box.done .head{cursor:pointer; padding-bottom:12px}
  .box.done .body{display:none}
  .box.done.peek .head{padding-bottom:0}
  .box.done.peek .body{display:block}
  .box.done .title::after{content:" ✓"; color:var(--green)}

  /* ---- parked (later) state --------------------------------------------- */
  .box.parked{background:var(--later-bg); border-color:#CDD4DE}
  .box.parked .title{color:var(--later)}
  .box.parked .num{background:transparent; border-color:#CDD4DE; color:var(--later)}
  .box.parked .parkbtn{border-color:var(--later); background:var(--later); color:#fff}
  .box.parked .head{cursor:pointer; padding-bottom:12px}
  .box.parked .body{display:none}
  .box.parked.peek .head{padding-bottom:0}
  .box.parked.peek .body{display:block}
  .toc-entry.t-later .tdot{background:var(--later)}
  .toc-entry.t-later .ttitle{color:var(--later); opacity:.8}

  /* ---- listener-offline banner ------------------------------------------ */
  #offline{
    display:none; position:sticky; top:45px; z-index:9;
    padding:9px 20px; font:13px var(--sans); color:#7A2E1B;
    background:#FAE9E2; border-bottom:1px solid #E8C4B4;
  }
  body.offline #offline{display:block}
  body.offline .dot{background:#C0442A !important; animation:none}

  .endnote{display:none; margin:40px 2px; font:italic 400 17px var(--serif); color:var(--sub)}
  body.ended .endnote{display:block}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }

  /* ============ structural skin: square corners + bracket buttons =========== */
  .box, textarea, .sendbtn, .donebtn, .parkbtn, .addbtn, .addinput, .endbtn,
  .toc-entry{border-radius:4px !important}
  .num{background:transparent; border:none; padding:0; width:auto}
  /* buttons: borderless soft-tint boxes; the old hover glow is the resting look */
  .sendbtn, .donebtn, .parkbtn, .addbtn, .endbtn{border:none !important}
  .sendbtn{background:var(--accent-soft); color:var(--accent); font-weight:600;
    min-height:38px; padding:0 16px; display:flex; align-items:center}
  .sendbtn:hover{background:#E2DCFC; transform:none}
  .sendbtn:active{transform:scale(.97)}
  .donebtn{background:var(--green-bg); color:var(--green)}
  .donebtn:hover{background:#DEEDD9}
  .parkbtn{background:var(--later-bg); color:var(--later)}
  .parkbtn:hover{background:#DFE3EA}
  .addbtn{background:var(--accent-soft); color:var(--accent)}
  .addbtn:hover{background:#E2DCFC}
  .endbtn{background:var(--must-bg); color:var(--must)}
  .endbtn:hover{background:#F2DCD3}
  .box.done .donebtn{background:var(--green); color:#fff}
  .box.parked .parkbtn{background:var(--later); color:#fff}
  .ctx{
    font-style:normal; color:#3A3563;
    background:var(--accent-soft); border:1px solid #D9D3FA;
    border-radius:4px; padding:7px 11px; margin:9px 14px 0;
  }
  /* state labels wear small drawn brackets instead of pill fills */
  .turn{
    background:none; border-radius:0; position:relative; padding:2px 8px;
  }
  .turn::before, .turn::after{
    content:""; position:absolute; top:1px; bottom:1px; width:3px;
    border:1px solid currentColor;
  }
  .turn::before{left:0; border-right:none}
  .turn::after{right:0; border-left:none}

  /* ============ focus mode: one discussion fills the page ================ */
  /* the left bar stays; the right side shows exactly one box, chosen there.
     One shared measure sizes every element in the column; nothing is px-fixed. */
  body.focus{--col:min(42rem, 88vw)}
  html:has(body.focus), body.focus{overflow:hidden}   /* the page never scrolls, either axis; the reply pane does */
  body.focus{
    background-image:radial-gradient(circle, rgba(190,187,180,.40) 1.1px, transparent 1.1px);
    background-size:var(--grid) var(--grid);
    background-position:calc(var(--grid)/2) calc(var(--grid)/2);
  }
  body.focus.dragging, body.focus.dragging *{cursor:grabbing !important; user-select:none}
  /* the drawn window maps to the area under the bar; every region sits at its
     exact percentage from the excalidraw file (canvas height var --ch) */
  body.focus{
    --bar-h:41px;
    /* the app is a locked-ratio stage, sized to the largest rectangle in the
       16:10 to 16:9 band that fits the window, centered with neutral margin
       around it. shape the window however; the app never squishes. */
    --cw:1440px; --ch:900px;   /* fixed design size; #stage scales to fit */
    --ox:0px; --oy:0px;
    /* geometry from the ui_3 drawing, as fractions of the stage */
    --clock-x:calc(var(--ox) + var(--cw)*0.024);   --clock-y:0.026;
    --chip-y:0.118;
    --chips-x:calc(var(--ox) + var(--cw)*0.045);   --chips-w:calc(var(--cw)*0.22);
    --chips-y:0.210; --chips-h:0.048;
    --tik-x:calc(var(--ox) + var(--cw)*0.045);     --tik-w:calc(var(--cw)*0.245);
    --tik-y:0.254;   --tik-h:0.393;
    --tik-row:0.056; --tik-on-w:calc(var(--cw)*0.272);
    --m1-x:calc(var(--ox) + var(--cw)*0.072);      --m1-w:calc(var(--cw)*0.216);
    --m1-y:0.709;    --m1-h:0.181;
    --frame-x:calc(var(--ox) + var(--cw)*0.324);   --frame-w:calc(var(--cw)*0.369);
    --frame-y:0.128; --frame-h:0.818;
    --pad-x:calc(var(--cw)*0.02);  --pad-y:0.008;
    --tg-x:calc(var(--ox) + var(--cw)*0.748);      --tg-w:calc(var(--cw)*0.22);
    --tg-y:0.034;    --tg-h:0.406;
    --m2-x:calc(var(--ox) + var(--cw)*0.732);      --m2-w:calc(var(--cw)*0.198);
    --m2-y:0.513;    --m2-h:0.25;
    --goal-x:calc(var(--ox) + var(--cw)*0.785);    --goal-w:calc(var(--cw)*0.197);
    --goal-y:0.825;  --goal-h:0.142;
    /* spacing tokens, fractions of the stage, no raw pixels */
    --sp-xs:calc(var(--ch)*0.005);  --sp-s:calc(var(--ch)*0.0095);
    --sp-m:calc(var(--ch)*0.0195);  --sp-x:calc(var(--cw)*0.0085);
    --grid:calc(var(--cw)*0.016);
    --pane-w:calc(var(--cw)*0.072); --pane-gap:calc(var(--cw)*0.024);
  }
  body.focus main{
    max-width:none; margin:0; overflow:hidden;
    position:fixed; left:var(--frame-x); width:var(--frame-w);
    top:calc(var(--oy) + var(--ch)*var(--frame-y) - 2.5*var(--grid)); height:calc(var(--ch)*var(--frame-h));
    border:1px solid var(--line-strong); background:#fff; border-radius:7px;
    box-shadow:0 2px 18px rgba(60,45,20,.06);
    padding:calc(var(--ch)*0.022) var(--pad-x);
    display:flex; flex-direction:column; align-items:stretch;
  }
  body.focus #sections{width:100%; max-width:100%; flex:1; display:flex; flex-direction:column}
  body.focus #sections > div:not(.bucket){display:contents}
  body.focus .bucket, body.focus .addrow{display:none}
  #pwdline{display:none}
  body.focus #pwdline{
    display:block; width:100%;
    font:11.5px var(--mono); color:#B4AA99; padding:0;
  }
  body.focus .box{display:none}
  body.focus .box.sel{
    display:flex; flex-direction:column; flex:1; min-height:0;
    background:transparent !important; border:none !important; box-shadow:none !important;
    animation:none; margin:0; overflow:visible;
  }
  body.focus .box.sel .head{padding:var(--sp-xs) 0 0; flex-wrap:wrap; row-gap:var(--sp-xs)}
  body.focus .box.sel .turn{display:none !important}
  body.focus .box.sel{position:static; animation:none}
  body.focus .box.sel .xbtn{
    position:absolute; top:9px; right:9px; left:auto; z-index:4;
    width:16px; height:16px; border-radius:50%;
    background:#FF9F98; font-size:0; padding:0; border:none;
  }
  body.focus .box.sel .xbtn::before, body.focus .box.sel .xbtn::after{
    content:""; position:absolute; left:50%; top:50%;
    width:9px; height:1.2px; background:#1e1e1e; border-radius:1px;
  }
  body.focus .box.sel .xbtn::before{transform:translate(-50%,-50%) rotate(45deg)}
  body.focus .box.sel .xbtn::after{transform:translate(-50%,-50%) rotate(-45deg)}
  body.focus .box.sel .xbtn:hover{background:#F8837A}
  body.focus .box.sel .num{display:none}
  body.focus .box.sel .title{
    order:10; flex:0 0 100%; min-width:0; white-space:normal;
    font:500 30px/1.25 var(--serif); margin-top:8px;
  }
  body.focus .box.sel .wstat{display:none}
  body.focus .box.sel .turn{order:2}
  body.focus .box.sel .xbtn{order:5; margin-left:auto}
  body.focus .box.sel .parkbtn{order:6}
  body.focus .box.sel .donebtn{order:7}
  body.focus .box.sel .donebtn, body.focus .box.sel .parkbtn{
    background:none; color:var(--sub); font-size:11px; padding:2px 6px;
  }
  body.focus .box.sel .donebtn:hover{color:var(--green)}
  body.focus .box.sel .parkbtn:hover{color:var(--later)}
  body.focus .box.sel .ctx{
    display:block !important; margin:18px 0 0; padding:12px 16px;
    background:#FAFAF7; border:1px solid var(--line); border-radius:5px;
    color:var(--ink); font-size:15px; line-height:1.5; box-shadow:none;
  }
  body.focus .box.sel .ctx:empty{display:none !important}
  body.focus .box.sel .head, body.focus .box.sel .ctx{flex:none}
  body.focus .box.sel .body{
    display:flex !important; flex-direction:column; flex:1 1 0; min-height:0;
    overflow:hidden;
    padding:var(--sp-m) 0 0;
  }
  body.focus .box.sel .reply{flex:1 1 auto; min-height:calc(var(--ch)*0.08)}
  body.focus .box.sel .reply{font-size:17px; line-height:1.55; overflow-y:auto; min-height:0}
  .pendlist{display:none}
  body.focus .box.sel .pendlist{
    display:block; margin-top:auto; padding-top:16px;
    font:italic 13.5px/1.5 var(--sans); color:var(--sub);
    max-height:26vh; overflow-y:auto;   /* a huge paste scrolls here, never shoves the input */
  }
  body.focus .box.sel .pendlist:empty{display:none}
  body.focus .box.sel .pendlist p{margin:0 0 7px}

<div id="todobox">
  <div id="todolist"></div>
  <input id="todoadd" placeholder="add a to-do…">
</div>

<div id="navpad">
  <button id="nup" title="previous project row">˄</button>
  <div><button id="nleft" title="previous card">‹</button><button id="nright" title="next card">›</button></div>
  <button id="ndown" title="next project row">˅</button>
</div>

<main>
  <div id="rail" class="trio">
    <span id="rail-start"></span>
    <div id="rail-line"><div id="rail-dots"></div></div>
  </div>
  <div id="taskchip"></div>
  <div id="pwdline"></div>
  <div id="sections"></div>
  <div id="carousel"></div>
  <p class="endnote">Session ended. Claude is writing the wrap-up in the terminal — decisions, updated buckets, next steps.</p>
</main>
</div>

<script>
const SECTIONS = [["toolmeta", "Tool meta"], ["triagemeta", "Triage meta"],
                  ["now", "Now"], ["done", "Done"], ["later", "Later"]];
const METAS = [["toolmeta", "facilitator"], ["triagemeta", "triage"]];
const NAME = { facilitator: "facilitator agent", triage: "triage agent", journal: "journal agent" };
const els = {};       // box id -> {box, reply, meta, ta, send, donebtn, toc, sec}
const secEls = {}, tocGroups = {};
let lastState = null;

// focus mode: one discussion fills the page. Cards form a grid: each project
// (owner) is a row, its conversations the columns; arrows walk it, the left
// bar jumps anywhere directly.
const FOCUS = document.body.classList.contains("focus");
let selectedId = localStorage.getItem("selbox") || null;
const lastSel = {};   // owner -> the card you were on when you left its row

// project tabs: one owner shown at a time; ?project=owner locks a pulled-out
// window to that project alone
const LOCKED = new URLSearchParams(location.search).get("project");
let activeOwner = LOCKED || localStorage.getItem("activeproj") || "facilitator";
if (LOCKED) document.body.classList.add("locked");

function labelOf(state, owner){
  const dir = (state.pwds || {})[owner] || "";
  return dir.split("/").filter(Boolean).pop() || owner;
}

function pickInRow(state, owner){
  const row = state.boxes.filter(b => b.owner === owner);
  if (!row.length) return null;
  return (lastSel[owner] && row.find(b => b.id === lastSel[owner]))
      || row.find(b => !b.done && !b.parked && !(b.writing || b.pending > 0) && b.ball === "you")
      || row[0];
}

function setTab(owner){
  if (LOCKED && owner !== LOCKED) return;
  activeOwner = owner; localStorage.setItem("activeproj", owner);
  const pick = lastState && pickInRow(lastState, owner);
  if (pick) select(pick.id);
  applySavedLayout();
  if (lastState) apply(lastState);   // refilter the bar, outline and counters now
}

let tabsBuilt = false;
let tabDrag = null;   // pull-out: tug a tab downward off the bar and it opens as its own window
function renderTabs(st){
  if (!FOCUS || !st) return;
  const bar = document.getElementById("tabbar");
  const owners = LOCKED ? [LOCKED] : rowsOf(st);
  if (!tabsBuilt || bar.childElementCount !== owners.length){
    bar.textContent = "";
    for (const ow of owners){
      const t = h("button", "ptab");
      t.dataset.owner = ow;
      t.appendChild(h("span", "plabel", labelOf(st, ow)));
      if (!LOCKED){
        t.addEventListener("mousedown", e => { tabDrag = { ow, y: e.clientY, pulled: false, el: t }; });
      }
      t.addEventListener("click", () => {
        if (tabDrag?.pulled) return;   // a pull is not a tab switch
        setTab(ow);
      });
      bar.appendChild(t);
    }
    tabsBuilt = true;
  }
  for (const t of bar.children){
    t.classList.toggle("on", t.dataset.owner === activeOwner);
    const lbl = t.querySelector(".plabel");
    const want = labelOf(st, t.dataset.owner);
    if (lbl.textContent !== want) lbl.textContent = want;
  }
}
// tearing works like a browser tab: past the threshold the tab dims, and on
// release the project's own window opens where the cursor let go
addEventListener("mousemove", e => {
  if (tabDrag && !tabDrag.pulled && e.clientY - tabDrag.y > 40){
    tabDrag.pulled = true;
    tabDrag.el.classList.add("tearing");
  }
});
addEventListener("mouseup", e => {
  if (tabDrag?.pulled){
    tabDrag.el.classList.remove("tearing");
    open(location.pathname + "?project=" + tabDrag.ow, "_blank",
         "popup=yes,width=1100,height=850,left=" + Math.max(0, e.screenX - 200) + ",top=" + Math.max(0, e.screenY - 20));
  }
  setTimeout(() => { tabDrag = null; }, 0);
});

function select(id, opts){
  if (!els[id]) return;
  selectedId = id; localStorage.setItem("selbox", id);
  const b = lastState?.boxes.find(x => x.id === id);
  if (b) lastSel[b.owner] = id;
  for (const k of Object.keys(els)){
    els[k].box.classList.toggle("sel", k === id);
    els[k].toc.classList.toggle("t-sel", k === id);
  }
  if (opts?.focus) els[id].ta.focus({ preventScroll: true });
  updatePwd();
  scrollTo({ top: 0, behavior: "instant" });
}

function updatePwd(st){
  st = st || lastState;
  if (!FOCUS || !st) return;
  const owner = st.boxes.find(x => x.id === selectedId)?.owner;
  const dir = (st.pwds || {})[owner] || st.pwd || "";
  const p = document.getElementById("pwdline");
  if (p.textContent !== dir) p.textContent = dir;
}

// project rows in fixed order: tool meta on top, the rest as the board lists them
function rowsOf(state){
  const owners = [];
  for (const b of state.boxes)
    if (b.owner !== "journal" && !owners.includes(b.owner)) owners.push(b.owner);
  owners.sort((a, b) => (a === "facilitator" ? -1 : b === "facilitator" ? 1 : 0));
  return owners;
}

function nav(dx, dy, opts){
  if (!FOCUS || !lastState) return;
  const st = lastState;
  const cur = st.boxes.find(b => b.id === selectedId) || st.boxes[0];
  if (!cur) return;
  if (dy){
    const owners = rowsOf(st);
    const oi = Math.min(Math.max(owners.indexOf(activeOwner) + dy, 0), owners.length - 1);
    if (owners[oi] !== activeOwner) setTab(owners[oi]);
  } else if (dx){
    const pool = poolOf(st);
    if (!pool.length) return;
    const i = pool.findIndex(b => b.id === selectedId);
    const pick = pool[(i + dx + pool.length) % pool.length];
    if (pick) select(pick.id, opts);
  }
}

// keep a valid selection within the active project: fall back when the
// selected box is gone, unset, or belongs to another tab
function applySelection(state){
  if (!FOCUS || !state.boxes.length) return;
  const pool = state.boxes.filter(b => b.owner === activeOwner);
  const scope = pool.length ? pool : state.boxes;
  if (!selectedId || !scope.some(b => b.id === selectedId)){
    const pick = scope.find(b => !b.done && !b.parked && !(b.writing || b.pending > 0) && b.ball === "you")
              || scope.find(b => !b.done && !b.parked)
              || scope[0];
    selectedId = pick.id; localStorage.setItem("selbox", selectedId);
  }
  for (const k of Object.keys(els)) els[k].box.classList.toggle("sel", k === selectedId);
  updatePwd(state);
}

function statusOf(b){
  return b.bucket === "meta" ? (b.owner === "facilitator" ? "toolmeta" : "triagemeta")
       : b.done ? "done" : b.parked ? "later" : "now";
}

function h(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// a bare /uploads/... token (a dropped image's home) renders as the image
function imgify(s){
  return s.replace(/(^|[\s>])(\/uploads\/[^\s<]+)/g, '$1<img class="shot" src="$2">');
}

// light formatting: paragraphs on blank lines, dash/numbered lists, **bold**
function fmt(t){
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const bold = imgify(esc.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"));
  return bold.split(/\n\n+/).map(par => {
    const lines = par.split("\n");
    if (lines.length && lines.every(l => /^(- |\d+[.)] )/.test(l))){
      const ol = /^\d/.test(lines[0]);
      // numbered points split by blank lines each become their own list,
      // so carry the source's number or every point renders as "1."
      const start = ol ? parseInt(lines[0], 10) : 1;
      return (ol ? '<ol start="' + start + '">' : "<ul>") +
        lines.map(l => "<li>" + l.replace(/^(- |\d+[.)] )/, "") + "</li>").join("") +
        (ol ? "</ol>" : "</ul>");
    }
    return "<p>" + par.replace(/\n/g, "<br>") + "</p>";
  }).join("");
}

function build(state){
  const sections = document.getElementById("sections");
  const toc = document.getElementById("toc");
  for (const [key, label] of SECTIONS){
    const group = h("div", "toc-group");
    const bucketRow = h("div", "toc-bucket");
    bucketRow.appendChild(h("span", null, label));
    const metaOwner = METAS.find(([k]) => k === key)?.[1];
    if (metaOwner){   // the plus lives in the left bar: the page shows one box at a time
      const plus = h("button", "tocadd", "＋");
      plus.title = "new box";
      plus.addEventListener("click", async () => {
        const r = await fetch("/create?owner=" + metaOwner, { method: "POST" }).then(x => x.json()).catch(() => null);
        if (r?.id) localStorage.setItem("focusbox", r.id);
        poll();
      });
      bucketRow.appendChild(plus);
    }
    group.appendChild(bucketRow);
    toc.appendChild(group);
    tocGroups[key] = group;

    const shead = h("div", "bucket " + key);
    shead.appendChild(h("h2", null, label));
    shead.appendChild(h("span", "rule"));
    const cnt = h("span", "tag", "");
    shead.appendChild(cnt);
    sections.appendChild(shead);
    const list = h("div");
    sections.appendChild(list);
    secEls[key] = { list, cnt };
  }

  state.boxes.forEach((b, i) => makeBox(b, i, state));
  addRows();
  landFocus();
}

// one box + its outline entry, inserted at its position within its section
function makeBox(b, i, state){
    const entry = h("div", "toc-entry");
    entry.appendChild(h("span", "tage"));
    entry.appendChild(h("span", "tnum", (b.id === "0" || b.id === "t0") ? "•" : b.id));
    entry.appendChild(h("span", "tdot"));
    entry.appendChild(h("span", "ttitle", b.title));
    entry.addEventListener("click", () => {
      if (FOCUS) select(b.id);
      else document.getElementById("box-" + b.id)?.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    const box = h("article", "box" + (b.bucket === "meta" ? " metabox" : ""));
    box.style.animationDelay = (i * 22) + "ms";
    box.id = "box-" + b.id;

    const head = h("div", "head");
    if (b.bucket === "meta"){
      const x = h("button", "xbtn", "×");
      x.title = "remove this box";
      x.addEventListener("click", async e => {
        e.stopPropagation();
        await fetch("/delete?box=" + encodeURIComponent(b.id), { method: "POST" }).catch(() => {});
        poll();
      });
      head.appendChild(x);
    }
    head.appendChild(h("span", "num", b.id));
    const titleEl = h("span", "title", b.title);
    head.appendChild(titleEl);
    const wstat = h("span", "wstat");
    head.appendChild(wstat);
    head.appendChild(h("span", "turn", "your turn"));
    const park = h("button", "parkbtn", "later");
    head.appendChild(park);
    const done = h("button", "donebtn", "done");
    head.appendChild(done);
    box.appendChild(head);

    const ctx = h("div", "ctx", b.context || "");
    box.appendChild(ctx);

    const body = h("div", "body");
    const reply = h("div", "reply");
    reply.dataset.raw = b.reply;
    reply.innerHTML = fmt(b.reply);
    reply.addEventListener("animationend", () => reply.classList.remove("fresh"));
    const meta = h("div", "meta");
    const pend = h("div", "pendlist");   // your still-unanswered messages, dim, above the input
    const compose = h("div", "compose");
    const ta = h("textarea");
    ta.placeholder = "Reply to this point…";
    ta.rows = 1;
    const send = h("button", "sendbtn", "Send");
    compose.append(ta, send);
    body.append(reply, meta, pend, compose);
    box.appendChild(body);

    const sec = statusOf(b);
    // slot in where the state array says this box belongs; during the initial
    // build the next box does not exist yet, so this appends in order
    const peers = state.boxes.filter(x => statusOf(x) === sec);
    const nextB = peers[peers.findIndex(x => x.id === b.id) + 1];
    const nextEl = nextB && els[nextB.id];
    if (nextEl && nextEl.box.parentNode === secEls[sec].list){
      secEls[sec].list.insertBefore(box, nextEl.box);
      tocGroups[sec].insertBefore(entry, nextEl.toc);
    } else {
      const addRow = secEls[sec].list.querySelector(":scope > .addrow");
      if (addRow) secEls[sec].list.insertBefore(box, addRow);
      else secEls[sec].list.appendChild(box);
      tocGroups[sec].appendChild(entry);
    }

    ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; });   // CSS max-height caps it
    // dropped images upload immediately; their /uploads/ address joins the text
    ta.addEventListener("dragover", e => { e.preventDefault(); ta.classList.add("dropping"); });
    ta.addEventListener("dragleave", () => ta.classList.remove("dropping"));
    ta.addEventListener("drop", async e => {
      e.preventDefault(); ta.classList.remove("dropping");
      const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith("image/"));
      for (const f of files){
        const r = await fetch("/upload?name=" + encodeURIComponent(f.name), { method: "POST", body: f })
          .then(x => x.json()).catch(() => null);
        if (r?.url) ta.value = (ta.value ? ta.value.trimEnd() + "\n" : "") + r.url + "\n";
      }
      ta.dispatchEvent(new Event("input"));
    });
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); doSend(b.id); } });
    send.addEventListener("click", () => doSend(b.id));
    done.addEventListener("click", e => { e.stopPropagation(); toggleFlag(b.id, "done"); });
    park.addEventListener("click", e => { e.stopPropagation(); toggleFlag(b.id, "park"); });
    head.addEventListener("click", () => {
      if (box.classList.contains("done") || box.classList.contains("waiting") || box.classList.contains("parked"))
        box.classList.toggle("peek");
    });

    els[b.id] = { box, reply, meta, pend, ta, send, donebtn: done, wstat, toc: entry, sec,
                  titleEl, tocTitle: entry.querySelector(".ttitle"), ctx };
}

// "+" row under each meta section: one click = new box owned by that section,
// its first message names it
function addRows(){
  for (const [key, owner] of METAS){
    const addRow = h("div", "addrow");
    const addBtn = h("button", "addbtn", "＋ new box");
    addBtn.addEventListener("click", async () => {
      const r = await fetch("/create?owner=" + owner, { method: "POST" }).then(x => x.json()).catch(() => null);
      if (r?.id) localStorage.setItem("focusbox", r.id);  // survive the rebuild reload
      poll();  // unknown id triggers the rebuild
    });
    addRow.appendChild(addBtn);
    secEls[key].list.appendChild(addRow);
  }

}

// land the cursor in a box the user just created
function landFocus(){
  const fb = localStorage.getItem("focusbox");
  if (fb && els[fb]){
    localStorage.removeItem("focusbox");
    if (FOCUS){ select(fb, { focus: true }); return; }
    els[fb].box.scrollIntoView({ block: "center" });
    els[fb].ta.focus();
  }
}

async function doSend(id){
  const el = els[id];
  const text = el.ta.value.trim();
  if (!text) return;
  el.send.disabled = true;
  try {
    const r = await fetch("/send?box=" + encodeURIComponent(id), { method: "POST", body: text });
    if (!r.ok) throw new Error(r.status);
    el.ta.value = ""; el.ta.style.height = "auto";   // clear only after the server has it
    poll();
  } catch (err) {
    el.meta.textContent = "send failed, text kept — try again";
  } finally {
    el.send.disabled = false;
  }
}

async function toggleFlag(id, kind){
  const cls = kind === "done" ? "done" : "parked";
  const on = els[id].box.classList.contains(cls);
  els[id].box.classList.remove("peek");
  await fetch("/" + kind + "?box=" + encodeURIComponent(id) + "&v=" + (on ? 0 : 1), { method: "POST" }).catch(() => {});
  poll();
}

function apply(state){
  for (const id of Object.keys(els)){    // deleted boxes leave the page
    if (!state.boxes.some(b => b.id === id)){
      els[id].box.remove(); els[id].toc.remove(); delete els[id];
    }
  }

  // scroll anchor: whatever you're typing in (else the box under the viewport
  // center — what you're reading) must not move when boxes above fold/expand.
  // Focus mode shows one box, so there is nothing to anchor against.
  let anchorEl = null, anchorTop = 0;
  if (!FOCUS){
    const focusEl = document.activeElement && document.activeElement.tagName === "TEXTAREA" ? document.activeElement : null;
    anchorEl = focusEl ? focusEl.closest(".box") : null;
    if (!anchorEl) anchorEl = document.elementFromPoint(innerWidth / 2, innerHeight / 2)?.closest(".box") || null;
    if (!anchorEl) anchorEl = [...document.querySelectorAll(".box")].find(x => x.getBoundingClientRect().bottom > 60);
    anchorTop = anchorEl ? anchorEl.getBoundingClientRect().top : 0;
  }

  // new boxes appear in place (no reload, no white flash); the anchor
  // correction below absorbs any shift they cause above the viewport
  for (const b of state.boxes){
    if (!els[b.id]){
      makeBox(b, 0, state);
      landFocus();
    }
  }

  for (const b of state.boxes){
    const el = els[b.id];
    if (!el) continue;
    if (el.reply.dataset.raw !== b.reply){
      el.reply.dataset.raw = b.reply;
      el.reply.innerHTML = fmt(b.reply);
      el.reply.classList.remove("fresh"); void el.reply.offsetWidth; el.reply.classList.add("fresh");
    }
    if (el.titleEl.textContent !== b.title){   // first message just named a new box
      el.titleEl.textContent = b.title;
      el.tocTitle.textContent = b.title;
    }
    if (el.ctx.textContent !== (b.context || "")) el.ctx.textContent = b.context || "";
    const pt = (b.pendingTexts || []).join("\n\n");
    if (el.pend.dataset.raw !== pt){
      el.pend.dataset.raw = pt;
      el.pend.innerHTML = (b.pendingTexts || [])
        .map(t => "<p>" + imgify(t.replace(/&/g, "&amp;").replace(/</g, "&lt;")) + "</p>").join("");
    }
    el.box.classList.toggle("done", b.done);
    el.box.classList.toggle("parked", !!b.parked);
    const s = statusOf(b);
    if (el.sec !== s){
      secEls[s].list.appendChild(el.box);
      tocGroups[s].appendChild(el.toc);
      el.sec = s;
    }
    const waiting = !b.done && (b.writing || b.pending > 0);
    el.box.classList.toggle("waiting", waiting);
    if (!waiting && !b.done) el.box.classList.remove("peek");
    el.box.classList.toggle("yourturn", !b.done && !waiting && b.ball === "you");
    const ws = b.writing ? '<span class="w2">' + NAME[b.owner] + ' is writing</span>'
             : (b.queuePos ? "sent ✓ " + ord(b.queuePos) + " in line" : "");
    if (el.wstat.innerHTML !== ws) el.wstat.innerHTML = ws;  // rewriting every poll restarts the dots and re-wraps the title row
    const bits = [];
    if (b.writing) bits.push('<span class="w">' + NAME[b.owner] + ' is writing</span>');
    else if (b.queuePos) bits.push("sent ✓ · " + ord(b.queuePos) + " in line");
    if (b.pending && !b.writing) bits.push(b.pending + " message" + (b.pending > 1 ? "s" : "") + " since last reply");
    else if (b.pending > 1 && b.writing) bits.push(b.pending + " messages folding in");
    const mh = bits.join(" · ");
    if (el.meta.innerHTML !== mh) el.meta.innerHTML = mh;
    if (el.toc){
      el.toc.className = "toc-entry " + (
        b.done ? "t-done" : b.parked ? "t-later" : b.writing ? "t-writing" : b.pending > 0 ? "t-queued" :
        b.ball === "you" ? "t-you" : "") + (FOCUS && b.id === selectedId ? " t-sel" : "");
      el.toc.style.display = (FOCUS && b.owner !== activeOwner) ? "none" : "";
      el.toc.querySelector(".tage").textContent = age(b.ts);
    }
  }
  if (anchorEl){
    const delta = anchorEl.getBoundingClientRect().top - anchorTop;
    // behavior:"instant" — the page's smooth scroll-behavior would animate the
    // correction into a visible glide, which IS the shift we're preventing
    if (delta) window.scrollBy({ top: delta, left: 0, behavior: "instant" });
  }
  applySelection(state);
  const dot = document.getElementById("dot");
  const live = document.getElementById("livetext");
  const writingBoxes = state.boxes.filter(x => x.writing);
  const anyBusy = Object.values(state.busy).some(Boolean);
  dot.classList.toggle("on", anyBusy || state.queued > 0);
  live.textContent = writingBoxes.length
      ? ("replying to " + writingBoxes.map(x => x.id).join(" + ") + (state.queued ? " · " + state.queued + " queued" : ""))
      : state.queued ? (state.queued + " queued") : "idle";
  document.body.classList.toggle("paused", !!state.paused);
  document.getElementById("pausebtn").textContent = state.paused ? "resume listeners" : "pause listeners";
  if (state.paused){
    dot.classList.remove("on");
    live.textContent = "paused" + (state.queued ? " · " + state.queued + " queued" : "");
  }
  // board title comes from state (seeded via seed.json), not from the page
  if (state.title && document.title !== state.title){
    document.title = state.title;
    const nm = document.getElementById("boardname");
    const sp = state.title.indexOf(" ");
    nm.textContent = "";
    if (sp > 0){
      nm.append(state.title.slice(0, sp) + " ");
      const em = document.createElement("em");
      em.textContent = state.title.slice(sp + 1);
      nm.append(em);
    } else nm.textContent = state.title;
  }
  // in focus mode the counters and outline speak for the active tab only
  const scope = FOCUS ? state.boxes.filter(x => x.owner === activeOwner) : state.boxes;
  const doneN = scope.filter(x => x.done).length;
  const yours = scope.filter(x => !x.done && !x.parked && !(x.writing || x.pending > 0) && x.ball === "you").length;
  document.getElementById("prog").innerHTML = "<b>" + doneN + "</b>/" + scope.length + " done" +
    (yours ? " · " + yours + " await you" : "");
  for (const [key] of SECTIONS){
    secEls[key].cnt.textContent = scope.filter(x => statusOf(x) === key).length;
    const visible = [...tocGroups[key].children]
      .filter(c => c.classList.contains("toc-entry") && c.style.display !== "none").length;
    tocGroups[key].style.display = visible ? "" : "none";
  }
  renderTabs(state);
  if (FOCUS){
    renderWorkspaces(state);
    renderTrio(state);
    renderCarousel(state);
    renderTodos(state);
  }
  document.body.classList.toggle("ended", !!state.end);

  // listener presence, per agent: each is either long-polling (listening),
  // composing a claimed reply (busy), or recently between the two. Otherwise: offline.
  const offOwners = state.paused ? [] : Object.keys(NAME).filter(ow =>
    (state.everListened || {})[ow] &&
    !state.listening[ow] && !state.busy[ow] && state.listenerGap[ow] > 300);
  document.body.classList.toggle("offline", offOwners.length > 0);
  if (offOwners.length){
    document.getElementById("offline").textContent =

const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July",

function tickClock(){

// inline edit for the trio's texts: swap the span for an input; Enter saves
function inlineEdit(spanEl, initial, onSave){
  if (spanEl.querySelector("input")) return;
  spanEl.textContent = "";
  const inp = document.createElement("input");
  inp.value = initial || "";
  spanEl.appendChild(inp);
  inp.focus();
  inp.select();
  const finish = save => {
    const v = inp.value.trim();
    spanEl.textContent = initial || "";
    if (save) onSave(v);
  };
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter"){ e.preventDefault(); finish(true); }
    if (e.key === "Escape") finish(false);
    e.stopPropagation();
  });
  inp.addEventListener("blur", () => finish(false));
}

// ---- the carousel: the workspace's other chats as a queue -----------------
// Front: chats the agent has addressed (yellow), newest first. Back: chats
// answered and waiting on the agent (green), the just-answered one last.
function poolOf(state){
  const w = curWs(state);
  return state.boxes.filter(b =>
    b.owner === activeOwner && b.id !== "q" && (!w || b.ws === w.id))
    .sort((a, b) => {
      const g = x => x.done ? 2 : (x.ball === "you" ? 0 : 1);
      if (g(a) !== g(b)) return g(a) - g(b);
      if (g(a) === 1) return (a.ts || 0) - (b.ts || 0);   // just-answered sinks to the bottom
      return (b.agentTs || 0) - (a.agentTs || 0);          // newest agent reply on top
    });
}

function carouselRow(state){
  const w = curWs(state);
  const pool = poolOf(state);
  pool = pool.filter(b => b.id !== selectedId);
  const you = pool.filter(b => !b.done && b.ball === "you")
    .sort((a, b) => (b.agentTs || 0) - (a.agentTs || 0));
  const wait = pool.filter(b => !b.done && b.ball !== "you")
    .sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const done = pool.filter(b => b.done);
  return [...you, ...wait, ...done];
}

function relAge(ts){
  if (!ts) return "no reply yet";
  const sec = Date.now() / 1000 - ts;
  if (sec < 60) return "replied just now";
  if (sec < 3600) return "replied " + Math.floor(sec / 60) + "m ago";
  if (sec < 86400) return "replied " + Math.floor(sec / 3600) + "h ago";
  return "replied " + Math.floor(sec / 86400) + "d ago";
}

const prevBall = {};
function shortAge(ts){
  if (!ts) return "";
  const sec = Date.now() / 1000 - ts;
  if (sec < 60) return "now";
  if (sec < 3600) return Math.floor(sec / 60) + "m";
  if (sec < 86400) return Math.floor(sec / 3600) + "h";
  return Math.floor(sec / 86400) + "d";
}
function renderCarousel(state){
  const tik = document.getElementById("tiklist");
  const chips = document.getElementById("chips");
  const w = curWs(state);
  const all = poolOf(state);    // every chat of the workspace, grouped and sorted
  const pool = all.filter(b => ticketView === "done" ? b.done : !b.done);  // panel tab
  const fresh = pool.filter(b => !b.done && b.ball !== "you" && prevBall[b.id] === "you")
                    .map(b => b.id);
  for (const b of state.boxes) prevBall[b.id] = b.ball;
  const sig = ticketView + "|" + pool.map(b => b.id + b.ball + (b.writing ? "w" : "") + (b.done ? "d" : "") + b.pending +
                      (b.id === selectedId ? "!" : "") + (b.task || "") +
                      Math.floor((Date.now() / 1000 - (b.agentTs || 0)) / 60)).join(",") +
              "|" + selectedTask;
  if (tik.dataset.sig !== sig || fresh.length){
    tik.dataset.sig = sig;
    tik.textContent = "";
    for (const b of pool){
      const r = h("div", "trow" + (b.id === selectedId ? " on" : "") + (b.writing ? " working" : "") +
                  (!b.writing && !b.done && b.ball === "you" ? " yours" : "") +
                  (!b.writing && !b.done && b.ball !== "you" ? " queuedc" : "") +
                  (b.done ? " donec" : "") +
                  (selectedTask && b.task === selectedTask ? " match" : ""));
      const inner = h("div", "trowin");
      if (/^[0-9]/.test(b.id)) inner.appendChild(h("span", "tnum", b.id));
      inner.appendChild(h("div", "ttl", b.title));
      const meta = h("div", "tmeta");
      meta.appendChild(h("span", "tage", b.done ? "done" : shortAge(b.agentTs)));
      meta.appendChild(h("span", "teng", b.engine || "claude"));
      inner.appendChild(meta);
      r.appendChild(inner);
      if (fresh.includes(b.id)){
        const sw = h("div", "sweep");
        const stripe = h("i");
        stripe.addEventListener("animationend", () => sw.remove());
        sw.appendChild(stripe);
        r.appendChild(sw);
      }
      r.addEventListener("click", () => select(b.id));
      tik.appendChild(r);
    }
    if (!pool.length) tik.appendChild(h("div", "tempty", ticketView === "done" ? "no done chats yet" : "no open chats here"));
    tik.querySelector(".trow.on")?.scrollIntoView({ block: "nearest" });
  }
  // chips spring up above the panel: green while its agent works, yellow
  // while the ticket awaits input; click jumps there
  const need = pool.filter(b => !b.done && (b.writing || b.ball === "you"));
  const csig = need.map(b => b.id + (b.writing ? "g" : "y")).join(",");
  if (chips.dataset.sig !== csig){
    chips.dataset.sig = csig;
    chips.textContent = "";
    const MAXCHIPS = 8;
    for (const b of need.slice(0, MAXCHIPS)){
      const c = h("span", "chip " + (b.writing ? "g" : "y"));
      c.title = b.title;
      c.addEventListener("click", () => select(b.id));
      chips.appendChild(c);
    }
    if (need.length > MAXCHIPS){
      const rest = need.slice(MAXCHIPS);
      const c = h("span", "chip more", "+" + rest.length);
      c.title = rest.map(b => b.title).join("\n");
      c.addEventListener("click", () => select(rest[0].id));
      chips.appendChild(c);
    }
  }
}

let pollFails = 0;
async function poll(){
  try {
    const state = await (await fetch("/state")).json();
    pollFails = 0;
    if (!lastState) build(state);
    apply(state);
    lastState = state;
  } catch (e) {
    if (++pollFails >= 3){   // server itself unreachable, distinct from listener-offline
      document.body.classList.add("offline");
      document.getElementById("offline").textContent =
        "The facilitator server is unreachable. Nothing sent now will arrive; ask in the terminal to restart it.";
    }
  }
}

addEventListener("keydown", e => {
  if (!FOCUS) return;
  if (e.metaKey && e.shiftKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
    // command+shift+arrows: previous/next card, in and out of the text box
    e.preventDefault();
    nav(e.key === "ArrowLeft" ? -1 : 1, 0, { focus: true });
    return;
  }
  if (e.metaKey && e.shiftKey && ["[", "]", "{", "}"].includes(e.key)){
    // command+shift+brackets: previous/next card, works while typing,
    // cursor lands in the next card's text box
    e.preventDefault();
    nav(e.key === "[" || e.key === "{" ? -1 : 1, 0, { focus: true });
    return;
  }
  if (e.metaKey && (e.key === "t" || e.key === "T")){   // command+T: new card, input focused
    e.preventDefault();
    fetch("/create?owner=" + activeOwner, { method: "POST" })
      .then(x => x.json())
      .then(r => { if (r?.id){ localStorage.setItem("focusbox", r.id); poll(); } })
      .catch(() => {});
    return;
  }
  if (e.metaKey && /^[1-9]$/.test(e.key) && lastState){   // command+number jumps tabs
    const owners = LOCKED ? [LOCKED] : rowsOf(lastState);
    const ow = owners[+e.key - 1];
    if (ow){ e.preventDefault(); setTab(ow); }
    return;
  }
  const t = e.target;
  const typing = t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT");
  if (typing){ if (e.key === "Escape") t.blur(); return; }
  const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];   // up/down freed; cmd+number switches projects
  if (d){ e.preventDefault(); nav(d[0], d[1]); }
});

// scale the fixed 1440x900 stage to the largest that fits, centered
function fitStage(){
  if (!FOCUS) return;
  const stage = document.getElementById("stage");
  if (!stage) return;
  const bar = 41, DW = 1440, DH = 900;
  const availH = innerHeight - bar;
  // fixed size, never scaled: center it, and only scale DOWN if the window is
  // smaller than the app so nothing is lost; elements keep their size otherwise
  // fixed size, never scaled: the app is a locked rectangle, centered. The
  // elements inside never resize; a smaller window just shows less of it.
  const tx = Math.max(0, (innerWidth - DW) / 2);
  const ty = Math.max(0, (availH - DH) / 2);
  stage.style.transform = `translate(${tx}px, ${ty}px)`;
}

  if (!FOCUS || !dragEnabled || !e.altKey) return;
  const el = e.target.closest(REGION_SEL);
  if (!el) return;
  e.preventDefault();
  const r = el.getBoundingClientRect();
  const sr = document.getElementById("stage").getBoundingClientRect();
  // positions are stage-local; subtract the stage's origin so the box lands
  // under the cursor no matter where the fixed stage is centered
  dragging = { el, dx: e.clientX - r.x, dy: e.clientY - r.y, sx: sr.x, sy: sr.y, x: 0, y: 0 };
  document.body.classList.add("dragging");
});

  if (!dragging) return;
  dragging.x = Math.max(0, Math.round((e.clientX - dragging.dx - dragging.sx) / GRID) * GRID);
  dragging.y = Math.max(0, Math.round((e.clientY - dragging.dy - dragging.sy) / GRID) * GRID);
  dragging.el.style.left = dragging.x + "px";
  dragging.el.style.top = dragging.y + "px";
});

  if (!dragging) return;
  localStorage.setItem("pos." + activeOwner + "." + regionId(dragging.el),

// the picture, clicked, grows out of the panel until it fills the screen over a
// dark veil, and shrinks back into the panel on the next click outside it or on
// Escape. the thing that grows is the panel's own img, carried into the layer
// and carried back after, not a copy: the poll above keeps swapping its src
// underneath, so a plot redrawn while it is open simply appears, and there is
// never a second object url in the room to be leaked
// 300ms on the board's own curve, the one the tabs glide on. that curve is quick
// off the mark and settles rather than stops, which is how a real object arrives;
// 220 is right for a tab sliding one tab's width, and this crosses the whole
// screen, so it gets the extra 80. past about 400 a zoom starts to feel slow
const P3_ZOOM_MS = 300;
const P3_ZOOM_EASE = "cubic-bezier(0.25, 1, 0.5, 1)";
const P3_ZOOM_PAD = 56;   // air left around the picture, so it never touches an edge
// how dark the veil ends up. it used to live in the veil's own colour as an
// alpha and the fade ran to a plain 1; it is the fade's end point now so the
// colour can be opaque, which is what keeps the veil off the raster threads.
// the stylesheet above says why at length. the two have to agree: this number
// and the alpha that was in that colour are the same .62
const P3_VEIL_ALPHA = 0.62;
let p3Zoom = null;        // what is open, and null whenever nothing is

// the layer, built the first time a picture is opened and kept afterwards
function p3Layer(){
  let layer = document.getElementById("p3zoom");
  if (layer) return layer;
  layer = h("div");
  layer.id = "p3zoom";
  layer.appendChild(h("div", "p3veil"));

// where a picture of this shape sits inside a box of that shape, centred and
// letterboxed: object-fit paints it this way inside the panel, so this is the
// rectangle the eye sees, and the eye is what has to be moved
function p3Fit(img, x, y, bw, bh){
  const nw = img.naturalWidth || bw, nh = img.naturalHeight || bh;
  const s = Math.min(bw / nw, bh / nh);
  const w = nw * s, h2 = nh * s;

// the panel's inside, read off the panel itself rather than off the picture, so
// it still answers while the picture is away in the layer
function p3PanelRect(img){
  const host = document.getElementById("magic3");
  if (!host) return null;
  const r = host.getBoundingClientRect(), cs = getComputedStyle(host);
  const pl = parseFloat(cs.paddingLeft) || 0, pt = parseFloat(cs.paddingTop) || 0;
  const bw = host.clientWidth - pl - (parseFloat(cs.paddingRight) || 0);
  const bh = host.clientHeight - pt - (parseFloat(cs.paddingBottom) || 0);
  if (bw <= 0 || bh <= 0) return null;
  return p3Fit(img, r.x + (parseFloat(cs.borderLeftWidth) || 0) + pl,
    r.y + (parseFloat(cs.borderTopWidth) || 0) + pt, bw, bh);
}
// the screen less its margin. the margin shrinks with the window so a small one
// still gets a big picture
function p3ScreenRect(img){
  const pad = Math.min(P3_ZOOM_PAD, innerWidth * 0.06, innerHeight * 0.06);
  return p3Fit(img, pad, pad, innerWidth - pad * 2, innerHeight - pad * 2);
}

  // of the writes, so the one rule that answers it lands in the same style pass
  // as the layer itself and no second one is asked for
  document.body.classList.add("p3zoom");

  const to = p3ScreenRect(img);
  p3ZoomPlace(img, to);
  p3Zoom = { img, to, veil: layer.querySelector(".p3veil"), closing: false };

  // panel's rectangle and lets go, which is what lands it back exactly rather
  // than a hair off
  const ms = p3ZoomStill() ? 0 : P3_ZOOM_MS;
  p3Zoom.anim = img.animate([{ transform: p3ZoomInvert(from, to) }, { transform: "none" }],
    { duration: ms, easing: P3_ZOOM_EASE, fill: "both" });
  p3Zoom.veilAnim = p3Zoom.veil.animate([{ opacity: 0 }, { opacity: P3_VEIL_ALPHA }],
    { duration: ms, easing: P3_ZOOM_EASE, fill: "both" });

  // shape instead of sitting inside the shape of the one it replaced
  img.addEventListener("load", p3ZoomRefit);
}
// the transform that puts a picture placed at `to` back over `from`. one scale
// for both axes: both rectangles are the picture's own shape, so nothing skews
function p3ZoomInvert(from, to){
  return "translate(" + (from.x - to.x) + "px, " + (from.y - to.y) + "px) scale("

  const back = p3ZoomInvert(p3PanelRect(z.img) || z.to, z.to);
  // caught halfway out it turns around from where it is, and takes only the time
  // it has already spent to get home, so an accidental click does not drag.
  // both of the shrink's starting values have to be read here, above the two
  // cancels: cancelling an animation drops the computed value straight back to
  // what the stylesheet says, and the sheet says the veil is 0, so a veil read

// renaming in place, the same shape as the large card's: a click edits where you

function miniEditTitle(id, opts){

  t.setAttribute("contenteditable", "plaintext-only");

    const name = t.textContent.trim();

        .then(() => poll()).catch(() => {});

        .then(() => poll()).catch(() => {});

      // the yellow sun moves a card to doing, the orange moon defers, the pink
      // cross closes a card that holds a conversation and removes one that is
      // empty. this list holds doing cards alone, so here the sun is always
      // the faded one
      const sun = sunChip("msun", b.id);
      const dock = dockChip("mdock", b.id);
      const arc = h("button", "marc");
      arc.title = "defer to the deferred tab\n" + SECTION_KEY_HINTS.deferred;
      arc.innerHTML = '<svg viewBox="0 0 24 24" width="9" height="9" fill="currentColor" stroke="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
      arc.addEventListener("click", e => { e.stopPropagation(); if (!chipOff(arc)) toggleFlag(b.id, "park"); });
      const x = h("button", "mx");
      x.title = "done (an empty card is removed instead)\n" + SECTION_KEY_HINTS.done;
      x.addEventListener("click", async e => {
        e.stopPropagation();
        if (chipOff(x)) return;
        await fetch(closeCardUrl(b.id), { method: "POST" }).catch(() => {});
        poll();
      });
      const reply = h("div", "mreply cardmd");
      // the seat for the panel of what the reply under it was given, the large
      // card's own panel at this card's size. the small card shows the live
      // reply alone and carries no stepper, so this is always the live reply's
      // own batch
      const answwrap = h("div", "answwrap");
      // and the seat for the panel of what has been sent and not answered, the
      // large card's sent panel at this card's size, over the row
      const sentwrap = h("div", "sentwrap");
      const compose = h("div", "mcompose");
      const ta = h("textarea");
      ta.rows = 1;
      const send = h("button", "msend", "Send");
      compose.append(ta, send);
      // the small card's row carries the same typed formatting the big one
      // does, with the same two keys: enter sends and shift enter breaks
      ComposeFormat.attach(ta, { newline: e => e.shiftKey });
      // answers true once the board has the message, false when it did not
      // arrive, and null when there was nothing to send
      const fire = async () => {
        const text = ta.value.trim();
        if (!text) return null;
        send.disabled = true;
        // the message comes into the sent panel at the press, cut to its preview
        // and faded until the board has saved it, the way it does on the large
        // card, and the words leave the row with it: one that does not get
        // through stays in the panel under its mark, and the cross gives them back
        const own = miniEls[b.id];
        const motion = armSentMotion(own);
        // via=mini says this was typed in the small card. The big card sends
        // no marker at all, so the agent can tell the two apart and the
        // server can hold a small card answer to a small card's worth of room
        const sentItem = sentLaunch(own, text, "/send?box=" + encodeURIComponent(b.id) + "&via=mini");
        ta.value = ""; own.tick();
        motion?.play();
        try {
          const result = await sentTry(sentItem);
          if (result === "landed"){
            sentLanded(own, sentItem);
            poll();
            return true;
          } else sentFailed(own, sentItem, result === "refused");
        } finally { send.disabled = false; }
        return false;
      };
      send.addEventListener("click", fire);
      // the board's own arrow keys must never see this typing. control+enter
      // sends, then hands the keys back to the large card and moves on to the
      // card that has waited longest, or does just that when nothing is typed
      ta.addEventListener("keydown", e => {
        e.stopPropagation();
        if (e.key === "Enter" && !e.shiftKey && !e.altKey){
          e.preventDefault();
          const sending = fire();
          if (controlEnter(e) && !e.repeat) sending.then(sent => {
            if (sent === false) return;
            miniHold(false);
            boardAdvance(selectedId);
          });
        }
      });
      ta.addEventListener("keyup", e => e.stopPropagation());
      ta.addEventListener("input", () => {
        ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px";
        // a key here holds a new answer on this card back, as on the large one
        noteTyping(ta);
      });
      // reading and typing here count for the card as they do on the large one
      readOnCompose(ta, b.id);
      box.append(sun, dock, arc, x, title, answwrap, reply, sentwrap, compose);
      el = miniEls[b.id] = { box, title, reply, ta, sun, dock, arc, x,
                             answwrap, answ: null, answId: null,
                             sentwrap, sent: null, sentKey: "", sentItems: [],
                             tick: () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; } };
      // and the reader's own scrolling of its answer, which holds a turn back too
      watchReading(el);
      list.appendChild(box);
    }
    // one card at a time; the rest stay built so their half-typed messages
    // survive a walk away and back
    el.box.classList.toggle("off", b.id !== miniId);
    readOnArrival(el, b, b.id === miniId && ComposeFormat.focused(el.ta));
    if (!el.title.isContentEditable && el.title.textContent !== (b.title || "")){
      el.title.textContent = b.title || "";
    }
    // The short variant is a state field, not punctuation hidden in the text.
    // a new one on the card on show turns the page as the large card's does
    // (turnBegin in card-logic.js): the sent panel rises to the head of the card
    // with the new answer under it, in one glide, or the answer is printed in
    // place when nothing was sent. it waits while the reader is busy with the
    // card, and a card built just now has nothing to turn from
    const shortReply = replyShort(b);
    const turn = el.reply.dataset.raw !== undefined && el.reply.dataset.raw !== shortReply
      ? turnBegin(el, b) : null;
    const held = turn === TURN_HELD;
    if (!held && el.reply.dataset.raw !== shortReply){
      el.reply.dataset.raw = shortReply;
      el.reply.innerHTML = fmt(shortReply);
    }
    // the large card's own passes, told to answer to nobody: the small card has
    // no answer to re-snap when a panel opens or is cut back. a reading asked
    // for before this card's own last send landed may not take it away
    if (!held) syncAnswered(el, liveAnswered(b), null);
    if (!held && (state.fetchedAt || 0) >= (el.sendGuard || 0)){
      el.sentItems = sentFrom(b);
      syncSent(el, el.sentItems);
    }
    turnGo(el, turn);
    el.box.classList.toggle("mwait", !!b.pending);
    paintSectionChips(el, b);
  }
  for (const id of Object.keys(miniEls)){
    if (!live.has(id)){
      // the small card's row is held by the formatter too, and this card's
      // handle is the one the formatter keeps for its field
      ComposeFormat.fieldOf(miniEls[id].ta)?.detach();
      // and the watches on its two panels' sizes go with it
      dropAnswered(miniEls[id], null);
      dropSent(miniEls[id]);
      miniEls[id].box.remove(); delete miniEls[id];
    }
  }
  // reorder only when the order really changed; moving nodes every poll would
  // fight a composer that is being typed into
  const order = cards.map(b => b.id).join(",");
  if (list.dataset.order !== order){
    list.dataset.order = order;
    for (const b of cards) list.appendChild(miniEls[b.id].box);
  }
  // opening the name has to come last: the reorder above moves the card's node,
  // and moving a node that holds the caret blurs it, which would commit the
  // rename the instant it opened
  if (miniEditPending && miniEls[miniEditPending] && miniEditPending === miniId){
    const id = miniEditPending;
    miniEditPending = null;
    miniEditTitle(id);
  }
}

// ---- the carousel: the workspace's other chats as a queue -----------------
// Front: chats the agent has addressed (yellow), newest first. Back: chats
// answered and waiting on the agent (green), the just-answered one last.
// cardState, queueState, awaitsYou, viewFilter, viewPool and poolOf are shared
// with the phone page in card-logic.js. the desktop narrows the lane's pool to
// the chosen workspace, and hands poolOf that test here
poolScope = state => { const w = curWs(state); return w ? (b => b.ws === w.id) : null; };

function carouselRow(state){
  const w = curWs(state);
  const pool = poolOf(state);
  pool = pool.filter(b => b.id !== selectedId);
  const you = pool.filter(b => !b.done && b.ball === "you")
    .sort((a, b) => (b.agentTs || 0) - (a.agentTs || 0));
  const wait = pool.filter(b => !b.done && b.ball !== "you")
    .sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const done = pool.filter(b => b.done);
  return [...you, ...wait, ...done];
}

function relAge(ts){
  if (!ts) return "no reply yet";
  const sec = Date.now() / 1000 - ts;
  if (sec < 60) return "replied just now";
  if (sec < 3600) return "replied " + Math.floor(sec / 60) + "m ago";
  if (sec < 86400) return "replied " + Math.floor(sec / 3600) + "h ago";
  return "replied " + Math.floor(sec / 86400) + "d ago";
}

// shortAge and the list's spinner (syncSpinner, SPIN_FRAMES, spinGlyph) are
// shared with the phone page in card-logic.js
// one section of the sheet: its own rows, its own scroll kept across a rebuild,
// and the row-glide of survivors. drawn only when its own group's signature
// changes, so a change in one section never rebuilds the others.
function paintTicketPane(pane, pool, view, state, laneSig){
  const sig = view + "|" + laneSig + "|" +
              pool.map(b => b.id + b.ball + (b.writing ? "w" : "") + (b.bg ? "g" : "") + (b.done ? "d" : "") + b.pending +
                      ((seenReplies[b.id] || 0) >= (b.replies || 0) ? "r" : "") +
                      (b.id === selectedId ? "!" : "") + (b.task || "") + b.title +
                      // the marker rides the signature so a mark or a clear
                      // repaints the row
                      (testReady(b) ? "T" : "") +
                      Math.floor((Date.now() / 1000 - (b.agentTs || 0)) / 60)).join(",") +
              "|" + selectedTask;
  if (pane.dataset.sig === sig) return;
  pane.dataset.sig = sig;
  // ordinary polls must not pull a manually scrolled section back to the top or
  // to the selected row; only a selection new to this render is revealed
  const selectedBefore = pane.querySelector(".trow.on")?.dataset.id;
  const keepScroll = pane.scrollTop;
  const oldPos = {};
  for (const prev of pane.children) if (prev.dataset && prev.dataset.id) oldPos[prev.dataset.id] = prev.getBoundingClientRect().top;
  pane.textContent = "";
  for (const b of pool){
    const s = queueState(b);   // working covers claimed and a worker's job behind it
    // quirks kept: a claimed done row still pulses, and an untouched row
    // falls in with yours or queued by where the ball sits
    const busy = s === "working" || (s === "done" && cardState({ ...b, done: false, parked: false, state: null }) === "working");
    const read = seenReplies[b.id] || 0;
    const isYours = s === "yours" || (s === "new" && b.ball === "you");
    const isMatch = selectedTask && b.task === selectedTask;
    const isTest = testReady(b);
    const r = h("div", "trow" + (b.id === selectedId ? " on" : "") + (busy ? " working" : "") +
                (s === "yours" && read >= (b.replies || 0) ? " seen" : "") +
                (isYours ? " yours" : "") +
                (s === "queued" || (s === "new" && b.ball !== "you") ? " queuedc" : "") +
                (s === "done" ? " donec" : "") +
                (isMatch ? " match" : "") +
                (isTest ? " testc" : ""));
    const inner = h("div", "trowin");
    const omni = appendOmniRowArt(r, inner, b);
    const ttl = h("div", "ttl", b.title);
    inner.appendChild(ttl);
    const meta = h("div", "tmeta");
    meta.appendChild(h("span", "tage", busy ? spinGlyph(b.id, b) : s === "done" ? "done" : shortAge(b.agentTs)));
    // the tag is the lane's live truth, never a stored per-card value
    const ag = state.agents?.[b.owner];
    meta.appendChild(h("span", "teng", ag ? (ag.alive ? ag.name : "offline") : ""));
    inner.appendChild(meta);
    r.appendChild(inner);
    r.dataset.id = b.id;
    // a click on the folded corner unfolds the ticket and leaves the selection
    // where it is; anywhere else on the row opens the card
    r.addEventListener("click", e => { if (isTest && onFold(r, e)) unfoldTicket(b.id); else select(b.id); });
    pane.appendChild(r);
  }
  if (!pool.length) pane.appendChild(h("div", "tempty", view === "done" ? "no done chats yet" : view === "docked" ? "no docked chats yet" : view === "deferred" ? "no deferred chats yet" : "no open chats here"));
  pane.scrollTop = keepScroll;   // a rebuild must not throw away where the reader had scrolled
  // surviving rows glide to their new spots, the 220ms rise of the sister
  // board, instead of teleporting on every re-sort
  for (const row of pane.children){
    const was = row.dataset && oldPos[row.dataset.id];
    if (was == null) continue;
    const dy = was - row.getBoundingClientRect().top;
    if (Math.abs(dy) < 2) continue;
    row.style.transition = "none";
    row.style.transform = "translateY(" + dy + "px)";
    void row.offsetHeight;
    row.style.transition = "transform 220ms cubic-bezier(0.25, 1, 0.5, 1)";
    row.style.transform = "";
    row.addEventListener("transitionend", () => { row.style.transition = ""; }, { once: true });
  }
  // reveal a newly selected row only in the section on show, never in an
  // offscreen one, so the well is never scrolled to a card nobody can see
  if (selectedBefore !== selectedId && view === curView())
    pane.querySelector(".trow.on")?.scrollIntoView({ block: "nearest" });
}
function renderCarousel(state){
  const intent = enterAgain, heldView = intent && enterViewKey(intent.id);
  const followed = syncSentView(state);
  if (followed && intent?.id === followed && intent.active && intent.view === heldView)
    intent.view = enterViewKey(intent.id);
  const sheet = document.getElementById("tiksheet");
  const chips = document.getElementById("chips");
  const w = curWs(state);
  paintViewTabs();
  const lane = state.agents?.[activeOwner];
  const laneSig = lane ? lane.name + lane.alive : "";
  // every section is drawn, so the middle group is really there to be passed on a
  // two-section jump; each is its own group's pool
  if (sheet){
    for (const name of TICKET_VIEWS){
      const pane = sheet.querySelector('.tikpane[data-view="' + name + '"]');
      if (pane) paintTicketPane(pane, viewPoolFor(state, name), name, state, laneSig);
    }
    // place the sheet at the current section with no motion on a poll, the first
    // render or a project change; a tab press owns its own travel below
    if (tikTravelIntent == null && tikShownView !== curView()) moveTicketSheet(curView(), false);
  }
  const pool = viewPoolFor(state, curView());
  // chips spring up above the panel: green while its agent works, yellow
  // while the ticket awaits input; click jumps there
  // quirk kept: the claim and the ball alone gate a chip; bg does not open
  // one, but it turns an open chip green: work in flight outranks the ball
  // gate kept: the live claim (writing, not bg) and the ball alone open a chip,
  // a distinction the collapsed state can't draw. the color, though, is the one
  // state: green while working (a claim or a live bg job), else yellow
  const need = pool.filter(b => cardState(b) !== "done" && (b.writing || b.ball === "you"));
  const chipColor = b => queueState(b) === "working" ? "g" : "y";
  const csig = need.map(b => b.id + chipColor(b)).join(",");
  if (chips.dataset.sig !== csig){
    chips.dataset.sig = csig;
    chips.textContent = "";
    const MAXCHIPS = 8;
    for (const b of need.slice(0, MAXCHIPS)){
      const c = h("span", "chip " + chipColor(b));
      c.title = b.title;
      c.addEventListener("click", () => select(b.id));
      chips.appendChild(c);
    }
    if (need.length > MAXCHIPS){
      const rest = need.slice(MAXCHIPS);
      const c = h("span", "chip more", "+" + rest.length);
      c.title = rest.map(b => b.title).join("\n");
      c.addEventListener("click", () => select(rest[0].id));
      chips.appendChild(c);
    }
  }
  syncSpinner();
}

function ord(n){ return n + ({1:"st",2:"nd",3:"rd"}[n % 10 > 3 || [11,12,13].includes(n % 100) ? 0 : n % 10] || "th"); }

function age(ts){
  if (!ts) return "";
  const s = Date.now() / 1000 - ts;
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}

// ---- the reply chime ---------------------------------------------------------
// One soft two-note bell when a card turns to the reader's turn. The board's
// readings show that as a card's turnTs moving, the same event a phone is told
// about, so no card already waiting at load counts. The first reply rings at
// once and any reply in the next two minutes is silent, so a burst gives one
// chime. While this window is in front a reply on the project on screen is
// silent too, since it is in view; every other project rings, and with the
// window behind or hidden every project does. Chrome plays sound only after a
// click or key press, and a chime that cannot play is dropped, never held for
// later. The speaker on the bar mutes it. The choice is one of the board's
// settings, kept in settings.json like the background colour
const CHIME_MUTED_KEY = "chimemuted";
const CHIME_LAST_KEY = "chimelast";   // when a window of this browser last rang, so two windows do not both ring
const CHIME_GAP_MS = 2 * 60 * 1000;
const CHIME_VOLUME = 0.6;
let chimeCtx = null;
let chimeRang = 0;
let chimeTurns = new Map();   // card id -> the newest turnTs read for it
let chimeClock = 0;           // the board's clock at the newest reading
let chimeFirst = true;        // the first reading only sets the baseline

// the chosen sound: C5 then G5, pure sine, a soft 45 ms start, 0.91 s in all
function chimeBellRoundA(ctx, when, volume) {
  const out = ctx.createGain();
  out.gain.value = volume;
  out.connect(ctx.destination);
  const gap = 0.23, len = 0.66;
  [[523.25, 0], [783.99, gap]].forEach(function (n) {
    const start = when + n[1];
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = n[0];
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.24, start + 0.045);
    g.gain.exponentialRampToValueAtTime(0.0001, start + len);
    g.gain.linearRampToValueAtTime(0, start + len + 0.02);
    osc.connect(g); g.connect(out);
    osc.start(start); osc.stop(start + len + 0.03);
  });
  return gap + len + 0.02;
}

function chimeMuted(){ return settingsStore.getItem(CHIME_MUTED_KEY) === "1"; }
// the speaker as the store has it: read again on every reading, so a window that
// did not take the click shows the new state within a second
function chimeShowSpeaker(){
  const btn = document.getElementById("chimebtn");
  const on = String(!chimeMuted());
  if (btn.getAttribute("aria-pressed") === on) return;
  btn.setAttribute("aria-pressed", on);
  btn.title = on === "true" ? "Reply chime on. Click to mute." : "Reply chime muted. Click to unmute.";
}
document.getElementById("chimebtn").addEventListener("click", () => {
  if (chimeMuted()) settingsStore.removeItem(CHIME_MUTED_KEY);
  else settingsStore.setItem(CHIME_MUTED_KEY, "1");
  chimeShowSpeaker();
});
chimeShowSpeaker();

function chimeEnsure(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!chimeCtx && AC) chimeCtx = new AC();
    if (chimeCtx && chimeCtx.state !== "running") Promise.resolve(chimeCtx.resume()).catch(() => {});
  } catch (err) {}
}
for (const type of ["pointerdown", "click", "keydown"])
  addEventListener(type, () => { if (!chimeCtx || chimeCtx.state !== "running") chimeEnsure(); }, true);

function chimeRing(){
  const t = Date.now();
  let last = chimeRang;
  try { last = Math.max(last, Number(localStorage.getItem(CHIME_LAST_KEY)) || 0); } catch (err) {}
  if (last <= t && t - last < CHIME_GAP_MS) return;
  chimeEnsure();
  if (!chimeCtx || chimeCtx.state !== "running") return;
  try { chimeBellRoundA(chimeCtx, chimeCtx.currentTime + 0.03, CHIME_VOLUME); } catch (err) { return; }
  chimeRang = t;
  try { localStorage.setItem(CHIME_LAST_KEY, String(t)); } catch (err) {}
}

// whether any of these replies is one to ring for
function chimeWanted(turned){
  const front = document.visibilityState === "visible" && document.hasFocus();
  const phone = window.macPhoneHost?.current();
  const shown = phone ? (phone.home ? null : phone.owner) :
    (homeOpen || activeOwner === DRAFT ? null : activeOwner);
  return turned.some(b => !front || (b.owner || "facilitator") !== shown);
}

// every reading goes through here. A card seen before turned when its turnTs
// rose; a card new to the page turned when its turnTs is later than the board's
// clock at the reading before. The newest value is kept, so a reading that
// arrives late with older numbers changes nothing
function chimeWatch(state){
  chimeShowSpeaker();
  const turned = [], next = new Map();
  for (const b of state.boxes || []){
    const ts = Number(b.turnTs) || 0, was = chimeTurns.get(b.id);
    if (!chimeFirst && ts > (was === undefined ? (chimeClock || Infinity) : was)) turned.push(b);
    next.set(b.id, Math.max(ts, was || 0));
  }
  chimeTurns = next;
  chimeClock = Math.max(chimeClock, Number(state.now) || 0);
  chimeFirst = false;
  if (turned.length && !chimeMuted() && chimeWanted(turned)) chimeRing();
}

// The caret installs this callback below. If a data update actually moves or
// restyles the focused editor, hand that change to the same event-driven queue.
function focusedCaretContext(){
  const active = document.activeElement;
  if (!active || active === document.body) return null;
  const field = active.tagName === "TEXTAREA" ||
    (active.tagName === "INPUT" && (active.type === "text" || active.type === "search"));
  const editor = (field || active.isContentEditable) ? active : active.closest("[contenteditable]");
  if (!editor) return null;
  const r = editor.getBoundingClientRect(), cs = getComputedStyle(editor);
  return { editor, left: r.left, top: r.top, width: r.width, height: r.height,
    font: cs.font + "|" + cs.letterSpacing + "|" + cs.wordSpacing };
}
let queueFatCaret = () => {};
let pollFails = 0;
let pollSeq = 0;     // the readings asked for so far
let createSeq = 0;   // the newest of them when the last new card's answer came in
// the fetch and the render each get their own try. One try around both is
// what told the reader the server was unreachable when a card had failed to draw:
// three throws from anywhere in the render path raised pollFails to three and
// painted the banner over a server that was answering perfectly. The banner
// keeps its wording and its three strikes and now means what it says; a render
// that fails is reported and the board keeps polling, because one card that
// will not draw should not stop the rest.
async function poll(){
  noteDoing("poll");
  let state;
  const seq = ++pollSeq;
  // when this reading was asked for: a reading older than the board's answer to
  // a click made on this page knows nothing about that card and may not repaint
  // it. The phone's readings carry the same stamp for the same reason
  const asked = Date.now();
  try {
    state = await (await fetch("/state")).json();
    state.fetchedAt = asked;
  } catch (e) {
    if (++pollFails >= 3){   // the server itself, distinct from listener-offline
      document.body.classList.add("offline");
      document.getElementById("offline").textContent =
        "The facilitator server is unreachable. Nothing sent now will arrive; ask in the terminal to restart it.";
    }
    return;
  }
  pollFails = 0;
  // the board has answered: it is asked once about each message held on a card
  // that did not get through, so one that landed after all is not left as failed
  for (const el of [...Object.values(els), ...Object.values(miniEls)]) if (el.sentHeld && el.sentHeld.length) sentAskHeld(el);
  if (seq <= createSeq) return;   // asked before the last new card's answer came in (newCard)
  noteDoing("render");
  try {
    if (!validateActiveOwner(state)) return;
    // the reply chime reads the same reading, on its own try so a card that will
    // not draw cannot silence it and it cannot stop the draw
    try { chimeWatch(state); } catch (e) {
      if (typeof reportProblem === "function") reportProblem("error", e);
    }
    // the read marks and the bar's arrangement are the board's, so they ride
    // in on the state: taken in here, ahead of anything that draws from them,
    // and this browser's old copies handed over once on the first load
    seenSync(state);
    seedTabsOnce(state);
    seedSeenOnce(state);
    // and the settings, which have a revision of their own: another window's
    // arrangement is read when it moves, and used at the next tab switch or
    // reload, as it was when the browser kept them
    if (settingsStore.notice) settingsStore.notice(state.settingsRev);
    const caretBefore = focusedCaretContext();
    // a card this page is holding a click for is shown the way it was left, and
    // this reading's own word for it is kept aside to go back to
    holdFlags(state);
    if (!lastState) build(state);
    apply(state);
    lastState = state;
    P3_LANE = state.imagePanelLane || "";
    // the mount map decides which lane's reader is on screen, so a change to the
    // board's navigator lanes re-applies the layout to put a reader up or take one
    // down. the first reading always changes it from nothing, which is what shows
    // a configured reader at load without the reader revealing it by hand
    const fileNavSigWas = Object.entries(FILENAV_MOUNTS).map(([l, m]) => l + ":" + m.box).join(",");
    fileNavMounts(state.navigatorLanes);
    if (Array.isArray(state.navigatorLanes)) restoreOwnNavigatorOnce();
    const fileNavSigNow = Object.entries(FILENAV_MOUNTS).map(([l, m]) => l + ":" + m.box).join(",");
    if (ownerReady && fileNavSigNow !== fileNavSigWas) applySavedLayout();
    // the Spotify app id is machine-local and rides in on the state; when it
    // first arrives, redraw the stub so a configured board drops the create
    // prompt for the sign-in
    const spotWas = SPOT_ID;
    SPOT_ID = state.spotifyClientId || "";
    if (SPOT_ID !== spotWas) spotResetStub();
    const caretAfter = focusedCaretContext();
    if (caretBefore && caretAfter && caretBefore.editor === caretAfter.editor &&
        (caretBefore.left !== caretAfter.left || caretBefore.top !== caretAfter.top ||
         caretBefore.width !== caretAfter.width || caretBefore.height !== caretAfter.height ||
         caretBefore.font !== caretAfter.font)) queueFatCaret();
  } catch (e) {
    if (typeof reportProblem === "function") reportProblem("render", e);
  }
}

// scale the fixed 1440x900 stage to the largest that fits, centered
// the stage is a fixed 1440x900 design. these hold the transform actually on
// the stage right now, so the drag, resize and overlay math can turn screen
// pixels back into stage coordinates while the stage is scaled below 1:1.
const STAGE_W = 1440, STAGE_H = 900, STAGE_BAR = 41;
// Leave room between fitted content, including its soft shadows, and the rounded
// app frame instead of seating the lowest region directly on the frame line.
const FRAME_CLEAR = 16;
let stageScale = 1, stageTx = 0, stageTy = 0;
let respMode = "wide";
let phoneWanted = false;
let lastFitW = null;   // innerWidth at the last fit; a height-only resize keeps it
// the arrangeable regions, by id, used to measure how far the visible board
// actually reaches so the fit shrinks only as much as real content needs
const FIT_REGIONS = ["main", "clockbox", "rail", "tickets", "magic1", "magic2",
  "magic3", "magic4", "goalbox"];
// the two-pane split: the left plus middle group (time, tickets, player and the
// conversation) always shows; the right group only appears when the window is
// wide enough or by panning to it
const LEFT_MID_REGIONS = ["main", "clockbox", "rail", "tickets", "magic1"];
const RIGHT_REGIONS = ["magic2", "magic3", "magic4", "goalbox"];
// below this fit scale the whole board is no longer comfortably readable, so a
// narrower layout takes over. A small hysteresis band keeps the mode from
// flapping while the corner is dragged across the threshold.
const WIDE_FLOOR = 0.8, MODE_HYST = 0.04;
// the far right and foot of a set of visible regions, in stage-local design
// pixels. Hidden regions (visibility:hidden via region-off) and display:none
// regions do not count, so a board with no right column fits without their empty
// space, and a region a user dragged past the nominal canvas is still measured
// so it is not clipped. getBoundingClientRect is scaled, so divide by the scale
// on the stage right now to get design pixels.
function contentBounds(ids){
  const stage = document.getElementById("stage");
  const sr = stage.getBoundingClientRect();
  const S = stageScale || 1;
  let right = 1, bottom = 1, any = false;
  for (const id of (ids || FIT_REGIONS)){
    const el = id === "main" ? document.querySelector("main") : document.getElementById(id);
    // region-off is the per-tab hide. Do NOT test computed visibility: the stage
    // is visibility:hidden with a transition until layout-ready, and a region
    // read mid-transition would look hidden and drop out of the measurement even
    // though it keeps its layout box. display:none regions have a zero-size box
    // and fall out through the size check below.
    if (!el || el.classList.contains("region-off")) continue;
    if (getComputedStyle(el).display === "none") continue;
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) continue;
    any = true;
    right = Math.max(right, (r.right - sr.x) / S);
    bottom = Math.max(bottom, (r.bottom - sr.y) / S);
  }
  return { right, bottom, any };
}

// the inner edges the board must stay within, in screen pixels: the rounded app
// frame's own inner box (its border box less its border) pulled in by FRAME_CLEAR
// on the sides and bottom. The frame is fixed and inset from the window, so the
// window edges alone are the wrong bound: fitting to them lets the lowest region
// land on the window edge, past the frame line. When the frame is not measurable
// (before layout, or off the board) the window edges are the safe fallback.
function frameLimits(){
  const frame = document.getElementById("appframe");
  let left = 0, right = innerWidth, bottom = innerHeight;
  if (frame){
    const fr = frame.getBoundingClientRect();
    if (fr.width > 1 && fr.height > 1){
      const cs = getComputedStyle(frame);
      const bL = parseFloat(cs.borderLeftWidth) || 0;
      const bR = parseFloat(cs.borderRightWidth) || 0;
      const bB = parseFloat(cs.borderBottomWidth) || 0;
      left = fr.left + bL + FRAME_CLEAR;
      right = fr.right - bR - FRAME_CLEAR;
      bottom = fr.bottom - bB - FRAME_CLEAR;
    }
  }
  return { left, right, bottom };
}

// per project, which pane the two-pane view is showing. It is deliberately kept
// apart from the saved layout keys: it is a view offset, not an arrangement, so
// it never rewrites where a region lives.
function paneKey(){ return "pane." + activeOwner; }
function getPane(){ return localStorage.getItem(paneKey()) === "1" ? 1 : 0; }
function setPane(p){
  if (p) localStorage.setItem(paneKey(), "1"); else localStorage.removeItem(paneKey());
  document.body.classList.add("resp-panning");   // slide, do not jump, on a toggle
  clearTimeout(setPane._t);
  setPane._t = setTimeout(() => document.body.classList.remove("resp-panning"), 320);
  fitStage();
}
let respHasRight = false;

function fitStage(){
  if (!FOCUS) return;
  const stage = document.getElementById("stage");
  if (!stage) return;
  // fit inside the rounded app frame, not the raw window: the frame is inset from
  // every edge, so a region fitted to the window bottom lands past the frame line.
  const lim = frameLimits();
  const availH = lim.bottom - STAGE_BAR;   // room from the stage top to the frame's inner foot
  const availW = lim.right - lim.left;     // room across the frame's inner width
  // measure the real content extent with the card's foot-clearance clamp lifted,
  // so the clamp seatPagePill applies afterwards can never feed back into the
  // scale. The card is the one region whose box seatPagePill shortens.
  const card = document.querySelector("main");
  const savedMax = card ? card.style.maxHeight : "";
  if (card) card.style.maxHeight = "";
  const all = contentBounds(FIT_REGIONS);
  const leftMid = contentBounds(LEFT_MID_REGIONS);
  const rightGrp = contentBounds(RIGHT_REGIONS);
  if (card) card.style.maxHeight = savedMax;
  // a visible right region actually reaches past the left plus middle group; only
  // then is there something to pan to and an arrow to offer
  respHasRight = rightGrp.any && rightGrp.right > leftMid.right + 8;

  const heightScale = Math.min(1, availH / all.bottom);
  const prev = respMode;
  // The existing wide/two-pane fit remains the Mac's layout. The live phone
  // document covers it when the same portrait thresholds are crossed.
  const phone = MacPhoneView.portrait(innerWidth, innerHeight, leftMid.right, phoneWanted);
  phoneWanted = phone;
  window.macPhoneHost?.request(phone);
  const wideW = all.right * (WIDE_FLOOR + (prev === "wide" ? -MODE_HYST : MODE_HYST));
  respMode = respHasRight && innerWidth < wideW ? "twopane" : "wide";
  document.body.dataset.respMode = respMode;

  let scale, tx, ty;
  if (respMode === "twopane"){
    // near 6:5: keep the left plus middle group readable at a height-based scale
    // and expose a window over the same stage; the arrow pans it left or right.
    // Positions are never touched; this is purely a view transform.
    scale = Math.min(1, innerWidth / leftMid.right, heightScale);
    ty = Math.max(0, Math.min((availH - STAGE_H * scale) / 2, availH - all.bottom * scale));
    const pane = respHasRight ? getPane() : 0;
    // pane 0 shows the left plus middle from the left edge; pane 1 pans left so
    // the true right edge of the board sits at the window's right edge, which
    // keeps the conversation in the middle visible in both panes.
    tx = pane === 1 ? Math.min(0, innerWidth - all.right * scale) : 0;
  } else {
    // wide landscape: one uniform scale that fits the whole visible board inside
    // the usable window, never enlarged past 1:1. Fitting the actual content, not
    // the nominal 900px canvas, keeps a 1440x900 window at full size while still
    // showing every region after leaving fullscreen instead of clipping the foot.
    scale = Math.min(1, availW / all.right, availH / all.bottom);
    // center the whole 1440x900 canvas in the window (the frame is centered in the
    // window too), so a normal board does not shift sideways. availH reserves the
    // frame's inner bottom and the right edge is clamped to the frame too. Keep
    // the original zero translation floor so already-fitting content retains its
    // horizontal position instead of shifting by the frame inset.
    tx = Math.max(0, Math.min((innerWidth - STAGE_W * scale) / 2, lim.right - all.right * scale));
    ty = Math.max(0, Math.min((availH - STAGE_H * scale) / 2, availH - all.bottom * scale));
  }
  stageScale = scale; stageTx = tx; stageTy = ty;
  stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  lastFitW = innerWidth;
  // slide the window-wide star field so its phase matches the stage's origin
  document.body.style.backgroundPosition = tx + "px " + (STAGE_BAR + ty) + "px";
  applyRespNav();   // show or hide the pan arrow for the current mode and pane
  seatPagePill();   // the stage's foot has moved, and the pill sits against it
}

// The board fits on load, on entering focus, and whenever the WIDTH changes or
// the window enters or leaves fullscreen. A height-only resize is frozen on
// purpose: the user asked that nothing move or rescale when the window is only
// made shorter, even if that clips the board's foot, because Chrome cannot be
// stopped from shrinking the window and reacting to every height change looks
// worse than a stable board.
// A detected native fullscreen transition arms a short SETTLING window. Native
// macOS fullscreen animates the window to its final size over several frames,
// and the (display-mode: fullscreen) flip fires MID-animation, so a single fit
// on that flip lands on an intermediate height; the later final-height resize
// arrives at the SAME width (enter from a maximized window, or leave back to
// one, only changes height) and the width freeze below would drop it, leaving
// the board fitted to the wrong size until a reload or a width change (this
// exact ordering, dm-change at an intermediate height then a same-width resize
// to the final height, was captured on the real window). While the settle is
// armed, resizes refit even at constant width, and it stays armed until the size
// has stopped changing for FS_SETTLE_QUIET_MS or the FS_SETTLE_MAX_MS hard cap,
// then does one final authoritative fit and disarms. It is armed ONLY by a real
// fullscreen transition, so an ordinary vertical drag never triggers it and the
// height-only freeze still holds.
// FS_SETTLE_QUIET_MS is a bounded heuristic: a stretch with no size change is
// TREATED as the transition having settled. It does not read the OS animation
// clock, so the hard cap below is the real guarantee that the settle always ends.
const FS_SETTLE_QUIET_MS = 160;   // no size change for this long => treat as settled
const FS_SETTLE_MAX_MS = 1200;    // absolute upper bound on one transition's settling
let fsSettling = false;
let fsQuietTimer = 0, fsCapTimer = 0;
function fsSettleDisarm(){
  if (!fsSettling) return;
  fsSettling = false;
  clearTimeout(fsQuietTimer); clearTimeout(fsCapTimer);
  fitStage();   // final fit at the settled size
}
function fsSettleBumpQuiet(){
  clearTimeout(fsQuietTimer);
  fsQuietTimer = setTimeout(fsSettleDisarm, FS_SETTLE_QUIET_MS);
}
function fsSettleArm(){
  if (!fsSettling){
    fsSettling = true;
    clearTimeout(fsCapTimer);
    fsCapTimer = setTimeout(fsSettleDisarm, FS_SETTLE_MAX_MS);
  }
  fsSettleBumpQuiet();
  fitStage();   // fit to the current (possibly intermediate) size right away
}
function onViewportResize(){

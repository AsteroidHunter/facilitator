  return host;
}

async function spotPoll(){
  // one ask at a time: the quick follow ups after a press would otherwise
  // overlap the running one and answer out of order
  if (spotBusy) return;
  spotBusy = true;
  try {
    await spotAsk();
  } finally {
    spotBusy = false;
    spotSchedule();     // in the finally, so a thrown error can never end the loop
  }
}

async function spotAsk(){
  const host = spotBuild();
  if (!host || host.dataset.ready !== "1" || !host._sp) return;
  const el = host._sp;
  // /me/player rather than currently-playing: it still answers while playback
  // is paused, which is what stopped the panel going blank after a while.
  // additional_types=episode is what makes podcasts come back at all: without
  // it spotify answers with an empty item the whole time one is playing
  const r = await spotCall("/me/player?additional_types=episode");
  const item = r && r.item;
  const fresh = Date.now() < spotHold;   // a press just happened, keep its answer
  let t;
  if (item){
    // a podcast episode is a different shape from a song: the show stands in
    // for the artist and the cover hangs off the episode rather than an album
    const pod = item.type === "episode" || !!item.show;
    // spotify lists covers largest first: take the biggest, not the 64px thumb,
    // or it renders soft on a retina screen
    t = { id: item.id || null, name: item.name || "", kind: pod ? "episode" : "track",
          artist: pod ? (item.show?.name || "")
                      : (item.artists || []).map(a => a.name).join(", "),
          album: pod ? (item.show?.publisher || "") : (item.album?.name || ""),
          img: ((pod ? item.images : item.album?.images) || [])[0]?.url || "" };
    spotRemember(t);
    if (!fresh) spotState.playing = !!r.is_playing;
    spotState.dur = item.duration_ms || 0;
    spotState.progress = r.progress_ms || 0;
  } else {
    // the device went quiet and spotify stopped reporting a player at all. the
    // last track it named stays up instead of the panel wiping itself
    t = spotRecall();
    if (!fresh) spotState.playing = false;
    spotState.dur = 0;
    spotState.progress = 0;
  }
  if (!t){
    host.classList.add("empty");
    host.style.removeProperty("--sp-tint"); spotTintFor = null;   // back to the page's own white
    el.play.innerHTML = SPOT_ICON.play;
    spotState = { playing:false, id:null, kind:"track", shuffle:false, repeat:"off", saved:false, dur:0, progress:0 };
    return;
  }
  el.play.innerHTML = spotState.playing ? SPOT_ICON.pause : SPOT_ICON.play;
  spotPaint(host, el, t);
  // the heart: ask Spotify whether this one is already in the library. songs and
  // podcast episodes are two separate libraries with two separate endpoints
  if (t.id && t.id !== spotState.id){
    spotState.id = t.id;
    spotState.kind = t.kind || "track";
    const c = await spotCall(spotLib(t.kind) + "/contains?ids=" + t.id);
    spotState.saved = Array.isArray(c) ? !!c[0] : false;
  }
}
// no fixed interval: every poll books the next one itself, at a distance that
// depends on whether a song is running and how much of it is left
spotClaimCode().then(() => { spotBuild(); spotPoll(); });

// magic box 3: a picture panel an agent can fill. it writes a file called
// panel.<ext> into the tab's own project folder, in <lane dir>/<lane
// id>-internal/, and it shows up here. one picture per tab, so a plot drawn for
// one project never appears on another, and an agent working in that project
// never has to reach into this repo to show something. the server hands that
// folder over at /laneimg/<lane>/<file>. deleting the file empties the panel
// again. P3_LANE below is the one tab the panel belongs to. every other tab
// keeps the plain stub magic box 3 always was. this is the only place the name
// is written down, so moving the panel to another tab is a one word change here
const P3_LANE = "sketchbook";
const P3_EXT = ["png", "svg", "jpg", "jpeg", "gif", "webp"];
const P3_ICON = {
  // an axis with three bars, and a framed picture: the two things that belong here
  plot: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v17h17"/><path d="M8 17v-5M12.5 17V7.5M17 17v-7"/></svg>',
  image: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.6" cy="9.6" r="1.5"/><path d="M20.6 15.6l-4.8-4.6L4.6 19.4"/></svg>',
};
let p3For = null;    // the tab the panel is currently drawn for
let p3Ext = null;    // the extension that answered last time, tried first next time
let p3Src = null;    // and which of the two places it came from, for the same reason
let p3Size = -1;     // bytes of what is on screen, which is how a redrawn plot is spotted
let p3Url = null;    // the object url the img is holding, revoked when it is replaced
let p3Look = 0;      // polls counted, so the lane folder gets looked at now and then
                     // even while the pre-restart path is the one holding the panel up

function panelBuild(){
  const host = document.getElementById("magic3");
  if (!host || host.dataset.p3 === "1") return host;
  host.textContent = "";
  host.dataset.p3 = "1";
  const stub = h("div", "p3stub");
  stub.innerHTML = P3_ICON.plot + "<span>/</span>" + P3_ICON.image;
  const img = document.createElement("img");
  img.className = "p3img"; img.alt = ""; img.hidden = true;
  host.append(stub, img);
  host._p3 = { stub, img };
  return host;
}
function panelClear(host){
  if (!host || !host._p3) return;   // already taken apart by a tab switch
  p3Ext = null; p3Src = null; p3Size = -1;
  host._p3.img.hidden = true;
  host._p3.img.removeAttribute("src");
  if (p3Url){ URL.revokeObjectURL(p3Url); p3Url = null; }
  host._p3.stub.hidden = false;
  host.classList.remove("filled");
}
// back to the plain dashed box with its one line of text, marks and picture and
// every scrap of panel state dropped, so a tab that does not use the panel is
// left looking exactly as it did before the panel existed
function panelOff(host){
  if (!host || host.dataset.p3 !== "1") return;
  if (p3Url){ URL.revokeObjectURL(p3Url); p3Url = null; }
  p3For = null; p3Ext = null; p3Src = null; p3Size = -1;
  host._p3 = null;
  delete host.dataset.p3;
  host.classList.remove("filled");
  host.textContent = "magic box 3";
}
// every place this tab's picture could be, in the order they get tried: the
// lane's own internal folder first, all six extensions, and only after all of
// those come up empty the old uploads path
function panelSources(lane, sweep){
  const list = P3_EXT.map(ext => ({ src: "lane", ext,
    url: "/laneimg/" + encodeURIComponent(lane) + "/panel." + ext }));
  // PRE-RESTART PATH: the running server has no /laneimg route yet, so until it
  // is restarted this is the only place it can read a panel picture from. these
  // three lines can be deleted once the new route is live
  for (const ext of P3_EXT)
    list.push({ src: "uploads", ext,
      url: "/uploads/panel-" + encodeURIComponent(lane) + "." + ext });

async function panelPoll(){

  // panel file is ever asked for

  const host = panelBuild();
  if (!host || !host._p3) return;
  if (p3For !== activeOwner){ p3For = activeOwner; panelClear(host); }

  // full every fifth poll (20s), so the lane folder still wins in the end
  // without every poll paying for the whole list
  p3Look++;

  for (const cand of panelSources(activeOwner, sweep)){
    const r = await fetch(cand.url, { cache: "no-store" }).catch(() => null);
    // a switch away while the fetch was in the air took the panel apart behind
    // this poll: it is answering for the tab we just left, so it says nothing
    if (!host._p3) return;

    if (!host._p3) return;

    // else, so a panel that has not changed is never rebuilt and never blinks

// the clock face on a row, and the day word over a stamp: today, yesterday, the

function c3Time(ms){
  return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
function c3Day(ms){
  const d = new Date(ms), now = new Date();
  const startOf = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((startOf(now) - startOf(d)) / 86400000);
  if (days <= 0) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 7) return d.toLocaleDateString([], { weekday: "long" });

    year: d.getFullYear() === now.getFullYear() ? undefined : "numeric" });
}
// a line that is nothing but an uploaded picture's address is a picture, not

// it keep theirs, in the order they were written
function c3Blocks(text){
  const out = [];
  for (const line of String(text).split("\n")){
    const t = line.trim();
    if (/^\/uploads\/\S+$/.test(t)){ out.push({ shot: true, src: t }); continue; }
    const last = out[out.length - 1];
    if (last && !last.shot) last.text += "\n" + line;
    else out.push({ shot: false, text: line });
  }
  const kept = out.filter(b => b.shot || b.text.trim() !== "");
  return kept.length ? kept : [{ shot: false, text: String(text) }];
}
// the thread as one ordered list of things to draw: what the server is holding,

// so a message that has not moved keeps the very elements it is already in
function c3Events(){
  const out = [], seen = new Set();
  for (const m of c3Msgs){
    let key = m.kind + "|" + m.ts;
    while (seen.has(key)) key += "+";   // two lines on one tick, kept apart
    seen.add(key);
    // the transcript counts in seconds and everything here counts in ms
    out.push({ key, role: m.kind === "user" ? "user" : "agent",
               at: Math.round(m.ts * 1000), blocks: c3Blocks(m.text) });
  }
  for (const o of c3Out){
    const shots = (o.urls.length ? o.urls : o.shots.map(s => s.url))
      .map(src => ({ shot: true, src }));
    const blocks = shots.concat(o.text ? [{ shot: false, text: o.text }] : []);
    out.push({ key: "out|" + o.id, role: "user", at: o.at, out: o,
               blocks: blocks.length ? blocks : [{ shot: false, text: o.text }] });

// the pixels are asked for once. a picture that has just left the tray is
// already drawn under a blob address and its bubble reads from there; anything
// else comes off the server, wearing the grey face until it lands
function c3Img(src){

  const known = c3Shots.get(src);
  img.className = "waiting";
  // the real size, read off the blob before the send, holds the box open so
  // nothing under it jumps when the pixels arrive
  if (known && known.w){ img.width = known.w; img.height = known.h; }
  img.addEventListener("load", () => {
    img.classList.remove("waiting");
    if (c3Follow && performance.now() >= c3Air) c3Pin(true);
  });
  img.src = known ? known.src : src;

// a wrapper is refilled only when its own words or pictures changed, so a poll

function c3Fill(w, ev, anim){
  w.dataset.ts = String(ev.at);
  w.dataset.role = ev.role;
  const failed = !!(ev.out && ev.out.failed);
  const sig = JSON.stringify([ev.blocks, failed]);
  if (w.dataset.sig === sig) return;
  w.dataset.sig = sig;
  for (const gone of w.querySelectorAll(":scope > .c3row, :scope > .c3fail")) gone.remove();
  const time = c3Time(ev.at);
  let last = null;
  for (const b of ev.blocks){
    const row = h("div", "c3row " + ev.role);
    row.dataset.time = time;
    const msg = h("div", "c3msg " + ev.role + (b.shot ? " shot" : "") + (anim ? " anim" : ""));
    if (b.shot) msg.appendChild(c3Img(b.src));

    row.appendChild(msg);
    w.appendChild(row);
    last = row;

  w.classList.toggle("failed", failed);

    // hand it over again. without this it would sit there for good, and
    // throwing it away by itself is the one thing this panel must not do
    const again = () => {
      if (!ev.out.failed) return;
      ev.out.failed = false; c3Save(); c3Sig = ""; chatDraw(true); chatPost(ev.out);
    };

// one pass over what is on screen: which bubbles belong to a run, and where the
// hour stamps go. both are derived rather than tracked, so the answer is the
// same however the messages arrived
function c3Decorate(list){
  let prevSide = null, prevAt = 0, lastStamp = 0;
  for (const w of list.querySelectorAll(":scope > .c3evt")){
    const rows = w.querySelectorAll(":scope > .c3row");
    let stamp = w.querySelector(":scope > .c3stamp");
    if (!rows.length){ if (stamp) stamp.remove(); continue; }
    const at = Number(w.dataset.ts || 0);
    const role = w.dataset.role || "agent";
    if (at - lastStamp > C3_STAMP_GAP){
      if (!stamp) stamp = h("div", "c3stamp");
      if (stamp.dataset.at !== String(at)){
        stamp.dataset.at = String(at);
        stamp.replaceChildren(h("b", null, c3Day(at)), " " + c3Time(at));
      }
      if (w.firstElementChild !== stamp) w.prepend(stamp);
      lastStamp = at;
    } else if (stamp) stamp.remove();
    for (const row of rows){
      const cont = (role === "user" || role === "agent") &&
                   role === prevSide && at - prevAt < C3_RUN_GAP;
      row.classList.toggle("cont", cont);
      prevSide = role === "system" ? null : role;
      prevAt = at;
    }

// the receipt's word, changed behind a fade so the change itself is never on

// every transition off under reduced motion, and an end that never comes would
// leave the word invisible for good
function c3Word(rc, word){
  const span = rc.firstElementChild;
  rc.hidden = !word;
  if (!word) return;
  if ((rc.dataset.next || span.textContent) === word) return;
  if (!span.textContent){ span.textContent = word; return; }
  rc.dataset.next = word;
  span.classList.add("rc-hide");
  setTimeout(() => {
    span.textContent = rc.dataset.next || span.textContent;
    delete rc.dataset.next;
    span.classList.remove("rc-hide");

function chatDraw(instant){

  const writing = !!(card && card.writing);

  const heard = !!(lastState && ((lastState.listening || {})[C3_OWNER] ||
                                 (lastState.busy || {})[C3_OWNER]));

  // the list is reconciled, never rebuilt. a message already on screen keeps
  // the element it is in, so a poll cannot lose his scroll position, cut an
  // animation short, or throw away pixels that have already arrived
  const have = new Map();
  for (const w of list.querySelectorAll(":scope > .c3evt")) have.set(w.dataset.key, w);
  const want = new Set(evs.map(e => e.key));
  let cursor = list.firstElementChild, born = false;
  for (const ev of evs){
    let w = have.get(ev.key);
    const fresh = !w;

    // whatever the cursor is standing on lands in the right seat either way

  // is a fade, and an element built fresh each poll has nothing to fade from

  if (writing && !el.typing){
    el.typing = h("div", "c3typing");

  let unanswered = 0;

function c3Pin(now){

// the jump disc shows only after the scrolling has been still for four seconds
// while away from the bottom, and never because something landed down there.
// once it is up it stays up until the bottom is reached, which puts it away and
// clears the window
function c3Jump(atBottom){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const jump = host._c3.jump;
  if (c3Still){ clearTimeout(c3Still); c3Still = null; }
  if (atBottom){ jump.classList.remove("show"); return; }
  if (jump.classList.contains("show")) return;
  c3Still = setTimeout(() => { c3Still = null; jump.classList.add("show"); }, C3_STILL);
}
// the ↑ is there when there is something to send and gone when there is not
function c3Refresh(){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const el = host._c3;
  el.send.classList.toggle("show", el.ta.value.trim().length > 0 || c3Files.length > 0);
}
// one line, growing to the cap and then scrolling inside itself. the pill's
// live height is published for the jump disc, which seats itself off it, so the
// same air sits above the pill at one line and at the cap alike
function c3Autosize(){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const el = host._c3;
  el.ta.style.height = "auto";
  el.ta.style.height = Math.min(el.ta.scrollHeight, C3_CAP) + "px";
  host.style.setProperty("--c3-field-h", el.field.offsetHeight + "px");
  if (c3Follow && performance.now() >= c3Air) c3Pin(true);
}
// a picked picture is staged once and kept. the tray used to be rebuilt on
// every change, which handed a photo it had already drawn a fresh blank
// element; its size is read off the blob here, before the send, so the bubble's
// box can be reserved
function c3Pick(files){
  for (const f of files || []){
    if (c3Picks.has(f) || !/^image\//.test(f.type)) continue;
    const url = URL.createObjectURL(f);
    const wrap = h("div", "c3thumb");
    const img = document.createElement("img");
    const x = h("button", "c3thumb-x", "✕");
    x.title = "take it back out";
    x.addEventListener("click", () => {
      c3Files = c3Files.filter(g => g !== f);
      c3Tray(); c3Refresh();
    });
    wrap.append(img, x);
    const pick = { url, w: 0, h: 0, wrap, taken: false };
    const probe = new Image();
    probe.addEventListener("load", () => {
      pick.w = probe.naturalWidth; pick.h = probe.naturalHeight;
    });
    probe.src = url;
    img.src = url;
    c3Picks.set(f, pick);
    c3Files.push(f);
  }
  c3Tray(); c3Refresh();
}
function c3Tray(){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const box = host._c3.pend;
  for (const [f, p] of c3Picks){
    if (c3Files.includes(f)) continue;
    c3Picks.delete(f);
    p.wrap.remove();
    // a picture the send took has handed its address to the thread; pulling
    // that back would empty the bubble it is drawn in
    if (!p.taken) URL.revokeObjectURL(p.url);
  }
  for (const f of c3Files){
    const p = c3Picks.get(f);
    if (p && p.wrap.parentElement !== box) box.appendChild(p.wrap);
  }
  box.classList.toggle("on", c3Files.length > 0);
}
// what the thread actually lays out. the wrappers are laid out as nothing, so
// their own children are what moves: rows, stamps, the receipt, the dots.
// walked newest first and bounded, because the glide is a tail affair
function c3LaidOutTail(list){
  const out = [];
  for (let n = list.lastElementChild; n && out.length < C3_SHIFT_MAX; n = n.previousElementSibling){
    if (n.classList.contains("c3evt")){
      for (let i = n.children.length - 1; i >= 0 && out.length < C3_SHIFT_MAX; i--) {
        out.push(n.children[i]);
      }
    } else out.push(n);
  }
  return out;
}
// the older content glides up over the flight's own beat. without it the
// instant pin teleports everything above the new bubble upward while the bubble
// itself is still down at the typing box, and a bare strip stands between the
// two for the whole flight
function c3ShiftBegin(list){
  const eligible = c3Follow || c3AtBottom(list);
  const before = new Map();
  if (eligible) for (const n of c3LaidOutTail(list)) before.set(n, n.getBoundingClientRect().top);
  return function play(carriers){
    if (!eligible) return;
    const view = list.getBoundingClientRect();
    for (const n of c3LaidOutTail(list)){
      const was = before.get(n);
      if (was === undefined){
        // born with this send. the flying rows belong to the flight and a
        // second treatment would fight it; anything else, which in practice is
        // the stamp a new hour just opened, fades up on the same beat
        if (!carriers.has(n)){
          n.animate([{ opacity: 0, transform: "translateY(10px)" },
                     { opacity: 1, transform: "none" }],
                    { duration: C3_FLIGHT, easing: C3_EASE });
        }
        continue;
      }
      const now = n.getBoundingClientRect();
      const d = was - now.top;
      // only a row that moved up, and only one whose path crosses the thread's
      // own box: the rest would travel where nobody can see them
      if (d <= .5 || now.bottom + d <= view.top || now.top >= view.bottom) continue;
      n.animate([{ transform: "translateY(" + d + "px)" }, { transform: "none" }],
                { duration: C3_FLIGHT, easing: C3_EASE });
    }
  };
}
// his own bubble does not pop, it flies: it lays out in its final seat, is
// carried back to the box the words were typed in, and let go. the web
// animations api rather than a transition, so the start state lives inside the
// animation itself and the two style writes can never be folded into one
function c3Fly(w, field){
  const start = field.getBoundingClientRect();
  let last = null;
  for (const msg of w.querySelectorAll(".c3msg")){
    const end = msg.getBoundingClientRect();
    last = msg.animate([
      { transform: "translate(" + (start.right - end.right) + "px, " +
                                  (start.top - end.top) + "px)" },
      { transform: "none" },
    ], { duration: C3_FLIGHT, easing: C3_EASE });
  }
  // a translate hangs past the thread's bottom edge and the scroll height
  // counts it, so nothing may re-pin while it is up. this is the one pin that
  // owes the bottom whatever grew underneath it in the meantime
  c3Air = performance.now() + C3_FLIGHT;
  if (last) last.finished.then(() => { if (c3Follow) c3Pin(true); }, () => {});
}
async function chatFetch(){
  try {
    const r = await fetch("/thread?box=" + C3_BOX + "&n=60", { cache: "no-store" });
    const j = await r.json();
    if (Array.isArray(j.messages)) c3Msgs = j.messages;
  } catch (e) {}
}
// the pictures go up first, one at a time, and each address the server hands
// back goes into the message on a line of its own. the words follow them, so
// the thread draws the pictures above the line they were sent with. nothing new
// was needed on the server for this: /upload has been there for dropped images
async function c3Upload(out){
  if (out.urls.length || !out.files.length) return true;
  const urls = [];
  for (let i = 0; i < out.files.length; i++){
    const f = out.files[i];
    const r = await fetch("/upload?name=" + encodeURIComponent(f.name || "picture"),
                          { method: "POST", body: f });
    if (!r.ok) return false;
    const j = await r.json();
    if (!j || !j.url) return false;
    urls.push(j.url);
    // the pixels are already in the page at the blob address the tray drew them
    // at, so the bubble goes on reading from there and never blinks
    const s = out.shots[i];
    if (s) c3Shots.set(j.url, { src: s.url, w: s.w, h: s.h });
  }
  out.urls = urls;
  return true;
}
async function chatPost(out){
  let ok = false;
  try {
    if (await c3Upload(out)){
      const body = out.urls.concat(out.text ? [out.text] : []).join("\n");
      ok = (await fetch("/send?box=" + C3_BOX, { method: "POST", body })).ok;
    }
  } catch (e) { ok = false; }
  if (ok){
    // /send writes the line to the transcript before it answers, so the very
    // next read of the thread already holds it and the stand-in can go
    await chatFetch();
    // unless the bubble is still in the air: the server's copy takes its seat
    // only once it has landed, or the swap would cut the flight off midway
    const left = c3Air - performance.now();
    if (left > 0) await new Promise(r => setTimeout(r, left));
    const i = c3Out.indexOf(out);
    if (i >= 0) c3Out.splice(i, 1);
  } else {
    out.failed = true;   // it never reached the board. say so, and keep the words
  }
  c3Save(); c3Sig = ""; chatDraw(true);
}
async function chatSend(){
  const host = document.getElementById("magic3");
  if (!host || !host._c3) return;
  const el = host._c3;
  const text = el.ta.value.trim();
  const files = c3Files.slice();
  if (!text && !files.length) return;
  el.ta.value = "";
  c3Autosize();
  // the pictures leave the tray marked as taken, so their blob addresses stay
  // alive for the bubble that is about to be drawn with them
  const shots = files.map(f => c3Picks.get(f)).filter(Boolean);
  for (const p of shots){ p.taken = true; c3Shots.set(p.url, { src: p.url, w: p.w, h: p.h }); }
  c3Files = [];
  c3Tray(); c3Refresh();
  // on screen before the request leaves, at full strength, and it stays there
  // until the thread comes back holding it: there is no moment where his words
  // are nowhere
  const out = { id: c3Id(), at: Date.now(), text, failed: false, files,
                shots: shots.map(p => ({ url: p.url, w: p.w, h: p.h })), urls: [] };
  const list = el.msgs;
  const shift = c3ShiftBegin(list);
  c3Out.push(out);
  c3Save(); c3Sig = "";
  c3Follow = true;         // sending snaps him back to the tail
  chatDraw(true);          // the instant pin lands first; the motion plays over it
  const w = list.querySelector('.c3evt[data-key="out|' + out.id + '"]');
  shift(new Set(w ? w.querySelectorAll(":scope > .c3row") : []));
  if (w) c3Fly(w, el.field);
  el.send.disabled = true;   // no double fire while the network work runs
  try { await chatPost(out); } finally { el.send.disabled = false; }
}
async function chatPoll(){
  // one tab's thing only, the same rule the picture panel above follows
  if (activeOwner !== C3_LANE){ chatOff(document.getElementById("magic3")); return; }
  const host = chatBuild();
  if (!host || !host._c3) return;
  if (c3For !== activeOwner){ c3For = activeOwner; c3Sig = ""; }
  await chatFetch();
  if (!host._c3) return;   // a tab switch took the chat apart while that was in the air
  chatDraw();
}
chatPoll(); setInterval(chatPoll, C3_POLL);

// the picture, clicked, grows out of the panel until it fills the screen over a
// dark veil, and shrinks back into the panel on the next click outside it or on
// Escape. the thing that grows is the panel's own img, carried into the layer
// and carried back after, not a copy: the poll above keeps swapping its src
// underneath, so a plot redrawn while it is open simply appears, and there is
// never a second object url in the room to be leaked
// 300ms on the board's own curve, the one the tabs glide on. that curve is quick
// off the mark and settles rather than stops, which is how a real object arrives;
// 220 is right for a tab sliding one tab's width, and this crosses the whole
// screen, so it gets the extra 80. past about 400 a zoom starts to feel slow
const P3_ZOOM_MS = 300;
const P3_ZOOM_EASE = "cubic-bezier(0.25, 1, 0.5, 1)";
const P3_ZOOM_PAD = 56;   // air left around the picture, so it never touches an edge
// how dark the veil ends up. it used to live in the veil's own colour as an
// alpha and the fade ran to a plain 1; it is the fade's end point now so the
// colour can be opaque, which is what keeps the veil off the raster threads.
// the stylesheet above says why at length. the two have to agree: this number
// and the alpha that was in that colour are the same .62
const P3_VEIL_ALPHA = 0.62;
let p3Zoom = null;        // what is open, and null whenever nothing is

// the layer, built the first time a picture is opened and kept afterwards
function p3Layer(){
  let layer = document.getElementById("p3zoom");
  if (layer) return layer;
  layer = h("div");
  layer.id = "p3zoom";
  layer.appendChild(h("div", "p3veil"));
  document.body.appendChild(layer);
  // anywhere that is not the picture itself puts it back, which is the whole
  // screen minus the picture, veil and margin alike
  layer.addEventListener("click", e => { if (e.target !== p3Zoom?.img) p3ZoomClose(); });
  return layer;
}
// where a picture of this shape sits inside a box of that shape, centred and
// letterboxed: object-fit paints it this way inside the panel, so this is the
// rectangle the eye sees, and the eye is what has to be moved
function p3Fit(img, x, y, bw, bh){
  const nw = img.naturalWidth || bw, nh = img.naturalHeight || bh;
  const s = Math.min(bw / nw, bh / nh);
  const w = nw * s, h2 = nh * s;
  return { x: x + (bw - w) / 2, y: y + (bh - h2) / 2, w, h: h2 };
}
// the panel's inside, read off the panel itself rather than off the picture, so
// it still answers while the picture is away in the layer
function p3PanelRect(img){
  const host = document.getElementById("magic3");
  if (!host) return null;
  const r = host.getBoundingClientRect(), cs = getComputedStyle(host);
  const pl = parseFloat(cs.paddingLeft) || 0, pt = parseFloat(cs.paddingTop) || 0;
  const bw = host.clientWidth - pl - (parseFloat(cs.paddingRight) || 0);
  const bh = host.clientHeight - pt - (parseFloat(cs.paddingBottom) || 0);
  if (bw <= 0 || bh <= 0) return null;
  return p3Fit(img, r.x + (parseFloat(cs.borderLeftWidth) || 0) + pl,
    r.y + (parseFloat(cs.borderTopWidth) || 0) + pt, bw, bh);
}
// the screen less its margin. the margin shrinks with the window so a small one
// still gets a big picture
function p3ScreenRect(img){
  const pad = Math.min(P3_ZOOM_PAD, innerWidth * 0.06, innerHeight * 0.06);
  return p3Fit(img, pad, pad, innerWidth - pad * 2, innerHeight - pad * 2);
}
function p3ZoomPlace(img, r){
  img.style.left = r.x + "px"; img.style.top = r.y + "px";
  img.style.width = r.w + "px"; img.style.height = r.h + "px";
}
const p3ZoomStill = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function p3ZoomOpen(img){
  if (p3Zoom || !img.naturalWidth) return;
  const from = p3PanelRect(img);
  if (!from) return;
  const layer = p3Layer();
  layer.classList.add("on");
  // the mark the rest of the board reads to get out of the way of the moving
  // picture. it sits here, after the panel has been measured and with the rest
  // of the writes, so the one rule that answers it lands in the same style pass
  // as the layer itself and no second one is asked for
  document.body.classList.add("p3zoom");
  layer.appendChild(img);   // the panel's own picture, lifted out whole
  const to = p3ScreenRect(img);
  p3ZoomPlace(img, to);
  p3Zoom = { img, to, veil: layer.querySelector(".p3veil"), closing: false };
  // it is already at full size now; the transform below carries it back to the
  // panel's rectangle and lets go, which is what lands it back exactly rather
  // than a hair off
  const ms = p3ZoomStill() ? 0 : P3_ZOOM_MS;
  p3Zoom.anim = img.animate([{ transform: p3ZoomInvert(from, to) }, { transform: "none" }],
    { duration: ms, easing: P3_ZOOM_EASE, fill: "both" });
  p3Zoom.veilAnim = p3Zoom.veil.animate([{ opacity: 0 }, { opacity: P3_VEIL_ALPHA }],
    { duration: ms, easing: P3_ZOOM_EASE, fill: "both" });
  // a picture swapped in while this one is open takes the screen at its own
  // shape instead of sitting inside the shape of the one it replaced
  img.addEventListener("load", p3ZoomRefit);
}
// the transform that puts a picture placed at `to` back over `from`. one scale
// for both axes: both rectangles are the picture's own shape, so nothing skews
function p3ZoomInvert(from, to){
  return "translate(" + (from.x - to.x) + "px, " + (from.y - to.y) + "px) scale("
    + (from.w / to.w) + ")";
}
function p3ZoomRefit(){
  const z = p3Zoom;
  if (!z || z.closing || z.anim.playState === "running") return;
  z.to = p3ScreenRect(z.img);
  p3ZoomPlace(z.img, z.to);
}
function p3ZoomClose(){
  if (!p3Zoom || p3Zoom.closing) return;
  const z = p3Zoom;
  z.closing = true;
  z.img.removeEventListener("load", p3ZoomRefit);
  // measured now rather than remembered from the click, so a panel that moved,
  // or a picture that changed shape while it was open, is still caught exactly
  const back = p3ZoomInvert(p3PanelRect(z.img) || z.to, z.to);
  // caught halfway out it turns around from where it is, and takes only the time
  // it has already spent to get home, so an accidental click does not drag.
  // both of the shrink's starting values have to be read here, above the two
  // cancels: cancelling an animation drops the computed value straight back to
  // what the stylesheet says, and the sheet says the veil is 0, so a veil read
  // after the cancel starts the fade at 0 and the dark goes in a single frame
  const held = getComputedStyle(z.img).transform;
  const heldVeil = getComputedStyle(z.veil).opacity;
  const part = z.anim.playState === "running"
    ? Math.max(0.4, (z.anim.currentTime || 0) / P3_ZOOM_MS) : 1;
  const ms = p3ZoomStill() ? 0 : P3_ZOOM_MS * part;
  z.anim.cancel(); z.veilAnim.cancel();
  z.anim = z.img.animate([{ transform: held }, { transform: back }],
    { duration: ms, easing: P3_ZOOM_EASE, fill: "both" });
  z.veilAnim = z.veil.animate([{ opacity: heldVeil }, { opacity: 0 }],
    { duration: ms, easing: P3_ZOOM_EASE, fill: "both" });
  z.anim.onfinish = () => {
    z.anim.cancel(); z.veilAnim.cancel();
    z.img.style.cssText = "";
    const host = document.getElementById("magic3");
    // home only if the panel still wants it: a tab switched while it was open
    // has already thrown this picture away and built itself a fresh one
    if (host && host._p3 && host._p3.img === z.img) host.appendChild(z.img);
    else z.img.remove();
    document.getElementById("p3zoom").classList.remove("on");
    // last, and only here: the player's glass comes back after the shrink has
    // landed and the veil is already gone, so nothing of it is on screen while
    // the picture is still moving
    document.body.classList.remove("p3zoom");
    p3Zoom = null;
  };
}
// the click that opens it, delegated: the panel builds and unbuilds its picture
// on its own schedule and this never has to be hung on the new one
document.addEventListener("click", e => {
  if (editMode || squelchClick) return;   // in edit mode a press on a box is a drag, not this
  const img = e.target.closest?.("#magic3.filled .p3img");
  if (img) p3ZoomOpen(img);
});
// Escape is the way out that does not depend on the clicking working. capture,
// so nothing else on the board gets to answer it while a picture is open
addEventListener("keydown", e => {
  if (e.key !== "Escape" || !p3Zoom) return;
  e.preventDefault(); e.stopPropagation();
  p3ZoomClose();
}, true);

// magic box 2: a small copy of this tool's own cards, always the facilitator
// lane's whatever project tab is open, so a thought can go to the facilitator
// agent without leaving the tab you are in. same title, reply and composer a
// real card has; the grey summary strip is deliberately left out
const miniEls = {};
// the card it sits on is kept across reloads, per project tab, so a reload does
// not always drop you back on the first card of the list. the open tab is
// stored under "activeproj", so this follows that naming with the lane on the end
const miniKey = () => "minibox." + activeOwner;
let miniId = localStorage.getItem(miniKey()) || null;   // the one card magic box 2 is showing
let miniOrder = [];       // the cards it can walk through, board order
let miniFocused = false;  // clicked into: the arrows and command T are ours

// every move through the small card is written down, so the next load starts
// where this one left off. a remembered card that has gone, been closed or been
// deferred is simply not in miniOrder any more, and the fallback in the render
// writes the first card over it
function miniGo(id){
  miniId = id;
  if (id) localStorage.setItem(miniKey(), id);
  else localStorage.removeItem(miniKey());
}

function miniStep(dir, opts){
  opts = opts || {};
  if (!miniOrder.length) return;
  const at = miniOrder.indexOf(miniId);
  miniGo(miniOrder[((at < 0 ? 0 : at) + dir + miniOrder.length) % miniOrder.length]);
  if (lastState) renderMiniCards(lastState);
  // the card being left is hidden by the render above, and hiding the box the
  // caret sits in drops the caret on the page body. the large card's pair
  // leaves you typing in the card you arrive at, so put it back by hand. after
  // the render, because the render is what moves and hides the boxes
  if (opts.focus) miniEls[miniId]?.ta?.focus();
}
let miniEditPending = null;   // name the card as soon as it has been drawn
async function miniCreate(){
  const r = await fetch("/create?owner=facilitator", { method: "POST" })
    .then(x => x.json()).catch(() => null);
  if (r?.id){ miniGo(r.id); miniEditPending = r.id; }
  poll();
}
// renaming in place, the same shape as the large card's: a click edits where you
// click, arriving any other way selects the whole name, Enter drops into the
// message field, Escape puts the old name back, and leaving it commits
function miniEditTitle(id, opts){
  opts = opts || {};
  const el = miniEls[id]; if (!el) return;
  const t = el.title, old = t.textContent;
  t.setAttribute("contenteditable", "plaintext-only");
  if (old === "\u2026") t.textContent = "";
  if (!opts.fromClick){
    t.focus();
    if (t.textContent){
      const range = document.createRange();
      range.selectNodeContents(t);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    }
  }
  const end = () => { t.removeAttribute("contenteditable"); t.onkeydown = null; t.onblur = null; };
  const commit = () => {
    const name = t.textContent.trim();
    end();
    if (name && name !== old){
      t.textContent = name;
      fetch("/title?box=" + encodeURIComponent(id), { method: "POST", body: name })
        .then(() => poll()).catch(() => {});
    } else if (!name && !old){
      fetch("/title?box=" + encodeURIComponent(id), { method: "POST" })
        .then(() => poll()).catch(() => {});
    } else t.textContent = old;
  };
  t.onkeydown = e => {
    e.stopPropagation();   // the card-walking keys must not fire while naming
    if (e.key === "Enter"){ e.preventDefault(); commit(); el.ta?.focus(); }
    else if (e.key === "Escape"){
      if (!old && !t.textContent.trim()) commit();
      else { end(); t.textContent = old; }
      el.ta?.focus();
    }
  };
  t.onblur = () => { if (t.isContentEditable) commit(); };
}
// clicking anywhere inside magic box 2 hands it the keys; clicking anywhere
// else hands them back to the board
addEventListener("mousedown", e => {
  const inside = !!(e.target.closest && e.target.closest("#magic2"));
  if (inside === miniFocused) return;
  miniFocused = inside;
  document.getElementById("magic2")?.classList.toggle("mfocus", inside);
  // exactly one of the two stands up: the large card settles while the small
  // card is holding the keys
  document.body.classList.toggle("minifocus", inside);
}, true);
// capture, so these never reach the board's own arrow and delete handling
addEventListener("keydown", e => {
  if (!miniFocused) return;
  if (e.metaKey && (e.key === "t" || e.key === "T")){
    e.preventDefault(); e.stopPropagation();
    miniCreate();
    return;
  }
  const t = document.activeElement;
  const typing = t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable);
  // control+shift+left/right is the board's card switcher, and the whole point
  // of that pair is that it still works with the cursor sitting in a text box.
  // the small card takes the same pair while it holds the keys, or the habit
  // falls through and quietly walks the large card behind it instead.
  // up and down are deliberately not listed: those stay the board's
  const switcher = e.ctrlKey && !e.metaKey && e.shiftKey;
  if (typing && !switcher) return;   // plain arrows belong to the caret while typing
  if (e.key === "ArrowLeft" || e.key === "ArrowRight"){
    e.preventDefault(); e.stopPropagation();
    // typing when the pair was pressed means the caret was in a text box, so it
    // belongs in the next card's text box. arriving from anywhere else leaves
    // focus where it was rather than pulling it into a composer uninvited
    miniStep(e.key === "ArrowRight" ? 1 : -1, { focus: typing });
  }
}, true);

          // via=mini says this was typed in the small card. The big card sends

          // server can hold a small card answer to a small card's worth of room
          const r = await fetch("/send?box=" + encodeURIComponent(b.id) + "&via=mini", { method: "POST", body: text });
          if (r.ok){ ta.value = ""; ta.style.height = "auto"; poll(); }
        } catch (e) {} finally { send.disabled = false; }
      };
      send.addEventListener("click", fire);
      // the board's own arrow and delete keys must never see this typing
      ta.addEventListener("keydown", e => {

      });

    // the small card carries the short half; the large card carries the normal
    // one. raw stays the whole reply so the check still sees every change
    if (el.reply.dataset.raw !== (b.reply || "")){
      el.reply.dataset.raw = b.reply || "";

    if (el.pend.dataset.raw !== pt){

      const stamps = b.pendingStamps || [];
      el.pend.innerHTML = (b.pendingTexts || [])
        .map((t, i) => {
          const body = linkify(imgify(t.replace(/&/g, "&amp;").replace(/</g, "&lt;")));

        }).join("");

    if (!live.has(id)){ miniEls[id].box.remove(); delete miniEls[id]; }

  // fight a composer that is being typed into
  const order = cards.map(b => b.id).join(",");
  if (list.dataset.order !== order){
    list.dataset.order = order;
    for (const b of cards) list.appendChild(miniEls[b.id].box);

  // and moving a node that holds the caret blurs it, which would commit the
  // rename the instant it opened
  if (miniEditPending && miniEls[miniEditPending] && miniEditPending === miniId){
    const id = miniEditPending;
    miniEditPending = null;
    miniEditTitle(id);
  }
}

function cardState(b){
  // the server now computes one authoritative state per card; the inline
  // version stays only as a fallback for an older server that omits it
  const s = b.state || (
         b.done ? "done"
       : b.parked ? "parked"
       : (b.writing || b.bg) ? "working"
       // a card with prior replies was answered before, so it is never new even when a seeded board left its agent stamp at 0
       : (!b.agentTs && !b.pending && !b.replies) ? "new"
       : b.ball === "you" ? "yours"
       : "queued");
  // a message of his still sitting in the queue is waiting on the agent, not
  // on him, so the card rests grey. an older reply can leave the ball on his
  // side while a newer message is still in line, and that used to paint the
  // card yellow. only yours is rewritten, so done, parked and every green
  // state keep exactly the state they had
  return (s === "yours" && b.pending > 0) ? "queued" : s;
}
// the queue panel's view: a parked card sorts and colors as if open. state is
// nulled in the copy so cardState recomputes from the flags instead of handing
// back the server's "parked" when we peel the park off
function queueState(b){ return b.parked ? cardState({ ...b, parked: false, state: null }) : cardState(b); }
// the strict await of the bar count and auto-select: pending vetoes it, and
// so does work in flight, claimed or registered; green outranks the ball
function awaitsYou(b){
  const s = cardState(b);
  // done/parked and work-in-flight are all folded into the state; a still-new
  // card only awaits you when the ball sits with you, and pending vetoes the
  // strict await either way
  return (s === "yours" || (s === "new" && b.ball === "you")) && !(b.pending > 0);
}

// ---- the carousel: the workspace's other chats as a queue -----------------
// Front: chats the agent has addressed (yellow), newest first. Back: chats
// answered and waiting on the agent (green), the just-answered one last.
// the doing, deferred and done tabs are a filter over that same pool. the left
// list and the arrow keys have to walk the same set, or the arrows cycle into
// cards the list is not showing
function viewFilter(b){
  const s = cardState(b);
  return ticketView === "done" ? s === "done"
       : ticketView === "deferred" ? s === "parked"
       : (s !== "done" && s !== "parked");
}
function viewPool(state){ return poolOf(state).filter(viewFilter); }

function poolOf(state){
  const w = curWs(state);
  return state.boxes.filter(b =>
    b.owner === activeOwner && b.id !== "q" && (!w || b.ws === w.id))
    .sort((a, b) => {
      // an untouched new card stays on top; the first send drops it into the
      // waiting group; anything green (in progress) sinks below all of that
      const g = x => ({ "new": 0, yours: 1, queued: 2, working: 3, done: 4 })[queueState(x)];
      if (g(a) !== g(b)) return g(a) - g(b);
      if (g(a) === 0) return (b.ts || 0) - (a.ts || 0);   // newest created on top
      if (g(a) === 1) return (b.agentTs || 0) - (a.agentTs || 0);   // newest reply on top: latest cards come to the top. it was oldest first for a day so a batch came back in send order, which was not wanted
      return (b.ts || 0) - (a.ts || 0);                    // waiting, working and done: newest first
    });
}

function carouselRow(state){
  const w = curWs(state);
  const pool = poolOf(state);
  pool = pool.filter(b => b.id !== selectedId);
  const you = pool.filter(b => !b.done && b.ball === "you")
    .sort((a, b) => (b.agentTs || 0) - (a.agentTs || 0));
  const wait = pool.filter(b => !b.done && b.ball !== "you")
    .sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const done = pool.filter(b => b.done);
  return [...you, ...wait, ...done];
}

function relAge(ts){
  if (!ts) return "no reply yet";
  const sec = Date.now() / 1000 - ts;
  if (sec < 60) return "replied just now";
  if (sec < 3600) return "replied " + Math.floor(sec / 60) + "m ago";
  if (sec < 86400) return "replied " + Math.floor(sec / 3600) + "h ago";
  return "replied " + Math.floor(sec / 86400) + "d ago";
}

function shortAge(ts){
  if (!ts) return "";
  const sec = Date.now() / 1000 - ts;
  if (sec < 60) return "now";
  if (sec < 3600) return Math.floor(sec / 60) + "m";
  if (sec < 86400) return Math.floor(sec / 3600) + "h";
  return Math.floor(sec / 86400) + "d";
}
// while a row works its age is noise; the slot carries a terminal spinner
// instead, the ten braille frames at 100ms a step. one interval serves every
// green row and only lives while one exists; each rebuild stamps the current
// frame itself (see the tage line below), so the ticker and the poll-driven
// re-renders never fight over the text. ages return on the next quiet poll.
const SPIN_FRAMES = ["|","/","-","\\"];   // the classic terminal spinner, bolder than braille dots
let spinFrame = 0, spinTimer = null;
function syncSpinner(){
  const has = document.querySelector("#tiklist .trow.working");
  if (has && spinTimer == null){
    spinTimer = setInterval(() => {
      const ages = document.querySelectorAll("#tiklist .trow.working .tage");
      if (!ages.length){ clearInterval(spinTimer); spinTimer = null; return; }
      spinFrame = (spinFrame + 1) % SPIN_FRAMES.length;
      for (const a of ages) a.textContent = SPIN_FRAMES[spinFrame];
    }, 180);
  } else if (!has && spinTimer != null){
    clearInterval(spinTimer); spinTimer = null;
  }
}
function renderCarousel(state){
  const tik = document.getElementById("tiklist");
  const chips = document.getElementById("chips");
  const w = curWs(state);
  const all = poolOf(state);    // every chat of the workspace, grouped and sorted
  // panel tab from the one state: done -> done, parked -> deferred, else doing
  const pool = all.filter(viewFilter);
  const lane = state.agents?.[activeOwner];
  const sig = ticketView + "|" + (lane ? lane.name + lane.alive : "") + "|" +
              pool.map(b => b.id + b.ball + (b.writing ? "w" : "") + (b.bg ? "g" : "") + (b.done ? "d" : "") + b.pending +
                      ((seenReplies[b.id] || 0) >= (b.agentTs || 0) ? "r" : "") +
                      (b.id === selectedId ? "!" : "") + (b.task || "") + b.title +
                      Math.floor((Date.now() / 1000 - (b.agentTs || 0)) / 60)).join(",") +
              "|" + selectedTask;
  if (tik.dataset.sig !== sig){
    tik.dataset.sig = sig;
    // remember where each row sat, so survivors glide instead of teleporting
    const oldPos = {};
    for (const prev of tik.children) if (prev.dataset && prev.dataset.id) oldPos[prev.dataset.id] = prev.getBoundingClientRect().top;
    tik.textContent = "";
    for (const b of pool){
      const s = queueState(b);   // working covers claimed and a worker's job behind it
      // quirks kept: a claimed done row still pulses, and an untouched row
      // falls in with yours or queued by where the ball sits
      const busy = s === "working" || (s === "done" && cardState({ ...b, done: false, parked: false, state: null }) === "working");
      const seenTs = seenReplies[b.id] || 0;
      const r = h("div", "trow" + (b.id === selectedId ? " on" : "") + (busy ? " working" : "") +
                  (s === "yours" && seenTs >= (b.agentTs || 0) ? " seen" : "") +
                  (s === "yours" || (s === "new" && b.ball === "you") ? " yours" : "") +
                  (s === "queued" || (s === "new" && b.ball !== "you") ? " queuedc" : "") +
                  (s === "done" ? " donec" : "") +
                  (selectedTask && b.task === selectedTask ? " match" : ""));
      const inner = h("div", "trowin");
      const ttl = h("div", "ttl", b.title);
      if (/^[0-9]/.test(b.id)) ttl.prepend(h("span", "tnum", b.id));
      inner.appendChild(ttl);
      const meta = h("div", "tmeta");
      meta.appendChild(h("span", "tage", busy ? SPIN_FRAMES[spinFrame] : s === "done" ? "done" : shortAge(b.agentTs)));
      // the tag is the lane's live truth, never a stored per-card value
      const ag = state.agents?.[b.owner];
      meta.appendChild(h("span", "teng", ag ? (ag.alive ? ag.name : "offline") : ""));
      inner.appendChild(meta);
      r.appendChild(inner);
      r.dataset.id = b.id;
      r.addEventListener("click", () => select(b.id));
      tik.appendChild(r);
    }
    if (!pool.length) tik.appendChild(h("div", "tempty", ticketView === "done" ? "no done chats yet" : ticketView === "deferred" ? "no deferred chats yet" : "no open chats here"));
    // surviving rows glide to their new spots, the 220ms rise of the sister
    // board, instead of teleporting on every re-sort
    for (const row of tik.children){
      const was = row.dataset && oldPos[row.dataset.id];
      if (was == null) continue;
      const dy = was - row.getBoundingClientRect().top;
      if (Math.abs(dy) < 2) continue;
      row.style.transition = "none";
      row.style.transform = "translateY(" + dy + "px)";
      void row.offsetHeight;
      row.style.transition = "transform 220ms cubic-bezier(0.25, 1, 0.5, 1)";
      row.style.transform = "";
      row.addEventListener("transitionend", () => { row.style.transition = ""; }, { once: true });
    }
    tik.querySelector(".trow.on")?.scrollIntoView({ block: "nearest" });
  }
  // chips spring up above the panel: green while its agent works, yellow
  // while the ticket awaits input; click jumps there
  // quirk kept: the claim and the ball alone gate a chip; bg does not open
  // one, but it turns an open chip green: work in flight outranks the ball
  // gate kept: the live claim (writing, not bg) and the ball alone open a chip,
  // a distinction the collapsed state can't draw. the color, though, is the one
  // state: green while working (a claim or a live bg job), else yellow
  const need = pool.filter(b => cardState(b) !== "done" && (b.writing || b.ball === "you"));
  const chipColor = b => queueState(b) === "working" ? "g" : "y";
  const csig = need.map(b => b.id + chipColor(b)).join(",");
  if (chips.dataset.sig !== csig){
    chips.dataset.sig = csig;
    chips.textContent = "";
    const MAXCHIPS = 8;
    for (const b of need.slice(0, MAXCHIPS)){
      const c = h("span", "chip " + chipColor(b));
      c.title = b.title;
      c.addEventListener("click", () => select(b.id));
      chips.appendChild(c);
    }
    if (need.length > MAXCHIPS){
      const rest = need.slice(MAXCHIPS);
      const c = h("span", "chip more", "+" + rest.length);
      c.title = rest.map(b => b.title).join("\n");
      c.addEventListener("click", () => select(rest[0].id));
      chips.appendChild(c);
    }
  }
  syncSpinner();
}

let pollFails = 0;
async function poll(){
  try {
    const state = await (await fetch("/state")).json();
    pollFails = 0;
    if (!lastState) build(state);
    apply(state);
    lastState = state;
  } catch (e) {
    if (++pollFails >= 3){   // server itself unreachable, distinct from listener-offline
      document.body.classList.add("offline");
      document.getElementById("offline").textContent =
        "The facilitator server is unreachable. Nothing sent now will arrive; ask in the terminal to restart it.";
    }
  }
}

// the grid compass: arrow keys when not typing (Esc leaves the input), and
// the quiet on-page arrows
addEventListener("keydown", e => {
  if (!FOCUS) return;
  if (e.ctrlKey && !e.metaKey && e.shiftKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
    // control+shift+arrows: previous/next card, in and out of the text box
    // (moved off command+shift+arrows, which natively selects to line ends)
    e.preventDefault();
    nav(e.key === "ArrowLeft" ? -1 : 1, 0, { focus: true });
    return;
  }
  if (e.ctrlKey && !e.metaKey && e.shiftKey && (e.key === "ArrowUp" || e.key === "ArrowDown")){
    // control+shift+up/down, the sibling pair: the selected card's older
    // replies and back toward live, in and out of the text box
    e.preventDefault();
    histStep(e.key === "ArrowUp" ? 1 : -1);
    return;
  }
  if (e.metaKey && e.shiftKey && ["[", "]", "{", "}"].includes(e.key)){
    // command+shift+brackets: previous/next card, works while typing,
    // cursor lands in the next card's text box
    e.preventDefault();
    nav(e.key === "[" || e.key === "{" ? -1 : 1, 0, { focus: true });
    return;
  }
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === "z" || e.key === "Z")){
    // command+z bounces back to the card the last send left, and back again
    if (lastLeftId && els[lastLeftId]){
      e.preventDefault();
      const there = lastLeftId;
      lastLeftId = selectedId;
      select(there, { focus: true });
    }
    return;
  }
  if (e.metaKey && (e.key === "t" || e.key === "T")){   // command+T: new card, input focused
    e.preventDefault();
    if (draft) return;   // a choosing tab has no lane to put a card in yet
    fetch("/create?owner=" + activeOwner, { method: "POST" })
      .then(x => x.json())
      .then(r => { if (r?.id){ localStorage.setItem("focusbox", r.id); poll(); } })
      .catch(() => {});
    return;
  }
  if (e.metaKey && /^[1-9]$/.test(e.key) && lastState){   // command+number jumps tabs
    const owners = LOCKED ? [LOCKED] : rowsOf(lastState);
    const ow = owners[+e.key - 1];
    if (ow){ e.preventDefault(); setTab(ow); }
    return;
  }
  const t = e.target;
  const typing = t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable);
  if (typing){ if (e.key === "Escape") t.blur(); return; }
  // the arrow key resize is gone, taken out on 20260822. boxes are
  // still resized by the small squares in edit mode and moved by dragging
  if ((e.key === "Backspace" || e.key === "Delete") && selectedId){
    const b = lastState?.boxes.find(x => x.id === selectedId);
    if (b?.bucket === "meta"){   // same cards the remove cross appears on
      e.preventDefault();
      // match the cross: a card with any conversation closes to done and stays
      // retrievable; only a truly empty card is removed for good
      const hasContent = b.replies > 0 || (b.reply && b.reply.trim()) || b.pending > 0;
      const ep = hasContent ? ("/done?box=" + encodeURIComponent(selectedId) + "&v=1") : ("/delete?box=" + encodeURIComponent(selectedId));
      fetch(ep, { method: "POST" }).then(() => poll()).catch(() => {});
    }
    return;
  }
  const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];   // up/down freed; cmd+number switches projects
  if (d){ e.preventDefault(); nav(d[0], d[1]); }
});

{

  if (saved) document.documentElement.style.setProperty("--tocw", clamp(saved) + "px");

      localStorage.setItem("tocw", parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tocw"), 10));
      removeEventListener("mousemove", move); removeEventListener("mouseup", up);
    };
    addEventListener("mousemove", move); addEventListener("mouseup", up);
  });
}

// quick chat: the q box's thread as text-message bubbles, served by the qchat
// lane; the panel is dormant in the current board but the machinery stays
let qSig = "";
async function pollQ(){

  try {
    const r = await (await fetch("/thread?box=q&n=60")).json();
    const sig = JSON.stringify(r.messages.map(m => m.ts));
    const writing = !!lastState?.boxes.find(b => b.id === "q")?.writing;
    if (sig + writing !== qSig){
      qSig = sig + writing;
      const qm = document.getElementById("qmsgs");
      qm.textContent = "";
      let prev = null;
      for (const m of r.messages){

// scale the fixed 1440x900 stage to the largest that fits, centered
function fitStage(){
  if (!FOCUS) return;
  const stage = document.getElementById("stage");
  if (!stage) return;
  const bar = 41, DW = 1440, DH = 900;
  const availH = innerHeight - bar;
  // fixed size, never scaled: center it, and only scale DOWN if the window is
  // smaller than the app so nothing is lost; elements keep their size otherwise
  // fixed size, never scaled: the app is a locked rectangle, centered. The
  // elements inside never resize; a smaller window just shows less of it.
  const tx = Math.max(0, (innerWidth - DW) / 2);
  const ty = Math.max(0, (availH - DH) / 2);
  stage.style.transform = `translate(${tx}px, ${ty}px)`;
  // slide the window-wide star field so its phase matches the stage's origin
  document.body.style.backgroundPosition = tx + "px " + (bar + ty) + "px";
}

// writes that tab's own key and it stops inheriting, so tabs stay independent.
// the inheriting is all or nothing on purpose: mixing one tab's saved size with
// another tab's saved position puts boxes on top of each other
function layoutSource(){
  if (!dragEnabled) return null;
  for (const el of document.querySelectorAll(REGION_SEL)){
    const id = regionId(el);
    if (localStorage.getItem("pos." + activeOwner + "." + id) ||
        localStorage.getItem("size." + activeOwner + "." + id)) return activeOwner;

// the top right region changed hands: the to-do box became magic box 2, and the
// old magic box 2 became magic box 3. saved layouts are keyed by region id, so
// the stored keys are renamed once to match, or both boxes land in the wrong
// place for anyone who had arranged them
const MAGIC_RENAME = "magicrename.1";
function renameMagicLayouts(){
  if (!dragEnabled || localStorage.getItem(MAGIC_RENAME)) return;
  localStorage.setItem(MAGIC_RENAME, "1");
  const move = (from, to) => {
    const hits = [];
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      const m = k && new RegExp("^(pos|size)\\.(.+)\\." + from + "$").exec(k);
      if (m) hits.push([k, m[1] + "." + m[2] + "." + to]);
    }
    for (const [oldK, newK] of hits){
      const v = localStorage.getItem(oldK);
      localStorage.removeItem(oldK);
      if (v !== null) localStorage.setItem(newK, v);
    }

  move("todobox", "magic2");

// one time, on the first load after this shipped: every tab that was already
// arranged gets the facilitator tab's layout copied into its own keys, so all
// the tabs start out matching. tabs still save their own layout after this, so
// they stay independent. the old values are kept under layoutbak. in case the
// copy is not wanted
const LAYOUT_SYNC = "layoutsync.1";
function syncLayoutsOnce(){
  if (!dragEnabled || localStorage.getItem(LAYOUT_SYNC)) return;
  localStorage.setItem(LAYOUT_SYNC, "1");
  const lanes = new Set();
  for (let i = 0; i < localStorage.length; i++){
    const m = /^(?:pos|size)\.([^.]+)\./.exec(localStorage.key(i) || "");
    if (m && m[1] !== "facilitator") lanes.add(m[1]);
  }
  for (const lane of lanes){
    for (const el of document.querySelectorAll(REGION_SEL)){
      const id = regionId(el);
      for (const kind of ["pos", "size"]){
        const mine = kind + "." + lane + "." + id;
        const old = localStorage.getItem(mine);
        if (old !== null) localStorage.setItem("layoutbak." + mine, old);
        const src = localStorage.getItem(kind + ".facilitator." + id);
        if (src !== null) localStorage.setItem(mine, src);
        else localStorage.removeItem(mine);
      }
    }
  }
}

function applySavedLayout(){

function buildHandles(){
  handleLayer.textContent = "";

// handles chase the boxes every frame, so they stay glued through drags,
// resizes and content changes without hooking any other code path
function trackHandles(){
  const sr = document.getElementById("stage").getBoundingClientRect();
  for (const it of handleItems){
    const r = it.el.getBoundingClientRect();
    // a box taken off this tab keeps its rect, so its squares have to be pulled
    // by hand or they float over nothing
    if (it.el.classList.contains("region-off")){ it.hd.style.display = "none"; continue; }
    if (!r.width && !r.height){ it.hd.style.display = "none"; continue; }
    it.hd.style.display = "";
    const x = it.dir.includes("w") ? r.x : it.dir.includes("e") ? r.x + r.width : r.x + r.width / 2;
    const y = it.dir.includes("n") ? r.y : it.dir.includes("s") ? r.y + r.height : r.y + r.height / 2;
    it.hd.style.left = (x - sr.x - 4.5) + "px";
    it.hd.style.top = (y - sr.y - 4.5) + "px";
  }
  for (const it of killItems){
    const r = it.el.getBoundingClientRect();
    if (it.el.classList.contains("region-off")){ it.kill.style.display = "none"; continue; }
    if (!r.width && !r.height){ it.kill.style.display = "none"; continue; }
    it.kill.style.display = "";
    // just outside the top right corner, clear of the corner square. inside it
    // would land exactly on a card's own moon and cross, which sit at the same
    // inset, and would cover whatever the box is holding
    it.kill.style.left = (r.x + r.width + 14 - sr.x) + "px";
    it.kill.style.top = (r.y - 14 - sr.y) + "px";
  }

function beginSize(e, el, dir){
  if (!editMode || e.button !== 0) return;
  e.preventDefault();   // keeps the grab from focusing or selecting anything
  e.stopPropagation();
  const r = el.getBoundingClientRect();
  const sr = document.getElementById("stage").getBoundingClientRect();
  sizing = { el, dir, px: e.clientX, py: e.clientY,
    left: r.x - sr.x, top: r.y - sr.y, w: r.width, h: r.height,
    // the far edges, snapped: a west or north pull anchors on these
    right: onStar(r.x - sr.x + r.width), bottom: onStar(r.y - sr.y + r.height),
    moved: false };
}
addEventListener("pointermove", e => {
  if (!sizing) return;
  const s = sizing;

  // widths and heights stay whole cells, never under two; a west or north
  // pull moves the origin to a star line and keeps the far edge pinned
  let w = Math.max(2 * GRID, Math.round((s.w + (s.dir.includes("e") ? dx : 0)) / GRID) * GRID);
  let h = Math.max(2 * GRID, Math.round((s.h + (s.dir.includes("s") ? dy : 0)) / GRID) * GRID);
  if (s.dir.includes("w")){
    const left = Math.min(Math.max(GRID / 2, onStar(s.left + dx)), s.right - 2 * GRID);
    w = s.right - left;
    s.el.style.left = left + "px";
    s.x = left;
  }
  if (s.dir.includes("n")){
    const top = Math.min(Math.max(GRID / 2, onStar(s.top + dy)), s.bottom - 2 * GRID);
    h = s.bottom - top;
    s.el.style.top = top + "px";
    s.y = top;
  }
  s.el.style.width = w + "px";
  s.el.style.height = h + "px";
  s.outw = w; s.outh = h;
  s.moved = true;
});

// ---- the fat caret --------------------------------------------------------
// a terminal style block cursor stands in for the native caret on every
// typing surface: card reply boxes, the title while naming, the to-do input,
// quick chat. its cell is sized by the field's font, never by the letter
// under it, and its left edge sits exactly on the insertion point.
{
  const bar = document.createElement("div");
  bar.id = "fatcaret";
  document.body.appendChild(bar);
  // the mirror clones the focused field's text layout so a marker span can
  // stand where the caret is; it stays invisible and out of the layout
  const mirror = document.createElement("div");
  mirror.style.cssText = "position:fixed; top:0; left:-9999px; visibility:hidden; pointer-events:none";
  document.body.appendChild(mirror);

  // per font metrics. asc is inline box top to baseline, measured in the dom
  // itself (a zero size inline block sits exactly on the text baseline), so
  // it matches the caret rects the layout engine reports. fbA and fbD are the
  // font's full cell above and below the baseline, from canvas TextMetrics
  const mcache = new Map();
  const mctx = document.createElement("canvas").getContext("2d");
  function fmetrics(cs){
    const key = cs.fontStyle + "|" + cs.fontWeight + "|" + cs.fontSize + "|" + cs.fontFamily;
    let m = mcache.get(key);
    if (m) return m;
    const d = document.createElement("div");
    d.style.cssText = "position:fixed; left:-9999px; top:0; visibility:hidden; line-height:normal";
    d.style.fontFamily = cs.fontFamily; d.style.fontSize = cs.fontSize;
    d.style.fontWeight = cs.fontWeight; d.style.fontStyle = cs.fontStyle;
    const w = document.createElement("span"); w.textContent = "H";
    const p = document.createElement("span");
    p.style.cssText = "display:inline-block; width:0; height:0";
    d.append(w, p); document.body.appendChild(d);
    const wr = w.getBoundingClientRect();
    m = { asc: p.getBoundingClientRect().bottom - wr.top, boxH: wr.height };
    d.remove();
    let fbA = NaN, fbD = NaN, capH = NaN;
    try {
      mctx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      const tm = mctx.measureText("H");
      fbA = tm.fontBoundingBoxAscent; fbD = tm.fontBoundingBoxDescent;
      capH = tm.actualBoundingBoxAscent;
    } catch (e) {}
    if (fbA > 0 && fbD >= 0){ m.fbA = fbA; m.fbD = fbD; }
    else { m.fbA = m.asc; m.fbD = parseFloat(cs.fontSize) * 1.18 - m.asc; }
    m.capH = capH > 0 ? capH : parseFloat(cs.fontSize) * 0.7;
    // web fonts still loading would freeze wrong numbers into the cache
    if (!document.fonts || document.fonts.status === "loaded") mcache.set(key, m);
    return m;
  }

  const trackable = el => {
    if (!el || el.nodeType !== 1) return null;
    if (el.tagName === "TEXTAREA") return el;
    if (el.tagName === "INPUT") return (el.type === "text" || el.type === "search") ? el : null;
    return el.closest("[contenteditable]");
  };

  // textarea and input path: rebuild the mirror with the field's font, box
  // and wrap rules, text up to the caret, then read the marker's spot
  function fieldCaret(el){
    if (el.selectionStart == null) return null;
    const cs = getComputedStyle(el);
    const r = el.getBoundingClientRect();
    for (const p of ["fontFamily","fontSize","fontWeight","fontStyle","lineHeight",

                     "paddingTop","paddingRight","paddingBottom","paddingLeft",
                     "borderTopWidth","borderRightWidth","borderBottomWidth","borderLeftWidth"])

    mirror.style.borderColor = "transparent";
    mirror.style.boxSizing = "border-box";
    mirror.style.width = r.width + "px";
    // a single-line input never wraps, it scrolls sideways instead
    mirror.style.whiteSpace = el.tagName === "INPUT" ? "pre" : "pre-wrap";
    mirror.style.wordWrap = el.tagName === "INPUT" ? "normal" : "break-word";
    const typed = el.value.slice(0, el.selectionStart);
    const rest = el.value.slice(el.selectionStart);
    mirror.textContent = typed;
    const mr = mirror.getBoundingClientRect();
    let kr;
    if (!rest && /\S$/.test(typed)){
      // live typing at the end of a word: any marker glyph would weld onto
      // that word, and at a full line the welded pair wraps in the mirror
      // while the real text stays put, so the block drew one line below the
      // caret; the right edge of the last typed character is the true spot
      const rg = document.createRange();
      rg.setStart(mirror.firstChild, typed.length - 1);
      rg.setEnd(mirror.firstChild, typed.length);
      const rr = rg.getClientRects()[0] || rg.getBoundingClientRect();
      kr = { left: rr.right, top: rr.top };
    } else if (!rest && / $/.test(typed) && el.tagName !== "INPUT"){
      // live typing spaces at a full line, measured against Chrome's own
      // caret: each space advances its full width while it still fits the
      // line, and once the spaces hang past the edge the caret pins about
      // 1.7px inside the content edge and rides there, on the space's own
      // line; it never drops until a real letter wraps
      const rg = document.createRange();
      rg.setStart(mirror.firstChild, typed.length - 1);
      rg.setEnd(mirror.firstChild, typed.length);
      const rr = rg.getClientRects()[0] || rg.getBoundingClientRect();
      const edge = mr.right - parseFloat(cs.borderRightWidth) - parseFloat(cs.paddingRight) - 1.7;
      kr = { left: Math.min(rr.right, edge), top: rr.top };
    } else {
      const mark = document.createElement("span");
      // the marker carries the rest of the text so it wraps exactly like the
      // real field; its first fragment starts at the caret. at the very end
      // of the text a placeholder dot stands in on the spot typing lands,
      // which after a pressed line break is the start of the next line
      mark.textContent = rest || ".";
      mirror.appendChild(mark);
      kr = mark.getClientRects()[0] || mark.getBoundingClientRect();
    }
    const m = fmetrics(cs);
    // the baseline is the marker's inline box top plus the font's ascent
    return { x: r.left + (kr.left - mr.left) - el.scrollLeft,
             base: r.top + (kr.top - mr.top) - el.scrollTop + m.asc,
             fs: parseFloat(cs.fontSize), fbA: m.fbA, fbD: m.fbD, clip: r };
  }

  // contenteditable path: a collapsed range reports the caret box directly
  function ceCaret(el){
    const cs = getComputedStyle(el);
    const fs = parseFloat(cs.fontSize);
    const m = fmetrics(cs);
    const sel = getSelection();
    if (sel.rangeCount){
      const rr = sel.getRangeAt(0).getBoundingClientRect();
      if (rr.height) return { x: rr.left, base: rr.top + m.asc, fs, fbA: m.fbA, fbD: m.fbD,
                              capH: m.capH, clip: el.getBoundingClientRect() };
    }
    // an empty editable gives a zero rect; park the block at the field's
    // start, on the baseline the strut line box will give the first letter
    const r = el.getBoundingClientRect();
    return { x: r.left, base: r.top + (r.height - m.boxH) / 2 + m.asc, fs,
             fbA: m.fbA, fbD: m.fbD, capH: m.capH, clip: r };
  }

  let raf = 0, px = 0, py = 0;
  function place(){
    raf = 0;
    if (!cur || !cur.isConnected){ cur = null; bar.classList.remove("on"); return; }
    const collapsed = isField ? cur.selectionStart === cur.selectionEnd : getSelection().isCollapsed;
    if (!collapsed){ bar.classList.remove("on"); return; }   // a selection marks its own spot
    const c = isField ? fieldCaret(cur) : ceCaret(cur);
    if (!c){ bar.classList.remove("on"); return; }
    // terminal cell: half an em wide. the serif title reads Title Case, so
    // its block spans the ink band, cap height down to the baseline and zero
    // pixels past it; every other field keeps the font's full cell, ascent
    // line down to descender depth, which reads right beside lowercase text
    const bw = c.fs * 0.5;
    let bh, y;
    if (!isField && cur.classList.contains("title")){
      bh = c.capH + 1;   // one pixel of optical overshoot above the caps
      y = c.base - bh;
    } else {
      // text boxes: 1.1em centered on the glyph band, the accepted look;
      // the font's full bounding cell read too tall here
      bh = c.fs * 1.1;
      y = c.base - c.fbA + (c.fbA + c.fbD - bh) / 2;
    }
    // a caret scrolled out of the field's box must not hover over other ui
    if (y + bh < c.clip.top - 1 || y > c.clip.bottom + 1 ||
        c.x + bw < c.clip.left - 1 || c.x > c.clip.right + 5){
      bar.classList.remove("on"); return;
    }
    bar.style.left = c.x + "px";
    bar.style.top = y + "px";
    bar.style.width = bw + "px";
    bar.style.height = bh + "px";
    if (!bar.classList.contains("on") || c.x !== px || y !== py){
      // restart the blink so the block lands solid, the way a native caret does
      bar.classList.remove("on"); void bar.offsetWidth; bar.classList.add("on");
      px = c.x; py = y;
    }
  }
  const queue = () => { if (!raf) raf = requestAnimationFrame(place); };

  document.addEventListener("focusin", e => {
    const el = trackable(e.target);
    if (cur && cur !== el) cur.classList.remove("fc-hide");
    cur = el;
    isField = !!el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT");
    if (cur) cur.classList.add("fc-hide");
    queue();
  });
  document.addEventListener("focusout", () => {
    if (cur) cur.classList.remove("fc-hide");
    cur = null; queue();
  });
  document.addEventListener("selectionchange", queue);
  document.addEventListener("input", queue, true);
  document.addEventListener("keyup", queue, true);
  document.addEventListener("scroll", queue, true);
  addEventListener("resize", queue);
  // a poll can reflow the page under a focused field with no input event;
  // a light steady re-place keeps the bar honest
  setInterval(() => { if (cur) queue(); }, 300);
}


renameMagicLayouts();
syncLayoutsOnce();
seedHiddenOnce();
applySavedLayout();
poll(); setInterval(poll, 1200);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to Facilitator</title>
<link rel="icon" href="data:,">
<!-- the server writes the board's version in here (#npversion in index.html) -->
<meta name="facilitator-version" content="">
<!-- Facilitator's first run, as a run of real cards, one per profile question:
     Welcome, the name, the email, the work, the main agent, and
     the closing card, each answer's reply teaching the next key. The Mac board
     lays this page over itself in a frame of its own while the board has no
     complete profile (GET /profile in server.py), so nobody uses the board
     before going through it. The card's look and motion are the board's own,
     loaded from the board: the shared sheet, the markdown and the card logic,
     so a change to the bubbles, the send motion, the page turn, the reply
     history or the ticket list's sections shows here too. What index.html
     keeps inline, and so cannot be loaded, is copied below, each piece under
     the name it has there. The card is the board's own size, 506.88 by 748.8,
     the board's 1440 by 900 design at full size, centred on the empty paper.
     From the email card on, the board's ticket list stands beside it, one
     ticket per card, where the board's stage puts the two. An answer is
     replied to the moment its send's flight lands, with no Delivered, Read or
     working stage between. ?hint=title, ?hint=box or ?hint=bar puts the Tab
     hint elsewhere (the default is ?hint=reply).
     The answers stay in this page until the closing card is marked done; then
     they are saved as the profile (POST /profile), the frame goes and the
     board opens on the sample project this page opened at its start
     (POST /onboarding/sample, then POST /project as "Open a new folder" does).
     Only with an email given do they leave the Mac: the email, the name, the
     answers and the time zone go to PostHog then, as that person's details. -->
<script src="/card-markdown.js"></script>
<script src="/card-logic.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
  /* ---- copied from index.html's own sheet -------------------------------
     the focused card's frame lives only in index.html's inline style, so it is
     copied here rule for rule, each group under what it is there. left out:
     every rule for other parts of the board, the formatted composer (.cffield,
     not loaded here) and the board's tinted button fills, which the focused
     card's own rules override anyway. card-tokens.css is loaded right after
     this sheet, the order index.html has */

  /* the page */
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:15px/1.55 var(--sans);
    background-image:radial-gradient(circle at 18% -4%, #FCFCFB 0%, rgba(252,252,251,0) 52%);
  }
  body, button{-webkit-user-select:none; user-select:none}
  .reply, .mreply, .answmsg, .cm-content, input, textarea,
  [contenteditable=""], [contenteditable="true" i], [contenteditable="plaintext-only" i]{
    -webkit-user-select:text; user-select:text;
  }
  ::selection{background:#000; color:#fff}

  /* the squid mark, cut to the squid's own bounds */
  .squidmark{display:block; height:20px; aspect-ratio:917 / 1126; overflow:hidden; flex:none}
  .squidmark img{display:block; width:135.99%; max-width:none; height:auto; margin:-7.52% 0 0 -17.99%}

  /* the chips' base */
  .xbtn{flex:none; font:14px var(--mono); color:var(--sub); background:none; border:none;
    cursor:pointer; padding:0 4px; line-height:1; transition:color .2s}
  .xbtn:hover{color:var(--must)}
  .arcbtn, .sunbtn, .dockbtn{flex:none; display:inline-flex; align-items:center; justify-content:center;
    color:#000; background:none; border:none; cursor:pointer; padding:0}

  /* the card */
  .box{
    background:var(--card); border:var(--edge) solid var(--line); border-radius:7px;
    margin:0 0 14px; overflow:hidden;
    transition:border-color .35s, background .45s, box-shadow .25s;
    animation:rise .45s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(6px)}}
  .box:focus-within{border-color:var(--line); box-shadow:0 2px 14px rgba(60,45,20,.05)}
  .head{display:flex; align-items:center; gap:10px; padding:12px 14px 0; cursor:default}
  .title{font:625 17.5px/1.25 var(--inter); flex:1; min-width:0}
  .title[contenteditable]{outline:none}
  .title:empty::before{content:"Card Name"; color:var(--bubble-fill, #F3F3F3)}
  .body{padding:8px 14px 13px}
  .reply{color:var(--ink)}
  .reply p{margin:0 0 9px}
  .reply p:last-child, .reply ul:last-child, .reply ol:last-child{margin-bottom:0}
  .reply ul, .reply ol{margin:0 0 9px; padding-left:20px}
  .reply li{margin:3px 0}
  .meta{font:11.5px var(--mono); color:var(--sub); margin-top:9px; min-height:15px; display:flex; gap:6px; align-items:center}
  .compose{display:flex; gap:8px; margin-top:9px; align-items:flex-end}
  textarea{
    flex:1; resize:none; font:14.5px/1.45 var(--sans); color:var(--ink);
    background:var(--paper); border:var(--edge) solid var(--line); border-radius:9px;
    padding:8px 11px; min-height:38px; max-height:170px; outline:none; transition:border-color .2s;
  }

  /* an older reply, while it shows, dims a little */
  .box.histview .replyview{opacity:.8}

  /* the block caret's two layers, and the send square's base */
  #fatcaret, #fatcaretlift{display:none; position:fixed;
    pointer-events:none; z-index:99}
  #fatcaret{background:var(--card); mix-blend-mode:difference}
  #fatcaretlift{background:var(--ink); mix-blend-mode:color-dodge}
  #fatcaret.on, #fatcaretlift.on{display:block}
  .fc-hide{caret-color:transparent}
  textarea::placeholder{color:#B4AA99}
  .sendbtn{
    flex:none; font:600 13px var(--sans); color:#fff;
    border:none; border-radius:9px; padding:9px 16px; cursor:pointer;
    transition:transform .12s, opacity .2s;
  }
  .sendbtn:disabled{opacity:.35; cursor:default; transform:none}

  /* the board's corners, motion and scroll rules */
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
  .box, textarea, .sendbtn{border-radius:4px !important}
  .sendbtn{border:none !important}
  html:has(body.focus), body.focus{overflow:hidden}
  html, body{overscroll-behavior:none}
  #tiklist, .tikpane, #tickets, .box .body, .box .replyview, textarea{overscroll-behavior:none}

  /* the design size every measure on the card is a share of. the
     board scales its whole stage down to fit the window and never above 1:1,
     so in a window that holds the board the card is drawn at exactly this size.
     this page draws the card at its design size and shortens it on a short
     window instead, because the page turn lays its pictures in window pixels
     and a scaled card would put them off by the scale */
  body.focus{
    --bar-h:41px;
    --cw:1440px; --ch:900px;
    --ox:0px; --oy:0px;
    --tik-x:calc(var(--ox) + var(--cw)*0.036);     --tik-w:calc(var(--cw)*0.248);
    --tik-y:0.2112;  --tik-h:0.5632;
    --frame-x:calc(var(--ox) + var(--cw)*0.324);   --frame-w:calc(var(--cw)*0.352);
    --frame-y:0.0832; --frame-h:0.832;
    --pad-x:calc(var(--cw)*0.016);  --pad-y:0.008;
    --sp-xs:calc(var(--ch)*0.005);  --sp-s:calc(var(--ch)*0.0095);
    --sp-m:calc(var(--ch)*0.0195);  --sp-x:calc(var(--cw)*0.0085);
    --grid:calc(var(--cw)*0.008);
  }

  /* the card's frame. index.html seats it at its place on the stage
     (left:--frame-x, top:--frame-y); here it stands alone in the middle */
  body.focus main{
    max-width:none; margin:0; overflow:hidden;
    position:relative;
    width:min(var(--frame-w), calc(100vw - 32px));
    height:min(calc(var(--ch)*var(--frame-h)), calc(100vh - 32px));
    border:var(--edge) solid var(--line); background:#fff; border-radius:7px;
    box-shadow:0 2px 18px rgba(60,45,20,.18), 0 1px 3px rgba(60,45,20,.10);
    transition:box-shadow .2s;
    padding:calc(var(--ch)*0.022) var(--pad-x);
    display:flex; flex-direction:column; align-items:stretch;
  }
  body.focus #sections{width:100%; max-width:100%; flex:1; display:flex; flex-direction:column; min-height:0}
  body.focus .box{display:none}
  body.focus .box.sel{
    display:flex; flex-direction:column; flex:1; min-height:0;
    background:transparent !important; border:none !important; box-shadow:none !important;
    animation:none; margin:0; overflow:visible;
  }
  body.focus .box.sel{position:static; animation:none}

  /* the card's own top bar */
  :root{
    --bar-sq:24px;
    --bar-gap-hist:4px; --bar-gap-chips:6px; --bar-lead:2px; --bar-tail:5px;
    --histpos-room:2px; --pathline-h:15px;
  }
  .topbar{display:none}
  body.focus .box.sel .topbar{
    --hist-cell:var(--bar-sq);
    display:grid; align-items:center; flex:none; position:relative;
    grid-template-columns:minmax(0, 1fr) repeat(4, var(--bar-sq));
    grid-template-rows:minmax(0, 1fr);
    grid-template-areas:"hist sun dock moon cross";
    column-gap:var(--bar-gap-chips);
    height:var(--cardbar-h);
    margin:calc(var(--ch)*-0.022) calc(var(--pad-x)*-1)
           calc(var(--ch)*0.022 + var(--pathline-h) - var(--cardbar-h));
    padding:0 var(--bar-tail) 0 var(--pad-x);
    background:var(--card);
    box-shadow:inset 0 calc(-1 * var(--edge-drawn)) 0 var(--line);
  }

  /* the reply history's two arrows and its count */
  body.focus .box.sel .histctl{
    grid-area:hist; justify-self:start; min-width:0;
    display:flex; align-items:center; gap:var(--bar-gap-hist); padding-left:var(--bar-lead);
    font:11.5px var(--mono); color:var(--sub); white-space:nowrap;
    visibility:hidden; opacity:0; transform:scale(.5); transform-origin:left center;
    pointer-events:none;
    transition:opacity .26s var(--gentle), transform .26s var(--gentle),
               visibility 0s linear .26s;
  }
  body.focus .box.sel.hashist .histctl{
    visibility:visible; opacity:1; transform:scale(1); pointer-events:auto;
    transition:opacity .26s var(--gentle), transform .26s var(--gentle), visibility 0s;
  }
  body.focus .box.sel .histbtn{
    flex:none; width:var(--hist-cell); height:var(--hist-cell); padding:0; border:none; border-radius:var(--sq);
    background:var(--card); color:var(--ink); display:grid; place-items:center; cursor:pointer;
  }
  body.focus .box.sel .histbtn:hover,
  body.focus .box.sel .histbtn:active{background:color-mix(in srgb, #000 var(--press), var(--card))}
  body.focus .box.sel .histbtn:disabled{opacity:.28; cursor:default}
  body.focus .box.sel .histbtn.older .histchev{transform:rotate(0deg)}
  body.focus .box.sel .histbtn.newer .histchev{transform:rotate(180deg)}
  body.focus .box.sel .histchev{display:block; flex:none; width:var(--hist-glyph-w); height:var(--hist-glyph-h)}
  body.focus .box.sel .histpos{margin-left:var(--histpos-room)}
  body.focus .box.sel .histpos:empty{display:none}

  /* the four chips */
  body.focus .box.sel .xbtn{
    grid-area:cross; position:relative; top:auto; right:auto; left:auto;
    width:var(--bar-sq); height:var(--bar-sq); border-radius:var(--sq);
    background:var(--card); font-size:0; padding:0; border:none;
  }
  body.focus .box.sel .xbtn::before, body.focus .box.sel .xbtn::after{
    content:""; position:absolute; left:50%; top:50%;
    width:calc(var(--bar-mark) * var(--chip-scale)); height:calc(var(--cross-t) * var(--chip-scale));
    background:#1e1e1e; border-radius:calc(var(--cross-t) * var(--chip-scale));
  }
  body.focus .box.sel .xbtn{
    left:calc(-1 * var(--bar-mark) * var(--chip-scale) *
      ((var(--ink-sun) + 2 * var(--ink-dock) + var(--ink-moon)) / 4 - (var(--ink-moon) + var(--ink-done)) / 2));
  }
  body.focus .box.sel .xbtn::before{transform:translate(-50%,-50%) rotate(45deg)}
  body.focus .box.sel .xbtn::after{transform:translate(-50%,-50%) rotate(-45deg)}
  body.focus .box.sel .xbtn:hover{background:color-mix(in srgb, #000 var(--press), var(--card))}
  body.focus .box.sel .arcbtn, body.focus .box.sel .sunbtn, body.focus .box.sel .dockbtn{
    position:relative; top:auto; right:auto;
    width:var(--bar-sq); height:var(--bar-sq); border-radius:var(--sq);
    background:var(--card); color:#000; border:none; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
  }
  body.focus .box.sel .sunbtn{grid-area:sun}
  body.focus .box.sel .dockbtn{grid-area:dock}
  body.focus .box.sel .arcbtn{grid-area:moon}
  body.focus .box.sel :is(.arcbtn, .sunbtn, .dockbtn) svg{width:calc(var(--bar-mark) * var(--chip-scale)); height:calc(var(--bar-mark) * var(--chip-scale))}
  body.focus .box.sel .arcbtn:hover, body.focus .box.sel .sunbtn:hover, body.focus .box.sel .dockbtn:hover{background:color-mix(in srgb, #000 var(--press), var(--card))}
  body.focus .box.sel :is(.sunbtn, .dockbtn, .arcbtn, .xbtn)[aria-disabled="true"]{opacity:var(--chipoff); cursor:default}
  body.focus .box.sel :is(.sunbtn, .dockbtn, .arcbtn, .xbtn)[aria-disabled="true"]:hover{background:var(--card)}
  body.focus .box.sel .num{display:none}

  /* the title, its air, the body and the answer */
  body.focus .box.sel .title{
    order:10; flex:0 0 100%; min-width:0; white-space:normal;
    font:625 30px/1.25 var(--inter); margin-top:0;
    padding-left:calc(var(--pad-x)*2/3); padding-right:calc(var(--pad-x)*2/3);
  }
  body.focus .box.sel .wstat{display:none}
  body.focus .box.sel{--titleair:calc(var(--pad-x)*2/3)}
  body.focus .box.sel .head{
    padding:var(--titleair) 0 0; flex-wrap:wrap; row-gap:var(--sp-xs); flex:none;
  }
  body.focus .box.sel .body{
    display:flex !important; flex-direction:column; flex:1 1 0; min-height:0;
    overflow:hidden; position:relative;
    padding:var(--titleair) 0 0;
  }
  body.focus .box.sel .replyview{
    display:flex; flex-direction:column;
    flex:1 1 auto; min-height:0; overflow-y:auto;
    margin-bottom:var(--replyair);
    overflow-anchor:none;
  }
  body.focus .box.sel .reply{
    flex:none;
    font-size:18px; line-height:1.55;
    padding-left:calc(var(--pad-x)*2/3);
    padding-right:calc(var(--pad-x)*5/3 - var(--sbar));
  }

  /* the answer's fades and its run-out */
  body.focus .box.sel{--replyfade:22px; --replyair:3.5px}
  body.focus .box.sel .replyview{
    -webkit-mask-image:
      linear-gradient(to bottom,
        rgba(0,0,0,0) 0,
        rgba(0,0,0,.35) calc(var(--upband, 0px)*.38),
        rgba(0,0,0,.80) calc(var(--upband, 0px)*.72),
        rgba(0,0,0,1) var(--upband, 0px),
        rgba(0,0,0,1) calc(100% - var(--boxband, 0px) - var(--replyfade)),
        rgba(0,0,0,.80) calc(100% - var(--boxband, 0px) - var(--replyfade)*.72),
        rgba(0,0,0,.35) calc(100% - var(--boxband, 0px) - var(--replyfade)*.38),
        rgba(0,0,0,0) calc(100% - var(--boxband, 0px))),
      linear-gradient(to right,
        rgba(0,0,0,1) calc(var(--boxleft) - var(--replyfade)),
        rgba(0,0,0,.80) calc(var(--boxleft) - var(--replyfade)*.72),
        rgba(0,0,0,.35) calc(var(--boxleft) - var(--replyfade)*.38),
        rgba(0,0,0,0) var(--boxleft),
        rgba(0,0,0,1) calc(var(--boxleft) + var(--replyfade)*.25)),
      linear-gradient(to bottom,
        rgba(0,0,0,1) calc(100% - var(--boxband, 0px)),
        rgba(0,0,0,0) calc(100% - var(--boxband, 0px)));
    mask-image:
      linear-gradient(to bottom,
        rgba(0,0,0,0) 0,
        rgba(0,0,0,.35) calc(var(--upband, 0px)*.38),
        rgba(0,0,0,.80) calc(var(--upband, 0px)*.72),
        rgba(0,0,0,1) var(--upband, 0px),
        rgba(0,0,0,1) calc(100% - var(--boxband, 0px) - var(--replyfade)),
        rgba(0,0,0,.80) calc(100% - var(--boxband, 0px) - var(--replyfade)*.72),
        rgba(0,0,0,.35) calc(100% - var(--boxband, 0px) - var(--replyfade)*.38),
        rgba(0,0,0,0) calc(100% - var(--boxband, 0px))),
      linear-gradient(to right,
        rgba(0,0,0,1) calc(var(--boxleft) - var(--replyfade)),
        rgba(0,0,0,.80) calc(var(--boxleft) - var(--replyfade)*.72),
        rgba(0,0,0,.35) calc(var(--boxleft) - var(--replyfade)*.38),
        rgba(0,0,0,0) var(--boxleft),
        rgba(0,0,0,1) calc(var(--boxleft) + var(--replyfade)*.25)),
      linear-gradient(to bottom,
        rgba(0,0,0,1) calc(100% - var(--boxband, 0px)),
        rgba(0,0,0,0) calc(100% - var(--boxband, 0px)));
    mask-composite:intersect, add, add;
  }
  body.focus .box.sel .replyview::after{content:""; flex:none; height:calc(var(--answ-slack, 0px) + var(--boxband, 0px) + var(--replyfade, 0px))}

  /* the two panels' seats and measures */
  body.focus .box.sel .sentwrap{
    display:flex; flex-direction:column; flex:none;
    padding:0 calc(var(--pad-x)*5/3 - var(--sbar)) var(--sp-s) calc(var(--pad-x)*2/3);
    background:var(--card);
  }
  body.focus .box.sel .sentwrap:empty{display:none}
  body.focus .box.sel{
    --boxleft:calc(var(--pad-x)*2/3);
    --pend-cap:calc(var(--ch)*var(--frame-h)/2);
    --under-bar:calc(1px + var(--row-min) + var(--sp-s));
    --sent-cap:calc(var(--pend-cap) - var(--under-bar) - var(--answ-pad-y) - var(--answ-strip) - var(--sp-s));
  }
  body.focus .box.sel .pendwrap{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; pointer-events:auto;
  }
  body.focus .box.sel .answwrap{
    display:flex; flex-direction:column; flex:none;
    padding:0 calc(var(--pad-x)*5/3 - var(--sbar)) var(--sp-s) calc(var(--pad-x)*2/3);
  }
  body.focus .box.sel .answwrap:empty{display:none}
  body.focus .box.sel{
    --answ-font:400 15px/20px var(--inter); --answ-line:20px;
    --answ-pad-y:18px; --answ-pad-x:18px; --answ-round:18px;
    --answ-strip:36px;
  }

  /* the bar, the row and the row's head fade */
  body.focus .box.sel .bottombar{
    display:flex; align-items:flex-end; gap:var(--sp-s); flex:none;
    margin:0 calc(var(--pad-x)*2/3) 0 calc(var(--pad-x)*2/3);
    border-top:var(--edge) solid var(--line);
    background:var(--card);
  }
  body.focus .box.sel .compose{
    flex:1 1 auto; min-width:0; gap:var(--sp-x); align-items:flex-end;
    background:none; border:none; border-radius:0; box-shadow:none;
    padding:0; margin:0;
  }
  body.focus .box.sel textarea{
    background:transparent; border:none !important; box-shadow:none;
    padding:var(--sp-s) 4px; margin:0 calc(-4px - var(--sbar)) 0 -4px;
    font-size:17px; line-height:1.5;
    max-height:calc(var(--ch)*0.28); overflow-y:auto; min-height:var(--row-min);
  }
  body.focus .box.sel textarea.upfade{
    --upair:clamp(0px, calc(var(--upband, 0px) - var(--replyfade)), var(--replyair));
    --upramp:min(var(--upband, 0px), var(--replyfade));
    -webkit-mask-image:linear-gradient(to bottom,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) var(--upair),
      rgba(0,0,0,.35) calc(var(--upair) + var(--upramp)*.38),
      rgba(0,0,0,.80) calc(var(--upair) + var(--upramp)*.72),
      rgba(0,0,0,1) calc(var(--upair) + var(--upramp)));
    mask-image:linear-gradient(to bottom,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) var(--upair),
      rgba(0,0,0,.35) calc(var(--upair) + var(--upramp)*.38),
      rgba(0,0,0,.80) calc(var(--upair) + var(--upramp)*.72),
      rgba(0,0,0,1) calc(var(--upair) + var(--upramp)));
  }

  /* the send square, the plus, its picker and the note line */
  body.focus .box.sel .sendbtn{
    flex:none; width:28px; height:28px; min-height:0; padding:0; border:none;
    background:var(--card); color:#000;
    display:grid; place-items:center; line-height:1; cursor:pointer;
    opacity:0; transform:scale(.5); pointer-events:none;
    transition:opacity .26s var(--gentle), transform .26s var(--gentle);
  }
  body.focus .box.sel .sendbtn.show{opacity:1; transform:scale(1); pointer-events:auto}
  body.focus .box.sel .sendbtn:hover{background:color-mix(in srgb, #000 var(--press), var(--card))}
  body.focus .box.sel .sendbtn:active{transform:scale(1)}
  body.focus .box.sel .clipbtn{
    flex:none; width:28px; height:var(--row-min); padding:0; border:none;
    background:none; border-radius:var(--sq);
    display:grid; place-items:center; line-height:1; cursor:pointer;
    color:var(--ink);
    position:relative; isolation:isolate;
    transition:transform .11s var(--gentle);
  }
  body.focus .box.sel .clipbtn::before{
    content:""; position:absolute; z-index:-1;

    mask-image:linear-gradient(to bottom,
      rgba(0,0,0,0) 0,

  body.focus{

<div id="tickets"><div id="tikhead"><div id="tiknames"><div id="tiklabels"><div class="tikpair"><button id="tv-todo" class="ptab tvb on">Doing</button><button id="tv-docked" class="ptab tvb" type="button">Docked</button></div><div class="tikpair"><button id="tv-deferred" inert aria-hidden="true" class="ptab tvb">Deferred</button><button id="tv-done" inert aria-hidden="true" class="ptab tvb">Done</button></div></div></div><button id="tik-page-back" class="qn-glass tik-page back" type="button" aria-label="show Doing and Docked" title="Doing and Docked" aria-disabled="true" tabindex="-1"></button><button id="tik-page" class="qn-glass tik-page" type="button" aria-label="show Deferred and Done" title="Deferred and Done"></button></div><div id="tiklist"><div id="tiksheet"><div class="tikpane" data-view="todo"></div><div class="tikpane" data-view="docked"></div><div class="tikpane" data-view="deferred"></div><div class="tikpane" data-view="done"></div></div></div></div>
<script>
// ---- what card-logic.js reads off the page it runs in -----------------------
// the board's names for its state, its selected card and its cards, as
// index.html has them. the state is the board's reading of each card cut down
// to what card-logic.js asks of it here: the reply on show and the messages it
// answered, which is what the way back from an older reply reads (histExit),
// and whether the card is working, which the spinner's clock reads. each also
// carries what the ticket list reads of a card (its lane, title, whose turn
// it is, its replies and when the last came), set below
let lastState = { boxes: [] };
let selectedId = null;
const els = {};
// the project on show and the task picked by its dot (activeOwner and selectedTask in index.html).
// the onboarding is a lane of its own, and no task is picked
let activeOwner = "onboarding";
let selectedTask = null;
// the board's way to show and select a card (select in index.html); here it
// is the onboarding's own move, set below. a click on a ticket comes here
let select = () => {};
// the formatted composer (compose-format.js) is not loaded: it fetches its
// editor from the board's server root, which a file page has not got, and the
// board keeps it off unless it is turned on. the row is the plain textarea, and
// these two answers are all card-logic.js asks the formatter about it
const ComposeFormat = { focused: ta => document.activeElement === ta, fieldOf: () => null };

// ---- copied from index.html, where these live inline ------------------------
// boxHasSelection
function boxHasSelection(el){
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return false;
  for (let i = 0; i < sel.rangeCount; i++){
    const r = sel.getRangeAt(i);
    if (!r.collapsed && r.intersectsNode(el)) return true;
  }
  return false;
}
// boxBand and watchBand: the band the answer's foot fade is cut to, under the sent panel and the row
function boxBand(reply, wrap, skip = 0){
  const clear = parseFloat(getComputedStyle(reply).marginBottom) || 0;
  const b = reply.getBoundingClientRect().bottom -
            (wrap.getBoundingClientRect().top + skip - clear);
  return Math.max(0, Math.round(b));
}
function watchBand(el){
  const write = () => {
    const band = sentBand(el, boxBand(el.replyview, el.pendwrap));
    if (band === el.bandAt) return;
    el.bandAt = band;
    el.box.style.setProperty("--boxband", band + "px");
  };
  el.bandWrite = write;
  if (window.ResizeObserver){
    const ro = new ResizeObserver(write);
    ro.observe(el.pendwrap);
    ro.observe(el.replyview);
    if (el.replyview.parentElement) ro.observe(el.replyview.parentElement);
  }
  write();
}
// riseBand and watchRise: the fade at the head of a scroller, as far as it has scrolled
function riseBand(node){
  if (!node._fade || node._air == null){
    const cs = getComputedStyle(node);
    const fade = parseFloat(cs.getPropertyValue("--replyfade")) || 0;
    if (fade){
      node._fade = fade;
      node._air = node.tagName === "TEXTAREA" ? parseFloat(cs.getPropertyValue("--replyair")) || 0 : 0;
    }
  }
  const up = Math.min(Math.round(node.scrollTop), (node._fade || 0) + (node._air || 0));
  if (up === node._up) return;
  node._up = up;
  node.style.setProperty("--upband", up + "px");
  node.classList.toggle("upfade", up > 0);
}
function watchRise(node){
  node.addEventListener("scroll", () => riseBand(node), { passive: true });
  riseBand(node);
}
// sentMarkAct: the arrow and the cross on a send that did not get through. nothing
// sent here can fail to get through, so neither is ever drawn
function sentMarkAct(){}
// the reply history's chevron
const CHEV_PATH = '<path d="M1 5.5 5.5 1.5 10 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
function historyChevronSVG(){
  return '<svg class="histchev" width="11" height="7" viewBox="0 0 11 7"' +
         ' fill="none" aria-hidden="true">' + CHEV_PATH + "</svg>";
}
// paintTicketPane: one section of the ticket list, drawn when its signature
// changes, its rows' classes read off the card's one state (queueState and
// cardState in card-logic.js) and what the reader has read of it (seenReplies)
function paintTicketPane(pane, pool, view, state, laneSig){
  const sig = view + "|" + laneSig + "|" +
              pool.map(b => b.id + b.ball + (b.writing ? "w" : "") + (b.bg ? "g" : "") + (b.done ? "d" : "") + b.pending +
                      ((seenReplies[b.id] || 0) >= (b.replies || 0) ? "r" : "") +
                      (b.id === selectedId ? "!" : "") + (b.task || "") + b.title +
                      (testReady(b) ? "T" : "") +
                      Math.floor((Date.now() / 1000 - (b.agentTs || 0)) / 60)).join(",") +
              "|" + selectedTask;
  if (pane.dataset.sig === sig) return;
  pane.dataset.sig = sig;
  const selectedBefore = pane.querySelector(".trow.on")?.dataset.id;
  const keepScroll = pane.scrollTop;
  const oldPos = {};
  for (const prev of pane.children) if (prev.dataset && prev.dataset.id) oldPos[prev.dataset.id] = prev.getBoundingClientRect().top;
  pane.textContent = "";
  for (const b of pool){
    const s = queueState(b);
    const busy = s === "working" || (s === "done" && cardState({ ...b, done: false, parked: false, state: null }) === "working");
    const read = seenReplies[b.id] || 0;
    const isYours = s === "yours" || (s === "new" && b.ball === "you");
    const isMatch = selectedTask && b.task === selectedTask;
    const isTest = testReady(b);
    const r = h("div", "trow" + (b.id === selectedId ? " on" : "") + (busy ? " working" : "") +
                (s === "yours" && read >= (b.replies || 0) ? " seen" : "") +
                (isYours ? " yours" : "") +
                (s === "queued" || (s === "new" && b.ball !== "you") ? " queuedc" : "") +
                (s === "done" ? " donec" : "") +
                (isMatch ? " match" : "") +
                (isTest ? " testc" : ""));
    const inner = h("div", "trowin");
    const omni = appendOmniRowArt(r, inner, b);
    const ttl = h("div", "ttl", b.title);
    inner.appendChild(ttl);
    const meta = h("div", "tmeta");
    meta.appendChild(h("span", "tage", busy ? spinGlyph(b.id, b) : s === "done" ? "done" : shortAge(b.agentTs)));
    const ag = state.agents?.[b.owner];
    meta.appendChild(h("span", "teng", ag ? (ag.alive ? ag.name : "offline") : ""));
    inner.appendChild(meta);
    r.appendChild(inner);
    r.dataset.id = b.id;
    r.addEventListener("click", e => { if (isTest && onFold(r, e)) unfoldTicket(b.id); else select(b.id); });
    pane.appendChild(r);
  }
  if (!pool.length) pane.appendChild(h("div", "tempty", view === "done" ? "no done chats yet" : view === "docked" ? "no docked chats yet" : view === "deferred" ? "no deferred chats yet" : "no open chats here"));
  pane.scrollTop = keepScroll;
  // surviving rows glide to their new spots, instead of teleporting on a re-sort
  for (const row of pane.children){
    const was = row.dataset && oldPos[row.dataset.id];
    if (was == null) continue;
    const dy = was - row.getBoundingClientRect().top;
    if (Math.abs(dy) < 2) continue;
    row.style.transition = "none";
    row.style.transform = "translateY(" + dy + "px)";
    void row.offsetHeight;
    row.style.transition = "transform 220ms cubic-bezier(0.25, 1, 0.5, 1)";
    row.style.transform = "";
    row.addEventListener("transitionend", () => { row.style.transition = ""; }, { once: true });
  }
  // reveal a newly selected row only in the section on show
  if (selectedBefore !== selectedId && view === curView())
    pane.querySelector(".trow.on")?.scrollIntoView({ block: "nearest" });
}
// tickBands: each section's top and foot fade, as deep as it can still scroll
function tickBands(pane){
  if (!pane._fade) pane._fade = parseFloat(getComputedStyle(pane).getPropertyValue("--listfade")) || 0;
  const up = Math.min(Math.round(pane.scrollTop), pane._fade);
  const down = Math.min(Math.max(0, Math.round(pane.scrollHeight - pane.clientHeight - pane.scrollTop)), pane._fade);
  if (up !== pane._up){ pane._up = up; pane.style.setProperty("--upband", up + "px"); }
  if (down !== pane._down){ pane._down = down; pane.style.setProperty("--downband", down + "px"); }
}
for (const pane of document.querySelectorAll(".tikpane")){
  const read = () => tickBands(pane);
  pane.addEventListener("scroll", read, { passive: true });
  new MutationObserver(read).observe(pane, { childList: true });
  if (window.ResizeObserver) new ResizeObserver(read).observe(pane);
  read();
}

// ---- the onboarding ------------------------------------------------------------
(() => {
  // the knobs
  // the board's own version (#npversion in index.html), which the server writes in
  const VERSION = document.querySelector('meta[name="facilitator-version"]')?.content || "";
  const LOGO = "/m-splash-squid.png";
  // where the Tab hint stands: the card's answer (reply), a ghost after the
  // title's last letter (title), the empty reply box (box) or the top bar (bar)
  const HINT_SPOTS = ["reply", "title", "box", "bar"];
  const asked = new URLSearchParams(location.search).get("hint") || (/hint=(\w+)/.exec(location.hash) || [])[1];
  const HINT = HINT_SPOTS.includes(asked) ? asked : "reply";
  // the four chips a card in Doing wears, drawn; only the closing card's cross
  // is wired, to the done it makes on the board
  const SHOW_CHIPS = true;
  // the card from which on the board's ticket list stands beside the card
  const BOARD_FROM = "email";

  // the words. a key's name is bold wherever a card names one, and nothing
  // else on these cards is; its words are held together, so a key is never
  // broken over two lines
  const key = name => "**" + name.replace(/ /g, "\u00a0") + "**";
  const BLURB = "Facilitator helps you ship more by making it easier to interact with and orchestrate subagents.";
  const WELCOME = BLURB + "\n\nPress " + key("→") + " for the next card.";
  const TAB_HINT = "Press " + key("Tab") + " to answer.";
  const TAB_HINT_PLAIN = "Press Tab to answer";
  // what each answer's reply teaches, one key new on each card, in the order
  // the cards come. every key is one the board answers (CARD_SHORTCUT_DEFINITIONS
  // in card-logic.js, and RUNBOOK.md's "Browsing and selecting cards")
  const TEACH = {
    name: "Press " + key("Control + Shift + →") + " for the next card.",
    email: "Press " + key("Escape") + " to leave the reply box, then " + key("→") + " for the next card.",
    work: "To change an earlier answer, go back with " + key("Control + Shift + ←") + " and send it again. " +
          "Press " + key("Control + Shift + ↑") + " to see this card's earlier replies, and " +
          key("Control + Shift + ↓") + " to come back. " + key("Control + Shift + →") + " goes on.",
    agent: "Press " + key("Control + Shift + Enter") + " for the card that has waited longest for you. " +
           "With words in the reply box, it sends them first.",
  };
  const FINISH = "Press " + key("Control + Shift + Backspace") + " to mark this card done and open your board.";
  // what the email card says before it is answered: who gets the address and
  // the answers that go with it, why, and that it may be left unanswered
  const EMAIL_ASK = "Your email, your answers here and your time zone go to PostHog, " +
                    "so Facilitator's maker can ask you for feedback. You can skip this one.";
  // the main agent's choices. what anyone types that is not one of them is kept
  // as typed. the work question has none: its answer is the person's own words
  const AGENTS = ["Claude Code", "Codex"];
  const numbered = list => list.map((one, i) => (i + 1) + ". " + one).join("\n");
  // field is where the answer is kept, noun what a correction calls it
  const CARDS = [
    { id: "welcome", title: "Welcome!" },
    { id: "name", title: "What should we call you?", field: "name", noun: "name" },
    { id: "email", title: "What's your email?", field: "email", noun: "email", ask: EMAIL_ASK },
    { id: "work", title: "What will you mostly use Facilitator for?", field: "work", noun: "answer" },
    { id: "agent", title: "Which agent do you use most?", field: "agent", noun: "main agent",
      choices: AGENTS, ask: numbered(AGENTS) + "\n\nSend a number or a name." },
    { id: "done", title: "You're all set!", closing: true },
  ];

  // the answers, held in this page until the closing card is marked done,
  // when they are saved as the board's profile. the time zone is not asked:
  // it is read off the machine the page runs on, and shown on the closing card
  const profile = { name: null, email: null, work: null, agent: null, timeZone: null };
  try { profile.timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch (e) {}
  window.onboardingProfile = profile;

  // the marks the board draws on its chips and in its bar (index.html's PLUS_ICON,
  // SEND_ICON and moon; the sun and the cloud are card-logic.js's own)
  const PLUS_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>';
  const SEND_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 11.5V3.5M3.6 6.9 7 3.5l3.4 3.4" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';

  document.body.classList.add("hint-" + HINT);
  // the board's own paper, its background colour, read off the board this page
  // is laid over; opened on its own the page keeps the sheet's
  try {
    const paper = parent !== window && parent.getComputedStyle(parent.document.body).getPropertyValue("--paper").trim();
    if (paper) document.body.style.setProperty("--paper", paper);
  } catch (e) {}
  const sections = document.getElementById("sections");
  let caretQueue = () => {};

  // ---- one card, built the way makeBox builds one (in index.html) ------
  function makeCard(spec){
    const box = h("article", "box");
    box.id = "box-" + spec.id;   // the spinner reads its card's id after "box-"
    const topbar = h("div", "topbar");
    if (!SHOW_CHIPS) topbar.classList.add("obbare");
    const barHint = h("span", "obbarhint");
    // the reply history (in index.html): hidden until the card has an
    // older reply to step back to
    const histctl = h("div", "histctl");
    histctl.setAttribute("role", "group");
    histctl.setAttribute("aria-label", "reply history");
    histctl.setAttribute("aria-hidden", "true");
    const histUp = h("button", "histbtn older");
    histUp.type = "button";
    histUp.title = "older reply";
    histUp.setAttribute("aria-label", "older reply");
    histUp.innerHTML = historyChevronSVG();
    const histDown = h("button", "histbtn newer");
    histDown.type = "button";
    histDown.title = "newer reply";
    histDown.setAttribute("aria-label", "newer reply");
    histDown.innerHTML = historyChevronSVG();
    const histPos = h("span", "histpos");
    histUp.disabled = histDown.disabled = true;
    histUp.tabIndex = histDown.tabIndex = -1;
    histctl.append(histUp, histDown, histPos);
    const sun = h("button", "sunbtn");
    sun.innerHTML = SUN_ICON;
    sun.setAttribute("aria-disabled", "true");   // the chip of the section the card stands in
    const dock = h("button", "dockbtn");
    dock.innerHTML = DOCK_ICON;
    const cardSpin = makeCardSpinner();
    const arc = h("button", "arcbtn");
    arc.innerHTML = MOON_ICON;
    const x = h("button", "xbtn", "×");
    x.setAttribute("aria-label", "done");
    for (const chip of [sun, dock, arc, x]){ chip.type = "button"; chip.tabIndex = -1; }
    topbar.append(histctl, barHint, sun, dock, cardSpin, arc, x);
    box.appendChild(topbar);

    const head = h("div", "head");
    const titleEl = h("span", "title", spec.title);
    head.appendChild(titleEl);
    box.appendChild(head);

    const body = h("div", "body");
    const replyview = h("div", "replyview");
    const reply = h("div", "reply cardmd");
    const answwrap = h("div", "answwrap");
    const meta = h("div", "meta");
    const metaNote = h("span");
    meta.append(metaNote);
    const pendwrap = h("div", "pendwrap");
    const sentwrap = h("div", "sentwrap");
    const bottombar = h("div", "bottombar");
    const clip = h("button", "clipbtn");
    clip.type = "button";
    clip.tabIndex = -1;
    clip.setAttribute("aria-label", "attach a file");
    clip.innerHTML = PLUS_ICON;
    const compose = h("div", "compose");
    const ta = h("textarea");
    ta.rows = 1;
    const send = h("button", "sendbtn");
    send.type = "button";
    send.tabIndex = -1;
    send.setAttribute("aria-label", "send");
    send.innerHTML = SEND_ICON;
    compose.append(ta, send);
    bottombar.append(clip, compose);
    pendwrap.append(meta, sentwrap, bottombar);
    replyview.append(answwrap, reply);
    body.append(replyview, pendwrap);
    box.appendChild(body);
    sections.appendChild(box);

    const el = { box, topbar, barHint, titleEl, reply, replyview, meta, metaNote,
                 histctl, histPos, histUp, histDown, hasHistory: false,
                 answwrap, answ: null, answId: null,
                 sentwrap, sent: null, sentKey: "", sentItems: [],
                 pendwrap, bottombar, clip, ta, send, sun, dock, arc, x, cardSpin };
    // the row's own autosize and the send square's seat, as the board's tick
    el.tick = () => {
      if (!ta.offsetParent || !ta.clientHeight) return;
      ta.style.height = "auto";
      ta.style.height = ta.scrollHeight + "px";
      seatSquare(ta, send);
      send.classList.toggle("show", ta.value.trim().length > 0);
      riseBand(ta);
    };
    el.sentRoom = () => { if (el.bandWrite) el.bandWrite(); };
    els[spec.id] = el;
    watchBand(el);
    watchRise(replyview);
    watchRise(ta);
    watchReading(el);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(el.tick);
    return el;
  }

  // a reply is the card's markdown
  function render(el, raw){
    el.reply.dataset.raw = raw;
    el.reply.innerHTML = fmt(raw);
  }

  // every card's words were written when the run began: the question, the
  // Welcome and the closing card are each an agent's reply waiting on the reader
  const RUN_BEGAN = Date.now() / 1000;
  const cards = CARDS.map(spec => {
    const card = { spec, el: makeCard(spec), value: null, pending: [], replyTimer: 0, held: null, replies: 0, pages: [] };
    const el = card.el;
    lastState.boxes.push({ id: spec.id, replyKind: "agent", replyId: null, answered: null, writing: false,
                           owner: activeOwner, title: spec.title, ball: "you", replies: 1, pending: 0,
                           agentTs: RUN_BEGAN, ts: RUN_BEGAN });
    if (!spec.field){
      // the Welcome and closing cards ask nothing, so their reply boxes take nothing
      el.ta.disabled = true;
      el.ta.tabIndex = -1;
      if (spec.closing){
        // the cross on the closing card marks it done, as Control + Shift + Backspace does
        el.x.addEventListener("click", finish);
        return card;
      }
      // the Welcome card: the lockup, the blurb and the key
      el.reply.dataset.raw = WELCOME;
      el.reply.innerHTML = '<div class="obbrand"><span class="squidmark"><img src="' + LOGO + '" alt=""></span>' +
        '<span class="obbrandcopy"><span class="obbrandname">Facilitator</span>' +
        '<span class="obversion">' + VERSION + "</span></span></div>" + fmt(WELCOME);
      return card;
    }
    el.box.classList.add("obwait");
    const ask = [spec.ask, HINT === "reply" ? TAB_HINT : ""].filter(Boolean).join("\n\n");
    render(el, ask);
    // the question as first asked is the card's first page, so a history
    // step can come back to it. an empty one is not a page
    if (ask) card.pages.push({ raw: ask, meta: null });
    wireQuestion(card);
    return card;
  });
  let at = 0, finished = false;
  const boxOf = card => lastState.boxes.find(b => b.id === card.spec.id);

  // ---- a question card --------------------------------------------------------
  function wireQuestion(card){
    const el = card.el, t = el.titleEl, ta = el.ta;
    // the title holds the caret the way the board's title does while it is
    // being named (editTitle in card-logic.js), but the question is not the
    // reader's to change: whatever is typed into it is refused, and the hint
    // is called back to instead
    t.setAttribute("contenteditable", "plaintext-only");
    t.spellcheck = false;
    t.addEventListener("focus", () => el.box.classList.add("obintitle"));
    t.addEventListener("blur", () => el.box.classList.remove("obintitle"));
    t.addEventListener("beforeinput", e => { e.preventDefault(); nudge(card); });
    t.addEventListener("paste", e => e.preventDefault());
    t.addEventListener("drop", e => e.preventDefault());
    // a composition (an accented letter, a non latin keyboard) cannot be refused before
    // it lands, so it is taken back after
    t.addEventListener("input", () => {
      if (t.textContent === card.spec.title) return;
      t.textContent = card.spec.title;
      caretToTitleEnd(t);
    });
    // Enter and Escape take the caret to the reply box, as they do from the
    // board's title, and go no further
    t.addEventListener("keydown", e => {
      if ((e.key === "Enter" && !e.altKey) || e.key === "Escape"){
        e.preventDefault();
        e.stopPropagation();
        ta.focus();
      }
    });
    ta.addEventListener("input", () => { el.tick(); noteTyping(ta); });
    // Enter sends and Shift + Enter is a new line; Control + Shift + Enter sends
    // what the box holds and then moves on, or only moves with the box empty
    // (composerEnter in index.html). Control + Enter alone is the system's
    ta.addEventListener("keydown", e => {
      const now = controlShiftEnter(e);
      if (e.key !== "Enter" || (e.shiftKey && !now) || e.altKey || e.isComposing || bareControlEnter(e)) return;
      e.preventDefault();
      if (e.repeat) return;
      sendFrom(card);
      // the board moves once it has the message, which here it has at the press
      if (now) advance();
    });
    for (const node of [el.send, el.clip])
      node.addEventListener("pointerdown", e => { if (document.activeElement === ta) e.preventDefault(); });
    el.send.addEventListener("click", () => sendFrom(card));
    el.histUp.addEventListener("click", () => stepHistory(card, 1));
    el.histDown.addEventListener("click", () => stepHistory(card, -1));
    ta.addEventListener("focus", () => paintHint(card));
    ta.addEventListener("blur", () => paintHint(card));
    paintHint(card);
  }

  // the ghost after the question (?hint=title) needs 24px and its own width
  // after the last letter; a last line that leaves less sends it under the line
  const ghostPen = document.createElement("canvas").getContext("2d");
  function seatGhost(card){
    if (HINT !== "title" || !card.spec.field) return;
    const t = card.el.titleEl, text = t.firstChild;
    if (!text || text.nodeType !== 3 || !text.length || !t.getClientRects().length) return;
    const rg = document.createRange();
    rg.setStart(text, text.length - 1);
    rg.setEnd(text, text.length);
    const end = [...rg.getClientRects()].pop();
    if (!end) return;
    const cs = getComputedStyle(t);
    ghostPen.font = "400 13px " + getComputedStyle(document.body).getPropertyValue("--inter");
    const room = t.getBoundingClientRect().right - parseFloat(cs.paddingRight) - end.right;
    card.el.box.classList.toggle("obghostdown", room < 24 + ghostPen.measureText("Tab to answer").width);
  }

  // the hint stands while the question is unanswered, wherever it stands
  function paintHint(card){
    const el = card.el, wait = !!card.spec.field && card.value == null;
    el.box.classList.toggle("obwait", wait);
    if (HINT === "box") el.ta.placeholder = wait && document.activeElement !== el.ta ? TAB_HINT_PLAIN + " here" : "";
    if (HINT === "bar") el.barHint.textContent = wait ? TAB_HINT_PLAIN : "";
  }
  function nudge(card){
    const el = card.el;
    if (HINT === "reply"){ printReply(el); return; }
    const node = HINT === "title" ? el.titleEl : HINT === "box" ? el.ta : el.barHint;
    node.classList.remove("obnudge");
    void node.offsetWidth;   // a nudge still going starts again
    node.classList.add("obnudge");
    clearTimeout(node.nudgeTimer);
    node.nudgeTimer = setTimeout(() => node.classList.remove("obnudge"), PRINT_MS + 60);
  }

  // what the reader typed, as the reply says it back: one line, no closing
  // stop of its own, and every character the card's markdown would read as
  // markup escaped (card-markdown.js renderInline)
  function said(text){
    const line = text.replace(/\s+/g, " ").trim();
    return line.replace(/[\s.]+$/, "") || line;
  }
  function plain(text){ return String(text).replace(/[\\`*_[\]{}()#+\-.!~|]/g, "\\$&"); }

  // the answer a message gives: on a choice, a number or the choice's own
  // words (or its first word) pick it. anything else is kept as it was typed,
  // so nothing is refused
  function readAnswer(card, text){
    const spec = card.spec, line = said(text), low = line.toLowerCase();
    if (spec.choices){
      const n = /^#?(\d+)$/.exec(line);
      if (n && +n[1] >= 1 && +n[1] <= spec.choices.length) return spec.choices[+n[1] - 1];
      const hit = spec.choices.find(c => c.toLowerCase() === low) ||
                  spec.choices.find(c => c.toLowerCase().split(" ")[0] === low);
      if (hit) return hit;
    }
    return line;
  }

  // ---- sending, and the answer ---------------------------------------------------
  function sendFrom(card){
    const el = card.el;
    const text = el.ta.value.trim();
    if (!text) return false;
    // the board's own order (doSend in index.html): the flight is armed off the
    // row before the row is emptied, the message comes into the sent panel at
    // the press, faded, and the flight plays once it has its seat there
    const motion = armSentMotion(el);
    el.ta.value = "";
    el.tick();
    const item = sentLaunch(el, text, "");
    motion?.play();
    el.metaNote.textContent = "";
    caretQueue();
    card.pending.push(item);
    // nothing stands between the send and its answer: no Delivered, no Read
    // and no working spinner. the send ends the typing, so the two quiet
    // seconds the board leaves after the last key (TYPE_QUIET_MS in
    // card-logic.js) do not hold the answer back
    el.ta.typedAt = 0;
    answerOnLanding(card);
    return true;
  }
  // the answer comes the moment the send's flight has landed (SENT_FLIGHT_MS,
  // 650ms). the board holds a new answer while a bubble is in flight
  // (turnHolding), and an answer drawn sooner would take the bubble the flight
  // is landing on away and cut the flight short. it comes once, after the last
  // of a run of sends, and answers them all
  function answerOnLanding(card){
    const el = card.el;
    cancelAnimationFrame(card.replyTimer);
    const look = () => {
      card.replyTimer = 0;
      if (el.sentMotions && el.sentMotions.size){ card.replyTimer = requestAnimationFrame(look); return; }
      answer(card);
    };
    look();
  }

  // the newest message is the answer. a card answered before says it has
  // changed it, which is the whole of correcting one: send it again
  function answer(card){
    const batch = card.pending.splice(0);
    if (!batch.length) return;
    for (const m of batch) sentSettled(card.el);   // each message is the board's as it is answered
    const value = readAnswer(card, batch[batch.length - 1].text);
    const first = card.value == null;
    card.value = value;
    profile[card.spec.field] = value;
    paintHint(card);
    const words = plain(value);
    const head = first ? "Got it, " + words + "." : "Changed your " + card.spec.noun + " to " + words + ".";
    const raw = [head, TEACH[card.spec.field]].filter(Boolean).join("\n\n");
    land(card, { id: card.spec.id, replyKind: "agent", replyId: card.spec.id + "." + (++card.replies),
                 answered: batch.map(m => ({ text: m.text })), raw });
  }

  // the board's pass over a card whose answer has changed (apply in
  // index.html): the turn is begun before anything of the new page is drawn,
  // the new page is drawn under it, and then it glides
  function land(card, b){
    const el = card.el;
    const turn = turnBegin(el, b);
    if (turn === TURN_HELD){ card.held = b; return; }
    card.held = null;
    card.pages.push({ raw: b.raw, meta: { id: b.replyId, answered: b.answered } });
    keepHistory(card);
    render(el, b.raw);
    if (!turn) headOnSwap(el, b);
    el.sentItems = [];
    syncSent(el, el.sentItems);
    syncAnswered(el, { id: b.replyId, answered: b.answered });
    // the ticket: one more reply, just now, and read, since it answers what
    // the reader has just written
    const box = boxOf(card), now = Date.now() / 1000;
    Object.assign(box, { replyId: b.replyId, answered: b.answered, replies: box.replies + 1, agentTs: now, ts: now });
    seenReplies[card.spec.id] = box.replies;
    turnGo(el, turn);
    caretQueue();
    drawClosing(true);
    paintTickets();
  }
  // a new answer held back while the reader was busy with the card is drawn
  // once they have let it be (turnHold in card-logic.js)
  turnAgain = () => { for (const card of cards) if (card.held) land(card, card.held); };

  // ---- the reply history --------------------------------------------------------
  // the board asks itself for a card's older replies (histList in
  // card-logic.js); here they are the card's own pages, handed to the same
  // cache histStep reads, and the arrows come and go as the board's do
  // (setDesktopHistoryAvailability in index.html)
  function keepHistory(card){
    const el = card.el, older = card.pages.slice(0, -1);
    const list = older.map(p => p.raw);
    list.meta = older.map(p => p.meta || {});
    histCache[card.spec.id] = Promise.resolve(list);
    const has = list.length > 0;
    if (el.hasHistory === has) return;
    el.hasHistory = has;
    el.box.classList.toggle("hashist", has);
    el.histctl.setAttribute("aria-hidden", has ? "false" : "true");
    el.histUp.disabled = !has;
    el.histDown.disabled = true;
  }
  function stepHistory(card, dir){
    if (!card.spec.field || card.spec.id !== selectedId) return;
    histStep(card.spec.id, dir);
  }
  function leaveHistory(){
    if (!hist) return;
    histExit(hist.id);
  }

  // ---- the closing card ---------------------------------------------------------
  // what was kept, and the key that ends the run. it is
  // drawn when it is shown and again when an answer lands while it is
  function closingRaw(){
    const rows = [["Name", profile.name], ["Email", profile.email],
                  ["Work", profile.work], ["Main agent", profile.agent]];
    const list = rows.map(([k, v]) => "- " + k + ": " + (v == null ? "not answered" : plain(v)));
    if (profile.timeZone) list.push("- Time zone: " + plain(profile.timeZone) + ", from your Mac");
    return [list.join("\n"), FINISH].join("\n\n");
  }
  function drawClosing(print){
    const card = cards.find(c => c.spec.closing), el = card.el;
    const raw = closingRaw();
    if (el.reply.dataset.raw === raw) return;
    render(el, raw);
    if (print && cards[at] === card && !finished) printReply(el);
  }
  // ---- the end: the profile, and the board ------------------------------------
  // the run opens the sample project as its project at the start: the folder
  // made the first time it is missing (POST /onboarding/sample), then its tab,
  // found where it is already the board's or made the way the home page's
  // "Open a new folder" makes one. the board lands on that tab at the end
  const projectReady = (async () => {
    try {
      const made = await (await fetch("/onboarding/sample", { method: "POST" })).json();
      if (!made || !made.path) return null;
      const st = await (await fetch("/state")).json();
      const open = Object.entries(st.pwds || {}).find(([, dir]) => dir === made.path);
      if (open) return open[0];
      const name = made.path.split("/").filter(Boolean).pop();
      const px = await fetch("/project?name=" + encodeURIComponent(name), { method: "POST", body: made.path });
      const pr = await px.json().catch(() => null);
      return px.ok && pr && pr.id ? pr.id : null;
    } catch (e) {
      return null;
    }
  })();
  // the same rule as the board's (clean_email in usage_counts.py): an email
  // answer that is not an address is kept on the closing card as typed, and
  // saved as no email, with no yes
  const ADDRESS = /^[^@\s\x00-\x1f\x7f]+@[^@\s\x00-\x1f\x7f]+\.[^@\s\x00-\x1f\x7f]+$/;
  const address = text => text && text.length <= 254 && ADDRESS.test(text) ? text : null;
  // the closing card closed: the answers are saved as the profile, an email
  // given being the yes to feedback mail, and the card goes, the ticket list
  // with it. the board then takes the frame away onto the sample project. the
  // profile needs a name, so the key without one goes to the name card, and a
  // save that does not land calls the key back, to be pressed again
  let saving = false;
  async function finish(){
    if (finished || saving) return;
    if (!profile.name){
      show(cards.findIndex(c => c.spec.id === "name"));
      nudge(cards[at]);
      return;
    }
    saving = true;
    const email = address(profile.email);
    const body = { name: profile.name.slice(0, 200), email, emailYes: email != null,
                   work: profile.work && profile.work.slice(0, 2000), agent: profile.agent && profile.agent.slice(0, 100),
                   timeZone: profile.timeZone };
    let saved = false;
    try { saved = (await fetch("/profile", { method: "POST", body: JSON.stringify(body) })).ok; } catch (e) {}
    saving = false;
    if (!saved){ printReply(cards[at].el); return; }
    finished = true;
    document.body.classList.add("obdone");
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    caretQueue();
    const project = await projectReady;
    if (parent !== window) parent.postMessage({ onboarding: "done", project }, location.origin);
    else setTimeout(() => location.replace("/"), 180);
  }

  // ---- moving between cards -----------------------------------------------------
  function show(i){
    const card = cards[i], el = card.el;
    if (hist && hist.id !== card.spec.id) leaveHistory();
    at = i;
    selectedId = card.spec.id;
    for (const c of cards) c.el.box.classList.toggle("sel", c === card);
    // from the email card on, the card stands at its place on the board and
    // the ticket list comes in beside it; the card's own ticket is lifted
    document.body.classList.toggle("obboard", i >= cards.findIndex(c => c.spec.id === BOARD_FROM));
    paintTickets();
    if (card.spec.closing) drawClosing(false);
    openAtHead(el);
    el.tick();
    if (el.bandWrite) el.bandWrite();
    seatGhost(card);
    // where the caret lands: nowhere on the Welcome and closing cards, so the
    // plain arrows are free; at the end of the question on a card still to be
    // answered; in the reply box on one answered or on its way, where the
    // reader left it
    if (!card.spec.field){
      if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    } else if (card.value == null && !card.pending.length) caretToTitleEnd(el.titleEl);
    else el.ta.focus({ preventScroll: true });
    caretQueue();
  }
  function caretToTitleEnd(t){
    t.focus({ preventScroll: true });
    const range = document.createRange();
    range.selectNodeContents(t);
    range.collapse(false);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  // a step either way, answered or not: no question has to be answered to
  // move on. past the closing card there is no card, and its key is called
  // back to instead. once done there is nowhere to go: the board is opening
  function go(step){
    if (finished) return;
    const next = at + step;
    if (next < 0) return;
    if (next >= cards.length){ printReply(cards[at].el); return; }
    show(next);
  }
  // Control + Shift + Enter: the card that has waited longest for the reader
  // (jumpNextYellow in card-logic.js). every card here has waited since the
  // run began, so the list's own order breaks the tie: the first question
  // still unanswered and not on its way, and once none is, the closing card
  function advance(){
    if (finished) return;
    const from = cards[at];
    const waiting = cards.find(c => c !== from && c.spec.field && c.value == null && !c.pending.length) ||
                    cards.find(c => c !== from && c.spec.closing);
    if (waiting) show(cards.indexOf(waiting));
  }

  // ---- the ticket list ------------------------------------------------------------
  // one ticket per card, drawn by the board's own renderer (paintTicketPane
  // above) the way the board's renderCarousel in index.html draws
  // its four sections. every card stands in Doing. the board orders Doing by
  // whose turn has waited longest (poolOf in card-logic.js), which would sink
  // an answered card below the rest; here the tickets keep the cards' order
  function paintTickets(){
    const sheet = document.getElementById("tiksheet");
    paintViewTabs();
    for (const name of TICKET_VIEWS){
      const pane = sheet.querySelector('.tikpane[data-view="' + name + '"]');
      if (pane) paintTicketPane(pane, lastState.boxes.filter(b => viewFilterFor(b, name)), name, lastState, "");
    }
    if (tikTravelIntent == null && tikShownView !== curView()) moveTicketSheet(curView(), false);
  }
  // a click on a ticket shows its card, as the board's select does
  select = id => {
    const i = cards.findIndex(c => c.spec.id === id);
    if (i >= 0 && !finished) show(i);
  };
  // the onboarding always opens on Doing, whatever section this browser last
  // chose for a lane of this name
  ticketViews[activeOwner] = TICKET_VIEWS[0];
  // the section names and the triangles, wired as the board wires them
  // (in index.html): a name slides its section into the list, a
  // triangle slides the names, and every name dips while it is pressed
  {
    const setView = v => {
      if (!setTicketViewOf(activeOwner, v)) return;
      chooseTicketNames(v);
      paintViewTabs();
      tikTravelIntent = v;
      paintTickets();
      tikTravelIntent = null;
      moveTicketSheet(v, true);
    };
    document.getElementById("tv-todo").addEventListener("click", () => setView("todo"));
    document.getElementById("tv-docked").addEventListener("click", () => setView("docked"));
    document.getElementById("tik-page-back").addEventListener("click", () => slideTicketNames(0));
    document.getElementById("tik-page").addEventListener("click", () => slideTicketNames(1));
    document.getElementById("tv-deferred").addEventListener("click", () => setView("deferred"));
    document.getElementById("tv-done").addEventListener("click", () => setView("done"));
    const PRESS_MIN = 80;
    for (const name of document.querySelectorAll("#tikhead .tvb")){
      let since = 0, timer = 0;
      const press = () => {
        clearTimeout(timer);
        since = performance.now();
        name.classList.add("pressed");
      };
      const release = () => {
        if (!name.classList.contains("pressed")) return;
        clearTimeout(timer);
        timer = setTimeout(() => name.classList.remove("pressed"), Math.max(0, since + PRESS_MIN - performance.now()));
      };
      name.addEventListener("pointerdown", press);
      for (const type of ["pointerup", "pointercancel", "pointerleave", "blur"]) name.addEventListener(type, release);
      name.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !e.repeat) press(); });
      name.addEventListener("keyup", e => { if (e.key === "Enter" || e.key === " ") release(); });
    }
  }
  // a ticket's age is redrawn when its minute turns, as the board's readings
  // redraw it; the signature leaves every other pass untouched
  setInterval(paintTickets, 10000);

  // the keys, read by the board's own table (cardShortcut in card-logic.js)
  // and answered as the board answers them (boardShortcutActions in
  // index.html): Control + Shift + an arrow from anywhere, a plain arrow,
  // Enter and Control + Shift + Enter only where nothing is being typed, Escape out
  // of the reply box, Control + Shift + ↑ and ↓ through the card's older
  // replies, and the done chord on the closing card. Tab goes between the
  // question and the reply box
  document.addEventListener("keydown", e => {
    const card = cards[at], el = card.el;
    const key = cardShortcut(e);
    const typing = cardShortcutEditing(e.target);
    switch (key && key.action){
      case "navigate":
        e.preventDefault(); go(key.value); return;
      case "plainNavigate":
        if (typing) break;
        e.preventDefault(); go(key.value); return;
      case "history":
        e.preventDefault();
        if (!finished) stepHistory(card, key.value);
        return;
      case "escape":
        if (typing) e.target.blur();
        return;
      case "enter":
        if (typing || finished || !card.spec.field) break;
        if (e.target.closest && e.target.closest("button, a, select, summary, [role], [tabindex]")) break;
        e.preventDefault();
        el.ta.focus({ preventScroll: true });
        return;
      case "advance":
        if (typing) break;
        e.preventDefault();
        if (!e.repeat) advance();
        return;
      case "sectionChord":
        if (key.value !== "done" || !card.spec.closing || finished) break;
        e.preventDefault();
        finish();
        return;
    }
    if (e.key === "Tab" && !e.metaKey && !e.ctrlKey && !e.altKey){
      e.preventDefault();
      if (!card.spec.field || finished) return;
      if (document.activeElement === el.ta) caretToTitleEnd(el.titleEl);
      else el.ta.focus({ preventScroll: true });
    }
  });

  // ---- the block caret, cut down from index.html's fat caret ------
  // the board draws a terminal block over the caret in every field it types in.
  // that code is inline in index.html; this is the part two fields need: the
  // title, where the block stands cap high on the baseline, and the reply box,
  // where it stands 1.1em tall across the line. half an em wide at the end of
  // the words, and the letter's own width over a letter
  {
    const bar = h("div");
    bar.id = "fatcaret";
    const lift = h("div");
    lift.id = "fatcaretlift";
    document.body.append(bar, lift);
    const cells = [bar, lift];
    const hide = () => { for (const cell of cells) cell.classList.remove("on"); };
    const mirror = h("div");
    mirror.style.cssText = "position:fixed; top:0; left:-9999px; visibility:hidden; pointer-events:none";
    document.body.appendChild(mirror);

    // per font: asc is the inline box's top to the baseline, read in the dom;
    // the cell above and below the baseline and the cap height from the canvas
    const mcache = new Map();
    const mctx = document.createElement("canvas").getContext("2d");
    function fmetrics(cs){
      const key = cs.fontStyle + "|" + cs.fontWeight + "|" + cs.fontSize + "|" + cs.fontFamily;
      let m = mcache.get(key);
      if (m) return m;
      const d = h("div");
      d.style.cssText = "position:fixed; left:-9999px; top:0; visibility:hidden; line-height:normal";
      d.style.fontFamily = cs.fontFamily; d.style.fontSize = cs.fontSize;
      d.style.fontWeight = cs.fontWeight; d.style.fontStyle = cs.fontStyle;
      const w = h("span", null, "H");
      const p = h("span");
      p.style.cssText = "display:inline-block; width:0; height:0";
      d.append(w, p);
      document.body.appendChild(d);
      const wr = w.getBoundingClientRect();
      m = { asc: p.getBoundingClientRect().bottom - wr.top };
      d.remove();
      let fbA = NaN, fbD = NaN, capH = NaN;
      try {
        mctx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
        const tm = mctx.measureText("H");
        fbA = tm.fontBoundingBoxAscent; fbD = tm.fontBoundingBoxDescent;
        capH = tm.actualBoundingBoxAscent;
      } catch (e) {}
      if (fbA > 0 && fbD >= 0){ m.fbA = fbA; m.fbD = fbD; }
      else { m.fbA = m.asc; m.fbD = parseFloat(cs.fontSize) * 1.18 - m.asc; }
      m.capH = capH > 0 ? capH : parseFloat(cs.fontSize) * 0.7;
      if (!document.fonts || document.fonts.status === "loaded") mcache.set(key, m);
      return m;
    }
    // the width of the letter after the caret, or nothing at the end of a line
    function advanceOf(node, at){
      if (!node || node.nodeType !== 3 || at >= node.length) return null;
      const code = node.data.codePointAt(at);
      if (code === 10) return null;
      const rg = document.createRange();
      rg.setStart(node, at);
      rg.setEnd(node, at + (code > 0xFFFF ? 2 : 1));
      const rects = [...rg.getClientRects()].filter(r => r.width > 0 && r.height > 0);
      return rects.length === 1 ? rects[0].width : null;
    }
    // the reply box: a mirror of its text up to the caret, laid out as it is
    function fieldCaret(el){
      if (el.selectionStart == null) return null;
      const cs = getComputedStyle(el), r = el.getBoundingClientRect();
      for (const p of ["fontFamily","fontSize","fontWeight","fontStyle","fontStretch",
                       "fontKerning","fontFeatureSettings","fontVariationSettings",
                       "lineHeight","letterSpacing","wordSpacing","textTransform","textIndent",
                       "tabSize","paddingTop","paddingRight","paddingBottom","paddingLeft",
                       "borderTopWidth","borderRightWidth","borderBottomWidth","borderLeftWidth"])
        mirror.style[p] = cs[p];
      mirror.style.borderStyle = "solid";
      mirror.style.borderColor = "transparent";
      mirror.style.boxSizing = "border-box";
      mirror.style.width = parseFloat(cs.width) + "px";
      mirror.style.whiteSpace = "pre-wrap";
      mirror.style.wordWrap = "break-word";
      const typed = el.value.slice(0, el.selectionStart), rest = el.value.slice(el.selectionStart);
      mirror.textContent = typed;
      const mr = mirror.getBoundingClientRect();
      let kr, width = null;
      if (!rest && /\S$/.test(typed)){
        // at the end of a word a marker would weld onto it and wrap; the last
        // letter's right edge is the spot
        const rg = document.createRange();
        rg.setStart(mirror.firstChild, typed.length - 1);
        rg.setEnd(mirror.firstChild, typed.length);
        const rr = rg.getClientRects()[0] || rg.getBoundingClientRect();
        kr = { left: rr.right, top: rr.top };
      } else {
        const mark = h("span", null, rest || ".");
        mirror.appendChild(mark);
        kr = mark.getClientRects()[0] || mark.getBoundingClientRect();
        if (rest) width = advanceOf(mark.firstChild, 0);
      }
      const m = fmetrics(cs);
      return { x: r.left + kr.left - mr.left - el.scrollLeft,
               base: r.top + kr.top - mr.top - el.scrollTop + m.asc,
               fs: parseFloat(cs.fontSize), fbA: m.fbA, fbD: m.fbD, width, clip: r, title: false };
    }
    // the title: the caret's own spot, or the last letter's right edge where
    // the browser gives a caret at the end of the words no box
    function titleCaret(el){
      const sel = getSelection();
      if (!sel.rangeCount) return null;
      const rg = sel.getRangeAt(0);
      if (!el.contains(rg.startContainer)) return null;
      const cs = getComputedStyle(el), m = fmetrics(cs);
      const rr = [...rg.getClientRects()].find(q => q.height > 0);
      let x = rr ? rr.left : null, top = rr ? rr.top : null;
      const text = el.firstChild;
      if (x == null && text && text.nodeType === 3 && text.length){
        const end = document.createRange();
        end.setStart(text, text.length - 1);
        end.setEnd(text, text.length);
        const q = [...end.getClientRects()].pop();
        if (q){ x = q.right; top = q.top; }
      }
      if (x == null) return null;
      return { x, base: top + m.asc, fs: parseFloat(cs.fontSize), capH: m.capH, fbA: m.fbA, fbD: m.fbD,
               width: advanceOf(rg.startContainer, rg.startOffset), clip: el.getBoundingClientRect(), title: true };
    }

    let cur = null, raf = 0;
    function place(){
      raf = 0;
      if (!cur || !cur.isConnected || !cur.getClientRects().length){ hide(); return; }
      const field = cur.tagName === "TEXTAREA";
      const collapsed = field ? cur.selectionStart === cur.selectionEnd : getSelection().isCollapsed;
      if (!collapsed){ hide(); return; }   // a selection marks its own spot
      const c = field ? fieldCaret(cur) : titleCaret(cur);
      if (!c){ hide(); return; }
      const bw = c.width > 0 ? c.width : c.fs * 0.5;
      let bh, y;
      if (c.title){ bh = c.capH + 1; y = c.base - bh; }
      else { bh = c.fs * 1.1; y = c.base - c.fbA + (c.fbA + c.fbD - bh) / 2; }
      if (y + bh < c.clip.top - 1 || y > c.clip.bottom + 1){ hide(); return; }
      for (const cell of cells){
        cell.style.left = c.x + "px";
        cell.style.top = y + "px";
        cell.style.width = bw + "px";
        cell.style.height = bh + "px";
        cell.classList.add("on");
      }
    }
    const queue = () => { if (!raf) raf = requestAnimationFrame(place); };
    caretQueue = queue;
    document.addEventListener("focusin", e => {
      const target = e.target;
      const el = target && target.tagName === "TEXTAREA" ? target :
        (target && target.closest ? target.closest("[contenteditable]") : null);
      if (cur && cur !== el) cur.classList.remove("fc-hide");
      cur = el;
      if (cur) cur.classList.add("fc-hide");
      queue();
    });
    document.addEventListener("focusout", () => {
      if (cur) cur.classList.remove("fc-hide");
      cur = null;
      queue();
    });
    document.addEventListener("selectionchange", queue);
    document.addEventListener("input", queue, true);
    document.addEventListener("keyup", queue, true);
    document.addEventListener("scroll", queue, true);
    addEventListener("resize", queue);
    // the row moves when the sent panel over it comes and goes
    if (window.ResizeObserver){
      const ro = new ResizeObserver(queue);
      for (const card of cards) ro.observe(card.el.pendwrap);
    }
    if (document.fonts && document.fonts.addEventListener)
      document.fonts.addEventListener("loadingdone", queue);
  }

  addEventListener("resize", () => seatGhost(cards[at]));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => seatGhost(cards[at]));
  show(0);
})();
</script>
</body>
</html>
